<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111110">
<title>Reunião Semanal · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e;--ok:#2fae6a;--bad:#e66767;--warn:#c98500;--gold:#e8c547}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1280px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
h2{font-size:15px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2 .hint{font-weight:500;font-size:11.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:15px}
.c .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.c .v{font-size:27px;font-weight:800;margin-top:4px;line-height:1.1}
.c .d{font-size:12px;margin-top:4px;color:var(--text2)}
.up{color:var(--ok)}.dn{color:var(--bad)}.fl{color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--s1);border:1px solid var(--line);border-radius:13px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line)}
th{background:var(--s2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:var(--s2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--brand)}
.q{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:9px;padding:10px 13px;margin:7px 0;font-size:13.5px;color:var(--text2)}
.q b{color:var(--text)}
.q .m{color:var(--muted);font-size:11.5px;margin-top:3px}
.good{border-left-color:var(--ok)}
.pill{display:inline-block;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;margin:3px 4px 0 0}
.foco{background:linear-gradient(180deg,#1d1a1a,#1a1a19);border:1px solid #4a2b2b;border-radius:13px;padding:16px 18px}
.foco ol{margin:8px 0 0 20px}.foco li{margin:7px 0;font-size:14px}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:10px}
.load{color:var(--muted);padding:30px;text-align:center}
#gate{position:fixed;inset:0;background:var(--s0);z-index:99;display:flex;align-items:center;justify-content:center}
.gb{background:var(--s1);border:1px solid var(--line);border-radius:15px;padding:32px;width:320px;text-align:center}
.gb input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:11px;color:#fff;text-align:center;margin:14px 0 10px;font-size:15px}
.gb button{width:100%;background:var(--brand);border:none;color:#fff;border-radius:9px;padding:11px;font-weight:800;cursor:pointer}
@media print{body{background:#fff;color:#000}#gate{display:none}}
/* ---------- pauta da semana ---------- */
#pauta h2{margin-top:4px}
.ptnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.ptnav .lbl{font-weight:800;font-size:13.5px}
button.b[disabled]{opacity:.4;cursor:default}
.ptgrp{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:16px 0 6px}
.pti{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:11px;padding:11px 13px;margin:7px 0}
.pti.critico{border-left-color:var(--bad)}
.pti.atencao{border-left-color:var(--warn)}
.pti .t{font-weight:700;font-size:14px;margin-top:5px}
.pti .dt{color:var(--text2);font-size:12.5px;margin-top:3px}
.pti .fo{color:var(--muted);font-size:11.5px;margin-top:3px}
.selo{display:inline-block;border:1px solid var(--line);background:var(--s2);color:var(--text2);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:0 5px 0 0}
.selo.critico{background:#3a1c1c;border-color:#6b2f2f;color:#f0a0a0}
.selo.atencao{background:#2c2413;border-color:#5b4a22;color:#e6c675}
.selo.decidido{background:#14251c;border-color:#265239;color:#8fd6b0}
.ptd{border-top:1px dashed var(--line);margin-top:9px;padding-top:8px;display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text2)}
.ptd input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--ok);cursor:pointer}
.ptd.venc,.ptd.venc .fo,.ptd.venc b{color:var(--bad)}
.ptd .fo{color:var(--muted);font-size:11.5px;margin-top:2px}
.ptf{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.ptf input,.ptf select{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit}
.ptf input[type=date]{color-scheme:dark}
.ptf .g{flex:1;min-width:180px}
button.bx{background:#2a1a1a;border-color:#5a2f2f;color:#f0a0a0}
.ptvazio{background:var(--s1);border:1px dashed var(--line);border-radius:13px;padding:24px;text-align:center;color:var(--text2)}
@media print{.ptf,.ptnav button,.ptvazio button{display:none}}
/* ---------- combinados e folha da equipe (13/11/2026) ---------- */
.cbi{display:flex;gap:10px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:13.5px;color:var(--text2)}
.cbi b{color:var(--text)}
.cbi input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--ok);cursor:pointer}
.cbi .cbx{font-size:16px;line-height:1.2}
.cbi .fo{color:var(--muted);font-size:11.5px;margin-top:3px}
.cbi.venc{border-left-color:var(--bad)}
.cbi.venc .fo{color:var(--bad)}
.tw{overflow-x:auto;border-radius:13px}
.tw table{min-width:520px}
.linhas{margin-top:16px;background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px}
.linhas .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.linhas .ln{border-bottom:1px solid var(--line);height:30px}
@media print{
  :root{--s0:#fff;--s1:#fff;--s2:#f2f2f2;--line:#bbb;--text:#000;--text2:#222;--muted:#555}
  .top .rt,.cbform,.cbi button{display:none}
  body{padding:0;font-size:13px}
  h2{margin-top:16px}
  .foco{background:#fff}
  .aviso{background:#fff;color:#000;border-color:#bbb}
  .selo,.selo.critico,.selo.atencao,.selo.decidido{background:#fff;color:#000;border-color:#999}
  .c,.q,.cbi,table{break-inside:avoid}
}
</style>
</head>
<body>

<div class="top">
  <div><h1 id="titulo">📊 Reunião Semanal</h1><div class="sub" id="periodo">carregando…</div></div>
  <div class="rt">
    <span id="lojas"></span>
    <select id="semana" onchange="render()"></select>
    <button class="b" id="bmodo" onclick="trocaModo()">📄 Folha da equipe</button>
    <button class="b" onclick="location.reload()">↻ Atualizar</button>
    <button class="b" onclick="window.print()">🖨 Imprimir</button>
  </div>
</div>
<div id="app"><div class="load">Carregando os dados da semana…</div></div>
<div id="pauta"><div class="load">Carregando a pauta…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const TODAS=['Água Verde','Ahú','São Braz'];
let LOJA='Todas';
let UNI=TODAS.slice();
function setLoja(u){LOJA=u;UNI=(u==='Todas')?TODAS.slice():[u];render();}
const $=i=>document.getElementById(i);
/* ===== porta unica do portal: sessao por usuario ===== */
const CDMMODS=['reuniao'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmTem(id){try{const l=JSON.parse(sessionStorage.getItem('cdm_modulos')||'[]');return Array.isArray(l)&&l.some(function(m){return m&&m.id===id})}catch(e){return false}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/rpc/portal_eu',{method:'POST',headers:{apikey:'sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV',Authorization:'Bearer sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV','Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'reuniao'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  try{sessionStorage.setItem('cdm_nome',j.nome||'');sessionStorage.setItem('cdm_admin',j.admin?'1':'0');sessionStorage.setItem('cdm_modulos',JSON.stringify(ms))}catch(e){}
  if(!j.admin&&!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}

/* ---------- semanas (segunda a domingo, fechadas) ---------- */
const iso=d=>d.toISOString().slice(0,10);
function segunda(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x}
function semanas(n){const out=[];let s=segunda(new Date());s.setDate(s.getDate()-7);
  for(let i=0;i<n;i++){const ini=new Date(s);ini.setDate(ini.getDate()-7*i);const fim=new Date(ini);fim.setDate(fim.getDate()+6);
    out.push({ini:iso(ini),fim:iso(fim),rot:br(ini)+' a '+br(fim)})}
  return out}
const br=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
const brs=s=>s.slice(8,10)+'/'+s.slice(5,7);

/* ---------- categorias de restaurante ---------- */
const CATS=[
 {id:'frio', ic:'🥶', nome:'Chegou frio',            re:/\bfri[ao]s?\b|gelad|sem estar quente|morn[ao]/i},
 {id:'ponto',ic:'🔥', nome:'Ponto da carne / cru / queimado', re:/\bcru[ao]?s?\b|mal ?passad|queimad|torrad|ressecad|duro/i},
 {id:'sabor',ic:'🧂', nome:'Sabor e tempero',        re:/sem (gosto|sabor|tempero|molho)|sem sal|salgad|azed|insosso|não (agrad|estava bom)|ruim|horr[íi]vel|estranho|não (é|era) o mesmo|sem graça/i},
 /* 13/10/2026 (chat-errado-pedido-alejo-13-10): 'esqueceram o hambúrguer na chapa' é preparo, não item faltando — 'esqueceram' seguido de chapa/forno/geladeira não conta aqui */
 {id:'falta',ic:'🥡', nome:'Faltou item / veio errado', re:/faltou|não veio|nao veio|veio errad|pedido errad|troca(ram|do)|incomplet|esqueceram(?![^.,;!?]{0,40}\b(na|no) (chapa|forno|fogo|fritadeira|grelha|geladeira|freezer|estufa))|sem (a|o) (batata|bebida|refri|molho|sobremesa)/i},
 {id:'valid',ic:'🧼', nome:'Validade, cheiro e higiene', re:/podre|estragad|cheiro|azedo|mofo|cabelo|inseto|mosca|sujo|espuma|vencid|impr[óo]pri/i},
 {id:'porcao',ic:'📉',nome:'Porção pequena / não bate com a foto', re:/pequen|pouc[ao]|diferente da foto|nada a ver com a foto|pouco (recheio|molho|queijo)|só pão/i},
 {id:'embal',ic:'📦', nome:'Embalagem / derramou',   re:/derram|vazou|virad|amassad|embalagem|revirad|violad/i},
 {id:'demora',ic:'🕐',nome:'Demora e atraso',        re:/atras|demor|tard|esperei|1 ?hora|hora e meia/i},
 {id:'atend',ic:'🙎', nome:'Atendimento',            re:/atendiment|atendente|educ|grosser|mal ?educ|recusaram|resposta|ignorar|descaso|mentiros/i}
];
const MOTIVO_RESP={
 'PARTE DO ITEM OU INTEGRANTE DE UM GRUPO NÃO FOI ENVIADO':'Cozinha / Expedição',
 'PEDIDO OU ITEM VEIO ERRADO':'Cozinha / Expedição',
 'O PEDIDO ESTÁ ERRADO OU INCOMPLETO':'Cozinha / Expedição',
 /* 13/10/2026 (chat-errado-pedido-alejo-13-10): cupom e informação que faltou são do cliente (como na cancelados_base), não da cozinha */
 'FALTOU INSERIR INFORMAÇÕES NO PEDIDO':'Cliente / cupom ou informação',
 'FALTOU ADICIONAR O CUPOM':'Cliente / cupom ou informação',
 'PEDIDO IMPRÓPRIO PARA CONSUMO/USO':'Qualidade da comida',
 'CANCELAMENTO EXCEPCIONAL POR CARACTERÍSTICA DE QUALIDADE':'Qualidade da comida',
 'O PEDIDO VEIO REVIRADO/VIOLADO':'Embalagem / transporte',
 'PEDIDO CANCELADO POR ATRASO COM ALERTA PARA LOJA':'Atraso na entrega',
 'ITEM INDISPONÍVEL':'Estoque / cardápio',
 'O ENDEREÇO ESTÁ INCOMPLETO E O CLIENTE NÃO ATENDE':'Cliente / endereço',
 'NINGUÉM PODERÁ RECEBER O PEDIDO':'Cliente / endereço',
 'CLIENTE NÃO LOCALIZADO':'Cliente / endereço',
 'SOLICITADO PARA O LOCAL ERRADO':'Cliente / endereço',
 'PROBLEMA COM PAGAMENTO DO CLIENTE':'Cliente / pagamento',
 'A FORMA DE PAGAMENTO ESTÁ ERRADA':'Cliente / pagamento',
 'A LOJA ESTÁ PASSANDO POR DIFICULDADES INTERNAS':'Loja / sistema',
 'PROBLEMAS DE SISTEMA NA LOJA':'Loja / sistema',
 'O PEDIDO NÃO FOI CONFIRMADO PELA LOJA':'Loja / sistema',
 'O PEDIDO NÃO FOI ENVIADO PARA A LOJA':'Loja / sistema',
 'A LOJA ESTÁ SEM ENTREGADORES DISPONÍVEIS':'Entrega'
};
const resp=m=>MOTIVO_RESP[(m||'').toUpperCase().trim()]||'Outros';

/* ---------- dados ---------- */
let D={},LOJAS={},SEM=[];
const get=(t,q)=>fetch(SB+t+'?'+q,{headers:H}).then(r=>r.ok?r.json():[]).catch(()=>[]);
async function boot(){
  SEM=semanas(8);
  $('semana').innerHTML=SEM.map((s,i)=>`<option value="${i}">${s.rot}${i===0?' (última fechada)':''}</option>`).join('');
  const lojas=await get('ifood_dim_loja','select=id_loja,unidade,nome&limit=200');
  lojas.forEach(l=>LOJAS[l.id_loja]=l.unidade);
  pautaBoot();
  await carrega();
  render();
}
async function carrega(){
  const ini=SEM[SEM.length-1].ini, fim=SEM[0].fim;
  const [av,ca,ne,qp,ss,go,es,ev]=await Promise.all([
    get('ifood_fato_avaliacao','select=id_loja,nota,tags,comentario,data_avaliacao&data_avaliacao=gte.'+ini+'&data_avaliacao=lte.'+fim+'&limit=10000'),
    get('ifood_fato_cancelamento','select=id_loja,data,motivo,status_pedido,valor_cancelamento&data=gte.'+ini+'&data=lte.'+fim+'&limit=10000'),
    get('ifood_fato_negociacao','select=id_loja,data,motivo,cancelamento_evitado,valor_reembolso&data=gte.'+ini+'&data=lte.'+fim+'&limit=10000'),
    get('ifood_fato_qualidade_periodo','select=id_loja,periodo_inicio,periodo_fim,pedidos_totais,pct_cancelamentos_super,pct_negociacoes_super,media_avaliacoes,qtd_avaliacoes,tempo_medio_preparo_min&periodo_inicio=gte.'+ini+'&limit=5000'),
    get('ifood_fato_super_status','select=id_loja,nome,e_super,status,nivel,tipo,media_avaliacoes,pct_cancelamento,pct_chamados,referencia&order=referencia.desc&limit=500'),
    get('google_fato_avaliacao','select=unidade,nota,num_avaliacoes,data_coleta&order=data_coleta.desc&limit=200'),
    get('fato_espelho_dia','select=unidade,data,categoria,nivel&data=gte.'+ini+'&data=lte.'+fim+'&ativo=eq.true&limit=10000'),
    get('fato_evento','select=unidade,data,tipo&data=gte.'+ini+'&data=lte.'+fim+'&limit=5000')
  ]);
  D={av,ca,ne,qp,ss,go,es,ev};
}
const naSemana=(arr,campo,s)=>arr.filter(r=>r[campo]>=s.ini&&r[campo]<=s.fim&&UNI.includes(LOJAS[r.id_loja]||r.unidade));
const delta=(a,b)=>{if(b===null||b===undefined||b===0&&a===0)return '<span class="fl">—</span>';
  const d=a-b;const p=b?(d/b*100):null;const cls=d>0?'up':d<0?'dn':'fl';const sig=d>0?'▲':d<0?'▼':'—';
  return `<span class="${cls}">${sig} ${Math.abs(d).toFixed(Math.abs(d)%1?1:0)}${p!==null?' ('+(p>0?'+':'')+p.toFixed(0)+'%)':''}</span>`}
const deltaInv=(a,b)=>{if(b===null||b===undefined)return '<span class="fl">—</span>';
  const d=a-b;const cls=d>0?'dn':d<0?'up':'fl';const sig=d>0?'▲':d<0?'▼':'—';
  return `<span class="${cls}">${sig} ${Math.abs(d).toFixed(Math.abs(d)%1?1:0)}</span>`}

function classifica(rows){
  const m={};CATS.forEach(c=>m[c.id]={...c,n:0,ex:[]});
  rows.forEach(r=>{const t=r.comentario||'';if(!t)return;
    CATS.forEach(c=>{if(c.re.test(t)){m[c.id].n++;if(m[c.id].ex.length<3)m[c.id].ex.push(r)}})});
  return Object.values(m).sort((a,b)=>b.n-a.n)}

/* ---------- porta da semana: números por loja + data de cada fonte (13/11/2026) ---------- */
let RS={},CB={},MODO='gerentes',CMSG='';
const TEMAS=[['iFood','Cliente / iFood'],['Delivery','Tempo e entrega'],['RH','Equipe'],['Salão','Salão'],['Google','Google'],['Financeiro','Dinheiro'],['Outro','Outro']];
const temaNome=t=>{const x=TEMAS.find(a=>a[0]===t);return x?x[1]:(t||'Outro')};
/* área que cuida de cada assunto de reclamação — leitura do Claude em 13/11/2026, o Fábio pode corrigir */
const AREA={frio:'Expedição / entrega',ponto:'Chapa',sabor:'Cozinha',falta:'Expedição',valid:'Cozinha',porcao:'Cozinha',embal:'Expedição',demora:'Cozinha / entrega',atend:'Atendimento'};
const hojeLocal=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const semRS=t=>String(t||'').replace(/R\$\s?\d[\d.,]*/gi,'R$ —');
async function rpc(fn,body){
  const r=await fetch(SB+'rpc/'+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){
    if(j&&j.code==='28000'){cdmSaia('Sua sessão venceu. Entre de novo no portal.');throw new Error('Sessão vencida.')}
    throw new Error((j&&j.message)||('erro '+r.status));
  }
  return j;
}
async function semDados(ini){
  if(RS[ini])return RS[ini];
  try{const j=await rpc('reuniao_semana',{p_token:cdmTok(),p_dados:{semana:ini}});if(j&&j.lojas){RS[ini]=j;return j}return {erro:'resposta vazia',lojas:[],fontes:{}}}
  catch(e){return {erro:e.message,lojas:[],fontes:{}}}
}
const getOuNull=(t,q)=>fetch(SB+t+'?'+q,{headers:H}).then(r=>r.ok?r.json():null).catch(()=>null);
async function combLoad(ini){
  const prox=maisDias(ini,7);
  const pt=await getOuNull('reuniao_pauta','select=id,semana,categoria,titulo,detalhe&fonte=eq.combinado&semana=in.('+ini+','+prox+')&order=id.asc&limit=300');
  if(!pt)return {erro:true,ant:[],novos:[]};
  const ids=pt.map(r=>r.id);
  const dc=ids.length?await getOuNull('reuniao_decisao','select=id,pauta_id,responsavel,prazo,concluido&pauta_id=in.('+ids.join(',')+')&limit=300'):[];
  if(!dc)return {erro:true,ant:[],novos:[]};

  CB[ini]={ant:all.filter(c=>c.semana===ini),novos:all.filter(c=>c.semana===prox)};
  return CB[ini];
}
/* cobertura de uma fonte na semana: ok = cobre a semana inteira · parcial = só parte · sem = nada da semana · ? = data não lida */
const fonteAte=(X,k)=>(X&&X.fontes&&X.fontes[k])||null;
function cobre(X,k,S){const u=fonteAte(X,k);if(!u)return '?';return u>=S.fim?'ok':u>=S.ini?'parcial':'sem'}
const vale=(X,k,S)=>cobre(X,k,S)!=='sem';
function carimbo(X,k,S){const u=fonteAte(X,k),c=cobre(X,k,S);
  if(c==='?')return '<span class="selo atencao">data da fonte não lida</span>';
  if(c==='sem')return '<span class="selo critico">parado desde '+brs(u)+'</span>';
  if(c==='parcial')return '<span class="selo atencao">só tem dado até '+brs(u)+'</span>';
  return '<span class="selo">dado até '+brs(u)+'</span>'}
const tz=v=>(v===null||v===undefined)?'<span class="fl">—</span>':v;
const dl=(a,b)=>(a===null||a===undefined)?'':delta(+a,(b===null||b===undefined)?null:+b);
const dli=(a,b)=>(a===null||a===undefined)?'':deltaInv(+a,(b===null||b===undefined)?null:+b);
const pct1=(a,b)=>b?(a/b*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':'—';
const varp=v=>(v===null||v===undefined||isNaN(v))?'<span class="fl">—</span>':'<span class="'+(v>0?'up':v<0?'dn':'fl')+'">'+(v>0?'▲ +':v<0?'▼ ':'')+v+'%</span>';
/* dinheiro: só chega da porta para o dono; nunca passa pelo delta() */
const rolavel=h=>h.replace(/<table/g,'<div class="tw"><table').replace(/<\/table>/g,'</table></div>');
const rs=v=>(v===null||v===undefined)?'—':'R$ '+Math.round(+v).toLocaleString('pt-BR');

  MODO=(MODO==='equipe')?'gerentes':'equipe';
  if(MODO==='equipe'&&LOJA==='Todas'){LOJA=TODAS[0];UNI=[LOJA]}
  render();
}
function combItem(c,o){
  const venc=!c.feito&&c.prazo&&c.prazo<hojeLocal();
  let h='<div class="cbi'+(venc?' venc':'')+'">';
  h+=(o.check&&c.did)?'<input type="checkbox" '+(c.feito?'checked':'')+' onchange="combFeito('+c.did+',this.checked,this)" title="Marcar como feito">'
    :'<span class="cbx">'+(o.status?(c.feito?'✅':'⬜'):'▢')+'</span>';
  h+='<div style="flex:1"><b>'+pEsc(c.texto)+'</b><div class="fo">'+pEsc(c.loja==='Todas'?'todas as lojas':c.loja)+' · '+pEsc(temaNome(c.tema))
    +' · '+(c.dono?'👤 '+pEsc(c.dono):'sem dono')+' · '+(c.prazo?'📅 até '+brs(c.prazo)+(venc?' · vencido':''):'sem prazo')
    +((o.status||o.check)?(c.feito?' · feito':' · não feito'):'')+'</div>'+(o.ind?'<div class="fo">'+o.ind+'</div>':'')+'</div>';
  if(o.del)h+='<button class="b bx" onclick="combApagar('+c.pid+',this)" title="Apagar este combinado">🗑</button>';

}
async function combAcao(el,acao,dados){
  const S=SEM[+$('semana').value||0];
  if(el)el.disabled=true;
  try{await rpc('reuniao_combinado',{p_token:cdmTok(),p_acao:acao,p_dados:dados});CMSG='';delete CB[S.ini]}
  catch(e){CMSG='Não deu para gravar: '+e.message}
  render();
}
function combCriar(b){
  const S=SEM[+$('semana').value||0],t=($('cbtx').value||'').trim();
  if(!t){CMSG='Escreva o combinado antes de gravar.';render();return}
  combAcao(b,'criar',{semana:maisDias(S.ini,7),unidade:$('cblj').value,tema:$('cbtm').value,combinado:t,dono:($('cbdn').value||'').trim()||null,prazo:$('cbpz').value||null});
}
function combFeito(did,v,el){combAcao(el,'feito',{decisao_id:did,feito:v})}
function combApagar(pid,b){if(confirm('Apagar este combinado?'))combAcao(b,'apagar',{pauta_id:pid})}

  /* de quem foi o problema: só quando a fonte do motivo tem dado da semana */
  const temMot=(vale(X,'cancel_motivo',S)||vale(X,'chamados',S))&&!X.erro;
  const causas={};[...C,...N].forEach(r=>{const k=resp(r.motivo);causas[k]=(causas[k]||0)+1});

  else h+='<div class="aviso">Motivo dos cancelamentos '+carimbo(X,'cancel_motivo',S)+' · chamados do iFood '+carimbo(X,'chamados',S)+' — sem essas duas fontes não dá para dizer de quem foi o problema nesta semana.</div>';

  h+='<h2>4 · ⏱ Tempo de preparo '+carimbo(X,'preparo',S)+'</h2>';
  if(vale(X,'preparo',S)&&!X.erro){
    h+='<table><tr><th>Unidade</th><th class="n">Preparo médio</th><th class="n">Semana anterior</th><th class="n">Diferença</th></tr>';
    UNI.forEach(u=>{const l=XL(u);h+='<tr><td><b>'+u+'</b></td><td class="n">'+(l.preparo_min!=null?String(l.preparo_min).replace('.',',')+' min':'—')+'</td><td class="n">'+(l.preparo_min_ant!=null?String(l.preparo_min_ant).replace('.',',')+' min':'—')+'</td><td class="n">'+dli(l.preparo_min,l.preparo_min_ant)+'</td></tr>'});
    h+='</table>';
  }
  h+='<div class="aviso">Atraso de entrega por motoboy: '+carimbo(X,'atraso',S)+'</div>';

  /* --- 5. dinheiro jogado fora --- */

  else{
    const acao=E.filter(r=>r.nivel==='ACAO').length, conf=E.filter(r=>r.nivel==='CONFERIR').length, ok=E.filter(r=>r.nivel==='OK').length;
    h+='<div class="cards">';
    h+=card('Dias-funcionário analisados',E.length,'em '+new Set(E.map(r=>r.data)).size+' dia(s) com registro');
    h+=card('Tudo certo',ok,E.length?(ok/E.length*100).toFixed(0)+'% dos registros':'');
    h+=card('Precisa conferir',conf,'escala ou horário divergente');
    h+=card('Exige ação',acao,'intervalo, hora extra ou marcação faltando · '+deltaInv(acao,P?Ep.filter(r=>r.nivel==='ACAO').length:null));
    const at=V.filter(r=>r.tipo==='ATESTADO').length, ad=V.filter(r=>r.tipo==='ADVERTENCIA').length;
    h+=card('Atestados',at,'entregues na semana');
    h+=card('Advertências',ad,ad?'formalizadas':'nenhuma registrada');
    h+='</div>';
    h+='<table style="margin-top:12px"><tr><th>Unidade</th><th class="n">Registros</th><th class="n">Conferir</th><th class="n">Ação</th></tr>';
    UNI.forEach(u=>{const e=E.filter(r=>r.unidade===u);
      h+='<tr><td><b>'+u+'</b></td><td class="n">'+e.length+'</td><td class="n">'+e.filter(r=>r.nivel==='CONFERIR').length+'</td><td class="n">'+e.filter(r=>r.nivel==='ACAO').length+'</td></tr>'});

    const dias=new Set(E.map(r=>r.data)).size;
    if(dias<7)h+='<div class="aviso">Cobertura parcial: só '+dias+' de 7 dias desta semana têm ponto carregado. Os números de equipe são um retrato incompleto.</div>';
  }

  /* --- 7. casa --- */
  h+='<h2>7 · 🔧 Casa: manutenção <span class="hint">último chamado aberto em '+(fonteAte(X,'manutencao')?brs(fonteAte(X,'manutencao')):'—')+'</span></h2>';

    UNI.forEach(u=>{const l=XL(u);h+='<tr><td><b>'+u+'</b></td><td class="n"><b>'+(l.manut_abertos||0)+'</b></td><td class="n">'+(l.manut_novos||0)+'</td><td class="n">'+(l.manut_resolvidos||0)+'</td></tr>'});
    h+='</table>';
  }

  /* --- 8. acertos --- */
  h+='<h2>8 · 🏆 O que a equipe acertou</h2>';
  if(temAval){
    h+='<div class="cards"><div class="c"><div class="k">Avaliações 5 estrelas</div><div class="v" style="color:var(--ok)">'+bons.length+'</div><div class="d">'+(A.length?(bons.length/A.length*100).toFixed(0)+'% de tudo que recebemos':'—')+'</div></div>';

    bons.filter(r=>(r.comentario||'').length>25).slice(0,2).forEach(r=>{h+='<div class="q good">“'+pEsc(semRS(r.comentario).slice(0,220))+'”<div class="m">'+(LOJAS[r.id_loja]||'—')+' · ★★★★★ · '+brs(r.data_avaliacao)+'</div></div>'});
  }else h+='<div class="aviso">Avaliações do iFood: '+carimbo(X,'avaliacao',S)+'</div>';

  /* --- 9. focos e combinados --- */
  h+='<h2>9 · 🎯 Focos e combinados desta reunião <span class="hint">cada combinado com dono e prazo · eles abrem a reunião da semana que vem</span></h2>';
  const piores=cat.filter(c=>c.n>0).map(c=>({...c,dif:c.n-(mapP[c.id]||0)})).sort((a,b)=>(b.dif-a.dif)||(b.n-a.n)).slice(0,3);
  if(temAval&&piores.length){h+='<div class="foco"><div class="k" style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Sugestão dos dados: as 3 reclamações que mais cresceram ou mais pesaram</div><ol>';
    piores.forEach(c=>{h+='<li><b>'+c.ic+' '+c.nome+'</b> — '+c.n+' reclamaç'+(c.n===1?'ão':'ões')+' '+(c.dif>0?'<span class="dn">(+'+c.dif+' vs semana passada)</span>':c.dif<0?'<span class="up">('+c.dif+' vs semana passada)</span>':'')+' <span class="fl">· '+(AREA[c.id]||'')+'</span></li>'});
    h+='</ol></div>'}
  const nv=cb.novos.filter(daLoja);
  h+='<div style="margin-top:12px">'+(nv.length?nv.map(c=>combItem(c,{del:true})).join(''):(cb.erro?'':'<div class="ptvazio">Nenhum combinado registrado ainda nesta reunião.</div>'))+'</div>';
  if(CMSG)h+='<div class="aviso">'+pEsc(CMSG)+'</div>';
  h+='<div class="pti cbform"><div class="ptf"><select id="cblj" title="Loja">'+['Todas'].concat(TODAS).map(u=>'<option value="'+u+'"'+(u===LOJA?' selected':'')+'>'+(u==='Todas'?'Todas as lojas':u)+'</option>').join('')+'</select>'
    +'<select id="cbtm" title="Tema">'+TEMAS.map(t=>'<option value="'+t[0]+'">'+t[1]+'</option>').join('')+'</select>'
    +'<input class="g" id="cbtx" placeholder="O que fica combinado…" maxlength="300"></div>'
    +'<div class="ptf"><input id="cbdn" placeholder="Dono (quem responde)" style="width:190px" maxlength="60"><input type="date" id="cbpz" title="Prazo">'
    +'<button class="b" onclick="combCriar(this)">✔ Gravar combinado</button></div></div>';

  /* --- anexos --- */
  const gU={};D.go.forEach(g=>{(gU[g.unidade]=gU[g.unidade]||[]).push(g)});
  const gl=Object.keys(gU).filter(u=>UNI.includes(u));
  if(gl.length){h+='<h2>🗺 Reputação no Google</h2><table><tr><th>Unidade</th><th class="n">Nota</th><th class="n">Avaliações</th><th>Última coleta</th></tr>';
    gl.forEach(u=>{const a=gU[u][0],b=gU[u][1];
      h+='<tr><td><b>'+u+'</b></td><td class="n">'+a.nota+' '+(b?delta(+a.nota,+b.nota):'')+'</td><td class="n">'+(a.num_avaliacoes||0).toLocaleString('pt-BR')+' '+(b?delta(a.num_avaliacoes,b.num_avaliacoes):'')+'</td><td>'+brs(a.data_coleta)+'</td></tr>'});
    h+='</table>'}
  /* selo super: cada import do iFood grava um novo ciclo; ficamos só com o mais recente de cada tipo por loja (D.ss já vem ordenado por referencia desc) */
  const ssAtual={},ssProx={};
  D.ss.forEach(s=>{if(!UNI.includes(LOJAS[s.id_loja]))return;
    if(s.tipo==='nivel_atual'&&!ssAtual[s.id_loja])ssAtual[s.id_loja]=s;

  const fmtPct=v=>v==null?'—':(v*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
  const ssPill=x=>!x?'<span class="fl">—</span>':x.e_super?'<b style="color:var(--gold)">🏆 SUPER</b>':(x.nivel!=null?'Nível '+x.nivel:(x.status||'—'));
  if(ss.length){const us=fonteAte(X,'selo');
    h+='<h2>⭐ Selo Super <span class="hint">status oficial do iFood por loja</span> '+(us?'<span class="selo '+(us<S.ini?'critico':'')+'">última foto do selo: '+brs(us)+'</span>':'<span class="selo atencao">data da fonte não lida</span>')+'</h2><table><tr><th>Loja</th><th>Status</th><th>Próx. ciclo</th><th class="n">Nota</th><th class="n">% cancel.</th><th class="n">% chamados</th></tr>';
    ss.forEach(s=>{const p=ssProx[s.id_loja];
      const seta=p&&s.nivel!=null&&p.nivel!=null?(p.nivel>s.nivel?' <span class="up">▲</span>':p.nivel<s.nivel?' <span class="dn">▼</span>':''):'';
      h+='<tr><td>'+(s.nome||'—')+'<div class="m" style="color:var(--muted);font-size:11px">'+(LOJAS[s.id_loja]||'')+'</div></td><td>'+ssPill(s)+'</td><td>'+ssPill(p)+seta+'</td><td class="n">'+(s.media_avaliacoes??'—')+'</td><td class="n">'+fmtPct(s.pct_cancelamento)+'</td><td class="n">'+fmtPct(s.pct_chamados)+'</td></tr>'});
    h+='</table>'}
  if(X.lido_em)h+='<div class="sub" style="margin-top:18px">Números por loja lidos do banco em '+pEsc(X.lido_em)+'.</div>';
  $('app').innerHTML=rolavel(h);
}
/* ---------- pauta da semana ---------- */
const PWK='cdm_reuniao_pw';
const CATP=['Delivery','RH','iFood','Google','Salão','Financeiro','Outro'];
const GRAV={critico:0,atencao:1,info:2};
const GRN={critico:'crítico',atencao:'atenção',info:'info'};
const ORN={auto:'auto',manual:'manual',pendencia:'pendência'};
let PSEM='',PT=[],PD=[],PMSG='';
const pwPauta=()=>sessionStorage.getItem(PWK)||sessionStorage.getItem('cdm_moto_pw')||'';
const pEsc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const semAtual=()=>iso(segunda(new Date()));
const maisDias=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
function pSem(n){PSEM=maisDias(PSEM,7*n);$('pauta').innerHTML='<div class="load">Carregando a pauta…</div>';pautaLoad()}
function pautaBoot(){PSEM=semAtual();pautaLoad()}
async function pautaLoad(){
  PMSG='';
  PT=await get('reuniao_pauta','select=id,semana,ordem,origem,categoria,titulo,detalhe,fonte,gravidade,status&semana=eq.'+PSEM+'&order=ordem.asc&limit=500');
  PT=PT.filter(r=>r.fonte!=='combinado');   /* combinados aparecem nos blocos 1 e 9 */
  const ids=PT.map(r=>r.id);
  PD=ids.length?await get('reuniao_decisao','select=id,pauta_id,decisao,responsavel,prazo,concluido&pauta_id=in.('+ids.join(',')+')&order=id.asc&limit=500'):[];
  pautaRender();
}
function pautaRender(){
  const hj=iso(new Date()), pw=pwPauta(), fim=maisDias(PSEM,6), atual=semAtual();
  const abertos=PT.filter(i=>i.status==='aberto').length;
  const crits=PT.filter(i=>i.gravidade==='critico').length;
  const venc=PD.filter(d=>!d.concluido&&d.prazo&&d.prazo<hj).length;
  let h=`<h2>🗒 Pauta detalhada da semana <span class="hint">itens automáticos e escritos à mão · apoio da reunião dos gerentes</span></h2>`;
  h+=`<div class="ptnav"><button class="b" onclick="pSem(-1)">‹ semana anterior</button>`
   +`<span class="lbl">${brs(PSEM)} a ${brs(fim)}${PSEM===atual?' · semana corrente':''}</span>`
   +`<button class="b" onclick="pSem(1)"${PSEM>=atual?' disabled':''}>próxima semana ›</button>`
   +`<button class="b" onclick="pautaGerar(this)" title="Relê os dados e recria só os itens automáticos. Pode rodar quantas vezes quiser: é idempotente e não apaga o que foi escrito à mão.">⟳ Atualizar pauta dos dados</button></div>`;
  h+=`<div class="cards">`+card('Itens abertos',abertos,`${PT.length} ${PT.length===1?'item':'itens'} na semana`)
   +card('Críticos',crits,crits?'olhar primeiro':'nenhum item crítico')
   +card('Pendências vencidas',venc,venc?'decisão com prazo estourado':'nada vencido')+`</div>`;
  if(PMSG)h+=`<div class="aviso">${pEsc(PMSG)}</div>`;
  if(!pw)h+=`<div class="aviso">Para registrar decisões e acrescentar itens, digite a senha do escritório: <input type="password" id="ptpw" style="background:var(--s2);border:1px solid var(--line);color:#fff;border-radius:8px;padding:6px 9px;margin:0 6px;max-width:150px"> <button class="b" onclick="pautaPw()">Liberar edição</button></div>`;
  if(!PT.length){
    h+=`<div class="ptvazio"><div style="font-size:15px;font-weight:700;margin-bottom:6px">Nenhum item nesta semana</div>`
     +`<div style="font-size:12.5px;margin-bottom:13px">A pauta automática lê o delivery, o ponto e o iFood. Rodar de novo é seguro: não apaga o que foi escrito à mão.</div>`
     +`<button class="b" onclick="pautaGerar(this)">⟳ Gerar a pauta dos dados</button></div>`;
  }else{
    const ord=PT.slice().sort((a,b)=>(+a.ordem||0)-(+b.ordem||0)||((GRAV[a.gravidade]===undefined?9:GRAV[a.gravidade])-(GRAV[b.gravidade]===undefined?9:GRAV[b.gravidade])));
    const ci=c=>{const k=CATP.indexOf(c);return k<0?99:k};
    const cats=[];ord.forEach(i=>{if(cats.indexOf(i.categoria)<0)cats.push(i.categoria)});
    cats.sort((a,b)=>ci(a)-ci(b));
    cats.forEach(c=>{
      const itens=ord.filter(i=>i.categoria===c);
      h+=`<div class="ptgrp">${pEsc(c)} · ${itens.length} ${itens.length===1?'item':'itens'}</div>`;
      itens.forEach(i=>{h+=pautaItem(i,pw,hj)});
    });
  }
  if(pw)h+=pautaNovo();
  $('pauta').innerHTML=h;
}
function pautaItem(i,pw,hj){
  let h=`<div class="pti ${i.gravidade}">`;
  h+=`<div><span class="selo ${i.gravidade}">${GRN[i.gravidade]||i.gravidade}</span><span class="selo">${ORN[i.origem]||i.origem}</span>`
   +(i.status&&i.status!=='aberto'?`<span class="selo ${i.status==='decidido'?'decidido':''}">${pEsc(i.status)}</span>`:'')+`</div>`;
  h+=`<div class="t">${pEsc(i.titulo)}</div>`;
  if(i.detalhe)h+=`<div class="dt">${pEsc(i.detalhe)}</div>`;
  if(i.fonte)h+=`<div class="fo">fonte: ${pEsc(i.fonte)}</div>`;
  PD.filter(d=>d.pauta_id===i.id).forEach(d=>{
    const at=!d.concluido&&d.prazo&&d.prazo<hj;
    h+=`<div class="ptd${at?' venc':''}"><input type="checkbox" ${d.concluido?'checked':''}${pw?'':' disabled'} onchange="pautaConcluir(${d.id},this.checked,this)">`
     +`<div><b>${pEsc(d.decisao)}</b><div class="fo">${d.responsavel?'👤 '+pEsc(d.responsavel):'sem responsável'}${d.prazo?' · 📅 '+brs(d.prazo)+(at?' · vencido':''):' · sem prazo'}${d.concluido?' · ✅ concluído':''}</div></div></div>`;
  });
  if(pw){
    h+=`<div class="ptf"><input class="g" id="dc${i.id}" placeholder="Decisão tomada…" maxlength="300">`
     +`<input id="dr${i.id}" placeholder="Responsável" style="width:140px" maxlength="60">`
     +`<input type="date" id="dp${i.id}" title="Prazo">`
     +`<button class="b" onclick="pautaDecidir(${i.id},this)">✔ Registrar decisão</button>`
     +`<select onchange="pautaStatus(${i.id},this.value,this)" title="Situação do item">`
     +['aberto','discutido','decidido','adiado'].map(s=>`<option value="${s}"${s===i.status?' selected':''}>${s}</option>`).join('')
     +`</select>`
     +(i.origem==='manual'?`<button class="b bx" onclick="pautaApagar(${i.id},this)" title="Apagar este item manual">🗑</button>`:'')
     +`</div>`;
  }
  return h+`</div>`;
}
function pautaNovo(){
  return `<div class="ptgrp">Acrescentar item à mão</div><div class="pti">`
   +`<div class="ptf"><select id="nvcat">${CATP.map(c=>`<option>${c}</option>`).join('')}</select>`
   +`<input class="g" id="nvtit" placeholder="Título do item" maxlength="200">`
   +`<select id="nvgr"><option value="info">info</option><option value="atencao">atenção</option><option value="critico">crítico</option></select></div>`
   +`<div class="ptf"><input class="g" id="nvdet" placeholder="Detalhe (opcional)" maxlength="400">`
   +`<button class="b" onclick="pautaAdd(this)">+ Acrescentar item</button></div></div>`;
}
async function pSalvar(acao,dados){
  const pw=pwPauta();
  if(!pw)throw new Error('Digite a senha do escritório para gravar.');
  const r=await fetch(SB+'rpc/reuniao_salvar',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({p_senha:pw,p_acao:acao,p_dados:dados})});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){
    if(j&&j.code==='28000'){sessionStorage.removeItem(PWK);throw new Error('Senha incorreta. Digite de novo.')}
    throw new Error((j&&(j.message||j.hint))||('Não deu para salvar (erro '+r.status+').'));
  }
  return j;
}
async function pAcao(btn,acao,dados){
  const t=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='…'}
  try{await pSalvar(acao,dados);await pautaLoad()}
  catch(e){if(btn){btn.disabled=false;btn.textContent=t}PMSG=e.message;pautaRender()}
}
function pautaPw(){const v=($('ptpw').value||'').trim();if(!v)return;sessionStorage.setItem(PWK,v);PMSG='';pautaRender()}
function pautaGerar(b){pAcao(b,'gerar',{semana:PSEM})}
function pautaDecidir(id,b){
  const d=($('dc'+id).value||'').trim();
  if(!d){PMSG='Escreva a decisão antes de registrar.';pautaRender();return}
  pAcao(b,'add_decisao',{pauta_id:id,decisao:d,responsavel:($('dr'+id).value||'').trim()||null,prazo:$('dp'+id).value||null});
}
function pautaAdd(b){
  const t=($('nvtit').value||'').trim();
  if(!t){PMSG='Escreva o título do item.';pautaRender();return}
  const ordem=PT.reduce((m,i)=>Math.max(m,+i.ordem||0),0)+5;
  pAcao(b,'add_item',{semana:PSEM,categoria:$('nvcat').value,titulo:t,detalhe:($('nvdet').value||'').trim()||null,gravidade:$('nvgr').value,ordem:ordem});
}
function pautaApagar(id,b){if(confirm('Apagar este item da pauta?'))pAcao(b,'del_item',{pauta_id:id})}
function pautaConcluir(id,v,el){
  el.disabled=true;
  pSalvar('concluir',{decisao_id:id,concluido:v}).then(()=>pautaLoad()).catch(e=>{el.disabled=false;el.checked=!v;PMSG=e.message;pautaRender()});
}
function pautaStatus(id,v,el){
  el.disabled=true;
  pSalvar('set_status',{pauta_id:id,status:v}).then(()=>pautaLoad()).catch(e=>{el.disabled=false;PMSG=e.message;pautaRender()});
}
const card=(k,v,d)=>`<div class="c"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d||''}</div></div>`;
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
<script src="/assets/portal.js?v=3"></script>
</body></html>
