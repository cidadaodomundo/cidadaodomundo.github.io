<style>
/* 03/10/2026 (chat-visual-fila-03-10): pedido do Fabio — mesmo visual e mesma dinamica do Delivery · Sao Braz.
   Mesmos botoes, mesmas leituras do banco e mesmos timers; mudou so a aparencia.

:root{--roxo:#a98bf5}
.per{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}

.lojas .chip{padding:7px 13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}

.card .qs{color:var(--muted);font-size:12px;font-weight:700;line-height:1.35}
.card.mal{border-left:4px solid var(--bad)}

.parado{background:var(--s1);border:1.5px dashed #4a4943;color:var(--text2);border-radius:13px;padding:12px 16px;margin-bottom:14px;font-size:14px;font-weight:600;line-height:1.5}
@keyframes pisca{0%{box-shadow:0 0 0 0 rgba(47,174,106,.6)}70%{box-shadow:0 0 0 8px rgba(47,174,106,0)}100%{box-shadow:0 0 0 0 rgba(47,174,106,0)}}
@media (max-width:640px){.linha .mb{display:none}.linha{gap:9px;padding:10px 12px}.linha .dir{gap:8px}.linha .ped{min-width:0;font-size:19px}.linha .mn{min-width:0;font-size:18px}.linha .hr{font-size:11.5px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card .v{font-size:34px}.per{width:100%}.quadros{grid-template-columns:1fr}.lojas{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.lojas .chip{flex:0 0 auto}}

<div class="wrap">
<div class="top">

  </div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function rpc(nome,corpo){
  try{
    const r=await fetch(SB+'rpc/'+nome,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
    return r.ok?await r.json():null;
  }catch(e){return null}
}

var UNI='Água Verde';
try{var _u=localStorage.getItem('cdm_fila_uni'); if(_u==='Água Verde'||_u==='São Braz'||_u==='Ahú') UNI=_u;}catch(e){}

function trocaLoja(u){
  UNI=u; try{localStorage.setItem('cdm_fila_uni',u)}catch(e){}
  var bs=document.querySelectorAll('#lojas .chip');
  for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('on', bs[i].getAttribute('data-u')===u); }
  placar('');
  $('app').innerHTML='<div class="load">Carregando…</div>';
  OK_EM=0; boot();
}

/* 03/10/2026 (visual do Delivery · Sao Braz): placar de pilulas no topo e quadros que levam ate a lista.
   As listas Na loja e Na rua ficam sempre abertas (tela de balcao): o quadro so fica marcado e a tela rola ate a lista dele.
   Um quadro marcado por vez; tocar de novo desmarca. */
function placar(extra){
  var p=$('placar'); if(p) p.innerHTML='<span class="pl">Loja <b>'+esc(UNI)+'</b></span>'+(extra||'');
}
var ABERTO=null;
function secDe(id){ return id==='rua'?'sec_rua':'sec_loja'; }
function marcaAberto(){
  var cs=document.querySelectorAll('#app .card[data-q]');
  for(var i=0;i<cs.length;i++){ cs[i].classList.toggle('on', cs[i].getAttribute('data-q')===ABERTO); }
  ['sec_loja','sec_rua'].forEach(function(s){ var e=$(s); if(e) e.classList.toggle('on', !!ABERTO&&secDe(ABERTO)===s); });
}
function vaiPara(id){
  ABERTO=(ABERTO===id?null:id); marcaAberto();
  var p=ABERTO&&$(secDe(ABERTO)); if(p&&p.scrollIntoView) p.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function qAgora(id,tit,v,s,k){
  var clica=id&&k!=='sd';
  return '<div class="card'+(k?' '+k:'')+(clica&&ABERTO===id?' on':'')+'"'+
    (clica?' data-q="'+id+'" onclick="vaiPara(&quot;'+id+'&quot;)" title="Toque para ir até a lista"':'')+'>'+
    '<div class="t">'+tit+'</div><div class="v">'+v+'</div><div class="qs">'+s+'</div></div>';
}

/* 20/09/2026, pedido do Fabio: a distancia que o motoboy esta de cada pedido na mao dele.
   Vem do banco em metros (dist_m), medida em LINHA RETA entre o GPS dele agora e o endereco do pedido.
   Sem GPS, sem endereco ou nome que nao casou: o banco manda nulo e aqui NAO se escreve nada.
   A cor decide pelo MESMO numero que aparece escrito (arredondado), para dois "3,0 km" nunca sairem de cores diferentes. */
function dist(m){
  if(m===null||m===undefined) return '';
  var mm = (m<1000) ? m : Math.round(m/100)*100;
  var cls = (mm<300)?' pp' : (mm>=3000)?' lg' : '';
  var txt = (m<1000) ? (m+' m') : ((mm/1000).toFixed(1).replace('.',',')+' km');
  return '<span class="dd'+cls+'" title="em linha reta, do GPS dele ate o endereco">'+esc(txt)+'</span>';
}

/* 24/09/2026, pedido do Fabio: ao lado de cada entrega, um quadradinho com a MESMA COR da rota no TrackEat,
   para bater o olho e saber qual motoboy leva. A API do TrackEat NAO manda a cor: o site dele calcula na tela.
   Aqui esta a MESMA regra copiada do site (main.3220af9f.js, funcao K2): cada rota (grupo) ganha uma cor pelo
   numero dela; se uma rota a menos de 6 km ja tem cor parecida, tenta a proxima da sequencia (ate 80).
   Rotas maiores escolhem primeiro. O TrackEat tambem lembra a cor no navegador de quem esta olhando,
   entao em caso raro (rota que mudou de vizinhanca) a cor la pode ter ficado a antiga. */
function teHsl(h,s,l){
  h=(h%360+360)%360; s=Math.min(Math.max(s,0),100)/100; l=Math.min(Math.max(l,0),100)/100;
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs(h/60%2-1)), m=l-c/2, r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  return '#'+[r,g,b].map(function(v){return Math.round(255*(v+m)).toString(16).padStart(2,'0')}).join('');
}
function teCor(e,t){ var S=[68,74,80,86], L=[42,48,54,60]; return teHsl((137.508*e+53*t)%360, S[(e+t)%4], L[(3*e+t)%4]); }
function teKm(a,b,c,d){ var R=function(x){return x*Math.PI/180}, r=R(c-a), o=R(d-b),
  s=Math.sin(r/2)*Math.sin(r/2)+Math.cos(R(a))*Math.cos(R(c))*Math.sin(o/2)*Math.sin(o/2);
  return 12742*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }
function teRgb(h){ var n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function teDif(a,b){ var x=teRgb(a), y=teRgb(b); return Math.sqrt(Math.pow(x[0]-y[0],2)+Math.pow(x[1]-y[1],2)+Math.pow(x[2]-y[2],2)); }
function coresRotas(lista){
  var gs={}, ordem=[];
  (lista||[]).forEach(function(p){ var g=Number(p.g); if(!g||p.lat==null||p.lng==null) return;
    if(!gs[g]){gs[g]={g:g,pts:[]};ordem.push(gs[g]);} gs[g].pts.push([Number(p.lat),Number(p.lng)]); });
  var rs=ordem.map(function(x){ var n=x.pts.length;
    return {g:x.g, lat:x.pts.reduce(function(a,p){return a+p[0]},0)/n, lng:x.pts.reduce(function(a,p){return a+p[1]},0)/n, n:n}; })
    .sort(function(a,b){ return b.n!==a.n ? b.n-a.n : a.g-b.g; });
  var feitos=[], out={};
  var perto=function(e){ return feitos.filter(function(t){ return teKm(e.lat,e.lng,t.lat,t.lng)<6; }); };
  var serve=function(c,e){ return perto(e).every(function(t){ return c!==t.cor && teDif(c,t.cor)>=90; }); };
  var nota=function(c,e){ var v=perto(e); if(!v.length) return Infinity;
    return Math.min.apply(null, v.map(function(t){ var r=teKm(e.lat,e.lng,t.lat,t.lng), o=teDif(c,t.cor), s=o+4*r;
      if(c===t.cor) s-=1e5; if(o<90) s-=1e3*(90-o); return s; })); };
  rs.forEach(function(e){
    var k=String(e.g), hsh=0; for(var i=0;i<k.length;i++) hsh=(31*hsh+k.charCodeAt(i))>>>0;
    var cor=null, melhor=null, mv=-Infinity;
    for(var o=0;o<80;o++){ var c=teCor(hsh,o); if(serve(c,e)){cor=c;break;} var a=nota(c,e); if(a>mv){mv=a;melhor=c;} }
    cor=cor||melhor||teCor(hsh,0);
    feitos.push({lat:e.lat,lng:e.lng,cor:cor}); out[e.g]=cor;
  });
  return out;
}
var COR={};
function quad(g){ var c=g&&COR[Number(g)]; return c?'<span class="rc" style="background:'+c+'" title="cor da rota no TrackEat (rota '+esc(g)+')"></span>':''; }

/* o nome de cada etapa, do jeito que a equipe fala */
function nomeEtapa(o){
  if(o==='preparo') return 'em preparo na cozinha';
  if(o==='pronto') return 'pronto, esperando motoboy';
  if(o==='porta') return 'chegou no cliente';
  return 'na rua';
}

/* 20/09/2026, pedido do Fabio: o mesmo quadro da tela Tempo de Entrega, aqui dentro.
   Os numeros NAO sao recalculados: vem da mesma conta do banco que alimenta aquela tela,
   entao as duas nunca podem discordar. */
function mbBloco(d){
  if(d.motoboys===null||d.motoboys===undefined){
    return '<div class="grp"><span class="em">📱</span><h2>Motoboys</h2><span class="ct">quem está com o aplicativo ligado neste minuto</span></div>'+
      '<div class="mbs"><div class="vazio">Não consegui ler os motoboys neste minuto.</div></div>';
  }
  var mb=Array.isArray(d.motoboys)?d.motoboys:[];
  var sinal=function(m){
    if(m.faltam===null||m.faltam===undefined) return '<span class="sin sin-n" title="o TrackEat não tem este motoboy agora"></span>';
    return (m.faltam>0)?'<span class="sin sin-r" title="com entrega na mão"></span>'
                       :'<span class="sin sin-v" title="sem entrega na mão agora"></span>';
  };
  var prox=function(lst){
    var c=lst.filter(function(m){return m.livre&&m.livre_min!=null;});
    if(!c.length) return '';
    c.sort(function(a,b){return a.livre_min-b.livre_min;});
    var p=c[0];
    return '<div class="prox">🟢 '+(p.livre==='agora'?'Livre agora: ':'Próximo motoboy livre: ~'+esc(p.livre)+' — ')+esc(p.motoboy)+'</div>';
  };
  var leg=function(lst){
    var naosei=lst.some(function(m){return m.faltam===null||m.faltam===undefined;});
    return '<div class="leg"><span class="sin sin-r"></span>com entrega na mão &nbsp;·&nbsp; '+
      '<span class="sin sin-v"></span>sem entrega na mão agora'+
      (naosei?' &nbsp;·&nbsp; sem bolinha: este motoboy não aparece no TrackEat agora':'')+'</div>';
  };
  var reg=function(r){
    if(!r) return '';
    return '<div class="reg">Livre ~ é estimativa: '+esc(String(r.ida_min))+' min até a 1ª entrega, '+
      esc(String(r.entre_min))+' min entre uma entrega e outra e '+esc(String(r.volta_min))+
      ' min de volta (mediana do TrackEat desta loja, '+esc(String(r.amostra))+' entregas dos últimos '+
      esc(String(r.dias))+' dias). A volta usa o mesmo tempo da ida.</div>';
  };
  return '<div class="grp"><span class="em">📱</span><h2>Motoboys</h2><span class="ct">quem está com o aplicativo ligado neste minuto</span></div>'+'<div class="mbs">'+prox(mb)+
    (mb.length
      ? '<table><tr><th>Motoboy</th><th>Onde está</th><th>Distância da loja</th><th>Situação</th><th>Faltam</th><th>Livre ~</th><th>App</th><th>Visto</th></tr>'+
        mb.map(function(m){return '<tr><td class="nome">'+sinal(m)+(COR_MB[m.motoboy]||'')+esc(m.motoboy)+'</td>'+
          '<td class="'+(m.no_patio?'pin':'rua')+'">'+(m.no_patio?'🟢 ':'🛵 ')+esc(m.onde)+'</td>'+

var FR=null, FR_EM=0, TEP=null;

  if(FR&&Date.now()-FR_EM<600000) return FR;

    var r=await fetch(SB+'fato_frescor?select=fonte,ultimo_dia,farol&fonte=in.(delivery_entrega,delivery_pedido)',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    if(r.ok){var o={};(await r.json()).forEach(function(x){o[x.fonte]=x;});FR=o;FR_EM=Date.now();}
  }catch(e){}

}
function frParado(f){var x=FR&&FR[f];if(!x||x.farol!=='PARADO'||!x.ultimo_dia)return null;var p=String(x.ultimo_dia).split('-');return p[2]+'/'+p[1];}

  if(minha!==VEZ||uni!==UNI) return;   /* trocou de loja no meio: descarta a resposta velha */

}

function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'fila'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){
  if(!ok) return;
  trocaLoja(UNI);
  var cdmT=setInterval(boot,60000), cdmS=setInterval(selo,1000);   /* cdmS: so relogio na tela, sem rede */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ clearInterval(cdmT); clearInterval(cdmS); cdmT=null; cdmS=null; }
    else if(!cdmT){ boot(); cdmT=setInterval(boot,60000); cdmS=setInterval(selo,1000); }
  });
});
</script>
<script src="/assets/portal.js?v=3"></script>
