<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function rpc(nome,corpo){
  try{
    const r=await fetch(SB+'rpc/'+nome,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
    return r.ok?await r.json():null;
  }catch(e){return null}
}

var UNI='Água Verde';
try{var _u=localStorage.getItem('cdm_fila_uni'); if(_u==='Água Verde'||_u==='São Braz'||_u==='Ahú') UNI=_u;}catch(e){}

function trocaLoja(u){
  UNI=u; try{localStorage.setItem('cdm_fila_uni',u)}catch(e){}
  var bs=document.querySelectorAll('#lojas .lj');
  for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('on', bs[i].getAttribute('data-u')===u); }
  $('sub').textContent=u+' — onde está cada pedido agora';
  $('app').innerHTML='<div class="load">Carregando…</div>';
  OK_EM=0; boot();
}

/* 20/09/2026, pedido do Fabio: a distancia que o motoboy esta de cada pedido na mao dele.
   Vem do banco em metros (dist_m), medida em LINHA RETA entre o GPS dele agora e o endereco do pedido.
   Sem GPS, sem endereco ou nome que nao casou: o banco manda nulo e aqui NAO se escreve nada.
   A cor decide pelo MESMO numero que aparece escrito (arredondado), para dois "3,0 km" nunca sairem de cores diferentes. */
function dist(m){
  if(m===null||m===undefined) return '';
  var mm = (m<1000) ? m : Math.round(m/100)*100;
  var cls = (mm<300)?' pp' : (mm>=3000)?' lg' : '';
  var txt = (m<1000) ? (m+' m') : ((mm/1000).toFixed(1).replace('.',',')+' km');
  return '<span class="dd'+cls+'" title="em linha reta, do GPS dele ate o endereco">'+esc(txt)+'</span>';
}

/* 24/09/2026, pedido do Fabio: ao lado de cada entrega, um quadradinho com a MESMA COR da rota no TrackEat,
   para bater o olho e saber qual motoboy leva. A API do TrackEat NAO manda a cor: o site dele calcula na tela.
   Aqui esta a MESMA regra copiada do site (main.3220af9f.js, funcao K2): cada rota (grupo) ganha uma cor pelo
   numero dela; se uma rota a menos de 6 km ja tem cor parecida, tenta a proxima da sequencia (ate 80).
   Rotas maiores escolhem primeiro. O TrackEat tambem lembra a cor no navegador de quem esta olhando,
   entao em caso raro (rota que mudou de vizinhanca) a cor la pode ter ficado a antiga. */
function teHsl(h,s,l){
  h=(h%360+360)%360; s=Math.min(Math.max(s,0),100)/100; l=Math.min(Math.max(l,0),100)/100;
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs(h/60%2-1)), m=l-c/2, r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  return '#'+[r,g,b].map(function(v){return Math.round(255*(v+m)).toString(16).padStart(2,'0')}).join('');
}
function teCor(e,t){ var S=[68,74,80,86], L=[42,48,54,60]; return teHsl((137.508*e+53*t)%360, S[(e+t)%4], L[(3*e+t)%4]); }
function teKm(a,b,c,d){ var R=function(x){return x*Math.PI/180}, r=R(c-a), o=R(d-b),
  s=Math.sin(r/2)*Math.sin(r/2)+Math.cos(R(a))*Math.cos(R(c))*Math.sin(o/2)*Math.sin(o/2);
  return 12742*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }
function teRgb(h){ var n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function teDif(a,b){ var x=teRgb(a), y=teRgb(b); return Math.sqrt(Math.pow(x[0]-y[0],2)+Math.pow(x[1]-y[1],2)+Math.pow(x[2]-y[2],2)); }
function coresRotas(lista){
  var gs={}, ordem=[];
  (lista||[]).forEach(function(p){ var g=Number(p.g); if(!g||p.lat==null||p.lng==null) return;
    if(!gs[g]){gs[g]={g:g,pts:[]};ordem.push(gs[g]);} gs[g].pts.push([Number(p.lat),Number(p.lng)]); });
  var rs=ordem.map(function(x){ var n=x.pts.length;
    return {g:x.g, lat:x.pts.reduce(function(a,p){return a+p[0]},0)/n, lng:x.pts.reduce(function(a,p){return a+p[1]},0)/n, n:n}; })
    .sort(function(a,b){ return b.n!==a.n ? b.n-a.n : a.g-b.g; });
  var feitos=[], out={};
  var perto=function(e){ return feitos.filter(function(t){ return teKm(e.lat,e.lng,t.lat,t.lng)<6; }); };
  var serve=function(c,e){ return perto(e).every(function(t){ return c!==t.cor && teDif(c,t.cor)>=90; }); };
  var nota=function(c,e){ var v=perto(e); if(!v.length) return Infinity;
    return Math.min.apply(null, v.map(function(t){ var r=teKm(e.lat,e.lng,t.lat,t.lng), o=teDif(c,t.cor), s=o+4*r;
      if(c===t.cor) s-=1e5; if(o<90) s-=1e3*(90-o); return s; })); };
  rs.forEach(function(e){
    var k=String(e.g), hsh=0; for(var i=0;i<k.length;i++) hsh=(31*hsh+k.charCodeAt(i))>>>0;
    var cor=null, melhor=null, mv=-Infinity;
    for(var o=0;o<80;o++){ var c=teCor(hsh,o); if(serve(c,e)){cor=c;break;} var a=nota(c,e); if(a>mv){mv=a;melhor=c;} }
    cor=cor||melhor||teCor(hsh,0);
    feitos.push({lat:e.lat,lng:e.lng,cor:cor}); out[e.g]=cor;
  });
  return out;
}
var COR={};
function quad(g){ var c=g&&COR[Number(g)]; return c?'<span class="rc" style="background:'+c+'" title="cor da rota no TrackEat (rota '+esc(g)+')"></span>':''; }

/* o nome de cada etapa, do jeito que a equipe fala */
function nomeEtapa(o){
  if(o==='preparo') return 'em preparo na cozinha';
  if(o==='pronto') return 'pronto, esperando motoboy';
  if(o==='porta') return 'chegou no cliente';
  return 'na rua';
}

/* 20/09/2026, pedido do Fabio: o mesmo quadro da tela Tempo de Entrega, aqui dentro.
   Os numeros NAO sao recalculados: vem da mesma conta do banco que alimenta aquela tela,
   entao as duas nunca podem discordar. */
function mbBloco(d){
  if(d.motoboys===null||d.motoboys===undefined){
    return '<div class="mbs"><h2>🛵 Quem está com o aplicativo ligado neste minuto</h2>'+
      '<div class="vazio">Não consegui ler os motoboys neste minuto.</div></div>';
  }
  var mb=Array.isArray(d.motoboys)?d.motoboys:[];
  var sinal=function(m){
    if(m.faltam===null||m.faltam===undefined) return '<span class="sin sin-n" title="o TrackEat não tem este motoboy agora"></span>';
    return (m.faltam>0)?'<span class="sin sin-r" title="com entrega na mão"></span>'
                       :'<span class="sin sin-v" title="sem entrega na mão agora"></span>';
  };
  var prox=function(lst){
    var c=lst.filter(function(m){return m.livre&&m.livre_min!=null;});
    if(!c.length) return '';
    c.sort(function(a,b){return a.livre_min-b.livre_min;});
    var p=c[0];
    return '<div class="prox">🟢 '+(p.livre==='agora'?'Livre agora: ':'Próximo motoboy livre: ~'+esc(p.livre)+' — ')+esc(p.motoboy)+'</div>';
  };
  var leg=function(lst){
    var naosei=lst.some(function(m){return m.faltam===null||m.faltam===undefined;});
    return '<div class="leg"><span class="sin sin-r"></span>com entrega na mão &nbsp;·&nbsp; '+
      '<span class="sin sin-v"></span>sem entrega na mão agora'+
      (naosei?' &nbsp;·&nbsp; sem bolinha: este motoboy não aparece no TrackEat agora':'')+'</div>';
  };
  var reg=function(r){
    if(!r) return '';
    return '<div class="reg">Livre ~ é estimativa: '+esc(String(r.ida_min))+' min até a 1ª entrega, '+
      esc(String(r.entre_min))+' min entre uma entrega e outra e '+esc(String(r.volta_min))+
      ' min de volta (mediana do TrackEat desta loja, '+esc(String(r.amostra))+' entregas dos últimos '+
      esc(String(r.dias))+' dias). A volta usa o mesmo tempo da ida.</div>';
  };
  return '<div class="mbs"><h2>🛵 Quem está com o aplicativo ligado neste minuto</h2>'+prox(mb)+
    (mb.length
      ? '<table><tr><th>Motoboy</th><th>Onde está</th><th>Distância da loja</th><th>Situação</th><th>Faltam</th><th>Livre ~</th><th>App</th><th>Visto</th></tr>'+
        mb.map(function(m){return '<tr><td class="nome">'+sinal(m)+(COR_MB[m.motoboy]||'')+esc(m.motoboy)+'</td>'+
          '<td class="'+(m.no_patio?'pin':'rua')+'">'+(m.no_patio?'🟢 ':'🛵 ')+esc(m.onde)+'</td>'+
          '<td>'+esc(m.dist||'—')+'</td><td>'+esc(m.situacao)+'</td>'+
          '<td>'+(m.faltam>0?'<b>'+esc(String(m.faltam))+'</b> '+(m.faltam==1?'entrega':'entregas'):'—')+'</td>'+
          '<td>'+(m.livre==='agora'?'<span class="pin">agora</span>':(m.livre?'~'+esc(m.livre):'—'))+'</td>'+
          '<td>'+esc(m.app)+'</td><td>'+esc(m.visto)+'</td></tr>'}).join('')+
        '</table>'+leg(mb)+reg(d.motoboys_regua)
      : '<div class="vazio">Nenhum motoboy com o aplicativo ligado nos últimos 30 minutos.</div>')+
   '</div>';
}

/* 24/09/2026, pedido do Fabio: o quadro do tempo de preparo da Central Cozinha, aqui dentro,
   para a equipe ver se a cozinha esta demorando HOJE. Mesma fonte da Central Cozinha
   (cozinha_vw_preparo_dia: do pedido entrar ate ficar pronto no Foody), sem conta nova no banco.
   Hoje = dia operacional: ate as 5h da manha ainda conta como o dia anterior. */
var CZ=null, COR_MB={};
function czDia(dMenos){
  var t=new Date(Date.now()-5*36e5-dMenos*864e5);
  return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(t);
}
async function czPega(){
  try{
    var r=await fetch(SB+'cozinha_vw_preparo_dia?select=unidade,dia_operacional,pedidos,preparo_medio_min&dia_operacional=gte.'+czDia(7),{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    return r.ok?await r.json():null;
  }catch(e){return null}
}
function czMedia(rows){
  var p=0,s=0;
  rows.forEach(function(r){var n=Number(r.pedidos||0),m=Number(r.preparo_medio_min); if(n>0&&isFinite(m)){p+=n;s+=n*m;}});
  return p?{min:s/p,pedidos:p}:null;
}
function czMin(n){return n.toFixed(1).replace('.',',')+' min';}
/* 24/09/2026, segundo pedido do Fabio: a Fila vira painel ao vivo para ficar ligado na loja.
   Faixa "O dia ate agora" SO da loja escolhida: cozinha (acima), mais os numeros da Central do Delivery
   (entregas, motoboys, % no prazo real, atrasos reais, sem codigo) e da tela Resolver hoje
   (reentrega aberta, esqueceram na sacola). Tudo vem da conta fila_painel no banco, que usa
   as MESMAS regras daquelas telas, para nunca discordarem. */
var PN=null;
function kc(t,v,s,cor){
  return '<div class="kc" style="border-left-color:'+cor+'"><div class="t">'+t+'</div>'+
    '<div class="v" style="color:'+cor+'">'+v+'</div><div class="s">'+(s||'&nbsp;')+'</div></div>';
}
function czBloco(){
  var h='<div class="cz"><h2>📊 '+esc(UNI)+' — o dia até agora <span class="q">'+(PN&&PN.dia?esc(PN.dia):'')+'</span></h2><div class="kk">';
  /* cozinha: so a loja escolhida */
  var hoje=czDia(0), a=null, b=null;
  if(CZ){
    a=czMedia(CZ.filter(function(r){return r.unidade===UNI&&r.dia_operacional===hoje;}));
    b=czMedia(CZ.filter(function(r){return r.unidade===UNI&&r.dia_operacional<hoje;}));
  }
  if(!CZ) h+=kc('Cozinha hoje','—','não consegui ler','var(--muted)');
  else if(!a) h+=kc('Cozinha hoje','—','nenhum pronto ainda'+(b?' · normal '+czMin(b.min):''),'var(--muted)');
  else{
    var dif=b?a.min-b.min:0;
    var cor=!b?'var(--text)':dif>=0.5?'var(--bad)':dif<=-0.5?'var(--ok)':'var(--text)';
    var sel=!b?'sem comparação':dif>=0.5?'<span class="dn">▲ '+czMin(dif)+' mais lento</span>':dif<=-0.5?'<span class="up">▼ '+czMin(-dif)+' mais rápido</span>':'no normal';
    h+=kc('Cozinha hoje',czMin(a.min),sel+(b?' · normal '+czMin(b.min):''),cor);
  }
  if(!PN){
    h+='</div><div class="leg">Não consegui ler os números do delivery agora. Tento de novo no próximo minuto.</div></div>';
    return h;
  }
  var ent=PN.entregas||0, ok=PN.no_prazo||0, atr=PN.atrasos||0;
  var pct=ent?Math.round(1000*ok/ent)/10:null;
  var bp=PN.base_n?Math.round(1000*PN.base_ok/PN.base_n)/10:null;
  var cmp='';
  if(pct!=null&&bp!=null){var d=pct-bp; cmp=Math.abs(d)<0.05?'= média':'<span class="'+(d>0?'up':'dn')+'">'+(d>0?'▲':'▼')+' '+Math.abs(d).toFixed(1).replace('.',',')+' vs média</span>';}
  var pf=function(x){return String(x).replace('.',',')+'%';};
  var esq=Array.isArray(PN.esquecidos)?PN.esquecidos:[];
  h+=kc('Entregas',ent,PN.ultima_entrega?'última às '+esc(PN.ultima_entrega):'nenhuma ainda','var(--roxo)')+
     kc('Motoboys',PN.motoboys||0,'entregaram hoje','var(--roxo)')+
     kc('% no prazo real',pct==null?'—':pf(pct),cmp,pct==null?'var(--muted)':pct>=85?'var(--ok)':pct>=70?'var(--warn)':'var(--bad)')+
     kc('Atrasos reais',atr,atr?'acima do horário prometido':'nenhum 🎉',atr?'var(--bad)':'var(--ok)')+
     kc('Sem código',PN.sem_codigo||0,PN.sem_codigo?'sem Cód. de Coleta':'tudo certo 🎉',PN.sem_codigo?'var(--warn)':'var(--ok)')+
     kc('🔁 Reentrega',PN.reentrega||0,PN.reentrega?'esperando explicação':'nenhuma 🎉',PN.reentrega?'var(--bad)':'var(--ok)')+
     kc('Esqueceram na sacola',esq.length,esq.length?'cliente reclamou no chat':'nenhuma reclamação 🎉',esq.length?'var(--bad)':'var(--ok)');
  h+='</div>';
  if(esq.length){
    var fam={BEBIDA:'bebida',SOBREMESA:'sobremesa',COMIDA:'comida'};
    h+='<div class="esq"><b>Esqueceram na sacola:</b> '+esq.map(function(e){
      return 'pedido '+esc(e.pedido||'?')+' às '+esc(e.quando)+(fam[e.familia]?' ('+fam[e.familia]+')':'');
    }).join(' · ')+'</div>';
  }
  h+='<div class="leg">Cozinha: do pedido entrar até ficar pronto (Foody), comparado com os 7 dias anteriores desta loja. '+
     'Entregas, prazo, atrasos e sem código: mesma conta da Central do Delivery; a média do prazo é do mesmo dia da semana nas 4 semanas anteriores. '+
     'Reentrega e esqueceram na sacola: mesma conta da tela Resolver hoje — chat do iFood lido pela última vez em '+esc(PN.chat_lido_em||'—')+'.</div></div>';
  return h;
}

function desenha(d){
  if(!d){ $('app').innerHTML='<div class="vazio">Não consegui ler os pedidos agora. Tente o botão Atualizar.</div>'; return; }
  var r=d.resumo||{}, h='';
  COR=coresRotas(d.grupos); COR_MB={};
  (d.na_rua||[]).forEach(function(m){ var p=(m.pedidos||[]).filter(function(x){return x.grupo})[0]; if(p&&m.motoboy&&!COR_MB[m.motoboy]) COR_MB[m.motoboy]=quad(p.grupo); });
  (d.na_loja||[]).forEach(function(p){ if(p.motoboy&&p.grupo&&!COR_MB[p.motoboy]) COR_MB[p.motoboy]=quad(p.grupo); });

  h+='<div class="res">'+
     '<div class="k vm"><div class="n">'+esc(r.preparo)+'</div><div class="l">Em preparo na cozinha</div></div>'+
     '<div class="k rx"><div class="n">'+esc(r.pronto)+'</div><div class="l">Prontos esperando motoboy</div></div>'+
     '<div class="k br"><div class="n">'+esc(r.rua)+'</div><div class="l">Na rua · '+esc(r.motoboys)+' motoboy'+(r.motoboys===1?'':'s')+'</div></div>'+
     '</div>';

  h+=czBloco();

  h+=mbBloco(d);

  var loja=Array.isArray(d.na_loja)?d.na_loja:[];
  h+='<div class="bloco"><h2>Na loja <span class="q">'+loja.length+' pedido'+(loja.length===1?'':'s')+'</span></h2>';
  if(!loja.length){ h+='<div class="vazio">Nenhum pedido esperando na loja neste minuto.</div>'; }
  else{
    h+=loja.map(function(p){
      var bola=(p.onde==='preparo')?'b-vm':'b-rx';
      return '<div class="linha'+(p.atrasado?' late':'')+'">'+
        '<span class="bola '+bola+'"></span>'+quad(p.grupo)+
        '<span class="ped">'+esc(p.pedido)+'</span>'+
        '<span class="est">'+esc(nomeEtapa(p.onde))+'</span>'+
        (p.motoboy?'<span class="mb">· '+esc(p.motoboy)+'</span>':'')+
        '<span class="dir"><span class="hr">entrou '+esc(p.entrou)+'</span>'+
        '<span class="mn">'+esc(p.min)+' min</span></span></div>';
    }).join('');
  }
  h+=legenda(d)+'</div>';

  var rua=Array.isArray(d.na_rua)?d.na_rua:[];
  h+='<div class="bloco"><h2>Na rua com os motoboys <span class="q">'+esc(r.rua)+' pedido'+(r.rua===1?'':'s')+'</span></h2>';
  if(!rua.length){ h+='<div class="vazio">Nenhum pedido na rua neste minuto.</div>'; }
  else{
    h+='<div class="quadros">'+rua.map(function(m){
      var g1=(m.pedidos||[]).filter(function(x){return x.grupo})[0], c1=g1&&COR[Number(g1.grupo)];
      return '<div class="qd"'+(c1?' style="border-left:4px solid '+c1+'"':'')+'><div class="cb">'+(COR_MB[m.motoboy]||'')+'<span class="nm">'+esc(m.motoboy)+'</span>'+
        (m.saiu_ha!=null?'<span class="sa">saiu há '+esc(m.saiu_ha)+' min</span>':'')+
        (m.com_gps===0?'<span class="sg" title="sem sinal de GPS deste motoboy nos últimos 30 min">sem GPS</span>':'')+
        '<span class="ct">'+esc(m.quantos)+'</span></div>'+
        (m.pedidos||[]).map(function(p){
          return '<div class="it'+(p.atrasado?' late':'')+'">'+quad(p.grupo)+'<span class="p">'+esc(p.pedido)+'</span>'+
            '<span class="h">'+esc(p.entrou)+'</span>'+
            dist(p.dist_m)+(p.onde==='porta'?'<span class="pt">na porta</span>':'')+
            '<span class="m">'+esc(p.min)+' min</span></div>';
        }).join('')+'</div>';
    }).join('')+'</div>';
  }
  h+='</div>';

  h+='<div class="rod">'+rodape(d)+'</div>';
  $('app').innerHTML=h;
}

function legenda(d){
  var g=d.regua;
  return '<div class="leg"><span class="bola b-vm"></span>em preparo na cozinha &nbsp;·&nbsp; '+
    '<span class="bola b-rx"></span>pronto, esperando motoboy'+
    (g?'<br>O tempo fica vermelho quando passa do normal desta loja: '+esc(g.ate_sair)+
       ' min da entrada até sair com o motoboy e '+esc(g.ate_entregar)+' min até ser entregue '+
       '(mediana dos últimos '+esc(g.amostra)+' pedidos entregues, medida às '+esc(g.medida_em)+').'
      :'<br>Sem histórico suficiente desta loja para dizer o que é demora — nenhum tempo está destacado.')+
    '</div>';
}

function rodape(d){
  return 'Os pedidos vêm do TrackEat, lidos pela última vez às '+esc(d.visto_em||'—')+'. Tela montada às '+esc(d.agora)+'.'+
    '<br>Pedido que não passa pelo TrackEat (balcão, telefone) não aparece aqui.'+
    '<br>A distância ao lado do pedido é do GPS do motoboy até o endereço, <b>em linha reta</b> — de moto o caminho é maior.'+
    ' Verde = está a menos de 300 m dele. Amarelo = 3 km ou mais.'+
    ' GPS lido pela última vez às '+esc(d.gps_visto_em||'—')+'. Motoboy sem sinal fica marcado <b>sem GPS</b> e os pedidos dele ficam sem distância,'+
    ' em vez de receber um número inventado.'+
    '<br>O quadradinho colorido é a cor da rota no mapa do TrackEat (mesma regra de cor do site dele): pedidos da mesma cor vão com o mesmo motoboy.'+
    '<br>A tela se atualiza sozinha a cada minuto e o TrackEat também é lido de minuto em minuto.';
}

/* 24/09/2026, pedido do Fabio: "o quadro tem que estar completamente vivo".
   A tela le o banco a cada 60 s (regra 15 do portal: rede nunca abaixo de 60 s) e o robo do TrackEat
   passou a rodar de minuto em minuto, entao o que aparece tem no maximo ~2 min.
   O selo "ao vivo" no topo conta os segundos desde a ultima leitura boa SEM usar a internet (so relogio na tela)
   e fica VERMELHO se passar de 3 min sem conseguir. Os dois timers param quando a aba sai da frente. */
var VEZ=0, OK_EM=0;
async function boot(){
  const t=(function(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}})();
  const minha=++VEZ, uni=UNI;
  const [d,cz,pn]=await Promise.all([rpc('fila_pedidos',{p_token:t,p_unidade:uni}),czPega(),rpc('fila_painel',{p_token:t,p_unidade:uni})]);
  if(minha!==VEZ||uni!==UNI) return;   /* trocou de loja no meio: descarta a resposta velha */
  CZ=cz; PN=pn;
  if(d){ OK_EM=Date.now(); desenha(d); } else if(!OK_EM){ desenha(null); }
  selo();
}
function selo(){
  var v=$('vivo'); if(!v) return;
  if(!OK_EM){ v.className='vivo velho'; v.innerHTML='<i></i>sem leitura'; return; }
  var s=Math.round((Date.now()-OK_EM)/1000);
  v.className='vivo'+(s>180?' velho':'');
  v.innerHTML='<i></i>'+(s>180?'sem atualizar há '+Math.floor(s/60)+' min':'ao vivo · há '+s+' s');
}

/* ===== porta unica do portal ===== */
const CDMMODS=['fila'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'fila'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){
  if(!ok) return;
  trocaLoja(UNI);
  var cdmT=setInterval(boot,60000), cdmS=setInterval(selo,1000);   /* cdmS: so relogio na tela, sem rede */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ clearInterval(cdmT); clearInterval(cdmS); cdmT=null; cdmS=null; }
    else if(!cdmT){ boot(); cdmT=setInterval(boot,60000); cdmS=setInterval(selo,1000); }
  });
});
</script>
