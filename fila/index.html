<script>
/*
 * Calculador de rota - versao para o navegador (Cidadao do Mundo, loja Agua Verde)
 *
 * E o motor A (engine_a.js, o vencedor do replay TrackEat x calculador) pronto para colar
 * dentro de um <script> comum. No navegador cria so window.MotorRota (mesmo que a pagina
 * tenha um "module" global); sem window (Node) o mesmo arquivo funciona com require() e
 * devolve { planejar, avaliar }.
 *
 * Recebe os pedidos de uma "onda" e as saidas de motoboy disponiveis e devolve,
 * para cada saida, a lista de pedidos na ordem de entrega (saida vazia = motoboy livre).
 *
 * Objetivo (decisao do dono), em ordem de importancia:
 *   1) menos pedidos atrasados  (atrasado = chegada - prometido > tolS)
 *   2) menos segundos de atraso somados (dos pedidos atrasados)
 *   3) menos metros rodados (linha reta - haversine - entre as paradas, sem a volta)
 * Os tres viram um numero so, com pesos tao diferentes que nunca se misturam.
 *
 * Estrategia:
 *   a) INSERCAO COM ARREPENDIMENTO (regret-2): a cada passo entra primeiro o pedido que
 *      mais perde se nao for para a sua melhor rota (empate: prazo mais cedo).
 *   b) BUSCA LOCAL: mover 1 pedido de rota, trocar 2 pedidos entre rotas e trocar rotas
 *      inteiras entre duas saidas, repetida ate nao melhorar mais.
 *   c) ORDEM EXATA dentro de cada rota: permutacoes com poda (branch and bound).
 *   d) REFINAMENTO: destruir e reconstruir pedacos do plano (com sorteio de semente fixa)
 *      e rodar a busca local de novo, ficando com o melhor; tem teto de trabalho.
 *   e) PLANO INICIAL (opts.inicial, opcional): monta tambem um plano partindo do que a tela
 *      ja mostra, roda a busca local nos dois e refina a partir do melhor. Por isso o
 *      resultado NUNCA e pior que o plano inicial completado (plano.inicialCompletado), e
 *      este nunca e pior que o inicial dado quando o dado ja e completo e valido.
 *
 * Interface:
 *   MotorRota.planejar(inst, opts) -> Array<Array<idPedido>> (um array por saida), com:
 *     plano.sobra = [ids que nao entraram em rota] (vazio quando tudo cabe): falta de vaga
 *       (ver cap) ou pedido sem local (ver lat/lng)
 *     plano.semLocal = [ids da sobra que ficaram de fora por coordenada ruim]
 *     plano.inicialCompletado = o plano inicial completado (so quando veio opts.inicial)
 *   MotorRota.avaliar(inst, plano, opts) -> um objeto por saida:
 *     { sai, ids, chegadas:[s], prazos:[prom ou null], atrasados, segAtraso, metros, semLocal:[ids] }
 *   inst = { deposito:{lat,lng}, slots:[{t0}], pedidos:[{id,lat,lng,prom,pronto,visto}] }
 *   opts = { cap, travel(a,b)->segundos, tolS, esperar?, inicial? }   (tempos em epoch segundos)
 *   esperar falso: pedido so vai em saida com t0 >= pronto e t0 >= visto; a rota sai em t0.
 *   esperar verdadeiro: qualquer saida serve; a rota sai em max(t0, maior pronto/visto dela).
 *   inicial: um array de ids por saida, pode ser parcial. Id desconhecido, repetido, em saida
 *     que nao serve, alem do cap ou que tomaria a vaga de quem so cabe ali e ignorado (o pedido
 *     fica "faltando" e o motor o insere como os outros).
 *   cap e DURO: nenhuma rota passa de cap. Se nao cabe todo mundo (mais de cap * saidas, ou
 *     pedidos que so podem ir em poucas saidas), os de prazo mais tarde ficam de fora e vao
 *     para plano.sobra; o motor nunca alarga a rota por conta propria. cap null/undefined =
 *     sem limite; texto numerico vale ('4' = 4, 4.9 = 4); qualquer outra coisa (NaN, -1,
 *     'abc', '') vira 0 = ninguem sai e todos vao para a sobra (erro aparece, nao se esconde).
 *   numeros: prom, pronto e visto aceitam numero ou texto numerico ('1500'); t0 tem que ser numero.
 *   prazo invalido (null, undefined, NaN, +-Infinito, texto nao numerico, true, Date...):
 *     vira "sem prazo" = o maior horario conhecido da onda (prazos validos, saidas,
 *     pronto/visto) + 1e9 s (~31 anos). Nunca conta como atrasado, nao quebra as comparacoes
 *     (Infinito - Infinito = NaN) e fica por ultimo na ordem de prazo (e o primeiro a sobrar se
 *     faltar vaga). avaliar mostra null no prazo dele.
 *   lat/lng: tem que ser numeros validos a ate 100 km do patio. Pedido com coordenada ruim
 *     (null, undefined, '', texto, NaN, ou 0 vindo de +'' na tela) nao entra em rota (nao
 *     da para saber onde fica): vai para plano.sobra e plano.semLocal, sem tomar vaga de
 *     ninguem e sem mexer no plano dos outros. avaliar pula a parada (lista em semLocal da
 *     saida) e calcula as outras como se ela nao existisse; a saida ainda espera por ela.
 *   ids: comparados como texto (17 e "17" sao o mesmo pedido). Id repetido na onda: vale o
 *     primeiro pedido com ele; os outros sao ignorados (o id aparece uma vez so no plano).
 * Deterministico: nao usa Math.random nem Date (mesma entrada = mesma saida).
 */
(function (raiz) {
  'use strict';

  var PESO_ATRASO = 1e12;        // 1 pedido atrasado pesa mais que qualquer soma de segundos e metros
  var PESO_SEG = 1e6;            // 1 segundo de atraso pesa mais que qualquer soma de metros
  var EPS = 0.5;                 // melhora menor que meio metro e ruido de conta: ignora
  var LIMITE_NOS = 20000;        // teto da busca exata por rota: ate 7 paradas e sempre exata; com 8
                                 // quase sempre; com 9+ (so com cap alto) usa 1/10 e fica com a melhor achada
  var LIMITE_VOLTAS = 200;       // teto de voltas da busca local (seguranca; para bem antes)
  var ITER_POR_PEDIDO = 3;       // voltas de destruir-e-reconstruir por pedido da onda
  var LIMITE_TRABALHO = 20000;   // teto de trabalho: avaliacoes de rota + nos/10 (segura o tempo no celular)
  var FOLGA_SEM_PRAZO = 1e9;     // "sem prazo" = maior horario conhecido + isso (segundos)
  var RAIO_MAX_M = 100000;       // entrega a mais de 100 km do patio e coordenada errada

  function haversine(a, b) {
    var R = 6371000, r = Math.PI / 180;
    var dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
    var x = Math.pow(Math.sin(dLa / 2), 2) +
      Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.pow(Math.sin(dLo / 2), 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  // numero ou texto numerico ('1500'); o resto vira NaN
  function lerNumero(x) { return typeof x === 'number' ? x : (typeof x === 'string' && x.trim() !== '') ? Number(x) : NaN; }
  // numero valido ou -Infinito (pronto/visto ausente = pedido ja liberado)
  function num(x) { var v = lerNumero(x); return isNaN(v) ? -Infinity : v; }
  function finito(x) { return typeof x === 'number' && isFinite(x); }
  function porIndice(x, y) { return x - y; }
  function liberacao(p) { return Math.max(num(p.pronto), num(p.visto)); }
  function prazo(p) { var x = lerNumero(p.prom); return isFinite(x) ? x : null; }   // null = sem prazo
  // da para saber onde o pedido fica? (lat/lng numeros e a ate RAIO_MAX_M do patio)
  function localOk(dep, p) {
    return typeof p.lat === 'number' && typeof p.lng === 'number' && Math.abs(p.lat) <= 90 &&
      Math.abs(p.lng) <= 180 && haversine(dep, p) <= RAIO_MAX_M;
  }

  // prazo de cada pedido; o invalido vira "sem prazo" (ver cabecalho)
  function prazosSeguros(ped, slots) {
    var maior = -Infinity;
    function ve(x) { if (finito(x) && x > maior) maior = x; }
    ped.forEach(function (p) { ve(prazo(p)); ve(num(p.pronto)); ve(num(p.visto)); });
    slots.forEach(function (s) { ve(s.t0); });
    var semPrazo = (maior > -Infinity ? maior : 0) + FOLGA_SEM_PRAZO;
    return ped.map(function (p) { var x = prazo(p); return x === null ? semPrazo : x; });
  }

  // posicao de cada id (como texto) na lista de pedidos; id repetido fica com o primeiro
  function indicePorId(ped) {
    var mapa = new Map();
    for (var i = 0; i < ped.length; i++) if (!mapa.has(String(ped[i].id))) mapa.set(String(ped[i].id), i);
    return mapa;
  }

  // ---------- cap duro: quem cabe nas vagas ----------
  // Cada pedido so serve nas saidas com t0 >= liberacao (com esperar, em todas): sao sempre
  // as k saidas mais tarde, conjuntos encaixados. nivel = quantas saidas o aceitam. Todos
  // cabem se, para todo k, os pedidos de nivel <= k cabem em k * cap vagas. Do mais urgente
  // ao menos urgente entra quem ainda cabe (com conjuntos assim o guloso e exato: entram os
  // mais urgentes possiveis). Sem restricao de saida isso e: ficam os cap*m de prazo mais cedo.
  // So os candidatos (cands) disputam vaga; devolve, por pedido, se fica.
  function quemCabe(cands, prom, lib, t0, cap, esperar) {
    var m = t0.length, nivel = [], fica = prom.map(function () { return false; });
    var porNivel = new Array(m + 1).fill(0);
    cands.forEach(function (i) {
      var c = 0;
      for (var s = 0; s < m; s++) if (esperar || lib[i] <= t0[s]) c++;
      nivel[i] = c;
    });
    cands.slice().sort(function (x, y) { return prom[x] - prom[y] || x - y; }).forEach(function (i) {
      var ok = nivel[i] > 0, acc = 0;
      for (var k = 1; k <= m && ok; k++) {
        acc += porNivel[k];
        if (k >= nivel[i] && acc + 1 > cap * k) ok = false;
      }
      if (ok) { porNivel[nivel[i]]++; fica[i] = true; }
    });
    return fica;
  }

  function planejar(inst, opts) {
    var todosPed = inst.pedidos || [], m = inst.slots.length;
    var tol = opts.tolS || 0, esperar = !!opts.esperar, inicial = Array.isArray(opts.inicial) ? opts.inicial : null;
    var plano = inst.slots.map(function () { return []; });
    plano.sobra = []; plano.semLocal = [];
    if (inicial) plano.inicialCompletado = inst.slots.map(function () { return []; });
    // cap ausente = sem limite; cap que nao e numero >= 0 vira 0 (ver cabecalho)
    var capLido = lerNumero(opts.cap), cap = opts.cap == null ? Infinity : capLido >= 0 ? Math.floor(capLido) : 0;

    var t0 = inst.slots.map(function (s) { return s.t0; });
    var promT = prazosSeguros(todosPed, inst.slots);
    // hora a partir da qual o pedido pode sair (pronto e ja visto pelo sistema).
    // Sem esperar: pedido que so libera depois de TODAS as saidas nao tem opcao valida;
    // vai na ultima saida (em vez de travar o calculo)
    var ultimaSaida = Math.max.apply(null, t0);
    var libT = todosPed.map(function (p) { var x = liberacao(p); return esperar ? x : Math.min(x, ultimaSaida); });

    // disputam vaga os pedidos com local e id ainda nao visto (tipo 'c'); sem local = 'l';
    // id repetido fica sem tipo (ignorado). Quem nao cabe sem passar do cap e quem nao tem
    // local vao para plano.sobra; o resto e a onda do motor
    var jaVisto = new Set(), cands = [], tipo = [];
    todosPed.forEach(function (p, i) {
      if (jaVisto.has(String(p.id))) return;
      jaVisto.add(String(p.id));
      tipo[i] = localOk(inst.deposito, p) ? 'c' : 'l';
      if (tipo[i] === 'c') cands.push(i);
    });
    var fica = quemCabe(cands, promT, libT, t0, cap, esperar), idx = [];
    for (var iT = 0; iT < todosPed.length; iT++) {
      if (fica[iT]) idx.push(iT);
      else if (tipo[iT]) {
        plano.sobra.push(todosPed[iT].id);
        if (tipo[iT] === 'l') plano.semLocal.push(todosPed[iT].id);
      }
    }
    var ped = idx.map(function (i) { return todosPed[i]; }), n = ped.length;
    if (!n || !m) return plano;
    var prom = idx.map(function (i) { return promT[i]; });
    var lib = idx.map(function (i) { return libT[i]; });

    // ---------- matrizes: tempo (travel) e distancia (haversine); no 0 = patio, i+1 = pedido i
    var N = n + 1, pts = [inst.deposito].concat(ped);
    var T = new Float64Array(N * N), D = new Float64Array(N * N);
    for (var a = 0; a < N; a++) for (var b = 0; b < N; b++) {
      if (a === b) continue;
      T[a * N + b] = opts.travel(pts[a], pts[b]);
      D[a * N + b] = haversine(pts[a], pts[b]);
    }
    var porPrazo = function (x, y) { return prom[x] - prom[y] || x - y; };

    function podeIr(i, s) { return esperar || lib[i] <= t0[s]; }
    function saida(s, lista) {             // hora em que a rota sai do patio
      var t = t0[s];
      if (esperar) for (var k = 0; k < lista.length; k++) if (lib[lista[k]] > t) t = lib[lista[k]];
      return t;
    }
    // custo da rota na ordem dada; com pos, o ultimo pedido da lista vai para a posicao pos
    function custoOrdem(ini, ordem, pos) {
      var k = ordem.length, t = ini, prev = 0, c = 0;
      if (pos === undefined) pos = k - 1;
      for (var q = 0; q < k; q++) {
        var i = q < pos ? ordem[q] : q === pos ? ordem[k - 1] : ordem[q - 1], j = i + 1;
        t += T[prev * N + j];
        var atraso = t - prom[i];
        if (atraso > tol) c += PESO_ATRASO + atraso * PESO_SEG;
        c += D[prev * N + j];
        prev = j;
      }
      return c;
    }

    // ---------- c) ordem exata: permutacoes com poda ----------
    // A busca roda numa copia pequena das matrizes so com a rota (no 0 = patio, x+1 = x-esimo
    // pedido em ordem de prazo); em cada no a chegada e a multa de cada filho sao calculadas
    // uma vez so (servem ao limite inferior e ao filho). Estado fora da funcao recursiva.
    var kMax = Math.min(n, cap), S = kMax + 1;             // maior rota possivel; passo das copias
    var bT = new Float64Array(S * S), bD = new Float64Array(S * S), bP = new Float64Array(kMax), bMin = new Float64Array(kMax);
    var bUsado = new Uint8Array(kMax), bAtual = new Array(kMax), bChega = new Float64Array(kMax * kMax), bMulta = new Float64Array(kMax * kMax);
    var bPs = null, bK = 0, bMc = 0, bMelhor = null, bNos = 0, bTeto = 0;
    function ordemExata(ini, lista) {
      var ps = lista.slice().sort(porPrazo), k = ps.length, x, y;
      // sementes dao um teto bom para a poda: ordem de prazo e a ordem recebida com o ultimo
      // pedido em cada lugar (a busca local manda a rota otima + o pedido novo no fim)
      bPs = ps; bK = k; bMelhor = ps; bMc = custoOrdem(ini, ps); bNos = 0;
      bTeto = k <= 8 ? LIMITE_NOS : LIMITE_NOS / 10;
      for (var pos = 0; pos < k; pos++) {
        var c = custoOrdem(ini, lista, pos);
        if (c < bMc) { bMc = c; bMelhor = lista.slice(0, pos).concat(lista[k - 1], lista.slice(pos, k - 1)); }
      }
      for (x = 0; x <= k; x++) {           // copia local de tempo e distancia
        var gx = x ? ps[x - 1] + 1 : 0;
        for (y = 0; y <= k; y++) { var gy = y ? ps[y - 1] + 1 : 0; bT[x * S + y] = T[gx * N + gy]; bD[x * S + y] = D[gx * N + gy]; }
      }
      // menor distancia possivel para CHEGAR em cada pedido (do patio ou de outro da rota)
      for (x = 0; x < k; x++) {
        var best = bD[x + 1];              // patio -> pedido
        for (y = 0; y < k; y++) if (y !== x && bD[(y + 1) * S + x + 1] < best) best = bD[(y + 1) * S + x + 1];
        bMin[x] = best; bUsado[x] = 0; bP[x] = prom[ps[x]];
      }
      dfs(0, 0, ini, 0);
      return { c: bMc, ordem: bMelhor };
    }
    function dfs(prof, prev, t, c) {
      var k = bK, x;
      if (prof === k) { if (c < bMc - EPS) { bMc = c; bMelhor = bAtual.slice(0, k); } return; }
      if (++bNos > bTeto) return;
      // limite inferior: cada pedido restante chega no minimo em t + travel(atual, ele)
      // (travel respeita a desigualdade triangular) e custa no minimo bMin metros
      var lin = prev * S, col = prof * k, lb = c;
      for (x = 0; x < k; x++) if (!bUsado[x]) {
        var chega = t + bT[lin + x + 1], at = chega - bP[x], multa = at > tol ? PESO_ATRASO + at * PESO_SEG : 0;
        bChega[col + x] = chega; bMulta[col + x] = multa;
        lb += multa; lb += bMin[x];
      }
      if (lb >= bMc - EPS) return;
      for (x = 0; x < k; x++) if (!bUsado[x]) {    // filhos em ordem de prazo
        var nc = c + bD[lin + x + 1] + bMulta[col + x];
        if (nc >= bMc - EPS) continue;
        bUsado[x] = 1; bAtual[prof] = bPs[x];
        dfs(prof + 1, x + 1, bChega[col + x], nc);
        bUsado[x] = 0;
      }
    }

    // rota com memoria: mesmo conjunto + mesmo t0 = mesma resposta (a saida depende so disso).
    // Chave do conjunto = soma de 2^i (numero exato ate 52 pedidos); acima disso, texto.
    var grupoT0 = t0.map(function (x) { return t0.indexOf(x); });
    var memo = t0.map(function () { return new Map(); }), trabalho = 0, VAZIA = { c: 0, ordem: [] };
    var POT = [];
    for (var ip = 0; ip < n && ip <= 52; ip++) POT.push(Math.pow(2, ip));
    function chave(lista) {
      var ch = 0;
      if (n <= 52) for (var k = 0; k < lista.length; k++) ch += POT[lista[k]];
      else ch = lista.slice().sort(porIndice).join(',');
      return ch;
    }
    function rota(s, lista) {
      if (!lista.length) return VAZIA;
      trabalho++;
      var mp = memo[grupoT0[s]], ch = chave(lista), r = mp.get(ch);
      if (!r) { r = ordemExata(saida(s, lista), lista); mp.set(ch, r); trabalho += bNos / 10; }
      return r;
    }

    // ---------- estado do plano ----------
    var rotas = inst.slots.map(function () { return []; });
    var custo = new Float64Array(m);       // custo atual de cada rota
    var onde = new Int32Array(n).fill(-1); // em que saida esta cada pedido
    var ver = new Int32Array(m);           // versao de cada rota (para o cache da insercao)
    var sujo = new Uint8Array(m);          // rota mudou desde a ultima olhada da busca local
    function mudar(s, lista) {             // troca a rota s (guardada ja na ordem otima)
      var r = rota(s, lista);
      rotas[s] = r.ordem.slice(); custo[s] = r.c; ver[s]++; sujo[s] = 1;
      for (var k = 0; k < lista.length; k++) onde[lista[k]] = s;
    }
    function total() { var t = 0; for (var s = 0; s < m; s++) t += custo[s]; return t; }
    function sem(lista, x) { return lista.filter(function (y) { return y !== x; }); }
    function copia(r) { return r.slice(); }
    function idsDe(r) { return r.map(function (i) { return ped[i].id; }); }

    // ---------- vagas: a insercao nunca pode deixar pedido sem saida ----------
    // Cada pedido so serve em saidas com t0 >= lib (um "sufixo" das saidas no tempo). Com
    // conjuntos encaixados basta conferir, do lib mais tarde ao mais cedo, que os pedidos
    // livres com lib >= X cabem nas vagas das saidas com t0 >= X. folga() devolve a menor
    // sobra; (p, s) simula por o pedido p na saida s antes de conferir. quemCabe() ja
    // garantiu que no comeco tudo cabe; cada passo mantem isso.
    var saidasDesc = t0.map(function (_, s) { return s; }).sort(function (x, y) { return t0[y] - t0[x] || x - y; });
    var livresLib = [];                    // pedidos sem saida, do lib mais tarde ao mais cedo
    function folga(p, s) {
      var k = 0, vagas = 0, cont = 0, min = Infinity;
      for (var r = 0; r < livresLib.length; r++) {
        var q = livresLib[r];
        if (q === p) continue;
        while (k < m && (esperar || t0[saidasDesc[k]] >= lib[q])) {
          var sk = saidasDesc[k++];
          vagas += cap - rotas[sk].length - (sk === s ? 1 : 0);
        }
        if (vagas - (++cont) < min) min = vagas - cont;
      }
      return min;
    }
    function porLibDesc(x, y) { return lib[y] - lib[x] || x - y; }

    // ---------- a) insercao com arrependimento (regret-2) ----------
    // embaralhar = true: insere na ordem recebida (ja sorteada), cada pedido na sua melhor
    // saida - so no refinamento, para variar a reconstrucao.
    var cacheD = new Float64Array(n * m), cacheV = new Int32Array(n * m).fill(-1);
    function inserir(lista, embaralhar) {
      var livres = embaralhar ? lista.slice() : lista.slice().sort(porPrazo);
      livresLib = lista.slice().sort(porLibDesc);
      while (livres.length) {
        var folgado = folga(-1, -1) >= 1, escolha = null;  // com folga >= 1 qualquer vaga serve
        for (var li = 0; li < livres.length; li++) {
          var i = livres[li], b1 = Infinity, b2 = Infinity, s1 = -1;
          for (var s = 0; s < m; s++) {
            if (!podeIr(i, s) || rotas[s].length >= cap || (!folgado && folga(i, s) < 0)) continue;
            var ix = i * m + s;            // custo de por i em s, guardado ate a rota s mudar
            if (cacheV[ix] !== ver[s]) { cacheD[ix] = rota(s, rotas[s].concat(i)).c - custo[s]; cacheV[ix] = ver[s]; }
            var d = cacheD[ix];
            if (d < b1 - EPS) { b2 = b1; b1 = d; s1 = s; } else if (d < b2) b2 = d;
          }
          if (s1 < 0) continue;
          var reg = b2 - b1;               // Infinity se so ha uma saida possivel
          // maior arrependimento primeiro; empate fica com o prazo mais cedo (livres em ordem de prazo)
          if (!escolha || reg > escolha.reg + EPS) escolha = { i: i, s: s1, reg: reg, li: li };
          if (embaralhar) break;
        }
        // seguranca (so com conta invalida, ex.: travel devolvendo NaN): primeira vaga que
        // mantem todo mundo cabendo, da saida mais tarde; sempre existe, entao o cap nao estoura
        for (var lf = 0; !escolha && lf < livres.length; lf++) for (var kf = 0; kf < m; kf++) {
          var sf = saidasDesc[kf];
          if (podeIr(livres[lf], sf) && rotas[sf].length < cap && folga(livres[lf], sf) >= 0) { escolha = { i: livres[lf], s: sf, li: lf }; break; }
        }
        mudar(escolha.s, rotas[escolha.s].concat(escolha.i));
        livres.splice(escolha.li, 1);
        livresLib.splice(livresLib.indexOf(escolha.i), 1);
      }
    }

    // ---------- b) busca local: mover 1 / trocar 2 / trocar rotas, ate nao melhorar ----------
    // So reexamina pares de rotas em que pelo menos uma mudou desde a ultima olhada.
    // Teto de seguranca (3x o do refinamento) conferido a cada pedido, nao so a cada volta:
    // onda dificil (prazos iguais, entregas coladas, saidas juntas) passava dele numa volta
    // so. No replay o trabalho total nunca chega perto (maximo ~23 mil): la nada muda.
    function buscaLocal() {
      var teto = 3 * LIMITE_TRABALHO;
      for (var volta = 0; volta < LIMITE_VOLTAS && trabalho < teto; volta++) {
        var olhar = sujo.slice(), algum = false;
        for (var s = 0; s < m; s++) if (olhar[s]) algum = true;
        if (!algum) return;
        sujo.fill(0);
        var rever = function (A, B) { return olhar[A] || olhar[B] || sujo[A] || sujo[B]; };
        // mover: cada pedido vai para a saida que mais reduz o custo total
        for (var p = 0; p < n && trabalho < teto; p++) {
          var A = onde[p], semP = null, ganhoA = 0, melhorD = -EPS, melhorS = -1;
          for (var B = 0; B < m; B++) {
            if (B === A || !podeIr(p, B) || rotas[B].length >= cap || !rever(A, B)) continue;
            if (!semP) { semP = sem(rotas[A], p); ganhoA = rota(A, semP).c - custo[A]; }
            var dm = ganhoA + rota(B, rotas[B].concat(p)).c - custo[B];
            if (dm < melhorD) { melhorD = dm; melhorS = B; }
          }
          if (melhorS >= 0) { mudar(melhorS, rotas[melhorS].concat(p)); mudar(A, semP); }
        }
        // trocar: pedido p (rota A) <-> pedido q (rota B); aplica a primeira troca que melhora
        for (var p2 = 0; p2 < n && trabalho < teto; p2++) for (var q = p2 + 1; q < n; q++) {
          var rA = onde[p2], rB = onde[q];
          if (rA === rB || !podeIr(p2, rB) || !podeIr(q, rA) || !rever(rA, rB)) continue;
          var novaA = sem(rotas[rA], p2).concat(q), novaB = sem(rotas[rB], q).concat(p2);
          if (rota(rA, novaA).c + rota(rB, novaB).c - custo[rA] - custo[rB] < -EPS) { mudar(rA, novaA); mudar(rB, novaB); }
        }
        // trocar rotas inteiras entre duas saidas (ex.: a rota mais apertada sai mais cedo)
        for (var sA = 0; sA < m && trabalho < teto; sA++) for (var sB = sA + 1; sB < m; sB++) {
          var RA = rotas[sA], RB = rotas[sB];
          if ((!RA.length && !RB.length) || !rever(sA, sB)) continue;
          if (!RA.every(function (x) { return podeIr(x, sB); }) || !RB.every(function (x) { return podeIr(x, sA); })) continue;
          if (rota(sA, RB).c + rota(sB, RA).c - custo[sA] - custo[sB] < -EPS) { mudar(sA, RB); mudar(sB, RA); }
        }
      }
    }

    // ---------- e) plano inicial: o que a tela ja mostra, completado ----------
    // Cada id vai para a sua saida, na ordem dada, enquanto for valido (ver cabecalho); os
    // que faltam entram pela mesma insercao com arrependimento. Cada rota fica com a melhor
    // ordem conhecida: conjunto novo e buscado com a ordem dada como semente; conjunto que ja
    // estava na memoria (achado com teto de nos, rota de 9+ paradas) troca pela ordem dada
    // se ela for melhor. Assim um inicial completo e valido nunca sai pior do que veio.
    function montarInicial(lista) {
      var porId = indicePorId(ped);
      for (var s = 0; s < m; s++) rotas[s] = [];
      onde.fill(-1);
      livresLib = todos.slice().sort(porLibDesc);
      for (s = 0; s < m && s < lista.length; s++) {
        var ids = Array.isArray(lista[s]) ? lista[s] : [];
        for (var k = 0; k < ids.length; k++) {
          var p = porId.get(String(ids[k]));
          if (p === undefined || onde[p] >= 0 || !podeIr(p, s) || rotas[s].length >= cap || folga(p, s) < 0) continue;
          rotas[s].push(p); onde[p] = s;
          livresLib.splice(livresLib.indexOf(p), 1);
        }
      }
      for (s = 0; s < m; s++) {
        var dada = rotas[s], c = dada.length ? custoOrdem(saida(s, dada), dada) : 0;
        if (c < rota(s, dada).c) memo[grupoT0[s]].set(chave(dada), { c: c, ordem: dada.slice() });
        mudar(s, dada);
      }
      inserir(todos.filter(function (x) { return onde[x] < 0; }), false);
    }

    // ---------- montagem: plano do zero (e, se veio, o plano inicial) ----------
    var todos = [];
    for (var i0 = 0; i0 < n; i0++) todos.push(i0);
    inserir(todos, false);
    buscaLocal();
    if (inicial) {
      var doZero = rotas.map(copia), custoDoZero = total();
      montarInicial(inicial);
      plano.inicialCompletado = rotas.map(idsDe);
      buscaLocal();
      if (custoDoZero < total() - EPS) {   // o do zero ganhou: refina a partir dele (empate fica com o da tela)
        for (var sZ = 0; sZ < m; sZ++) mudar(sZ, doZero[sZ]);
        sujo.fill(0);
      }
    }

    // ---------- d) refinamento: destruir e reconstruir (ruin & recreate) ----------
    var sorteio = (function (x) {          // mulberry32 com semente fixa: sempre a mesma sequencia
      return function () {
        x = x + 0x6D2B79F5 | 0;
        var t = Math.imul(x ^ x >>> 15, 1 | x);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    })(20261031);
    function atrasados() {                 // pedidos atrasados no plano atual
      var out = [];
      for (var s = 0; s < m; s++) {
        var o = rotas[s], t = saida(s, o), prev = 0;
        for (var k = 0; k < o.length; k++) {
          t += T[prev * N + o[k] + 1]; prev = o[k] + 1;
          if (t - prom[o[k]] > tol) out.push(o[k]);
        }
      }
      return out;
    }
    function parecenca(x, y) { return D[(x + 1) * N + y + 1] + 5 * Math.abs(prom[x] - prom[y]); } // metros + 5 m/s de prazo
    var iter = (m > 1 && n > 2) ? ITER_POR_PEDIDO * n : 0;
    var melhor = total(), guardado = rotas.map(copia);
    for (var it = 0; it < iter && trabalho < LIMITE_TRABALHO; it++) {
      var tirar;
      if (sorteio() < 0.6) {               // uma semente (metade das vezes um atrasado) e os parecidos
        var late = atrasados();
        var semente = (late.length && sorteio() < 0.5) ? late[Math.floor(sorteio() * late.length)] : Math.floor(sorteio() * n);
        tirar = todos.slice().sort(function (x, y) { return parecenca(semente, x) - parecenca(semente, y) || x - y; })
          .slice(0, 2 + Math.floor(sorteio() * Math.min(5, n - 2)));
      } else {                             // duas rotas inteiras sorteadas
        var r1 = onde[Math.floor(sorteio() * n)], r2 = onde[Math.floor(sorteio() * n)];
        tirar = rotas[r1].concat(r1 === r2 ? [] : rotas[r2]);
      }
      var fora = {};
      tirar.forEach(function (x) { fora[x] = 1; });
      for (var s2 = 0; s2 < m; s2++) {
        var resto = rotas[s2].filter(function (x) { return !fora[x]; });
        if (resto.length !== rotas[s2].length) mudar(s2, resto);
      }
      var embaralhar = sorteio() < 0.5;    // metade das vezes reconstroi em ordem sorteada
      if (embaralhar) for (var e = tirar.length - 1; e > 0; e--) {
        var f = Math.floor(sorteio() * (e + 1)), tmp = tirar[e]; tirar[e] = tirar[f]; tirar[f] = tmp;
      }
      inserir(tirar, embaralhar);
      buscaLocal();
      var c = total();
      if (c < melhor - EPS) { melhor = c; guardado = rotas.map(copia); }
      else if (c > melhor + EPS) {         // piorou: volta ao melhor (que ja e otimo local)
        for (var s3 = 0; s3 < m; s3++) mudar(s3, guardado[s3]);
        sujo.fill(0);
      }                                    // empatou: segue do novo (ajuda a variar)
    }

    // ---------- saida: cada rota do melhor plano, na sua ordem exata ----------
    for (var sF = 0; sF < m; sF++) plano[sF] = idsDe(rota(sF, guardado[sF]).ordem);
    return plano;
  }

  // ---------- avaliar: as contas do motor para um plano qualquer (para a tela mostrar) ----------
  // Mesmo travel, mesma tolS, mesma saida do patio e mesma linha reta (so ida) do motor.
  // Id desconhecido no plano e ignorado (ids diz quem foi avaliado, na ordem). Pedido sem
  // local (ver cabecalho) entra so na hora de saida (com esperar) e vai para semLocal.
  function avaliar(inst, plano, opts) {
    var ped = inst.pedidos || [], tol = opts.tolS || 0, esperar = !!opts.esperar;
    var prom = prazosSeguros(ped, inst.slots), porId = indicePorId(ped);
    return inst.slots.map(function (slot, s) {
      var lista = [], dados = (plano && Array.isArray(plano[s])) ? plano[s] : [];
      dados.forEach(function (id) { var i = porId.get(String(id)); if (i !== undefined) lista.push(i); });
      var sai = slot.t0;
      if (esperar) lista.forEach(function (i) { var l = liberacao(ped[i]); if (l > sai) sai = l; });
      var r = { sai: sai, ids: [], chegadas: [], prazos: [], atrasados: 0, segAtraso: 0, metros: 0, semLocal: [] };
      var t = sai, prev = inst.deposito;
      lista.forEach(function (i) {
        var p = ped[i];
        if (!localOk(inst.deposito, p)) { r.semLocal.push(p.id); return; }
        t += opts.travel(prev, p);
        r.metros += haversine(prev, p);
        r.ids.push(p.id); r.chegadas.push(t); r.prazos.push(prazo(p));
        var atraso = t - prom[i];
        if (atraso > tol) { r.atrasados++; r.segAtraso += atraso; }
        prev = p;
      });
      return r;
    });
  }

  var api = { planejar: planejar, avaliar: avaliar };
  // navegador (ou worker): so MotorRota no global, mesmo que a pagina tenha um "module";
  // Node (sem window): module.exports
  if (typeof window === 'undefined' && typeof module !== 'undefined' && module && module.exports) module.exports = api;
  else raiz.MotorRota = api;
})(typeof window !== 'undefined' ? window : this);

function dist(m){

/* 24/09/2026, pedido do Fabio: ao lado de cada entrega, um quadradinho com a MESMA COR da rota no TrackEat,
   para bater o olho e saber qual motoboy leva. A API do TrackEat NAO manda a cor: o site dele calcula na tela.
   Aqui esta a MESMA regra copiada do site (main.3220af9f.js, funcao K2): cada rota (grupo) ganha uma cor pelo
   numero dela; se uma rota a menos de 6 km ja tem cor parecida, tenta a proxima da sequencia (ate 80).
   Rotas maiores escolhem primeiro. O TrackEat tambem lembra a cor no navegador de quem esta olhando,
   entao em caso raro (rota que mudou de vizinhanca) a cor la pode ter ficado a antiga. */
function teHsl(h,s,l){
  h=(h%360+360)%360; s=Math.min(Math.max(s,0),100)/100; l=Math.min(Math.max(l,0),100)/100;
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs(h/60%2-1)), m=l-c/2, r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  return '#'+[r,g,b].map(function(v){return Math.round(255*(v+m)).toString(16).padStart(2,'0')}).join('');
}
function teCor(e,t){ var S=[68,74,80,86], L=[42,48,54,60]; return teHsl((137.508*e+53*t)%360, S[(e+t)%4], L[(3*e+t)%4]); }
function teKm(a,b,c,d){ var R=function(x){return x*Math.PI/180}, r=R(c-a), o=R(d-b),
  s=Math.sin(r/2)*Math.sin(r/2)+Math.cos(R(a))*Math.cos(R(c))*Math.sin(o/2)*Math.sin(o/2);
  return 12742*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }
function teRgb(h){ var n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function teDif(a,b){ var x=teRgb(a), y=teRgb(b); return Math.sqrt(Math.pow(x[0]-y[0],2)+Math.pow(x[1]-y[1],2)+Math.pow(x[2]-y[2],2)); }
function coresRotas(lista){
  var gs={}, ordem=[];
  (lista||[]).forEach(function(p){ var g=Number(p.g); if(!g||p.lat==null||p.lng==null) return;
    if(!gs[g]){gs[g]={g:g,pts:[]};ordem.push(gs[g]);} gs[g].pts.push([Number(p.lat),Number(p.lng)]); });
  var rs=ordem.map(function(x){ var n=x.pts.length;
    return {g:x.g, lat:x.pts.reduce(function(a,p){return a+p[0]},0)/n, lng:x.pts.reduce(function(a,p){return a+p[1]},0)/n, n:n}; })
    .sort(function(a,b){ return b.n!==a.n ? b.n-a.n : a.g-b.g; });
  var feitos=[], out={};
  var perto=function(e){ return feitos.filter(function(t){ return teKm(e.lat,e.lng,t.lat,t.lng)<6; }); };
  var serve=function(c,e){ return perto(e).every(function(t){ return c!==t.cor && teDif(c,t.cor)>=90; }); };
  var nota=function(c,e){ var v=perto(e); if(!v.length) return Infinity;
    return Math.min.apply(null, v.map(function(t){ var r=teKm(e.lat,e.lng,t.lat,t.lng), o=teDif(c,t.cor), s=o+4*r;
      if(c===t.cor) s-=1e5; if(o<90) s-=1e3*(90-o); return s; })); };
  rs.forEach(function(e){
    var k=String(e.g), hsh=0; for(var i=0;i<k.length;i++) hsh=(31*hsh+k.charCodeAt(i))>>>0;
    var cor=null, melhor=null, mv=-Infinity;
    for(var o=0;o<80;o++){ var c=teCor(hsh,o); if(serve(c,e)){cor=c;break;} var a=nota(c,e); if(a>mv){mv=a;melhor=c;} }
    cor=cor||melhor||teCor(hsh,0);
    feitos.push({lat:e.lat,lng:e.lng,cor:cor}); out[e.g]=cor;
  });
  return out;
}

/* 20/10/2026, pedido do Fabio: "o mapa de cada rota que os pias ainda tem pra fazer... uma especie de minimapa".
   Dentro de cada quadro da rua: a casa = loja (patio_loja), a moto = GPS dele agora (o mesmo da distancia),
   e as entregas que FALTAM numeradas na ordem da rota do TrackEat (coluna sequencia). Entregue some sozinho.
   A linha tracejada liga os pontos em LINHA RETA na ordem da rota - nao e o caminho de rua.
   Mapa parado (sem arrastar nem zoom), montado de novo a cada leitura de 60 s. Mapa de fundo: OpenStreetMap.
   23/10/2026: o CARTO passou a pedir chave paga e o fundo virou "API KEY REQUIRED" sem ruas; trocado pelo OpenStreetMap
   (gratis, sem chave), escurecido por filtro para combinar com a tela escura.
   Se a biblioteca do mapa nao carregar, o quadro fica como era antes, sem mapa. */
var MM=[];
function ordemRota(lista){
  var ps=(lista||[]).map(function(p){var c={};for(var k in p)c[k]=p[k];return c;});
  if(ps.length&&ps.every(function(p){return p.seq!=null;})){
    ps.sort(function(a,b){return (Number(a.grupo)||0)-(Number(b.grupo)||0)||a.seq-b.seq;});
    ps.forEach(function(p,i){p._n=i+1;});
  }
  return ps;
}
/* 20/10/2026, pedido do Fabio: "o endereco real" e "quando apertar em cima do numero do pedido, abrir para ver quais itens".
   O endereco vem do TrackEat (o mesmo que o motoboy ve). Na lista vai rua, numero e bairro; o complemento aparece ao abrir o pedido.
   Os itens vem do Saipos pela porta fila_pedido_itens, SO no toque (sem timer). O Saipos e lido de 10 em 10 min:
   pedido recem-feito pode ainda nao ter itens, e a janela diz isso em vez de mostrar vazio. Sem preco.
   28/10/2026, pedido do Fabio: "qdo abrir o pedido ja colocar o nome do cliente... pra facilitar". O nome (do TrackEat,
   o mesmo que o motoboy ve) e a hora de entrega aparecem no alto da janela. Excecao a regra das iniciais, decidida
   por ele; so quem tem a tela Fila de Pedidos ve. A hora vem da ultima leitura da tela (pedDe), a mesma da lista. */
function pedDe(num){

  (Array.isArray(d.na_rua)?d.na_rua:[]).forEach(function(m){ (m.pedidos||[]).forEach(function(p){ if(!r&&String(p.pedido)===num) r=p; }); });

}

function qtd(q){ var n=Number(q); if(!isFinite(n)) return ''; return (n%1===0?String(n):String(n).replace('.',','))+'×'; }
function fechaPedido(){ var m=$('pdm'); if(m) m.remove(); }

var MAPA_FUNDO='https://tile.openstreetmap.org/{z}/{x}/{y}.png', MAPA_ATRIB='© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
function mmIcone(html,cls,st,t){ t=t||22; return L.divIcon({className:'',html:'<div class="'+cls+'"'+(st?' style="'+st+'"':'')+'>'+html+'</div>',iconSize:[t,t],iconAnchor:[t/2,t/2]}); }
/* desenha loja, moto e entregas que faltam (mesma regra do minimapa) dentro de "alvo" (mapa ou camada); devolve os pontos para enquadrar */
function desenhaRota(alvo,d,m,ps,semLinha,apaga){
  var op=apaga?.22:1;
  var cor=(ps[0].grupo&&COR[Number(ps[0].grupo)])||'#E0A81C', pts=[], linha=[], gp=null;
  if(d.loja&&d.loja.lat!=null&&d.loja.lng!=null){ var lj=[+d.loja.lat,+d.loja.lng]; pts.push(lj); L.marker(lj,{icon:mmIcone('🏠','mm-e'),interactive:false}).addTo(alvo); }
  if(m.gps&&m.gps.lat!=null&&m.gps.lng!=null){ gp=[+m.gps.lat,+m.gps.lng]; pts.push(gp); linha.push(gp); }
  ps.forEach(function(p){ var q=[+p.lat,+p.lng]; pts.push(q); linha.push(q); });
  if(linha.length>1&&!semLinha) L.polyline(linha,{color:cor,weight:3,opacity:.9*op,dashArray:'6 6',interactive:false}).addTo(alvo);
  ps.forEach(function(p){ var mk=L.marker([+p.lat,+p.lng],{opacity:op,icon:mmIcone(p._n||'•','mm-n'+(p.atrasado?' late':''),'background:'+cor)})
    .bindTooltip(fichaRua(p,m),{direction:'top',offset:[0,-10],className:'mm-dica'}).on('click',function(){abrePedido(p.pedido);}).addTo(alvo);
    if(MKREG) MKREG[p.pedido]=mk; });
  if(gp) L.marker(gp,{opacity:op,icon:mmIcone('🛵','mm-e'),zIndexOffset:1000,interactive:false}).addTo(alvo);
  return pts;
}

/* 25/10/2026, pedido do Fabio ("melhor esses quadradinhos ou um mapa inteiro?", previa aprovada): no lugar de um
   minimapa por quadro, UM mapa grande com todos os motoboys na rua, cada um na cor da rota dele e o nome junto da moto.
   Toque no quadro de um motoboy (ou no nome dele no mapa): a rota dele fica acesa e as outras apagadas; toque de novo
   volta a todos. O botao "ruas" de cada quadro abre o mapa grande de antes (caminho pelas ruas e tempo de cada trecho).
   A leitura de 60 s monta o mapa de novo: se a pessoa mexeu no zoom ou arrastou, o mapa volta onde ela deixou.
   No celular o mapa nao arrasta com um dedo (para a pagina rolar); da para aproximar com dois dedos ou nos botoes +/-. */
var DEST=null, MV=null;
function primeiroNome(n){ var p=String(n||'').replace(/^\d+\s+GME\s+/i,'').split(/\s+/); return p[0]||n; }
function minimapas(d){
  window.ULT_D=d;
  MM.forEach(function(x){try{x.remove()}catch(e){}}); MM=[];
  if(!window.L||!d) return;
  var el=$('mapao'); MAPA_MK={};
  if(el){ try{
    MKREG=MAPA_MK;
    var rua=Array.isArray(d.na_rua)?d.na_rua:[];
    if(DEST&&!rua.some(function(m){return m.motoboy===DEST;})){ DEST=null; MV=null; }
    if(MV&&(MV.uni!==UNI||MV.dest!==DEST)) MV=null;
    var mp=L.map(el,{zoomControl:true,scrollWheelZoom:false,dragging:!L.Browser.mobile,zoomSnap:0.25});
    MM.push(mp);
    mp.attributionControl.setPrefix(false);
    L.tileLayer(MAPA_FUNDO,{maxZoom:19,className:'mm-fundo',attribution:MAPA_ATRIB}).addTo(mp);
    var todos=[], foco=[];
    if(d.loja&&d.loja.lat!=null&&d.loja.lng!=null){ var lj=[+d.loja.lat,+d.loja.lng]; todos.push(lj); foco.push(lj);
      L.marker(lj,{icon:mmIcone('🏠','mm-e',null,26),zIndexOffset:2000,interactive:false}).addTo(mp); }
    rua.forEach(function(m){
      var ps=pontosRota(m); if(!ps.length) return;
      var apaga=!!DEST&&DEST!==m.motoboy, cor=(ps[0].grupo&&COR[Number(ps[0].grupo)])||'#E0A81C';
      var pts=desenhaRota(mp,{},m,ps,false,apaga);
      todos=todos.concat(pts); if(DEST===m.motoboy) foco=foco.concat(pts);
      var gp=(m.gps&&m.gps.lat!=null&&m.gps.lng!=null)?[+m.gps.lat,+m.gps.lng]:[+ps[0].lat,+ps[0].lng];
      if(!apaga) L.marker(gp,{icon:L.divIcon({className:'',html:'<div class="mm-nome" style="background:'+cor+'">'+esc(primeiroNome(m.motoboy))+'</div>',iconSize:null,iconAnchor:[-14,9]}),zIndexOffset:1500,title:m.motoboy})
        .on('click',function(){ escolheMb(m.motoboy); }).addTo(mp);
    });
    (Array.isArray(d.na_loja)?d.na_loja:[]).forEach(function(p){
      if(p.lat==null||p.lng==null) return;
      var ll=[+p.lat,+p.lng], apaga=!!DEST&&p.motoboy!==DEST;
      MAPA_MK[p.pedido]=L.marker(ll,{opacity:apaga?.22:1,zIndexOffset:p.atrasado?600:400,
                   icon:L.divIcon({className:'',iconSize:[0,0],iconAnchor:[0,0],
                     html:'<div class="mm-l '+(p.onde==='preparo'?'mm-prep':'mm-pron')+(p.atrasado?' late':'')+'">'+esc(p.pedido)+'</div>'})})
        .bindTooltip(fichaLoja(p),{direction:'top',offset:[0,-12],className:'mm-dica'})
        .on('click',function(){ abrePedido(p.pedido); }).addTo(mp);
      todos.push(ll); if(DEST&&p.motoboy===DEST) foco.push(ll);
    });
    try{ rsMapa(mp,d); }catch(e){}
    /* o 1o movimento e o enquadramento da propria tela; dai em diante so a PESSOA mexe (arrastar, botoes +/-, pinca) */
    var auto=true;
    mp.on('moveend',function(){ if(auto){ auto=false; return; } MV={c:mp.getCenter(),z:mp.getZoom(),uni:UNI,dest:DEST}; });
    MKREG=null;
    if(MV) mp.setView(MV.c,MV.z);
    else{ var alvo=(DEST&&foco.length>1)?foco:todos; if(alvo.length) mp.fitBounds(alvo,{padding:[30,30],maxZoom:16}); else auto=false; }
  }catch(e){ MKREG=null; } }
  try{ atualizaMapa(d); }catch(e){}
}
/* a ficha de cada pedido no mapa: os mesmos dados da lista (numeros, tempo, hora prometida, endereco), nada novo.

   cliente... pra facilitar"; perguntado, escolheu "Nome inteiro" (regra 115). O nome vem do TrackEat (o mesmo que o

   no mapa". Os pedidos da loja viraram etiqueta com o numero do Saipos; o 📍 ao lado do numero na lista leva o mapa

var MAPA_MK={}, MKREG=null;
function vm(p,reserva){
  if(p.lat!=null&&p.lng!=null) return '<span class="vm" data-mapa="'+esc(p.pedido)+'" title="mostrar este pedido no mapa">📍</span>';
  return reserva?'<span class="vm vz"></span>':'';
}
function mapaTodos(){ DEST=null; MV=null;
  var q=document.querySelector('#app .quadros');
  if(q){ q.classList.remove('foco'); q.querySelectorAll('.qd.sel').forEach(function(x){ x.classList.remove('sel'); }); }
  minimapas(window.ULT_D); }
function verNoMapa(ped){
  if(!window.L) return;
  if(DEST&&MAPA_MK[ped]&&MAPA_MK[ped].options.opacity<1) mapaTodos();   /* pedido apagado por causa do motoboy escolhido */
  var mk=MAPA_MK[ped], mp=MM[0], sec=$('sec_mapa');
  if(!mk||!mp) return;
  if(sec&&sec.scrollIntoView) sec.scrollIntoView({behavior:'smooth',block:'start'});
  mp.setView(mk.getLatLng(),Math.max(mp.getZoom(),15),{animate:false});
  mk.openTooltip();
  var e=mk.getElement(), alvo=e&&(e.querySelector('.mm-l,.mm-n')||e);
  if(alvo){ alvo.classList.remove('mm-pisca'); void alvo.offsetWidth; alvo.classList.add('mm-pisca'); }
}
function escolheMb(nome){
  DEST=(DEST===nome)?null:nome; MV=null;
  var q=document.querySelector('#app .quadros');
  if(q){ q.classList.toggle('foco',!!DEST);
    q.querySelectorAll('.qd[data-mb]').forEach(function(x){ x.classList.toggle('sel',x.getAttribute('data-mb')===DEST); }); }
  minimapas(window.ULT_D);
}
document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target:null; if(!t) return;
  var b=t.closest('[data-ruas]'); if(b){ abreMapa(b.getAttribute('data-ruas')); return; }
  var vmb=t.closest('[data-mapa]'); if(vmb){ verNoMapa(vmb.getAttribute('data-mapa')); return; }
  if(t.closest('[data-ped]')) return;
  var q=t.closest('#app .qd[data-mb]'); if(q) escolheMb(q.getAttribute('data-mb'));
});
/* 23/10/2026, pedido do Fabio: "qdo eu clicar em cima do mapa quero que ele aumente e mostre a rota mais aproximada
   que de pra ver o nome das ruas". Toque no minimapa abre o mesmo mapa grande, com zoom (botoes +/-, roda do mouse,
   pinca) e arraste, ja enquadrado perto o bastante para ler as ruas. Toque numa bolinha abre os itens do pedido.
   A cada leitura de 60 s os pontos se atualizam sem mexer no zoom que a pessoa escolheu. Se o motoboy sumir da lista
   na rua, o mapa grande avisa. O caminho pelas ruas e o tempo de cada trecho vem do bloco de 24/10/2026 (rotaRuas). */
var MG=null;
function fechaMapa(){ if(!MG) return; try{MG.mp.remove()}catch(e){} if(MG.el) MG.el.remove(); MG=null; }
function abreMapa(nome){
  fechaMapa();
  var d=window.ULT_D; if(!window.L||!d) return;
  var m=(Array.isArray(d.na_rua)?d.na_rua:[]).filter(function(x){return x.motoboy===nome;})[0];
  var ps=pontosRota(m); if(!ps.length) return;
  var w=document.createElement('div'); w.className='pmg'; w.id='pmg';
  w.onclick=function(e){ if(e.target===w) fechaMapa(); };
  w.innerHTML='<div class="cx"><div class="tp"><b>'+esc(nome)+'</b><small id="pmg_h"></small><button class="fx" onclick="fechaMapa()" title="fechar">✕</button></div><div class="av" id="pmg_av" style="display:none"></div><div class="mg" id="pmg_m"></div><div class="lr" id="pmg_l"></div></div>';
  document.body.appendChild(w);
  var mp=L.map($('pmg_m'),{zoomControl:true,zoomSnap:0.5});
  mp.attributionControl.setPrefix(false);
  L.tileLayer(MAPA_FUNDO,{maxZoom:19,className:'mm-fundo',attribution:MAPA_ATRIB}).addTo(mp);
  var cam=L.layerGroup().addTo(mp);
  MG={mp:mp,cam:cam,nome:nome,uni:UNI,el:w,rr:null,pend:null,falhou:null};
  var pts=pintaMapa(d,m,ps);
  mp.invalidateSize();
  mp.fitBounds(pts,{padding:[40,40],maxZoom:17});
  rotaRuas();
}
function atualizaMapa(d){
  if(!MG) return;
  if(MG.uni!==UNI){ fechaMapa(); return; }
  var m=(Array.isArray(d.na_rua)?d.na_rua:[]).filter(function(x){return x.motoboy===MG.nome;})[0];
  var ps=pontosRota(m), av=$('pmg_av');
  if(!ps.length){ if(av){ av.textContent=(m?'Sem entrega com endereço no mapa nesta leitura':'Não aparece mais na rua nesta leitura')+' — o mapa ficou como estava antes.'; av.style.display=''; } return; }
  if(av) av.style.display='none';
  MG.falhou=null;
  pintaMapa(d,m,ps);
  rotaRuas();
}

/* 24/10/2026, pedido do Fabio: "quero o caminho pelas ruas" e "uma estimativa de qto tempo vai demorar cada entrega...
   o tempo que vai durar uma entrega para outra". SO no mapa grande (o minimapa continua em linha reta, sem chamada nova).
   Quem calcula e o servico publico de rotas OSRM, sobre o mapa do OpenStreetMap (gratis, sem chave): caminho de CARRO,
   SEM transito e SEM o tempo parado na porta - por isso a tela escreve "estimativa" e diz isso embaixo.
   Comeca no GPS dele (sem GPS, na loja) e segue a ordem da rota do TrackEat. Uma chamada ao abrir e no maximo uma por
   leitura de 60 s, so quando a moto ou as entregas mudaram. Tempo de um trecho so aparece junto das entregas que ele
   mediu; se o servico nao responder, volta a linha reta e a tela avisa. Nada disso vai para o banco.
   Vai ao OSRM so a coordenada (4 casas, ~10 m), nunca nome nem endereco. */
var ROTAS='https://router.project-osrm.org/route/v1/driving/';
function inicioRota(d,m){
  if(m&&m.gps&&m.gps.lat!=null&&m.gps.lng!=null) return {ll:[+m.gps.lat,+m.gps.lng],gps:true};
  if(d&&d.loja&&d.loja.lat!=null&&d.loja.lng!=null) return {ll:[+d.loja.lat,+d.loja.lng],gps:false};
  return null;
}
function chaveRota(ini,ps){ return [ini.ll].concat(ps.map(function(p){return [+p.lat,+p.lng];})).map(function(q){return q[1].toFixed(4)+','+q[0].toFixed(4);}).join(';'); }
function minTxt(s){ return '~'+Math.max(1,Math.round(s/60))+' min'; }
function kmTxt(mt){ return mt<1000?(Math.round(mt/10)*10)+' m':(mt/1000).toFixed(1).replace('.',',')+' km'; }
function pintaMapa(d,m,ps){
  MG.d=d; MG.m=m; MG.ps=ps;
  var ini=inicioRota(d,m), ch=ini?chaveRota(ini,ps):null;
  var rr=(MG.rr&&MG.rr.chave===ch)?MG.rr:null;
  MG.cam.clearLayers();
  var pts=desenhaRota(MG.cam,d,m,ps,!!rr);
  var cor=(ps[0].grupo&&COR[Number(ps[0].grupo)])||'#E0A81C';
  if(rr){
    L.polyline(rr.linha,{color:cor,weight:5,opacity:.95,interactive:false}).addTo(MG.cam);
    ps.forEach(function(p,i){ var lg=rr.legs[i]; if(!lg) return;
      L.circleMarker([+p.lat,+p.lng],{radius:1,opacity:0,fillOpacity:0,interactive:false})
        .bindTooltip(minTxt(lg.duration),{permanent:true,direction:'right',offset:[12,0],className:'mm-tt'}).addTo(MG.cam); });
  }
  $('pmg_h').textContent=rotuloMapa(d,ps);
  listaRota(ini,ps,rr,cor);
  return pts;
}
function listaRota(ini,ps,rr,cor){
  var el=$('pmg_l'); if(!el) return;
  var h;
  if(rr) h='<div class="nt">Tempo rodando de um ponto ao outro — <b>estimativa</b> do serviço de rotas OSRM (mapa OpenStreetMap): de carro, sem trânsito e sem o tempo parado na porta.'+(ini&&!ini.gps?' Sem GPS dele: contado a partir da loja.':'')+'</div>';
  else if(MG.falhou===chaveRota(ini||{ll:[0,0]},ps)) h='<div class="nt">O serviço de rotas não respondeu agora — o mapa mostra a linha reta, sem tempo estimado. Tenta de novo na próxima leitura.</div>';
  else if(!ini) h='<div class="nt">Sem GPS e sem a posição da loja: não dá para calcular o caminho.</div>';
  else h='<div class="nt">Calculando o caminho pelas ruas…</div>';
  var tot=0, totm=0;
  ps.forEach(function(p,i){
    var lg=rr&&rr.legs[i], de=i===0?(ini&&ini.gps?'🛵':'🏠'):String(ps[i-1]._n||i);
    if(lg){ tot+=lg.duration; totm+=lg.distance; }
    h+='<div class="ln"><span class="sq" style="background:'+cor+'">'+esc(p._n||'•')+'</span>'+
       '<span><span data-ped="'+esc(p.pedido)+'">'+esc(p.pedido)+'</span><div class="ed">'+esc(endCurto(p.end))+'</div></span>'+
       (lg?'<span class="tm">'+esc(de)+' → '+esc(p._n||'')+': '+minTxt(lg.duration)+'<small>'+kmTxt(lg.distance)+' · '+minTxt(tot)+' no total</small></span>':'')+
       '</div>';
  });
  if(rr&&ps.length>1) h+='<div class="ln tt"><span>Até a última entrega</span><span class="tm">'+minTxt(tot)+'<small>'+kmTxt(totm)+' rodando</small></span></div>';
  el.innerHTML=h;
}
async function rotaRuas(){
  if(!MG||!MG.ps) return;
  var ini=inicioRota(MG.d,MG.m); if(!ini) return;
  var ch=chaveRota(ini,MG.ps);
  if((MG.rr&&MG.rr.chave===ch)||MG.pend===ch||MG.falhou===ch) return;
  MG.pend=ch; var eu=MG;
  var ac=window.AbortController?new AbortController():null, to=setTimeout(function(){ if(ac) ac.abort(); },10000);
  var rr=null;
  try{
    var r=await fetch(ROTAS+ch+'?overview=full&geometries=geojson&steps=false',ac?{signal:ac.signal}:{});
    var j=r.ok?await r.json():null, ro=j&&j.code==='Ok'&&j.routes&&j.routes[0];
    if(ro&&ro.geometry&&Array.isArray(ro.legs)&&ro.legs.length===ch.split(';').length-1)
      rr={chave:ch,linha:ro.geometry.coordinates.map(function(c){return [c[1],c[0]];}),legs:ro.legs};
  }catch(e){}
  clearTimeout(to);
  if(MG!==eu) return;
  var ini2=inicioRota(MG.d,MG.m);
  if(!ini2||chaveRota(ini2,MG.ps)!==ch) return;   /* resposta de pontos que ja mudaram: a chamada nova cuida */
  MG.pend=null;
  if(rr){ MG.rr=rr; MG.falhou=null; } else MG.falhou=ch;
  try{ pintaMapa(MG.d,MG.m,MG.ps); }catch(e){}
}
/* horas do proprio dado (as mesmas do rodape da tela), nunca o relogio do navegador */
function rotuloMapa(d,ps){
  return ps.length+' entrega'+(ps.length===1?'':'s')+' faltando · '+
    (TEP?'TrackEat sem dado desde '+TEP:'TrackEat lido às '+(d.visto_em||'—')+' · GPS lido às '+(d.gps_visto_em||'—'));
}

/* 25/10/2026, pedido do Fabio: "quero o numero do saipos e do ifood". O numero grande e o do Saipos (o mesmo do
   TrackEat); ao lado vai o numero curto do iFood (o que o cliente e o Gestor de Pedidos mostram), vindo do banco
   (fila_pedidos_calc, campo ifood). Pedido que nao e do iFood fica sem. Na lista da loja o espaco fica reservado
   mesmo vazio, para os numeros ficarem alinhados. */
function ifn(p){
  return p.ifood?'<span class="ifn" title="número do pedido no iFood (o mesmo do Gestor de Pedidos e do cliente)">iFood '+esc(p.ifood)+'</span>'
                :'<span class="ifn vz"></span>';
}
function legenda(d){
  var g=d.regua;
  return '<div class="leg"><span class="bola b-vm"></span>em preparo na cozinha &nbsp;·&nbsp; '+
    '<span class="bola b-rx"></span>pronto, esperando motoboy'+
    '<br>O número grande é o do Saipos; ao lado, em vermelho, o número do mesmo pedido no iFood. Pedido que não é do iFood fica só com o do Saipos. A ligação entre os dois vem do Saipos (lido de 15 em 15 minutos) ou, enquanto ele não chega, da API do iFood pelo nome do cliente — por isso o número do iFood aparece assim que o pedido entra.'+
    (g?'<br>O tempo fica vermelho quando passa do normal desta loja: '+esc(g.ate_sair)+
       ' min da entrada até sair com o motoboy e '+esc(g.ate_entregar)+' min até ser entregue '+
       '(mediana dos últimos '+esc(g.amostra)+' pedidos entregues, medida às '+esc(g.medida_em)+').'
      :'<br>Sem histórico suficiente desta loja para dizer o que é demora — nenhum tempo está destacado.')+
    '</div>';
}

function rodape(d){
  return 'Os pedidos vêm do TrackEat, lidos pela última vez às '+esc(d.visto_em||'—')+'. Tela montada às '+esc(d.agora)+'.'+
    '<br>Pedido que não passa pelo TrackEat (balcão, telefone) não aparece aqui.'+
    '<br>A distância ao lado do pedido é do GPS do motoboy até o endereço, <b>em linha reta</b> — de moto o caminho é maior.'+
    ' Verde = está a menos de 300 m dele. Amarelo = 3 km ou mais.'+
    ' GPS lido pela última vez às '+esc(d.gps_visto_em||'—')+'. Motoboy sem sinal fica marcado <b>sem GPS</b> e os pedidos dele ficam sem distância,'+
    ' em vez de receber um número inventado.'+
    '<br>O quadradinho colorido é a cor da rota no mapa do TrackEat (mesma regra de cor do site dele): pedidos da mesma cor vão com o mesmo motoboy.'+
    '<br>O mapa dos pedidos mostra a loja (🏠), os pedidos da loja com o número do Saipos (vermelho = em preparo, roxo = pronto; o 📍 na lista leva até ele), onde cada motoboy está agora pelo GPS (🛵, com o nome ao lado) e só as entregas que ainda faltam, numeradas na ordem da rota do TrackEat (1 = a próxima). A linha tracejada é em linha reta, não é o caminho de rua. Tocando no quadro de um motoboy (ou no nome dele no mapa) só a rota dele fica acesa. O botão 🔍 ruas abre o mapa grande dele, com o caminho pelas ruas e o tempo estimado de um ponto ao outro (serviço de rotas OSRM: de carro, sem trânsito e sem o tempo parado na porta). Bolinha com anel vermelho = passando do normal.'+
    '<br>Toque no número de um pedido (ou na bolinha dele no mapa) para ver os itens, o endereço e o complemento. Os itens vêm do Saipos, lido de 10 em 10 minutos.'+
    '<br>A tela se atualiza sozinha a cada minuto e o TrackEat também é lido de minuto em minuto.'+
    (UNI==='Água Verde'?'<br>A caixa 🧭 Rota sugerida é uma conta feita aqui na tela (não é o TrackEat e não manda nada para ele): junta os pedidos prontos em rotas para ninguém atrasar; se dá, usa o menor número de motoboys e, depois, menos km. O botão "Máximo por rota" fica guardado neste aparelho.':'');
}

/* 24/09/2026, pedido do Fabio: "o quadro tem que estar completamente vivo".
   A tela le o banco a cada 60 s (regra 15 do portal: rede nunca abaixo de 60 s) e o robo do TrackEat
   passou a rodar de minuto em minuto, entao o que aparece tem no maximo ~2 min.
   O selo "ao vivo" no topo conta os segundos desde a ultima leitura boa SEM usar a internet (so relogio na tela)
   e fica VERMELHO se passar de 3 min sem conseguir. Os dois timers param quando a aba sai da frente. */
/* 30/09/2026, pedido do Fabio (telas honestas): quando a fonte parou, a tela diz desde quando em vez de
   mostrar zero e selo verde. Quem sabe desde quando cada fonte parou e o medidor de frescor (fato_frescor,
   ja aberto para leitura; aqui lemos 2 linhas). Lido no maximo 1x a cada 10 min, dentro da leitura normal (sem timer novo). */
var FR=null, FR_EM=0, TEP=null;
async function frPega(){
  if(FR&&Date.now()-FR_EM<600000) return FR;
  try{
    var r=await fetch(SB+'fato_frescor?select=fonte,ultimo_dia,farol&fonte=in.(delivery_entrega,delivery_pedido)',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    if(r.ok){var o={};(await r.json()).forEach(function(x){o[x.fonte]=x;});FR=o;FR_EM=Date.now();}
  }catch(e){}
  return FR;
}
function frParado(f){var x=FR&&FR[f];if(!x||x.farol!=='PARADO'||!x.ultimo_dia)return null;var p=String(x.ultimo_dia).split('-');return p[2]+'/'+p[1];}
var VEZ=0, OK_EM=0;
async function boot(){
  const t=(function(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}})();
  const minha=++VEZ, uni=UNI;
  const [d,cz,pn]=await Promise.all([rpc('fila_pedidos',{p_token:t,p_unidade:uni}),czPega(),rpc('fila_painel',{p_token:t,p_unidade:uni}),frPega()]);
  if(minha!==VEZ||uni!==UNI) return;   /* trocou de loja no meio: descarta a resposta velha */
  CZ=cz; PN=pn;
  if(d){ OK_EM=Date.now(); desenha(d); } else if(!OK_EM){ desenha(null); }
  selo();
}
function selo(){
  var v=$('vivo'); if(!v) return;
  if(!OK_EM){ v.className='vivo velho'; v.innerHTML='<i></i>sem leitura'; return; }
  if(TEP){ v.className='vivo velho'; v.innerHTML='<i></i>TrackEat sem dado desde '+TEP; return; }
  var s=Math.round((Date.now()-OK_EM)/1000);
  /* Rota sugerida: se a leitura falhar, a caixa avisa que a conta e da leitura antiga (so texto, sem rede) */
  var rv=$('rs_velho'); if(rv){ if(s>180&&RS_ULT){ rv.style.display=''; rv.innerHTML='⚠ A tela não atualiza há '+Math.floor(s/60)+' min: esta sugestão é da leitura das '+esc(RS_ULT.agoraTxt)+'. Confira no TrackEat antes de usar.'; } else rv.style.display='none'; }
  v.className='vivo'+(s>180?' velho':'');
  v.innerHTML='<i></i>'+(s>180?'sem atualizar há '+Math.floor(s/60)+' min':'ao vivo · há '+s+' s');
}

/* ===== porta unica do portal ===== */
const CDMMODS=['fila'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'fila'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){
  if(!ok) return;
  trocaLoja(UNI);
  var cdmT=setInterval(boot,60000), cdmS=setInterval(selo,1000);   /* cdmS: so relogio na tela, sem rede */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ clearInterval(cdmT); clearInterval(cdmS); cdmT=null; cdmS=null; }
    else if(!cdmT){ boot(); cdmT=setInterval(boot,60000); cdmS=setInterval(selo,1000); }
  });
});
