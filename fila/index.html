<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Fila de Pedidos · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--roxo:#a98bf5;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1180px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.top .rt{margin-left:auto}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:18px}
.lojas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.lj{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.lj.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.k{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:13px 16px}
.k .n{font-size:32px;font-weight:800;line-height:1}
.k .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px;margin-top:5px}
.k.vm .n{color:var(--bad)} .k.rx .n{color:var(--roxo)} .k.br .n{color:var(--brand)}
h2{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:14px;letter-spacing:.05em;color:var(--brand);margin:0 0 11px}
h2 .q{color:var(--muted);font-family:'Barlow',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:0}
.bloco{margin-bottom:22px}
.bola{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.b-vm{background:var(--bad);box-shadow:0 0 0 3px rgba(230,103,103,.2)}
.b-rx{background:var(--roxo);box-shadow:0 0 0 3px rgba(169,139,245,.2)}
.linha{display:flex;align-items:center;gap:11px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px}
.linha .ped{font-weight:800;font-size:16px;min-width:56px}
.linha .est{color:var(--text2);font-size:13px}
.linha .mb{color:var(--muted);font-size:12.5px;margin-left:4px}
.linha .dir{margin-left:auto;display:flex;align-items:center;gap:14px}
.linha .hr{color:var(--muted);font-size:12.5px}
.linha .mn{font-weight:800;font-size:15px;min-width:62px;text-align:right}
.linha.late{border-color:rgba(230,103,103,.5);background:rgba(230,103,103,.07)}
.linha.late .mn{color:var(--bad)}
.quadros{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:11px}
.qd{background:var(--s1);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.qd .cb{display:flex;align-items:baseline;gap:7px;padding:10px 13px;background:var(--s2);border-bottom:1px solid var(--line)}
.qd .cb .nm{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qd .cb .ct{margin-left:auto;color:var(--brand);font-weight:800;font-size:13.5px;flex:0 0 auto}
.qd .cb .sa{color:var(--muted);font-size:11px;flex:0 0 auto}
.qd .it{display:flex;align-items:center;gap:8px;padding:7px 13px;border-bottom:1px solid rgba(52,51,47,.5);font-size:13.5px}
.qd .it:last-child{border-bottom:0}
.qd .it .p{font-weight:800;min-width:44px}
.qd .it .h{color:var(--muted);font-size:11.5px}
.qd .it .m{margin-left:auto;font-weight:800}
.qd .it.late .m{color:var(--bad)}
.qd .it .pt{color:var(--ok);font-size:11px;font-weight:700}
.leg{color:var(--muted);font-size:11.5px;margin-top:10px;line-height:1.5}
.leg .bola{margin-right:5px;vertical-align:middle;width:9px;height:9px}
.vazio{color:var(--muted);font-size:13.5px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:14px}
.load{color:var(--muted);padding:26px 0}
.rod{color:var(--muted);font-size:11.5px;border-top:1px solid var(--line);margin-top:22px;padding-top:12px;line-height:1.6}
@media (max-width:640px){body{padding:12px}.linha .mb{display:none}.res{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">🍔</div><div><h1>Fila de Pedidos</h1><div class="sub" id="sub">Água Verde — onde está cada pedido agora</div></div></div>
  <div class="rt"><button class="b" onclick="location.reload()">↻ Atualizar</button></div>
</div>
<div class="lojas" id="lojas">
  <button class="lj on" data-u="Água Verde" onclick="trocaLoja('Água Verde')">Água Verde</button>
  <button class="lj" data-u="São Braz" onclick="trocaLoja('São Braz')">São Braz</button>
  <button class="lj" data-u="Ahú" onclick="trocaLoja('Ahú')">Ahú</button>
</div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function rpc(nome,corpo){
  try{
    const r=await fetch(SB+'rpc/'+nome,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
    return r.ok?await r.json():null;
  }catch(e){return null}
}

var UNI='Água Verde';
try{var _u=localStorage.getItem('cdm_fila_uni'); if(_u==='Água Verde'||_u==='São Braz'||_u==='Ahú') UNI=_u;}catch(e){}

function trocaLoja(u){
  UNI=u; try{localStorage.setItem('cdm_fila_uni',u)}catch(e){}
  var bs=document.querySelectorAll('#lojas .lj');
  for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('on', bs[i].getAttribute('data-u')===u); }
  $('sub').textContent=u+' — onde está cada pedido agora';
  $('app').innerHTML='<div class="load">Carregando…</div>';
  boot();
}

/* o nome de cada etapa, do jeito que a equipe fala */
function nomeEtapa(o){
  if(o==='preparo') return 'em preparo na cozinha';
  if(o==='pronto') return 'pronto, esperando motoboy';
  if(o==='porta') return 'chegou no cliente';
  return 'na rua';
}

function desenha(d){
  if(!d){ $('app').innerHTML='<div class="vazio">Não consegui ler os pedidos agora. Tente o botão Atualizar.</div>'; return; }
  var r=d.resumo||{}, h='';

  h+='<div class="res">'+
     '<div class="k vm"><div class="n">'+esc(r.preparo)+'</div><div class="l">Em preparo na cozinha</div></div>'+
     '<div class="k rx"><div class="n">'+esc(r.pronto)+'</div><div class="l">Prontos esperando motoboy</div></div>'+
     '<div class="k br"><div class="n">'+esc(r.rua)+'</div><div class="l">Na rua · '+esc(r.motoboys)+' motoboy'+(r.motoboys===1?'':'s')+'</div></div>'+
     '</div>';

  var loja=Array.isArray(d.na_loja)?d.na_loja:[];
  h+='<div class="bloco"><h2>Na loja <span class="q">'+loja.length+' pedido'+(loja.length===1?'':'s')+'</span></h2>';
  if(!loja.length){ h+='<div class="vazio">Nenhum pedido esperando na loja neste minuto.</div>'; }
  else{
    h+=loja.map(function(p){
      var bola=(p.onde==='preparo')?'b-vm':'b-rx';
      return '<div class="linha'+(p.atrasado?' late':'')+'">'+
        '<span class="bola '+bola+'"></span>'+
        '<span class="ped">'+esc(p.pedido)+'</span>'+
        '<span class="est">'+esc(nomeEtapa(p.onde))+'</span>'+
        (p.motoboy?'<span class="mb">· '+esc(p.motoboy)+'</span>':'')+
        '<span class="dir"><span class="hr">entrou '+esc(p.entrou)+'</span>'+
        '<span class="mn">'+esc(p.min)+' min</span></span></div>';
    }).join('');
  }
  h+=legenda(d)+'</div>';

  var rua=Array.isArray(d.na_rua)?d.na_rua:[];
  h+='<div class="bloco"><h2>Na rua com os motoboys <span class="q">'+esc(r.rua)+' pedido'+(r.rua===1?'':'s')+'</span></h2>';
  if(!rua.length){ h+='<div class="vazio">Nenhum pedido na rua neste minuto.</div>'; }
  else{
    h+='<div class="quadros">'+rua.map(function(m){
      return '<div class="qd"><div class="cb"><span class="nm">'+esc(m.motoboy)+'</span>'+
        (m.saiu_ha!=null?'<span class="sa">saiu há '+esc(m.saiu_ha)+' min</span>':'')+
        '<span class="ct">'+esc(m.quantos)+'</span></div>'+
        (m.pedidos||[]).map(function(p){
          return '<div class="it'+(p.atrasado?' late':'')+'"><span class="p">'+esc(p.pedido)+'</span>'+
            '<span class="h">'+esc(p.entrou)+'</span>'+
            (p.onde==='porta'?'<span class="pt">na porta</span>':'')+
            '<span class="m">'+esc(p.min)+' min</span></div>';
        }).join('')+'</div>';
    }).join('')+'</div>';
  }
  h+='</div>';

  h+='<div class="rod">'+rodape(d)+'</div>';
  $('app').innerHTML=h;
}

function legenda(d){
  var g=d.regua;
  return '<div class="leg"><span class="bola b-vm"></span>em preparo na cozinha &nbsp;·&nbsp; '+
    '<span class="bola b-rx"></span>pronto, esperando motoboy'+
    (g?'<br>O tempo fica vermelho quando passa do normal desta loja: '+esc(g.ate_sair)+
       ' min da entrada até sair com o motoboy e '+esc(g.ate_entregar)+' min até ser entregue '+
       '(mediana dos últimos '+esc(g.amostra)+' pedidos entregues, medida às '+esc(g.medida_em)+').'
      :'<br>Sem histórico suficiente desta loja para dizer o que é demora — nenhum tempo está destacado.')+
    '</div>';
}

function rodape(d){
  return 'Os pedidos vêm do TrackEat, lidos pela última vez às '+esc(d.visto_em||'—')+'. Tela montada às '+esc(d.agora)+'.'+
    '<br>Pedido que não passa pelo TrackEat (balcão, telefone) não aparece aqui.';
}

async function boot(){
  const t=(function(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}})();
  const d=await rpc('fila_pedidos',{p_token:t,p_unidade:UNI});
  desenha(d);
}

/* ===== porta unica do portal ===== */
const CDMMODS=['fila'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'fila'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){
  if(!ok) return;
  trocaLoja(UNI);
  var cdmT=setInterval(boot,60000);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ clearInterval(cdmT); cdmT=null; }
    else if(!cdmT){ boot(); cdmT=setInterval(boot,60000); }
  });
});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
