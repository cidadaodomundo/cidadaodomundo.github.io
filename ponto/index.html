<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ponto · Cidadão do Mundo</title>
<style>
:root{--brand:#e6007e;--bg:#0b0e14;--surface:#141922;--surface2:#1b2230;--line:#242d3d;--text:#e8edf4;--muted:#8b95a5;
--serio:#e05252;--grave:#e8833a;--infra:#d4b43a;--verbal:#4a90d9;--conf:#6b7686;--sem:#37b46c;
--adv:#c0392b;--atest:#8e6bc9;--folga:#3aa6a0;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;padding:18px;max-width:1240px;margin:0 auto;font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--brand);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#8b1a5e);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
h1{font-size:17px;font-weight:800}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sem);font-weight:700}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--sem);animation:pl 1.8s infinite}
@keyframes pl{50%{opacity:.25}}
.btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 14px;font-size:12.5px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--brand)}
.views{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;width:max-content;margin-bottom:14px;flex-wrap:wrap}
.view{border:none;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}
.view.active{background:var(--brand);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.datenav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.datenav button{background:none;border:none;color:var(--text);font-size:16px;cursor:pointer;padding:6px 10px;border-radius:7px}
.datenav button:hover{background:var(--surface2)}
.datenav .cur{font-weight:800;font-size:13px;padding:0 8px;min-width:180px;text-align:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 38px;color:var(--text);font-size:13.5px;outline:none}
.search input:focus{border-color:var(--brand)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sr{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:30;max-height:300px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.sr div{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sr div:hover{background:var(--surface2)}
.sr .u{color:var(--muted);font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s;border-left:4px solid var(--kc,var(--line))}
.kpi:hover{border-color:var(--kc)}
.kpi.active{background:var(--surface2);border-color:var(--kc)}
.kpi .n{font-size:23px;font-weight:800;color:var(--kc)}
.kpi .l{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.units{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px 17px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center}
.tab .cnt{background:var(--surface2);border-radius:10px;padding:1px 8px;font-size:11px}
.tab.active{color:#fff;border-color:var(--brand);background:#261423}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s;border-left:4px solid var(--cc,var(--line))}
.card:hover{transform:translateY(-1px);border-color:var(--cc);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.cname{font-weight:700;font-size:13.5px}
.cunit{color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.badge{border-radius:7px;padding:4px 9px;font-size:10.5px;font-weight:800;color:#fff;white-space:nowrap;background:var(--cc)}
.mk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#b6c2d4;margin:5px 0 3px}
.jr{font-size:11px;color:var(--muted)}
.det{font-size:11.5px;color:#d3b544;margin-top:5px}
.acao{font-size:11.5px;color:#7ec8a3;margin-top:5px;background:#12241933;border-left:2px solid var(--sem);padding:4px 8px;border-radius:0 6px 6px 0}
.hist{display:flex;gap:4px;margin-top:8px;align-items:center}
.hist .dot{width:9px;height:9px;border-radius:3px}
.hist .hl{font-size:10px;color:var(--muted);margin-left:5px}
.flag{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:8px;padding:2px 8px;font-size:10.5px;font-weight:700;margin-top:7px;margin-right:5px}
.expl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.octipos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.octipo{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:11px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;line-height:1}
.octipo:hover{border-color:var(--brand)}
.octipo .oci{font-size:13.5px}
.octipo .occ{background:var(--surface2);border-radius:9px;padding:2px 8px;font-size:11px;font-weight:800;color:var(--text)}
.ocfil{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ocsel{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;outline:none}
.ocsel:focus{border-color:var(--brand)}
.ocres{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}
.ocrow{display:grid;grid-template-columns:40px 1fr 112px 18px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 15px;margin-bottom:7px;cursor:pointer;transition:.15s}
.ocrow:hover{border-color:var(--brand);transform:translateY(-1px)}
.ocav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.ocname{font-weight:700;font-size:13.5px}
.ocunit{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:2px}
.ocnum{text-align:right}
.ocnum .n{font-size:21px;font-weight:800;line-height:1.15}
.ocnum .l{font-size:10px;color:var(--muted);font-weight:700;margin-top:1px}
.ocarrow{color:var(--muted);font-size:19px;text-align:right}
.ocnote{font-size:11px;color:var(--muted);margin-top:12px;border-top:1px solid var(--line);padding-top:9px;line-height:1.5}
.mwrap{position:fixed;inset:0;background:rgba(4,6,10,.78);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 14px;overflow:auto;backdrop-filter:blur(3px)}
.mwrap.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:820px;width:100%;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:17px}
.mclose{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px;padding:14px 22px}
.ms{background:var(--surface2);border-radius:10px;padding:10px 12px;text-align:center;border-top:3px solid var(--mc,var(--line))}
.ms .n{font-size:19px;font-weight:800;color:var(--mc)}
.ms .l{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.mflag{margin:0 22px 8px;padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:700}
.mflag.warn{background:#2a1e14;color:var(--grave);border:1px solid #4a2c18}
.mflag.danger{background:#2a1518;color:var(--serio);border:1px solid #4a1c22}
.mflag.ok{background:#122419;color:var(--sem);border:1px solid #1c3b28}
.mtodo{margin:0 22px 10px;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.mtodo h4{font-size:11px;color:#7ec8a3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.mtodo li{font-size:12px;color:var(--text);margin-left:16px;margin-bottom:4px;line-height:1.5}
.mtl{padding:6px 22px 20px}
.mtl h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.trow{display:grid;grid-template-columns:105px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border:none}
.tdate{font-size:12px;font-weight:700;color:var(--muted)}
.tbadge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800;color:#fff;margin-right:7px}
.tmk{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#b6c2d4;margin-top:3px}
.tdet{font-size:11px;color:#d3b544;margin-top:2px}
.tinfo{font-size:11.5px;color:#b6c2d4;margin-top:3px}
.mmgrid{display:flex;flex-direction:column;gap:4px}
.mmrow{display:grid;grid-template-columns:70px 1fr 160px;gap:10px;align-items:center;font-size:11.5px;padding:3px 0}
.mmlabel{color:var(--muted);font-weight:700}
.mmbar{height:12px;background:var(--surface2);border-radius:4px;overflow:hidden}
.mmbar i{display:block;height:100%;background:linear-gradient(90deg,#3d7db8,#4a90d9);border-radius:4px}
.mminfo{color:var(--muted);text-align:right;white-space:nowrap}
.mmesq{color:var(--infra);font-weight:800}
/* guia */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.ghead{padding:12px 16px;font-weight:800;font-size:13.5px;color:#fff;display:flex;align-items:center;gap:10px;cursor:pointer}
.ghead .gtag{font-size:10px;background:rgba(0,0,0,.25);border-radius:6px;padding:2px 8px;font-weight:700}
.gbody{padding:14px 18px;display:none}
.gcard.open .gbody{display:block}
.gbody h5{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px}
.gbody p,.gbody li{font-size:12.5px;line-height:1.65;color:var(--text)}
.gbody li{margin-left:18px;margin-bottom:5px}
.gbody .lei{color:var(--verbal);font-weight:700}
.model{background:#10141c;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:12px;color:#c9d4e3;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;margin:8px 0;position:relative}
.copybtn{position:absolute;top:8px;right:8px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 10px;font-size:11px;cursor:pointer}
.copybtn:hover{color:#fff;border-color:var(--brand)}
.steps{counter-reset:st}
.steps li{list-style:none;margin-left:0;padding-left:34px;position:relative;margin-bottom:8px}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.loading{text-align:center;color:var(--muted);padding:60px 0}
.err{color:#f85149;padding:14px;border:1px solid #f85149;border-radius:10px;margin:12px 0}
.empty{text-align:center;color:var(--muted);padding:40px 0}
/* gate */
#gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center}
.gatebox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px;width:340px;text-align:center}
.gatebox input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;outline:none;margin:14px 0 10px;text-align:center}
.gatebox button{width:100%;background:var(--brand);border:none;color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
.gerr{color:#f85149;font-size:12px;min-height:16px;margin-top:8px}
@media(max-width:760px){.ocrow{grid-template-columns:34px 1fr 96px 14px}.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="gate" style="display:none"><div class="gatebox">
  <div class="logo" style="margin:0 auto 12px">CM</div>

  <button onclick="gateTry()">Liberar histórico</button>

  <div style="margin-top:12px"><a href="#" onclick="rhPular();return false" style="color:var(--muted);font-size:12px">ver o painel sem o histórico</a></div>
</div></div>
<header>
  <div class="brand"><div class="logo">CM</div>
    <div><h1>Ponto · Cidadão do Mundo — Painel RH</h1><div class="sub" id="sub">carregando…</div></div>
  </div>
  <div class="hright">

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
/* ===== porta unica do portal: sessao por usuario ===== */
const CDMMODS=['ponto'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmTem(id){try{const l=JSON.parse(sessionStorage.getItem('cdm_modulos')||'[]');return Array.isArray(l)&&l.some(function(m){return m&&m.id===id})}catch(e){return false}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/rpc/portal_eu',{method:'POST',headers:{apikey:'sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV',Authorization:'Bearer sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV','Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'ponto'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  try{sessionStorage.setItem('cdm_nome',j.nome||'');sessionStorage.setItem('cdm_admin',j.admin?'1':'0');sessionStorage.setItem('cdm_modulos',JSON.stringify(ms))}catch(e){}
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
function gateTry(){
  const el=document.getElementById('gpw'), v=(el&&el.value)||'';
  if(!v){document.getElementById('gerr').textContent='Digite a senha do escritório.';return}
  try{sessionStorage.setItem('cdm_rh_pw',v)}catch(e){}
  if(el)el.value='';
  RH_CRED=null;RH_SEM_SENHA=false;RH_PULOU=false;
  document.getElementById('gate').style.display='none';
  document.getElementById('gerr').textContent='';
  loadAll();
}
/* senha do escritório — guardada só na sessão, nunca no HTML */
const RH_DE='2000-01-01',RH_ATE='2099-12-31';
let RH_SEM_SENHA=false;
/* o token da sessao vale como credencial; a senha antiga do escritorio continua
   valendo como reserva ate o rh_consulta passar a aceitar o token (portal_cred_ok). */
let RH_CRED=null,RH_PULOU=false;
function rhPw(){try{return sessionStorage.getItem('cdm_rh_pw')||''}catch(e){return ''}}
function rhTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function rhPular(){RH_PULOU=true;const g=document.getElementById('gate');if(g)g.style.display='none';}
function rhPedeSenha(msg){RH_CRED=null;RH_SEM_SENHA=true;if(RH_PULOU)return;const g=document.getElementById('gate');if(g)g.style.display='flex';const el=document.getElementById('gerr');if(el)el.textContent=msg||'Digite a senha do escritório para ver o histórico.';}
async function _rhTenta(cred,acao,dados){
  const res=await fetch(SB+'rpc/rh_consulta',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({p_senha:cred,p_acao:acao,p_dados:dados||{}})});
  const j=await res.json().catch(()=>null);
  return {ok:res.ok,code:(j&&j.code)||'',lista:Array.isArray(j)?j:[]};
}
async function rhRPC(acao,dados){
  try{
    const cands=RH_CRED?[RH_CRED]:[rhTok(),rhPw()].filter(function(x){return !!x});
    if(!cands.length){rhPedeSenha('Digite a senha do escritório para ver o histórico.');return[]}
    for(let i=0;i<cands.length;i++){
      const r=await _rhTenta(cands[i],acao,dados);
      if(r.ok){RH_CRED=cands[i];RH_SEM_SENHA=false;return r.lista}
      if(r.code!=='28000'){RH_SEM_SENHA=true;return[]}
    }
    try{sessionStorage.removeItem('cdm_rh_pw')}catch(e){}
    rhPedeSenha('Digite a senha do escritório para ver o histórico.');
    return[];
  }catch(err){RH_SEM_SENHA=true;return[]}
}
const ORD={SERIO:0,GRAVE:1,INFRACAO:2,VERBAL:3,CONFERIR:4,SEM:5};
const NV=r=>(ORD[r.nivel]!==undefined?r.nivel:'CONFERIR');

  ['vday','vtipo','vguia'].forEach(id=>$(id).classList.remove('active'));

function stepDay(d){DI=Math.min(Math.max(DI+d,0),DAYS.length-1);FILT=null;render()}
function dayRows(){return ALL.filter(r=>r.data===DAYS[DI])}
function allNames(){return [...new Set([...ALL.map(r=>r.nome),...MEN.map(r=>r.nome),...EVT.map(r=>r.nome)])]}
function isActive(nome){return ALL.some(r=>r.nome===nome)}
function unitOf(nome){
  const a=ALL.filter(r=>r.nome===nome); if(a.length)return a[a.length-1].unidade;
  const m=MEN.filter(r=>r.nome===nome); if(m.length)return m[m.length-1].unidade;
  const e=EVT.filter(r=>r.nome===nome); return e.length?e[e.length-1].unidade:'—';}
function stats(nome){
  const h=ALL.filter(r=>r.nome===nome);
  const s={serio:0,grave:0,infra:0,verbal:0,conf:0,ok:0,dias:h.length,extra:0,score:0,faltas:0};
  h.forEach(r=>{
    const n=NV(r);
    if(n==='SERIO')s.serio++;else if(n==='GRAVE')s.grave++;
    else if(n==='INFRACAO')s.infra++;else if(n==='VERBAL')s.verbal++;
    else if(n==='SEM')s.ok++;
    else {s.conf++; if((r.detalhe||'').startsWith('Nenhuma marca'))s.faltas++;}
    s.extra+=r.extra_min||0; s.score+=W[n]||0;});
  s.pen=s.serio+s.grave+s.infra+s.verbal;
  s.okpct=s.dias?Math.round(100*s.ok/s.dias):0;
  const m=MEN.filter(r=>r.nome===nome);
  s.esq2y=m.reduce((x,r)=>x+(r.esquecimentos||0),0);
  s.meses=m.length;
  s.esqRate=s.meses?+(s.esq2y/s.meses).toFixed(1):null;
  s.horas2y=m.reduce((x,r)=>x+(r.horas_liquidas_min||0),0);
  const ev=EVT.filter(r=>r.nome===nome);
  s.adv=ev.filter(r=>r.tipo==='ADVERTENCIA').length;
  s.atest=ev.filter(r=>r.tipo==='ATESTADO'&&!(r.detalhe||'').includes('REPROVADO')).length;
  s.atestDias=ev.filter(r=>r.tipo==='ATESTADO'&&!(r.detalhe||'').includes('REPROVADO')).reduce((x,r)=>x+(r.dias||1),0);
  s.atestRep=ev.filter(r=>r.tipo==='ATESTADO'&&(r.detalhe||'').includes('REPROVADO')).length;
  s.faltasEv=ev.filter(r=>r.tipo==='FALTA').length;
  s.faltasTot=s.faltas+s.faltasEv;
  s.unidade=unitOf(nome); s.ativo=isActive(nome);
  return s;}

function renderDay(){

  const kc={TOTAL:'var(--brand)',SERIO:'var(--serio)',GRAVE:'var(--grave)',INFRACAO:'var(--infra)',VERBAL:'var(--verbal)',CONFERIR:'var(--conf)',SEM:'var(--sem)'};
  $('kpis').innerHTML=Object.keys(k).filter(x=>x==='TOTAL'||k[x]>0).map(x=>
    `<div class="kpi ${FILT===x?'active':''}" style="--kc:${kc[x]}" onclick="FILT=FILT==='${x}'?null:'${x}';render()">
     <div class="n">${k[x]}</div><div class="l">${KL[x]}</div></div>`).join('');
  const uns=[...new Set(rows.map(r=>r.unidade))].sort((a,b)=>(UORD[a]??9)-(UORD[b]??9));
  $('units').innerHTML=['Todas',...uns].map(u=>{
    const n=u==='Todas'?rows.length:rows.filter(r=>r.unidade===u).length;
    return `<span class="tab ${UNIT===u?'active':''}" onclick="UNIT='${u}';render()">${u}<span class="cnt">${n}</span></span>`}).join('');
  let show=rows.filter(r=>UNIT==='Todas'||r.unidade===UNIT);
  if(FILT&&FILT!=='TOTAL')show=show.filter(r=>NV(r)===FILT);
  show.sort((a,b)=>(ORD[NV(a)]-ORD[NV(b)])||((UORD[a.unidade]??9)-(UORD[b.unidade]??9))||a.nome.localeCompare(b.nome));
  if(!show.length){$('content').innerHTML='<div class="empty">Nenhum funcionário neste filtro.</div>';return}
  $('content').innerHTML='<div class="grid">'+show.map(r=>{
    const p=stats(r.nome);
    const hist=ALL.filter(x=>x.nome===r.nome).slice(-7);
    const dots=hist.map(x=>`<span class="dot" title="${br(x.data)}: ${L[NV(x)]}" style="background:${C[NV(x)]}"></span>`).join('');
    const flags=(p.adv?`<span class="flag" style="color:var(--adv)">📄 ${p.adv} advert.</span>`:'')+
                (p.pen?`<span class="flag" style="color:var(--grave)">⚠ ${p.pen} ocorr.</span>`:'')+
                (p.atest?`<span class="flag" style="color:var(--atest)">🩺 ${p.atest} atest. (${p.atestDias}d)</span>`:'')+
                (p.faltasTot?`<span class="flag" style="color:var(--serio)">🚫 ${p.faltasTot} falta${p.faltasTot>1?'s':''}</span>`:'')+
                (p.esq2y?`<span class="flag" style="color:var(--infra)">🕐 ${p.esq2y} s/ batida (2a)</span>`:'');
    const acao=(NV(r)!=='SEM'&&ACAO[NV(r)])?`<div class="acao">▸ ${ACAO[NV(r)]}</div>`:'';
    return `<div class="card" style="--cc:${C[NV(r)]}" onclick="openModal('${r.nome.replace(/'/g,"\\'")}')">
      <div class="chead"><div><div class="cname">${title(r.nome)}</div><div class="cunit">${r.unidade}</div></div>
      <span class="badge">${L[NV(r)]}</span>${NV(r)!=='SEM'&&r.tag?`<span class="cunit" style="margin-left:6px">${r.tag}</span>`:''}</div>
      <div class="mk">🕒 <span style="color:var(--muted)">marcações não disponíveis nesta tela</span></div>
      <div class="jr">líq ${fmt(r.jornada_liquida_min)} · int ${r.intervalo_real_min??'—'}min · contr ${fmt(r.jornada_contratada_min)}${r.extra_min?' · +'+r.extra_min+'min':''}</div>
      ${r.detalhe?`<div class="det">▸ ${r.detalhe}</div>`:(RH_SEM_SENHA?`<div class="det" style="color:var(--muted)">▸ entre com a senha para ver o detalhe</div>`:'')}
      ${acao}
      <div class="hist">${dots}<span class="hl">últimos ${hist.length} dias</span></div>${flags}</div>`}).join('')+'</div>';
}

<p>O espelho precisa ter as 4 marcações do turno (entrada, saída p/ intervalo, volta, saída). Batida faltando fragiliza a empresa em fiscalização e ação trabalhista — o espelho é a <b>prova legal da jornada</b>.</p>
<h5>O que a empresa deve fazer</h5>
<ol class="steps">
<li>Ajustar a marcação no Flash com justificativa (informar o horário real confirmado com o gestor).</li>
<li>1ª vez → <b>orientação escrita</b>. Reincidência → <b>advertência formal</b> (a consulta por tipo, em "Batida faltando", mostra os reincidentes).</li>
<li>Casos crônicos (ex.: dezenas em poucos meses) → sequência de advertências e, mantendo-se, suspensão.</li>
</ol>
<h5>Modelo — advertência por falta de batidas</h5>
<div class="model"><button class="copybtn" onclick="copyM(this)">Copiar</button>ADVERTÊNCIA DISCIPLINAR

Colaborador(a): [NOME]  ·  Unidade: [LOJA]  ·  Data: [DATA]

Aplicamos a presente ADVERTÊNCIA em razão de reiteradas ausências de registro de ponto ([LISTAR DATAS]), descumprindo a obrigação de marcação prevista na Portaria MTP 671/2021 e nas normas internas, mesmo após orientação em [DATA DA ORIENTAÇÃO].

A reincidência poderá ensejar suspensão disciplinar e, persistindo, rescisão por justa causa (Art. 482, "e" e "h", da CLT).

______________________          ______________________
Empresa                          Colaborador(a)
(Se houver recusa de assinatura, colher assinatura de 2 testemunhas.)</div>
</div></div>

<div class="gcard"><div class="ghead" style="background:var(--serio)" onclick="this.parentElement.classList.toggle('open')">🚫 Falta sem justificativa <span class="gtag">Lei 605/49</span></div>
<div class="gbody">
<h5>O que a empresa deve fazer</h5>
<ol class="steps">
<li>Aguardar <b>48h</b> pela entrega de atestado (prazo interno padrão). Entregou atestado válido → abonar e registrar no Flash.</li>
<li>Sem justificativa → <b>descontar o dia + o DSR</b> da semana (<span class="lei">Lei 605/49, art. 6º</span>) e aplicar orientação/advertência conforme histórico.</li>
<li>Registrar a falta no evento do Flash e no painel (o robô cobra dias sem marcação que não têm férias/atestado/folga cobrindo).</li>
<li>Faltas seguidas e sem retorno: a partir de ~30 dias com tentativas de contato documentadas, avaliar abandono de emprego (Art. 482, "i") com o contador/jurídico.</li>
</ol>
</div></div>

<div class="gcard"><div class="ghead" style="background:var(--atest)" onclick="this.parentElement.classList.toggle('open')">🩺 Atestado médico — como receber <span class="gtag">Lei 605/49 · Súm. 15/282 TST</span></div>
<div class="gbody">
<ol class="steps">
<li>Conferir: nome do funcionário, data, período de afastamento, <b>assinatura e CRM/CRO</b> do profissional. CID não é obrigatório (o funcionário pode omitir).</li>
<li>Lançar como evento no Flash (Eventos da equipe) com anexo, e arquivar na Gestão de documentos.</li>
<li>Atestado válido <b>abona</b> as horas/dias — não desconta, não conta como falta.</li>
<li>Suspeita de atestado irregular? Não recusar de imediato: a empresa pode submeter a médico próprio/convênio. Recusa exige fundamento.</li>
<li>Atestados em excesso (ex.: 9 em 2 meses): não é punível por si — mas convocar conversa de acompanhamento, verificar se há afastamento INSS a caminho (>15 dias contínuos → perícia).</li>
</ol>
</div></div>

<div class="gcard"><div class="ghead" style="background:var(--adv)" onclick="this.parentElement.classList.toggle('open')">📄 Gradação disciplinar — a régua certa <span class="gtag">Art. 474/482 CLT</span></div>
<div class="gbody">
<p>A disciplina precisa ser <b>gradual, proporcional, imediata e documentada</b> — é isso que sustenta a empresa numa eventual ação. Nunca punir duas vezes o mesmo fato.</p>
<h5>A régua</h5>
<ol class="steps">
<li><b>Orientação verbal</b> (registrar data/assunto em planilha interna).</li>
<li><b>Orientação escrita</b> assinada.</li>
<li><b>Advertência formal</b> assinada (1ª, 2ª, 3ª… sempre por escrito, arquivada no Flash).</li>
<li><b>Suspensão disciplinar</b> de 1 a 5 dias sem remuneração (máximo legal: 30 dias — <span class="lei">Art. 474</span>). Padrão da casa: a partir da 3ª advertência.</li>
<li><b>Justa causa por desídia</b> (<span class="lei">Art. 482, "e"</span>) — só com o histórico completo documentado; validar antes com contador/jurídico.</li>
</ol>
<h5>Modelo — comunicado de suspensão</h5>
<div class="model"><button class="copybtn" onclick="copyM(this)">Copiar</button>COMUNICADO DE SUSPENSÃO DISCIPLINAR

Colaborador(a): [NOME]  ·  Unidade: [LOJA]  ·  Data: [DATA]

Em razão da reincidência nas condutas já objeto das advertências de [DATAS], aplicamos SUSPENSÃO DISCIPLINAR de [X] dia(s), em [DATA(S)], sem remuneração, com fundamento no poder diretivo do empregador e no Art. 474 da CLT.

Nova reincidência poderá ensejar rescisão contratual por justa causa (Art. 482 da CLT).

______________________          ______________________
Empresa                          Colaborador(a)</div>

<li>Executar a ação indicada em cada card (o texto verde "RH:" diz exatamente o que fazer).</li>
<li>Lançar eventos e documentos no Flash no mesmo dia (atestados, advertências assinadas).</li>
<li>Na sexta, abrir a Consulta por tipo e ver reincidentes — decidir com o Fábio quem sobe de régua.</li>

function todoFor(nome,p,h){
  const acts=[];
  const last=h[0];
  if(last&&NV(last)!=='SEM'&&ACAO[NV(last)])acts.push('Hoje ('+br(last.data)+'): '+ACAO[NV(last)]);
  if(p.adv>=3)acts.push('3+ advertências formais: preparar SUSPENSÃO (modelo no Guia RH) e validar com contador/jurídico.');
  else if(p.adv===2)acts.push('Já tem 2 advertências: a próxima ocorrência leva à 3ª e abre caminho para suspensão — monitorar de perto.');
  if(p.serio>0)acts.push('Intervalo suprimido no período ('+p.serio+'x): conferir se a ADVERTÊNCIA foi aplicada (política da empresa: falta grave).');
  if(p.infra>=2||p.esq2y>=30)acts.push('Reincidente em falta de batidas ('+(p.infra||0)+' recentes, '+p.esq2y+' em 2 anos): aplicar advertência formal por marcação (modelo no Guia).');
  if(p.atestDias>=15)acts.push(p.atestDias+' dias de atestado no período: acompanhar saúde/afastamento — >15 dias contínuos vai para perícia INSS.');
  if(p.extra>=30)acts.push('+'+p.extra+'min extras acumulados: pagar +50% na folha ou compensar; revisar escala com o gestor.');
  if(!acts.length)acts.push('Nenhuma ação pendente — manter acompanhamento normal.');
  return acts;}
function openModal(nome){
  const h=ALL.filter(r=>r.nome===nome).sort((a,b)=>b.data.localeCompare(a.data));
  const m=MEN.filter(r=>r.nome===nome).sort((a,b)=>(b.ano*100+b.mes)-(a.ano*100+a.mes));
  const ev=EVT.filter(r=>r.nome===nome).sort((a,b)=>b.data.localeCompare(a.data));
  const p=stats(nome);
  $('mname').textContent=title(nome)+(p.ativo?'':' (desligado)');
  $('msub').textContent=p.unidade+' · Flash: '+p.dias+' dias · Secullum: '+p.meses+' meses · Eventos: '+ev.length;
  const st=[['ADVERTÊNCIAS',p.adv,'var(--adv)'],['FALTAS',p.faltasTot,'var(--serio)'],['ATESTADOS',p.atest,'var(--atest)'],
    ['DIAS ATESTADO',p.atestDias,'var(--atest)'],['FALTA BATIDA 2A',p.esq2y,'var(--infra)'],['MIN EXTRAS',p.extra,'var(--grave)']];
  $('mstats').innerHTML=st.map(([l,n,c])=>`<div class="ms" style="--mc:${c}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  const flag=$('mflag');
  if(p.adv>=3) flag.innerHTML='<div class="mflag danger">🚨 '+p.adv+' advertências formais — reincidência caracterizada; próximo passo legal: SUSPENSÃO (Art. 474). Ver Guia RH.</div>';
  else if(p.adv>0) flag.innerHTML='<div class="mflag warn">📄 '+p.adv+' advertência(s) formal(is) assinada(s). Reincidência ⇒ nova advertência/suspensão.</div>';
  else if(p.infra>=2||p.esq2y>=30) flag.innerHTML='<div class="mflag warn">⚠ Reincidência de falta de batidas ('+p.infra+'× recente, '+p.esq2y+' em 2 anos) — cabe advertência escrita (Portaria 671).</div>';
  else if(p.serio+p.grave>=2) flag.innerHTML='<div class="mflag warn">⚠ '+(p.serio+p.grave)+' ocorrências sérias/graves recentes — formalizar orientação escrita.</div>';
  else if(p.pen===0&&p.esq2y<=5) flag.innerHTML='<div class="mflag ok">✓ Histórico limpo — sem penalidades nem advertências.</div>';
  else flag.innerHTML='<div class="mflag ok">✓ Sem advertências formais ('+p.esq2y+' batidas esquecidas em 2 anos — acompanhar).</div>';
  $('mtodo').innerHTML='<div class="mtodo"><h4>✅ O que o RH deve fazer</h4><ul>'+todoFor(nome,p,h).map(a=>'<li>'+a+'</li>').join('')+'</ul></div>';
  $('mevents').innerHTML=RH_SEM_SENHA?"<h3>Ocorrências registradas</h3><div class='tinfo'>Entre com a senha para ver o histórico.</div>":ev.length?('<h3>Ocorrências registradas — advertências, atestados, faltas, férias</h3>'+ev.map(r=>`<div class="trow">
    <div class="tdate">${br(r.data)}</div>
    <div><span class="tbadge" style="background:${EC[r.tipo]||'var(--conf)'}">${EL[r.tipo]||r.tipo}</span>
      <div class="tinfo">${r.motivo||''}${r.dias&&r.dias>1?' · '+r.dias+' dias':''}</div>
      ${r.detalhe?`<div class="tdet">▸ ${r.detalhe}</div>`:''}</div></div>`).join('')):'';
  $('mdaily').innerHTML=h.length?('<h3>Dia a dia — Flash (recente)</h3>'+h.map(r=>`<div class="trow">
    <div class="tdate">${br(r.data)}<br><span style="font-weight:400">${(r.dia_semana||'').replace('-feira','')}</span></div>
    <div><span class="tbadge" style="background:${C[NV(r)]}">${L[NV(r)]}</span>
      <div class="tmk">líq ${fmt(r.jornada_liquida_min)} · int ${r.intervalo_real_min??'—'}min</div>
      ${r.detalhe?`<div class="tdet">▸ ${r.detalhe}</div>`:''}</div></div>`).join('')):'';
  const maxh=Math.max(...m.map(r=>r.horas_liquidas_min||0),1);
  $('mmonthly').innerHTML=m.length?('<h3>Histórico mensal — Secullum (2 anos)</h3><div class="mmgrid">'+m.map(r=>{
    const w=Math.round(100*(r.horas_liquidas_min||0)/maxh);
    return `<div class="mmrow"><div class="mmlabel">${MESES[r.mes-1]}/${String(r.ano).slice(2)}</div>
      <div class="mmbar"><i style="width:${w}%"></i></div>
      <div class="mminfo">${fmt(r.horas_liquidas_min)} · ${r.dias_trabalhados??'—'}d${r.esquecimentos?` · <span class="mmesq">${r.esquecimentos} s/ batida</span>`:''}</div></div>`}).join('')+'</div>'):'';
  $('mwrap').classList.add('open');
}
function closeModal(){$('mwrap').classList.remove('open')}
function copyM(btn){const t=btn.parentElement.innerText.replace(/^Copiar\n?/,'');navigator.clipboard.writeText(t).then(()=>{btn.textContent='Copiado ✓';setTimeout(()=>btn.textContent='Copiar',1500)})}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('q').addEventListener('input',e=>{
  const v=e.target.value.trim().toLowerCase(); const sr=$('sr');
  if(v.length<2){sr.style.display='none';return}
  const names=allNames().filter(n=>n.toLowerCase().includes(v)).slice(0,8);
  if(!names.length){sr.style.display='none';return}
  sr.innerHTML=names.map(n=>{const s=stats(n);
    return `<div onclick="openModal('${n.replace(/'/g,"\\'")}');$('sr').style.display='none';$('q').value=''">
    <span>${title(n)}${s.ativo?'':' <span style="color:var(--muted);font-size:10px">(saiu)</span>'}</span>
    <span class="u">${s.unidade}${s.adv?' · 📄'+s.adv:''}${s.pen?' · ⚠'+s.pen:''}${s.atest?' · 🩺'+s.atest:''}</span></div>`}).join('');
  sr.style.display='block';
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('sr').style.display='none'});
