<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="/assets/chaves.js?v=1"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Cancelamentos · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/cdm-ui.css?v=4">
<style>
/* 11/10/2026 (chat-cancelamentos-tela-11-10), pedido do Fabio: "a aba cancelamentos e pra sair tb e ficar embaixo dos
   produtos pausados / aqui vamos usar as apis todas que temos / e vamos usar tb o gestor web / os quadros tem que estar
   mais bonitos e seguir nossa proposta de front end do portal".
   Visual do kit (cdm-ui.css) + quadros e cartoes iguais ao Resolver hoje e aos Produtos pausados.
   Cores do turno validadas (fundo #1a1a19): dia #d0784c (terracota), noite #2fa79a (verde-agua do delivery). */
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
button.b:hover{border-color:var(--text2)}
.load{color:var(--muted);padding:40px 10px;text-align:center}
.m{color:var(--muted);font-size:12px;margin-top:3px}
.filtros{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.lojas{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lojas .rot{color:var(--muted);font-size:12px;font-weight:800;margin-right:2px;letter-spacing:.3px}
.lojas .chip{padding:7px 13px}
.chip.on{background:#fff;color:#111;border-color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.cards>*{min-width:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 15px;color:var(--text);display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:border-color .15s,transform .08s;text-align:left;font-family:inherit}
.card:hover{border-color:#5a5952}
.card:active{transform:scale(.98)}
.card .t{font-size:13px;font-weight:800;color:var(--text2);line-height:1.3}
.card .v{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:42px;line-height:1.05;margin:0}
.card .v small{font-family:'Barlow',sans-serif;font-size:15px;font-weight:700;color:var(--muted);margin-left:4px}
.card .qs{color:var(--muted);font-size:12px;font-weight:700;line-height:1.35}
.card .qs.ruim{color:#ff9a9a}
.card .qs.boa{color:#7fe0aa}
.card .din{color:var(--text2);font-size:12.5px;font-weight:800}
.card.mal{border-left:4px solid var(--bad)}
.card.mal .v{color:#ff8a8a}
.card.bem .v{color:#7fe0aa}
.card.sd{border-style:dashed}
.card.sd .v{color:var(--muted)}
.card.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:10px}
.duas>*{min-width:0}
.cx{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 15px}
.cx h3{font-size:14px;font-weight:800;color:var(--text);margin-bottom:2px}
.cx .sub{color:var(--muted);font-size:12px;font-weight:600;margin-bottom:8px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin:0 0 10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.c-dia{background:#d0784c}.c-noite{background:#2fa79a}.c-fora{background:#77766e}
.br{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px;gap:10px;align-items:center;padding:7px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--text2)}
.br:hover{background:rgba(224,168,28,.06)}
.br .bl b{color:var(--text);font-weight:700}
.br .bl .x{color:#ff9a9a;font-size:11.5px;font-weight:700;margin-left:4px;white-space:nowrap}
.br .tri{display:flex;gap:2px;height:12px}
.br .tri i{display:block;height:100%;min-width:3px}
.br .tri i:first-child{border-radius:4px 0 0 4px}
.br .tri i:last-child{border-radius:0 4px 4px 0}
.br .tri i:only-child{border-radius:4px}
.br .bn{text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.br.on{background:rgba(224,168,28,.08);box-shadow:inset 3px 0 0 var(--brand)}
/* tabela bonita (igual Como fomos · Qualidade) */
.rolar{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px -15px -14px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th{text-align:left;color:var(--muted);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:10px 10px 9px 0;white-space:nowrap;background:var(--s2)}
table.tb td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
table.tb th:first-child,table.tb td:first-child{padding-left:15px}
table.tb th:last-child,table.tb td:last-child{padding-right:15px}
table.tb tr:nth-child(odd)>td{background:rgba(255,255,255,.018)}
table.tb tr.lk{cursor:pointer}
table.tb tr.lk:hover>td{background:rgba(224,168,28,.06)}
table.tb th.n,table.tb td.n{text-align:right}
table.tb td.n{white-space:nowrap}
.cd{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.u{color:var(--muted);font-size:12px}
/* painel com os pedidos (abre embaixo do quadro tocado) */
.painel{margin-top:12px;background:#151514;border:1px solid #4a4943;border-radius:16px;padding:14px}
.painel .ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.painel .ph h3{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:19px;letter-spacing:.02em}
.painel .ph .ct{color:var(--muted);font-size:13px;font-weight:600}
.painel .ph .fecha{margin-left:auto}
.mini{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:700}
.mini:hover{border-color:var(--text2)}
.mini.on{background:#fff;color:#111;border-color:#fff}
.nota{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.55}
.nota b{color:var(--text2)}
.parado{border:1px solid rgba(230,103,103,.5);border-left:5px solid var(--bad);background:#2a1716;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:13px;color:var(--text2)}
.parado b{color:#ff9a9a}
/* cartoes iguais aos do Resolver hoje */
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-off{background:rgba(138,137,126,.15);color:var(--muted)}
.vv-lista{display:grid;gap:10px}
table.vv{width:100%;background:var(--s1);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:12px;border-collapse:separate;border-spacing:0}
table.vv.ok{border-left-color:var(--ok)}
table.vv td{border-top:0;padding:12px 14px;vertical-align:top}
table.vv td.hrc{width:76px;padding-right:0}
table.vv td.sit{width:260px}
table.vv td.sit input{width:100%;background:var(--s2);border:1px dashed #5a5952;color:var(--text);border-radius:10px;padding:8px 10px;font-size:13.5px;font-family:inherit;margin-bottom:6px}
table.vv td.sit input:focus{outline:none;border-style:solid;border-color:var(--text2)}
.vv .hr{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.vv .ha{color:var(--muted);font-size:11.5px;margin-top:3px}
.vv .tt{font-size:17px;font-weight:800;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.vv .lj{color:var(--text2);font-size:13px;margin-top:2px}
.vv .it{margin-top:6px;font-size:13.5px;color:var(--text)}
.vv .ds{margin-top:5px;font-size:13.5px;color:var(--text2);font-style:italic}
.vv .rs{margin-top:5px;font-size:12.5px;color:var(--muted)}
.vv .rs b{color:var(--text2)}
.vv .fn{margin-top:3px;font-size:11px;color:var(--muted)}
.vv .vbt{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.feito{color:#7fe0aa;font-weight:700}
@media (max-width:900px){.duas{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card .v{font-size:34px}
  .br{grid-template-columns:minmax(0,1fr) 40px}
  .br .bl{grid-column:1/-1}
  table.vv,table.vv tbody{display:block}
  table.vv tr{display:grid;grid-template-columns:64px minmax(0,1fr)}
  table.vv td{padding:12px 10px}
  table.vv td.hrc{width:auto;padding-right:0}
  .vv .hr{font-size:21px}
  table.vv td.sit{grid-column:1/-1;width:auto;padding-top:0}
}
</style>
</head>
<body>

<div class="wrap">
<div class="top">
  <div>
    <h1 id="tit">🚫 Cancelamentos</h1>
    <div class="placar" id="placar"><span class="pl">carregando…</span></div>
  </div>
  <div class="rt"><button class="b" onclick="boot()" title="Ler de novo">↻ Atualizar</button></div>
</div>

<div id="app"><div class="load">Carregando…</div></div>
</div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};

/* ?loja=ahu (menu Ahu > Cancelados · Ahu): a loja fica fixa e os botoes das outras somem.
   E recorte de VISAO; o cadeado esta na porta (quem so tem o atalho do Ahu recebe so o Ahu). */
const LOJAS=[['Agua Verde','Água Verde'],['Ahu','Ahú'],['Sao Braz','São Braz']];
let FIXA='';
try{ FIXA=({ahu:'Ahu',sb:'Sao Braz',av:'Agua Verde'})[new URLSearchParams(location.search).get('loja')]||''; }catch(e){}
let UNI=FIXA||'Agua Verde', PER='30';
try{ if(!FIXA){ var u0=localStorage.getItem('cdm_cancel_uni'); if(u0==='Todas'||LOJAS.some(function(l){return l[0]===u0})) UNI=u0; }
     var p0=localStorage.getItem('cdm_cancel_per'); if(['hoje','ontem','7','30'].indexOf(p0)>=0) PER=p0; }catch(e){}   // 90 dias saiu em 12/10 (pedido do Fabio): quem tinha 90 guardado volta a 30
const PERIODOS=[['hoje','Hoje'],['ontem','Ontem'],['7','7 dias'],['30','30 dias']];

let P=null, PERR='', SEL=null, L=null, LERR='', SO='', ABRE=[];
let BSEQ=0, LSEQ=0, SALVANDO=false;   // so a resposta do pedido mais novo vale; um salvar por vez

async function porta(acao,dados){
  const r=await fetch(SB+'rpc/cancelados_porta',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_acao:acao,p_dados:dados||{}})});
  if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('erro '+r.status))}
  return await r.json();
}
function rs(v){ return v==null?'':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function frase(t){ t=String(t||'').trim().toLowerCase(); return t.charAt(0).toUpperCase()+t.slice(1); }
function nomeLoja(u){ var l=LOJAS.filter(function(x){return x[0]===u})[0]; return l?l[1]:(u==='Todas'?'todas as lojas':u); }
const TURNO={dia:'☀ Dia (10h–18h)',noite:'🌙 Noite (18h–2h20)',fora:'Fora dos turnos (2h21–10h)'};
const ORIG={cliente:'O cliente cancelou',loja:'A loja cancelou',ifood_cliente:'O atendimento do iFood cancelou, a pedido do cliente',
            ifood:'O iFood cancelou',entrega:'A entrega do iFood cancelou',sem_dado:'Ainda sem essa informação'};
const ORIG_P={cliente:'cancelou: cliente',loja:'cancelou: loja',ifood_cliente:'cancelou: iFood, a pedido do cliente',ifood:'cancelou: iFood',entrega:'cancelou: entrega do iFood'};
const CULPA={loja:['Da loja','atraso, pedido errado, item em falta, sem motoboy, loja fechada'],
             cliente:['Do cliente','endereço, não atendeu, desistiu, pagamento'],
             outros:['Outros','iFood, entrega do iFood, sem motivo']};
const DS=['','Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];

/* ================= topo ================= */
function placar(){
  var p=$('placar'); if(!p) return;
  if(!P){ p.innerHTML=PERR?'<span class="pl" style="border-color:rgba(230,103,103,.5);color:#ff9a9a">'+esc(PERR)+'</span>':'<span class="pl">carregando…</span>'; return }
  var R=P.resumo||{}, f=P.fontes||{}, esp=(R.inteiros_sem_expl||0)+(R.parciais_sem_expl||0);
  var ver='style="border-color:rgba(230,103,103,.5)"';
  p.innerHTML='<span class="pl">'+esc(P.periodo.ini===P.periodo.fim?P.periodo.ini:P.periodo.ini+' a '+P.periodo.fim)+'</span>'+
    '<span class="pl" '+(esp?ver:'')+'><b>'+esp+'</b> esperando explicação</span>'+
    '<span class="pl">'+esc(nomeLoja(P.unidade))+'</span>'+
    '<span class="pl" '+((f.api_min==null||f.api_min>20)?ver:'')+'>API do iFood <b>'+esc(f.api?f.api.slice(6):'sem leitura')+'</b></span>'+
    '<span class="pl" '+((f.gestor_min==null||f.gestor_min>30)?ver:'')+'>Gestor Web <b>'+esc(f.gestor?f.gestor.slice(6):'sem leitura')+'</b></span>'+
    '<span class="pl">financeiro até <b>'+esc(f.financeiro_ate||'—')+'</b></span>';
}

/* ================= quadros ================= */
function reg(grupo,filtro,titulo){ ABRE.push({grupo:grupo,filtro:filtro,titulo:titulo}); return ABRE.length-1; }
function selKey(g,f){ return SEL&&SEL.grupo===g&&JSON.stringify(SEL.filtro)===JSON.stringify(f); }
function card(g,f,tit,ic,v,linhas,tipo){
  var i=reg(g,f,tit);
  return '<button class="card '+(tipo||'')+(selKey(g,f)?' on':'')+'" onclick="abre('+i+')" title="Ver os pedidos">'+
    '<div class="t">'+ic+' '+esc(tit)+'</div><div class="v">'+v+'</div>'+linhas+'</button>';
}
function qs(t,c){ return '<div class="qs'+(c?' '+c:'')+'">'+t+'</div>'; }
function blocoResumo(){
  var R=P.resumo||{}, d=!!P.dono, h='';
  var se=R.inteiros_sem_expl||0, sp=R.parciais_sem_expl||0;
  h+=card('res',{tipo:'inteiro'},'Cancelados inteiros','🚫',R.inteiros||0,
       (R.inteiros?(se?qs(se+' esperando explicação','ruim'):qs('todos explicados','boa')):qs('nenhum no período','boa'))+
       (d?'<div class="din">'+rs(R.inteiros_valor)+' em pedidos</div>':''), se?'mal':(R.inteiros?'':'bem'));
  h+=card('res',{tipo:'parcial'},'Parte do pedido devolvida','✂',R.parciais||0,
       (R.parciais?(sp?qs(sp+' esperando explicação','ruim'):qs('todos explicados','boa')):qs('nenhum no período','boa'))+
       (R.parciais_foto?qs(R.parciais_foto+' com foto do cliente'):'')+
       (d?'<div class="din">'+rs(R.parciais_valor)+' devolvidos ao cliente</div>':''), sp?'mal':(R.parciais?'':'bem'));
  h+=card('res',{tipo:'inteiro',so:'prejuizo'},'Prejuízo certo','💸',R.prejuizo_n||0,
       qs('saiu para entrega e nada voltou para a loja',R.prejuizo_n?'ruim':'boa')+
       (d&&R.prejuizo_n?'<div class="din">'+rs(R.prejuizo_valor)+'</div>':''), R.prejuizo_n?'mal':'bem');
  h+=card('res',{tipo:'inteiro',so:'volta'},'Dinheiro de volta','↩',(R.volta_n||0)+'<small>de '+(R.inteiros||0)+'</small>',
       qs('cancelados em que o iFood pagou a loja')+
       (R.aguardando_fin?qs(R.aguardando_fin+' esperando o financeiro do iFood'):'')+
       (d?'<div class="din">'+rs(R.volta_valor)+'</div>':''), '');
  h+=card('res',{so:'contestavel'},'Dava para contestar','⚖',R.contestavel||0,
       (R.contestavel?qs('contestamos '+(R.contestou||0)+' · iFood aceitou '+(R.acatada||0)+(R.recusada?' · recusou '+R.recusada:'')):qs('nenhum no período'))+
       (R.contest_sem_res?qs(R.contest_sem_res+' sem resultado (só o relatório do iFood traz)'):''), '');
  h+=card('res',{tipo:'chat'},'Reembolso só no chat','💬',R.chat_n||0,
       qs(R.chat_n?'reembolso combinado na conversa, fora dos parciais':'nenhum no período',R.chat_n?'':'boa')+
       (d&&R.chat_n?'<div class="din">'+rs(R.chat_valor)+'</div>':''), R.chat_n?'':'bem');
  return '<div class="grp"><span class="em">🚫</span><h2>O que aconteceu</h2><span class="ct">toque no quadro para ver os pedidos</span></div>'+
    '<div class="cards">'+h+'</div>'+painelSe('res');
}
function barras(g,lista,campoFiltro,max,tipo){
  if(!lista.length) return '<div class="m" style="padding:8px 0">Nada no período.</div>';
  return lista.map(function(o){
    var f={}; if(tipo) f.tipo=tipo; f[campoFiltro]=o.chave;
    var i=reg(g,f,o.rot);
    var seg=['dia','noite','fora'].filter(function(t){return (o[t]||0)>0}).map(function(t){
      return '<i class="c-'+t+'" style="flex:0 0 '+(100*o[t]/max).toFixed(1)+'%" title="'+esc(TURNO[t]+': '+o[t])+'"></i>';
    }).join('');
    return '<div class="br'+(selKey(g,f)?' on':'')+'" onclick="abre('+i+')" title="'+esc(o.rot+' — dia '+(o.dia||0)+' · noite '+(o.noite||0)+(o.fora?' · fora '+o.fora:'')+' · toque para ver os pedidos')+'">'+
      '<div class="bl"><b>'+esc(o.rot)+'</b>'+(o.sem_expl?'<span class="x">'+o.sem_expl+' esperando</span>':'')+(o.extra?' <span class="u">'+esc(o.extra)+'</span>':'')+'</div>'+
      '<div class="tri">'+seg+'</div><div class="bn">'+o.total+'</div></div>';
  }).join('');
}
function legenda(){
  var tf=(P.turnos||[]).some(function(t){return t.turno==='fora'&&(t.inteiros||t.parciais)});
  return '<div class="leg"><span><i class="c-dia"></i>'+TURNO.dia+'</span><span><i class="c-noite"></i>'+TURNO.noite+'</span>'+
    (tf?'<span><i class="c-fora"></i>'+TURNO.fora+'</span>':'')+'</div>';
}
function turnoLinha(campo){
  var t=function(k){return ((P.turnos||[]).filter(function(x){return x.turno===k})[0]||{})[campo]||0};
  return 'dia '+t('dia')+' · noite '+t('noite')+(t('fora')?' · fora '+t('fora'):'');
}
function topN(l,n){
  var a=l.slice(0,n), r=l.slice(n);
  if(r.length){ var o={rot:'Outros ('+r.length+' motivos)',chave:'',total:0,dia:0,noite:0,fora:0,sem_expl:0,outros:true};
    r.forEach(function(m){o.total+=m.total;o.dia+=m.dia;o.noite+=m.noite;o.fora+=m.fora;o.sem_expl+=m.sem_expl||0}); a.push(o); }
  return a;
}
function blocoMotivos(){
  var mi=(P.motivos_inteiro||[]).map(function(m){return {rot:frase(m.motivo),chave:m.motivo,total:m.total,dia:m.dia,noite:m.noite,fora:m.fora,sem_expl:m.sem_expl}});
  var mp=(P.motivos_parcial||[]).map(function(m){return {rot:m.motivo,chave:m.motivo,total:m.total,dia:m.dia,noite:m.noite,fora:m.fora,sem_expl:m.sem_expl,
            extra:(P.dono&&m.valor!=null)?rs(m.valor):''}});
  mi=topN(mi,7); var mx=Math.max(1,Math.max.apply(null,mi.concat(mp).map(function(o){return o.total})));
  /* "Outros" junta varios motivos: abre a lista do tipo inteiro inteira */
  var bi=barras('mot',mi.filter(function(o){return !o.outros}),'motivo',mx,'inteiro')+
    mi.filter(function(o){return o.outros}).map(function(o){ var i=reg('mot',{tipo:'inteiro'},'Cancelados inteiros');
      return '<div class="br" onclick="abre('+i+')"><div class="bl"><b>'+esc(o.rot)+'</b> <span class="u">toque para ver todos</span></div>'+
        '<div class="tri"><i class="c-fora" style="flex:0 0 '+(100*o.total/mx).toFixed(1)+'%"></i></div><div class="bn">'+o.total+'</div></div>'; }).join('');
  return '<div class="grp"><span class="em">📊</span><h2>Por que cancelaram</h2><span class="ct">toque na linha para ver os pedidos</span></div>'+
    legenda()+
    '<div class="duas">'+
      '<div class="cx"><h3>Pedido inteiro</h3><div class="sub">'+turnoLinha('inteiros')+'</div>'+bi+'</div>'+
      '<div class="cx"><h3>Parte do pedido devolvida</h3><div class="sub">'+turnoLinha('parciais')+'</div>'+barras('mot',mp,'motivo',mx,'parcial')+'</div>'+
    '</div>'+painelSe('mot');
}
function blocoCulpa(){
  var cu=(P.culpa||[]).map(function(c){var k=CULPA[c.culpa]||[c.culpa,''];return {rot:k[0],chave:c.culpa,extra:k[1],total:c.total,dia:c.dia,noite:c.noite,fora:c.fora}});
  var mx=Math.max(1,Math.max.apply(null,cu.map(function(o){return o.total}).concat([0])));
  var d=!!P.dono;
  var tq='<div class="rolar"><table class="tb" data-cdm-livre><tr><th>Quem cancelou</th><th class="n">Pedidos</th><th class="n">Voltou dinheiro</th><th class="n">Nada voltou</th>'+(d?'<th class="n">R$ que voltou</th>':'')+'</tr>'+
    (P.quem||[]).map(function(q){ var i=reg('culpa',{tipo:'inteiro',origem:q.origem},ORIG[q.origem]||q.origem);
      return '<tr class="lk" onclick="abre('+i+')"><td>'+esc(ORIG[q.origem]||q.origem)+'</td><td class="n"><span class="cd">'+q.total+'</span></td>'+
        '<td class="n"><span class="cd">'+(q.volta_n||0)+'</span></td><td class="n"><span class="cd">'+(q.sem_volta_n||0)+'</span>'+(q.aguardando?'<div class="u">+'+q.aguardando+' esperando</div>':'')+'</td>'+
        (d?'<td class="n">'+esc(rs(q.volta_valor))+'</td>':'')+'</tr>'; }).join('')+
    ((P.quem||[]).length?'':'<tr><td colspan="5" class="u">Nada no período.</td></tr>')+'</table></div>';
  return '<div class="grp"><span class="em">🧭</span><h2>De quem foi</h2><span class="ct">só cancelado inteiro · parte devolvida é sempre da sacola</span></div>'+
    '<div class="duas">'+
      '<div class="cx"><h3>De quem foi o problema</h3><div class="sub">pelo código do motivo no iFood</div>'+legenda()+barras('culpa',cu,'culpa',mx,'inteiro')+'</div>'+
      '<div class="cx"><h3>Quem apertou o cancelar</h3><div class="sub">e se o iFood devolveu o dinheiro para a loja</div>'+tq+'</div>'+
    '</div>'+painelSe('culpa');
}
function blocoQuando(){
  var se=(P.semana||[]).map(function(s){return {rot:DS[s.dow],chave:s.dow,total:s.dia+s.noite+s.fora,dia:s.dia,noite:s.noite,fora:s.fora,
           extra:s.inteiros+' inteiros · '+s.parciais+' parte'}});
  var mx=Math.max(1,Math.max.apply(null,se.map(function(o){return o.total})));
  var tm='<div class="rolar"><table class="tb" data-cdm-livre><tr><th>Marca</th><th class="n">Inteiros</th><th class="n">Parte devolvida</th></tr>'+
    (P.marcas||[]).map(function(m){ var i=reg('quando',{marca:m.marca},m.marca);
      return '<tr class="lk" onclick="abre('+i+')"><td>'+esc(m.marca)+'</td><td class="n"><span class="cd">'+m.inteiros+'</span></td><td class="n"><span class="cd">'+m.parciais+'</span></td></tr>'; }).join('')+
    ((P.marcas||[]).length?'':'<tr><td colspan="3" class="u">Nada no período.</td></tr>')+'</table></div>';
  return '<div class="grp"><span class="em">📅</span><h2>Quando e onde</h2><span class="ct">inteiros e parte devolvida juntos</span></div>'+
    '<div class="duas">'+
      '<div class="cx"><h3>Dia da semana e turno</h3><div class="sub">o que passa da meia-noite até 2h20 conta na noite anterior</div>'+legenda()+barras('quando',se,'dow',mx,'')+'</div>'+
      '<div class="cx"><h3>Por marca</h3><div class="sub">toque na marca para ver os pedidos</div>'+tm+'</div>'+
    '</div>'+painelSe('quando');
}

/* ================= painel com os pedidos ================= */
function abre(i){
  var a=ABRE[i]; if(!a) return;
  if(selKey(a.grupo,a.filtro)){ SEL=null; L=null; desenha(); return; }   // tocar de novo fecha
  SEL={grupo:a.grupo,filtro:a.filtro,titulo:a.titulo}; SO=''; L=null; LERR='';
  desenha(); carregaLista();
  setTimeout(function(){ var p=document.querySelector('.painel'); if(p&&p.scrollIntoView) p.scrollIntoView({behavior:'smooth',block:'start'}); },60);
}
function fecha(){ SEL=null; L=null; desenha(); }
function filtroSo(s){ SO=s; L=null; desenha(); carregaLista(); }
async function carregaLista(){
  if(!SEL) return;
  var alvo=SEL, sq=++LSEQ, f=Object.assign({unidade:UNI,periodo:PER},SEL.filtro);
  if(SO&&!SEL.filtro.so) f.so=SO;
  try{ var r=await porta('lista',f); if(alvo!==SEL||sq!==LSEQ) return; L=r; LERR=''; }
  catch(e){ if(alvo!==SEL||sq!==LSEQ) return; L=null; LERR=e.message||'erro'; }
  desenha();
}
function painelSe(g){
  if(!SEL||SEL.grupo!==g) return '';
  var h='<div class="painel"><div class="ph"><h3>'+esc(SEL.titulo)+'</h3>'+
    '<span class="ct">'+(L?L.total+(L.total===1?' pedido':' pedidos')+(L.total>L.itens.length?' (mostrando '+L.itens.length+')':''):'')+'</span>'+
    '<button class="mini fecha" onclick="fecha()">fechar ✕</button></div>';
  if(!SEL.filtro.so&&SEL.filtro.tipo!=='chat')
    h+='<div class="vbt" style="margin:-2px 0 10px;display:flex;gap:6px;flex-wrap:wrap">'+
      '<button class="mini'+(SO===''?' on':'')+'" onclick="filtroSo(&quot;&quot;)">Todos</button>'+
      '<button class="mini'+(SO==='sem_expl'?' on':'')+'" onclick="filtroSo(&quot;sem_expl&quot;)">Só os que esperam explicação</button>'+
      '<button class="mini'+(SO==='foto'?' on':'')+'" onclick="filtroSo(&quot;foto&quot;)">Com foto do cliente</button></div>';
  if(LERR) return h+'<div class="m">Não deu para carregar: '+esc(LERR)+'</div></div>';
  if(!L) return h+'<div class="load" style="padding:20px">Carregando os pedidos…</div></div>';
  if(!L.itens.length) return h+'<div class="m" style="padding:10px 0">Nenhum pedido aqui. 🎉</div></div>';
  return h+'<div class="vv-lista">'+L.itens.map(cartao).join('')+'</div></div>';
}
function chaveNota(o){
  /* mesma chave da antiga aba do Turno ("dia | hora | marca"), para nao perder o que a equipe ja anotou */
  var lp=function(t){return String(t==null?'':t).replace(/\s+/g,' ').trim().slice(0,60)};
  return [lp(o.dia),lp(o.hora),lp(o.marca)].filter(function(t){return t}).join(' | ').slice(0,200);
}
function cartao(o,i){
  var d=!!(L&&L.dono), ok=!!(o.expl||o.tratado);
  var tit={inteiro:'🚫 Cancelado inteiro',parcial:'✂ Parte devolvida',chat:'💬 Reembolso no chat'}[o.tipo]||'Cancelado';
  var pills=(ok?'<span class="pill p-ok">'+(o.expl?'explicado':'resolvido')+'</span>':'<span class="pill p-bad">esperando explicação</span>')+
    (o.tipo==='inteiro'&&ORIG_P[o.origem]?' <span class="pill p-off">'+esc(ORIG_P[o.origem])+'</span>':'')+
    (o.saiu?' <span class="pill p-warn">já tinha saído para entrega</span>':'')+
    (o.contestavel?' <span class="pill p-off">'+(o.contest_res?esc(frase(o.contest_res)):(o.contestou?'contestamos':'dava para contestar'))+'</span>':'');
  var mot=o.tipo==='parcial'?(esc(o.familia||'')+(o.item?': <b>'+esc(o.item)+'</b>':'')):esc(frase(o.motivo||'O iFood ainda não mandou o motivo'));
  var din='';
  if(o.tipo==='inteiro'){
    if(o.aguardando_fin) din='o financeiro do iFood ainda não chegou para dizer se voltou dinheiro';
    else din=(d&&o.valor!=null?'pedido <b>'+esc(rs(o.valor))+'</b> · ':'')+(o.volta_sim?'<span style="color:var(--ok)">o iFood pagou a loja'+(d&&o.volta!=null?' '+esc(rs(o.volta)):'')+'</span>':'<span style="color:var(--bad)">nada voltou para a loja</span>');
  } else if(d&&o.devolvido!=null) din='devolvido ao cliente <b>'+esc(rs(o.devolvido))+'</b>'+(o.valor!=null?' de um pedido de '+esc(rs(o.valor)):'');
  var h='<table class="vv'+(ok?' ok':'')+'" data-cdm-livre><tr data-cdm-chave="'+esc(chaveNota(o))+'">'+
    '<td class="hrc"><div class="hr">'+esc(o.hora||'—')+'</div><div class="ha">'+esc(o.dia||'')+(o.turno==='noite'?' 🌙':o.turno==='dia'?' ☀':'')+'</div></td>'+
    '<td><div class="tt">'+tit+' '+pills+'</div>'+
      '<div class="lj"><b>'+esc(o.marca||'')+'</b> · pedido <b>'+esc(o.n_pedido||'—')+'</b>'+(UNI==='Todas'?' · '+esc(o.loja_nome||''):'')+'</div>'+
      '<div class="it">'+mot+'</div>'+
      (o.disse&&o.disse!==o.motivo?'<div class="ds">cliente: “'+esc(String(o.disse).slice(0,220))+'”</div>':'')+
      (o.loja_fez?'<div class="rs">o que a loja fez: <b>'+esc(o.loja_fez)+'</b></div>':'')+
      (din?'<div class="rs">'+din+'</div>':'')+
      '<div class="fn">'+(o.motivo_fonte?'motivo veio de: '+esc(o.motivo_fonte)+' · ':'')+'visto em: '+esc((o.fontes||[]).join(', '))+'</div>'+
      '<div class="vbt"><button class="mini" onclick="verConversa('+i+')">💬 conversas'+(o.tem_chat?' do pedido':'')+'</button>'+
        (o.fotos?'<span class="pill p-off">📷 '+o.fotos+(o.fotos===1?' foto':' fotos')+' no chat do iFood</span>':'')+'</div>'+
    '</td><td class="sit">';
  if(o.expl){
    h+='<span class="feito">✔ '+esc(o.expl.texto||'explicado')+'</span><div class="m">'+esc(o.expl.quem||'')+' · '+esc(o.expl.quando||'')+'</div>'+
       (o.expl.pode_apagar?'<button class="mini" style="margin-top:6px" onclick="apaga('+o.expl.id+')">apagar</button>':'');
  } else if(o.tratado){
    h+='<span class="feito">✔ '+esc(o.tratado.texto||'resolvido')+'</span><div class="m">no Resolver hoje · '+esc(o.tratado.quem||'')+' · '+esc(o.tratado.quando||'')+'</div>';
  } else {
    h+='<input type="text" id="ex_'+i+'" maxlength="300" placeholder="o que aconteceu de verdade?" onkeydown="if(event.key===&quot;Enter&quot;)salva('+i+')">'+
       '<button class="mini" onclick="salva('+i+')">salvar</button>';
  }
  return h+'</td></tr></table>';
}
async function salva(i){
  /* parcial grava so a familia (o item pode trazer o preco, e o Turno devolve esse motivo para a equipe) */
  var o=L&&L.itens[i], e=$('ex_'+i); if(!o||!e) return;
  if(SALVANDO){ alert('Espere a outra explicação terminar de gravar e salve de novo.'); return }
  var t=(e.value||'').trim(); if(t.length<3){ alert('Escreva o que aconteceu (pelo menos 3 letras).'); e.focus(); return }
  SALVANDO=true; e.disabled=true;
  try{ await porta('explicar',{loja:o.loja,dia:o.dia_iso,hora:o.hora,n_pedido:o.n_pedido,tipo:o.tipo,motivo:o.tipo==='parcial'?('parcial: '+(o.familia||'')):(o.motivo||''),texto:t}); }
  catch(err){ SALVANDO=false; e.disabled=false; alert('Não consegui gravar: '+err.message); return }
  L=null; desenha();   // o cartao velho (com o botao salvar) sai da tela antes de soltar a trava
  SALVANDO=false;
  recarrega();
}
async function apaga(id){
  if(!confirm('Apagar esta explicação?')) return;
  try{ await porta('apagar',{id:id}); }catch(err){ alert('Não consegui apagar: '+err.message); return }
  recarrega();
}
async function recarrega(){
  var sq=++BSEQ;
  try{ var r=await porta('painel',{unidade:UNI,periodo:PER}); if(sq!==BSEQ) return; P=r; PERR=''; }catch(e){ if(sq!==BSEQ) return; if(!P) PERR=(e&&e.message)||'erro'; }
  placar(); L=null; desenha(); carregaLista();
}
async function verConversa(i){
  var o=L&&L.itens[i]; if(!o) return;
  var velho=document.getElementById('__conversa'); if(velho&&velho.__fecha) velho.__fecha(); else if(velho) velho.remove();
  var cx=document.createElement('div'); cx.id='__conversa'; document.body.appendChild(cx);
  cx.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;overflow:auto;padding:16px';
  var fechaCx=function(){ cx.remove(); document.removeEventListener('keydown',escCx); };
  var escCx=function(ev){ if(ev.key==='Escape') fechaCx(); };
  cx.__fecha=fechaCx;
  document.addEventListener('keydown',escCx);
  cx.onclick=function(ev){ if(ev.target===cx||(ev.target.closest&&ev.target.closest('.fechacx'))) fechaCx(); };
  var btFecha='<button class="mini fechacx" style="float:right">fechar ✕</button>';
  cx.innerHTML='<div style="max-width:680px;margin:0 auto">'+btFecha+'<div style="color:#fff;text-align:center;padding-top:6px">Buscando as conversas do pedido '+esc(o.n_pedido||'')+'…</div></div>';
  var caixa=function(cor,quem,quando,texto){ return '<div style="background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px">'+
      '<div style="color:'+cor+';font-size:11px;font-weight:800">'+esc(quem)+' · '+esc(quando||'')+'</div>'+
      (texto?'<div style="color:var(--text);font-size:14px;margin-top:2px;overflow-wrap:anywhere">'+esc(texto)+'</div>':'')+'</div>'; };
  try{
    var j=await porta('conversa',{unidade:UNI,periodo:PER,uuid:o.uuid,dia:o.dia_iso});
    var ch=(j&&j.chat)||[], fa=(j&&j.falas)||[];
    var h='<div style="max-width:680px;margin:0 auto">'+btFecha+
      '<div style="color:#fff;margin-bottom:10px;overflow-wrap:anywhere">💬 Pedido '+esc(o.n_pedido||'')+' · '+esc(o.marca||'')+'</div>';
    h+='<div style="color:var(--text2);font-weight:800;margin:6px 0">Chat do iFood (Gestor Web)</div>';
    if(!j.pode_chat) h+='<div style="color:#bbb;font-size:13px;margin-bottom:10px">O texto do chat aparece só para quem vê o Resolver hoje.</div>';
    else if(!ch.length) h+='<div style="color:#bbb;font-size:13px;margin-bottom:10px">Não achei conversa do chat gravada para este pedido.</div>';
    else h+=ch.map(function(m){ var cor=m.quem==='Cliente'?'var(--brand)':(m.quem==='Loja'?'var(--ok)':'var(--muted)');
                                 return caixa(cor,m.quem,m.quando,(m.texto||'')+(m.foto?' 📷':'')); }).join('');
    h+='<div style="color:var(--text2);font-weight:800;margin:14px 0 6px">Onde a equipe falou deste pedido</div>';
    if(!fa.length) h+='<div style="color:#bbb;font-size:13px">Nada nos grupos da equipe com o número deste pedido.</div>';
    else h+=fa.map(function(c){ return caixa('var(--muted)',(c.onde||'')+(c.quem?' · '+c.quem:''),c.quando,c.texto); }).join('');
    cx.innerHTML=h+'</div>';
  }catch(e){ cx.innerHTML='<div style="max-width:680px;margin:0 auto">'+btFecha+'<div style="color:#fff;text-align:center;padding-top:6px">Não deu para buscar as conversas.</div></div>'; }
}

/* ================= tela ================= */
function filtros(){
  var lj=function(v,r){ return '<button class="chip'+(UNI===v?' on':'')+'" onclick="trocaLoja(&quot;'+v+'&quot;)">'+esc(r)+'</button>' };
  var pe=function(v,r){ return '<button class="chip'+(PER===v?' on':'')+'" onclick="trocaPer(&quot;'+v+'&quot;)">'+esc(r)+'</button>' };
  return '<div class="filtros">'+
    '<div class="lojas"><span class="rot">LOJA</span>'+(FIXA?lj(FIXA,nomeLoja(FIXA)):lj('Todas','Todas')+LOJAS.map(function(l){return lj(l[0],l[1])}).join(''))+'</div>'+
    '<div class="lojas"><span class="rot">PERÍODO</span>'+PERIODOS.map(function(p){return pe(p[0],p[1])}).join('')+'</div></div>';
}
function trocaLoja(v){ UNI=v; try{localStorage.setItem('cdm_cancel_uni',v)}catch(e){} SEL=null; L=null; boot(); }
function trocaPer(v){ PER=v; try{localStorage.setItem('cdm_cancel_per',v)}catch(e){} SEL=null; L=null; boot(); }
function avisoFontes(){
  var f=P.fontes||{}, h='';
  if(f.relatorio_dias!=null&&f.relatorio_dias>2)
    h+='<div class="parado"><b>O relatório de cancelamentos do iFood não chega desde '+esc(f.relatorio_ate)+'.</b> '+
       'Cancelado inteiro e parte devolvida continuam certos, porque vêm da API do iFood e do Gestor Web. '+
       'O que fica faltando depois dessa data é só o resultado da contestação (se o iFood aceitou ou recusou).</div>';
  return h;
}
function desenha(){
  if(FIXA){ var t=$('tit'); if(t) t.textContent='🚫 Cancelados · '+nomeLoja(FIXA); }
  if(!P){ $('app').innerHTML=filtros()+(PERR?'<div class="cx"><b>Não deu para carregar.</b><div class="m">'+esc(PERR)+' — entre no portal de novo e tente outra vez.</div></div>':'<div class="load">Carregando…</div>'); return }
  ABRE=[];
  var f=P.fontes||{};
  var h=filtros()+avisoFontes()+blocoResumo()+blocoMotivos()+blocoCulpa()+blocoQuando()+
    '<div class="nota"><b>De onde vem:</b> cancelado inteiro pela <b>API de pedidos do iFood</b> (lida às '+esc(f.api||'—')+') '+
    'e pelo <b>financeiro do iFood</b> (diz se voltou dinheiro para a loja; chega com atraso, hoje até '+esc(f.financeiro_ate||'—')+'). '+
    'Parte devolvida pela reclamação aceita na API, pelo <b>Gestor Web</b> (lido às '+esc(f.gestor||'—')+') e pelo relatório do iFood (até '+esc(f.relatorio_ate||'—')+'). '+
    'Conversas do chat do iFood lidas às '+esc(f.chat||'—')+'. Turno do dia: 10h às 18h; da noite: 18h às 2h20.'+
    (P.dono?'':' Valores em R$ só aparecem para o dono.')+'</div>';
  $('app').innerHTML=h;
}
async function boot(){
  var sq=++BSEQ, r=null, er='';
  P=null; PERR=''; placar(); desenha();
  try{ r=await porta('painel',{unidade:UNI,periodo:PER}); }catch(e){ er=(e&&e.message)||'erro'; }
  if(sq!==BSEQ) return;   // trocou loja/periodo no meio: esta resposta ja nao vale
  P=r; PERR=er;
  if(P&&P.so_ahu&&FIXA!=='Ahu'){ FIXA='Ahu'; UNI='Ahu'; }   // quem so tem o atalho do Ahu ve so o Ahu, qualquer que seja o link
  placar(); desenha();
  if(SEL) carregaLista();
}

/* ===== porta unica do portal ===== */
const CDMMODS=['cancelados','ahucancel'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'cancelados'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
