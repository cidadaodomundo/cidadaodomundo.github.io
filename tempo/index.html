<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="/assets/chaves.js?v=1"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Tempo de Entrega · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/cdm-ui.css?v=4">
<style>
/* 03/10/2026 (chat-visual-tempo-03-10): pedido do Fabio — mesmo visual e mesma dinamica do Delivery · Sao Braz.
   Os botoes, as contas e as consultas sao as mesmas de antes; mudou so a aparencia: os numeros viraram quadros,
   e tocar num quadro leva ate a lista dele (que continua sempre aberta, porque e tela de balcao). */
:root{--azul:#4d9de0;--gold:#e0a81c}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
button.b:hover{border-color:var(--text2)}
.lojas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.lojas .rot{color:var(--muted);font-size:12px;font-weight:800;margin-right:2px}
.lojas .chip{padding:7px 13px}
.load{color:var(--muted);padding:40px 10px;text-align:center}
.m{color:var(--muted);font-size:11.5px;margin-top:10px;line-height:1.65}
.nota{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.5}

/* quadros (mesmo desenho do Delivery · Sao Braz) */
.quadros{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.quadros>*{min-width:0}
.quadros.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.quadros.sete{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.q{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 15px;text-align:left;color:var(--text);font-family:inherit;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,transform .08s}
button.q:hover{border-color:#5a5952}
button.q:active{transform:scale(.98)}
div.q{cursor:default}
.q .qt{font-size:13px;font-weight:800;color:var(--text2);display:flex;align-items:center;gap:6px;line-height:1.3}
.q .qt .em{font-size:17px}
.q .qn{font-family:'Anton',Impact,sans-serif;font-size:42px;line-height:1.05;word-break:break-word}
.q .qn span{font-family:'Barlow',sans-serif;font-size:16px;font-weight:700;color:var(--muted);margin-left:3px}
.q .qs{color:var(--muted);font-size:12px;font-weight:600;line-height:1.35}
.quadros.tres .q .qn{font-size:52px}
.q.mal{border-left:4px solid var(--bad)}
.q.mal .qn{color:#ff8a8a}
.q.aviso{border-left:4px solid var(--warn)}
.q.aviso .qn{color:var(--warn)}
.q.bem .qn{color:#7fe0aa}
.q.sd{border-style:dashed}
.q.sd .qn{color:var(--muted)}
.q.neutro .qn{color:var(--text)}
.q.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
/* o quadro "a conta pede" pega a cor da decisao (vermelho sobe, azul desce, verde fica, cinza sem dado) */
.vermelho .q.alvo{border-left:4px solid var(--bad);animation:pisca 1.1s ease-in-out infinite}
.vermelho .q.alvo .qn{color:#ff8a8a}
.azul .q.alvo{border-left:4px solid var(--azul)}
.azul .q.alvo .qn{color:#8cc4f2}
.verde .q.alvo .qn{color:#7fe0aa}
.cinza .q.alvo{border-style:dashed}
.cinza .q.alvo .qn{color:var(--muted)}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.45}}

/* aviso do que fazer (sempre a vista) */
.acao{border-radius:16px;padding:16px 18px;font-size:17px;font-weight:800;margin:12px 0 0;line-height:1.45}
.acao .p{display:block;font-size:13.5px;font-weight:600;margin-top:7px;opacity:.9}
.a-sobe{background:rgba(230,103,103,.14);border:1px solid var(--bad);border-left-width:4px;color:#ffbcbc}
.a-desce{background:rgba(77,157,224,.14);border:1px solid var(--azul);border-left-width:4px;color:#bcdcff}
.a-ok{background:rgba(37,163,95,.14);border:1px solid var(--ok);border-left-width:4px;color:#b6f0d0}
.a-cego{background:rgba(138,137,126,.14);border:1px dashed var(--muted);color:var(--text2)}
.moto{border-radius:16px;padding:14px 18px;margin:10px 0 0;line-height:1.5;background:rgba(224,168,28,.12);border:1px solid var(--gold);border-left-width:4px;color:#ffe7ab;font-size:15.5px;font-weight:700}
.moto .p{display:block;font-size:13.5px;font-weight:600;margin-top:7px;opacity:.9}

/* listas que os quadros abrem (ficam sempre a vista; o quadro so leva ate elas e acende) */
.painel{margin-top:22px}
.painel .ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.painel .ph h3{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:19px;letter-spacing:.02em}
.painel .ph .ct{color:var(--muted);font-size:13px;font-weight:600}
.painel .ph .fecha{margin-left:auto;display:none}
.painel.on .ph .fecha{display:inline-block}
.painel .caixa{transition:border-color .15s,box-shadow .15s}
.painel.on .caixa{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.lista{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.it{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.it:last-child{border-bottom:none}
.it .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it .l1 b{font-weight:800}
.it .m{color:var(--muted);font-size:12.5px;margin-top:0}
.it.pend{border-left:4px solid var(--bad)}
.it.gh{background:var(--s2);padding:8px 14px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.p-bad{background:rgba(230,103,103,.15);color:#ff9a9a}
.p-warn{background:rgba(201,133,0,.16);color:var(--warn)}
.p-ok{background:rgba(37,163,95,.15);color:#7fe0aa}
.p-off{background:var(--s3);color:var(--text2)}
.vz{color:var(--muted);font-size:14px;padding:18px 14px;text-align:center}

/* dia, hora e loja aberta (cabecalho do banco) */
.cdmcab{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 15px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cdmdia{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;letter-spacing:.02em}
.cdmabe,.cdmfec,.cdmsem{border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.cdmabe{background:rgba(37,163,95,.15);color:#7fe0aa}
.cdmfec{background:rgba(230,103,103,.18);color:#ff9a9a;font-weight:800}
.cdmsem{background:rgba(201,133,0,.16);color:var(--warn)}

body.alarme{animation:fundoAl .9s ease-in-out infinite alternate;min-height:100vh}
@keyframes fundoAl{from{background:var(--s0)}to{background:#4a0a12}}
.sil{position:fixed;right:14px;bottom:14px;z-index:99;background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;display:none}
.somaviso{position:fixed;left:0;right:0;bottom:0;background:#c8102e;color:#fff;font-weight:800;text-align:center;padding:12px;z-index:98;display:none}

/* tabela dos motoboys ao vivo 05-09-2026 — pedido do Fabio: "aquela tabela aparecer
   logo ali em baixo dos quadros para deixar os quadros vivos e funcionando" */
.mbs{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;overflow-x:auto}
.mbs table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
.mbs th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:0 10px 9px 0;border-bottom:1px solid var(--line)}
.mbs td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--text2)}
.mbs td:first-child,.mbs th:first-child{padding-left:0}
.mbs tr:last-child td{border-bottom:0}
.mbs .nome{color:var(--text);font-weight:600}
.mbs .pin{color:#7fe0aa}
.mbs .rua{color:var(--brand)}
.mbs .vazio{color:var(--muted);font-size:14px;padding:6px 0;text-align:left}
.mbs .prox{margin:0 0 12px;font-weight:700;color:#7fe0aa;font-size:14px}
.mbs .reg{color:var(--muted);font-size:11.5px;margin-top:10px;line-height:1.4}
.mbs .sin{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
.mbs .sin-v{background:var(--ok);box-shadow:0 0 0 3px rgba(37,163,95,.18)}
.mbs .sin-r{background:var(--bad);box-shadow:0 0 0 3px rgba(230,103,103,.18)}
.mbs .sin-n{background:transparent;box-shadow:none}
.mbs .leg{color:var(--muted);font-size:11.5px;margin-top:10px}

/* a conta linha por linha */
.regua{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.regua table{width:100%;border-collapse:collapse;font-size:13.5px}
.regua td{padding:7px 4px;border-bottom:1px solid var(--line);color:var(--text2)}
.regua td:last-child{text-align:right;font-weight:800;color:var(--text);white-space:nowrap}
.regua tr:last-child td{border-bottom:none}
.regua tr.aqui td{background:rgba(224,168,28,.13);color:#ffe7ab}

/* caixa de recado da equipe */
.sug{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.sug .ex{color:var(--muted);font-size:12.5px;margin-bottom:12px;line-height:1.5}
.sug input,.sug textarea{width:100%;box-sizing:border-box;background:var(--s2);border:1px solid var(--line);border-radius:11px;color:var(--text);font:inherit;font-size:14px;padding:10px 12px;margin-bottom:8px}
.sug input:focus,.sug textarea:focus{outline:none;border-color:var(--text2)}
.sug textarea{min-height:74px;resize:vertical}
.sug .bt{flex:none;display:inline-block;background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer}
.sug .av{display:block;flex:none;width:auto;height:auto;background:none;border-radius:0;font-size:13px;margin-top:9px;min-height:18px;color:#7fe0aa}
.sug .av.ruim{color:#ff8f8f}
.sug ul{list-style:none;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.sug li{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--text2);line-height:1.5}
.sug li:last-child{border-bottom:0}
.sug li b{color:var(--text)}
.sug .qd{color:var(--muted);font-size:11.5px}
.sug .st{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;border-radius:999px;padding:2px 8px;margin:0 0 0 6px}
.sug .st.novo{background:rgba(224,168,28,.18);color:#ffe7ab}
.sug .st.lido{background:rgba(255,255,255,.08);color:var(--muted)}
.sug .st.feito{background:rgba(37,163,95,.18);color:#9ce3b6}
.sug .st.descartado{background:rgba(255,255,255,.06);color:var(--muted)}
.sug .rp{display:block;margin-top:5px;color:#ffe7ab;font-size:12.5px}
.sug .dn{margin-top:6px}
.sug .dn button{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;margin-right:6px}
.sug .dn button:hover{border-color:var(--text2)}

@media (max-width:640px){
  .quadros{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quadros.tres,.quadros.sete{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quadros.tres .alvo{grid-column:1/-1;order:-1}
  .q .qn,.quadros.tres .q .qn{font-size:34px}
  .acao{font-size:15.5px;padding:14px 15px}
  .lojas{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .lojas::-webkit-scrollbar{display:none}
  .lojas .chip{flex:0 0 auto}
}
/* 04/10/2026 (chat-cartoes-operacao-04-10): cartoes iguais aos do Resolver hoje / AO VIVO da Central Cozinha */
.vv-lista{display:grid;gap:10px}
.vv-lista.duas{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.vv-lista>*{min-width:0}
div.vv{background:var(--s1);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px}
div.vv.ok{border-left-color:var(--ok)}
div.vv.bad{border-left-color:var(--bad);background:rgba(230,103,103,.06)}
div.vv.off{border-left-color:var(--muted)}
.vv .hr{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.vv .ha{color:var(--muted);font-size:11.5px;margin-top:3px}
.vv .tt{font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vv .lj{color:var(--text2);font-size:13px;margin-top:2px}
.vv .rs{margin-top:6px;font-size:12px;color:var(--muted)}
.vv .vit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line);font-size:13px;margin-top:6px}
.vv .vit .p{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;line-height:1}
.vv .vit .h{color:var(--muted);font-size:12px}
.vv .vit .m{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;white-space:nowrap;line-height:1}
.vv .vit .m{color:var(--text);margin-top:0}
.vv .vit.late .m{color:#ff8a8a}
.vv .vit .dd{color:var(--text2);font-size:12px;font-weight:700;white-space:nowrap}
.vv .vit .dd.pp{color:#7fe0aa}
.vv .vit .dd.lg{color:var(--warn)}
.vv .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.vv .p-ok{background:rgba(47,174,106,.15);color:#7fe0aa}
.vv .p-bad{background:rgba(230,103,103,.15);color:#ff9a9a}
.vv .p-warn{background:rgba(201,133,0,.16);color:var(--warn)}
.vv .p-off{background:var(--s3);color:var(--text2)}
.vv .sin{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
.vv .sin-v{background:var(--ok);box-shadow:0 0 0 3px rgba(47,174,106,.18)}
.vv .sin-r{background:var(--bad);box-shadow:0 0 0 3px rgba(230,103,103,.18)}
.vv .sin-n{display:none}
.mbs .prox{margin:0 0 10px;font-weight:800;color:#7fe0aa;font-size:14.5px}
.mbs .reg{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.45}
.mbs .vazio{font-size:14px}
.mbs .leg .sin{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.mbs .leg .sin-v{background:var(--ok)}
.mbs .leg .sin-r{background:var(--bad)}
@media (max-width:640px){div.vv{grid-template-columns:62px minmax(0,1fr);gap:8px;padding:12px 10px}.vv .hr{font-size:19px}.vv-lista.duas{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
  <div>
    <h1>⏱ Tempo de Entrega</h1>
    <div class="placar" id="placar"><span class="pl" id="sub">Loja <b>Água Verde</b> — quanto prometer ao cliente agora</span><span id="plx" style="display:contents"></span></div>
  </div>
  <div class="rt"><button class="b" onclick="location.reload()">↻ Atualizar</button></div>
</div>
<div class="lojas" id="lojas">
  <span class="rot">LOJA</span>
  <button class="chip on" data-u="Água Verde" onclick="trocaLoja('Água Verde')">Água Verde</button>
  <button class="chip" data-u="São Braz" onclick="trocaLoja('São Braz')">São Braz</button>
  <button class="chip" data-u="Ahú" onclick="trocaLoja('Ahú')">Ahú</button>
</div>
<div id="app"><div class="load">Carregando…</div></div>
</div>
<button id="sil" class="sil" onclick="silAte=Date.now()+15*60000;document.body.classList.remove('alarme');if(apitador){clearInterval(apitador);apitador=null}">⏸ Pausar o vermelho 15 min</button>
<div id="somaviso" class="somaviso">🔊 Toque na tela UMA VEZ para ligar o som do alarme</div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function rpc(nome,corpo){
  try{
    const r=await fetch(SB+'rpc/'+nome,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
    return r.ok?await r.json():null;
  }catch(e){return null}
}

function cdmCab(d){
  var s='';
  var hr=d.loja_horario?(' · '+d.loja_horario):'';
  if(d.loja_status==='fechada'){s='<div class="cdmfec">🔴 A LOJA ESTÁ FECHADA no iFood'+(d.loja_horario?(' — hoje o horário é '+d.loja_horario):'')+'</div>';}
  else if(d.loja_status==='aberta'){s='<div class="cdmabe">🟢 Loja aberta no iFood'+hr+'</div>';}
  else if(!d.loja_status){var q=Number(d.loja_status_ha_min||0);var qt=q>=2880?(Math.round(q/1440)+' dias'):(q>=120?(Math.round(q/60)+' horas'):(q+' minutos'));s='<div class="cdmsem">⚠️ Não sei dizer se a loja está aberta — esse dado não é lido há '+qt+'</div>';}
  return '<div class="cdmcab"><div class="cdmdia">'+esc(d.agora_dia||d.agora||'')+'</div>'+s+'</div>';
}
function cdmRetrato(d){
  var p=d.pedidos||[];
  var cab=function(tit,ct){return '<div class="painel" id="sec_ret"><div class="ph"><h3>📦 '+tit+'</h3>'+(ct?'<span class="ct">'+ct+'</span>':'')+'<button class="b fecha" data-fecha="1">fechar ✕</button></div>';};
  if(!p.length) return cab('O que está acontecendo agora','')+'<div class="lista caixa"><div class="vz">'+((d.cego===true&&d.loja_status!=='fechada')?'Sem dado ao vivo — não dá para saber quem está com pedido na mão':'Ninguém com pedido na mão agora')+'</div></div></div>';
  var por={},ordem=[];
  p.forEach(function(x){var k=x.entregador?x.entregador:'— ainda sem motoboy';if(!por[k]){por[k]=[];ordem.push(k)}por[k].push(x)});
  /* 04/10/2026 (chat-cartoes-operacao-04-10): um cartao por motoboy (ou "ainda sem motoboy"), o pedido mais antigo em destaque */
  var h=cab('O que está acontecendo agora',p.length+' pedido'+(p.length>1?'s':'')+' · um cartão por motoboy')+'<div class="vv-lista duas">';
  ordem.forEach(function(k){
    var ms=por[k].map(function(x){return Number(x.min);}).filter(function(n){return isFinite(n);}), mx=ms.length?Math.max.apply(null,ms):null;
    h+='<div class="vv '+(mx==null?'off':(mx>=60?'bad':(mx>=45?'':'off')))+'"><div><div class="hr">'+(mx==null?'—':mx)+'</div><div class="ha">min, o mais antigo</div></div><div>'+
      '<div class="tt">'+esc(k)+' <span class="pill p-off">'+por[k].length+' '+(por[k].length===1?'pedido':'pedidos')+'</span></div>'+
      por[k].map(function(x){
        return '<div class="vit'+(x.min>=60?' late':'')+'"><span class="p">'+esc(x.pedido)+'</span><span class="h">'+esc(x.etapa)+' · entrou '+esc(x.entrou)+'</span><span class="m">'+esc(x.min)+' min</span></div>';
      }).join('')+
    '</div></div>';
  });
  return h+'</div></div>';
}
/* 03/10/2026: quadro no desenho do Delivery · São Braz. Com alvo vira botão: tocar acende o quadro e a lista dele
   e rola até ela. A lista não some ao fechar — é tela de balcão, tudo continua à vista. */
let ABERTO=null;
function qB(o){
  var miolo='<div class="qt"><span class="em">'+o.em+'</span>'+o.t+'</div><div class="qn">'+o.n+'</div><div class="qs">'+o.s+'</div>';
  if(!o.alvo) return '<div class="q '+o.k+'">'+miolo+'</div>';

function marcaAberto(){
  var alvo=null;
  document.querySelectorAll('#app [data-q]').forEach(function(b){var on=(b.getAttribute('data-q')===ABERTO);b.classList.toggle('on',on);if(on)alvo=b.getAttribute('data-alvo')});
  document.querySelectorAll('#app .painel[id]').forEach(function(p){p.classList.toggle('on',p.id===alvo)});
}
function abreQ(id){

  var b=document.querySelector('#app [data-q="'+ABERTO+'"]'), p=b?$(b.getAttribute('data-alvo')):null;
  if(p&&p.scrollIntoView) p.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function ligaQuadros(){

let sugRascunhoQuem='', sugRascunhoTxt='';
async function sugEnviar(){
  var q=$('sugQuem'), t=$('sugTxt'), av=$('sugAviso');
  if(!t||!av) return;
  var txt=(t.value||'').trim();
  if(txt.length<5){av.className='av ruim';av.textContent='Escreva pelo menos uma frase.';return}
  av.className='av'; av.textContent='Mandando…';
  var r=await rpc('delivery_sugestao_gravar',{p_token:cdmTok(),p_unidade:UNI,p_quem:(q?q.value:''),p_texto:txt});
  if(r&&r.ok){av.className='av';av.textContent='Recado enviado. Obrigado!';sugRascunhoTxt='';t.value='';boot()}
  else{av.className='av ruim';av.textContent=(r&&r.erro)?r.erro:'Não consegui enviar agora. Tente de novo.'}
}
async function sugAcao(id,st){
  var av=$('sugAviso'); if(av){av.className='av';av.textContent='Salvando…'}
  var r=await rpc('delivery_sugestao_acao',{p_token:cdmTok(),p_id:id,p_status:st});
  if(r&&r.ok){boot()} else if(av){av.className='av ruim';av.textContent=(r&&r.erro)?r.erro:'Não consegui salvar.'}
}
let AC=null,somOk=false,silAte=0,apitador=null;
function ligaSom(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();somOk=true;var av=document.getElementById('somaviso');if(av)av.style.display='none';}catch(e){}}
/* som RELIGADO a pedido do Fabio em 03/09/2026: "quero que apite a partir de agora". Ficou mudo de 31/08 ate 03/09 por pedido dele. O apito so toca com a tela VERMELHA, depois do primeiro toque na tela (regra dos navegadores), a cada 10s, e para sozinho quando sai o vermelho, quando a aba esconde ou quando aperta Silenciar 15 min. */
function apita(){if(!somOk||!AC)return;if(Date.now()<silAte)return;try{var t=AC.currentTime;var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=880;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.05);g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.6);var o2=AC.createOscillator(),g2=AC.createGain();o2.type='square';o2.frequency.value=660;g2.gain.setValueAtTime(0.0001,t+0.6);g2.gain.exponentialRampToValueAtTime(0.5,t+0.65);g2.gain.exponentialRampToValueAtTime(0.0001,t+1.15);o2.connect(g2);g2.connect(AC.destination);o2.start(t+0.6);o2.stop(t+1.2);}catch(e){}}
function alarme(liga){if(Date.now()<silAte)liga=false;document.body.classList.toggle('alarme',liga);var b=document.getElementById('sil');if(b)b.style.display=liga?'block':'none';var av=document.getElementById('somaviso');if(av)av.style.display=(liga&&!somOk)?'block':'none';if(liga&&somOk){if(!apitador){apita();apitador=setInterval(apita,10000)}}else if(apitador){clearInterval(apitador);apitador=null}}
try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}
function cdmPrimeiroToque(){ligaSom();if(somOk){['click','touchstart','keydown'].forEach(function(ev){document.removeEventListener(ev,cdmPrimeiroToque)});if(document.body.classList.contains('alarme')&&!apitador){apita();apitador=setInterval(apita,10000)}}}
['click','touchstart','keydown'].forEach(function(ev){document.addEventListener(ev,cdmPrimeiroToque,{passive:true})});

/* ===== porta unica do portal ===== */
const CDMMODS=['tempo'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'tempo'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok){boot();var cdmT=setInterval(boot,180000);document.addEventListener('visibilitychange',function(){if(document.hidden){clearInterval(cdmT);cdmT=null;if(apitador){clearInterval(apitador);apitador=null}}else if(!cdmT){boot();cdmT=setInterval(boot,180000)}})}});
