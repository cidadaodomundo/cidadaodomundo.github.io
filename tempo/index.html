<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Tempo de Entrega · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500;--gold:#e0a81c;--azul:#4d9de0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1000px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:16px}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:14px}
.big{background:var(--s1);border:2px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.big .n{font-size:56px;font-weight:800;line-height:1}
.big .n span{font-size:20px;font-weight:700;color:var(--muted)}
.big .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin-top:6px}
.big .x{color:var(--text2);font-size:12px;margin-top:6px}
.vermelho .alvo{border-color:var(--bad);animation:pisca 1.1s ease-in-out infinite}
.vermelho .alvo .n{color:var(--bad)}
.azul .alvo{border-color:var(--azul)}
.azul .alvo .n{color:var(--azul)}
.verde .alvo{border-color:var(--ok)}
.verde .alvo .n{color:var(--ok)}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.45}}
.acao{border-radius:14px;padding:16px 18px;font-size:17px;font-weight:800;margin-bottom:14px;line-height:1.45}
.acao .p{display:block;font-size:13.5px;font-weight:600;margin-top:7px;opacity:.9}
.a-sobe{background:rgba(230,103,103,.14);border:1px solid var(--bad);color:#ffbcbc}
.a-desce{background:rgba(77,157,224,.14);border:1px solid var(--azul);color:#bcdcff}
.a-ok{background:rgba(47,174,106,.14);border:1px solid var(--ok);color:#b6f0d0}
.moto{border-radius:14px;padding:16px 18px;margin-bottom:16px;line-height:1.5;background:rgba(224,168,28,.12);border:1px solid var(--gold);color:#ffe7ab;font-size:15.5px;font-weight:700}
.moto .p{display:block;font-size:13.5px;font-weight:600;margin-top:7px;opacity:.9}
.res{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.k{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:12px 16px;min-width:128px;flex:1}
.k .n{font-size:22px;font-weight:800}
.k .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.k.mal .n{color:var(--bad)}
.k.aten .n{color:var(--gold)}
.k.bom .n{color:var(--ok)}
.regua{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:12px}
.regua h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}
.regua table{width:100%;border-collapse:collapse;font-size:13.5px}
.regua td{padding:6px 4px;border-bottom:1px solid var(--line);color:var(--text2)}
.regua td:last-child{text-align:right;font-weight:800;color:var(--text);white-space:nowrap}
.regua tr:last-child td{border-bottom:none}
.regua tr.aqui td{background:rgba(224,168,28,.13);color:#ffe7ab}
.m{color:var(--muted);font-size:11.5px;margin-top:10px;line-height:1.65}
.load{color:var(--muted);padding:40px;text-align:center}
body.alarme{animation:fundoAl .9s ease-in-out infinite alternate}
@keyframes fundoAl{from{background:var(--s0)}to{background:#4a0a12}}
.sil{position:fixed;right:14px;bottom:14px;z-index:99;background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;display:none}
.somaviso{position:fixed;left:0;right:0;bottom:0;background:#c8102e;color:#fff;font-weight:800;text-align:center;padding:12px;z-index:98;display:none}

/* tabela dos motoboys ao vivo 05-09-2026 — pedido do Fabio: "aquela tabela aparecer
   logo ali em baixo dos quadros para deixar os quadros vivos e funcionando" */
.mbs{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;overflow-x:auto}
.mbs h2{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;font-size:14px;letter-spacing:.04em;color:var(--brand);margin-bottom:12px}
.mbs table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
.mbs th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:0 10px 9px 0;border-bottom:1px solid var(--line)}
.mbs td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--text2)}
.mbs td:first-child,.mbs th:first-child{padding-left:0}
.mbs tr:last-child td{border-bottom:0}
.mbs .nome{color:var(--text);font-weight:600}
.mbs .pin{color:var(--ok)}
.mbs .rua{color:var(--brand)}
.mbs .vazio{color:var(--muted);font-size:13px}
.mbs .prox{margin:-4px 0 12px;font-weight:700;color:var(--ok);font-size:14px}
.mbs .reg{color:var(--muted);font-size:11.5px;margin-top:10px;line-height:1.4}
.mbs .sin{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
.mbs .sin-v{background:var(--ok);box-shadow:0 0 0 3px rgba(47,174,106,.18)}
.mbs .sin-r{background:var(--bad);box-shadow:0 0 0 3px rgba(230,103,103,.18)}
.mbs .sin-n{background:transparent;box-shadow:none}
.mbs .leg{color:var(--muted);font-size:11.5px;margin-top:10px}
.sug{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.sug h2{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;font-size:14px;letter-spacing:.04em;color:var(--brand);margin-bottom:6px}
.sug .ex{color:var(--muted);font-size:12.5px;margin-bottom:12px;line-height:1.5}
.sug input,.sug textarea{width:100%;box-sizing:border-box;background:#0d0d0d;border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:10px 12px;margin-bottom:8px}
.sug textarea{min-height:74px;resize:vertical}
.sug .bt{background:var(--gold);color:#111;border:0;border-radius:10px;padding:11px 18px;font-weight:800;font-size:14px;cursor:pointer}
.sug .av{font-size:13px;margin-top:9px;min-height:18px;color:var(--ok)}
.sug .av.ruim{color:#ff8f8f}
.sug ul{list-style:none;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.sug li{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--text2);line-height:1.5}
.sug li:last-child{border-bottom:0}
.sug li b{color:var(--text)}
.sug .qd{color:var(--muted);font-size:11.5px}
.sug .st{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;border-radius:6px;padding:2px 7px;margin-left:6px}
.sug .st.novo{background:rgba(224,168,28,.18);color:#ffe7ab}
.sug .st.lido{background:rgba(255,255,255,.08);color:var(--muted)}
.sug .st.feito{background:rgba(45,160,90,.18);color:#9ce3b6}
.sug .st.descartado{background:rgba(255,255,255,.06);color:var(--muted)}
.sug .rp{display:block;margin-top:5px;color:#ffe7ab;font-size:12.5px}
.sug .dn{margin-top:6px}
.sug .dn button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer;margin-right:6px}

/* seletor de loja 05-09-2026 — a tela era so Agua Verde e nao avisava */
.lojas{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 16px}
.lj{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:999px;padding:9px 18px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.02em}
.lj:hover{border-color:var(--brand);color:var(--text)}
.lj.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* cara da casa 04-09-2026 */
h1,.gatebox h1{font-weight:400}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06}

/* cabe no celular 04-09-2026 — filas de aba nunca vazam ate 900px; o resto so em tela estreita */
@media (max-width:900px){.views,.tabs,.abas,.fil,.pes,.filtros,.chips,.lojas,.periodos{display:flex;flex-wrap:wrap;gap:6px;width:auto;max-width:100%;min-width:0}.views>*,.tabs>*,.abas>*,.fil>*,.pes>*{flex:0 0 auto;max-width:100%}}@media (max-width:640px){body{padding-left:12px;padding-right:12px}table{display:block;width:max-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}h1{font-size:clamp(18px,6.2vw,26px);word-break:break-word}img,svg,canvas,iframe{max-width:100%}}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">⏱</div><div><h1>⏱ Tempo de Entrega</h1><div class="sub" id="sub">Água Verde — quanto prometer ao cliente agora</div></div></div>
  <div class="rt"><button class="b" onclick="location.reload()">↻ Atualizar</button></div>
</div>
<div class="lojas" id="lojas">
  <button class="lj on" data-u="Água Verde" onclick="trocaLoja('Água Verde')">Água Verde</button>
  <button class="lj" data-u="São Braz" onclick="trocaLoja('São Braz')">São Braz</button>
  <button class="lj" data-u="Ahú" onclick="trocaLoja('Ahú')">Ahú</button>
</div>
<div id="app"><div class="load">Carregando…</div></div>
<button id="sil" class="sil" onclick="silAte=Date.now()+15*60000;document.body.classList.remove('alarme');if(apitador){clearInterval(apitador);apitador=null}">⏸ Pausar o vermelho 15 min</button>
<div id="somaviso" class="somaviso">🔊 Toque na tela UMA VEZ para ligar o som do alarme</div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function rpc(nome,corpo){
  try{
    const r=await fetch(SB+'rpc/'+nome,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
    return r.ok?await r.json():null;
  }catch(e){return null}
}

function cdmCab(d){
  var s='';
  var hr=d.loja_horario?(' · '+d.loja_horario):'';
  if(d.loja_status==='fechada'){s='<div class="cdmfec">🔴 A LOJA ESTÁ FECHADA no iFood'+(d.loja_horario?(' — hoje o horário é '+d.loja_horario):'')+'</div>';}
  else if(d.loja_status==='aberta'){s='<div class="cdmabe">🟢 Loja aberta no iFood'+hr+'</div>';}
  else if(!d.loja_status){var q=Number(d.loja_status_ha_min||0);var qt=q>=2880?(Math.round(q/1440)+' dias'):(q>=120?(Math.round(q/60)+' horas'):(q+' minutos'));s='<div class="cdmsem">⚠️ Não sei dizer se a loja está aberta — esse dado não é lido há '+qt+'</div>';}
  return '<style>.cdmcab{background:#111;color:#fff;border-radius:12px;padding:12px 16px;margin:0 0 14px}.cdmdia{font-size:20px;font-weight:800;letter-spacing:.3px}.cdmabe{margin-top:8px;background:#1b5e20;padding:8px 12px;border-radius:8px;font-weight:600;font-size:13px}.cdmfec{margin-top:8px;background:#c62828;padding:8px 12px;border-radius:8px;font-weight:700}.cdmsem{margin-top:8px;background:#5d4037;padding:8px 12px;border-radius:8px;font-size:13px}.cdmret{margin-top:18px}.cdmret h3{font-size:17px;margin:0 0 10px}.cdmg{border:1px solid #ddd;border-radius:10px;margin-bottom:10px;overflow:hidden}.cdmgn{background:#f3f3f3;padding:8px 12px;font-weight:700;font-size:14px}.cdml{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid #eee;font-size:14px}.cdmp{font-weight:700;min-width:56px}.cdme{flex:1;color:#555}.cdmh{color:#888;font-variant-numeric:tabular-nums}.cdmm{font-weight:800;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}.cdmate .cdmm{color:#e65100}.cdmmal{background:#ffebee}.cdmmal .cdmm{color:#c62828}</style><div class="cdmcab"><div class="cdmdia">'+esc(d.agora_dia||d.agora||'')+'</div>'+s+'</div>';
}
function cdmRetrato(d){
  var p=d.pedidos||[];
  if(!p.length) return '<div class="cdmret"><h3>Ninguém com pedido na mão agora</h3></div>';
  var por={},ordem=[];
  p.forEach(function(x){var k=x.entregador?x.entregador:'— ainda sem motoboy';if(!por[k]){por[k]=[];ordem.push(k)}por[k].push(x)});
  var h='<div class="cdmret"><h3>O que está acontecendo agora — '+p.length+' pedido'+(p.length>1?'s':'')+'</h3>';
  ordem.forEach(function(k){
    h+='<div class="cdmg"><div class="cdmgn">'+esc(k)+' · '+por[k].length+'</div>';
    por[k].forEach(function(x){
      var c=(x.min>=60)?'cdmmal':((x.min>=45)?'cdmate':'');
      h+='<div class="cdml '+c+'"><span class="cdmp">'+esc(x.pedido)+'</span><span class="cdme">'+esc(x.etapa)+'</span><span class="cdmh">entrou '+esc(x.entrou)+'</span><span class="cdmm">'+x.min+' min</span></div>';
    });
    h+='</div>';
  });
  return h+'</div>';
}
function pinta(d){
  const prom=Number(d.prometido||0), sug=Number(d.sugerido||0), dif=sug-prom;
  const clima=String(d.clima||'seco'), ppm=d.por_motoboy, lim=Number(d.limite_por_motoboy||5.5);
  const motos=Number(d.motoboys||0);
  const prontos=Number(d.prontos_sem_motoboy||0), antigo=Number(d.mais_antigo_min||0), parados=Number(d.parados||0);
  /* 13/09/2026: o Gestor de Pedidos so e lido 1x por hora. Quando o que esta parado vem
     de la, a tela tem que dizer de quando e o numero, em vez de fingir que e de agora. */
  const gwMin=(d.gw_atraso_min==null?null:Number(d.gw_atraso_min));
  const vemDoGW=String(d.parados_fonte||'').indexOf('passaram da hora')>=0;
  const idadeGW=(vemDoGW&&gwMin!=null)?' — lido há '+gwMin+' min no Gestor de Pedidos, pode já ter mudado':'';

  const pAtual=d.preset_atual||null, pSug=d.preset_sugerido||null, pDe=d.preset_sugerido_de, pAte=d.preset_sugerido_ate, aco=d.acao||null;
  const presets=Array.isArray(d.presets)?d.presets:[];
  const faixa=(n,de,ate)=>'<b>'+esc(n)+'</b> ('+de+'–'+ate+' min)';
  const onde='Onde: Gestor de Pedidos → Ajustes → Gestão de lojas → Gerenciar pré-configurações → escolha a faixa → Salvar.';

  let acao,cls;
  if(aco==='subir'&&pSug){acao='<div class="acao a-sobe">🔺 TROQUE para '+faixa(pSug,pDe,pAte)+'<span class="p">'+esc(d.motivo)+'. A conta pede '+sug+' min; hoje está '+(pAtual?'na '+esc(pAtual):'em '+prom+' min')+' e o cliente enxerga '+(prom+10)+'. '+onde+'</span></div>';cls='vermelho'}
  else if(aco==='baixar'&&pSug){acao='<div class="acao a-desce">🔻 Dá para VOLTAR para '+faixa(pSug,pDe,pAte)+'<span class="p">'+esc(d.motivo)+'. Está em '+prom+' e a conta pede '+sug+' — tempo alto à toa espanta cliente. Confira daqui a meia hora antes de mexer. '+onde+'</span></div>';cls='azul'}
  else if(aco==='fica'){acao='<div class="acao a-ok">✅ Fique na '+esc(pAtual||pSug||(prom+' min'))+'<span class="p">'+esc(d.motivo)+'.</span></div>';cls='verde'}
  else if(dif>4){acao='<div class="acao a-sobe">🔺 SUBA o tempo para '+sug+' minutos<span class="p">'+esc(d.motivo)+'. Hoje está em '+prom+', e o cliente enxerga '+(prom+10)+'.</span></div>';cls='vermelho'}
  else if(dif<-8){acao='<div class="acao a-desce">🔻 Dá para BAIXAR para '+sug+' minutos<span class="p">'+esc(d.motivo)+'. Está em '+prom+' e a conta pede '+sug+' — tempo alto à toa espanta cliente.</span></div>';cls='azul'}
  else{acao='<div class="acao a-ok">✅ Está bom assim<span class="p">'+esc(d.motivo)+'.</span></div>';cls='verde'}

  if(parados>0&&Number(d.pedidos_hora||0)>0&&(aco==='subir'||sug>prom+4)){cls='vermelho';acao='<div class="acao a-sobe">🛵 A FILA NÃO ESTÁ ANDANDO — '+motos+' motoboy'+(motos===1?'':'s')+' na rua hoje<span class="p">'+(prontos>0?prontos+' pedido'+(prontos===1?'':'s')+' pronto'+(prontos===1?'':'s')+' esperando quem leve':parados+' pedido'+(parados===1?'':'s')+' já passou da hora prometida'+idadeGW)+'. Não dá para chamar mais ninguém no meio do turno — com quem está na rua, o jeito é '+(pSug&&aco==='subir'?'trocar para '+faixa(pSug,pDe,pAte):'subir para a próxima faixa')+' enquanto a prateleira não baixa.</span></div>';}
  else if(parados>0&&Number(d.pedidos_hora||0)>0){cls='azul';acao='<div class="acao a-desce">⏸ A FILA NÃO ESTÁ ANDANDO — mas o tempo que você promete já cobre<span class="p">'+(prontos>0?prontos+' pedido'+(prontos===1?'':'s')+' pronto'+(prontos===1?'':'s')+' esperando quem leve':parados+' pedido'+(parados===1?'':'s')+' já passou da hora'+idadeGW)+', com '+motos+' motoboy'+(motos===1?'':'s')+' na rua hoje. Você promete '+prom+' min e a conta pede '+sug+' — a faixa não precisa mexer agora. O gargalo é a retirada: veja quem saiu para rota longa antes de baixar o tempo.</span></div>';}
let moto='';
  if(parados>0&&Number(d.pedidos_hora||0)>0){
    moto='<div class="moto">🛵 '+motos+' motoboy'+(motos===1?'':'s')+' na rua agora — a conta é feita com quem está trabalhando hoje.'+
      '<span class="p">'+(ppm==null?'':'Está saindo '+ppm+' pedido por motoboy na última hora. ')+'Não entra gente nova no meio do turno: o único botão que existe de verdade é a faixa do iFood, e o aviso acima diz se ela precisa mexer.</span></div>';
  } else if(prontos>=10){
    moto='<div class="moto">🛵 '+prontos+' pedidos prontos parados esperando quem leve.'+
      '<span class="p">O ritmo de entrada está bom ('+ppm+' por motoboy), mas a comida está esfriando no balcão. Vale olhar se alguém saiu para uma rota longa.</span></div>';
  }

  let h='<div class="'+cls+'">'+
   '<div class="tri">'+
    '<div class="big"><div class="n">'+prom+'<span> min</span></div><div class="l">'+(pAtual?'faixa '+esc(pAtual)+' no iFood':'prometido no iFood')+'</div><div class="x">o cliente enxerga '+(prom+10)+' min</div></div>'+
    '<div class="big alvo"><div class="n">'+(pSug?esc(pSug):sug+'<span> min</span>')+'</div><div class="l">'+(pSug?'a faixa que a conta pede':'a conta pede')+'</div><div class="x">'+(pSug?'a conta pede '+sug+' min · faixa '+pDe+'–'+pAte:'cobre 8 de cada 10 pedidos')+'</div></div>'+
    '<div class="big"><div class="n">'+(ppm==null?'—':ppm)+'</div><div class="l">pedidos por motoboy</div><div class="x">'+clima+' · o limite hoje é '+lim+'</div></div>'+
   '</div>'+acao+moto+'</div>';

  h+='<div class="res">'+
   '<div class="k"><div class="n">'+motos+'</div><div class="l">motoboys na rua hoje</div></div>'+
   '<div class="k"><div class="n">'+Number(d.pedidos_hora||0)+'</div><div class="l">pedidos na última hora</div></div>'+
   '<div class="k'+(prontos>=10?' mal':(prontos>=5?' aten':''))+'"><div class="n">'+prontos+'</div><div class="l">prontos esperando motoboy</div></div>'+
   '<div class="k"><div class="n">'+Number(d.esperando_cozinha||0)+'</div><div class="l">na fila da cozinha</div></div>'+
   '<div class="k'+(Number(d.preparo_p80||0)>22?' aten':'')+'"><div class="n">'+Number(d.preparo_p80||0)+' min</div><div class="l">preparo</div></div>'+
   '<div class="k'+(antigo>90?' mal':'')+'"><div class="n">'+antigo+' min</div><div class="l">o pedido mais antigo</div></div>'+
   '<div class="k'+(Number(d.chuva_mm||0)>=1?' aten':'')+'"><div class="n">'+Number(d.chuva_mm||0).toFixed(1)+' mm</div><div class="l">chuva agora · '+Number(d.chuva_prob||0)+'% de chance</div></div>'+
  '</div>';

  /* 19/09/2026, pedido do Fábio: quantas entregas faltam para cada motoboy e quando ele fica livre de novo.
     A conta vem do banco (motoboy_livre_calc), com a mediana do TrackEat da loja. */
  var mbProx = function(lst){
    var c = lst.filter(function(m){return m.livre && m.livre_min!=null;});
    if(!c.length) return '';
    c.sort(function(a,b){return a.livre_min-b.livre_min;});
    var p = c[0];
    return '<div class="prox">🟢 '+(p.livre==='agora'?'Livre agora: ':'Próximo motoboy livre: ~'+esc(p.livre)+' — ')+esc(p.motoboy)+'</div>';
  };
  var mbRegua = function(r){
    if(!r) return '';
    return '<div class="reg">Livre ~ é estimativa: '+esc(String(r.ida_min))+' min até a 1ª entrega, '+esc(String(r.entre_min))+' min entre uma entrega e outra e '+
      esc(String(r.volta_min))+' min de volta (mediana do TrackEat desta loja, '+esc(String(r.amostra))+' entregas dos últimos '+esc(String(r.dias))+' dias). A volta usa o mesmo tempo da ida.</div>';
  };
  /* 05/09/2026: a tabela dos motoboys logo abaixo dos quadros, para dar cara aos numeros */
  var mb = Array.isArray(d.motoboys_lista)?d.motoboys_lista:[];
  /* 20/09/2026, pedido do Fábio, palavras dele: "sinal vermelho é qdo ele esta ocupado,
     sinal verde qdo ele ja fez as entregas e esta retornando pra loja".
     A bolinha só diz o que o TrackEat sabe: quantas entregas ele tem na mão agora.
     Quando o TrackEat não tem esse motoboy (o do Foody, por exemplo), faltam vem nulo e NÃO se acende sinal nenhum —
     bolinha verde por falta de dado seria dizer que ele está livre sem saber. */
  var mbSinal = function(m){
    if(m.faltam === null || m.faltam === undefined) return '<span class="sin sin-n" title="o TrackEat não tem este motoboy agora"></span>';
    return (m.faltam > 0)
      ? '<span class="sin sin-r" title="com entrega na mão"></span>'
      : '<span class="sin sin-v" title="sem entrega na mão agora"></span>';
  };
  var mbLegenda = function(lst){
    var naosei = lst.some(function(m){ return m.faltam === null || m.faltam === undefined; });
    return '<div class="leg"><span class="sin sin-r"></span>com entrega na mão'+
      ' &nbsp;·&nbsp; <span class="sin sin-v"></span>sem entrega na mão agora'+
      (naosei ? ' &nbsp;·&nbsp; sem bolinha: este motoboy não aparece no TrackEat agora' : '')+'</div>';
  };
  h+='<div class="mbs"><h2>🛵 Quem está com o aplicativo ligado neste minuto</h2>'+mbProx(mb)+
    (mb.length
      ? '<table><tr><th>Motoboy</th><th>Onde está</th><th>Distância da loja</th><th>Situação</th><th>Faltam</th><th>Livre ~</th><th>App</th><th>Visto</th></tr>'+
        mb.map(function(m){return '<tr><td class="nome">'+mbSinal(m)+esc(m.motoboy)+'</td>'+
          '<td class="'+(m.no_patio?'pin':'rua')+'">'+(m.no_patio?'🟢 ':'🛵 ')+esc(m.onde)+'</td>'+
          '<td>'+esc(m.dist||'—')+'</td><td>'+esc(m.situacao)+'</td>'+
          '<td>'+(m.faltam>0?'<b>'+esc(String(m.faltam))+'</b> '+(m.faltam==1?'entrega':'entregas'):'—')+'</td>'+
          '<td>'+(m.livre==='agora'?'<span class="pin">agora</span>':(m.livre?'~'+esc(m.livre):'—'))+'</td><td>'+esc(m.app)+'</td><td>'+esc(m.visto)+'</td></tr>'}).join('')+
        '</table>'+mbLegenda(mb)+mbRegua(d.motoboys_regua)
      : '<div class="vazio">Nenhum motoboy com o aplicativo ligado nos últimos 30 minutos.</div>')+
   '</div>';

  /* 13/09/2026, pedido do Fábio: a caixa onde a equipe do delivery escreve o que mudar */
  var sg = Array.isArray(d.sugestoes)?d.sugestoes:[];
  var dono = d.sou_dono===true;
  h+='<div class="sug"><h2>✍ O que dá para melhorar aqui</h2>'+
    '<div class="ex">Escreveu aqui, o Fábio lê. Diga o que esta tela está mostrando errado, o que falta nela, ou o que atrapalha o seu turno. Este recado é da loja '+esc(UNI)+'.</div>'+
    '<input id="sugQuem" maxlength="40" placeholder="Seu nome">'+
    '<textarea id="sugTxt" maxlength="800" placeholder="Ex.: a tela conta motoboy que já foi embora"></textarea>'+
    '<button class="bt" onclick="sugEnviar()">Enviar</button>'+
    '<div class="av" id="sugAviso"></div>'+
    (sg.length
      ? '<ul>'+sg.map(function(s){return '<li><b>'+esc(s.quem||'sem nome')+'</b> <span class="qd">'+esc(s.quando)+'</span>'+
          '<span class="st '+esc(s.status)+'">'+esc(s.status)+'</span><br>'+esc(s.texto)+
          (s.resposta?'<span class="rp">↳ '+esc(s.resposta)+'</span>':'')+
          (dono?'<div class="dn"><button onclick="sugAcao('+s.id+',\'lido\')">marcar lido</button>'+
                '<button onclick="sugAcao('+s.id+',\'feito\')">já resolvi</button>'+
                '<button onclick="sugAcao('+s.id+',\'descartado\')">descartar</button></div>':'')+
        '</li>'}).join('')+'</ul>'
      : '<div class="ex" style="margin-top:12px">Ninguém escreveu nada nos últimos 21 dias.</div>')+
   '</div>';

  const nOu=(v)=>(v===null||v===undefined||v==='')?'—':v;
  const rBase=d.regua_base, rClima=Number(d.regua_add_clima||0), rCarga=Number(d.regua_add_carga||0);
  const rP80=d.real_p80, rN=Number(d.real_n||0), rFonte=d.real_fonte||null;
  h+='<div class="regua"><h2>De onde saem os '+sug+' min — a conta de agora, linha por linha</h2><table>'+
   '<tr><td>'+esc(String(d.dia_semana||'').toLowerCase())+' no '+esc(d.turno||'')+', em dia seco — o histórico desta loja</td><td>'+nOu(rBase)+' min</td></tr>'+
   '<tr class="'+(rClima>0?'aqui':'')+'"><td>tempo agora: '+esc(clima)+'</td><td>'+(rClima>0?'+'+rClima:'0')+' min</td></tr>'+
   '<tr class="'+(rCarga>0?'aqui':'')+'"><td>'+(parados>0?parados+' pedido'+(parados===1?'':'s')+' parado'+(parados===1?'':'s')+(d.parados_fonte?' ('+esc(d.parados_fonte)+(vemDoGW&&gwMin!=null?', lido há '+gwMin+' min':'')+')':''):'nada parado agora')+'</td><td>'+(rCarga>0?'+'+rCarga:'0')+' min</td></tr>'+
   '<tr class="aqui"><td><b>a conta pede</b></td><td>'+sug+' min</td></tr>'+
   ((rP80!=null&&rFonte)?'<tr><td>teto do que saiu de verdade nos últimos 120 min — 8 de cada 10 pedidos chegaram em até isso ('+rN+' pedidos, pelo '+esc(rFonte)+')</td><td>'+rP80+' min</td></tr>':'')+
   '</table>'+
   (presets.length?'<div class="m"><b>As faixas salvas no iFood</b> — a loja só troca entre elas, não digita minuto: '+presets.map(p=>(p.nome===pAtual?'<b>▶ ':'')+esc(p.nome)+' '+p.de+'–'+p.ate+(p.nome===pAtual?' (agora)</b>':'')).join(' · ')+'.</div>':'')+
   '<div class="m"><b>A conta trabalha com os motoboys que estão escalados hoje.</b> Não existe chamar gente de fora no meio do turno, então esta tela não pede isso: quando a prateleira não anda, o botão que existe de verdade é a faixa do iFood. Cada linha da tabela acima sai do banco na hora — não há número digitado à mão aqui.<br><br>'+
   'Onde mudar: no Gestor de Pedidos do iFood, em <b>Ajustes → Gestão de lojas → Gerenciar pré-configurações</b> — escolha a faixa e salve. Faixa nova se cria no Portal do Parceiro.</div></div>';

  h+='<div class="m">Atualizado às '+esc(d.agora)+'. A tela se atualiza sozinha de 3 em 3 minutos. <b>Quando fica vermelha, ela pisca e apita</b> a cada 10 segundos até a situação resolver (o botão no canto pausa o vermelho e o apito por 15 minutos). Na primeira vez, toque uma vez na tela para liberar o som. O iFood dá <b>10 minutos de tolerância</b> em cima do que você promete — por isso os 44 min viram 54 na conta do cliente, e é essa a régua usada aqui. O "prometido" é lido direto na configuração do iFood pelo robô, uma vez por hora — uma mudança feita agora pode levar até 1 hora para aparecer aqui. As três lojas aparecem aqui — escolha no alto da tela. O dado de pedido e de motoboy vem do Foody e do TrackEat, conforme o que estiver respondendo em cada loja.</div>';

  h = cdmCab(d) + h + cdmRetrato(d);
  $('app').innerHTML=h;
  try{var _q=$('sugQuem'), _t=$('sugTxt');
      if(_q){_q.value=sugRascunhoQuem; _q.oninput=function(){sugRascunhoQuem=this.value}}
      if(_t){_t.value=sugRascunhoTxt;  _t.oninput=function(){sugRascunhoTxt=this.value}}}catch(e){}
  alarme(cls==='vermelho');
}

let sugRascunhoQuem='', sugRascunhoTxt='';
async function sugEnviar(){
  var q=$('sugQuem'), t=$('sugTxt'), av=$('sugAviso');
  if(!t||!av) return;
  var txt=(t.value||'').trim();
  if(txt.length<5){av.className='av ruim';av.textContent='Escreva pelo menos uma frase.';return}
  av.className='av'; av.textContent='Mandando…';
  var r=await rpc('delivery_sugestao_gravar',{p_token:cdmTok(),p_unidade:UNI,p_quem:(q?q.value:''),p_texto:txt});
  if(r&&r.ok){av.className='av';av.textContent='Recado enviado. Obrigado!';sugRascunhoTxt='';t.value='';boot()}
  else{av.className='av ruim';av.textContent=(r&&r.erro)?r.erro:'Não consegui enviar agora. Tente de novo.'}
}
async function sugAcao(id,st){
  var av=$('sugAviso'); if(av){av.className='av';av.textContent='Salvando…'}
  var r=await rpc('delivery_sugestao_acao',{p_token:cdmTok(),p_id:id,p_status:st});
  if(r&&r.ok){boot()} else if(av){av.className='av ruim';av.textContent=(r&&r.erro)?r.erro:'Não consegui salvar.'}
}
let AC=null,somOk=false,silAte=0,apitador=null;
function ligaSom(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();somOk=true;var av=document.getElementById('somaviso');if(av)av.style.display='none';}catch(e){}}
/* som RELIGADO a pedido do Fabio em 03/09/2026: "quero que apite a partir de agora". Ficou mudo de 31/08 ate 03/09 por pedido dele. O apito so toca com a tela VERMELHA, depois do primeiro toque na tela (regra dos navegadores), a cada 10s, e para sozinho quando sai o vermelho, quando a aba esconde ou quando aperta Silenciar 15 min. */
function apita(){if(!somOk||!AC)return;if(Date.now()<silAte)return;try{var t=AC.currentTime;var o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=880;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.05);g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.6);var o2=AC.createOscillator(),g2=AC.createGain();o2.type='square';o2.frequency.value=660;g2.gain.setValueAtTime(0.0001,t+0.6);g2.gain.exponentialRampToValueAtTime(0.5,t+0.65);g2.gain.exponentialRampToValueAtTime(0.0001,t+1.15);o2.connect(g2);g2.connect(AC.destination);o2.start(t+0.6);o2.stop(t+1.2);}catch(e){}}
function alarme(liga){if(Date.now()<silAte)liga=false;document.body.classList.toggle('alarme',liga);var b=document.getElementById('sil');if(b)b.style.display=liga?'block':'none';var av=document.getElementById('somaviso');if(av)av.style.display=(liga&&!somOk)?'block':'none';if(liga&&somOk){if(!apitador){apita();apitador=setInterval(apita,10000)}}else if(apitador){clearInterval(apitador);apitador=null}}
try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}
function cdmPrimeiroToque(){ligaSom();if(somOk){['click','touchstart','keydown'].forEach(function(ev){document.removeEventListener(ev,cdmPrimeiroToque)});if(document.body.classList.contains('alarme')&&!apitador){apita();apitador=setInterval(apita,10000)}}}
['click','touchstart','keydown'].forEach(function(ev){document.addEventListener(ev,cdmPrimeiroToque,{passive:true})});
/* seletor de loja (05/09/2026) */
let UNI='Água Verde';
try{var _u=localStorage.getItem('cdm_tempo_uni'); if(_u==='Água Verde'||_u==='São Braz'||_u==='Ahú') UNI=_u;}catch(e){}
function pintaLojas(){
  var bs=document.querySelectorAll('#lojas .lj');
  for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('on', bs[i].getAttribute('data-u')===UNI); }
  var s=$('sub'); if(s) s.textContent=UNI+' — quanto prometer ao cliente agora';
}
function trocaLoja(u){
  UNI=u; try{localStorage.setItem('cdm_tempo_uni',u)}catch(e){}
  pintaLojas();
  $('app').innerHTML='<div class="load">Carregando '+esc(u)+'…</div>';
  boot();
}
async function boot(){
  const t=cdmTok();
  pintaLojas();
  const d=await rpc('delivery_tempo',{p_token:t,p_unidade:UNI});
  if(!d){$('app').innerHTML='<div class="load">Não consegui ler agora. Clique em Atualizar.</div>';return}
  pinta(d);
}

/* ===== porta unica do portal ===== */
const CDMMODS=['tempo'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'tempo'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok){boot();var cdmT=setInterval(boot,180000);document.addEventListener('visibilitychange',function(){if(document.hidden){clearInterval(cdmT);cdmT=null;if(apitador){clearInterval(apitador);apitador=null}}else if(!cdmT){boot();cdmT=setInterval(boot,180000)}})}});
</script>
