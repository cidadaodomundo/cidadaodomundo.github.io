<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111110">
<title>Portal · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:14.5px}
.app{display:flex;min-height:100vh}
.side{width:250px;background:var(--s1);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--line)}
.brand img{width:40px;height:40px;border-radius:9px;object-fit:cover;background:#000}
.brand b{font-size:15px;font-weight:800;line-height:1.1}
.brand .s{color:var(--muted);font-size:11px}
.grp{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;margin:16px 6px 6px}
.mi{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--text2)}
.mi:hover{background:var(--s2)}
.mi.on{background:var(--brand);color:var(--brand-ink)}
.mi .ic{font-size:18px;line-height:1}
.mi .t{font-weight:700;font-size:13.5px}
.mi .d{font-size:11px;color:var(--muted);margin-top:1px}
.mi.on .d{color:rgba(255,255,255,.8)}
.foot{margin-top:auto;color:var(--muted);font-size:10.5px;padding:12px 6px 0;line-height:1.5}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.top .ham{display:none;font-size:20px;cursor:pointer;background:none;border:none;color:#fff}
.top .ti{font-weight:800;font-size:15px}
.top .rt{margin-left:auto;display:flex;gap:8px}
.btn{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none}
.home{padding:26px;text-align:center}
.home img{width:120px;height:120px;border-radius:26px;object-fit:cover;background:#000;margin:10px auto}
.home h1{font-size:22px;font-weight:800}
.home .s{color:var(--text2);font-size:13px;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;max-width:820px;margin:22px auto 0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;cursor:pointer}
.card:hover{border-color:var(--brand)}
.card .ic{font-size:26px}
.card .t{font-weight:800;font-size:15px;margin-top:8px}
.card .d{color:var(--text2);font-size:12.5px;margin-top:4px;line-height:1.4}
.gh{grid-column:1/-1;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;margin:8px 2px -4px}
iframe{flex:1;width:100%;border:0;background:var(--s0)}
#gate{position:fixed;inset:0;background:var(--s0);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.gatebox{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:34px 28px;width:340px;text-align:center}
.gatebox img{width:54px;height:54px;border-radius:13px;object-fit:cover;background:#000;margin:0 auto 12px;display:block}
.gatebox h1{font-size:18px;font-weight:800}
.gatebox .s{color:var(--text2);font-size:12px;margin-top:2px}
.gatebox input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;margin:16px 0 10px;text-align:center}
.gatebox button{width:100%;background:var(--brand);color:var(--brand-ink);border:none;color:#fff;border-radius:10px;padding:12px;font-size:14px;font-weight:800;cursor:pointer}
.gatebox .alt{display:block;margin-top:14px;color:var(--text2);font-size:12.5px;cursor:pointer;text-decoration:underline}
.gerr{color:#f08d8d;font-size:12px;min-height:16px;margin-top:8px}
@media(max-width:760px){.side{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.top .ham{display:block}}

/* cara da casa 04-09-2026 */
.gatebox button{color:var(--brand-ink)}
h1,.gatebox h1{font-weight:400}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06}

/* cabe no celular 04-09-2026 — filas de aba nunca vazam ate 900px; o resto so em tela estreita */
/* 12/10/2026 (chat-avaliacoes-do-dia-inicio-12-10): quadro Avaliacoes do dia na tela Inicio — uma linha por loja,
   com foto, iFood, Google e Accon. Mesmas pecas do kit de cartoes (assets/cdm-ui.css), com prefixo .avd para nao
   esbarrar nos .card/.cards do menu. */
.avd{max-width:1180px;margin:24px auto 0;text-align:left}
.avd-top{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.avd-top h2{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;font-size:22px;letter-spacing:.02em}
.avd-top .sub{color:var(--muted);font-size:12.5px;font-weight:600}
.avd-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.avd-chip{display:inline-flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.avd-chip:hover{border-color:#5a5952}
.avd-chip.on{background:#fff;color:#111;border-color:#fff}
.avd-chip .ct{background:#2c2c29;color:var(--text2);border-radius:999px;padding:1px 7px;font-size:11.5px;font-weight:800}
.avd-chip.on .ct{background:#111;color:#fff}
.avd-sep{width:1px;background:var(--line);margin:0 3px}
.avd-aviso{background:#4a3a12;color:#ffd98a;border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.avd-loja{display:grid;grid-template-columns:190px repeat(3,minmax(0,1fr));gap:11px;background:#151514;border:1px solid var(--line);border-radius:20px;padding:11px;margin-bottom:12px}
.avd-foto{position:relative;border-radius:15px;overflow:hidden;background:#000;min-height:170px}
.avd-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avd-foto img.logo{object-fit:contain;padding:28px;opacity:.55}
.avd-foto .nm{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:21px;line-height:1.05;letter-spacing:.02em}
.avd-foto .nm small{display:block;font-family:'Barlow',sans-serif;text-transform:none;font-size:11.5px;color:var(--text2);font-weight:600;letter-spacing:0;margin-top:3px}
.avd-c{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-wrap:anywhere}
.avd-c.sem{border:1.5px dashed #4a4943;background:transparent}
.avd-ch{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.avd-ch .fonte{color:var(--muted);font-size:11.5px;font-weight:600;margin-left:auto;text-align:right}
.avd-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.avd-big b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1}
.avd-big .st{color:var(--brand);font-size:15px;font-weight:800}
.avd-big .lb{color:var(--text2);font-size:13px;font-weight:600}
.avd-notas{display:flex;gap:5px;flex-wrap:wrap}
.avd-n{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:9px;padding:3px 8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.avd-n.r{color:#ff9a9a}.avd-n.m{color:var(--warn,#e5be6d)}.avd-n.b{color:#7fe0aa}
.avd-n.on{background:#fff;color:#111;border-color:#fff}
.avd-n.zero{opacity:.4;cursor:default}
.avd-tg{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:9px;padding:3px 8px;background:rgba(229,190,109,.12);color:#e5be6d;align-self:flex-start}
.avd-tg.ok{background:rgba(37,163,95,.15);color:#7fe0aa}
.avd-it{border-top:1px solid var(--line);padding-top:8px;font-size:13.5px;line-height:1.4;color:var(--text2)}
.avd-it .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.avd-it .h .es{font-size:13px;letter-spacing:-1px}
.avd-it .h .es.r{color:#ff7a7a}.avd-it .h .es.m{color:#e5be6d}.avd-it .h .es.b{color:var(--brand)}
.avd-it .tx{color:var(--text);overflow-wrap:anywhere}
.avd-it .tx.vazio{color:var(--muted);font-style:italic}
.avd-it .tgs{color:var(--muted);font-size:11.5px;margin-top:2px}
.avd-it img{max-width:100%;max-height:160px;border-radius:10px;margin-top:6px;display:block}
.avd-bt{background:var(--s2);border:1px solid #56554e;color:var(--text);border-radius:11px;padding:6px 10px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;align-self:flex-start}
.avd-bt:hover{border-color:#fff}
.avd-fb{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:2px 7px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit}
.avd-vz{color:var(--muted);font-size:13px;line-height:1.45}
.avd-rod{color:var(--muted);font-size:11.5px;border-top:1px solid var(--line);padding-top:7px;margin-top:auto;line-height:1.45}
@media(max-width:1000px){.avd-loja{grid-template-columns:150px repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.avd-loja{grid-template-columns:1fr}.avd-foto{min-height:120px}}

@media (max-width:900px){.views,.tabs,.abas,.fil,.pes,.filtros,.chips,.lojas,.periodos{display:flex;flex-wrap:wrap;gap:6px;width:auto;max-width:100%;min-width:0}.views>*,.tabs>*,.abas>*,.fil>*,.pes>*{flex:0 0 auto;max-width:100%}}@media (max-width:640px){body{padding-left:12px;padding-right:12px}table{display:block;width:max-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}h1{font-size:clamp(18px,6.2vw,26px);word-break:break-word}img,svg,canvas,iframe{max-width:100%}}
</style>
</head>
<body>
<div id="gate"><div class="gatebox">
  <img src="//acconimages.s3.amazonaws.com/merchants/logos/378-1755286245137.png" alt="CM">
  <h1>Portal Cidadão do Mundo</h1>
  <div class="s" id="gsub">Entre com o seu usuário</div>
  <div id="gform">
    <input type="text" id="guser" placeholder="Usuário" autocomplete="username" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter')document.getElementById('gpw').focus()">
    <input type="password" id="gpw" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    <button onclick="entrar()">Entrar</button>
  </div>
  <div id="tform" style="display:none">
    <input type="password" id="t1" placeholder="Senha atual" autocomplete="current-password">
    <input type="password" id="t2" placeholder="Nova senha (mínimo 8 letras)" autocomplete="new-password">
    <input type="password" id="t3" placeholder="Repita a nova senha" autocomplete="new-password" onkeydown="if(event.key==='Enter')trocar()">
    <button onclick="trocar()">Salvar e entrar</button>
  </div>
  <div class="gerr" id="gerr"></div>
  <div style="color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.5">Cada pessoa tem o seu usuário.<br>Esqueceu a senha? Fale com o Fábio.</div>
</div></div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img src="//acconimages.s3.amazonaws.com/merchants/logos/378-1755286245137.png" alt="CM"><div><b>Cidadão do Mundo</b><div class="s" id="roleLbl">Portal de Gestão</div></div></div>
    <div id="menu"></div>
    <div class="foot">Cidadão do Mundo Burgers & Arts<br>Água Verde · Ahú · São Braz<br><small style="color:var(--muted)">✓ Portal revisado pelo Codex · 15/09</small><br><span class="alt" style="color:var(--muted);cursor:pointer;text-decoration:underline" onclick="sair()">sair</span></div>
  </aside>
  <div class="main">
    <div class="top">
      <button class="ham" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div class="ti" id="titulo">Início</div>
      <div id="quem" style="margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)"></div>
      <div class="rt" id="rt" style="margin-left:10px"></div>
    </div>
    <div id="view" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  </div>
</div>

<script>
const LOGO="//acconimages.s3.amazonaws.com/merchants/logos/378-1755286245137.png";
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const DESC={agora:'Resolver, tempo de entrega, chegada e fila — o que fazer agora',pausados:'iFood e Accon — o que está fora do ar no delivery',cancelados:'Cancelados e parte devolvida no iFood: motivos, turno, prejuízo e o que explicar',sbpausados:'Tablet do salão e iFood — só São Braz',ahupausados:'iFood — só Ahú',manutencaoahu:'Chamados de conserto — só Ahú',ahucancel:'Cancelados e parte devolvida no iFood — só Ahú',qualidade:'Como fomos: prazo, cancelamentos, avaliações e painel do dia',delivery:'Diário, equipe e iFood do delivery',escala:'Previsão de chuva e escala dos motoboys',rh:'Ponto do dia das gestoras',salao:'Avaliações e gestão do salão',rhsb:'Ponto do dia — só São Braz',ifoodsb:'Notas, cancelamentos e chamados — só São Braz',ponto:'Consulta por tipo, guia e visão geral do ponto',ifood:'Notas, cancelamentos, chamados e Selo Super',reuniao:'Resumo semanal: avaliações, cancelamentos e RH',escritorio:'Financeiro, contas a pagar e usuários',operacao:'Perdas e sobras jogadas fora'};
const GRUPOS=['Delivery','Gestão','Resolver','Escritório','São Braz','Ahú','Proprietário'];
const $=id=>document.getElementById(id);
let MODULOS=[];
let NOME='';
let ATUAL=null;
function arrOk(r){return Array.isArray(r)?r:[]}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function tok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
async function rpc(fn,body){
  const r=await fetch(SB+'rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(body)});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const er=new Error((j&&j.message)||'falha');er.code=(j&&j.code)||'';throw er}
  return j;
}
function aplicar(j){
  NOME=(j&&j.nome)||'';
  MODULOS=arrOk(j&&j.modulos).filter(m=>m&&m.id).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  try{sessionStorage.setItem('cdm_nome',NOME);
      sessionStorage.setItem('cdm_admin',(j&&j.admin)?'1':'0');
      sessionStorage.setItem('cdm_modulos',JSON.stringify(MODULOS));}catch(e){}
}
async function entrar(){
  const u=($('guser').value||'').trim(), s=$('gpw').value||'';
  if(!u||!s){$('gerr').textContent='Preencha usuário e senha.';return}
  $('gerr').textContent='Entrando…';
  try{
    const j=await rpc('portal_login',{p_usuario:u,p_senha:s});
    $('gpw').value='';
    try{sessionStorage.setItem('cdm_token',(j&&j.token)||'')}catch(e){}
    aplicar(j);
    $('gerr').textContent='';
    if(j&&j.precisa_trocar){pedeTroca()}else{$('gate').style.display='none';boot()}
  }catch(e){
    $('gpw').value='';
    $('gerr').textContent=(e.code==='28000')?'Usuário ou senha inválidos':(e.message||'Não foi possível entrar. Tente de novo.');
  }
}
function pedeTroca(){
  $('gsub').textContent='Troque a senha para continuar';
  $('gform').style.display='none';$('tform').style.display='';
  $('gerr').textContent='';
  setTimeout(function(){try{$('t1').focus()}catch(e){}},60);
}
async function trocar(){
  const a=$('t1').value||'', b=$('t2').value||'', c=$('t3').value||'';
  if(b.length<8){$('gerr').textContent='A nova senha precisa de pelo menos 8 letras.';return}
  if(b!==c){$('gerr').textContent='A confirmação não bateu.';return}
  if(b===a){$('gerr').textContent='A nova senha precisa ser diferente da atual.';return}
  $('gerr').textContent='Salvando…';
  try{
    await rpc('portal_trocar_senha',{p_token:tok(),p_atual:a,p_nova:b});
    $('t1').value='';$('t2').value='';$('t3').value='';
    const eu=await rpc('portal_eu',{p_token:tok(),p_tela:'inicio'});
    aplicar(eu);
    $('gerr').textContent='';
    $('gate').style.display='none';boot();
  }catch(e){
    $('gerr').textContent=(e.code==='28000')?'Senha atual incorreta.':(e.message||'Não foi possível trocar a senha.');
  }
}
async function sair(){
  const t=tok();
  try{if(t)await rpc('portal_sair',{p_token:t})}catch(e){}
  ['cdm_token','cdm_nome','cdm_admin','cdm_modulos','cdm_rh_pw','cdm_esc_pw','cdm_moto_pw','cdm_reuniao_pw','cdm_aviso'].forEach(function(k){try{sessionStorage.removeItem(k)}catch(e){}});
  location.replace('/index.html');
}
function mods(){return MODULOS}
function menu(){
  let h='<div class="mi'+(ATUAL===null?' on':'')+'" onclick="inicio()"><div class="ic">🏠</div><div><div class="t">Início</div></div></div>';
  GRUPOS.forEach(g=>{const l=mods().filter(m=>m.grupo===g);if(l.length)h+='<div class="grp">'+g+'</div>'+l.map(mi).join('')});
  $('menu').innerHTML=h;
  $('roleLbl').textContent=NOME||'Portal de Gestão';
  $('quem').innerHTML=(NOME?'<span>'+esc(NOME)+'</span>':'')+'<button class="btn" onclick="sair()">Sair</button>';
}
function mi(m){return '<div class="mi'+(ATUAL===m.id?' on':'')+'" onclick="abrir(\''+m.id+'\')"><div class="ic">'+(m.icone||'')+'</div><div><div class="t">'+esc(m.nome)+'</div><div class="d">'+esc(DESC[m.id]||'')+'</div></div></div>'}
function inicio(){ATUAL=null;location.hash='';$('titulo').textContent='Início';$('rt').innerHTML='';
  let h='<div class="home"><img src="'+LOGO+'"><h1>Portal de Gestão</h1><div class="s">'+esc(NOME)+' — escolha um módulo</div><div id="fresco" style="text-align:center;margin-top:10px"></div><div class="avd" id="avd"></div><div class="cards">';
  const gs=GRUPOS.slice();
  /* 30/09/2026: modulo com grupo comecando por "_" continua ligado (a trava de acesso das telas precisa dele),
     mas nao ganha cartao: ele aparece dentro de outra tela (ex.: as abas da tela Agora). */
  mods().forEach(m=>{if(gs.indexOf(m.grupo)<0&&String(m.grupo||'').charAt(0)!=='_')gs.push(m.grupo)});
  gs.forEach(g=>{const list=mods().filter(m=>m.grupo===g);if(!list.length)return;
    h+='<div class="gh">'+esc(g)+'</div>'+list.map(m=>'<div class="card" onclick="abrir(\''+m.id+'\')"><div class="ic">'+(m.icone||'')+'</div><div class="t">'+esc(m.nome)+'</div><div class="d">'+esc(DESC[m.id]||'')+'</div></div>').join('')});
  if(!mods().length)h+='<div class="gh">Sem módulos liberados</div><div class="card"><div class="t">Nada por aqui ainda</div><div class="d">Peça ao Fábio para liberar os módulos do seu usuário.</div></div>';
  h+='</div></div>';$('view').innerHTML=h;menu();carimboFontes();avdCarregar();
}

/* ===== 12/10/2026 (chat-avaliacoes-do-dia-inicio-12-10) — AVALIACOES DO DIA, uma linha por loja =====
   Porta: inicio_avaliacoes(p_token, p_dados{quando:'hoje'|'ontem'}). Todo mundo que entra ve (decisao do Fabio, 12/10).
   iFood: conta as avaliacoes que CHEGARAM no dia (o iFood libera cerca de 1 dia depois do pedido) — zero de hoje
   aparece como "—" e nao como 0 (regra 8.3). Google: nota e total da leitura diaria; "novas" = diferenca para a
   leitura anterior. Accon: ainda nao tem leitura — o cartao diz isso. A foto da loja vem de loja_foto; sem ela, o logo. */
let AVD=null, AVD_LOJA='', AVD_QUANDO='hoje', AVD_NOTA={}, AVD_ABRE={}, AVD_T=null;
const AVD_LOJAS=['Água Verde','Ahú','São Braz'];
function avdUrlOk(u){return typeof u==='string'&&/^https:\/\/[^\s"'()<>]+$/.test(u)}
function avdNum(v,c){if(v==null||v==='')return '—';const n=Number(v);return isFinite(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:c||0,maximumFractionDigits:c||0}):'—'}
function avdEst(n){n=Math.max(0,Math.min(5,Number(n)||0));const k=n<=2?'r':n===3?'m':'b';return '<span class="es '+k+'">'+'★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(5-n)+'</span></span>'}
async function avdCarregar(){
  const el=$('avd');if(!el)return;
  if(AVD_T){clearInterval(AVD_T);AVD_T=null}
  AVD_T=setInterval(function(){if(ATUAL===null&&!document.hidden&&$('avd'))avdBuscar(true)},5*60*1000);
  if(AVD&&AVD.quando===AVD_QUANDO)avdDesenha();else el.innerHTML='<div class="avd-top"><h2>⭐ Avaliações do dia</h2><span class="sub">buscando…</span></div>';
  avdBuscar(false);
}
async function avdBuscar(quieto){
  const el=$('avd');if(!el)return;
  try{
    const j=await rpc('inicio_avaliacoes',{p_token:tok(),p_dados:{quando:AVD_QUANDO}});
    if(!$('avd'))return;
    /* 12/10 supervisor: resposta velha (ex.: clicou Ontem e logo Hoje) nao sobrescreve a nova */
    if(!j||j.quando!==AVD_QUANDO)return;
    AVD=j;avdDesenha();
  }catch(e){
    if(!$('avd'))return;
    if(e.code==='28000'){
      /* sessao vencida: para o relogio e volta para a entrada, como faz a abertura do portal */
      if(AVD_T){clearInterval(AVD_T);AVD_T=null}
      ['cdm_token','cdm_nome','cdm_admin','cdm_modulos'].forEach(function(k){try{sessionStorage.removeItem(k)}catch(x){}});
      try{sessionStorage.setItem('cdm_aviso','Sua sessão expirou. Entre de novo.')}catch(x){}
      location.replace('/index.html');return}
    if(quieto&&AVD)return;
    el.innerHTML='<div class="avd-top"><h2>⭐ Avaliações do dia</h2></div><div class="avd-aviso">Não deu para buscar as avaliações agora. <button class="avd-bt" onclick="avdBuscar(false)">Tentar de novo</button></div>';
  }
}
function avdLoja(u){AVD_LOJA=u;avdDesenha()}
function avdQuando(q){if(q===AVD_QUANDO)return;AVD_QUANDO=q;AVD_NOTA={};AVD_ABRE={};const el=$('avd');if(el){const s=el.querySelector('.avd-top .sub');if(s)s.textContent='buscando…'}avdBuscar(false)}
function avdFiltraNota(i,n){AVD_NOTA[i]=(AVD_NOTA[i]===n?0:n);AVD_ABRE[i]=true;avdDesenha()}
function avdAbre(i){AVD_ABRE[i]=!AVD_ABRE[i];avdDesenha()}
function avdDesenha(){
  const el=$('avd');if(!el||!AVD)return;
  const J=AVD, L=arrOk(J.lojas), hoje=J.quando==='hoje';
  let h='<div class="avd-top"><h2>⭐ Avaliações do dia</h2><span class="sub">'+(hoje?'Hoje':'Ontem')+', '+esc(J.dia||'')+' · iFood lido '+esc(J.ifood_lido_em||'—')+' · atualiza sozinho a cada 5 min</span></div>';
  h+='<div class="avd-chips"><button class="avd-chip'+(AVD_LOJA===''?' on':'')+'" onclick="avdLoja(\'\')">🏪 Todas as lojas</button>';
  L.forEach(function(l){const n=(l.ifood&&l.ifood.n)||0;h+='<button class="avd-chip'+(AVD_LOJA===l.unidade?' on':'')+'" onclick="avdLoja(\''+esc(l.unidade).replace(/'/g,"\\'")+'\')">'+esc(l.unidade)+(n?' <span class="ct">'+n+'</span>':'')+'</button>'});
  h+='<span class="avd-sep"></span><button class="avd-chip'+(hoje?' on':'')+'" onclick="avdQuando(\'hoje\')">Hoje</button><button class="avd-chip'+(!hoje?' on':'')+'" onclick="avdQuando(\'ontem\')">Ontem</button></div>';
  if(J.ifood_lido_min!=null&&Number(J.ifood_lido_min)>180)h+='<div class="avd-aviso">⚠ A leitura das avaliações do iFood está parada desde '+esc(J.ifood_lido_em||'—')+'. O que aparece aqui pode estar faltando.</div>';
  L.forEach(function(l,i){if(AVD_LOJA&&l.unidade!==AVD_LOJA)return;h+=avdLinha(l,i,hoje,!!AVD_LOJA)});
  if(!L.length)h+='<div class="avd-vz">Nenhuma loja para mostrar.</div>';
  el.innerHTML=h;
}
function avdLinha(l,i,hoje,sozinha){
  const f=l.ifood||{}, g=l.google, foto=avdUrlOk(l.foto)?l.foto:'';
  let h='<div class="avd-loja"><div class="avd-foto">'+(foto?'<img src="'+esc(foto)+'" alt="" loading="lazy">':'<img class="logo" src="'+LOGO+'" alt="">')+'<div class="nm">'+esc(l.unidade)+'<small>'+(foto?'':'foto da fachada ainda não carregada')+'</small></div></div>';
  /* iFood */
  const n=f.n||0, it=arrOk(f.itens), nt=arrOk(f.notas), fil=AVD_NOTA[i]||0;
  h+='<div class="avd-c"><div class="avd-ch">🛵 iFood<span class="fonte">'+(hoje?'chegaram hoje':'chegaram ontem')+'</span></div>';
  if(!n){
    h+='<div class="avd-big"><b>—</b><span class="lb">'+(hoje?'nenhuma chegou ainda hoje':'nenhuma chegou nesse dia')+'</span></div>';
    h+='<div class="avd-vz">'+(hoje?'O iFood libera a avaliação cerca de 1 dia depois do pedido. Ontem chegaram <b>'+avdNum(f.ontem)+'</b>. <button class="avd-fb" onclick="avdQuando(\'ontem\')">ver ontem</button>':'')+'</div>';
  }else{
    h+='<div class="avd-big"><b>'+avdNum(n)+'</b><span class="lb">avaliaç'+(n===1?'ão':'ões')+'</span><span class="st">★ '+avdNum(f.media,2)+'</span></div>';
    h+='<div class="avd-notas">'+[1,2,3,4,5].map(function(k){const q=nt[k-1]||0,c=k<=2?'r':k===3?'m':'b';return '<button class="avd-n '+c+(fil===k?' on':'')+(q?'':' zero')+'"'+(q?' onclick="avdFiltraNota('+i+','+k+')"':'')+' title="'+q+' com nota '+k+'">'+k+'★ '+q+'</button>'}).join('')+'</div>';
    if(f.sem_resposta)h+='<span class="avd-tg">💬 '+f.sem_resposta+' com comentário sem resposta</span>';
    let lista=fil?it.filter(function(x){return x.nota===fil}):it;
    const aberto=sozinha||AVD_ABRE[i]||fil;
    const mostra=aberto?lista:lista.slice(0,3);
    mostra.forEach(function(x){
      h+='<div class="avd-it"><div class="h">'+avdEst(x.nota)+'<span>'+esc(x.marca||'')+' · pedido '+esc(x.pedido_em||'')+'</span>'+(x.sem_resposta?'<span style="color:#e5be6d">· sem resposta</span>':'')+(/^[0-9a-f-]{36}$/i.test(x.uuid||'')?' <button class="avd-fb" onclick="avdFotos(\''+esc(x.uuid)+'\')">📷 fotos</button>':'')+'</div>'+
        (x.texto?'<div class="tx">'+esc(x.texto)+'</div>':'<div class="tx vazio">sem comentário</div>')+
        (arrOk(x.tags).length?'<div class="tgs">'+arrOk(x.tags).map(esc).join(' · ')+'</div>':'')+'</div>';
    });
    if(!sozinha&&lista.length>3)h+='<button class="avd-bt" onclick="avdAbre('+i+')">'+(aberto?'mostrar menos':'ver todas ('+lista.length+')')+'</button>';
    if(n>it.length)h+='<div class="avd-vz">Mostrando as '+it.length+' piores de '+n+'.</div>';
  }
  h+='<div class="avd-rod">Pedidos do iFood avaliados pelo cliente · todas as marcas da loja</div></div>';
  /* Google */
  h+='<div class="avd-c"><div class="avd-ch">🔎 Google<span class="fonte">'+(g?'leitura de '+esc(g.lido||'—'):'')+'</span></div>';
  if(!g){h+='<div class="avd-vz">Sem leitura do Google para esta loja.</div>'}
  else{
    h+='<div class="avd-big"><b>'+avdNum(g.nota,1)+'</b><span class="st">★</span><span class="lb">'+avdNum(g.total)+' avaliações no total</span></div>';
    if(g.lido_hoje&&g.novas!=null)h+='<span class="avd-tg'+(g.novas>0?' ok':'')+'">'+(g.novas>0?'+'+avdNum(g.novas)+' nova'+(g.novas===1?'':'s')+' desde a leitura anterior':g.novas<0?'o total caiu '+avdNum(-g.novas)+' desde a leitura anterior (o Google tirou avaliações)':'nenhuma nova desde a leitura anterior')+'</span>';
    else h+='<span class="avd-tg">a leitura deste dia ainda não chegou</span>';
    arrOk(g.destaques).slice(0,sozinha?6:2).forEach(function(d){
      h+='<div class="avd-it"><div class="h">'+esc(d.autor||'')+(d.quando?' · '+esc(d.quando):'')+'</div><div class="tx">'+esc(d.texto||'')+'</div>'+(avdUrlOk(d.foto)?'<img src="'+esc(d.foto)+'" alt="" loading="lazy">':'')+'</div>';
    });
  }
  h+='<div class="avd-rod">'+(g&&g.perfil?'Perfil: '+esc(g.perfil)+' · ':'')+'o Google mostra só a nota geral e alguns comentários em destaque</div></div>';
  /* Accon */
  h+='<div class="avd-c sem"><div class="avd-ch">🌐 Accon<span class="fonte">site próprio</span></div><div class="avd-big"><b>—</b><span class="lb">ainda sem leitura</span></div><div class="avd-vz">As avaliações do Accon ainda não chegam ao portal. O robô que vai ler o Accon está na fila — quando ficar pronto, elas aparecem aqui sozinhas.</div></div>';
  return h+'</div>';
}
async function avdFotos(uuid){
  let cx=document.getElementById('__fotos');
  if(!cx){cx=document.createElement('div');cx.id='__fotos';document.body.appendChild(cx)}
  cx.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;overflow:auto;padding:16px;text-align:center';
  cx.innerHTML='<div style="color:#fff;margin-bottom:10px">Buscando as fotos do pedido…</div>';
  cx.onclick=function(){cx.remove()};
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/functions/v1/guardar-foto-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'ver',token_portal:tok(),uuid_pedido:uuid})});
    const j=await r.json();
    if(!j.ok||!j.fotos||!j.fotos.length){cx.innerHTML='<div style="color:#fff">Não achei foto guardada deste pedido.<div style="color:#bbb;font-size:12px;margin-top:6px">Toque para fechar.</div></div>';return}
    cx.innerHTML='<div style="color:#fff;margin-bottom:10px">📷 O que o cliente mandou — toque em qualquer lugar para fechar</div>'+j.fotos.map(function(f){return avdUrlOk(f.link)?'<img src="'+esc(f.link)+'" style="max-width:96%;max-height:80vh;margin:8px auto;display:block;border-radius:8px">':''}).join('');
  }catch(e){cx.innerHTML='<div style="color:#fff">Não deu para buscar as fotos. Toque para fechar.</div>'}
}
async function carimboFontes(){try{
  const r=await fetch(SB+'fato_frescor?select=fonte,ultimo_dia,farol&farol=neq.OK&order=fonte&limit=20',{headers:H});
  if(!r.ok)return;
  /* 12/10/2026, pedido do Fabio: fonte desligada DE PROPOSITO nao vira aviso vermelho aqui.
     TrackEat (delivery_entrega) desligado em 25/09 ate sair a API deles (a leitura pesava o site);
     iFood negociacoes (relatorio antigo) desligado em 11/09. A linha continua no banco porque
     Fila/Resolver/Chegada leem o PARADO para nao mostrar zero falso. */
  const DESLIGADA={delivery_entrega:1,ifood_negociacao:1};
  const rows=(await r.json()).filter(function(x){return !DESLIGADA[x.fonte]});
  const el=document.getElementById('fresco');
  if(!el)return;
  const nm={rede_venda:'Maquininha (vendas)',rede_pagamento:'Maquininha (pagamentos)',ifood_avaliacao:'iFood avaliações',ifood_cancelamento:'iFood cancelamentos',ifood_negociacao:'iFood chamados',saipos_av:'Saipos Água Verde',saipos_ahu:'Saipos Ahú',saipos_sb:'Saipos São Braz',saipos_venda:'Saipos (agregado)',saipos_item:'Saipos itens',delivery_pedido:'Delivery pedidos',delivery_fechamento:'Delivery fechamento',delivery_fechamento_motoboy:'Fechamento dos motoboys',escala_av:'Escala Água Verde',escala_ahu:'Escala Ahú',escala_sb:'Escala São Braz',ponto:'Ponto',google:'Google',clima:'Clima'};
  if(!rows.length){el.innerHTML='<div style="display:inline-block;margin:2px;padding:6px 14px;border-radius:999px;background:#16351f;color:#7ce28f;font-size:13px">✓ todas as fontes de dados em dia</div>';return}
  el.innerHTML=rows.map(function(x){
    const d=String(x.ultimo_dia||'').split('-').reverse().slice(0,2).join('/');
    const parado=x.farol==='PARADO'||x.farol==='SEM_DADO';
    const cor=parado?'#4a1515':'#4a3a12';
    const tx=parado?'#ff9d9d':'#ffd98a';
    return '<div style="display:inline-block;margin:3px;padding:6px 12px;border-radius:999px;background:'+cor+';color:'+tx+';font-size:13px">'+(parado?'⛔':'⚠')+' '+esc(nm[x.fonte]||x.fonte)+' — dado até '+esc(d||'nunca')+'</div>';
  }).join('');
}catch(e){}}
function abrir(id){const m=MODULOS.find(x=>x.id===id);if(!m)return;
  ATUAL=id;location.hash=id;$('titulo').textContent=m.icone+' '+m.nome;
  URLBASE=m.url;
  $('rt').innerHTML='<button class="btn" onclick="voltar()">← Voltar</button><button class="btn" onclick="recarregar()">↻</button><a class="btn" href="'+m.url+'" target="_blank" rel="noopener">↗ abrir</a>';
  $('view').innerHTML='<iframe id="fr" src="'+m.url+'" allow="fullscreen; screen-wake-lock"></iframe>';
  document.getElementById('side').classList.remove('open');menu();
}
let URLBASE='';
function recarregar(){const f=$('fr');if(f)f.src=f.src}
function voltar(){const f=$('fr');if(!f||!URLBASE){inicio();return;}f.src=URLBASE;}
function boot(){menu();const h=location.hash.replace('#','');if(h&&MODULOS.find(x=>x.id===h)){abrir(h)}else{inicio()}}
(async function(){
  let av='';try{av=sessionStorage.getItem('cdm_aviso')||'';sessionStorage.removeItem('cdm_aviso')}catch(e){}
  if(av)$('gerr').textContent=av;
  const t=tok();
  if(!t){try{$('guser').focus()}catch(e){}return}
  try{
    const eu=await rpc('portal_eu',{p_token:t,p_tela:'inicio'});
    aplicar(eu);
    if(eu&&eu.precisa_trocar){pedeTroca();return}
    $('gate').style.display='none';boot();
  }catch(e){
    ['cdm_token','cdm_nome','cdm_admin','cdm_modulos'].forEach(function(k){try{sessionStorage.removeItem(k)}catch(x){}});
    if(!av)$('gerr').textContent='Sua sessão expirou. Entre de novo.';
    try{$('guser').focus()}catch(x){}
  }
})();
</script>
