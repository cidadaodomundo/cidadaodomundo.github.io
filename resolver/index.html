<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Resolver hoje · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/cdm-ui.css?v=4">
<style>
/* 03/10/2026 (chat-visual-resolver-03-10): pedido do Fabio — mesmo visual e mesma dinamica do Delivery · Sao Braz.
   Os quadros e os botoes sao os mesmos de antes; mudou so a aparencia e o jeito de abrir a lista (logo embaixo dos quadros). */
.per{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.per .chip{padding:7px 13px}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
button.b:hover{border-color:var(--text2)}
.c{display:block;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.c:hover{border-color:var(--line)}
.c .vazio{padding:16px 0;font-size:14px}
.m{color:var(--muted);font-size:12px;margin-top:3px}
.load{color:var(--muted);padding:40px 10px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cards>*{min-width:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 15px;color:var(--text);display:flex;flex-direction:column;gap:3px;transition:border-color .15s,transform .08s}
.card[onclick]{cursor:pointer}
.card[onclick]:hover{border-color:#5a5952}
.card[onclick]:active{transform:scale(.98)}
.card .t{font-size:13px;font-weight:800;color:var(--text2);line-height:1.3}
.card .v{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:42px;line-height:1.05;margin:0}
.card .qs{color:var(--muted);font-size:12px;font-weight:700;line-height:1.35}
.card.mal{border-left:4px solid var(--bad)}
.card.mal .v{color:#ff8a8a}
.card.aviso{border-left:4px solid var(--warn)}
.card.aviso .v{color:var(--warn)}
.card.bem .v{color:#7fe0aa}
.card.sd{border-style:dashed}
.card.sd .v{color:var(--muted)}
.card.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.lojas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.lojas .rot,.per .rot{color:var(--muted);font-size:12px;font-weight:800;margin-right:2px}
.lojas .chip{padding:7px 13px}
.painel{margin-top:14px}
.painel .ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.painel .ph h3{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:19px;letter-spacing:.02em}
.painel .ph .ct{color:var(--muted);font-size:13px;font-weight:600}
.painel .ph .fecha{margin-left:auto}
.nota{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.5}
.pz{width:100%;border-collapse:collapse;font-size:12.5px}.pz th{text-align:left;color:var(--muted);font-size:10.5px;font-weight:800;padding:4px 6px;border-bottom:1px solid var(--line)}.pz td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;padding:0 8px 8px 0}
td{padding:9px 8px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.mini{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:700}
.mini:hover{border-color:var(--text2)}
.feito{color:#7fe0aa;font-weight:700}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card .v{font-size:34px}.per{width:100%}}
/* 03/10/2026 (chat-resolver-itemcancelado-03-10): cartoes do Item cancelado, mesmo visual do AO VIVO da Central Cozinha */
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.vv-lista{display:grid;gap:10px}
table.vv{background:var(--s1);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:12px;border-collapse:separate;border-spacing:0}
table.vv.ok{border-left-color:var(--ok)}
table.vv td{border-top:0;padding:12px 14px;vertical-align:top}
table.vv td.hrc{width:72px;padding-right:0}
table.vv td.sit{width:250px}
.vv .hr{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.vv .ha{color:var(--muted);font-size:11.5px;margin-top:3px}
.vv .tt{font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vv .lj{color:var(--text2);font-size:13px;margin-top:2px}
.vv .ds{margin-top:6px;font-size:14px;color:var(--text);font-style:italic}
.vv .it{margin-top:3px;font-size:12.5px;color:var(--text2)}
.vv .rs{margin-top:6px;font-size:12px;color:var(--muted)}
.vv .fn{margin-top:2px;font-size:11px;color:var(--muted)}
.vv .vbt{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-off{background:rgba(138,137,126,.15);color:var(--muted)}
div.vv{background:var(--s1);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px}
div.vv.s-cozinha{border-left-color:var(--bad)}
div.vv.s-expedição{border-left-color:var(--muted)}
div.vv.grave{border-color:var(--bad);background:#2a1716}
@media (max-width:640px){div.vv{grid-template-columns:56px minmax(0,1fr);gap:8px;padding:12px 10px}table.vv,table.vv tbody{display:block}table.vv tr{display:grid;grid-template-columns:64px minmax(0,1fr)}table.vv td{padding:12px 10px}table.vv td.hrc{padding-right:0}.vv .hr{font-size:21px}table.vv td.sit{grid-column:1/-1;width:auto;padding-top:0}table.vv td.hrc{width:auto}}
</style>
</head>
<body>

<div class="wrap">
<div class="top">
  <div>
    <h1>🔥 Resolver hoje</h1>
    <div class="placar" id="placar"><span class="pl">carregando…</span></div>
  </div>
  <div class="rt per" id="per"></div>
</div>

<div id="app"><div class="load">Carregando…</div></div>
</div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};
let D=null, DIAS=1, ONT=false, UNI='', VER='abertas', TIPO='';

async function porta(nome,dados){
  const r=await fetch(SB+'rpc/'+nome,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_dados:dados||{}})});
  if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('porta '+r.status))}
  return await r.json();
}

function rotulo(t){
  if(t==='chat')return '💬 Cliente sem resposta';
  if(t==='reentrega')return '🔁 Reentrega';
  if(t==='negociacao')return '🤝 Negociação do iFood';
  if(t==='cancelamento')return '🚫 Pedido cancelado inteiro';
  if(t==='parcial')return '✂️ Item cancelado no pedido';
  if(t==='maquininha')return '🧾 Maquininha';
  return t;
}

async function verFotos(i){
  const l=(D&&D.itens&&D.itens[i]); if(!l)return;
  let cx=document.getElementById('__fotos');
  if(!cx){ cx=document.createElement('div'); cx.id='__fotos'; document.body.appendChild(cx); }
  cx.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;overflow:auto;padding:16px;text-align:center';
  cx.innerHTML='<div style="color:#fff;margin-bottom:10px">Buscando as fotos do pedido '+esc(l.referencia||'')+'…</div>';
  cx.onclick=function(){ cx.remove(); };
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/functions/v1/guardar-foto-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'ver',token_portal:tok(),pedido_curto:l.referencia})});
    const j=await r.json();
    if(!j.ok||!j.fotos||!j.fotos.length){ cx.innerHTML='<div style="color:#fff">Não achei foto guardada deste pedido.<div style="color:#bbb;font-size:12px;margin-top:6px">Toque para fechar.</div></div>'; return; }
    cx.innerHTML='<div style="color:#fff;margin-bottom:10px">📷 O que o cliente mandou no pedido '+esc(l.referencia||'')+' — toque em qualquer lugar para fechar</div>'+
      j.fotos.map(function(f){ return '<img src="'+f.link+'" style="max-width:96%;max-height:80vh;margin:8px auto;display:block;border-radius:8px">'; }).join('');
  }catch(e){ cx.innerHTML='<div style="color:#fff">Não deu para buscar as fotos. Toque para fechar.</div>'; }
}

var MOT_REE=['Faltou item na sacola','Endereco errado','Cliente pediu de novo','Pedido sumiu no sistema','Saiu junto, sem corrida a mais','Cozinha refez o pedido'];
var MOT_GER=['Resolvido com o cliente','Ja estava certo','Nao era problema nosso','Combinado com a equipe'];

var FAM='TODOS';
var ESQ=false;
function soUm(q){
  var era={ESQ:ESQ,PAU:PAU,CHG:CHG,DUPO:DUPO,FDA:FDA,PZ:PZ}[q];
  ESQ=false;PAU=false;CHG=false;DUPO=false;FDA=false;PZ=false;TIPO='';
  if(q==='ESQ')ESQ=!era; if(q==='PAU')PAU=!era; if(q==='CHG')CHG=!era; if(q==='DUPO')DUPO=!era; if(q==='FDA')FDA=!era; if(q==='PZ')PZ=!era;
  desenha(); rolaPainel();
}
function rolaPainel(){ var p=document.getElementById('painel'); if(p&&p.scrollIntoView) p.scrollIntoView({behavior:'smooth',block:'nearest'}); }
function fechaTudo(){ ESQ=false;PAU=false;CHG=false;DUPO=false;FDA=false;PZ=false;TIPO=''; desenha(); }
var TIT_Q={ESQ:'🛍️ Errado no pedido',PAU:'⏸️ Parou de vender',FDA:'📵 Fora do ar no delivery',CHG:'🛵 Chegada não sinalizada',DUPO:'🚘 Corrida em dobro',PZ:'⏸️ Cardápio pausado'};
function painelQ(q,corpo){
  if(!corpo) return '';
  return '<div class="painel" id="painel"><div class="ph"><h3>'+TIT_Q[q]+'</h3><button class="b fecha" onclick="fechaTudo()">fechar ✕</button></div>'+corpo+'</div>';
}
/* na primeira abertura, ja abre o primeiro quadro com problema (igual ao Delivery · Sao Braz) */
var PRIMEIRA=true;
function abrePrimeiro(){
  if(!PRIMEIRA||!D) return; PRIMEIRA=false;
  if(TIPO||ESQ||PAU||CHG||DUPO||FDA||PZ) return;
  var es=D.esquecidos||[], it=D.itens||[];
  if(es.some(function(e){return e.pendente})){ ESQ=true; return; }
  var ord=['reentrega','cancelamento','parcial','chat','maquininha','negociacao'];
  for(var k=0;k<ord.length;k++){ if(it.some(function(x){return x.tipo===ord[k]&&!x.resolvido})){ TIPO=ord[k]; VER='abertas'; return; } }
}
var PAU=false;
var FDA=false;
var CHG=false;

/* 30/09/2026, pedido do Fabio (telas honestas): Reentrega, Chegada nao sinalizada e Corrida em dobro dependem
   do TrackEat. Quando ele parou, o cartao nao pode mostrar 0 como se estivesse tudo certo: fica cinza e diz desde quando.
   Quem sabe desde quando e o medidor de frescor (fato_frescor, aberto para leitura), lido 1x por abertura. */
var FR=null;
async function frPega(){
  try{
    var r=await fetch(SB+'fato_frescor?select=fonte,ultimo_dia,farol&fonte=eq.delivery_entrega',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    if(r.ok){var o={};(await r.json()).forEach(function(x){o[x.fonte]=x;});FR=o;}
  }catch(e){}
}
function frParado(f){var x=FR&&FR[f];if(!x||x.farol!=='PARADO'||!x.ultimo_dia)return null;var p=String(x.ultimo_dia).split('-');return p[2]+'/'+p[1];}
function cardSemDado(rot, ic){
  var q=frParado('delivery_entrega');
  if(!q) return null;
  return '<div class="card sd" title="Sem dado: o TrackEat parou"><div class="t">'+(ic?ic+' ':'')+rot+'</div>'+
    '<div class="v">—</div><div class="qs">TrackEat parado desde '+q+'</div></div>';
}
function cardF0(rot, ic){
  return '<div class="card bem"><div class="t">'+(ic?ic+' ':'')+rot+'</div><div class="v">0</div></div>';
}

function cardFda(){
  var c=(D&&D.cardapio)||{}, n=c.itens_fora_do_ar||0;
  if(!n) return cardF0('Fora do ar no delivery','&#128245;');
  var velho=(c.leituras||[]).filter(function(l){return l.dias>1}).length;
  var eter=(c.lista||[]).filter(function(x){return x.classe==='eterno'}).length;
  var semResp=(c.lista||[]).filter(function(x){return x.chave && !x.resolvido}).length;
  return '<div class="card aviso'+(FDA?' on':'')+'" onclick="soUm(&quot;FDA&quot;)" title="Clique para abrir ou fechar">'+
    '<div class="t">&#128245; Fora do ar no delivery</div>'+
    '<div class="v">'+n+'</div>'+
    (semResp?'<div class="qs" style="color:var(--warn)">'+semResp+' sem resposta da loja</div>':'')+
    (eter?'<div class="qs" style="color:var(--bad)">'+eter+' para tirar do cardapio</div>':'')+
    (velho?'<div class="qs" style="color:var(--bad)">'+velho+' sem leitura recente</div>':'')+'</div>';
}

function foraDoAr(){
  var c=(D&&D.cardapio)||{}, ls=c.lista||[], le=c.leituras||[];
  if(!FDA) return '';
  var semLer=le.filter(function(l){return l.dias>1}).map(function(l){return esc(l.unidade)+' '+esc(l.canal)+' (ultima leitura '+esc(l.lido_em||'?')+')'});
  var lojas={}, ordem=[];
  ls.forEach(function(x){ var k=(x.unidade||'sem loja'); if(!lojas[k]){ lojas[k]=[]; ordem.push(k); } lojas[k].push(x); });
  var corpo=ordem.map(function(u){
    var canais={}, oc=[];
    lojas[u].forEach(function(x){ if(!canais[x.canal]){ canais[x.canal]=[]; oc.push(x.canal); } canais[x.canal].push(x); });
    return '<div style="margin:12px 0 3px;font-size:13px;font-weight:800">'+esc(u)+'</div>'+
      oc.map(function(cn){
        var l=le.filter(function(z){return z.unidade===u && z.canal===cn})[0]||{};
        var cor=(l.dias>1?'var(--bad)':'var(--muted)');
        return '<div style="margin:6px 0 2px;font-size:11px;font-weight:800">'+esc(cn)+' &#183; '+canais[cn].length+
          ' <span style="color:'+cor+';font-weight:700">&#183; lido em '+esc(l.lido_em||'?')+
          (l.dias>1?' (ha '+l.dias+' dias &#8212; pode ja ter mudado)':'')+'</span></div>'+
          [['eterno','&#129702; NUNCA VENDEU NA LOJA &#8212; tirar do cardapio','var(--bad)'],
           ['recente','&#9203; PAUSADO HA POUCO &#8212; conferir se ja voltou','var(--warn)'],
           ['sem_dado','&#10067; SEM HISTORICO DE VENDA PARA COMPARAR','var(--muted)']].map(function(g){
            var xs=canais[cn].filter(function(x){return (x.classe||'sem_dado')===g[0]});
            if(!xs.length) return '';
            return '<div style="margin:8px 0 2px;font-size:10px;font-weight:800;color:'+g[2]+'">'+g[1]+' ('+xs.length+')</div>'+
              xs.map(function(x){
                var sub = x.classe==='eterno' ? 'nenhuma venda desde '+esc(x.historico_desde||'?')+' (inicio do historico)'
                        : x.classe==='recente' ? 'ultima venda '+esc(x.ultima_venda||'?')
                        : (x.tipo||'');
                return '<div style="padding:4px 0;font-size:12px;line-height:1.45;border-top:1px solid rgba(255,255,255,.07)">'+
                  '<b>'+esc(x.item||'')+'</b> <span style="color:var(--muted)">&#183; '+esc(x.estado||'')+' desde '+esc(x.desde||'?')+
                  ' &#183; '+sub+'</span><br><span style="color:var(--muted);font-size:11px">'+esc(x.marca||'')+'</span>'+
                  (function(){ var p=parouTambem(x); return p?'<br><span style="color:var(--warn);font-size:11px;font-weight:700">&#9208;&#65039; tambem em Parou de vender: '+esc(p.produto||'')+', ultima venda '+esc(p.ultima||'')+'</span>':''; })()+
                  respPau(x)+'</div>';
              }).join('');
          }).join('');
      }).join('');
  }).join('');
  return '<div style="border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--s1);border-radius:16px;padding:12px 14px;margin:0">'+
    '<div style="color:var(--warn);font-size:11px;font-weight:800">PAUSADO OU ESCONDIDO NO CARDAPIO &#8212; so iFood e Accon, visto de ontem para ca (tablet do salao nao entra)</div>'+
    (ls.length?corpo:'<div class="m" style="margin-top:6px">Nada pausado nas leituras de ontem para ca.</div>')+
    (semLer.length?'<div style="margin-top:10px;font-size:12px;color:var(--bad);font-weight:700">Sem leitura de ontem para ca, fora da conta: '+semLer.join(' &#183; ')+'</div>':'')+
    '<div class="m" style="margin-top:9px">"Nunca vendeu" = nenhuma venda desse item na loja (salao ou delivery) desde o inicio do historico do Saipos. Isto e o que o robo viu no cardapio na data de cada leitura. Para religar, abra o Gestor de Pedidos do iFood ou o painel da Accon.</div></div>';
}

// 24/09/2026 (chat-enxugar-msgs-delivery-24-09): resposta da loja a cada item pausado.
// Item respondido sai do QUADRO DE PAUSADOS do WhatsApp. "Despausei" vale ate a proxima leitura do cardapio;
// "Acabou" vale 2 dias; o resto vale 30 dias (regra em pausado_status no banco).
var MOT_PAU=['Despausei','Acabou, vai repor','Tirar do cardapio / pausa de proposito'];
function respPau(x){
  var ls=((D&&D.cardapio)||{}).lista||[], i=ls.indexOf(x);
  if(i<0 || !x.chave) return '';
  if(x.resolvido){
    return '<div style="margin-top:5px"><span class="feito">&#10004; '+esc(x.quem||'')+'</span> '+
      '<span class="m">'+esc(x.resolvido_em||'')+' &#183; '+esc(x.o_que_foi_feito||'')+'</span> '+
      '<button class="mini" onclick="reabrePau('+i+')">reabrir</button></div>';
  }
  return '<div style="margin-top:5px">'+
    (x.contradito?'<div style="color:var(--bad);font-size:11px;font-weight:700;margin-bottom:4px">&#9888;&#65039; '+esc(x.quem||'')+' marcou "despausei" em '+esc(x.resolvido_em||'')+', mas a leitura seguinte ainda viu pausado</div>':'')+
    ((x.dias_parado>=2)?'<div style="color:var(--warn);font-size:11px;font-weight:700;margin-bottom:4px">&#9200; '+x.dias_parado+' dias sem resposta</div>':'')+
    MOT_PAU.map(function(m,k){ return '<button class="mini" style="margin:0 4px 4px 0" onclick="marcaPau('+i+','+k+')">'+esc(m)+'</button>' }).join('')+
    '</div>';
}
async function marcaPau(i,k){
  var x=(((D&&D.cardapio)||{}).lista||[])[i]; if(!x) return;
  try{ await porta('resolver_marcar',{tipo:'pausado',chave:x.chave,unidade:x.unidade,o_que_foi_feito:MOT_PAU[k]}); }
  catch(e){ alert('Nao consegui gravar: '+e.message); return; }
  boot();
}
async function reabrePau(i){
  var x=(((D&&D.cardapio)||{}).lista||[])[i]; if(!x) return;
  try{ await porta('resolver_marcar',{tipo:'pausado',chave:x.chave,desfazer:true}); }
  catch(e){ alert('Nao consegui reabrir: '+e.message); return; }
  boot();
}

function cardPau(){
  var ps=((D&&D.pausados)||{}).linhas||[];
  if(!ps.length) return cardF0('Parou de vender','&#9208;&#65039;');
  return '<div class="card aviso'+(PAU?' on':'')+'" onclick="soUm(&quot;PAU&quot;)" title="Clique para abrir ou fechar">'+
    '<div class="t">&#9208;&#65039; Parou de vender</div>'+
    '<div class="v">'+ps.length+'</div>'+
    (function(){
      var n={pausado:0,no_ar:0,sem_leitura:0};
      ps.forEach(function(p){ n[situCard(p).k]++; });
      return (n.pausado?'<div class="qs" style="color:var(--warn)">'+n.pausado+' pausado no cardapio</div>':'')+

// 25/09/2026 (chat-parou-x-foradoar-25-09): "Parou de vender" cruzado com "Fora do ar no delivery".
// Mesma regua de nome da funcao cardapio_pausado_vendas: palavras de 4+ letras do item do cardapio,
// todas presentes no nome do produto do Saipos, mesma loja e mesmo canal (iFood / Accon).
function normNome(t){
  return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
var PAL_FORA=['para','pessoa','pessoas','litro','litros','beer','delivery','chopp','promo','desconto','classicos','classico'];
function canalDe(origem){ return /accon/i.test(origem||'')?'Accon':'iFood'; }
// vale nos dois sentidos: "Caldo verde com calabresa" (iFood) casa com "CALDO VERDE" (Saipos) e vice-versa
function palavras(t){
  return normNome(String(t||'').replace(/\(.*?\)/g,'')).replace(/[^a-z ]+/g,' ').split(/\s+/)
    .filter(function(w){ return w.length>=4 && PAL_FORA.indexOf(w)<0; });
}
function contem(toks, t){
  var p=normNome(t).replace(/[^a-z0-9 ]+/g,' ');
  return toks.length>0 && toks.every(function(w){ return p.indexOf(w)>=0; });
}
function casaNome(itemCard, produto){
  return contem(palavras(itemCard), produto) || contem(palavras(produto), itemCard);
}
function situCard(p){
  var c=(D&&D.cardapio)||{}, cn=canalDe(p.origem);
  var l=(c.leituras||[]).filter(function(z){ return z.unidade===p.unidade && z.canal===cn; })[0];
  var x=(c.lista||[]).filter(function(z){ return z.unidade===p.unidade && z.canal===cn && casaNome(z.item,p.produto); })[0];
  if(x) return {k:'pausado', cn:cn, l:l, x:x};
  if(l && l.dias<=1) return {k:'no_ar', cn:cn, l:l};
  return {k:'sem_leitura', cn:cn, l:l};
}
function parouTambem(x){
  var ps=((D&&D.pausados)||{}).linhas||[];
  return ps.filter(function(p){ return p.unidade===x.unidade && canalDe(p.origem)===x.canal && casaNome(x.item,p.produto); })[0];
}

// Mostra a hora que cada item do iFood pausou, a hora que voltou e quanto tempo ficou fora.
// Fonte: porta resolver_pausas, que le ifood_cardapio_pausa (robo ifood-cardapio-api, API oficial do iFood, a cada 5 min).
// As funcoes antigas (cardPau, pausados, cardFda, foraDoAr) continuam no arquivo, so nao sao mais desenhadas.
var PZ=false, PZD=null;
function tempoFora(m){
  if(m==null) return '?';
  if(m<60) return m+' min';
  if(m<1440) return Math.floor(m/60)+'h'+(m%60<10?'0':'')+(m%60);
  var d=Math.floor(m/1440), h=Math.floor((m%1440)/60);
  return d+(d===1?' dia':' dias')+(h?' e '+h+'h':'');
}
function cardPz(){
  if(PZD===null) return '<div class="card" style="opacity:.5"><div class="t">&#9208;&#65039; Cardapio pausado</div><div class="v">&#8230;</div></div>';
  if(PZD.erro) return '<div class="card" style="opacity:.5"><div class="t">&#9208;&#65039; Cardapio pausado</div><div class="v">&#8212;</div></div>';
  var ls=PZD.linhas||[], ab=ls.filter(function(x){return x.aberta}), vo=ls.length-ab.length;
  var pr=ab.filter(function(x){return x.tipo==='Item principal'}).length;
  return '<div class="card aviso'+(PZ?' on':'')+'" onclick="soUm(&quot;PZ&quot;)" title="Clique para abrir ou fechar">'+
    '<div class="t">&#9208;&#65039; Cardapio pausado</div>'+
    '<div class="v">'+ab.length+'</div>'+
    '<div class="qs" style="color:var(--warn)">'+pr+' pratos e '+(ab.length-pr)+' complementos</div>'+
    (function(){ var s=ab.filter(function(x){return x.chave && !x.resolvido}).length; return s?'<div class="qs" style="color:var(--bad)">'+s+' sem resposta da loja</div>':''; })()+
    (vo?'<div class="qs" style="color:var(--ok)">'+vo+' voltaram ao ar no periodo</div>':'')+
    ((PZD.lido_min!=null&&PZD.lido_min>20)?'<div class="qs" style="color:var(--bad)">leitura parada ha '+tempoFora(PZD.lido_min)+'</div>':'')+
    '</div>';
}
// 28/09/2026 (pedido do Fabio): a loja responde em cada item pausado se pode excluir ou se vai voltar a vender.
// Grava pela mesma porta e na mesma chave do antigo "Fora do ar" (resolver_marcar tipo 'pausado'), entao as respostas antigas continuam valendo.
// Validade (regra pausado_status no banco): "Despausei" vale ate a proxima leitura; "Acabou..." 2 dias; o resto 30 dias.
var MOT_PZ=['Despausei','Acabou, vai voltar a vender','Pode excluir do cardapio'];
// 03/10/2026 (chat-pausados-whatsapp-03-10): resposta escrita pelo robo que le o WhatsApp e as anotacoes
// mostra embaixo a mensagem que ele usou, para a equipe conferir e reabrir se estiver errado.
function provaPz(x){
  return x.prova?'<div class="m" style="font-size:10px;margin-top:3px">&#128233; '+esc(x.prova)+'</div>':'';
}
function respPz(x){
  var ls=(PZD&&PZD.linhas)||[], i=ls.indexOf(x);
  if(i<0 || !x.chave) return '';
  if(x.resolvido){
    return '<span class="feito">&#10004; '+esc(x.quem||'')+'</span> <span class="m">'+esc(x.em||'')+' &#183; '+esc(x.o_que||'')+'</span> '+
      '<button class="mini" onclick="reabrePz('+i+')">reabrir</button>'+provaPz(x);
  }
  return (x.contradito?'<div style="color:var(--bad);font-size:11px;font-weight:700;margin-bottom:4px">&#9888;&#65039; '+esc(x.quem||'')+
      (/^Despausar/i.test(x.o_que||'')?' pediu para despausar em ':' marcou "despausei" em ')+esc(x.em||'')+', mas o iFood ainda mostra pausado</div>'+provaPz(x):'')+
    MOT_PZ.map(function(m,k){ return '<button class="mini" style="margin:0 4px 4px 0" onclick="marcaPz('+i+','+k+')">'+esc(m)+'</button>' }).join('');
}
async function marcaPz(i,k){
  var x=((PZD&&PZD.linhas)||[])[i]; if(!x) return;
  try{ await porta('resolver_marcar',{tipo:'pausado',chave:x.chave,unidade:x.unidade,o_que_foi_feito:MOT_PZ[k]}); }
  catch(e){ alert('Nao consegui gravar: '+e.message); return; }
  boot();
}
async function reabrePz(i){
  var x=((PZD&&PZD.linhas)||[])[i]; if(!x) return;
  try{ await porta('resolver_marcar',{tipo:'pausado',chave:x.chave,desfazer:true}); }
  catch(e){ alert('Nao consegui reabrir: '+e.message); return; }
  boot();
}
function linhaPz(x){
  return '<tr><td>'+esc(x.unidade)+'</td><td>'+esc(x.marca)+'</td>'+
    '<td><b>'+esc(x.item)+'</b>'+(x.tipo==='Complemento'?' <span style="color:var(--muted);font-size:10px">complemento</span>':'')+'</td>'+
    '<td style="white-space:nowrap">'+(x.minimo?'antes de ':'')+esc(x.pausou||'?')+'</td>'+
    '<td style="white-space:nowrap">'+(x.voltou?esc(x.voltou):'<span style="color:var(--warn)">ainda pausado</span>')+'</td>'+
    '<td style="white-space:nowrap">'+(x.minimo?'pelo menos ':'')+tempoFora(x.minutos)+'</td>'+
    (x.aberta?'<td style="min-width:220px">'+respPz(x)+'</td>':'')+'</tr>';
}
function pausasPz(){
  if(!PZ) return '';
  if(!PZD||PZD.erro) return '<div class="c" style="margin-top:10px"><div class="m">Nao deu para carregar as pausas'+(PZD&&PZD.erro?': '+esc(PZD.erro):'')+'.</div></div>';
  var ls=PZD.linhas||[];
  var grupo=function(tit,cor,arr,resp){
    if(!arr.length) return '';
    return '<div style="color:'+cor+';font-size:11px;font-weight:800;margin:10px 0 4px">'+tit+' ('+arr.length+')</div>'+
      '<div style="overflow-x:auto"><table class="pz"><tr><th>Loja</th><th>Marca</th><th>Item</th><th>Pausou</th><th>Voltou</th><th>Tempo fora</th>'+(resp?'<th>A loja responde</th>':'')+'</tr>'+
      arr.map(linhaPz).join('')+'</table></div>';
  };
  return '<div style="border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--s1);border-radius:16px;padding:12px 14px;margin:0">'+
    '<div style="color:var(--warn);font-size:11px;font-weight:800">CARDAPIO DO iFOOD &#8212; hora que pausou, hora que voltou e quanto tempo ficou fora</div>'+
    '<div class="m" style="margin-top:4px">Lido direto do iFood a cada 5 minutos (ultima leitura '+esc(PZD.lido_em||'?')+'). A hora tem margem de ate 5 minutos. '+
    '"Antes de" e "pelo menos" = ja estava pausado quando o robo comecou a olhar, em 28/09. Accon e tablet do salao nao entram. '+
    'Em cada item pausado, a loja diz se pode excluir do cardapio ou se vai voltar a vender.</div>'+
    (ls.length? grupo('&#128245; PAUSADO AGORA','var(--warn)',ls.filter(function(x){return x.aberta}),true)+
               grupo('&#9989; VOLTOU AO AR NO PERIODO','var(--ok)',ls.filter(function(x){return !x.aberta}))
             : '<div class="m" style="margin-top:6px">Nada pausado neste periodo.</div>')+
    '</div>';
}

function cardF(rot, val, tp, ver, cor, ic){
  var aceso = (tp === TIPO) && (!ver || ver === VER);
  var n = +val || 0;
  return '<div class="card '+(n?'mal':'bem')+(aceso?' on':'')+'" onclick="filtra(&quot;'+tp+'&quot;,&quot;'+ver+'&quot;)"'+
         ' title="Clique para abrir ou fechar a lista">'+
         '<div class="t">'+(ic?ic+' ':'')+rot+'</div>'+
         '<div class="v"'+(cor?' style="color:'+cor+'"':'')+'>'+val+'</div></div>';
}

/* 03/10/2026 (chat-resolver-itemcancelado-03-10), pedido do Fabio: "tiveram varios itens cancelados e reembolsados"
   e o quadro mostrava 0, porque so contava o que ainda esperava alguem. Agora o numero grande e o total do periodo
   (mesmas fontes do Errado no pedido) e a linha de baixo diz quantos ainda esperam alguem. Abre a lista inteira. */
function cardTot(R, tp, rot, ic){
  var tot=+R[tp+'_total']||0, ab=+R[tp]||0;
  if(!tot) return cardF0(rot, ic);
  return '<div class="card '+(ab?'mal':'aviso')+(TIPO===tp?' on':'')+'" onclick="filtra(&quot;'+tp+'&quot;,&quot;tudo&quot;)" title="Clique para abrir ou fechar a lista">'+
    '<div class="t">'+ic+' '+rot+'</div>'+
    '<div class="v">'+tot+'</div>'+
    (ab ? '<div class="qs" style="color:#ff9a9a">'+ab+' esperando alguém</div>'
        : '<div class="qs" style="color:#7fe0aa">todos com solução</div>')+
    '</div>';
}
function cardParc(R){ return cardTot(R,'parcial','Item cancelado','✂️'); }
/* a Maquininha nao tem periodo: a comanda fica na lista ate alguem resolver, de qualquer dia.
   Por isso o numero e so o que espera alguem (o total juntaria semanas de casos ja resolvidos). */
function cardMaq(R){
  var ab=+R.maquininha||0;
  if(!ab) return cardF0('Maquininha','🧾');
  return '<div class="card mal'+(TIPO==='maquininha'?' on':'')+'" onclick="filtra(&quot;maquininha&quot;,&quot;abertas&quot;)" title="Clique para abrir ou fechar a lista">'+
    '<div class="t">🧾 Maquininha</div><div class="v">'+ab+'</div>'+
    '<div class="qs" style="color:#ff9a9a">esperando alguém</div>'+
    '<div class="qs">de qualquer dia, até alguém resolver</div></div>';
}

/* 03/10/2026 (chat-resolver-itemcancelado-03-10), pedido do Fabio: "quero que use aqui aquele front end bonito"
   — a lista do Item cancelado em cartoes, igual ao AO VIVO da Central Cozinha. Cada cartao e uma tabela de uma
   linha so, para a anotacao do portal.js continuar aparecendo (ela procura linha de tabela com botao).
   O banco manda a marca em o_que_e e o detalhe com rotulos: "disse: ... | item: ... | como ficou: ... | de onde veio: ...". */
function parteDet(s){
  var o={};
  String(s||'').split(/ \| (?=(?:tipo|disse|item|como ficou|quem cancelou|contestação|de onde veio): )/).forEach(function(p){
    var m=p.match(/^(tipo|disse|item|como ficou|quem cancelou|contestação|de onde veio): ([\s\S]*)$/); if(m) o[m[1]]=m[2];
  });
  return o;
}
/* cartao dos outros quadros (Cliente sem resposta, Negociacao, Maquininha, Reentrega): o banco manda o_que_e e detalhe soltos */
function cartaoGeral(l,i){
  var ok=!!l.resolvido, q=String(l.quando||''), tm=/ \d{2}:\d{2}$/.test(q);
  var det=String(l.detalhe||'').split(' | ').join(' · ');
  if(l.cliente_disse && det===l.cliente_disse) det='';
  return '<table class="vv'+(ok?' ok':'')+'" data-cdm-livre><tr data-cdm-chave="'+esc(l.chave||'')+'">'+
    '<td class="hrc"><div class="hr">'+esc(tm?q.slice(6):(q||'—'))+'</div><div class="ha">'+esc(tm?haQuando(q):'')+'</div></td>'+
    '<td><div class="tt">'+esc(rotulo(l.tipo))+' '+(ok?'<span class="pill p-ok">resolvido</span>':'<span class="pill p-bad">esperando alguém</span>')+'</div>'+
      '<div class="lj"><b>'+esc(l.unidade||'')+'</b> · pedido <b>'+esc(l.referencia||'—')+'</b></div>'+
      (l.cliente_disse?'<div class="ds">“'+esc(l.cliente_disse)+'”</div>':'')+
      (l.o_que_e?'<div class="it">'+esc(l.o_que_e)+'</div>':'')+
      ((det||l.valor!=null)?'<div class="rs">'+esc(det)+(l.valor!=null?(det?' · ':'')+'R$ '+esc(Number(l.valor).toFixed(2).replace('.',',')):'')+'</div>':'')+
      (FONTE_TIPO[l.tipo]?'<div class="fn">Fonte: '+esc(FONTE_TIPO[l.tipo])+'</div>':'')+
      ((l.fotos>0||l.tem_conversa)?'<div class="vbt">'+
        ((l.fotos>0)?'<button class="mini" onclick="verFotos('+i+')">📷 '+l.fotos+(l.fotos>1?' fotos':' foto')+'</button>':'')+
        (l.tem_conversa?'<button class="mini" onclick="verConversa('+i+')">💬 conversa</button>':'')+'</div>':'')+
      ((l.n_conversas>1)?'<div style="margin-top:5px;color:var(--warn);font-size:12px">⚠️ '+l.n_conversas+' conversas com esse numero de pedido — nao da para saber qual e</div>':'')+
    '</td>'+
    '<td class="sit">'+
      (ok
        ? '<span class="feito">✔ '+esc(l.quem||'')+'</span><div class="m">'+esc(l.resolvido_em||'')+' · '+esc(l.o_que_foi_feito||'')+'</div>'+
          '<button class="mini" style="margin-top:6px" onclick="reabrir('+i+')">reabrir</button>'
        : campoEscrita(l,i))+
    '</td></tr></table>';
}
function haQuando(q){
  var m=String(q||'').match(/^(\d{2})\/(\d{2}) (\d{2}):(\d{2})$/); if(!m) return '';
  var n=new Date(), t=new Date(n.getFullYear(),+m[2]-1,+m[1],+m[3],+m[4]);
  if(t>n) t.setFullYear(t.getFullYear()-1);
  var min=Math.round((n-t)/60000);
  if(min<60) return 'há '+min+' min';
  if(min<1440) return 'há '+Math.floor(min/60)+'h'+(min%60<10?'0':'')+(min%60);
  return m[1]+'/'+m[2];
}
var FONTE_TIPO={chat:'Chat do iFood (Gestor Web)',negociacao:'Negociação do iFood',maquininha:'Conferência da maquininha (Saipos × Rede)'};
function cartaoParc(l,i){
  var cc=(l.tipo==='cancelamento'), pc=(l.tipo==='parcial');
  if(!cc && !pc) return cartaoGeral(l,i);
  var d=parteDet(l.detalhe), ok=!!l.resolvido;
  var disse=d['disse']||l.cliente_disse||'', item=d['item']||'';
  if(item && disse && (disse.indexOf(item)>=0 || item.indexOf(disse)>=0)) item='';
  var hora=String(l.quando||'').slice(6)||'—';
  return '<table class="vv'+(ok?' ok':'')+'" data-cdm-livre><tr data-cdm-chave="'+esc(l.chave||'')+'">'+
    '<td class="hrc"><div class="hr">'+esc(hora)+'</div><div class="ha">'+esc(haQuando(l.quando))+'</div></td>'+
    '<td><div class="tt">'+(cc?'🚫 '+esc(d['tipo']||'Cancelado inteiro'):'✂️ Item cancelado')+' '+(ok?'<span class="pill p-ok">resolvido</span>':'<span class="pill p-bad">esperando alguém</span>')+
        (cc&&d['quem cancelou']?' <span class="pill p-off">cancelou: '+esc(d['quem cancelou'])+'</span>':'')+'</div>'+
      '<div class="lj"><b>'+esc(l.unidade||'')+'</b> · pedido <b>'+esc(l.referencia||'')+'</b>'+(l.o_que_e?' · '+esc(l.o_que_e):'')+'</div>'+
      (disse?'<div class="ds">“'+esc(disse)+'”</div>':'')+
      (item?'<div class="it">Item no iFood: '+esc(item)+'</div>':'')+
      (cc ? '<div class="rs">Pedido cancelado inteiro'+(d['contestação']?' · '+esc(d['contestação']):'')+
              (l.valor!=null?' · valor do pedido R$ '+esc(Number(l.valor).toFixed(2).replace('.',',')):'')+'</div>'
          : '<div class="rs">Como ficou: '+esc(d['como ficou']||'—')+'</div>')+
      '<div class="fn">Fonte: '+esc(d['de onde veio']||'—')+'</div>'+
      ((l.fotos>0||l.tem_conversa)?'<div class="vbt">'+
        ((l.fotos>0)?'<button class="mini" onclick="verFotos('+i+')">📷 '+l.fotos+(l.fotos>1?' fotos':' foto')+'</button>':'')+
        (l.tem_conversa?'<button class="mini" onclick="verConversa('+i+')">💬 conversa</button>':'')+'</div>':'')+
      ((l.n_conversas>1)?'<div style="margin-top:5px;color:var(--warn);font-size:12px">⚠️ '+l.n_conversas+' conversas com esse numero de pedido — nao da para saber qual e</div>':'')+
    '</td>'+
    '<td class="sit">'+
      (ok
        ? '<span class="feito">✔ '+esc(l.quem||'')+'</span><div class="m">'+esc(l.resolvido_em||'')+' · '+esc(l.o_que_foi_feito||'')+'</div>'+
          '<button class="mini" style="margin-top:6px" onclick="reabrir('+i+')">reabrir</button>'
        : campoEscrita(l,i))+
    '</td></tr></table>';
}

function barraFiltro(){
  var lj=function(n,r){ return '<button class="chip'+(UNI===n?' on':'')+'" onclick="UNI=&quot;'+n+'&quot;;boot()">'+(r||n||'Todas')+'</button>' };
  var pe=$('per');
  if(pe) pe.innerHTML=
     '<button class="chip'+((DIAS===1&&!ONT)?' on':'')+'" onclick="DIAS=1;ONT=false;boot()">Hoje</button>'+
     '<button class="chip'+(ONT?' on':'')+'" onclick="DIAS=1;ONT=true;boot()">Ontem</button>'+
     '<button class="chip'+(DIAS===7?' on':'')+'" onclick="DIAS=7;ONT=false;boot()">7 dias</button>'+
     '<button class="b" onclick="boot()" title="Ler de novo">↻ Atualizar</button>';
  return '<div class="lojas"><span class="rot">LOJA</span>'+
     lj('','Todas')+lj('Água Verde')+lj('Ahú')+lj('São Braz')+
     '</div>';
}

function desenha(){
  var BF=barraFiltro();
  if(D===false){ $('app').innerHTML='<div class="c"><b>Não deu para carregar.</b><div class="m">Entre no portal de novo e tente outra vez.</div></div>'; return }
  if(!D){ $('app').innerHTML='<div class="load">Carregando…</div>'; return }
  const R=D.resumo||{}, itens=D.itens||[], card=D.cardapio||{};
  let h=BF+'<div class="cards">'+
    cardEsq()+
    ((!R.reentrega&&cardSemDado('Reentrega','🔁'))||cardTot(R,'reentrega','Reentrega','🔁'))+
    cardTot(R,'cancelamento','Cancelado inteiro','🚫')+
    cardParc(R)+
    cardTot(R,'chat','Cliente sem resposta','💬')+
    cardMaq(R)+
    cardTot(R,'negociacao','Negociação do iFood','🤝')+
    cardCheg()+
    cardDup()+
    cardPz()+
  '</div>';

  h+=painelQ('ESQ',esquecidos());

  h+=painelQ('PZ',pausasPz());

  h+=painelQ('CHG',chegada());

  h+=painelQ('DUPO',duplaPainel());

  if(TIPO){
    const porTipo = itens.filter(function(x){return x.tipo===TIPO});
    const lista = (VER==='abertas') ? porTipo.filter(function(x){return !x.resolvido}) : porTipo;
    h+='<div class="painel" id="painel"><div class="ph"><h3>'+rotulo(TIPO)+'</h3><span class="ct">'+(VER==='abertas'?'só o que ainda espera alguém':'tudo do período')+'</span><button class="b fecha" onclick="fechaTudo()">fechar ✕</button></div>';
    if(!lista.length){
      h+='<div class="c"><div class="vazio">'+(VER==='abertas'?'Nada esperando ninguém neste período. A casa está limpa.':'Nada neste período.')+'</div></div>';
    }else{
      /* 03/10/2026: todos os quadros em cartoes (antes: tabela dividida em De dia / De noite, funcoes bloco e linha) */
      h+='<div class="vv-lista">'+itens.map(function(l,i){ return (l.tipo===TIPO && (VER!=='abertas'||!l.resolvido)) ? cartaoParc(l,i) : ''; }).join('')+'</div>';
    }
    if(TIPO==='maquininha' && D.maq_cache){
      h+='<div class="c" style="margin-top:10px"><div class="m">🧾 As comandas não cobradas da maquininha foram conferidas pela última vez em '+esc(D.maq_cache)+
         ((D.maq_horas!=null && D.maq_horas>26)?' — <b style="color:var(--bad)">isso está velho, o robô não rodou</b>':'')+
         '. Elas ficam na lista até alguém resolver, mesmo sendo de outro dia.</div></div>';
    }
    h+='</div>';
  }else if(!(ESQ||PAU||CHG||DUPO||FDA||PZ)){
    h+='<div class="nota">👆 Toque num quadro para ver a lista dele.</div>';
  }

  h+=falaComigo();
  $('app').innerHTML=h;
}

function placar(h){ var p=$('placar'); if(p) p.innerHTML=h; }
async function boot(){
  placar('<span class="pl">carregando…</span>');
  D=null; PZD=null; desenha();
  porta('resolver_pausas',{dias:DIAS,ontem:ONT,unidade:UNI||null}).then(function(j){PZD=j||{linhas:[]};desenha()}).catch(function(e){PZD={erro:(e&&e.message)||'erro'};desenha()});
  if(!FR) frPega().then(function(){ if(D) desenha(); });
  try{ D=await porta('resolver_hoje',{dias:DIAS,ontem:ONT,unidade:UNI||null}); }
  catch(e){ D=false; placar('<span class="pl" style="border-color:rgba(230,103,103,.5);color:#ff9a9a">'+esc((e&&e.message)||'erro')+'</span>'); desenha(); return }
  const R=D.resumo||{};
  var ab=R.abertas||0;
  placar('<span class="pl">Período <b>'+(ONT?'Ontem':(DIAS===7?'7 dias':'Hoje'))+'</b></span>'+
    '<span class="pl"'+(ab?' style="border-color:rgba(230,103,103,.5)"':'')+'><b'+(ab?' style="color:#ff9a9a"':'')+'>'+ab+'</b> esperando alguém</span>'+
    '<span class="pl">Loja <b>'+esc(UNI||'Todas')+'</b></span>'+
    '<span class="pl">lido <b>'+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</b></span>');
  abrePrimeiro();
  desenha();
}
/* ===== porta unica do portal ===== */
const CDMMODS=['resolver'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'resolver'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
