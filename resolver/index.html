<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Resolver hoje · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1200px;margin:0 auto}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;font-size:22px;letter-spacing:.01em;line-height:1.06}
h2{font-size:15px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
button.b:hover{border-color:var(--brand)}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
.m{color:var(--muted);font-size:11.5px;margin-top:3px}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:8px 0}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin:14px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.card .t{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:26px;font-weight:700;margin-top:4px}
.fil{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.fil button{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.fil button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;padding:0 8px 8px 0}
td{padding:9px 8px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.mini{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.mini:hover{border-color:var(--brand)}
.feito{color:var(--ok);font-weight:700}
@media (max-width:900px){.fil{display:flex;flex-wrap:wrap}}
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>🔥 Resolver hoje</h1>
    <div class="sub" id="sub">carregando…</div>
  </div>
  <div class="rt"><button class="b" onclick="boot()">↻ Atualizar</button></div>
</div>

<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};
let D=null, DIAS=2, UNI='', VER='abertas', TIPO='';

async function porta(nome,dados){
  const r=await fetch(SB+'rpc/'+nome,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_dados:dados||{}})});
  if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('porta '+r.status))}
  return await r.json();
}

function rotulo(t){
  if(t==='chat')return '💬 Cliente sem resposta';
  if(t==='reentrega')return '🔁 Reentrega';
  if(t==='negociacao')return '🤝 Negociação do iFood';
  if(t==='cancelamento')return '🚫 Pedido cancelado inteiro';
  if(t==='parcial')return '✂️ Item cancelado no pedido';
  if(t==='maquininha')return '🧾 Maquininha';
  return t;
}

async function verFotos(i){
  const l=(D&&D.itens&&D.itens[i]); if(!l)return;
  let cx=document.getElementById('__fotos');
  if(!cx){ cx=document.createElement('div'); cx.id='__fotos'; document.body.appendChild(cx); }
  cx.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;overflow:auto;padding:16px;text-align:center';
  cx.innerHTML='<div style="color:#fff;margin-bottom:10px">Buscando as fotos do pedido '+esc(l.referencia||'')+'…</div>';
  cx.onclick=function(){ cx.remove(); };
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/functions/v1/guardar-foto-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'ver',token_portal:tok(),pedido_curto:l.referencia})});
    const j=await r.json();
    if(!j.ok||!j.fotos||!j.fotos.length){ cx.innerHTML='<div style="color:#fff">Não achei foto guardada deste pedido.<div style="color:#bbb;font-size:12px;margin-top:6px">Toque para fechar.</div></div>'; return; }
    cx.innerHTML='<div style="color:#fff;margin-bottom:10px">📷 O que o cliente mandou no pedido '+esc(l.referencia||'')+' — toque em qualquer lugar para fechar</div>'+
      j.fotos.map(function(f){ return '<img src="'+f.link+'" style="max-width:96%;max-height:80vh;margin:8px auto;display:block;border-radius:8px">'; }).join('');
  }catch(e){ cx.innerHTML='<div style="color:#fff">Não deu para buscar as fotos. Toque para fechar.</div>'; }
}

var MOT_REE=['Faltou item na sacola','Endereco errado','Cliente pediu de novo','Pedido sumiu no sistema','Saiu junto, sem corrida a mais','Cozinha refez o pedido'];
var MOT_GER=['Resolvido com o cliente','Ja estava certo','Nao era problema nosso','Combinado com a equipe'];

var FAM='BEBIDA';
var ESQ=false;

function cardEsq(){
  var es=(D&&D.esquecidos)||[];
  if(!es.length) return '';
  return '<div class="card" onclick="ESQ=!ESQ;desenha()" title="Clique para abrir ou fechar"'+
    ' style="cursor:pointer'+(ESQ?';border-color:var(--brand)':'')+'">'+
    '<div class="t">Esqueceram na sacola '+(ESQ?'▲':'▼')+'</div>'+
    '<div class="v" style="color:var(--bad)">'+es.length+'</div></div>';
}

function esquecidos(){
  var es=(D&&D.esquecidos)||[];
  if(!es.length || !ESQ) return '';
  var fams=[['BEBIDA','🥤 Bebida','var(--bad)'],['SOBREMESA','🍰 Sobremesa','var(--warn)'],['COMIDA','🍔 Comida','var(--text2)'],['NAO DEU PARA SABER','❓ Nao deu','var(--muted)']];
  var conta={}; es.forEach(function(e){ conta[e.familia]=(conta[e.familia]||0)+1 });
  var lista=es.filter(function(e){ return e.familia===FAM });
  return '<div style="border-left:3px solid var(--bad);background:var(--s1);border-radius:10px;padding:9px 11px;margin:8px 0">'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:7px">'+
      '<span style="color:var(--bad);font-size:11px;font-weight:800;margin-right:4px">ESQUECERAM NA SACOLA</span>'+
      fams.map(function(f){
        var q=conta[f[0]]||0;
        return '<button class="mini" onclick="FAM=&quot;'+f[0]+'&quot;;desenha()"'+
          ' style="'+(FAM===f[0]?'border-color:var(--brand);':'')+'">'+f[1]+' <b style="color:'+f[2]+'">'+q+'</b></button>';
      }).join('')+
    '</div>'+
    (lista.length
      ? '<div style="max-height:150px;overflow:auto">'+lista.map(function(e){
          return '<div style="padding:3px 0;font-size:12px;line-height:1.35">'+
            '<span style="color:var(--muted)">'+esc(e.quando||'')+' · '+esc(e.unidade||'')+' · '+esc(e.pedido||'')+'</span> '+
            '<span style="color:var(--brand)">“'+esc(e.disse||'')+'”</span></div>';
        }).join('')+'</div>'
      : '<div style="color:var(--muted);font-size:12px">Nenhum caso deste tipo no periodo.</div>')+
    '<div style="color:var(--muted);font-size:11px;margin-top:6px">Sai do que o proprio cliente escreveu no chat. Esquecer bebida e o mais grave.</div>'+
  '</div>';
}

function falaComigo(){
  var ps=(D&&D.pedidos)||[];
  return '<div style="border-left:4px solid var(--brand);background:var(--s1);border-radius:12px;padding:12px 14px;margin:10px 0">'+
    '<div style="color:var(--brand);font-weight:800;margin-bottom:8px">✍️ FALE COMIGO — ESCREVA O QUE PRECISA QUE EU ARRUME</div>'+
    '<textarea id="pedTx" rows="2" placeholder="Escreva com suas palavras. Ex.: essa reentrega nao foi erro nosso, o cliente pediu de novo · o motoboy saiu duas vezes e so recebeu uma · esse pedido nao devia estar nesta lista" '+
      'style="width:100%;background:var(--s2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:14px;resize:vertical"></textarea>'+
    '<div style="margin-top:8px"><button class="mini" onclick="mandaPedido()">Enviar para o Claude</button>'+
      '<span id="pedOk" style="color:var(--ok);font-size:13px;margin-left:10px"></span></div>'+
    '<div style="color:var(--muted);font-size:12px;margin-top:6px">Nao e conversa na hora: entra numa fila e o Claude pega na proxima rodada.</div>'+
    (ps.length? '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">'+
       '<div style="color:var(--muted);font-size:11px;font-weight:800;margin-bottom:6px">O QUE JA FOI PEDIDO</div>'+
       ps.map(function(p){ return '<div style="font-size:13px;margin-bottom:5px"><span style="color:var(--muted)">'+esc(p.quando||'')+' · '+esc(p.quem||'')+'</span><br>'+esc(p.o_que||'')+'</div>' }).join('')+
     '</div>' : '')+
  '</div>';
}

async function mandaPedido(){
  var t=document.getElementById('pedTx');
  var texto=t?String(t.value).trim():'';
  if(texto.length<5){ alert('Escreva o seu pedido com um pouco mais de detalhe.'); return }
  try{ var r=await porta('resolver_marcar',{acao:'pedido',texto:texto}); }
  catch(e){ alert('Nao deu para enviar: '+(e&&e.message?e.message:'tente de novo')); return }
  if(t) t.value='';
  var ok=document.getElementById('pedOk'); if(ok) ok.textContent=(r&&r.resposta)?r.resposta:'Anotei.';
  setTimeout(boot, 1200);
}

async function verConversa(i){
  const l=(D&&D.itens&&D.itens[i]); if(!l)return;
  let cx=document.getElementById('__conversa');
  if(!cx){ cx=document.createElement('div'); cx.id='__conversa'; document.body.appendChild(cx); }
  cx.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;overflow:auto;padding:16px';
  cx.innerHTML='<div style="color:#fff;text-align:center">Buscando a conversa do pedido '+esc(l.referencia||'')+'…</div>';
  cx.onclick=function(ev){ if(ev.target===cx) cx.remove(); };
  try{
    const j=await porta('resolver_marcar',{acao:'conversa',canal:l.canal,pedido:l.referencia});
    const ms=(j&&j.msgs)||[];
    if(!ms.length){ cx.innerHTML='<div style="color:#fff;text-align:center">Nao achei conversa gravada deste pedido.<div style="color:#bbb;font-size:12px;margin-top:6px">Toque fora para fechar.</div></div>'; return }
    cx.innerHTML='<div style="max-width:680px;margin:0 auto">'+
      '<div style="color:#fff;margin-bottom:10px">💬 Conversa do pedido '+esc(l.referencia||'')+' · '+esc(l.unidade||'')+
      '<span style="color:#bbb;font-size:12px"> — toque fora para fechar</span></div>'+
      ms.map(function(m){
        var cor = (m.papel==='cliente') ? 'var(--brand)' : ((m.papel==='loja') ? 'var(--ok)' : 'var(--muted)');
        var quem = (m.papel==='cliente') ? ('cliente '+(m.quem||'')) : ((m.papel==='loja') ? ('loja '+(m.quem||'')) : 'iFood');
        return '<div style="background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px">'+
          '<div style="color:'+cor+';font-size:11px;font-weight:800">'+esc(quem)+' · '+esc(m.quando||'')+'</div>'+
          '<div style="color:var(--text);font-size:14px;margin-top:2px">'+esc(m.texto||'')+'</div></div>';
      }).join('')+'</div>';
  }catch(e){ cx.innerHTML='<div style="color:#fff;text-align:center">Nao deu para buscar a conversa. Toque fora para fechar.</div>'; }
}

function campoEscrita(l,i){
  var dica=(l.tipo==='reentrega')?'escrever o que aconteceu e por que pagou a mais...':'escrever o que foi feito...';
  return '<div style="white-space:normal;min-width:230px">'+
    '<textarea id="tx'+i+'" rows="2" placeholder="'+dica+'" oninput="mexeu('+i+')" onfocus="mexeu('+i+')" '+
      'style="width:100%;background:var(--s1);color:var(--text);border:1px dashed var(--line);border-radius:8px;padding:7px 8px;font-family:inherit;font-size:13px;resize:vertical"></textarea>'+
    '<div id="ex'+i+'" style="display:none;margin-top:6px"></div></div>';
}

function mexeu(i){
  var l=(D&&D.itens&&D.itens[i]); if(!l)return;
  var ex=document.getElementById('ex'+i), t=document.getElementById('tx'+i);
  if(!ex||!t)return;
  if(!ex.innerHTML){
    var ms=(l.tipo==='reentrega')?MOT_REE:MOT_GER;
    ex.innerHTML=ms.map(function(m){ return '<button class="mini" style="margin:0 4px 4px 0" onclick="poeMotivo('+i+',this)">'+esc(m)+'</button>' }).join('')+
      '<div style="margin-top:4px"><button class="mini" id="gv'+i+'" onclick="gravaCampo('+i+')">Gravar e fechar</button></div>';
  }
  ex.style.display='block';
  t.style.borderStyle = t.value.trim() ? 'solid' : 'dashed';
}

function poeMotivo(i,b){
  var t=document.getElementById('tx'+i); if(!t)return;
  var m=(b.innerText||'').trim();
  t.value = t.value ? (t.value.replace(/\s+$/,'')+' · '+m) : m;
  t.style.borderStyle='solid';
  t.focus();
}

async function gravaCampo(i){
  var l=(D&&D.itens&&D.itens[i]); if(!l)return;
  var t=document.getElementById('tx'+i);
  var texto=t?String(t.value).trim():'';
  if(texto.length<3){ alert('Escreva o que aconteceu para poder fechar.'); return }
  try{ await porta('resolver_marcar',{tipo:l.tipo,chave:l.chave,unidade:l.unidade,dia:l.dia,o_que_foi_feito:texto}); }
  catch(e){ alert('Nao deu para fechar: '+(e&&e.message?e.message:'tente de novo')); return }
  boot();
}

async function reabrir(i){
  const l=(D&&D.itens&&D.itens[i]); if(!l)return;
  if(!confirm('Reabrir esta pendência?'))return;
  try{ await porta('resolver_marcar',{tipo:l.tipo,chave:l.chave,desfazer:true}); }
  catch(e){ alert('Não deu para reabrir: '+(e&&e.message?e.message:'tente de novo')); return }
  boot();
}

function linha(l,i){
  return '<tr><td style="white-space:nowrap">'+esc(l.quando||'')+'</td>'+
    '<td style="white-space:nowrap">'+esc(l.unidade||'')+'</td>'+
    '<td>'+esc(rotulo(l.tipo))+'<div class="m">'+esc(l.o_que_e||'')+'</div></td>'+
    '<td>'+esc(l.referencia||'')+
      ((l.fotos>0)?' <button class="mini" onclick="verFotos('+i+')">📷 '+l.fotos+(l.fotos>1?' fotos':' foto')+'</button>':'')+
      (l.tem_conversa?' <button class="mini" onclick="verConversa('+i+')">💬 conversa</button>':'')+
      ((l.n_conversas>1)?'<div style="margin-top:5px;color:var(--warn);font-size:12px">⚠️ '+l.n_conversas+' conversas com esse numero de pedido — nao da para saber qual e</div>':'')+
      (l.cliente_disse?'<div style="margin-top:5px;color:var(--brand);font-size:13px">“'+esc(l.cliente_disse)+'”</div>':'')+
      '<div class="m">'+esc(l.detalhe||'')+'</div></td>'+
    '<td style="white-space:nowrap">'+
      (l.resolvido
        ? '<span class="feito">✔ '+esc(l.quem||'')+'</span><div class="m">'+esc(l.resolvido_em||'')+' · '+esc(l.o_que_foi_feito||'')+'</div>'+
          '<button class="mini" style="margin-top:6px" onclick="reabrir('+i+')">reabrir</button>'
        : campoEscrita(l,i))+
    '</td></tr>';
}

function filtra(tp, ver){
  TIPO = tp;
  if(ver){ VER = ver }
  desenha();
  var el = document.getElementById('lista');
  if(el && el.scrollIntoView){ el.scrollIntoView({behavior:'smooth', block:'start'}) }
}

function cardF(rot, val, tp, ver, cor){
  var aceso = (tp === TIPO) && (!ver || ver === VER);
  return '<div class="card" onclick="filtra(&quot;'+tp+'&quot;,&quot;'+ver+'&quot;)"'+
         ' title="Clique para ver so isto" style="cursor:pointer'+(aceso?';border-color:var(--brand)':'')+'">'+
         '<div class="t">'+rot+'</div>'+
         '<div class="v"'+(cor?' style="color:'+cor+'"':'')+'>'+val+'</div></div>';
}

function desenha(){
  if(D===false){ $('app').innerHTML='<div class="c"><b>Não deu para carregar.</b><div class="m">Entre no portal de novo e tente outra vez.</div></div>'; return }
  if(!D){ $('app').innerHTML='<div class="load">Carregando…</div>'; return }
  const R=D.resumo||{}, itens=D.itens||[], card=D.cardapio||{};
  let h='<div class="cards">'+
    cardF('Esperando alguém',(R.abertas||0),'','abertas',((R.abertas||0)>0?'var(--bad)':'var(--ok)'))+
    cardF('Já resolvidas',(R.resolvidas||0),'','tudo','')+
    cardF('Cliente sem resposta',(R.chat||0),'chat','abertas','')+
    cardF('Reentrega',(R.reentrega||0),'reentrega','abertas','')+
    cardF('Negociação do iFood',(R.negociacao||0),'negociacao','abertas','')+
    cardF('Cancelado inteiro',(R.cancelamento||0),'cancelamento','abertas','')+
    cardF('Item cancelado',(R.parcial||0),'parcial','abertas','')+
    cardF('Maquininha',(R.maquininha||0),'maquininha','abertas','')+
    cardEsq()+
  '</div>';

  h+=esquecidos();

  h+=falaComigo();

  h+='<div class="fil"><span style="color:var(--muted);font-size:11px;font-weight:800;align-self:center">PERÍODO</span>'+
     '<button class="'+(DIAS===1?'on':'')+'" onclick="DIAS=1;boot()">Hoje</button>'+
     '<button class="'+(DIAS===2?'on':'')+'" onclick="DIAS=2;boot()">Hoje e ontem</button>'+
     '<button class="'+(DIAS===7?'on':'')+'" onclick="DIAS=7;boot()">7 dias</button>'+
     '<span style="color:var(--muted);font-size:11px;font-weight:800;align-self:center;margin-left:10px">LOJA</span>'+
     '<button class="'+(UNI===''?'on':'')+'" onclick="UNI=&quot;&quot;;boot()">Todas</button>'+
     '<button class="'+(UNI==='Água Verde'?'on':'')+'" onclick="UNI=&quot;Água Verde&quot;;boot()">Água Verde</button>'+
     '<button class="'+(UNI==='Ahú'?'on':'')+'" onclick="UNI=&quot;Ahú&quot;;boot()">Ahú</button>'+
     '<button class="'+(UNI==='São Braz'?'on':'')+'" onclick="UNI=&quot;São Braz&quot;;boot()">São Braz</button>'+
     '<span style="color:var(--muted);font-size:11px;font-weight:800;align-self:center;margin-left:10px">MOSTRAR</span>'+
     '<button class="'+(VER==='abertas'?'on':'')+'" onclick="VER=&quot;abertas&quot;;desenha()">Só o que falta</button>'+
     '<button class="'+(VER==='tudo'?'on':'')+'" onclick="VER=&quot;tudo&quot;;desenha()">Tudo, com o que já foi feito</button>'+
     '</div>'+
     '<div class="fil"><span style="color:var(--muted);font-size:11px;font-weight:800;align-self:center">ASSUNTO</span>'+
     '<button class="'+(TIPO===''?'on':'')+'" onclick="TIPO=&quot;&quot;;desenha()">Tudo</button>'+
     '<button class="'+(TIPO==='chat'?'on':'')+'" onclick="TIPO=&quot;chat&quot;;desenha()">💬 Cliente sem resposta</button>'+
     '<button class="'+(TIPO==='negociacao'?'on':'')+'" onclick="TIPO=&quot;negociacao&quot;;desenha()">🤝 Negociação</button>'+
     '<button class="'+(TIPO==='cancelamento'?'on':'')+'" onclick="TIPO=&quot;cancelamento&quot;;desenha()">🚫 Cancelado inteiro</button>'+
     '<button class="'+(TIPO==='parcial'?'on':'')+'" onclick="TIPO=&quot;parcial&quot;;desenha()">✂️ Item cancelado</button>'+
     '<button class="'+(TIPO==='reentrega'?'on':'')+'" onclick="TIPO=&quot;reentrega&quot;;desenha()">🔁 Reentrega</button>'+
     '<button class="'+(TIPO==='maquininha'?'on':'')+'" onclick="TIPO=&quot;maquininha&quot;;desenha()">🧾 Maquininha</button>'+
     '</div>';

  const porTipo = TIPO ? itens.filter(function(x){return x.tipo===TIPO}) : itens;
  const lista = (VER==='abertas') ? porTipo.filter(function(x){return !x.resolvido}) : porTipo;
  h+='<h2 id="lista">📋 A lista</h2>';
  if(!lista.length){
    h+='<div class="c"><div class="vazio">'+(VER==='abertas'?'Nada esperando ninguém neste período. A casa está limpa.':'Nada neste período.')+'</div></div>';
  }else{
    h+='<div class="c"><table><tr><th>Quando</th><th>Loja</th><th>O que é</th><th>Pedido</th><th>Situação</th></tr>';
    itens.forEach(function(l,i){ if(TIPO && l.tipo!==TIPO) return; if(VER==='tudo' || !l.resolvido) h+=linha(l,i); });
    h+='</table></div>';
  }

  if(D.maq_cache){
    h+='<div class="c" style="margin-top:10px"><div class="m">🧾 As comandas não cobradas da maquininha foram conferidas pela última vez em '+esc(D.maq_cache)+
       ((D.maq_horas!=null && D.maq_horas>26)?' — <b style="color:var(--bad)">isso está velho, o robô não rodou</b>':'')+
       '. Elas ficam na lista até alguém resolver, mesmo sendo de outro dia.</div></div>';
  }
  h+='<h2>📵 Fora do ar no cardápio</h2>'+
     '<div class="c"><b>'+(card.itens_fora_do_ar||0)+'</b> itens pausados ou escondidos'+
     (card.ate?' <span class="m" style="display:inline">· última varredura em '+esc(card.ate)+'</span>':'')+
     '<div class="m">Aqui não dá para resolver um por um: abra a tela do cardápio para ver e religar.</div></div>';

  $('app').innerHTML=h;
}

async function boot(){
  $('sub').textContent='carregando…';
  D=null; desenha();
  try{ D=await porta('resolver_hoje',{dias:DIAS,unidade:UNI||null}); }
  catch(e){ D=false; $('sub').textContent=(e&&e.message)||'erro'; desenha(); return }
  const R=D.resumo||{};
  $('sub').textContent='Cidadão do Mundo Burgers & Arts · '+(R.abertas||0)+' esperando alguém'+(UNI?' · '+UNI:'')+' · lido '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  desenha();
}
/* ===== porta unica do portal ===== */
const CDMMODS=['resolver'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'resolver'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
