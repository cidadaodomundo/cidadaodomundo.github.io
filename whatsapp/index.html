<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>O WhatsApp diz que… · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1100px;margin:0 auto}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06;font-size:22px}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:16px}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:16px;background:var(--s1);border:1px solid var(--line);border-radius:13px}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:10px}
.card .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card .res{font-size:15px;font-weight:600;margin:6px 0 4px}
.card .fx{font-size:12.5px;color:var(--text2)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--s2);color:var(--text2)}
.p-alta{background:rgba(47,174,106,.15);color:var(--ok)}
.p-media{background:rgba(201,133,0,.15);color:var(--warn)}
.p-baixa{background:rgba(138,137,126,.15);color:var(--muted)}
.p-tela{background:rgba(224,168,28,.13);color:var(--brand)}
.bts{margin-top:8px}
.bts button{margin:2px 6px 2px 0;padding:6px 12px;border-radius:8px;background:transparent;cursor:pointer;font-size:13px;font-weight:600}
.ok{border:1px solid #8fbf6a;color:#8fbf6a}
.nao{border:1px solid #9a9a9a;color:#b5b5b5}
@media (max-width:640px){body{padding-left:12px;padding-right:12px}h1{font-size:clamp(18px,6.2vw,26px);word-break:break-word}}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>💬 O WhatsApp diz que…</h1><div class="sub">o robô lê todas as conversas e sugere o que mudar no portal — nada muda sem alguém clicar Aceitar</div></div></div>
  <div class="rt"><button class="b" onclick="boot()">↻ Atualizar</button></div>
</div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
/* 01/10/2026 (obra 98, chat-leitor-geral-01-10): lista das sugestoes do leitor geral do WhatsApp.
   Tudo passa pela porta central_sugestao_porta (exige login). A porta ja esconde conversa privada,
   agenda pessoal e regra da casa de quem nao e o dono, RH de quem nao tem RH e contas de quem nao tem Contas. */
const TELA={manutencao:'Manutenção',compras_ml:'Compras ML',encomenda:'Encomenda',precisa_resposta:'Precisa de Resposta',
  tarefa_fabio:'Tarefa do Fábio',agenda_pessoal:'Agenda pessoal',rh:'RH',escala_motoboy:'Escala motoboy',
  fechamento_motoboy:'Fechamento motoboy',cardapio_pausado:'Cardápio pausado',contas_pagar:'Contas a pagar',
  fornecedor_insumo:'Fornecedor',cliente_reclamacao:'Reclamação de cliente',entrega_problema:'Problema de entrega',
  regra_da_casa:'Regra da casa',sistema_com_defeito:'Sistema com defeito',vigilancia_sanitaria:'Vigilância / nutri'};
const LOJA={agua_verde:'Água Verde',ahu:'Ahú',sao_braz:'São Braz'};
const ACAO={fechar:'diz que já foi resolvido',atualizar:'traz novidade',abrir:'assunto novo',anotar:'para saber'};
let DADOS=[],FILTRO='',TELAS=[],VERBAIXA=false;
async function porta(a,d){
  const r=await fetch(SB+'rpc/central_sugestao_porta',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:cdmTok(),p_acao:a,p_dados:d||{}})});
  if(!r.ok){let m='não deu certo';try{const j=await r.json();if(j&&j.message)m=j.message}catch(e){}throw new Error(m)}
  return await r.json();
}
function efeito(s){
  const NOME={M:'Manutenção',P:'Precisa de Resposta',T:'Minha Agenda',E:'Encomendas'};
  if((s.acao==='fechar'||s.acao==='atualizar')&&/^[MPTE][0-9]+$/.test(String(s.codigo||''))){
    const onde=NOME[s.codigo.charAt(0)]||'';
    return (s.acao==='fechar'?'Aceitar fecha o item ':'Aceitar anota no item ')+s.codigo+' de '+onde+'.';
  }
  if(s.acao==='abrir'&&s.tela==='manutencao')return 'Aceitar abre um chamado em Manutenção.';
  if(s.acao==='abrir'&&['precisa_resposta','cliente_reclamacao','entrega_problema','sistema_com_defeito'].indexOf(s.tela)>=0)return 'Aceitar abre em Precisa de Resposta.';
  if((s.tela==='tarefa_fabio'&&s.acao==='abrir')||s.tela==='agenda_pessoal')return 'Aceitar põe na Minha Agenda'+(s.tela==='agenda_pessoal'?' (pessoal)':'')+'.';
  return 'Aceitar só marca como visto — esta tela do portal ainda não recebe sozinha.';
}
async function faz(a,id,btn){
  try{btn.disabled=true;const j=await porta(a,{id:id});
    DADOS=DADOS.filter(x=>x.id!==id);desenha();
    const d=$('erro');
    if(a==='aceitar'&&j&&j.efeito&&d){d.style.color='#8fbf6a';d.textContent='Feito: '+j.efeito+'.';d.style.display='block'}}
  catch(e){btn.disabled=false;const d=$('erro');if(d){d.style.color='#e0645c';d.textContent='Não consegui gravar: '+e.message;d.style.display='block'}}
}
function filtra(i){const t=(i<0?'':TELAS[i]);FILTRO=(FILTRO===t?'':t);desenha()}
function trocaBaixa(){VERBAIXA=!VERBAIXA;FILTRO='';desenha()}
function desenha(){
  const VIS=DADOS.filter(s=>VERBAIXA||s.certeza!=='baixa');const nBaixa=DADOS.filter(s=>s.certeza==='baixa').length;
  const cont={};VIS.forEach(s=>{cont[s.tela]=(cont[s.tela]||0)+1});
  let h='<div id="erro" style="display:none;margin:8px 0"></div>';
  h+='<div class="aviso">Período de teste: <b>Aceitar</b> faz a mudança no portal; <b>Não é isso</b> descarta. Cada clique ensina quanto o robô acerta.</div>';
  if(nBaixa)h+='<div class="chips"><span class="chip'+(VERBAIXA?' on':'')+'" onclick="trocaBaixa()">'+(VERBAIXA?'Esconder as de certeza baixa':'Ver também as de certeza baixa')+' ('+nBaixa+')</span></div>';
  if(!VIS.length){$('app').innerHTML=h+'<div class="vazio">Nenhuma sugestão esperando. O robô lê o WhatsApp sozinho; o que ele achar aparece aqui.</div>';return}
  h+='<div class="chips"><span class="chip'+(FILTRO?'':' on')+'" onclick="filtra(-1)">Todas ('+VIS.length+')</span>';
  TELAS=Object.keys(cont).sort((a,b)=>cont[b]-cont[a]);
  TELAS.forEach((t,i)=>{
    h+='<span class="chip'+(FILTRO===t?' on':'')+'" onclick="filtra('+i+')">'+esc(TELA[t]||t)+' ('+cont[t]+')</span>';
  });
  h+='</div>';
  VIS.filter(s=>!FILTRO||s.tela===FILTRO).forEach(s=>{
    h+='<div class="card"><div class="l1"><span>'+esc(s.quando||'')+'</span><span>·</span><span>'+esc(s.de||'')+'</span>'+
      (s.loja?'<span>·</span><span>'+esc(LOJA[s.loja]||s.loja)+'</span>':'')+
      '<span class="pill p-tela">'+esc(TELA[s.tela]||s.tela)+'</span>'+
      '<span class="pill">'+esc(ACAO[s.acao]||s.acao)+'</span>'+
      '<span class="pill p-'+esc(s.certeza||'baixa')+'">certeza '+esc(s.certeza||'baixa')+'</span></div>'+
      '<div class="res">'+esc(s.resumo)+'</div><div class="fx">'+esc(efeito(s))+'</div>'+
      '<div class="bts"><button class="ok" onclick="faz(\'aceitar\','+Number(s.id)+',this)">✓ Aceitar</button>'+
      '<button class="nao" onclick="faz(\'recusar\','+Number(s.id)+',this)">✕ Não é isso</button></div></div>';
  });
  $('app').innerHTML=h;
}
async function boot(){
  try{const j=await porta('listar');DADOS=Array.isArray(j)?j:[];desenha()}
  catch(e){$('app').innerHTML='<div class="vazio">Não consegui carregar: '+esc(e.message)+'</div>'}
}

/* ===== porta unica do portal ===== */
const CDMMODS=['whatsapp'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'whatsapp'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
