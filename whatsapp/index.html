<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1100px;margin:0 auto}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06;font-size:22px}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:16px}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:16px;background:var(--s1);border:1px solid var(--line);border-radius:13px}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:10px}
.card .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card .res{font-size:15px;font-weight:600;margin:6px 0 4px}
.card .fx{font-size:12.5px;color:var(--text2)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--s2);color:var(--text2)}
.p-alta{background:rgba(47,174,106,.15);color:var(--ok)}
.p-media{background:rgba(201,133,0,.15);color:var(--warn)}
.p-baixa{background:rgba(138,137,126,.15);color:var(--muted)}
.p-tela{background:rgba(224,168,28,.13);color:var(--brand)}
.bts{margin-top:8px}
.bts button{margin:2px 6px 2px 0;padding:6px 12px;border-radius:8px;background:transparent;cursor:pointer;font-size:13px;font-weight:600}
.ok{border:1px solid #8fbf6a;color:#8fbf6a}
.nao{border:1px solid #9a9a9a;color:#b5b5b5}
.resumo{display:flex;gap:14px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:12px 16px;margin:4px 0 12px}
.resumo .big{font-family:'Anton',Impact,'Arial Black',sans-serif;font-size:38px;line-height:1;color:var(--brand)}
.resumo span{color:var(--muted);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
.tile .n{font-family:'Anton',Impact,'Arial Black',sans-serif;font-size:22px;line-height:1.1}
.tile .t{font-size:12.5px;color:var(--text2);font-weight:600}
.tile .m{font-size:11px;color:var(--muted)}
.tile.on{border-color:var(--brand);background:#1f1c14}
.tile.on .n{color:var(--brand)}
button.mais{background:transparent;border:0;color:var(--brand);font-size:12.5px;font-weight:700;cursor:pointer;padding:2px 0;margin:2px 0 4px}
.outras{border-left:2px solid var(--line);margin:4px 0 6px 2px;padding-left:10px}
.outra{font-size:12.5px;color:var(--text2);margin:5px 0}
.outra b{color:var(--muted);font-weight:600;margin-right:6px}
.outra .pill{margin-right:4px}
.card.saber{opacity:.85}
.sec{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-size:14px;margin:18px 0 8px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}.resumo .big{font-size:32px}}
@media (max-width:640px){body{padding-left:12px;padding-right:12px}h1{font-size:clamp(18px,6.2vw,26px);word-break:break-word}}
</style>

<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>💬 O WhatsApp diz que…</h1><div class="sub">o robô lê todas as conversas e sugere o que mudar no portal — nada muda sem alguém clicar Aceitar</div></div></div>
  <div class="rt"><button class="b" onclick="boot()">↻ Atualizar</button></div>
</div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
/* 01/10/2026 (obra 98, chat-leitor-geral-01-10): lista das sugestoes do leitor geral do WhatsApp.
   Tudo passa pela porta central_sugestao_porta (exige login). A porta ja esconde conversa privada,
   agenda pessoal e regra da casa de quem nao e o dono, RH de quem nao tem RH e contas de quem nao tem Contas. */
const TELA={manutencao:'Manutenção',compras_ml:'Compras ML',encomenda:'Encomenda',precisa_resposta:'Precisa de Resposta',
  tarefa_fabio:'Tarefa do Fábio',agenda_pessoal:'Agenda pessoal',rh:'RH',escala_motoboy:'Escala motoboy',
  fechamento_motoboy:'Fechamento motoboy',cardapio_pausado:'Cardápio pausado',contas_pagar:'Contas a pagar',
  fornecedor_insumo:'Fornecedor',cliente_reclamacao:'Reclamação de cliente',entrega_problema:'Problema de entrega',
  regra_da_casa:'Regra da casa',sistema_com_defeito:'Sistema com defeito',vigilancia_sanitaria:'Vigilância / nutri'};
const LOJA={agua_verde:'Água Verde',ahu:'Ahú',sao_braz:'São Braz'};
const ACAO={fechar:'diz que já foi resolvido',atualizar:'traz novidade',abrir:'assunto novo',anotar:'para saber'};
/* 03/10/2026 (obra 98, chat-simplificar-whatsapp-03-10): pedido do Fabio "temos que simplificar esse negocio aqui".
   Cartoes juntados por conversa + assunto + dia (acao listar_grupos da porta); primeiro so o que pede acao;
   os "para saber" e os de certeza baixa ficam atras de um botao; resumo no topo por assunto.
   Aceitar / Nao e isso vale para o cartao inteiro (aceitar_grupo / recusar_grupo). Nada e apagado. */
let G=[],SABER=null,CONTAS={},FILTRO='',TELAS=[],VERBAIXA=false,VERSABER=false,ABERTO={},CARREGANDO=false;
/* 08/10/2026 (decisao do Fabio, "faca tudo"): a tela abre em modo "so excecoes". Ficam ESCONDIDOS (nao recusados,
   nada muda no banco) os cartoes do chat do iFood (a conversa vai junto do pedido no Turno e no Resolver hoje) e os
   assuntos que ja tem tela propria: cardapio pausado, encomenda, compras ML, fornecedor, fechamento e escala de
   motoboy, e manutencao / agenda pessoal vindos de grupo. "Ver tudo" mostra de novo.
   10/10/2026: problema de entrega e sistema com defeito NAO se escondem (Fabio: "tem que aparecer as conversas qdo tem
   pedidos cancelados, problemas etc"; os que vem de grupo e da conversa dele nao aparecem em outra tela).
   A porta nao manda a fonte: vem do nome da conversa (iFood = "Chat iFood ...", SAC = "SAC ...", wpp = "LOJA ...",
   conversa do Fabio = pessoal, o resto = grupo; conferido 100% em central_sugestao desde 25/09). */
let VERTUDO=false;
const ESCONDE_TELA=['cardapio_pausado','encomenda','compras_ml','fornecedor_insumo','fechamento_motoboy','escala_motoboy'];
function fonteDe(g){if(g.fonte)return g.fonte;const d=String(g.de||'');
  return d==='conversa do Fábio'?'pessoal':/^Chat iFood/.test(d)?'ifood':/^SAC /.test(d)?'sac':/^LOJA /.test(d)?'wpp':'grupo'}
function escondido(g){const f=fonteDe(g);return f==='ifood'||ESCONDE_TELA.indexOf(g.tela)>=0||(f==='grupo'&&(g.tela==='manutencao'||g.tela==='agenda_pessoal'))}
function trocaTudo(){VERTUDO=!VERTUDO;FILTRO='';desenha()}
async function porta(a,d){
  const r=await fetch(SB+'rpc/central_sugestao_porta',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:cdmTok(),p_acao:a,p_dados:d||{}})});
  if(!r.ok){let m='não deu certo';try{const j=await r.json();if(j&&j.message)m=j.message}catch(e){}throw new Error(m)}
  return await r.json();
}
function efeito(s){
  const NOME={M:'Manutenção',P:'Precisa de Resposta',T:'Minha Agenda',E:'Encomendas'};
  if((s.acao==='fechar'||s.acao==='atualizar')&&/^[MPTE][0-9]+$/.test(String(s.codigo||''))){
    const onde=NOME[s.codigo.charAt(0)]||'';
    return (s.acao==='fechar'?'Aceitar fecha o item ':'Aceitar anota no item ')+s.codigo+' de '+onde+'.';
  }
  if(s.acao==='abrir'&&s.tela==='manutencao')return 'Aceitar abre um chamado em Manutenção.';
  if(s.acao==='abrir'&&['precisa_resposta','cliente_reclamacao','entrega_problema','sistema_com_defeito'].indexOf(s.tela)>=0)return 'Aceitar abre em Precisa de Resposta.';
  if((s.tela==='tarefa_fabio'&&s.acao==='abrir')||s.tela==='agenda_pessoal')return 'Aceitar põe na Minha Agenda'+(s.tela==='agenda_pessoal'?' (pessoal)':'')+'.';
  if(s.tela==='rh')return 'Aceitar manda para a Caixa do RH.'; /* 08/10/2026: Aceitar de RH cria item na Caixa do RH (central_sugestao_porta) */
  return 'Aceitar só marca como visto — esta tela do portal ainda não recebe sozinha.';
}
function efeitoGrupo(g){
  const it=g.itens||[],vistos={},fr=[];
  it.forEach(s=>{const f=efeito(s);if(f.indexOf('só marca como visto')>=0)return;if(!vistos[f]){vistos[f]=1;fr.push(f)}});
  let t=fr.length?fr.join(' '):'Aceitar só marca como visto — esta tela do portal ainda não recebe sozinha.';
  const ab=it.filter(s=>!((s.acao==='fechar'||s.acao==='atualizar')&&s.codigo)&&(s.acao==='abrir'||s.tela==='agenda_pessoal'||s.tela==='rh')&&efeito(s).indexOf('só marca')<0).length;
  if(ab>1)t+=' Vira um item só, com os '+ab+' pedidos escritos dentro.';
  if(it.length>1)t+=' As '+it.length+' mensagens do cartão saem da lista juntas.';
  if(g.tela==='rh'&&fonteDe(g)==='pessoal'&&t.indexOf('Caixa do RH')>=0)t+=' Atenção: o RH vai ler o resumo desta conversa sua.';
  return t;
}
function chave(g){return Number((g&&g.itens&&g.itens[0]&&g.itens[0].id)||0)}
function acha(k){return G.concat(SABER||[]).find(g=>chave(g)===k)}
function tiraConta(g){
  const C=CONTAS||{},n=g.n||(g.itens||[]).length;
  if(!g.pede){C.saber_grupos=Math.max(0,(C.saber_grupos||0)-1);C.saber_msgs=Math.max(0,(C.saber_msgs||0)-n)}
  else if(g.certeza==='baixa'){C.baixa_grupos=Math.max(0,(C.baixa_grupos||0)-1);C.baixa_msgs=Math.max(0,(C.baixa_msgs||0)-n)}
  else{C.acao_grupos=Math.max(0,(C.acao_grupos||0)-1);C.acao_msgs=Math.max(0,(C.acao_msgs||0)-n)}
}
async function faz(a,k,btn){
  const g=acha(k);if(!g)return;
  try{btn.disabled=true;
    const j=await porta(a==='aceitar'?'aceitar_grupo':'recusar_grupo',{ids:(g.itens||[]).map(s=>Number(s.id))});
    G=G.filter(x=>chave(x)!==k);if(SABER)SABER=SABER.filter(x=>chave(x)!==k);
    tiraConta(g);desenha();
    const d=$('erro');
    if(d){d.style.color='#8fbf6a';d.textContent=(a==='aceitar'?'Feito: '+((j&&j.efeito)||'marcado como visto'):'Descartado')+' ('+((j&&j.n)||(g.itens||[]).length)+' mensagens).';d.style.display='block'}}
  catch(e){btn.disabled=false;const d=$('erro');if(d){d.style.color='#e0645c';d.textContent='Não consegui gravar: '+e.message;d.style.display='block'}}
}
function filtra(i){const t=(i<0?'':TELAS[i]);FILTRO=(FILTRO===t?'':t);desenha()}
function trocaBaixa(){VERBAIXA=!VERBAIXA;FILTRO='';desenha()}
async function trocaSaber(){
  if(CARREGANDO)return;
  VERSABER=!VERSABER;FILTRO='';
  if(VERSABER&&SABER===null){
    CARREGANDO=true;desenha();
    try{const j=await porta('listar_grupos',{ver:'saber'});SABER=(j&&Array.isArray(j.grupos))?j.grupos:[]}
    catch(e){VERSABER=false;CARREGANDO=false;desenha();const d=$('erro');if(d){d.style.color='#e0645c';d.textContent='Não consegui carregar os “para saber”: '+e.message;d.style.display='block'}return}
    CARREGANDO=false;
  }
  desenha();
}
function abre(k){ABERTO[k]=!ABERTO[k];desenha()}
function cartao(g){
  const k=chave(g),it=g.itens||[],p=it[0]||{},mais=it.length-1;
  let h='<div class="card'+(g.pede?'':' saber')+'"><div class="l1"><span>'+esc(g.quando||'')+'</span><span>·</span><span>'+esc(g.de||'')+'</span>'+
    (g.loja?'<span>·</span><span>'+esc(LOJA[g.loja]||g.loja)+'</span>':'')+
    '<span class="pill p-tela">'+esc(TELA[g.tela]||g.tela)+'</span>'+
    '<span class="pill">'+esc(ACAO[p.acao]||p.acao||'')+'</span>'+
    '<span class="pill p-'+esc(g.certeza||'baixa')+'">certeza '+esc(g.certeza||'baixa')+'</span></div>'+
    '<div class="res">'+esc(p.resumo)+'</div>';
  if(mais>0){
    h+='<button class="mais" onclick="abre('+k+')">'+(ABERTO[k]?'▾ esconder as outras':'▸ +'+mais+(mais>1?' mensagens':' mensagem'))+'</button>';
    if(ABERTO[k]){
      h+='<div class="outras">';
      it.slice(1).forEach(s=>{h+='<div class="outra"><b>'+esc(s.hora||'')+'</b><span class="pill">'+esc(ACAO[s.acao]||s.acao||'')+'</span> '+esc(s.resumo)+'</div>'});
      h+='</div>';
    }
  }
  h+='<div class="fx">'+esc(efeitoGrupo(g))+'</div>'+
    '<div class="bts"><button class="ok" onclick="faz(\'aceitar\','+k+',this)">✓ Aceitar</button>'+
    '<button class="nao" onclick="faz(\'recusar\','+k+',this)">✕ Não é isso</button></div></div>';
  return h;
}
function desenha(){
  /* 08/10/2026: modo "so excecoes" (ver VERTUDO); nEsc = quantos cartoes desta vista estao escondidos */
  const okX=g=>VERTUDO||!escondido(g);
  const bAcao=G.filter(g=>VERBAIXA||g.certeza!=='baixa');
  const bSaber=(VERSABER&&SABER)?SABER:[];
  const vAcao=bAcao.filter(okX),vSaber=bSaber.filter(okX);
  const nEsc=bAcao.concat(bSaber).filter(escondido).length;
  const todos=vAcao.concat(vSaber),C=CONTAS||{};
  const cont={},msgs={};
  todos.forEach(g=>{const n=g.n||(g.itens||[]).length;cont[g.tela]=(cont[g.tela]||0)+1;msgs[g.tela]=(msgs[g.tela]||0)+n});
  const nMsg=vAcao.reduce((a,g)=>a+(g.n||(g.itens||[]).length),0);
  let h='<div id="erro" style="display:none;margin:8px 0"></div>';
  h+='<div class="resumo"><div class="big">'+vAcao.length+'</div><div><b>'+(vAcao.length===1?'cartão pede você':'cartões pedem você')+'</b><br><span>'+nMsg+' mensage'+(nMsg===1?'m':'ns')+' do WhatsApp, juntadas por conversa, assunto e dia</span></div></div>';
  TELAS=Object.keys(cont).sort((a,b)=>cont[b]-cont[a]);
  if(TELAS.length){
    h+='<div class="tiles"><div class="tile'+(FILTRO?'':' on')+'" onclick="filtra(-1)"><div class="n">'+todos.length+'</div><div class="t">Todos os assuntos</div></div>';
    TELAS.forEach((t,i)=>{h+='<div class="tile'+(FILTRO===t?' on':'')+'" onclick="filtra('+i+')"><div class="n">'+cont[t]+'</div><div class="t">'+esc(TELA[t]||t)+'</div><div class="m">'+msgs[t]+(msgs[t]===1?' mensagem':' mensagens')+'</div></div>'});
    h+='</div>';
  }
  h+='<div class="chips">';
  if(nEsc>0)h+='<span class="chip'+(VERTUDO?' on':'')+'" onclick="trocaTudo()">'+(VERTUDO?'Só as exceções (esconder '+nEsc+')':'Ver tudo ('+nEsc+(nEsc===1?' escondido)':' escondidos)'))+'</span>';
  /* 08/10/2026: contagens sem os escondidos; os "para saber" ainda nao carregados mostram o total da porta ("até") */
  const sV=SABER?SABER.filter(okX):null,sAte=(!sV&&!VERTUDO)?'até ':'';
  const sG=sV?sV.length:(C.saber_grupos||0),sM=sV?sV.reduce((a,g)=>a+(g.n||(g.itens||[]).length),0):(C.saber_msgs||0);
  const bx=G.filter(g=>g.certeza==='baixa'&&okX(g)).length;
  /* os botoes aparecem pelo total (com os escondidos), para nenhum escondido ficar sem caminho ate o "Ver tudo" */
  const sT=SABER?SABER.length:(C.saber_grupos||0),bxT=G.filter(g=>g.certeza==='baixa').length;
  if(sT>0||VERSABER)h+='<span class="chip'+(VERSABER?' on':'')+'" onclick="trocaSaber()">'+(CARREGANDO?'Carregando…':(VERSABER?'Esconder os “para saber”':'Ver também os “para saber”'))+' ('+sAte+sG+(sG===1?' cartão · ':' cartões · ')+sM+(sM===1?' mensagem)':' mensagens)')+'</span>';
  if(bxT>0)h+='<span class="chip'+(VERBAIXA?' on':'')+'" onclick="trocaBaixa()">'+(VERBAIXA?'Esconder os de certeza baixa':'Ver também os de certeza baixa')+' ('+bx+')</span>';
  h+='</div>';
  h+='<div class="aviso">Cada cartão junta as mensagens da mesma conversa, do mesmo assunto e do mesmo dia. <b>Aceitar</b> ou <b>Não é isso</b> vale para o cartão inteiro.'+(VERTUDO?'':' Mostrando <b>só as exceções</b>: chat do iFood e assuntos que já têm tela própria ficam escondidos (não foram recusados).')+'</div>';
  const fil=g=>!FILTRO||g.tela===FILTRO;
  const la=vAcao.filter(fil),ls=vSaber.filter(fil);
  if(!la.length&&!ls.length)h+='<div class="vazio">'+(FILTRO?'Nada neste assunto.':(!VERTUDO&&nEsc?'Nenhuma exceção pedindo você agora. Os outros '+nEsc+' estão em “Ver tudo”.':'Nenhum cartão pedindo você agora. O robô lê o WhatsApp sozinho; o que ele achar aparece aqui.'))+'</div>';
  la.forEach(g=>{h+=cartao(g)});
  if(ls.length){h+='<div class="sec">Só para saber</div>';ls.forEach(g=>{h+=cartao(g)})}
  $('app').innerHTML=h;
}
async function boot(){
  try{const j=await porta('listar_grupos',{ver:'acao'});G=(j&&Array.isArray(j.grupos))?j.grupos:[];CONTAS=(j&&j.contas)||{};desenha()}
  catch(e){$('app').innerHTML='<div class="vazio">Não consegui carregar: '+esc(e.message)+'</div>'}
}
/* ===== porta unica do portal ===== */
const CDMMODS=['whatsapp'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'whatsapp'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
