<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Encomendas Grandes · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e;--ok:#2fae6a;--bad:#e66767;--warn:#c98500;--gold:#e0a81c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:12px}
.c.perto{border-color:var(--gold)}
.c .quando{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--gold)}
.c .desc{font-size:16px;font-weight:800;margin:6px 0 4px}
.c .info{color:var(--text2);font-size:13px;line-height:1.5}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-ano{background:rgba(230,103,103,.15);color:var(--bad)}
.p-con{background:rgba(201,133,0,.15);color:var(--warn)}
.p-pro{background:rgba(47,174,106,.15);color:var(--ok)}
.p-ent{background:rgba(138,137,126,.15);color:var(--muted)}
.m{color:var(--muted);font-size:11.5px;margin-top:8px}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:16px;background:var(--s1);border:1px solid var(--line);border-radius:13px}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:16px}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:16px}
details{margin-top:16px}
summary{cursor:pointer;color:var(--text2);font-size:13px;font-weight:600;padding:6px 0}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>📦 Encomendas Grandes</h1><div class="sub">pedidos grandes com data marcada — para nenhum ficar sem dono</div></div></div>
  <div class="rt"><button class="b" onclick="location.reload()">↻ Atualizar</button></div>
</div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=i=>document.getElementById(i);
let SOLOJA=null;try{const _u=new URLSearchParams(location.search).get('u');if(_u)SOLOJA=_u}catch(e){}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const br=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
function hojeISO(){return new Date().toLocaleDateString('sv-SE')}
function faltam(d){const n=Math.round((new Date(d+'T00:00:00')-new Date(hojeISO()+'T00:00:00'))/86400000);
  return n<0?'passou há '+(-n)+' dia'+(n<-1?'s':''):(n===0?'É HOJE':(n===1?'é amanhã':'faltam '+n+' dias'))}
async function get(q){try{const r=await fetch(SB+q,{headers:H});return r.ok?await r.json():[]}catch(e){return []}}
const ST={anotada:['anotada — SEM DONO','p-ano'],confirmada:['confirmada','p-con'],em_producao:['em produção','p-pro'],entregue:['entregue','p-ent'],cancelada:['cancelada','p-ent']};

async function boot(){
  const d0=new Date();d0.setDate(d0.getDate()-14);
  const rows=await get('encomenda?select=id,unidade,data_entrega,hora,descricao,qtd_itens,status,responsavel,origem,criado_em,obs&data_entrega=gte.'+d0.toLocaleDateString('sv-SE')+'&order=data_entrega.asc&limit=100');
  try{if((function(){try{return sessionStorage.getItem("cdm_admin")==="1"}catch(e){return false}})()){const _r=await fetch(SB+'rpc/dinheiro_consulta',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({p_token:cdmTok(),p_acao:'encomenda'})});if(_r.ok){const _m=(await _r.json())||[];const _k={};_m.forEach(function(x){_k[x.id]=x.valor});rows.forEach(function(r){if(_k[r.id]!=null)r.valor=_k[r.id]})}}}catch(e){}
const rowsF=SOLOJA?rows.filter(function(r){return r.unidade===SOLOJA}):rows;
  const futuras=rowsF.filter(r=>r.status!=='entregue'&&r.status!=='cancelada'&&r.data_entrega>=hojeISO());
  const passadas=rowsF.filter(r=>!futuras.includes(r));
  let h='';
  if(!futuras.length){h+='<div class="vazio">nenhuma encomenda futura anotada</div>'}
  futuras.forEach(r=>{
    const s=ST[r.status]||ST.anotada;
    const dias=Math.round((new Date(r.data_entrega+'T00:00:00')-new Date(hojeISO()+'T00:00:00'))/86400000);
    h+='<div class="c'+(dias<=2?' perto':'')+'"><div class="quando">'+faltam(r.data_entrega)+' · '+br(r.data_entrega)+(r.hora?' às '+String(r.hora).slice(0,5):'')+'</div>'+
       '<div class="desc">'+esc(r.descricao)+'</div>'+
       '<div class="info">'+esc(r.unidade)+(r.qtd_itens?' · '+r.qtd_itens+' itens':'')+((r.valor&&(function(){try{return sessionStorage.getItem("cdm_admin")==="1"}catch(e){return false}})())?' · R$ '+Number(r.valor).toLocaleString('pt-BR'):'')+
       ' · <span class="pill '+s[1]+'">'+s[0]+'</span>'+(r.responsavel?' · responsável: <b>'+esc(r.responsavel)+'</b>':'')+'</div>'+
       (r.obs?'<div class="m">'+esc(r.obs)+'</div>':'')+
       '<div class="m">anotada em '+br(r.criado_em)+' · veio do '+esc(r.origem)+'</div></div>';
  });
  if(passadas.length){
    h+='<details><summary>histórico recente ('+passadas.length+')</summary>';
    passadas.forEach(r=>{const s=ST[r.status]||ST.anotada;
      h+='<div class="c"><div class="desc" style="font-size:14px">'+esc(r.descricao)+'</div><div class="info">'+br(r.data_entrega)+' · '+esc(r.unidade)+' · <span class="pill '+s[1]+'">'+s[0]+'</span></div></div>'});
    h+='</details>';
  }
  h+='<div class="aviso">Encomenda SEM DONO em vermelho precisa de um responsável. Tela alimentada pela varredura do WhatsApp (12h e 20h); contato do cliente fica guardado fora da tela.</div>';
  $('app').innerHTML=h;
}

/* ===== porta unica do portal ===== */
const CDMMODS=['encomendas','encomendassb'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:(new URLSearchParams(location.search).get('u')?'encomendassb':'encomendas')})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
