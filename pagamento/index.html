<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Pagamento dos Motoboys · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1480px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.top .rt{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
button.b:hover{border-color:var(--brand)}
button.b.on{border-color:var(--brand);color:#fff}
input[type=date]{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 9px;font-size:13px}
.rel{color:var(--muted);font-size:12px}
.per{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:16px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.kpi .k{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.kpi .v{font-size:23px;font-weight:800;margin-top:3px}
.kpi .d{color:var(--muted);font-size:11.5px;margin-top:2px}
.kpi.g .v{color:var(--ok)}
.kpi.w .v{color:var(--warn)}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-bottom-color:var(--brand)}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:9px}
.lin{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nm{font-weight:800;font-size:16px;flex:1;min-width:150px}
.vl{font-size:19px;font-weight:800;color:var(--ok);white-space:nowrap}
.det{color:var(--muted);font-size:12.5px;margin-top:5px}
.pix{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--s2);border-radius:9px;padding:7px 10px;font-size:13px}
.pix code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text2);word-break:break-all}
.avisos{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;background:var(--s2);color:var(--text2)}
.pill.bad{background:rgba(230,103,103,.16);color:#f0a0a0}
.pill.warn{background:rgba(201,133,0,.18);color:#e8bb62}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.kpis{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:9px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:11px 15px;min-width:120px;flex:1 1 auto}
.kpi .n{font-size:21px;font-weight:800;line-height:1.15}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.3px;margin-top:3px}
.kpi.big .n{font-size:26px;color:#4ade80}
.kpi.warn .n{color:#f87171}
tbody tr.par td{background:rgba(255,255,255,.02)}
td.money{text-align:right;font-variant-numeric:tabular-nums}
th.money{text-align:right}
td.pagar{text-align:right;font-size:15px;font-weight:800;background:rgba(74,222,128,.09);border-left:2px solid rgba(74,222,128,.35)}
td.grupo{border-left:1px solid var(--line)}
th.grupo{border-left:1px solid var(--line)}
tr.obs td{background:rgba(251,191,36,.06);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;padding:5px 9px 9px 9px;white-space:normal;line-height:1.55}
table.enxuta{min-width:0}
table.enxuta td,table.enxuta th{padding:6px 7px}
td.nome{white-space:normal;min-width:120px;max-width:190px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase}
td.num,th.num{text-align:right}
tr.aviso td{color:#e8bb62}
.hs{color:var(--muted);font-size:12px;margin:10px 0;line-height:1.5}
.faixa{background:rgba(201,133,0,.14);border:1px solid rgba(201,133,0,.4);border-radius:11px;padding:11px 14px;font-size:13px;line-height:1.55;margin-bottom:16px}
.empty{color:var(--muted);padding:16px 0}
</style>
</head>
<body>
<div class="top">
  <div><h1>💰 Pagamento dos Motoboys</h1><div class="sub">quanto pagar a cada um, com a chave PIX do lado — esta tela é só sua e da Hellen</div></div>
  <div class="rt"><span class="rel" id="rel"></span><button class="b" onclick="carrega()">🔄 Atualizar</button></div>
</div>

<div class="per">
  <button class="b" id="p_sem" onclick="rapido('sem')">Últimos 7 dias</button>
  <button class="b" id="p_ant" onclick="rapido('ant')">Semana passada (seg a dom)</button>
  <button class="b" id="p_mes" onclick="rapido('mes')">Últimos 30 dias</button>
  <input type="date" id="de"> <span class="rel">até</span> <input type="date" id="ate">
  <button class="b" onclick="rapido('')">ver</button>
</div>

<div id="faixa"></div>
<div id="kpis"></div>

<div class="tabs">
  <span class="tab on" id="t_pag" onclick="setView('pag')">💵 Pagamento do dia anterior</span>
  <span class="tab" id="t_ag" onclick="setView('ag')">🔴 Agora, ao vivo</span>
  <span class="tab" id="t_maq" onclick="setView('maq')">🧾 Maquininha do dia</span>
  <span class="tab" id="t_cmp" onclick="setView('cmp')">⚖️ Nossa × a do grupo</span>
  <span class="tab" id="t_reg" onclick="setView('reg')">📜 As regras</span>
</div>

<div id="conteudo"><div class="empty">Carregando…</div></div>



<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const REGRAS_HTML='<div class="c"><h3 style="margin:0 0 12px;font-size:16px">📜 Como a conta do motoboy é feita</h3>'+
'<div class="hs" style="margin:0"><b>O valor da hora, nas três lojas:</b> <b>R$ 20 por hora</b> de segunda a sexta e <b>R$ 25</b> sábado e domingo. Acabaram as diárias de São Braz e do Ahú — o valor por hora já vinha sendo usado há alguns meses; o que mudou foi passar a valer nas três lojas e a hora ser contada pelo GPS. A hora conta da <b>chegada no pátio pelo GPS</b> até a <b>hora da última entrega</b>. Paga-se o <b>maior</b> entre as taxas e o piso por hora — nunca a soma.<br><br>'+
'<b>Almoço:</b> uma refeição por turno cumprido. Quem chega <b>mais de 30 minutos</b> depois do horário combinado (a escala do Jaison) perde a refeição daquele turno e o piso garantido do dia inteiro — e, se mesmo assim pegou o lanche, <b>paga por ele</b> pelo preço de cardápio.<br><br>'+
'🔴 <b>Só se corta com prova:</b> sem carimbo de GPS do pátio o atraso não está provado e <b>nada é cortado nem cobrado</b> — a linha mostra um sinal de alerta avisando que a chegada foi estimada.<br><br>'+
'<b>Entregas</b> é a contagem que gerou taxa — é o que sustenta o valor a pagar, e <b>não</b> é a medida de quantas entregas a loja fez no dia. Para volume, olhe a Qualidade do Delivery. Qualquer outro ajuste é decisão sua, na mão.</div></div>'+
'<div class="c"><h3 style="margin:0 0 12px;font-size:16px">📋 O que cada coluna quer dizer</h3><div class="wrap"><table>'+
'<tr><th>Coluna</th><th>O que é</th></tr>'+
'<tr><td><b>Escala</b></td><td>A hora que ficou combinada com ele, pela escala do Jaison.</td></tr>'+
'<tr><td><b>Real</b></td><td>A hora que o GPS carimbou a chegada no pátio, o atraso entre parênteses, e a hora da última entrega. O sinal de alerta quer dizer que não houve carimbo de GPS — a chegada é estimada e por isso nada é cortado.</td></tr>'+
'<tr><td><b>Almoço</b></td><td><b>sim</b> = tem direito à refeição. <b>não</b> = perdeu por ter chegado mais de 30 minutos atrasado. O número entre parênteses aparece quando fez dois turnos e tem direito a duas.</td></tr>'+
'<tr><td><b>Prato</b></td><td>O que ele efetivamente pegou na comanda Z Motoboys. Se aparece um valor em vermelho, é porque pegou sem ter direito e está pagando por ele.</td></tr>'+
'<tr><td><b>Entregas</b></td><td>Quantas entregas geraram taxa para ele no dia.</td></tr>'+
'<tr><td><b>Garantido</b></td><td>O piso por hora a que ele teria direito. <b>não</b> = perdeu o garantido por atraso, e recebe só as taxas.</td></tr>'+
'<tr><td><b>A pagar</b></td><td>O maior entre as taxas e o garantido, menos o lanche cobrado e mais ou menos os ajustes feitos a mão.</td></tr>'+
'<tr><td><b>Planilha deles</b></td><td>O que a planilha que os meninos mandam no grupo FECHAMENTO MOTOBOYS manda pagar, e embaixo a diferença para a nossa conta. Verde = igual. Amarelo = o sistema paga menos que eles (quase sempre porque eles ainda usam diária cheia). Azul = o sistema paga mais. É só para conferir — quem paga é você.</td></tr>'+
'</table></div></div>';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const iso=d=>d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
function rs(n){return 'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(n){return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1})}
let VIEW='pag', D=null, PD=null, PDDIA=null, AG=null, AGT=null, LOJA='';


async function porta(de,ate){
  const b={p_token:cdmTok()};
  if(de)b.p_de=de; if(ate)b.p_ate=ate;
  const r=await fetch(SB+'rpc/pagamento_motoboy_consulta',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(b)});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}

function rapido(q){
  const hoje=new Date(), on=q?('p_'+q):'';
  ['p_sem','p_ant','p_mes'].forEach(function(x){var e=$(x);if(e)e.className='b'+(x===on?' on':'')});
  if(q==='sem'){ $('ate').value=iso(new Date(hoje.getTime()-864e5)); $('de').value=iso(new Date(hoje.getTime()-7*864e5)); }
  else if(q==='mes'){ $('ate').value=iso(new Date(hoje.getTime()-864e5)); $('de').value=iso(new Date(hoje.getTime()-30*864e5)); }
  else if(q==='ant'){
    const dow=hoje.getDay(), seg=new Date(hoje.getTime()-((dow===0?6:dow-1)+7)*864e5);
    $('de').value=iso(seg); $('ate').value=iso(new Date(seg.getTime()+6*864e5));
  }
  carrega();
}

async function carrega(){
  try{
    $('conteudo').innerHTML='<div class="empty">Carregando…</div>';
    D=await porta($('de').value,$('ate').value);
    $('de').value=D.de_iso; $('ate').value=D.ate_iso;
    $('rel').textContent='de '+D.de+' a '+D.ate+' · lido '+(D.agora||'');
    faixa(); kpis(); render();
  }catch(e){
    $('conteudo').innerHTML='<div class="c">Não deu para carregar. Entre no portal de novo e tente outra vez.</div>';
  }
}

function faixa(){
  const r=D.resumo||{}, av=[];
  if(r.sem_hora>0)av.push('<b>'+r.sem_hora+'</b> pagamento'+(r.sem_hora==1?' ficou':'s ficaram')+' sem hora medida — o piso não pôde ser calculado');
  if(r.sem_pix>0)av.push('<b>'+r.sem_pix+'</b> pagamento'+(r.sem_pix==1?'':'s')+' de motoboy <b>sem chave PIX cadastrada</b>');
  av.push('a hora usada é a de quem <b>realmente rodou</b>, da primeira à última entrega — ela <b>subestima</b>, porque o motoboy chega antes e fica depois');
  if(r.total_antigo&&Math.abs(r.total-r.total_antigo)>0.01)av.push('a conta mudou: antes o sistema pagava R$ 20 por hora em todas as lojas, sobre as horas da <b>escala</b>; agora vale a régua da casa sobre a hora real');
  $('faixa').innerHTML='<div class="faixa">⚠️ Antes de pagar, olhe isto:<br>· '+av.join('<br>· ')+'</div>';
}

function kpis(){
  const r=D.resumo||{};
  $('kpis').innerHTML='<div class="kpis">'+
    kpi('Total a pagar','g',rs(r.total),(r.pagamentos||0)+' pagamentos no período')+
    kpi('Motoboys','',r.motoboys||0,'pessoas diferentes')+
    kpi('Conta antiga','w',rs(r.total_antigo),'diferença de '+rs((r.total||0)-(r.total_antigo||0))+' a mais para os motoboys')+
  '</div>';
}
function kpi(k,c,v,d){return '<div class="kpi '+(c||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="d">'+d+'</div></div>'}

function setView(v){VIEW=v;
  $('t_pag').className='tab'+(v==='pag'?' on':'');
  $('t_ag').className='tab'+(v==='ag'?' on':'');
  $('t_maq').className='tab'+(v==='maq'?' on':'');
  $('t_reg').className='tab'+(v==='reg'?' on':'');
  $('t_cmp').className='tab'+(v==='cmp'?' on':'');
  if(v!=='ag'&&AGT){clearInterval(AGT);AGT=null}
  render()}
function viewRegras(){$('kpis').innerHTML='';$('faixa').innerHTML='';$('conteudo').innerHTML=REGRAS_HTML}
function render(){if(VIEW==='ag'){viewAgora();return}if(VIEW==='maq'){viewMaq();return}if(VIEW==='reg'){viewRegras();return}if(VIEW==='cmp'){viewComparar();return}viewPag()}
async function viewComparar(){
  $('faixa').innerHTML='';
  if(!PD){ $('conteudo').innerHTML='<div class="empty">Carregando…</div>'; await puxaPagDia(); }
  if(!DELES){ try{ DELES=await portaDeles(PDDIA); MAPD=mapaDeles(); }catch(e){ DELES=null } }
  const t=(DELES&&DELES.totais)||{};
  let h='<div class="c"><div class="hs" style="margin:0 0 8px"><b>A nossa conta × a planilha do grupo</b> · dia '+esc((PD&&PD.dia_texto)||PDDIA)+' · a planilha chega no grupo FECHAMENTO MOTOBOYS por volta de 1h30 da manhã seguinte</div>'+
    '<button class="b" onclick="pagDiaPula(-1)">◀ dia anterior</button> '+
    '<input type="date" value="'+esc(PDDIA)+'" onchange="pagDiaMuda(this.value)"> '+
    '<button class="b" onclick="pagDiaPula(1)">dia seguinte ▶</button></div>';
  if(!DELES||!DELES.tem){
    $('kpis').innerHTML='';
    $('conteudo').innerHTML=h+'<div class="c"><b style="color:#fbbf24">🧾 A planilha do grupo deste dia ainda não foi lida.</b> O robô lê as fotos todo dia às 3h15 da manhã. Se o dia é antigo e mesmo assim está vazio, é porque ninguém mandou a foto naquele dia.</div>';
    return;
  }
  const dif=Number(t.dif||0), cor=Math.abs(dif)<0.01?'#4ade80':(dif<0?'#fbbf24':'#60a5fa');
  let k='<div class="kpis">';
  k+=cartao(rs(t.deles), 'a planilha do grupo manda pagar','big');
  k+=cartao(rs(t.nosso), 'a nossa conta dá');
  k+=cartao((dif>0?'+':'')+rs(dif), 'diferença do dia', Math.abs(dif)<0.01?'':'warn');
  k+=cartao(num(t.deles_entregas)+' × '+num(t.nosso_entregas), 'entregas: deles × nossa');
  if(Number(t.pendentes||0)>0) k+=cartao(num(t.pendentes), 'entregas ainda PENDENTES no TrackEat','warn');
  if(Number(t.reprovadas||0)>0) k+=cartao(num(t.reprovadas), 'reprovadas (duplicadas) que não pagamos');
  $('kpis').innerHTML=k+'</div>';
  h+='<div class="c wrap"><table class="enxuta"><tr>'+
     '<th>Loja</th><th>Motoboy</th><th>Escala → chegou</th>'+
     '<th class="grupo">Almoço</th><th class="grupo">Garantido</th>'+
     '<th class="money">Entregas deles</th><th class="money">A planilha paga</th>'+
     '<th class="money">Entregas nossas</th><th class="money">Horas rodadas</th><th class="money">A nossa conta</th>'+
     '<th class="money">Diferença</th><th>Por que difere</th></tr>';
  const tr='<span style="color:var(--muted)">—</span>';
  (DELES.linhas||[]).forEach(function(x,i){
    const d=Number(x.dif||0);
    const vh=Number((DELES&&DELES.valor_hora)||20);
    const piso=Math.round(Number(x.nosso_horas||0)*vh*100)/100;
    const hd=(x.deles_pagar==null||!vh)?null:Math.round((Number(x.deles_pagar)/vh)*100)/100;
    const c2 = x.onde!=='nos dois' ? '#fbbf24' : (Math.abs(d)<0.01?'#4ade80':(d<0?'#fbbf24':'#60a5fa'));
    let porque='';
    if(x.onde==='só na planilha deles') porque='<span style="color:#fbbf24">está na planilha e o sistema não viu rodar</span>';
    else if(x.onde==='só no sistema') porque='<span style="color:#fbbf24">rodou pelo sistema e não está na planilha</span>';
    else {
      const p=[];
      const pt=function(t){return '<div style="margin:2px 0">'+t+'</div>'};
      if(Number(x.deles_entregas||0)!==Number(x.nosso_entregas||0)){
        let m='Ele fez <b>'+num(x.nosso_entregas)+'</b> entregas. A planilha contou <b>'+num(x.deles_entregas)+'</b>.';
        if(Number(x.pendentes||0)>0) m+=' <span style="color:#fbbf24">'+(Number(x.pendentes)===1?'Uma delas o TrackEat ainda não aprovou.':x.pendentes+' delas o TrackEat ainda não aprovou.')+'</span>';
        if(Number(x.reprovadas||0)>0) m+=' <span style="color:var(--muted)">'+(Number(x.reprovadas)===1?'1 foi marcada como repetida':x.reprovadas+' foram marcadas como repetidas')+' e a gente não paga.</span>';
        p.push(pt(m));
      } else if(Number(x.pendentes||0)>0 || Number(x.reprovadas||0)>0){
        let m='As entregas batem ('+num(x.nosso_entregas)+').';
        if(Number(x.pendentes||0)>0) m+=' <span style="color:#fbbf24">Mas '+(Number(x.pendentes)===1?'1 ainda não foi aprovada':x.pendentes+' ainda não foram aprovadas')+' no TrackEat.</span>';
        if(Number(x.reprovadas||0)>0) m+=' <span style="color:var(--muted)">'+(Number(x.reprovadas)===1?'1 foi marcada como repetida':x.reprovadas+' foram marcadas como repetidas')+' e a gente não paga.</span>';
        p.push(pt(m));
      }
      if(hd!=null && Math.abs(hd-Number(x.nosso_horas||0))>0.25){
        p.push(pt('Ele rodou <b>'+hhmm(x.nosso_horas)+'</b> de verdade. A planilha pagou como se ele tivesse rodado <b style="color:#fbbf24">'+hhmm(hd)+'</b>.'));
      }
      if(Math.abs(d)>0.01){
        p.push(pt('Cada hora vale '+rs(vh)+'. '+hhmm(x.nosso_horas)+' dá <b>'+rs(piso)+'</b>. As '+num(x.nosso_entregas)+' entregas renderam <b>'+rs(x.taxas)+'</b> de taxa. A casa paga o maior dos dois: <b>'+rs(Math.max(piso, Number(x.taxas||0)))+'</b>.'));
        if(Number(x.lanche_cobrado||0)>0) p.push(pt('<span style="color:#f87171">Pegou lanche sem ter direito: menos '+rs(x.lanche_cobrado)+'.</span>'));
        p.push(pt('Fica <b>'+rs(x.nosso_pagar)+'</b>. A planilha pagou <b>'+rs(x.deles_pagar)+'</b> — <b style="color:'+(d<0?'#fbbf24':'#60a5fa')+'">'+rs(Math.abs(d))+(d<0?' a mais do que devia':' a menos do que devia')+'</b>.'));
      }
      if(Number(x.refeicoes||0)===0 && Number(x.atraso_min||0)>30) p.push(pt('<span style="color:#f87171">Chegou '+x.atraso_min+' minutos depois da hora combinada: por isso perdeu o almoço e o garantido.</span>'));
      if(x.tem_gps===false) p.push(pt('<span style="color:#fbbf24">O GPS não carimbou a chegada dele, então a hora é estimada e nada foi cortado.</span>'));
      porque = p.join('') || '<span style="color:#4ade80">As duas contas batem.</span>';
    }
    h+='<tr'+((i%2===1)?' class="par"':'')+'>'+
      '<td>'+esc(sigla(x.unidade))+'</td>'+
      '<td class="nome" data-k="'+esc(x.motoboy)+'"><b>'+esc(x.motoboy)+'</b>'+

async function portaPagDia(dia){
  const b={p_token:cdmTok()};
  if(dia)b.p_dia=dia;
  const r=await fetch(SB+'rpc/pagamento_do_dia',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(b)});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}
var DELES=null;
async function portaDeles(dia){
  const r=await fetch(SB+'rpc/fechamento_deles_do_dia',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:cdmTok(),p_dia:dia})});
  if(!r.ok)return null;
  return await r.json();
}
function chaveDeles(unidade,nome){return String(unidade||'')+'|'+String(nome||'').trim().toLowerCase()}
function mapaDeles(){
  const m={};
  if(DELES&&DELES.linhas)DELES.linhas.forEach(function(x){ if(x.onde!=='só na planilha deles') m[chaveDeles(x.unidade,x.motoboy)]=x; });
  return m;
}
function hhmm(h){
  if(h==null) return '—';
  const n=Number(h), i=Math.floor(n), m=Math.round((n-i)*60);
  return i+'h'+(m>0?(m<10?'0':'')+m:'');
}
function comparaDeles(l){
  if(!DELES) return '<div class="c"><span style="color:var(--muted)">A planilha dos meninos deste dia ainda não foi lida.</span></div>';
  if(!DELES.tem) return '<div class="c"><b style="color:#fbbf24">🧾 A planilha dos meninos deste dia ainda não chegou.</b> Ela costuma cair no grupo FECHAMENTO MOTOBOYS por volta de 1h30 da manhã seguinte.</div>';
  var lojas={}; (l||[]).forEach(function(m){lojas[m.unidade]=1});
  var nosso=0; (l||[]).forEach(function(m){nosso+=Number(m.pagar||0)});
  var deles=0; (DELES.linhas||[]).forEach(function(x){ if(lojas[x.unidade]) deles+=Number(x.deles_pagar||0) });
  nosso=Math.round(nosso*100)/100; deles=Math.round(deles*100)/100;
  var t={deles:deles, nosso:nosso}, dif=Math.round((nosso-deles)*100)/100;
  var cor = Math.abs(dif)<0.01 ? '#4ade80' : (dif<0 ? '#fbbf24' : '#60a5fa');
  var sos=(DELES.linhas||[]).filter(function(x){return x.onde!=='nos dois'});
  var h='<div class="c"><b>🧾 A conta deles × a nossa</b> · a planilha manda pagar <b>'+rs(t.deles)+'</b>, o sistema calcula <b>'+rs(t.nosso)+'</b>, diferença <b style="color:'+cor+'">'+(dif>0?'+':'')+rs(dif)+'</b>';
  h+='<div class="hs" style="margin:6px 0 0">Quando o sistema dá menos, é porque a planilha ainda paga a diária cheia e a régua da casa paga por hora rodada.</div>';
  if(sos.length){
    h+='<div style="margin-top:8px;color:#fbbf24">⚠️ '+sos.length+' nome(s) que não casaram: ';
    h+=sos.map(function(x){return esc(x.motoboy)+' <span style="color:var(--muted)">('+esc(x.onde)+')</span>'}).join(' · ');
    h+='</div>';
  }
  return h+'</div>';
}
function difDeles(m){
  const d=(MAPD||{})[chaveDeles(m.unidade,m.entregador)];
  if(!d||d.deles_pagar==null) return '';
  return String(Math.round((Number(m.pagar||0)-Number(d.deles_pagar||0))*100)/100);
}
function celulaDeles(m){
  const d=(MAPD||{})[chaveDeles(m.unidade,m.entregador)];
  if(!d||d.deles_pagar==null) return '<span style="color:var(--muted)">—</span>';
  const dif=Math.round((Number(m.pagar||0)-Number(d.deles_pagar||0))*100)/100;
  const cor = Math.abs(dif)<0.01 ? '#4ade80' : (dif<0 ? '#fbbf24' : '#60a5fa');
  const sinal = dif>0?'+':'';
  return rs(d.deles_pagar)+'<br><span style="color:'+cor+';font-size:11px" title="quanto o sistema paga a mais ou a menos que a planilha deles">'+(Math.abs(dif)<0.01?'igual':sinal+rs(dif))+'</span>';
}
var MAPD={};
async function puxaPagDia(dia){
  try{
    $('conteudo').innerHTML='<div class="empty">Carregando o dia…</div>';

function pagDiaPula(n){const d=new Date((PDDIA||iso(new Date()))+'T12:00:00');d.setDate(d.getDate()+n);pagDiaMuda(iso(d))}

}
function botoesLoja(D2){

  h+='<button class="b'+(LOJA===''?' on':'')+'" onclick="setLoja(\'\')" style="'+(LOJA===''?'background:#ff2d55;color:#fff;border-color:#ff2d55':'')+'">todas</button> ';
  ls.forEach(function(u){

  });

function soDaLoja(lista){ return LOJA ? (lista||[]).filter(x=>x.unidade===LOJA) : (lista||[]) }
function somaTotais(l){
  const t={gente:l.length, pagar:0, almocos:0, sem_almoco:0, dobrados:0, sem_gps:0, sem_pix:0,
           cobrados:0, cobrado_total:0, sem_preco:0, entregas:0, horas:0, rodando_agora:0};
  l.forEach(function(m){
    t.pagar+=Number(m.pagar||0); t.almocos+=Number(m.direito_refeicoes||0);
    if(!m.direito_refeicoes) t.sem_almoco++;
    if(m.turnos>1) t.dobrados++;
    if(!m.tem_gps) t.sem_gps++;
    if(!m.chave_pix) t.sem_pix++;
    if(m.cobrar_refeicao>0){t.cobrados++; t.cobrado_total+=Number(m.cobrar_refeicao)}
    t.sem_preco+=Number(m.lanche_sem_preco||0);
    t.entregas+=Number(m.entregas||0); t.horas+=Number(m.horas||0);
    if(m.ligado_agora) t.rodando_agora++;
  });
  t.pagar=Math.round(t.pagar*100)/100; t.cobrado_total=Math.round(t.cobrado_total*100)/100;
  t.horas=Math.round(t.horas*10)/10;
  return t;
}
function cartao(n,l,cls){return '<div class="kpi'+(cls?' '+cls:'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'}
function totaisTxt(t,vivo){
  let h='<div class="kpis">';
  h+=cartao(rs(t.pagar), vivo?'a pagar até agora':'total a pagar','big');
  h+=cartao(num(t.gente||0), 'motoboys');
  h+=cartao(num(t.entregas||0), 'entregas');
  h+=cartao(num(t.horas||0)+'h', 'horas rodadas');
  h+=cartao(num(t.almocos||0), 'refeições de direito');
  if(t.dobrados>0) h+=cartao(num(t.dobrados), 'fizeram 2 turnos');
  if(t.cobrados>0) h+=cartao(rs(t.cobrado_total), num(t.cobrados)+' pagando lanche','warn');
  if(t.sem_pix>0) h+=cartao(num(t.sem_pix), 'sem chave PIX','warn');
  if(t.sem_preco>0) h+=cartao(num(t.sem_preco), 'lanche sem preço','warn');

function semDono(D2,vivo){

async function apontar(i,unidade,idSale,dia){
  const v=$('sd'+i).value;

  try{
    const r=await fetch(SB+'rpc/pagamento_apontar',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_token:cdmTok(),p_dados:{unidade:unidade,id_sale:idSale,dia:dia,entregador:v}})});
    if(!r.ok)throw 0;
    if(VIEW==='ag'){AG=null;puxaAgora()}else{PD=null;puxaPagDia(dia)}
  }catch(e){alert('Não deu para gravar. Entre no portal de novo.')}
}

  if(!PD){puxaPagDia();return}

  let h='<div class="c"><div class="hs" style="margin:0 0 8px"><b>Pagamento do dia '+esc(PD.dia_texto)+'</b> ('+esc(PD.dia_semana)+') · '+(PD.fim_de_semana?'fim de semana, R$ 25 a hora':'dia de semana, R$ 20 a hora')+' · lido '+esc(PD.agora)+'</div>'+
    '<button class="b" onclick="pagDiaPula(-1)">◀ dia anterior</button> '+
    '<input type="date" id="pd_dia" value="'+esc(PD.dia)+'" onchange="pagDiaMuda(this.value)"> '+
    '<button class="b" onclick="pagDiaPula(1)">dia seguinte ▶</button> '+
    '<button class="b" style="margin-left:10px" onclick="setView(\'maq\')">🧾 conferir a maquininha deste dia</button></div>';
  h+=botoesLoja(PD);

  if(!l.length){$('conteudo').innerHTML=h+'<div class="c empty">Ninguém rodou neste dia.</div>';return}
  h+=cabecalho();

  h+='</table></div>';
  h+='<div class="hs">Tolerância de <b>'+num(PD.tolerancia_min)+' minutos</b> na chegada. A conta inteira, explicada, está na aba <b><a href="#" onclick="setView(\'reg\');return false" style="color:#ff2d55">📜 As regras</a></b>. Quem decide é você.</div>';
  $('conteudo').innerHTML=h;
}

  NAO_COBROU:['🔴 Não cobrou','#e66767','O motoboy esteve no endereço (GPS) e não existe cobrança em lugar nenhum: nem Rede, nem Pix, nem cofre.'],
  SEM_COBRANCA_LONGE:['❓ Sem cobrança e GPS longe','#e66767','Nenhuma cobrança achada, e o GPS não mostra o motoboy no endereço na hora da entrega.'],
  SEM_COBRANCA_SEM_GPS:['❓ Sem cobrança e sem GPS','#c98500','Nenhuma cobrança achada e não há leitura de GPS para provar a entrega.'],
  AGUARDANDO_REDE:['⏳ Rede ainda não chegou','#8a897e','A Rede só entrega as vendas do dia no dia seguinte, às 9h. Volte depois.'],
  PIX_ACHADO:['✅ Pix no extrato','#2fae6a','O Pix entrou no extrato com o valor exato.'],
  PIX_SEM_RASTRO:['❓ Pix sem rastro','#c98500','O Saipos diz Pix, mas não achei esse valor no extrato (dia ou dia seguinte).'],
  DINHEIRO:['💵 Dinheiro','#8a897e','Dinheiro se confere pelo cofre do dia, não por pedido.']
};
function maqSit(s){return MAQ_SIT[s]||[s,'#8a897e','']}
function maqPill(s){const x=maqSit(s);return '<span style="display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;background:'+x[1]+'22;color:'+x[1]+';white-space:nowrap">'+x[0]+'</span>'}
function maqRs(n){return n==null?'—':'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function maqModo(m){if(!m)return '';m=String(m);return m.indexOf('CREDIT')===0?'crédito':(m.indexOf('DEBIT')===0?'débito':(m.indexOf('VAN')===0?'vale':m))}
function maqHtml(j){
  if(!j)return '<div class="c">Não deu para carregar a conferência da maquininha. Entre no portal de novo e tente outra vez.</div>';
  const L=j.linhas||[], R=j.resumo||{}, dono=!!j.dono;
  const ordem=['NAO_COBROU','SEM_COBRANCA_LONGE','SEM_COBRANCA_SEM_GPS','SO_A_COMIDA','COBROU_A_MAIS','PIX_SEM_RASTRO','OUTRO_METODO','COBRADO','PIX_ACHADO','DINHEIRO','AGUARDANDO_REDE'];
  let h='<div class="c"><div style="font-size:12.5px;color:#c3c2b7;margin-bottom:8px"><b style="color:#fff">🧾 Maquininha do dia '+esc(j.dia_texto)+'</b> · '+L.length+' entrega'+(L.length===1?'':'s')+' paga'+(L.length===1?'':'s')+' na porta · Rede lida até '+esc(j.rede_ate||'—')+' · lido '+esc(j.agora)+'</div>';
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
  ordem.forEach(function(k){if(R[k])h+=maqPill(k).replace('</span>',' · <b>'+R[k]+'</b></span>')});
  h+='</div></div>';
  if(!L.length)return h+'<div class="c" style="color:#8a897e">Nenhuma entrega paga na porta neste dia (cartão, vale, Pix ou dinheiro). Tudo veio pago pelo app.</div>';
  const pri=L.slice().sort(function(a,b){return ordem.indexOf(a.situacao)-ordem.indexOf(b.situacao)});
  h+='<div class="c" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:700px"><tr>'+
    '<th style="text-align:left;color:#8a897e;font-size:11px;padding:0 8px 6px 0">Loja</th><th style="text-align:left;color:#8a897e;font-size:11px;padding:0 8px 6px 0">Pedido</th><th style="text-align:left;color:#8a897e;font-size:11px;padding:0 8px 6px 0">Motoboy</th><th style="text-align:left;color:#8a897e;font-size:11px;padding:0 8px 6px 0">Entregue</th><th style="text-align:left;color:#8a897e;font-size:11px;padding:0 8px 6px 0">O Saipos diz</th>'+
    (dono?'<th style="text-align:right;color:#8a897e;font-size:11px;padding:0 8px 6px 0">Na porta</th>':'')+
    '<th style="text-align:left;color:#8a897e;font-size:11px;padding:0 8px 6px 0">Rede</th><th style="text-align:left;color:#8a897e;font-size:11px;padding:0 8px 6px 0">GPS</th><th style="text-align:left;color:#8a897e;font-size:11px;padding:0 8px 6px 0">Situação</th></tr>';
  pri.forEach(function(l,i){
    const x=maqSit(l.situacao), r=l.rede, g=l.gps, p=l.pix;
    let rede='—';
    if(r)rede='<b>'+esc(r.hora)+'</b> '+esc(maqModo(r.modalidade))+(dono&&r.valor!=null?' · '+maqRs(r.valor):'')+(r.dif_min>15?' <span style="color:#8a897e">('+r.dif_min+' min da entrega)</span>':'');
    else if(p)rede='Pix '+esc(p.data)+(dono?' · '+esc(p.desc||''):'');
    let gps='—';
    if(g&&g.dist_m!=null)gps=(g.dist_m<=g.raio?'<b style="color:#2fae6a">no endereço</b>':'<b style="color:#e66767">longe</b>')+' · '+g.dist_m+' m às '+esc(g.hora);
    else if(g&&g.sem_endereco)gps='<span style="color:#8a897e">sem endereço do cliente</span>';
    else gps='<span style="color:#8a897e">sem leitura</span>';
    const forma=esc(l.forma)+(l.promessa?' <span title="a forma foi anotada no mesmo minuto do pedido: é o que o cliente PROMETEU, não o que a maquininha confirmou" style="color:#8a897e;font-size:11px">(prometida)</span>':'');
    h+='<tr style="'+(i%2?'background:rgba(255,255,255,.02)':'')+'">'+
      '<td style="padding:8px 8px 2px 0;border-top:1px solid #34332f;vertical-align:top">'+esc(l.unidade==='Água Verde'?'AV':(l.unidade==='São Braz'?'SB':l.unidade))+'</td>'+
      '<td style="padding:8px 8px 2px 0;border-top:1px solid #34332f;vertical-align:top"><b>#'+esc(l.pedido)+'</b>'+(l.curto?' <span style="color:#8a897e;font-size:11px">('+esc(l.curto)+')</span>':'')+'<div style="color:#8a897e;font-size:11px">'+esc(l.cliente||'')+(l.bairro?' · '+esc(l.bairro):'')+'</div></td>'+
      '<td style="padding:8px 8px 2px 0;border-top:1px solid #34332f;vertical-align:top">'+esc(l.motoboy||'—')+'</td>'+
      '<td style="padding:8px 8px 2px 0;border-top:1px solid #34332f;vertical-align:top">'+esc(l.entregue_em||'—')+'<div style="color:#8a897e;font-size:11px">pedido '+esc(l.pedido_em||'')+'</div></td>'+
      '<td style="padding:8px 8px 2px 0;border-top:1px solid #34332f;vertical-align:top">'+forma+'</td>'+
      (dono?'<td style="padding:8px 8px 2px 0;border-top:1px solid #34332f;vertical-align:top;text-align:right;white-space:nowrap"><b>'+maqRs(l.na_porta)+'</b>'+(l.taxa>0?'<div style="color:#8a897e;font-size:11px">taxa '+maqRs(l.taxa)+'</div>':'')+'</td>':'')+
      '<td style="padding:8px 8px 2px 0;border-top:1px solid #34332f;vertical-align:top">'+rede+'</td>'+
      '<td style="padding:8px 8px 2px 0;border-top:1px solid #34332f;vertical-align:top">'+gps+'</td>'+
      '<td style="padding:8px 0 8px 0;border-top:1px solid #34332f;vertical-align:top" title="'+esc(x[2])+'">'+maqPill(l.situacao)+' <span style="color:#8a897e;cursor:help">ⓘ</span></td></tr>';
  });
  h+='</table></div>';
  h+='<div class="c" style="font-size:12px;color:#c3c2b7">Como eu confiro: pego cada entrega que o <b>Saipos</b> diz que foi paga na porta (cartão, vale, Pix, dinheiro), procuro o valor exato na <b>Rede</b> da mesma loja em até '+esc(j.janela_min||240)+' minutos da hora da entrega (cada cobrança da Rede só pode casar com <b>um</b> pedido — a mesa do salão paga na mesma hora não conta duas vezes), depois no <b>extrato</b> (Pix) e, por último, olho o <b>GPS</b> do motoboy: estar a menos de '+esc(j.raio_m||150)+' m da casa do cliente prova que ele entregou. Regra da casa: <b>o preço já inclui a taxa — nada é cobrado por fora</b>.</div>';
  return h;
}

let MQ=null, MQK='';
async function portaMaq(dia,loja){
  const r=await fetch(SB+'rpc/maquininha_conferir',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:cdmTok(),p_dia:dia||null,p_unidade:loja||null})});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}
function maqLojas(){
  let h='<div class="c" style="padding:9px 12px"><b style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px">Loja</b> ';
  [['','todas'],['Água Verde','Água Verde'],['São Braz','São Braz'],['Ahú','Ahú']].forEach(function(u){
    h+='<button class="b" onclick="setLoja(\''+u[0]+'\')" style="'+(LOJA===u[0]?'background:#ff2d55;color:#fff;border-color:#ff2d55':'')+'">'+u[1]+'</button> ';
  });
  return h+'</div>';
}
function viewMaq(){
  const dia=PDDIA||iso(new Date(Date.now()-864e5)), k=dia+'|'+LOJA;
  let h='<div class="c"><div class="hs" style="margin:0 0 8px"><b>🧾 Maquininha</b> · cada entrega paga na porta, cruzada com a Rede, o extrato e o GPS do motoboy</div>'+
    '<button class="b" onclick="pagDiaPula(-1)">◀ dia anterior</button> '+
    '<input type="date" id="pd_dia" value="'+esc(dia)+'" onchange="pagDiaMuda(this.value)"> '+
    '<button class="b" onclick="pagDiaPula(1)">dia seguinte ▶</button></div>'+maqLojas();
  if(MQK!==k||!MQ){
    MQ=null;MQK=k;
    $('conteudo').innerHTML=h+'<div class="empty">Cruzando Saipos, Rede, extrato e GPS…</div>';
    portaMaq(dia,LOJA).then(function(j){if(MQK===k){MQ=j;viewMaq()}}).catch(function(){if(MQK===k){$('conteudo').innerHTML=h+maqHtml(null)}});
    return;
  }
  $('conteudo').innerHTML=h+maqHtml(MQ);
}

async function portaAgora(){
  const r=await fetch(SB+'rpc/pagamento_agora',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:cdmTok()})});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}
async function puxaAgora(){
  try{
    if(!AG)$('conteudo').innerHTML='<div class="empty">Carregando o dia de hoje…</div>';
    AG=await portaAgora();
    viewAgora();
    if(!AGT)AGT=setInterval(function(){if(VIEW==='ag')puxaAgora()},60000);
  }catch(e){
    $('conteudo').innerHTML='<div class="c">Não deu para carregar o quadro ao vivo. Entre no portal de novo e tente outra vez.</div>';
  }
}
function viewAgora(){
  if(!AG){puxaAgora();return}
  const l=soDaLoja(AG.linhas), t=(LOJA? somaTotais(l) : (AG.totais||{})), p=soDaLoja(AG.no_patio);
  let h='<div class="c"><div class="hs" style="margin:0"><b>🔴 AO VIVO — hoje, '+esc(AG.dia_texto)+'</b> ('+esc(AG.dia_semana)+') · '+(AG.fim_de_semana?'R$ 25 a hora':'R$ 20 a hora')+' · atualiza sozinho a cada minuto · lido '+esc(AG.agora)+'</div></div>';
  if(p.length){
    h+='<div class="c"><b>🛵 Quem está com o aplicativo ligado neste minuto</b><div class="wrap"><table><tr><th>Loja</th><th>Motoboy</th><th>Onde está</th><th>Distância da loja</th><th>Situação</th><th>Visto</th></tr>';
    p.forEach(function(x){
      const onde = x.no_patio ? '<span style="color:#4ade80">🟢 no pátio</span>' : (x.dist_loja_m!==null&&x.dist_loja_m<3000 ? '<span style="color:#fbbf24">🛵 na rua</span>' : '<span style="opacity:.6">⚪ longe</span>');
      h+='<tr><td>'+esc(x.unidade)+'</td><td>'+esc(x.entregador)+'</td><td>'+onde+'</td>'+
         '<td>'+(x.dist_loja_m===null?'—':(x.dist_loja_m<1000?x.dist_loja_m+' m':(x.dist_loja_m/1000).toFixed(1)+' km'))+'</td>'+
         '<td>'+(x.na_fila?'na fila':(x.disponivel?'disponível':'indisponível'))+'</td><td>'+esc(x.visto)+'</td></tr>';
    });
    h+='</table></div></div>';
  }else{
    h+='<div class="c empty">Ninguém com o aplicativo ligado neste minuto.</div>';
  }
  h+=botoesLoja(AG);
  h+=totaisTxt(t,true);
  h+=semDono(AG,true);
  if(l.length){
    h+='<div class="c"><b>💰 Quanto já vale o dia de hoje, se fechasse agora</b></div>';
    h+=cabecalho();
    l.forEach(function(m,i){h+=linhaMoto(m,i,true)});
    h+='</table></div>';
  }else{
    h+='<div class="c empty">Nenhuma entrega registrada hoje ainda.</div>';
  }
  h+='<div class="hs">Este quadro é <b>parcial</b>: o turno ainda não fechou. A hora conta da chegada no pátio até a última entrega <b>até agora</b>, então o valor sobe conforme o motoboy entrega. O corte de almoço e garantido já vale, porque o atraso na chegada já aconteceu.</div>';
  $('conteudo').innerHTML=h;
}

/* ===== porta unica do portal ===== */
const CDMMODS=['pagamento'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'pagamento'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  try{sessionStorage.setItem('cdm_admin',j.admin?'1':'0')}catch(e){}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(!ok)return;try{$('p_sem').parentElement.style.display='none'}catch(e){}puxaPagDia();});
