async function porta(de,ate){
  const b={p_token:cdmTok()};
  if(de)b.p_de=de; if(ate)b.p_ate=ate;
  const r=await fetch(SB+'rpc/pagamento_motoboy_consulta',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(b)});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}

function rapido(q){
  const hoje=new Date(), on=q?('p_'+q):'';
  ['p_sem','p_ant','p_mes'].forEach(function(x){var e=$(x);if(e)e.className='b'+(x===on?' on':'')});
  if(q==='sem'){ $('ate').value=iso(new Date(hoje.getTime()-864e5)); $('de').value=iso(new Date(hoje.getTime()-7*864e5)); }
  else if(q==='mes'){ $('ate').value=iso(new Date(hoje.getTime()-864e5)); $('de').value=iso(new Date(hoje.getTime()-30*864e5)); }
  else if(q==='ant'){
    const dow=hoje.getDay(), seg=new Date(hoje.getTime()-((dow===0?6:dow-1)+7)*864e5);
    $('de').value=iso(seg); $('ate').value=iso(new Date(seg.getTime()+6*864e5));
  }
  carrega();
}

async function carrega(){
  try{
    $('conteudo').innerHTML='<div class="empty">Carregando…</div>';
    D=await porta($('de').value,$('ate').value);
    $('de').value=D.de_iso; $('ate').value=D.ate_iso;
    $('rel').textContent='de '+D.de+' a '+D.ate+' · lido '+(D.agora||'');
    faixa(); kpis(); render();

  return m;

function comparaDeles(l){
  if(!DELES) return '<div class="c"><span style="color:var(--muted)">A planilha dos meninos deste dia ainda não foi lida.</span></div>';
  if(!DELES.tem) return '<div class="c"><b style="color:#fbbf24">🧾 A planilha dos meninos deste dia ainda não chegou.</b> Ela costuma cair no grupo FECHAMENTO MOTOBOYS por volta de 1h30 da manhã seguinte.</div>';
  var lojas={}; (l||[]).forEach(function(m){lojas[m.unidade]=1});
  var nosso=0; (l||[]).forEach(function(m){nosso+=Number(m.pagar||0)});
  var deles=0; (DELES.linhas||[]).forEach(function(x){ if(lojas[x.unidade]) deles+=Number(x.deles_pagar||0) });
  nosso=Math.round(nosso*100)/100; deles=Math.round(deles*100)/100;
  var t={deles:deles, nosso:nosso}, dif=Math.round((nosso-deles)*100)/100;
  var cor = Math.abs(dif)<0.01 ? '#4ade80' : (dif<0 ? '#fbbf24' : '#60a5fa');

  var h='<div class="c"><b>🧾 A conta deles × a nossa</b> · a planilha manda pagar <b>'+rs(t.deles)+'</b>, o sistema calcula <b>'+rs(t.nosso)+'</b>, diferença <b style="color:'+cor+'">'+(dif>0?'+':'')+rs(dif)+'</b>';
  h+='<div class="hs" style="margin:6px 0 0">Quando o sistema dá menos, é porque a planilha ainda paga a diária cheia e a régua da casa paga por hora rodada.</div>';

function difDeles(m){

  const dif=Math.round((Number(m.pagar||0)-Number(d.deles_pagar||0))*100)/100;

  const sinal = dif>0?'+':'';
  return rs(d.deles_pagar)+'<br><span style="color:'+cor+';font-size:11px" title="quanto o sistema paga a mais ou a menos que a planilha deles">'+(Math.abs(dif)<0.01?'igual':sinal+rs(dif))+'</span>';

function somaTotais(l){
  const t={gente:l.length, pagar:0, almocos:0, sem_almoco:0, dobrados:0, sem_gps:0, sem_pix:0,
           cobrados:0, cobrado_total:0, sem_preco:0, entregas:0, horas:0, rodando_agora:0};
  l.forEach(function(m){

// === 🧪 PROVA REAL — sistema (lacrado) × planilha deles × Pix que saiu, pessoa por dia (15/10) ===
let PV=null, PVDIA=null;
async function portaProva(){
  const r=await fetch(SB+'rpc/prova_painel',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:cdmTok()})});
  if(!r.ok){let c='';try{c=(await r.json()).code||''}catch(e){}const er=new Error('porta '+r.status);er.code=c;throw er}
  return await r.json();
}
// só o dono e a Hellen recebem resposta; para os outros a aba nem aparece
async function provaSonda(){try{PV=await portaProva();$('t_prova').style.display=''}catch(e){PV=null}}
const PR_SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function prDt(iso){const p=String(iso||'').slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]:''}
function prSem(iso){const d=new Date(String(iso).slice(0,10)+'T12:00:00');return PR_SEM[d.getDay()]||''}
function prMais(iso,n){const d=new Date(String(iso).slice(0,10)+'T12:00:00');d.setDate(d.getDate()+n);return iso_(d)}
function iso_(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
// a referência é a planilha deles (feita sem ver o sistema); o Pix entra quando não há planilha
function prCasa(x){return x.deles!=null?Number(x.deles):(x.pago!=null?Number(x.pago):null)}
function prComparavel(x){return x.nosso!=null&&prCasa(x)!=null}
// faltou de um lado: está na planilha e não no sistema, ou no sistema e em nenhum outro lugar (sem estar esperando o banco)
function prFalta(x){return x.faixa==='so na planilha'||(x.faixa==='so no sistema'&&x.pix_status!=='esperando o banco')}
function prBate(x){return x.faixa==='centavo'||x.faixa==='ate R$1'}
function prConta(x){return prComparavel(x)||prFalta(x)}
function prPorque(x){
  const w=[], dif=function(v){return Math.abs(Number(v||0))>=0.01};
  if(x.nosso!=null&&x.deles!=null){
    if(dif(x.c_entregas)) w.push('taxas das entregas: o sistema somou '+rs(Math.abs(x.c_entregas))+(x.c_entregas>0?' a mais':' a menos')+' que a planilha (sistema '+rs(x.n_taxas)+' em '+num(x.n_entregas)+' entregas, planilha '+rs(x.d_taxas)+' em '+num(x.d_entregas)+')'+(Number(x.n_entregas)===Number(x.d_entregas)?' · mesmo número de entregas: a diferença está no valor das taxas':''));
    if(dif(x.c_garantido)) w.push('garantido: o sistema deu '+rs(Math.abs(x.c_garantido))+(x.c_garantido>0?' a mais':' a menos')+' que a planilha'+(x.n_fonte?' · '+esc(x.n_fonte):''));
    if(dif(x.c_lanche)) w.push('lanche cobrado pelo sistema: '+rs(Math.abs(x.c_lanche)));
    if(dif(x.c_ajustes)) w.push('ajuste lançado no sistema: '+rs(x.c_ajustes));
    if(dif(x.c_desconto)) w.push('a planilha descontou '+rs(x.c_desconto)+' (refrigerante, pedido não achado ou corrida em dobro)');
  }
  if(x.deles!=null&&x.pago!=null&&dif(x.dif_dp)) w.push('o Pix saiu '+rs(Math.abs(x.dif_dp))+(x.dif_dp>0?' a menos':' a mais')+' que a planilha (desconto ou acerto feito na hora de pagar)');
  if(x.nosso!=null&&x.deles==null&&x.pago!=null) w.push('a planilha deste dia não foi lida: comparado direto com o Pix');
  if(x._acerto) w.push('parece acerto com o dia '+prDt(x._acerto)+': lá a diferença é do mesmo valor, ao contrário — somando os dois dias, bate');
  if(x.mudou_depois) w.push('o número do sistema mudou depois que a planilha chegou: à noite, antes da planilha, era '+rs(x.nosso_antes)+' (entrou entrega, escala ou ajuste depois)');
  if(/^sem dono: /.test(String(x.pessoa||''))) w.push('não sei de quem é '+(x.deles!=null?'esta linha da planilha':'este Pix')+': a Hellen precisa dizer quem é (pode ser alguém com outro nome no banco)');
  else if(x.nosso==null) w.push(x.deles!=null?'só na planilha: o sistema não tem entrega dele neste dia (nome diferente ou TrackEat sem dado)':'só no Pix: o sistema e a planilha não têm esta pessoa neste dia (pode ser acerto, parcela, outro dia ou planilha não lida)');
  if(x.nosso!=null&&x.deles==null&&x.pago==null&&x.pix_status!=='esperando o banco') w.push('só no sistema: não está na planilha nem no Pix deste dia');
  return w;
}
function prComanda(x,i){
  const casa=prCasa(x), d=(x.nosso!=null&&casa!=null)?Math.round((Number(x.nosso)-casa)*100)/100:null;
  let h='<div class="pg-tk" style="animation-delay:'+Math.min(i*35,500)+'ms">'+
    '<div class="pg-nome">'+esc(String(x.pessoa||'').replace(/^sem dono: /,'❓ '))+'</div>'+
    '<div class="pg-hora">'+esc(x.lojas||'')+(x.lacre_tipo?' · lacre '+esc(String(x.lacre_tipo).toLowerCase()):'')+'</div><hr class="pg-corte">';
  h+=pgLn('sistema (lacrado)',x.nosso!=null?pgV(x.nosso):'—','forte');
  if(x.mudou_depois) h+=pgLn('· antes da planilha',pgV(x.nosso_antes),'fraco');
  h+=pgLn('planilha deles',x.deles!=null?pgV(x.deles):'—',x.deles==null?'fraco':'');
  h+=pgLn('Pix que saiu',x.pago!=null?pgV(x.pago):(x.pix_status==='esperando o banco'?'esperando':'—'),x.pago==null?'fraco':'');
  h+='<hr class="pg-corte"><div class="pg-total"><span class="k">Diferença</span><span class="v" style="font-size:26px">'+
     (d==null?(prFalta(x)?'falta':'—'):(Math.abs(d)<0.01?'<span class="pr-ok">bate</span>':(d>0?'+':'−')+pgV(Math.abs(d))))+'</span></div>';
  if(d!=null&&Math.abs(d)>=0.01) h+='<div class="pg-obs">'+(d>0?'o sistema pagaria a mais':'o sistema pagaria a menos')+(x.deles!=null?' que a planilha':' que o Pix')+'</div>';
  const w=prPorque(x);
  if(w.length&&!(d!=null&&Math.abs(d)<0.01&&x.faixa==='centavo'&&!x.mudou_depois)) h+='<div class="pr-why">'+w.map(function(t){return '<div>'+t+'</div>'}).join('')+'</div>';
  if(x.pix&&x.pix.length) h+='<details class="pg-det"><summary>ver o Pix</summary><div>'+x.pix.map(function(p){return esc(prDt(p.data))+' · '+esc(p.nome)+' · '+rs(p.valor)+' · '+esc(p.conta)}).join('<br>')+'</div></details>';
  return h+'</div>';
}

    fita+='<div class="pr-can '+cls+(PVDIA===dia?' on':'')+'"'+(cls==='fut'?'':' onclick="PVDIA=\''+dia+'\';viewProva()"')+'>'+esc(PR_SEM[new Date(dia+'T12:00:00').getDay()].slice(0,3))+'<b>'+prDt(dia)+'</b><div class="s">'+st+'</div></div>';

async function puxaAgora(){
  try{
    if(!AG)$('conteudo').innerHTML='<div class="empty">Carregando o dia de hoje…</div>';
    AG=await portaAgora();
    viewAgora();
    if(!AGT)AGT=setInterval(function(){if(VIEW==='ag')puxaAgora()},60000);
  }catch(e){
    $('conteudo').innerHTML='<div class="c">Não deu para carregar o quadro ao vivo. Entre no portal de novo e tente outra vez.</div>';
  }
}
function viewAgora(){
  if(!AG){puxaAgora();return}
  const l=soDaLoja(AG.linhas), t=(LOJA? somaTotais(l) : (AG.totais||{})), p=soDaLoja(AG.no_patio);
  let h='<div class="c"><div class="hs" style="margin:0"><b>🔴 AO VIVO — hoje, '+esc(AG.dia_texto)+'</b> ('+esc(AG.dia_semana)+') · '+(AG.fim_de_semana?'R$ 25 a hora':'R$ 20 a hora')+' · atualiza sozinho a cada minuto · lido '+esc(AG.agora)+'</div></div>';
  if(p.length){
    h+='<div class="c"><b>🛵 Quem está com o aplicativo ligado neste minuto</b><div class="wrap"><table><tr><th>Loja</th><th>Motoboy</th><th>Onde está</th><th>Distância da loja</th><th>Situação</th><th>Visto</th></tr>';
    p.forEach(function(x){
      const onde = x.no_patio ? '<span style="color:#4ade80">🟢 no pátio</span>' : (x.dist_loja_m!==null&&x.dist_loja_m<3000 ? '<span style="color:#fbbf24">🛵 na rua</span>' : '<span style="opacity:.6">⚪ longe</span>');
      h+='<tr><td>'+esc(x.unidade)+'</td><td>'+esc(x.entregador)+'</td><td>'+onde+'</td>'+
         '<td>'+(x.dist_loja_m===null?'—':(x.dist_loja_m<1000?x.dist_loja_m+' m':(x.dist_loja_m/1000).toFixed(1)+' km'))+'</td>'+
         '<td>'+(x.na_fila?'na fila':(x.disponivel?'disponível':'indisponível'))+'</td><td>'+esc(x.visto)+'</td></tr>';
    });
    h+='</table></div></div>';
  }else{
    h+='<div class="c empty">Ninguém com o aplicativo ligado neste minuto.</div>';
  }
  h+=botoesLoja(AG);
  h+=totaisTxt(t,true);
  h+=semDono(AG,true);
  if(l.length){
    h+='<div class="c"><b>💰 Quanto já vale o dia de hoje, se fechasse agora</b></div>';
    h+=cabecalho();
    l.forEach(function(m,i){h+=linhaMoto(m,i,true)});
    h+='</table></div>';
  }else{
    h+='<div class="c empty">Nenhuma entrega registrada hoje ainda.</div>';
  }
  h+='<div class="hs">Este quadro é <b>parcial</b>: o turno ainda não fechou. A hora conta da chegada no pátio até a última entrega <b>até agora</b>, então o valor sobe conforme o motoboy entrega. O corte de almoço e garantido já vale, porque o atraso na chegada já aconteceu.</div>';
  $('conteudo').innerHTML=h;
}

/* ===== porta unica do portal ===== */
// dentro do Resolver (embed) também entra quem tem o Resolver; a porta do banco é quem barra de verdade
const CDMMODS=(new URLSearchParams(location.search).get('embed')==='1')?['pagamento','resolver']:['pagamento'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'pagamento'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  try{sessionStorage.setItem('cdm_admin',j.admin?'1':'0')}catch(e){}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(!ok)return;try{$('p_sem').parentElement.style.display='none'}catch(e){}var qs=new URLSearchParams(location.search);if(qs.get('aba')==='dup'){try{$('de').value=new Date(Date.now()-21*864e5).toISOString().slice(0,10)}catch(e){}if(qs.get('embed')==='1'){try{document.querySelector('.top').style.display='none';document.querySelector('.tabs').style.display='none'}catch(e){}}setView('dup');return}if(qs.get('embed')==='1'){try{document.querySelector('.top').style.display='none';document.querySelector('.tabs').style.display='none'}catch(e){}if(qs.get('loja')!==null)LOJA=qs.get('loja');}else{provaSonda()}if(qs.get('aba')==='prova'&&qs.get('embed')!=='1'){setView('prova');return}setView('pagar');});
</script>
