<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Minha Agenda · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500;--pess:#6aa9e6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;padding:14px;font-size:15px}
h1{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:.5px;color:var(--brand);text-transform:uppercase}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.rel{color:var(--muted);font-size:13px}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--s2);color:var(--text2);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--brand)}
button.ok{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.abas{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.aba.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.bloco{margin-bottom:18px}
.btit{font-family:'Barlow Condensed',sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:0 0 8px 2px;display:flex;gap:8px;align-items:center}
.btit .qt{color:var(--muted);font-size:13px;font-family:'Barlow',sans-serif;letter-spacing:0}
.bloco.perigo .btit{color:var(--bad)}
.it{display:flex;gap:10px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.it.atrasado{border-left:4px solid var(--bad)}
.it.hoje{border-left:4px solid var(--brand)}
.it.feita{opacity:.5}
.chk{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--s2);color:var(--muted);font-size:15px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.corpo{flex:1 1 auto;min-width:0}
.tit{font-weight:600;line-height:1.35;word-break:break-word}
.it.feita .tit{text-decoration:line-through}
.linha2{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--text2);background:var(--s2);white-space:nowrap}
.pill.hora{color:var(--brand);border-color:var(--brand)}
.pill.atraso{color:var(--bad);border-color:var(--bad);font-weight:700}
.pill.urg{color:var(--bad);border-color:var(--bad)}
.pill.g{color:var(--pess);border-color:var(--pess)}
.pill.cli{cursor:pointer}
.pill.cli:hover{border-color:var(--brand);color:var(--brand)}
.obs{margin-top:6px;color:var(--text2);font-size:13px;line-height:1.45;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;white-space:pre-wrap}
.acoes{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.acoes button{font-size:12px;padding:4px 9px}
.vazio{color:var(--muted);padding:16px;text-align:center}
.nota{color:var(--muted);font-size:13px;line-height:1.5;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;z-index:50}
.modalcx{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:520px;margin-top:24px}
.mtit{font-family:'Anton',sans-serif;font-size:20px;color:var(--brand);text-transform:uppercase;margin-bottom:10px}
.lb{display:block;color:var(--muted);font-size:13px;margin:10px 0 4px}
.modalcx input,.modalcx select,.modalcx textarea{width:100%;font-family:inherit;font-size:14px;background:var(--s2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.mbt{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.mnota{color:var(--muted);font-size:12px;line-height:1.5;margin-top:6px}
.mbad{color:var(--bad);font-size:13px;margin-top:8px}
.duo{display:flex;gap:8px}
.duo>div{flex:1 1 0;min-width:0}
</style>
</head>
<body>
<div class="top">
  <h1>✅ Minha Agenda</h1>
  <div>
    <button class="ok" onclick="abreNova()">➕ Escrever</button>
    <button onclick="boot()">↻ Atualizar</button>
  </div>
</div>
<div class="rel" id="rel">Carregando…</div>
<div class="abas" id="abas"></div>
<div id="app">Carregando…</div>
<div id="mod"></div>
<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let D=null, ESF='trabalho';

async function porta(acao,dados){
  const r=await fetch(SB+'rpc/agenda_consulta',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:cdmTok(),p_acao:acao,p_dados:dados||{}})});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}
function diaMais(d,n){
  var p=String(d).split('-');
  var x=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  x.setDate(x.getDate()+n);
  var m=String(x.getMonth()+1); if(m.length<2)m='0'+m;
  var g=String(x.getDate()); if(g.length<2)g='0'+g;
  return x.getFullYear()+'-'+m+'-'+g;
}
function br(d){ if(!d)return ''; var p=String(d).split('-'); return p[2]+'/'+p[1]; }
function diaDaSemana(d){
  var N=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  var p=String(d).split('-');
  return N[new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getDay()];
}
function quandoDe(it){ return it.dia_quando || it.prazo || null; }

function grupo(it){
  if(it.status==='feita')return 'feito';
  var d=quandoDe(it);
  if(!d)return 'semdata';
  if(d<D.hoje)return 'atrasado';
  if(d===D.hoje)return 'hoje';
  if(d<=diaMais(D.hoje,7))return 'semana';
  return 'depois';
}
function itemHtml(it){
  var g=grupo(it);
  var cls='it'+(g==='atrasado'?' atrasado':'')+(g==='hoje'?' hoje':'')+(it.status==='feita'?' feita':'');
  var h='<div class="'+cls+'">';
  h+='<button class="chk'+(it.status==='feita'?' on':'')+'" title="Marcar como feito" onclick="check('+it.id+')">'+(it.status==='feita'?'✓':'')+'</button>';
  h+='<div class="corpo"><div class="tit">'+esc(it.titulo)+'</div>';
  h+='<div class="linha2">';
  if(it.hora_quando){ h+='<span class="pill hora">🕒 '+br(it.dia_quando)+' às '+esc(it.hora_quando)+'</span>'; }
  else if(it.prazo){ h+='<span class="pill hora">📅 até '+br(it.prazo)+'</span>'; }
  if(g==='atrasado'){
    var d=quandoDe(it);
    h+='<span class="pill atraso">passou '+br(d)+'</span>';
  }
  if(it.prioridade==='urgente'){ h+='<span class="pill urg">urgente</span>'; }
  h+='<span class="pill cli" title="Trocar entre trabalho e pessoal" onclick="viraEsfera('+it.id+",'"+(it.esfera==='pessoal'?'trabalho':'pessoal')+"')\">"+(it.esfera==='pessoal'?'🏠 pessoal':'💼 trabalho')+'</span>';
  if(it.area){ h+='<span class="pill">'+esc(it.area)+'</span>'; }
  if(it.no_google){ h+='<span class="pill g">no Google</span>'; }
  if(!quandoDe(it) && it.dias_parada>0){ h+='<span class="pill">parada há '+it.dias_parada+' dia'+(it.dias_parada>1?'s':'')+'</span>'; }
  h+='</div>';
  if(it.detalhe){ h+='<div class="obs">'+esc(it.detalhe)+'</div>'; }
  if(it.observacao){ h+='<div class="obs">📝 '+esc(it.observacao)+'</div>'; }
  h+='<div class="acoes">';
  h+='<button onclick="abreObs('+it.id+')">📝 Observação</button>';
  h+='<button onclick="abreEdita('+it.id+')">🕒 Marcar dia e hora</button>';
  h+='<button onclick="arquiva('+it.id+')">🗑 Tirar da lista</button>';
  h+='</div></div></div>';
  return h;
}
function desenha(){
  if(!D){return}
  var itens=(D.itens||[]).filter(function(x){ return ESF==='tudo' ? true : x.esfera===ESF; });
  $('abas').innerHTML=
    ['trabalho','pessoal','tudo'].map(function(k){
      var n=(D.itens||[]).filter(function(x){return (k==='tudo'||x.esfera===k) && x.status!=='feita'}).length;
      var r={trabalho:'💼 Trabalho',pessoal:'🏠 Pessoal',tudo:'📋 Tudo'}[k];
      return '<button class="aba'+(ESF===k?' on':'')+'" onclick="trocaEsf(\''+k+'\')">'+r+' ('+n+')</button>';
    }).join('');
  var G={atrasado:[],hoje:[],semana:[],depois:[],semdata:[],feito:[]};
  itens.forEach(function(x){ G[grupo(x)].push(x) });
  var T=[
    ['atrasado','🔴 Passou da hora','perigo'],
    ['hoje','📌 Hoje — '+diaDaSemana(D.hoje)+', '+br(D.hoje),''],
    ['semana','🗓 Os próximos 7 dias',''],
    ['depois','⏳ Mais para frente',''],
    ['semdata','📋 Sem data marcada',''],
    ['feito','✅ Feito hoje','']
  ];
  var h='';
  T.forEach(function(t){
    var L=G[t[0]];
    if(!L.length)return;
    h+='<div class="bloco '+t[2]+'"><div class="btit">'+t[1]+' <span class="qt">'+L.length+'</span></div>';
    h+=L.map(itemHtml).join('');
    h+='</div>';
  });
  if(!h){ h='<div class="card vazio">Nada aqui. Clique em ➕ Escrever para colocar a primeira coisa.</div>'; }
  h+='<div class="nota">Esta tela é só sua — ninguém mais do portal enxerga. O que tem <b>dia e hora</b> vira compromisso no seu Google Agenda e toca alarme no celular. O que só tem prazo fica aqui. Os lembretes que se repetem todo dia continuam no Google e não aparecem nesta lista.</div>';
  $('app').innerHTML=h;
}
function trocaEsf(k){ ESF=k; desenha(); }

async function check(id){ try{ await porta('check',{id:id}); await boot(); }catch(e){ alert('Não deu para marcar. Tente de novo.'); } }
async function arquiva(id){ if(!confirm('Tirar esta linha da lista? Ela some daqui, mas fica guardada.'))return; try{ await porta('arquivar',{id:id}); await boot(); }catch(e){ alert('Não deu para tirar.'); } }
async function viraEsfera(id,nova){ try{ await porta('esfera',{id:id,esfera:nova}); await boot(); }catch(e){ alert('Não deu para trocar.'); } }

function abre(h){ $('mod').innerHTML='<div class="modal" onclick="if(event.target===this)fecha()"><div class="modalcx">'+h+'</div></div>'; }
function fecha(){ $('mod').innerHTML=''; }
function acha(id){ return (D.itens||[]).filter(function(x){return x.id===id})[0]||null; }

function abreObs(id){
  var it=acha(id); if(!it)return;
  abre('<div class="mtit">Observação</div><div class="lb">'+esc(it.titulo)+'</div>'+
    '<textarea id="f-obs" rows="4" placeholder="Escreva o que quiser lembrar sobre isso">'+esc(it.observacao||'')+'</textarea>'+
    '<div class="mbt"><button class="ok" onclick="salvaObs('+id+')">Salvar</button><button onclick="fecha()">Fechar</button></div>'+
    '<div id="f-msg" class="mbad"></div>');
}
async function salvaObs(id){
  try{ await porta('obs',{id:id,observacao:$('f-obs').value}); fecha(); await boot(); }
  catch(e){ $('f-msg').textContent='Não deu para salvar.'; }
}
function abreEdita(id){
  var it=acha(id); if(!it)return;
  var dh=(it.dia_quando&&it.hora_quando)?(it.dia_quando+'T'+it.hora_quando):'';
  abre('<div class="mtit">Dia e hora</div><div class="lb">'+esc(it.titulo)+'</div>'+
    '<label class="lb">Compromisso com hora marcada (vai para o Google e toca alarme)</label>'+
    '<input type="datetime-local" id="f-q" value="'+esc(dh)+'">'+
    '<label class="lb">Ou só um prazo, sem hora</label>'+
    '<input type="date" id="f-p" value="'+esc(it.prazo||'')+'">'+
    '<label class="lb">Onde</label><input type="text" id="f-l" value="'+esc(it.local||'')+'" placeholder="Ex.: Água Verde, escritório, online">'+
    '<div class="mbt"><button class="ok" onclick="salvaEdita('+id+')">Salvar</button><button onclick="fecha()">Fechar</button></div>'+
    '<div class="mnota">Deixe em branco para tirar a data. Compromisso novo com hora só aparece no celular na próxima rodada do robô — não é na hora.</div>'+
    '<div id="f-msg" class="mbad"></div>');
}
async function salvaEdita(id){
  try{
    await porta('editar',{id:id,quando:$('f-q').value,prazo:$('f-p').value,local:$('f-l').value});
    fecha(); await boot();
  }catch(e){ $('f-msg').textContent='Não deu para salvar.'; }
}
function abreNova(){
  abre('<div class="mtit">Escrever na agenda</div>'+
    '<label class="lb">O que é</label><input type="text" id="n-t" placeholder="Ex.: marcar o advogado Fernando Mocelin">'+
    '<label class="lb">Detalhe (opcional)</label><textarea id="n-d" rows="2"></textarea>'+
    '<div class="duo"><div><label class="lb">É de quê</label><select id="n-e"><option value="trabalho">💼 Trabalho</option><option value="pessoal">🏠 Pessoal</option></select></div>'+
    '<div><label class="lb">Pressa</label><select id="n-pr"><option value="normal">Normal</option><option value="urgente">Urgente</option><option value="quando_der">Quando der</option></select></div></div>'+
    '<label class="lb">Dia e hora (se for compromisso)</label><input type="datetime-local" id="n-q">'+
    '<label class="lb">Ou só o prazo (se não tem hora)</label><input type="date" id="n-p">'+
    '<label class="lb">Onde (opcional)</label><input type="text" id="n-l">'+
    '<div class="mbt"><button class="ok" onclick="salvaNova()">Guardar</button><button onclick="fecha()">Fechar</button></div>'+
    '<div class="mnota">Com dia e hora, vira compromisso no seu Google Agenda e toca alarme no celular. Sem hora, fica só nesta lista.</div>'+
    '<div id="f-msg" class="mbad"></div>');
}
async function salvaNova(){
  var t=($('n-t').value||'').trim();
  if(!t){ $('f-msg').textContent='Escreva o que é.'; return; }
  try{
    await porta('nova',{titulo:t,detalhe:$('n-d').value,esfera:$('n-e').value,prioridade:$('n-pr').value,
      quando:$('n-q').value,prazo:$('n-p').value,local:$('n-l').value,area:'Eu escrevi'});
    fecha(); await boot();
  }catch(e){ $('f-msg').textContent='Não deu para guardar.'; }
}
async function boot(){
  try{
    D=await porta('listar',{});
    var ab=(D.itens||[]).filter(function(x){return x.status!=='feita'}).length;
    $('rel').textContent=ab+' coisa'+(ab===1?'':'s')+' em aberto · agora '+(D.agora||'');
    desenha();
  }catch(e){
    $('app').innerHTML='<div class="card">Não deu para carregar. Entre no portal de novo e tente outra vez.</div>';
    $('rel').textContent='';
  }
}
/* ===== porta unica do portal ===== */
const CDMMODS=['agenda'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'agenda'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(!ok)return;boot();});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
