<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Minha Agenda · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--pess:#5aa2e8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;padding:14px;font-size:15px}
h1{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:.5px;color:var(--brand);text-transform:uppercase}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.rel{color:var(--muted);font-size:13px}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--s2);color:var(--text2);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--brand)}
button.ok{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 8px}
.nav{display:flex;gap:6px;align-items:center}
.mes{font-family:'Anton',sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.5px;min-width:190px;text-align:center}
.leg{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.bola{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.bola.t{background:var(--brand)}
.bola.p{background:var(--pess)}
.abas{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.aba.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.aba.nb{border-color:var(--bad);color:var(--bad);font-weight:700}
.aba.nb.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.bq{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;opacity:.85}
.dias{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.diab{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:8px 10px;min-width:86px;text-align:center;cursor:pointer;font-family:inherit}
.diab:hover{border-color:var(--brand)}
.diab.hoje{box-shadow:inset 0 0 0 2px var(--brand)}
.diab.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.diab .dnum{font-size:20px;font-weight:700;line-height:1}
.diab .dsem{font-size:11px;color:var(--muted);text-transform:uppercase}
.diab .dqt{font-size:11px;color:var(--text2);margin-top:4px}
.diab .dat{font-size:11px;color:var(--bad);font-weight:700}
.diab.on .dsem,.diab.on .dqt{color:var(--brand-ink)}
.diab.vz:not(.on):not(.hoje){opacity:.5}
.diab.fds:not(.on){background:#161615}
.lista{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-top:6px}
.ltit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.tr{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tr:last-child{border-bottom:0}
.tr .ck{flex:0 0 auto;width:30px;height:30px;padding:0;border-radius:8px;font-size:15px;line-height:1}
.tr.feita .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.tr .tx{flex:1 1 auto;min-width:0;cursor:pointer}
.tr .tx:hover .tt{color:var(--brand)}
.tr .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.feita .tt{text-decoration:line-through;color:var(--muted)}
.tr .sb{color:var(--muted);font-size:12px}
.tr .sb.bad{color:var(--bad);font-weight:600}
.tr .d{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:0 0 auto}
.tr .d.p{background:var(--pess)}
.grp{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:10px 0 2px}
.cx{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px}
.vazio{color:var(--muted);padding:10px 0;font-size:14px}
.nota{color:var(--muted);font-size:13px;line-height:1.5;margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;z-index:50}
.modalcx{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:520px;margin-top:24px}
.mtit{font-family:'Anton',sans-serif;font-size:20px;color:var(--brand);text-transform:uppercase;margin-bottom:10px;line-height:1.2}
.lb{display:block;color:var(--muted);font-size:13px;margin:10px 0 4px}
.modalcx input,.modalcx select,.modalcx textarea{width:100%;font-family:inherit;font-size:14px;background:var(--s2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.mbt{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mnota{color:var(--muted);font-size:12px;line-height:1.5;margin-top:8px}
.mbad{color:var(--bad);font-size:13px;margin-top:8px}
.duo{display:flex;gap:8px}
.duo>div{flex:1 1 0;min-width:0}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--text2);background:var(--s2);white-space:nowrap;display:inline-block;margin:0 6px 6px 0}
.pill.t{color:var(--brand);border-color:var(--brand)}
.pill.p{color:var(--pess);border-color:var(--pess)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.obs{color:var(--text2);font-size:13px;line-height:1.45;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:8px;white-space:pre-wrap}
@media(max-width:640px){
  body{padding:9px}
  .mes{font-size:17px;min-width:150px}
  .diab{min-width:64px;padding:6px 7px}
  .diab .dnum{font-size:17px}
}
</style>
</head>
<body>
<div class="top">
  <h1>✅ Minha Agenda</h1>
  <div>
    <button class="ok" onclick="abreNova('')">➕ Escrever</button>
    <button onclick="boot()">↻ Atualizar</button>
  </div>
</div>
<div class="rel" id="rel">Carregando…</div>

<div class="barra">
  <div class="nav">
    <button onclick="andaMes(-1)">◀</button>
    <div class="mes" id="mes">—</div>
    <button onclick="andaMes(1)">▶</button>
    <button onclick="voltaHoje()">Hoje</button>
  </div>
  <div class="leg">
    <span><span class="bola t"></span>trabalho</span>
    <span><span class="bola p"></span>pessoal</span>
    <span>clique num dia para ver as tarefas dele</span>
  </div>
</div>

<div id="app">Carregando…</div>
<div id="mod"></div>
<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let D=null, ANO=0, MES=0;

async function porta(acao,dados){
  const r=await fetch(SB+'rpc/agenda_consulta',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:cdmTok(),p_acao:acao,p_dados:dados||{}})});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}
function dd(n){ var s=String(n); return s.length<2?('0'+s):s; }
function br(s){ if(!s)return ''; var p=String(s).split('-'); return p[2]+'/'+p[1]; }
function quandoDe(it){ return it.dia_quando || it.prazo || null; }

function porDia(){
  var M={};
  (D.itens||[]).forEach(function(x){
    var d=quandoDe(x);
    if(!d)return;
    if(!M[d])M[d]=[];
    M[d].push(x);
  });
  Object.keys(M).forEach(function(k){
    M[k].sort(function(a,b){ return String(a.hora_quando||'99:99').localeCompare(String(b.hora_quando||'99:99')); });
  });
  return M;
}
const SEMANA=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
let VER='';   // 'dia:AAAA-MM-DD' | 'mes' | 'atras' | 'sem'
let ABRIU=false; // so na primeira abertura: dia de hoje vazio e com atrasadas -> abre nas Atrasadas
function atrasada(x){ var q=quandoDe(x); return x.status!=='feita' && q && q<D.hoje; }
function linha(x,mostraDia){
  var fe=(x.status==='feita'), q=quandoDe(x);
  var sub=[];
  if(mostraDia&&q)sub.push(br(q));
  if(x.hora_quando)sub.push(esc(x.hora_quando));
  else if(x.prazo)sub.push('prazo');
  if(x.local)sub.push(esc(x.local));
  if(x.prioridade==='urgente')sub.push('urgente');
  if(!q&&!fe)sub.push(x.dias_parada>0?(x.dias_parada+'d parada'):'escrita hoje');
  var at=atrasada(x);
  return '<div class="tr'+(fe?' feita':'')+'">'
    +'<button class="ck" title="'+(fe?'Desmarcar':'Já fiz')+'" onclick="check('+x.id+')">'+(fe?'✓':'')+'</button>'
    +'<span class="d'+(x.esfera==='pessoal'?' p':'')+'"></span>'
    +'<div class="tx" onclick="abreItem('+x.id+')"><div class="tt">'+esc(x.titulo)+'</div>'
    +(sub.length?'<div class="sb'+(at?' bad':'')+'">'+(at?'atrasada · ':'')+sub.join(' · ')+'</div>':'')
    +'</div></div>';
}
function ordHora(a,b){ return String(a.hora_quando||'99:99').localeCompare(String(b.hora_quando||'99:99')); }
function desenhaMes(){
  $('mes').textContent=MESES[MES]+' '+ANO;
  var M=porDia();
  var pref=ANO+'-'+dd(MES+1)+'-';
  var todos=D.itens||[];
  var atras=todos.filter(atrasada).sort(function(a,b){ return String(quandoDe(a)).localeCompare(String(quandoDe(b))); });
  var sem=todos.filter(function(x){ return x.status!=='feita' && !quandoDe(x); })
            .sort(function(a,b){ return (b.dias_parada||0)-(a.dias_parada||0); });
  var nMes=todos.filter(function(x){ var q=quandoDe(x); return q && q.indexOf(pref)===0; }).length;
  if(!VER || (VER.indexOf('dia:')===0 && VER.slice(4,12)!==pref)){ VER=(D.hoje.indexOf(pref)===0)?('dia:'+D.hoje):'mes'; }
  if(VER==='dia:'+D.hoje && !(M[D.hoje]||[]).length && atras.length && !ABRIU){ VER='atras'; }
  ABRIU=true;

  var h='<div class="abas">';
  h+='<button class="aba nb'+(VER==='atras'?' on':'')+'" onclick="ver(\'atras\')">🔴 Atrasadas<span class="bq">'+atras.length+'</span></button>';
  h+='<button class="aba'+(VER==='sem'?' on':'')+'" onclick="ver(\'sem\')">📋 Sem data<span class="bq">'+sem.length+'</span></button>';
  h+='<button class="aba'+(VER==='mes'?' on':'')+'" onclick="ver(\'mes\')">Ver o mês inteiro<span class="bq">'+nMes+'</span></button>';
  h+='</div>';

  var dias=[], nDias=new Date(ANO,MES+1,0).getDate();
  for(var i=1;i<=nDias;i++)dias.push(pref+dd(i));
  h+='<div class="dias">';
  dias.forEach(function(k){
    var L=M[k]||[], p=k.split('-');
    var ab=L.filter(function(x){return x.status!=='feita'}).length;
    var fe=L.length-ab, at=(k<D.hoje)?ab:0;
    var ehHoje=(k===D.hoje), dw=new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getDay();
    h+='<button class="diab'+(VER==='dia:'+k?' on':'')+(ehHoje?' hoje':'')+(L.length?'':' vz')+((dw===0||dw===6)?' fds':'')+'" onclick="ver(\'dia:'+k+'\')">'
      +'<div class="dnum">'+Number(p[2])+'</div>'
      +'<div class="dsem">'+SEMANA[dw].slice(0,3)+(ehHoje?' · hoje':'')+'</div>'
      +(at?'<div class="dat">'+at+' atrasada'+(at===1?'':'s')+'</div>'
          :'<div class="dqt">'+(L.length?(ab+(ab===1?' tarefa':' tarefas')+(fe?' · '+fe+' ✓':'')):'livre')+'</div>')
      +'</button>';
  });
  h+='</div>';

  var tit, L, mostraDia=false, novoDia='';
  if(VER==='atras'){ tit='🔴 Atrasadas — passou o dia e não foi feita'; L=atras; mostraDia=true; }
  else if(VER==='sem'){ tit='📋 Sem data marcada'; L=sem; }
  else if(VER==='mes'){ tit='Tudo de '+MESES[MES]; mostraDia=true;
    L=todos.filter(function(x){ var q=quandoDe(x); return q && q.indexOf(pref)===0; })
      .sort(function(a,b){ var c=String(quandoDe(a)).localeCompare(String(quandoDe(b))); return c||ordHora(a,b); }); }
  else { novoDia=VER.slice(4); var p=novoDia.split('-');
    tit=(novoDia===D.hoje?'Hoje, ':'')+SEMANA[new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getDay()]+' '+br(novoDia);
    L=(M[novoDia]||[]).slice(); }
  var abL=L.filter(function(x){return x.status!=='feita'}), feL=L.filter(function(x){return x.status==='feita'});
  h+='<div class="lista"><div class="ltit"><span>'+tit+'</span>'
    +(VER.indexOf('dia:')===0?'<button onclick="abreNova(\''+novoDia+'\')">➕ Escrever neste dia</button>':'')+'</div>';
  if(!L.length){ h+='<div class="vazio">'+(VER==='atras'?'Nada atrasado. Bom sinal.':VER==='sem'?'Nada solto.':'Nenhuma tarefa aqui.')+'</div>'; }
  abL.forEach(function(x){ h+=linha(x,mostraDia); });
  if(feL.length){ h+='<div class="grp">Feitas hoje</div>'; feL.forEach(function(x){ h+=linha(x,mostraDia); }); }
  h+='</div>';

  h+='<div class="nota">Esta tela é só sua — ninguém mais do portal enxerga. <b>Bolinha dourada é trabalho, azul é pessoal.</b> Clique num dia para ver as tarefas dele; o quadrado da esquerda marca como feita; clique no nome para abrir, mudar o dia ou anotar. O que tem dia e hora vira compromisso no seu Google Agenda e toca alarme no celular; o que só tem prazo fica aqui. Os lembretes que se repetem todo dia continuam no Google e não entram nesta lista. Tarefa feita só aparece aqui no dia em que foi marcada.</div>';
  $('app').innerHTML=h;
}
function ver(v){ VER=v; desenhaMes(); }
function andaMes(n){ MES+=n; if(MES>11){MES=0;ANO++;} if(MES<0){MES=11;ANO--;} VER=''; desenhaMes(); }
function voltaHoje(){ var p=D.hoje.split('-'); ANO=Number(p[0]); MES=Number(p[1])-1; VER='dia:'+D.hoje; desenhaMes(); }

function abre(h){ $('mod').innerHTML='<div class="modal" onclick="if(event.target===this)fecha()"><div class="modalcx">'+h+'</div></div>'; }
function fecha(){ $('mod').innerHTML=''; }
function acha(id){ return (D.itens||[]).filter(function(x){return x.id===id})[0]||null; }

function abreItem(id){
  var it=acha(id); if(!it)return;
  var q=it.hora_quando?(br(it.dia_quando)+' às '+it.hora_quando):(it.prazo?('até '+br(it.prazo)):'sem data');
  var dh=(it.dia_quando&&it.hora_quando)?(it.dia_quando+'T'+it.hora_quando):'';
  var h='<div class="mtit">'+esc(it.titulo)+'</div>';
  h+='<div><span class="pill '+(it.esfera==='pessoal'?'p':'t')+'">'+(it.esfera==='pessoal'?'🏠 pessoal':'💼 trabalho')+'</span>';
  h+='<span class="pill">🕒 '+esc(q)+'</span>';
  if(it.area){ h+='<span class="pill">'+esc(it.area)+'</span>'; }
  if(it.prioridade==='urgente'){ h+='<span class="pill bad">urgente</span>'; }
  if(it.no_google){ h+='<span class="pill">no Google</span>'; }
  h+='</div>';
  if(it.detalhe){ h+='<div class="obs">'+esc(it.detalhe)+'</div>'; }
  h+='<label class="lb">Sua observação</label><textarea id="f-obs" rows="2">'+esc(it.observacao||'')+'</textarea>';
  h+='<label class="lb">Dia e hora (vai para o Google e toca alarme)</label><input type="datetime-local" id="f-q" value="'+esc(dh)+'">';
  h+='<label class="lb">Ou só um prazo, sem hora</label><input type="date" id="f-p" value="'+esc(it.prazo||'')+'">';
  h+='<label class="lb">Onde</label><input type="text" id="f-l" value="'+esc(it.local||'')+'">';
  h+='<div class="mbt"><button class="ok" onclick="salvaItem('+id+')">Salvar</button>';
  h+='<button onclick="check('+id+')">'+(it.status==='feita'?'↩ Desmarcar':'✓ Já fiz')+'</button>';
  h+='<button onclick="viraEsfera('+id+",'"+(it.esfera==='pessoal'?'trabalho':'pessoal')+"')\">"+(it.esfera==='pessoal'?'💼 Virar trabalho':'🏠 Virar pessoal')+'</button>';
  h+='<button onclick="arquiva('+id+')">🗑 Tirar</button>';
  h+='<button onclick="fecha()">Fechar</button></div>';
  h+='<div class="mnota">Compromisso novo com hora só aparece no celular na próxima rodada do robô, não na hora.</div>';
  h+='<div id="f-msg" class="mbad"></div>';
  abre(h);
}
async function salvaItem(id){
  try{
    await porta('obs',{id:id,observacao:$('f-obs').value});
    await porta('editar',{id:id,quando:$('f-q').value,prazo:$('f-p').value,local:$('f-l').value});
    fecha(); await boot();
  }catch(e){ $('f-msg').textContent='Não deu para salvar.'; }
}
async function check(id){ try{ await porta('check',{id:id}); fecha(); await boot(); }catch(e){ alert('Não deu para marcar.'); } }
async function arquiva(id){ if(!confirm('Tirar da agenda? Some daqui, mas fica guardado.'))return; try{ await porta('arquivar',{id:id}); fecha(); await boot(); }catch(e){ alert('Não deu para tirar.'); } }
async function viraEsfera(id,nova){ try{ await porta('esfera',{id:id,esfera:nova}); fecha(); await boot(); }catch(e){ alert('Não deu para trocar.'); } }

function abreNova(dia){
  var h='<div class="mtit">Escrever na agenda</div>';
  if(dia){ h+='<div><span class="pill t">📅 '+esc(br(dia))+'</span></div>'; }
  h+='<label class="lb">O que é</label><input type="text" id="n-t" placeholder="Ex.: marcar o advogado Fernando Mocelin">';
  h+='<label class="lb">Detalhe (opcional)</label><textarea id="n-d" rows="2"></textarea>';
  h+='<div class="duo"><div><label class="lb">É de quê</label><select id="n-e"><option value="trabalho">💼 Trabalho</option><option value="pessoal">🏠 Pessoal</option></select></div>';
  h+='<div><label class="lb">Pressa</label><select id="n-pr"><option value="normal">Normal</option><option value="urgente">Urgente</option><option value="quando_der">Quando der</option></select></div></div>';
  h+='<label class="lb">Hora (se for compromisso)</label><input type="time" id="n-h">';
  h+='<label class="lb">Dia</label><input type="date" id="n-p" value="'+esc(dia||'')+'">';
  h+='<label class="lb">Onde (opcional)</label><input type="text" id="n-l">';
  h+='<div class="mbt"><button class="ok" onclick="salvaNova()">Guardar</button><button onclick="fecha()">Fechar</button></div>';
  h+='<div class="mnota">Com dia <b>e hora</b>, vira compromisso no seu Google Agenda e toca alarme no celular. Só com o dia, fica como prazo aqui na tela. Sem dia nenhum, cai na caixa "sem data marcada".</div>';
  h+='<div id="f-msg" class="mbad"></div>';
  abre(h);
}
async function salvaNova(){
  var t=($('n-t').value||'').trim();
  if(!t){ $('f-msg').textContent='Escreva o que é.'; return; }
  var d=$('n-p').value, hr=$('n-h').value;
  var quando=(d&&hr)?(d+'T'+hr):'';
  var prazo=(d&&!hr)?d:'';
  try{
    await porta('nova',{titulo:t,detalhe:$('n-d').value,esfera:$('n-e').value,prioridade:$('n-pr').value,
      quando:quando,prazo:prazo,local:$('n-l').value,area:'Eu escrevi'});
    fecha(); await boot();
  }catch(e){ $('f-msg').textContent='Não deu para guardar.'; }
}
async function boot(){
  try{
    D=await porta('listar',{});
    var ab=(D.itens||[]).filter(function(x){return x.status!=='feita'}).length;
    var pe=(D.itens||[]).filter(function(x){return x.status!=='feita' && x.esfera==='pessoal'}).length;
    $('rel').textContent=ab+' em aberto ('+(ab-pe)+' de trabalho, '+pe+' pessoais) · agora '+(D.agora||'');
    if(!ANO){ voltaHoje(); } else { desenhaMes(); }
  }catch(e){
    $('app').innerHTML='<div class="cx">Não deu para carregar. Entre no portal de novo e tente outra vez.</div>';
    $('rel').textContent='';
  }
}
/* ===== porta unica do portal ===== */
const CDMMODS=['agenda'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'agenda'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(!ok)return;boot();});
</script>
