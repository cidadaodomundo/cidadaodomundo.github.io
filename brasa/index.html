<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Brasa e Fumaça · Pedidos · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e;--ok:#2fae6a;--bad:#e66767;--warn:#c98500;--gold:#e0a81c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.res{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.k{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:12px 16px;min-width:150px}
.k .n{font-size:20px;font-weight:800}
.k .l{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:12px}
.c.perto{border-color:var(--gold)}
.c.tarde{border-color:var(--bad)}
.c .quando{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--gold)}
.c.tarde .quando{color:var(--bad)}
.c .desc{font-size:16px;font-weight:800;margin:6px 0 4px}
.c .info{color:var(--text2);font-size:13px;line-height:1.5}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-con{background:rgba(201,133,0,.15);color:var(--warn)}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.m{color:var(--muted);font-size:11.5px;margin-top:8px}
.itens{color:var(--text2);font-size:12.5px;line-height:1.6;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:16px;background:var(--s1);border:1px solid var(--line);border-radius:13px}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:16px}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:16px}
details{margin-top:16px}
summary{cursor:pointer;color:var(--text2);font-size:13px;font-weight:600;padding:6px 0}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">BF</div><div><h1>🔥 Brasa e Fumaça · Pedidos</h1><div class="sub">pedidos em aberto na loja online — o robô puxa de hora em hora</div></div></div>
  <div class="rt"><button class="b" onclick="location.reload()">↻ Atualizar</button></div>
</div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const br=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const din=v=>(v==null?'':((function(){try{return sessionStorage.getItem("cdm_admin")==="1"}catch(e){return false}})()?'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'—'));
function hojeISO(){return new Date().toLocaleDateString('sv-SE')}
function faltam(d){const n=Math.round((new Date(d+'T00:00:00')-new Date(hojeISO()+'T00:00:00'))/86400000);
  return n<0?'ATRASADO há '+(-n)+' dia'+(n<-1?'s':''):(n===0?'É HOJE':(n===1?'é amanhã':'faltam '+n+' dias'))}
async function get(q){try{const r=await fetch(SB+q,{headers:H});return r.ok?await r.json():[]}catch(e){return []}}

async function boot(){
  const d0=new Date();d0.setDate(d0.getDate()-7);
  const rows=await get('bf_pedido?select=pedido_guid,numero,cliente_nome,valor_total,qtd_itens,itens_resumo,tipo_pedido,status,origem,forma_pagamento,data_cadastro,entrega_texto,data_entrega,hora_entrega,observacao,atualizado_em&data_entrega=gte.'+d0.toLocaleDateString('sv-SE')+'&order=data_entrega.asc&limit=100');
  const hoje=hojeISO();
  const atrasados=rows.filter(r=>r.data_entrega&&r.data_entrega<hoje);
  const futuros=rows.filter(r=>!r.data_entrega||r.data_entrega>=hoje);
  const total=rows.reduce((a,r)=>a+Number(r.valor_total||0),0);
  const totalFut=futuros.reduce((a,r)=>a+Number(r.valor_total||0),0);
  let h='<div class="res">'+
    '<div class="k"><div class="n">'+rows.length+'</div><div class="l">pedidos em aberto</div></div>'+
    '<div class="k"><div class="n">'+din(total)+'</div><div class="l">valor total</div></div>'+
    '<div class="k"><div class="n">'+atrasados.length+'</div><div class="l">com entrega vencida</div></div>'+
    '<div class="k"><div class="n">'+din(totalFut)+'</div><div class="l">a entregar de hoje em diante</div></div>'+
    '</div>';
  function cartao(r,cls){
    const s=(r.status||'').toLowerCase();
    const pc=s.indexOf('cancel')>=0?'p-bad':(s.indexOf('entreg')>=0?'p-ok':'p-con');
    return '<div class="c'+cls+'"><div class="quando">'+(r.data_entrega?faltam(r.data_entrega)+' · '+br(r.data_entrega):'sem data')+(r.hora_entrega?' às '+String(r.hora_entrega).slice(0,5):'')+'</div>'+
      '<div class="desc">'+esc(r.cliente_nome||'sem cliente')+' · '+esc(r.numero||'')+'</div>'+
      '<div class="info">'+din(r.valor_total)+(r.qtd_itens?' · '+r.qtd_itens+' itens':'')+
      ' · <span class="pill '+pc+'">'+esc(r.status||'sem status')+'</span>'+
      (r.tipo_pedido?' · '+esc(r.tipo_pedido):'')+(r.origem?' · '+esc(r.origem):'')+'</div>'+
      (r.itens_resumo?'<div class="itens">'+esc(r.itens_resumo)+'</div>':'')+
      (r.observacao?'<div class="m">obs: '+esc(r.observacao)+'</div>':'')+
      '<div class="m">pedido feito em '+esc(r.data_cadastro||'')+(r.forma_pagamento?' · '+esc(r.forma_pagamento):'')+'</div></div>';
  }
  if(atrasados.length){
    h+='<h1 style="font-size:15px;margin:18px 0 8px;color:var(--bad)">⏰ entrega vencida e ainda em aberto</h1>';
    atrasados.forEach(r=>{h+=cartao(r,' tarde')});
  }
  if(!futuros.length){h+='<div class="vazio">nenhum pedido com entrega de hoje em diante</div>'}
  futuros.forEach(r=>{
    const dias=r.data_entrega?Math.round((new Date(r.data_entrega+'T00:00:00')-new Date(hoje+'T00:00:00'))/86400000):99;
    h+=cartao(r,dias<=2?' perto':'');
  });
  const q=rows.length?rows.map(r=>r.atualizado_em).sort().slice(-1)[0]:null;
  h+='<div class="aviso">Tela alimentada pela loja online da Brasa e Fumaça (Epadoca), de hora em hora. Só aparecem pedidos EM ABERTO — quando a equipe baixa o pedido lá, ele sai daqui. Telefone, e-mail e endereço do cliente ficam guardados fora da tela.'+(q?' Última atualização: '+new Date(q).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'')+'</div>';
  $('app').innerHTML=h;
}

/* ===== porta unica do portal ===== */
const CDMMODS=['brasa'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'brasa'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
