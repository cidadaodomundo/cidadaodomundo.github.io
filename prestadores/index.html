<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Quem conserta · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.top .rt{margin-left:auto;display:flex;gap:8px}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
button.b:hover{border-color:var(--brand)}
button.bp{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.busca{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.frm{display:none;background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:14px}
.frm.on{display:block}
.frm .lin{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.frm input,.frm select,.frm textarea{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;flex:1 1 190px}
.frm textarea{width:100%;min-height:54px;flex-basis:100%}
.frm label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;font-weight:600}
.campo{flex:1 1 190px}
.p{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:9px}
.p.dest{border-color:var(--brand)}
.ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.nm{font-size:16px;font-weight:800}
.tg{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--text2)}
.tg.taxa{background:rgba(47,174,106,.14);border-color:var(--ok);color:#8ee0b4}
.tg.fixa{background:rgba(201,133,0,.14);border-color:var(--warn);color:#e5be6d}
.tg.est{background:rgba(200,16,46,.16);border-color:var(--brand);color:#ff9aa6}
.pd{color:var(--text2);font-size:13.5px;margin-top:6px;line-height:1.45}
.obs{color:var(--muted);font-size:12.5px;margin-top:5px;line-height:1.45}
.aco{margin-left:auto;display:flex;gap:7px}
a.zap{display:inline-block;background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:700;text-decoration:none}
a.zap:hover{border-color:var(--ok);color:#8ee0b4}
.semtel{color:var(--warn);font-size:12.5px;font-weight:600}
.vazio{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}
.rod{color:var(--muted);font-size:11.5px;margin-top:18px;border-top:1px solid var(--line);padding-top:12px;line-height:1.6}
.volta{color:var(--muted);font-size:13px;text-decoration:none}
.volta:hover{color:var(--text)}

/* cara da casa 04-09-2026 */
h1,.gatebox h1{font-weight:400}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06}

/* cabe no celular 04-09-2026 — filas de aba nunca vazam ate 900px; o resto so em tela estreita */
@media (max-width:900px){.views,.tabs,.abas,.fil,.pes,.filtros,.chips,.lojas,.periodos{display:flex;flex-wrap:wrap;gap:6px;width:auto;max-width:100%;min-width:0}.views>*,.tabs>*,.abas>*,.fil>*,.pes>*{flex:0 0 auto;max-width:100%}}@media (max-width:640px){body{padding-left:12px;padding-right:12px}table{display:block;width:max-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}h1{font-size:clamp(18px,6.2vw,26px);word-break:break-word}img,svg,canvas,iframe{max-width:100%}}

.grp{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.02em;text-transform:uppercase;color:var(--brand);margin:20px 0 9px}
.grp:first-child{margin-top:0}
.tel{font-size:15px;font-weight:700;color:var(--text);margin-top:6px;letter-spacing:.02em}
a.zap.lig:hover{border-color:var(--brand);color:var(--brand)}
.av{color:#e5be6d;font-size:12.5px;margin-top:5px;line-height:1.45;font-weight:600}
.av.ruim{color:#ff9aa6}
.p.ruim{opacity:.72}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>📞 Quem conserta</h1>
    <div class="sub" id="sub">Carregando…</div>
  </div>
  <div class="rt">
    <a class="volta" href="/index.html">← Portal</a>
    <button class="b bp" onclick="abreForm()">+ Adicionar profissional</button>
  </div>
</div>

<div class="frm" id="frm">
  <div class="lin">
    <div class="campo"><label>Nome</label><input id="f_nome" placeholder="Nome do profissional ou da empresa"></div>
    <div class="campo"><label>Telefone</label><input id="f_tel" placeholder="41 99999-9999"></div>
  </div>
  <div class="lin">
    <div class="campo"><label>Setor</label><select id="f_setor"></select></div>
    <div class="campo"><label>O que conserta</label><input id="f_faz" placeholder="Ex.: geladeira, fogão, pia"></div>
  </div>
  <div class="lin">
    <label>Cuidado / observação</label>
    <textarea id="f_aviso" placeholder="Ex.: só atende de manhã, cobra visita, ainda não foi testado…"></textarea>
  </div>
  <div class="lin">
    <button class="b bp" onclick="salvaNovo()">Salvar</button>
    <button class="b" onclick="abreForm(false)">Cancelar</button>
  </div>
</div>

<div class="filtros" id="filtros"></div>
<input class="busca" id="q" placeholder="Procurar: geladeira, elétrica, forno, nome…" oninput="pinta()">
<div id="app"><div class="vazio">Carregando…</div></div>
<div class="rod" id="rod"></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const br=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};

const SETORES=['Refrigeração e câmara fria','Elétrica','Hidráulica e faz-tudo','Equipamentos de cozinha',
  'Forno e micro-ondas','Coifa e exaustão','Gás e chapa','Ar-condicionado','Telhado e obra','Limpeza pesada','Peças e outros'];

let GENTE=[],QUEM='',FILTRO='todos';

async function porta(acao,dados){
  const r=await fetch(SB+'rpc/prestador_consulta',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_acao:acao,p_dados:dados||{}})});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}

function digitos(t){return String(t||'').replace(/\D/g,'')}
function zap(t){
  const d=digitos(t);
  if(d.length!==11)return '';
  return 'https://wa.me/55'+d;
}
function liga(t){
  const d=digitos(t);
  if(d.length<10)return '';
  return 'tel:+55'+d;
}
function ordemSetor(s){const i=SETORES.indexOf(s);return i<0?99:i}
function ruim(p){return /N[AÃ]O RECOMENDADO/i.test(p.aviso||'')}

function pintaFiltros(){
  const usados=SETORES.filter(function(s){return GENTE.some(function(p){return p.setor===s})});
  GENTE.forEach(function(p){if(usados.indexOf(p.setor)<0)usados.push(p.setor)});
  const fs=[{k:'todos',r:'Todos'}].concat(usados.map(function(s){return {k:s,r:s}}),[{k:'semtel',r:'📵 Sem telefone'}]);
  $('filtros').innerHTML=fs.map(function(f){
    return '<button class="b'+(FILTRO===f.k?' on':'')+'" onclick="setFiltro('+JSON.stringify(f.k).replace(/"/g,'&quot;')+')">'+esc(f.r)+'</button>';
  }).join('');
}
function setFiltro(k){FILTRO=k;pintaFiltros();pinta()}

function passa(p){
  if(FILTRO==='todos')return true;
  if(FILTRO==='semtel')return !p.telefone;
  return p.setor===FILTRO;
}

function cartao(p){
  const l=liga(p.telefone),w=zap(p.telefone);
  let aco='';
  if(p.telefone){
    aco=(l?'<a class="zap lig" href="'+l+'">📞 Ligar</a>':'')+
        (w?'<a class="zap" href="'+w+'" target="_blank" rel="noopener">💬 WhatsApp</a>':'');
  }else if(!ruim(p)){
    aco='<button class="b" onclick="poeTel('+p.id+')">Pôr o telefone</button>';
  }
  const semtel=p.telefone?'':(p.numero_com?'<div class="av">📵 Quem tem o número: '+esc(p.numero_com)+'. Peça e ponha aqui.</div>':(ruim(p)?'':'<div class="av">📵 Sem telefone guardado.</div>'));
  return '<div class="p'+(ruim(p)?' ruim':'')+'">'+
    '<div class="ph">'+
      '<span class="nm">'+esc(p.nome)+'</span>'+
      '<div class="aco">'+aco+'</div>'+
    '</div>'+
    (p.telefone?'<div class="tel">'+esc(p.telefone)+'</div>':'')+
    (p.faz?'<div class="pd">'+esc(p.faz)+'</div>':'')+
    (p.aviso?'<div class="av'+(ruim(p)?' ruim':'')+'">⚠️ '+esc(p.aviso)+'</div>':'')+
    semtel+
    '<div class="obs">'+(p.ultima?'Última vez citado: '+esc(br(p.ultima))+' · ':'')+esc(p.origem||'')+
      ' · <a href="#" class="volta" onclick="arquiva('+p.id+');return false">tirar da lista</a></div>'+
  '</div>';
}

function pinta(){
  const q=($('q').value||'').trim().toLowerCase();
  const lista=GENTE.filter(function(p){
    if(!passa(p))return false;
    if(!q)return true;
    return [p.nome,p.setor,p.faz,p.aviso,p.telefone].join(' ').toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){
    return ordemSetor(a.setor)-ordemSetor(b.setor)||(ruim(a)-ruim(b))||(!a.telefone-!b.telefone)||String(a.nome).localeCompare(String(b.nome),'pt-BR');
  });
  if(!lista.length){
    $('app').innerHTML='<div class="vazio">Ninguém nesse filtro. Toque em "Todos" ou limpe a busca.</div>';
    return;
  }
  let h='',ult=null;
  lista.forEach(function(p){
    if(p.setor!==ult){h+='<div class="grp">'+esc(p.setor)+'</div>';ult=p.setor}
    h+=cartao(p);
  });
  $('app').innerHTML=h;
}

function abreForm(v){
  const e=$('frm');
  if(v===false){e.classList.remove('on');return}
  e.classList.toggle('on');
  if(e.classList.contains('on'))$('f_nome').focus();
}

async function salvaNovo(){
  const n=$('f_nome').value.trim();
  if(!n){alert('Escreva pelo menos o nome do profissional.');return}
  try{
    await porta('adicionar',{nome:n,telefone:$('f_tel').value,setor:$('f_setor').value,
      faz:$('f_faz').value,aviso:$('f_aviso').value});
    $('f_nome').value='';$('f_tel').value='';$('f_faz').value='';$('f_aviso').value='';
    abreForm(false);
    await boot();
  }catch(e){alert('Não deu para salvar. Entre no portal de novo e tente outra vez.')}
}

async function poeTel(id){
  const p=GENTE.find(function(x){return x.id===id});
  const t=prompt('Telefone de '+(p?p.nome:'')+':','41 9');
  if(t==null)return;
  if(digitos(t).length<10){alert('Esse número ficou curto. Escreva com o DDD, ex.: 41 99999-9999.');return}
  try{await porta('telefone',{id:id,telefone:t});await boot()}
  catch(e){alert('Não deu para salvar o telefone.')}
}

async function arquiva(id){
  if(!confirm('Tirar esse profissional da lista? Ele sai da tela, mas continua guardado.'))return;
  try{await porta('arquivar',{id:id});await boot()}
  catch(e){alert('Não deu para tirar da lista.')}
}

async function boot(){
  try{
    const j=await porta('listar',{});
    GENTE=j.gente||[];QUEM=j.quem||'';
  }catch(e){
    $('app').innerHTML='<div class="vazio">Não deu para carregar a lista. Entre no portal de novo.</div>';
    return;
  }
  const pessoas={},comTel={};
  GENTE.forEach(function(p){const k=String(p.nome).toLowerCase();pessoas[k]=1;if(p.telefone)comTel[k]=1});
  const np=Object.keys(pessoas).length,nt=Object.keys(comTel).length;
  $('sub').textContent=np+' profissionais · '+nt+' com telefone · '+(np-nt)+' sem telefone';
  $('f_setor').innerHTML=SETORES.map(function(s){return '<option>'+esc(s)+'</option>'}).join('');
  $('rod').innerHTML='A lista começou com a planilha de 30/08/2026, feita lendo o grupo <b>Manutenção Cidadão</b> de 21/10/2025 a 24/08/2026. '+
    'Chamou alguém novo? Ponha aqui no botão <b>Adicionar profissional</b> — assim ninguém precisa perguntar no grupo.'+
    (QUEM?'<br>Você está como <b>'+esc(QUEM)+'</b>.':'');
  pintaFiltros();
  pinta();
}

/* ===== porta unica do portal ===== */
const CDMMODS=['prestadores'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'prestadores'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
