<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Acessos · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1200px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
button.b:hover{border-color:var(--brand)}
button.bp{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.bd{border-color:#5a2a2a;color:var(--bad)}
h2{font-size:15px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-off{background:rgba(138,137,126,.15);color:var(--muted)}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.m{color:var(--muted);font-size:11.5px;margin-top:3px}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:8px 0}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:16px}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:18px}
.pes{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.pes button{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:11px;padding:10px 14px;font-size:13.5px;font-weight:700;cursor:pointer;text-align:left}
.pes button:hover{border-color:var(--brand)}
.pes button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);color:#fff}
.pes button .qt{display:block;font-weight:600;font-size:11px;opacity:.75;margin-top:2px}
.grupo{margin-top:14px}
.grupo .gt{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:7px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:7px}
.mod{display:flex;gap:10px;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;font-size:13px}
.mod:hover{border-color:var(--brand)}
.mod .cx{width:20px;height:20px;flex:none;border:2px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:13px;color:var(--ok)}
.mod.on{border-color:rgba(47,174,106,.5)}
.mod.on .cx{border-color:var(--ok);background:rgba(47,174,106,.14)}
.mod.trab{opacity:.5;pointer-events:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:0 8px 7px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);color:var(--text2)}
tr:last-child td{border-bottom:none}
td b{color:var(--text)}
.viv{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:7px;box-shadow:0 0 0 3px rgba(47,174,106,.2)}
.senha{background:#14261b;border:1px solid #2f5f42;color:#a8e6c2;border-radius:10px;padding:12px 14px;font-size:13.5px;margin-top:10px}
.senha code{font-family:ui-monospace,Consolas,monospace;font-size:17px;font-weight:800;letter-spacing:1px;color:#fff;background:rgba(0,0,0,.35);padding:3px 9px;border-radius:6px}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.rolar{overflow-x:auto}
.frm{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:6px}
.frm label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:5px}
.frm input{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit}
.frm input:focus{outline:none;border-color:var(--brand)}
.frm input::placeholder{color:#5f5e57}
.c.nova{border-color:#4a3f22}

/* cara da casa 04-09-2026 */
.pes button.on{color:var(--brand-ink)}
h1,.gatebox h1{font-weight:400}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06}

/* cabe no celular 04-09-2026 — filas de aba nunca vazam ate 900px; o resto so em tela estreita */
@media (max-width:900px){.views,.tabs,.abas,.fil,.pes,.filtros,.chips,.lojas,.periodos{display:flex;flex-wrap:wrap;gap:6px;width:auto;max-width:100%;min-width:0}.views>*,.tabs>*,.abas>*,.fil>*,.pes>*{flex:0 0 auto;max-width:100%}}@media (max-width:640px){body{padding-left:12px;padding-right:12px}table{display:block;width:max-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}h1{font-size:clamp(18px,6.2vw,26px);word-break:break-word}img,svg,canvas,iframe{max-width:100%}}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>🔑 Acessos</h1><div class="sub">quem entra no portal e quem pode ver o quê</div></div></div>
  <div class="rt"><button class="b bp" onclick="abreNova()">+ Nova pessoa</button><button class="b" onclick="boot()">↻ Atualizar</button></div>
</div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};

let USU=[],MOD=[],SES=[],USO=[],SEL=null,MSG='',TOPO='',NOVA=null,EU='';

async function adm(acao,dados){
  const r=await fetch(SB+'rpc/portal_admin',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_acao:acao,p_dados:dados||{}})});
  if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('porta '+r.status))}
  return await r.json();
}

async function uso(){
  try{
    const r=await fetch(SB+'rpc/portal_uso',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_token:tok()})});
    if(!r.ok)return {pessoas:[]};
    return await r.json();
  }catch(e){return {pessoas:[]}}
}

const NOMETELA={inicio:'Início',delivery:'Central do Delivery','delivery-antiga':'Central antiga',escala:'Escala & Clima',ifood:'iFood · Qualidade',ifoodsb:'iFood · São Braz',rh:'Central do RH',ponto:'Painel RH',salao:'Central Salão',cozinha:'Central Cozinha',respostas:'Precisa de Resposta',manutencao:'Manutenção',compras:'Compras & Listas',encomendas:'Encomendas Grandes',brasa:'Brasa e Fumaça',reuniao:'Reunião Semanal','escala-mensal':'Escala do Mês',operacao:'Desperdício',escritorio:'Escritório',acessos:'Acessos',painel:'Painel do Dono','painel-dono':'Painel do Dono',centralsb:'Central São Braz',salaosb:'Salão São Braz',manutencaosb:'Manutenção São Braz',comprassb:'Compras São Braz',encomendassb:'Encomendas São Braz',rhsb:'Ponto · São Braz'};
function nomeTela(t){return NOMETELA[t]||t}
function tempoTxt(m){if(!m)return '—';if(m<60)return m+' min';const hh=Math.floor(m/60),rr=m%60;return hh+'h'+(rr?' '+rr+'min':'')}
function usoDe(id){for(let i=0;i<USO.length;i++){if(USO[i].id===id)return USO[i]}return null}
function dataTxt(s){if(!s)return '';const d=new Date(s);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}

async function boot(){
  try{
    const r=await Promise.all([adm('listar'),adm('modulos'),adm('sessoes'),uso()]);
    USU=r[0];MOD=r[1];SES=r[2];USO=(r[3]&&r[3].pessoas)||[];
  }catch(e){$('app').innerHTML=TOPO+'<div class="c">Não deu para carregar. Se você acabou de criar senha nova para você mesmo, isto é esperado: o portal te derrubou. Entre de novo com a senha que está logo acima.</div>';return}
  if(SEL===null&&USU.length)SEL=USU[0].id;
  desenha();
}

function pessoa(id){return USU.filter(function(u){return u.id===id})[0]}

async function troca(mid,el){
  const u=pessoa(SEL); if(!u)return;
  const tinha=u.modulos.indexOf(mid)>=0;
  el.classList.add('trab');
  try{
    await adm('permissao',{usuario_id:u.id,modulo_id:mid,marcado:!tinha});
    if(tinha)u.modulos=u.modulos.filter(function(x){return x!==mid});
    else u.modulos=u.modulos.concat([mid]);
    MSG='';desenha();
  }catch(e){el.classList.remove('trab');alert('Não deu para mudar esse acesso. Tente de novo.')}
}

async function resetar(){
  const u=pessoa(SEL); if(!u)return;
  const souEu=(String(u.usuario).toLowerCase()===String(EU).toLowerCase());
  if(!confirm(souEu
    ? 'ATENÇÃO: esta pessoa é VOCÊ.\n\nCriar senha nova aqui vai TE DERRUBAR do portal na hora, e você só volta com a senha nova.\n\nEla vai aparecer numa tarja verde no alto da tela. ANOTE antes de fechar ou de atualizar — depois não dá para ver de novo.\n\nQuer mesmo?'
    : 'Vai criar uma senha nova para '+u.nome+' e derrubar o acesso dela agora.\n\nA senha antiga para de funcionar na hora. Confirma?'))return;
  try{
    const r=await adm('resetar_senha',{usuario_id:u.id});
    MSG='';
    TOPO='<div class="senha">Senha nova de <b>'+esc(u.nome)+'</b> (entra como <code>'+esc(u.usuario)+'</code>): <code>'+esc(r.senha_provisoria)+'</code><div class="m" style="color:#a8e6c2">Passe para ela por WhatsApp. Na primeira entrada o portal pede para trocar. Esta senha some da tela quando você atualizar.</div></div>';
    await boot();
  }catch(e){alert('Não deu para trocar a senha.')}
}

async function ligaDesliga(){
  const u=pessoa(SEL); if(!u)return;
  const novo=!u.ativo;
  if(!confirm((novo?'Ligar ':'Desligar ')+u.nome+' do portal?'+(novo?'':'\n\nEla sai na hora e não consegue mais entrar.')))return;
  try{await adm('editar',{usuario_id:u.id,ativo:novo});MSG='';await boot()}
  catch(e){alert('Não deu para mudar.')}
}

async function desbloquear(){
  const u=pessoa(SEL); if(!u)return;
  try{await adm('desbloquear',{usuario_id:u.id});MSG='';await boot()}
  catch(e){alert('Não deu para desbloquear.')}
}

function abreNova(){NOVA={nome:'',usuario:'',senha:'',unidade:'',modulos:[]};MSG='';TOPO='';desenha();window.scrollTo(0,0)}
function fechaNova(){NOVA=null;desenha()}
function novaCampo(c,el){NOVA[c]=el.value}
function novaTela(mid,el){
  const i=NOVA.modulos.indexOf(mid);
  if(i>=0)NOVA.modulos.splice(i,1);else NOVA.modulos.push(mid);
  el.classList.toggle('on');
  el.firstChild.textContent=(i>=0?'':'✔');
}
function caixas(marcadas,fn){
  let h='';const grupos=[];
  MOD.forEach(function(m){if(grupos.indexOf(m.grupo)<0)grupos.push(m.grupo)});
  grupos.forEach(function(g){
    h+='<div class="grupo"><div class="gt">'+esc(g)+'</div><div class="mods">';
    MOD.filter(function(m){return m.grupo===g}).forEach(function(m){
      const tem=marcadas.indexOf(m.id)>=0;
      h+='<div class="mod'+(tem?' on':'')+'" onclick="'+fn+'(\''+m.id+'\',this)">'+
         '<div class="cx">'+(tem?'✔':'')+'</div><div>'+esc(m.icone||'')+' '+esc(m.nome)+'</div></div>';
    });
    h+='</div></div>';
  });
  return h;
}
function formNova(){
  let h='<h2>➕ Pessoa nova no portal</h2><div class="c nova">';
  h+='<div class="frm">'+
     '<div><label>Nome da pessoa</label><input value="'+esc(NOVA.nome)+'" oninput="novaCampo(\'nome\',this)" placeholder="Maria da Silva"></div>'+
     '<div><label>Nome de entrada</label><input value="'+esc(NOVA.usuario)+'" oninput="novaCampo(\'usuario\',this)" placeholder="maria" autocapitalize="off" spellcheck="false"></div>'+
     '<div><label>Senha</label><input value="'+esc(NOVA.senha)+'" oninput="novaCampo(\'senha\',this)" placeholder="vazio = o portal inventa uma"></div>'+
     '<div><label>Loja (pode deixar vazio)</label><input value="'+esc(NOVA.unidade)+'" oninput="novaCampo(\'unidade\',this)" placeholder="Água Verde"></div>'+
     '</div>';
  h+='<div class="m">O <b>nome de entrada</b> é o que ela digita para entrar: só letras minúsculas, números, ponto ou hífen — sem espaço e sem acento. Se você deixar a senha vazia, o portal inventa uma e mostra aqui na tela.</div>';
  h+='<h2 style="margin:16px 0 4px">🗂 O que ela vai poder ver</h2>';
  h+=caixas(NOVA.modulos,'novaTela');
  h+='<div class="linha"><button class="b bp" onclick="criarPessoa()">✅ Criar a pessoa</button>'+
     '<button class="b" onclick="fechaNova()">Cancelar</button></div>';
  h+='</div>';
  return h;
}
async function criarPessoa(){
  if(!NOVA)return;
  const d={nome:(NOVA.nome||'').trim(),usuario:(NOVA.usuario||'').trim().toLowerCase(),
           unidade:(NOVA.unidade||'').trim(),modulos:NOVA.modulos.slice()};
  if((NOVA.senha||'').trim())d.senha=(NOVA.senha||'').trim();
  try{
    const r=await adm('criar',d);
    const qt=d.modulos.length;
    NOVA=null;SEL=r.id;MSG='';
    TOPO='<div class="senha"><b>'+esc(d.nome)+'</b> entrou no portal. Nome de entrada: <code>'+esc(d.usuario)+'</code> · Senha: <code>'+esc(r.senha_provisoria)+'</code><div class="m" style="color:#a8e6c2">'+qt+' tela(s) liberadas. Passe os dois pelo WhatsApp. Esta senha aparece uma vez só — copie antes de sair da tela.</div></div>';
    await boot();
  }catch(e){alert(e.message||'Não deu para criar a pessoa.')}
}
async function apagar(){
  const u=pessoa(SEL); if(!u)return;
  if(!confirm('APAGAR '+u.nome+' do portal, para sempre.\n\nEla some da lista, perde todas as telas e sai do ar na hora. Isto NÃO tem botão de voltar.\n\nSe ela só saiu de férias ou está afastada, use "Desligar do portal" — esse dá para religar depois.\n\nQuer mesmo apagar?'))return;
  const c=prompt('Para confirmar, escreva o nome de entrada dela:\n\n'+u.usuario);
  if(c===null)return;
  if(String(c).trim().toLowerCase()!==String(u.usuario).toLowerCase()){alert('Não bateu. Ninguém foi apagado.');return}
  try{
    await adm('apagar',{usuario_id:u.id});
    SEL=null;MSG='';
    TOPO='<div class="aviso"><b>'+esc(u.nome)+'</b> foi apagada do portal. O registro de quem abriu qual tela continua guardado.</div>';
    await boot();
  }catch(e){alert(e.message||'Não deu para apagar.')}
}

function desenha(){
  const u=pessoa(SEL);
  let h='';
  h+=TOPO;
  if(NOVA){$('app').innerHTML=h+formNova();return}

  /* quem esta com o portal aberto */
  h+='<h2>🟢 Com o portal aberto agora <span class="pill '+(SES.length?'p-ok':'p-off')+'">'+SES.length+'</span></h2><div class="c">';
  if(!SES.length){h+='<div class="vazio">ninguém está com sessão aberta</div>'}
  else{
    h+='<div class="rolar"><table><tr><th>Quem</th><th>Entrou</th><th>Vale até</th></tr>';
    SES.forEach(function(s){
      const de=new Date(s.desde),ate=new Date(s.expira);
      const f=d=>('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
      h+='<tr><td><span class="viv"></span><b>'+esc(s.nome)+'</b></td><td>'+f(de)+'</td><td>'+f(ate)+'</td></tr>';
    });
    h+='</table></div>';
  }
  h+='</div>';

  /* tempo no portal */
  h+='<h2>⏱ Tempo no portal — últimos 7 dias</h2><div class="c">';
  if(!USO.length){h+='<div class="vazio">ninguém abriu o portal nestes 7 dias</div>'}
  else{
    const ord=USO.slice().sort(function(a,b){return (b.minutos7||0)-(a.minutos7||0)});
    h+='<div class="rolar"><table><tr><th>Quem</th><th>Hoje</th><th>Visitas em 7 dias</th><th>Tempo em 7 dias</th><th>Visita mais longa</th><th>Última vez</th></tr>';
    ord.forEach(function(x){
      const nunca=!x.ultimo_acesso;
      h+='<tr><td><b>'+esc(x.nome)+'</b>'+(x.ativo?'':' <span class="pill p-bad">desligada</span>')+'</td>'+
         '<td>'+(x.hoje||0)+'</td><td>'+(x.visitas7||0)+'</td><td>'+tempoTxt(x.minutos7)+'</td>'+
         '<td>'+tempoTxt(x.maior_visita7)+'</td>'+
         '<td>'+(nunca?'<span class="pill p-bad">nunca entrou</span>':esc(dataTxt(x.ultimo_acesso)))+'</td></tr>';
    });
    h+='</table></div>';
  }
  h+='<div class="m">O portal anota cada vez que alguém abre uma tela, mas não sabe a hora em que a pessoa fecha o navegador. O tempo aqui é uma <b>estimativa</b>: aberturas com menos de 30 minutos de intervalo contam como a mesma visita.</div>';
  h+='</div>';

  /* escolher a pessoa */
  h+='<h2>👤 Escolha a pessoa</h2><div class="pes">';
  USU.forEach(function(x){
    h+='<button class="'+(x.id===SEL?'on':'')+'" onclick="SEL='+x.id+';MSG=\'\';desenha()">'+esc(x.nome)+
       '<span class="qt">'+x.modulos.length+' telas'+(String(x.usuario).toLowerCase()===String(EU).toLowerCase()?' · você':'')+(x.ativo?'':' · desligada')+(x.bloqueado?' · bloqueada':'')+'</span></button>';
  });
  h+='</div>';

  if(u){
    /* dados da pessoa e botoes */
    h+='<div class="c"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+
       '<div><b style="font-size:17px">'+esc(u.nome)+'</b> <span class="pill p-off">'+esc(u.usuario)+'</span>'+
       (u.admin?' <span class="pill p-warn">dona do portal</span>':'')+
       (String(u.usuario).toLowerCase()===String(EU).toLowerCase()?' <span class="pill p-ok">é você</span>':'')+
       (u.ativo?'':' <span class="pill p-bad">desligada</span>')+
       (u.bloqueado?' <span class="pill p-bad">bloqueada por erro de senha</span>':'')+
       (u.precisa_trocar?' <span class="pill p-warn">precisa trocar a senha</span>':'')+
       '<div class="m">'+(u.unidade?esc(u.unidade)+' · ':'')+'vê '+u.modulos.length+' telas'+
       (u.ultimo_acesso?' · último acesso '+esc(String(u.ultimo_acesso).slice(8,10)+'/'+String(u.ultimo_acesso).slice(5,7)):' · nunca entrou')+'</div></div>'+
       '</div>';
    h+='<div class="linha">'+
       '<button class="b" onclick="resetar()">🔑 Criar senha nova</button>'+
       '<button class="b '+(u.ativo?'bd':'')+'" onclick="ligaDesliga()">'+(u.ativo?'⛔ Desligar do portal':'✅ Ligar no portal')+'</button>'+
       (u.bloqueado?'<button class="b" onclick="desbloquear()">🔓 Desbloquear</button>':'')+
       (u.admin?'':'<button class="b bd" onclick="apagar()">🗑 Apagar para sempre</button>')+
       '</div>';
    if(u.admin)h+='<div class="m">Esta pessoa é dona do portal — por segurança o portal não deixa apagar. E não desligue o usuário <b>proprietarios</b>: ele é o único que enxerga esta tela.</div>';
    h+=MSG;
    h+='</div>';

    /* o que ela pode ver */
    h+='<h2>🗂 O que '+esc(u.nome)+' pode ver</h2><div class="c">';
    const grupos=[];
    MOD.forEach(function(m){if(grupos.indexOf(m.grupo)<0)grupos.push(m.grupo)});
    grupos.forEach(function(g){
      h+='<div class="grupo"><div class="gt">'+esc(g)+'</div><div class="mods">';
      MOD.filter(function(m){return m.grupo===g}).forEach(function(m){
        const tem=u.modulos.indexOf(m.id)>=0;
        h+='<div class="mod'+(tem?' on':'')+'" onclick="troca(\''+m.id+'\',this)">'+
           '<div class="cx">'+(tem?'✔':'')+'</div><div>'+esc(m.icone||'')+' '+esc(m.nome)+'</div></div>';
      });
      h+='</div></div>';
    });
    h+='</div>';

    /* o que ela viu */
    const uu=usoDe(u.id);
    h+='<h2>👀 O que '+esc(u.nome)+' viu — últimos 7 dias</h2><div class="c">';
    if(!uu||!uu.toques7){h+='<div class="vazio">não abriu o portal nestes 7 dias</div>'}
    else if(!uu.telas7.length){h+='<div class="vazio">abriu o portal '+uu.toques7+' vezes, mas nessas aberturas o portal ainda não guardava o nome da tela</div>'}
    else{
      h+='<div class="rolar"><table><tr><th>Tela</th><th>Vezes</th></tr>';
      uu.telas7.forEach(function(t){h+='<tr><td>'+esc(nomeTela(t.tela))+'</td><td>'+t.vezes+'</td></tr>'});
      h+='</table></div>';
      if(uu.sem_nome7)h+='<div class="m">Outras '+uu.sem_nome7+' aberturas são de antes de as telas passarem a se identificar — dessas não dá para saber qual tela era.</div>';
    }
    h+='</div>';
  }

  h+='<div class="aviso">Clicou na caixinha, mudou na hora — não tem botão de salvar. A pessoa vê a mudança quando abrir o portal de novo. <b>Desligar</b> tira ela do ar agora e dá para religar depois; <b>Apagar</b> é para sempre e não volta. A senha nova aparece uma vez só nesta tela: copie antes de sair. Esta tela é só sua.</div>';
  $('app').innerHTML=h;
}

/* ===== porta unica do portal ===== */
const CDMMODS=['acessos'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'acessos'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  EU=j.usuario;
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
