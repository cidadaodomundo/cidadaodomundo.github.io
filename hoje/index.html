<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>O que olhar hoje · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
.dot{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.5px}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
button.b:hover{border-color:var(--brand)}
.rel{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.q{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.q .n{font-size:28px;font-weight:800;line-height:1.1}
.q .l{color:var(--muted);font-size:12px;margin-top:3px}
h2{font-size:14px;font-weight:800;margin:24px 0 10px;display:flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--text2)}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:9px;display:flex;gap:13px;align-items:flex-start}
.c.v{border-left:4px solid var(--bad)}
.c.a{border-left:4px solid var(--warn)}
.c .corpo{flex:1;min-width:0}
.c .tit{font-weight:700;font-size:14.5px}
.c .txt{color:var(--text2);font-size:13.5px;margin-top:4px;line-height:1.45}
.c .onde{color:var(--muted);font-size:11.5px;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--s2);color:var(--muted);margin-right:7px;vertical-align:2px}
.fila{background:var(--s1);border:1px solid var(--brand);border-radius:13px;padding:13px 15px;margin-bottom:9px;display:flex;gap:13px;align-items:center}
.fila .corpo{flex:1;min-width:0}
.fila .tit{font-weight:700;font-size:14.5px}
.fila .txt{color:var(--text2);font-size:13.5px;margin-top:4px;line-height:1.45}
.quem{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-right:7px;vertical-align:2px}
.q-voce{background:rgba(200,16,46,.18);color:#ff7b8f}
.q-pc{background:rgba(47,174,106,.15);color:var(--ok)}
button.ok{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
button.ok:hover{border-color:var(--ok);color:var(--ok)}
.limpo{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:38px 20px;text-align:center}
.limpo .big{font-size:38px}
.limpo .t{font-weight:800;font-size:18px;margin-top:10px}
.limpo .s{color:var(--muted);font-size:13px;margin-top:6px}
.load{color:var(--muted);padding:34px;text-align:center}
.nota{color:var(--muted);font-size:11.5px;margin-top:26px;border-top:1px solid var(--line);padding-top:14px;line-height:1.6}

/* cara da casa 04-09-2026 */
h1,.gatebox h1{font-weight:400}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>Um olho no negócio</h1><div class="sub">só o que está fora do lugar — se a tela estiver vazia, está tudo certo</div></div></div>
  <div class="rt"><span class="rel" id="rel">—</span><button class="b" onclick="boot()">Atualizar</button></div>
</div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};

async function porta(){
  const r=await fetch(SB+'rpc/painel_hoje',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok()})});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}

function itemFila(f){
  const ehVoce = f.quem==='fabio';
  return '<div class="fila"><div class="corpo">'+
    '<div class="tit"><span class="quem '+(ehVoce?'q-voce':'q-pc')+'">'+(ehVoce?'você':'computador')+'</span>'+esc(f.titulo)+'</div>'+
    '<div class="txt">'+esc(f.detalhe||'')+'</div></div>'+
    (ehVoce?'<button class="ok" data-t="'+esc(f.tarefa)+'">já fiz</button>':'')+
    '</div>';
}

async function marcarFeito(tarefa){
  try{
    const r=await fetch(SB+'rpc/painel_hoje_feito',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_token:tok(),p_tarefa:tarefa})});
    if(!r.ok)throw new Error(r.status);
  }catch(e){ alert('Não deu para marcar. Tente de novo.'); return }
  boot();
}

function cartao(a){
  const cls=(a.grave===1)?'v':'a';
  return '<div class="c '+cls+'"><div class="corpo">'+
    '<div class="tit"><span class="tag">'+esc(a.area)+'</span>'+esc(a.titulo)+'</div>'+
    '<div class="txt">'+esc(a.texto)+'</div>'+
    '<div class="onde">onde olhar: '+esc(a.tela)+'</div>'+
    '</div></div>';
}

async function boot(){
  let d;
  try{d=await porta()}
  catch(e){$('app').innerHTML='<div class="c">Não deu para carregar. Entre no portal de novo e tente outra vez.</div>';return}

  const todos=Array.isArray(d.alertas)?d.alertas:[];
  const vermelhos=todos.filter(a=>a.grave===1);
  const amarelos=todos.filter(a=>a.grave!==1);
  $('rel').textContent='olhado às '+esc(d.agora);

  let h='<div class="grid">'+
    '<div class="q"><div class="n" style="color:'+(vermelhos.length?'var(--bad)':'var(--ok)')+'">'+vermelhos.length+'</div><div class="l">para agir hoje</div></div>'+
    '<div class="q"><div class="n" style="color:'+(amarelos.length?'var(--warn)':'var(--ok)')+'">'+amarelos.length+'</div><div class="l">para dar uma olhada</div></div>'+
    '<div class="q"><div class="n" style="color:'+((d.fila||[]).length?'var(--brand)':'var(--ok)')+'">'+(d.fila||[]).length+'</div><div class="l">esperando você e o computador</div></div>'+
    '<div class="q"><div class="n">'+esc(d.ontem)+'</div><div class="l">o dia comparado</div></div>'+
    '</div>';

  const fila=Array.isArray(d.fila)?d.fila:[];
  if(fila.length){
    h+='<h2>O que ficou esperando você'+(d.dia_comecou?' — desde '+esc(d.dia_comecou):'')+'</h2>';
    fila.forEach(function(f){h+=itemFila(f)});
  }

  if(!todos.length && !fila.length){
    h+='<div class="limpo"><div class="big">☕</div><div class="t">Nada fora do lugar.</div>'+
       '<div class="s">As vendas, o prazo, o ponto, o cardápio e os robôs estão dentro do que costumam ser.</div></div>';
  }else{
    if(vermelhos.length){
      h+='<h2>Para agir hoje</h2>';
      vermelhos.forEach(function(a){h+=cartao(a)});
    }
    if(amarelos.length){
      h+='<h2>Para dar uma olhada</h2>';
      amarelos.forEach(function(a){h+=cartao(a)});
    }
  }

  h+='<div class="nota">Esta tela compara cada loja com <b>ela mesma</b>: a venda de ontem contra a média dos 4 mesmos dias da semana, e o prazo de entrega contra a média dos últimos 28 dias dela. Não existe meta fixa. Quando o dado de uma loja ainda não chegou, a tela avisa em vez de acusar a loja. A lista de cima é a <b>fila do seu dia</b>: ela não segue relógio — ela nasce quando você aparece no portal depois de uma pausa, e some conforme as coisas vão sendo feitas. O ponto mostra a quantidade de casos por loja, sem nome de pessoa e sem quem tem cargo de confiança. <b>O Boqueirão não aparece na parte de vendas</b> porque ainda não tem a senha do Saipos — é a única loja fora dessa conta.</div>';
  $('app').innerHTML=h;
}

/* ===== porta unica do portal ===== */
const CDMMODS=['hoje'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'hoje'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
document.addEventListener('click', function(ev){
  var b = ev.target && ev.target.closest ? ev.target.closest('button.ok[data-t]') : null;
  if(b) marcarFeito(b.getAttribute('data-t'));
});

cdmGuarda().then(function(ok){ if(ok) boot(); });
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
