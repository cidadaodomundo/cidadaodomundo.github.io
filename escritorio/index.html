<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111110">
<meta name="robots" content="noindex, nofollow">
<title>Escritório · Cidadão do Mundo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111110;color:#e8e6e1;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#c8a35a}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{border-bottom:1px solid #2a2926;padding:14px 0;margin-bottom:14px}
h1{font-size:19px;font-weight:600;letter-spacing:.2px}
.sub{color:#8d8a83;font-size:13px;margin-top:3px}
.dev{display:inline-block;background:#3a2f14;color:#e0b95c;border:1px solid #5c4a1d;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-left:8px;vertical-align:middle}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:360px;background:#191817;border:1px solid #2a2926;border-radius:14px;padding:26px;text-align:center}
.box h2{font-size:17px;font-weight:600;margin-bottom:6px}
.box p{color:#8d8a83;font-size:13px;margin-bottom:16px}
input[type=password]{width:100%;background:#111110;border:1px solid #35332e;border-radius:9px;color:#e8e6e1;padding:11px 13px;font-size:15px;outline:none}
input[type=password]:focus{border-color:#c8a35a}
button{background:#c8a35a;color:#1a1712;border:0;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;width:100%}
button:hover{background:#d8b269}
button.gh{width:auto;background:#26241f;color:#c9c5bc;border:1px solid #35332e;font-weight:500;margin:0;padding:7px 13px;font-size:13px}
button.gh:hover{background:#302d27}
button.gh.on{background:#c8a35a;color:#1a1712;border-color:#c8a35a}
.err{color:#e0736a;font-size:13px;margin-top:10px;min-height:18px}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#191817;border:1px solid #2a2926;border-radius:11px;padding:13px}
.kpi .k{color:#8d8a83;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:21px;font-weight:600;margin-top:5px}
.kpi .n{color:#6f6c66;font-size:11px;margin-top:3px}
.card{background:#191817;border:1px solid #2a2926;border-radius:11px;padding:14px;margin-bottom:14px;overflow:auto}
.card h3{font-size:14px;font-weight:600;margin-bottom:10px;color:#d6d2c9}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#8d8a83;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:7px 9px;border-bottom:1px solid #2a2926;white-space:nowrap;cursor:pointer;user-select:none}
td{padding:7px 9px;border-bottom:1px solid #201f1c;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.neg{color:#e0736a}
.aviso{background:#221d12;border:1px solid #4a3d1c;border-radius:11px;padding:14px;color:#c9b073;font-size:13px;margin-bottom:14px}
.load{color:#8d8a83;padding:30px 0;text-align:center}
.foot{color:#5f5c57;font-size:11px;padding:18px 0 30px;text-align:center}
</style>
</head>
<body>

<div id="app" hidden>
  <div class="wrap">
    <header>
      <h1>Escritório<span class="dev">em desenvolvimento</span></h1>
      <div class="sub" id="sub">Carregando…</div>
    </header>
    <nav id="nav"></nav>
    <div id="content"><div class="load">Carregando…</div></div>
    <div class="foot">Dados privados · <span id="quem"></span> · <a href="#" onclick="sair();return false">sair do portal</a></div>
  </div>
</div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const PWKEY='cdm_esc_pw';
let D=null, ABA='caixa';

const brl=v=>(v==null||isNaN(v))?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const nn=v=>(v==null||isNaN(v))?'—':Number(v).toLocaleString('pt-BR');
const dt=s=>{if(!s)return '—';const p=String(s).slice(0,10).split('-');return p[2]+'/'+p[1]};
const soma=(a,f)=>a.reduce((t,x)=>t+(Number(f(x))||0),0);

function pw(){return sessionStorage.getItem(PWKEY)||''}

async function chamar(senha){
  const r=await fetch(SB+'rpc/escritorio_painel',{
    method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_senha:senha})
  });
  if(!r.ok) throw new Error('senha');
  return await r.json();
}

async function entrar(){
  const s=($('pw').value||'').trim();
  if(!s){$('err').textContent='Digite a senha.';return}
  $('err').textContent='Conferindo…';
  try{
    D=await chamar(s);
    try{sessionStorage.setItem(PWKEY,s)}catch(e){}
    boot();
  }catch(e){
    $('err').textContent='Senha do escritório incorreta.';
    $('pw').value='';
  }
}

async function sair(){
  const t=cdmTok();
  try{if(t)await fetch(SB+'rpc/portal_sair',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t})})}catch(e){}
  ['cdm_token','cdm_nome','cdm_admin','cdm_modulos','cdm_rh_pw',PWKEY,'cdm_moto_pw','cdm_reuniao_pw','cdm_aviso'].forEach(function(k){try{sessionStorage.removeItem(k)}catch(e){}});
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}
}

const ABAS_FIN=[
  {id:'caixa',   nome:'Caixa & Vendas'},
  {id:'pagar',   nome:'Contas a Pagar'},
  {id:'motoboy', nome:'Motoboy & Folha'},
  {id:'dre',     nome:'DRE / DFC'}
];
const ADMIN=(function(){try{return sessionStorage.getItem('cdm_admin')==='1'}catch(e){return false}})();
function ABAS(){return ADMIN?ABAS_FIN.concat([{id:'usuarios',nome:'Usuários'}]):ABAS_FIN.slice()}

function boot(){
  $('nav').innerHTML=ABAS().map(a=>'<button class="gh'+(a.id===ABA?' on':'')+'" onclick="ir('+"'"+a.id+"'"+')">'+a.nome+'</button>').join('');
  const g=(D&&D.gerado_em)?String(D.gerado_em).slice(0,10).split('-').reverse().join('/'):'—';
  $('sub').textContent=(ABA==='usuarios')?'Quem entra no portal e o que cada um vê':('Financeiro privado · dados até '+g);
  const q=$('quem');if(q){let n='';try{n=sessionStorage.getItem('cdm_nome')||''}catch(e){}q.textContent=n}
  render();
}

function ir(id){ABA=id;boot()}

function tabela(cols,linhas){
  if(!linhas.length) return '<div class="load">Sem dado no período.</div>';
  const th=cols.map(c=>'<th'+(c.n?' class="num"':'')+'>'+c.t+'</th>').join('');
  const tr=linhas.map(l=>'<tr>'+cols.map(c=>'<td'+(c.n?' class="num"':'')+'>'+c.f(l)+'</td>').join('')+'</tr>').join('');
  return '<table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table>';
}

function kpi(k,v,n){return '<div class="kpi"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="n">'+(n||'')+'</div></div>'}

function render(){
  const c=$('content');
  if(ABA==='usuarios'){c.innerHTML=usRender();USPROV=null;return}
  if(!D){c.innerHTML=escPede();setTimeout(function(){try{$('pw').focus()}catch(e){}},60);return}
  const av=D.avisos||{};

  if(ABA==='caixa'){
    const vd=D.vendas_dia||[], cf=D.cofre||[], ct=D.cartao_dia||[];
    let h='<div class="kpis">'
      +kpi('Vendas 30 dias',brl(soma(vd,x=>x.total)),nn(soma(vd,x=>x.n_vendas))+' vendas')
      +kpi('Dinheiro',brl(soma(vd,x=>x.dinheiro)),'do total de vendas')
      +kpi('Cartão bruto',brl(soma(ct,x=>x.bruto)),nn(soma(ct,x=>x.transacoes))+' transações')
      +kpi('Cartão líquido',brl(soma(ct,x=>x.liquido)),'depois da taxa')
      +'</div>';
    if(!Number(av.extrato_bancario)) h+='<div class="aviso">Extrato bancário e conciliação ainda sem carga — as tabelas existem mas estão vazias. Quando a carga entrar, o confronto banco x Saipos aparece aqui.</div>';
    h+='<div class="card"><h3>Vendas por dia (Saipos)</h3>'+tabela([
      {t:'Data',f:x=>dt(x.data)},
      {t:'Loja',f:x=>x.id_store},
      {t:'Vendas',n:1,f:x=>nn(x.n_vendas)},
      {t:'Dinheiro',n:1,f:x=>brl(x.dinheiro)},
      {t:'Total',n:1,f:x=>brl(x.total)}
    ],vd)+'</div>';
    h+='<div class="card"><h3>Cartão por dia (Rede)</h3>'+tabela([
      {t:'Data',f:x=>dt(x.data)},
      {t:'Transações',n:1,f:x=>nn(x.transacoes)},
      {t:'Bruto',n:1,f:x=>brl(x.bruto)},
      {t:'Líquido',n:1,f:x=>brl(x.liquido)}
    ],ct)+'</div>';
    h+='<div class="card"><h3>Cofre</h3>'+tabela([
      {t:'Data',f:x=>dt(x.data)},
      {t:'Conta',f:x=>x.conta||'—'},
      {t:'Categoria',f:x=>x.categoria||'—'},
      {t:'Descrição',f:x=>x.descricao||'—'},
      {t:'Valor',n:1,f:x=>brl(x.valor)}
    ],cf)+'</div>';
    c.innerHTML=h;
  }

  else if(ABA==='pagar'){
    const ap=D.a_pagar||[];
    const hoje=new Date().toISOString().slice(0,10);
    const venc=ap.filter(x=>x.vencimento<hoje);
    const sem=new Date(Date.now()+6048e5).toISOString().slice(0,10);
    let h='<div class="kpis">'
      +kpi('Em aberto',brl(soma(ap,x=>x.valor)),nn(ap.length)+' lançamentos')
      +kpi('Vencido',brl(soma(venc,x=>x.valor)),nn(venc.length)+' em atraso')
      +kpi('Vence em 7 dias',brl(soma(ap.filter(x=>x.vencimento>=hoje&&x.vencimento<=sem),x=>x.valor)),'próxima semana')
      +'</div>';
    h+='<div class="card"><h3>Contas a pagar em aberto</h3>'+tabela([
      {t:'Vencimento',f:x=>'<span'+(x.vencimento<hoje?' class="neg"':'')+'>'+dt(x.vencimento)+'</span>'},
      {t:'Fornecedor',f:x=>x.fornecedor||'—'},
      {t:'Categoria',f:x=>x.categoria||'—'},
      {t:'Descrição',f:x=>x.descricao||'—'},
      {t:'Conta',f:x=>x.conta||'—'},
      {t:'Valor',n:1,f:x=>brl(x.valor)}
    ],ap)+'</div>';
    c.innerHTML=h;
  }

  else if(ABA==='motoboy'){
    const mb=D.motoboy||[];
    const ent=soma(mb,x=>x.entregas), np=soma(mb,x=>x.no_prazo);
    let h='<div class="kpis">'
      +kpi('A pagar 30 dias',brl(soma(mb,x=>x.pagar)),nn(mb.length)+' turnos')
      +kpi('Entregas',nn(ent),'no período')
      +kpi('No prazo',ent?((np/ent*100).toFixed(1).replace('.',',')+'%'):'—','pelo prazo do iFood')
      +kpi('Custo por entrega',ent?brl(soma(mb,x=>x.pagar)/ent):'—','média do período')
      +'</div>';
    h+='<div class="card"><h3>Pagamento por motoboy e turno</h3>'+tabela([
      {t:'Dia',f:x=>dt(x.dia)},
      {t:'Unidade',f:x=>x.unidade||'—'},
      {t:'Bloco',f:x=>x.bloco||'—'},
      {t:'Entregador',f:x=>x.entregador||'—'},
      {t:'Entregas',n:1,f:x=>nn(x.entregas)},
      {t:'No prazo',n:1,f:x=>nn(x.no_prazo)},
      {t:'Horas',n:1,f:x=>x.horas==null?'—':Number(x.horas).toFixed(1).replace('.',',')},
      {t:'A pagar',n:1,f:x=>brl(x.pagar)}
    ],mb)+'</div>';
    c.innerHTML=h;
  }

  else if(ABA==='dre'){
    const dre=D.dre||[];
    if(!dre.length){
      c.innerHTML='<div class="aviso"><strong>Aguardando carga.</strong><br>As tabelas do DRE/DFC (fin_plano_contas, fin_contas, fin_lancamentos) foram criadas no banco em 17/08/2026, junto com as views vw_fin_dfc_mensal e vw_fin_saldo_conta_mensal — mas ainda estão sem nenhum lançamento. Assim que os dados forem carregados, o fluxo de caixa e a DRE aparecem aqui automaticamente, sem precisar mexer nesta tela.</div>';
      return;
    }
    let h='<div class="card"><h3>Fluxo de caixa mensal</h3>'+tabela([
      {t:'Mês',f:x=>String(x.mes).slice(0,7).split('-').reverse().join('/')},
      {t:'Unidade',f:x=>x.unidade||'—'},
      {t:'Natureza',f:x=>x.natureza||'—'},
      {t:'Tipo',f:x=>x.tipo||'—'},
      {t:'Subtipo',f:x=>x.subtipo||'—'},
      {t:'Crédito',n:1,f:x=>brl(x.credito)},
      {t:'Débito',n:1,f:x=>brl(x.debito)}
    ],dre)+'</div>';
    c.innerHTML=h;
  }
}

/* ===== porta unica do portal: sessao por usuario ===== */
const CDMMODS=['escritorio'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmTem(id){try{const l=JSON.parse(sessionStorage.getItem('cdm_modulos')||'[]');return Array.isArray(l)&&l.some(function(m){return m&&m.id===id})}catch(e){return false}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/rpc/portal_eu',{method:'POST',headers:{apikey:'sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV',Authorization:'Bearer sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV','Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'escritorio'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  try{sessionStorage.setItem('cdm_nome',j.nome||'');sessionStorage.setItem('cdm_admin',j.admin?'1':'0');sessionStorage.setItem('cdm_modulos',JSON.stringify(ms))}catch(e){}
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const dth=s=>{if(!s)return '—';const t=String(s);const d=t.slice(8,10)+'/'+t.slice(5,7);const h=t.slice(11,16);return h?d+' '+h:d};

function escPede(){
  return '<div class="box" style="margin:30px auto"><h2>Financeiro</h2>'+
    '<p>Os números do escritório pedem a senha do escritório, além do seu login.</p>'+
    '<input type="password" id="pw" autocomplete="off" placeholder="senha do escritório">'+
    '<button onclick="entrar()">Ver os números</button>'+
    '<div class="err" id="err"></div></div>';
}

/* ===================== usuarios e permissoes (so admin) ===================== */
let USUS=[], UMODS=[], USMSG='', USPROV=null, USFORM=false;

async function padm(acao,dados){
  const r=await fetch(SB+'rpc/portal_admin',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:cdmTok(),p_acao:acao,p_dados:dados||{}})});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const er=new Error((j&&j.message)||'falha');er.code=(j&&j.code)||'';throw er}
  return j;
}

async function usCarregar(){
  try{
    const r=await Promise.all([padm('listar'),padm('modulos')]);
    USUS=Array.isArray(r[0])?r[0]:[];
    UMODS=Array.isArray(r[1])?r[1]:[];
    USMSG='';
  }catch(e){
    USUS=[];UMODS=[];
    USMSG=(e.code==='42501')?'Só o perfil de proprietário administra usuários.':'Não foi possível carregar os usuários agora.';
  }
  if(ABA==='usuarios')boot();
}

function usGrupos(){
  const g=[];
  (Array.isArray(UMODS)?UMODS:[]).forEach(function(m){
    if(!m||!m.id)return;
    const k=m.grupo||'Outros';
    let e=null;for(let i=0;i<g.length;i++)if(g[i].k===k)e=g[i];
    if(!e){e={k:k,ms:[]};g.push(e)}
    e.ms.push(m);
  });
  return g;
}

function usSelos(u){
  const s=[];
  const pill=(t,c)=>'<span style="display:inline-block;border-radius:999px;padding:1px 8px;font-size:10.5px;border:1px solid '+c+';color:'+c+';margin:2px 3px 0 0">'+t+'</span>';
  s.push(u.ativo?pill('ativo','#8fbf7a'):pill('desativado','#e0736a'));
  if(u.admin)s.push(pill('proprietário','#c8a35a'));
  if(u.precisa_trocar)s.push(pill('troca a senha','#8d8a83'));
  if(u.bloqueado)s.push(pill('bloqueado','#e0736a'));
  return '<div>'+s.join('')+'</div>';
}

function usRender(){
  if(!ADMIN)return '<div class="aviso">Só o perfil de proprietário administra usuários.</div>';
  if(USMSG)return '<div class="aviso">'+esc(USMSG)+'</div>';
  if(!USUS.length||!UMODS.length)return '<div class="load">Carregando usuários…</div>';
  const gs=usGrupos();
  let h='';
  if(USPROV)h+='<div class="aviso" id="usprovbox"><b>Senha provisória de '+esc(USPROV.n)+'</b><br>'+
    '<code id="usprov" style="display:inline-block;background:#111110;border:1px solid #35332e;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:17px;letter-spacing:1px;user-select:all">'+esc(USPROV.s)+'</code> '+
    '<button class="gh" onclick="usCopiar()">copiar</button><br>'+
    'Anote agora — ela não aparece de novo. A pessoa troca a senha no primeiro acesso.</div>';
  h+='<div id="usform">'+(USFORM?usFormHtml():'')+'</div>';
  h+='<div class="card"><h3>Quem vê o quê</h3>';
  h+='<div class="aviso">Marcar ou desmarcar salva na hora, sem botão. Desativar uma pessoa derruba a sessão dela na mesma hora.</div>';
  h+='<div style="margin-bottom:10px"><button class="gh" onclick="usNovo()">+ Novo usuário</button> <button class="gh" onclick="usCarregar()">atualizar</button></div>';
  h+='<table><thead><tr><th rowspan="2" onclick="return false">Pessoa</th>';
  gs.forEach(function(g){h+='<th colspan="'+g.ms.length+'" style="text-align:center" onclick="return false">'+esc(g.k)+'</th>'});
  h+='<th rowspan="2" onclick="return false">Ações</th></tr><tr>';
  gs.forEach(function(g){g.ms.forEach(function(m){
    h+='<th style="text-align:center" title="'+esc(m.nome)+'" onclick="return false">'+(m.icone||'')+'<br><span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px">'+esc(m.id)+'</span></th>';
  })});
  h+='</tr></thead><tbody>';
  USUS.forEach(function(u){
    const tem=Array.isArray(u.modulos)?u.modulos:[];
    h+='<tr><td style="white-space:normal;min-width:190px"><b>'+esc(u.nome||'')+'</b><br>'+
       '<span style="color:#8d8a83;font-size:11px">'+esc(u.usuario||'')+(u.unidade?' · '+esc(u.unidade):'')+'</span><br>'+
       '<span style="color:#6f6c66;font-size:11px">último acesso: '+dth(u.ultimo_acesso)+'</span>'+usSelos(u)+'</td>';
    gs.forEach(function(g){g.ms.forEach(function(m){
      h+='<td style="text-align:center"><input type="checkbox" '+(tem.indexOf(m.id)>=0?'checked':'')+
         ' onchange="usPerm(this,'+u.id+',\''+m.id+'\')" title="'+esc(u.nome)+' — '+esc(m.nome)+'"></td>';
    })});
    h+='<td style="white-space:normal;min-width:150px">'+
       '<button class="gh" onclick="usResetar('+u.id+')">Resetar senha</button> '+
       '<button class="gh" onclick="usAtivo('+u.id+','+(u.ativo?'false':'true')+')">'+(u.ativo?'Desativar':'Reativar')+'</button>'+
       (u.bloqueado?' <button class="gh" onclick="usDesbloquear('+u.id+')">Desbloquear</button>':'')+
       '</td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function usFormHtml(){
  const st='background:#111110;border:1px solid #35332e;border-radius:9px;color:#e8e6e1;padding:9px 11px;font-size:14px;outline:none;width:auto';
  return '<div class="card"><h3>Novo usuário</h3>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
    '<input id="nu_u" placeholder="usuário (sem espaço)" autocapitalize="none" spellcheck="false" style="'+st+'">'+
    '<input id="nu_n" placeholder="nome completo" style="'+st+'">'+
    '<input id="nu_d" placeholder="unidade (opcional)" style="'+st+'">'+
    '<label style="font-size:13px;color:#8d8a83"><input type="checkbox" id="nu_a"> proprietário (administra usuários)</label>'+
    '<button class="gh" onclick="usCriar()">Criar</button>'+
    '<button class="gh" onclick="usFecharForm()">cancelar</button>'+
    '</div><div class="err" id="nu_e"></div>'+
    '<div style="color:#6f6c66;font-size:11.5px;margin-top:6px">A senha provisória aparece uma única vez depois de criar. Os módulos você marca na tabela abaixo.</div></div>';
}
function usNovo(){USFORM=true;boot()}
function usFecharForm(){USFORM=false;boot()}

function usFeed(el,txt,ok){
  const td=el&&el.parentNode;if(!td)return;
  const s=document.createElement('span');
  s.textContent=' '+txt;
  s.style.cssText='font-size:10px;margin-left:3px;color:'+(ok?'#8fbf7a':'#e0736a');
  td.appendChild(s);
  setTimeout(function(){try{td.removeChild(s)}catch(e){}},1600);
}

async function usPerm(el,uid,mid){
  const marcado=el.checked;
  el.disabled=true;
  try{
    await padm('permissao',{usuario_id:uid,modulo_id:mid,marcado:marcado});
    for(let i=0;i<USUS.length;i++)if(USUS[i].id===uid){
      const l=Array.isArray(USUS[i].modulos)?USUS[i].modulos:[];
      const p=l.indexOf(mid);
      if(marcado){if(p<0)l.push(mid)}else{if(p>=0)l.splice(p,1)}
      USUS[i].modulos=l;
    }
    usFeed(el,'salvo',true);
  }catch(e){
    el.checked=!marcado;
    usFeed(el,'não salvou',false);
  }
  el.disabled=false;
}

async function usResetar(uid){
  let nome='';for(let i=0;i<USUS.length;i++)if(USUS[i].id===uid)nome=USUS[i].nome||'';
  if(!confirm('Gerar uma senha nova para '+nome+'? A senha atual para de valer e a sessão dela cai.'))return;
  try{
    const r=await padm('resetar_senha',{usuario_id:uid});
    USPROV={n:nome,s:(r&&r.senha_provisoria)||''};
    await usCarregar();
  }catch(e){USMSG='Não foi possível resetar a senha.';boot()}
}

async function usAtivo(uid,valor){
  let nome='';for(let i=0;i<USUS.length;i++)if(USUS[i].id===uid)nome=USUS[i].nome||'';
  if(!valor&&!confirm('Desativar '+nome+'? A sessão aberta dela cai na hora.'))return;
  try{await padm('editar',{usuario_id:uid,ativo:valor});await usCarregar();}
  catch(e){USMSG='Não foi possível mudar o cadastro.';boot()}
}

async function usDesbloquear(uid){
  try{await padm('desbloquear',{usuario_id:uid});await usCarregar();}
  catch(e){USMSG='Não foi possível desbloquear.';boot()}
}

async function usCriar(){
  const u=(($('nu_u')||{}).value||'').trim().toLowerCase();
  const n=(($('nu_n')||{}).value||'').trim();
  const d=(($('nu_d')||{}).value||'').trim();
  const a=!!(($('nu_a')||{}).checked);
  if(!u||!n){$('nu_e').textContent='Preencha usuário e nome.';return}
  if(/\s/.test(u)){$('nu_e').textContent='O usuário não pode ter espaço.';return}
  $('nu_e').textContent='Criando…';
  try{
    const r=await padm('criar',{usuario:u,nome:n,unidade:d,admin:a});
    USPROV={n:n,s:(r&&r.senha_provisoria)||''};
    USFORM=false;
    await usCarregar();
  }catch(e){$('nu_e').textContent=(e.message&&/duplicad|unique|already/i.test(e.message))?'Já existe alguém com esse usuário.':'Não foi possível criar.'}
}

function usCopiar(){
  const c=$('usprov');if(!c)return;
  const t=c.textContent||'';
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t)}catch(e){}
  try{const sel=window.getSelection(),r=document.createRange();r.selectNodeContents(c);sel.removeAllRanges();sel.addRange(r)}catch(e){}
}

/* ===================== abertura da tela ===================== */
(async function(){
  const ok=await cdmGuarda();
  if(!ok)return;
  $('app').hidden=false;
  if(ADMIN)ABA='caixa';
  const s=pw();
  if(s){try{D=await chamar(s)}catch(e){D=null;try{sessionStorage.removeItem(PWKEY)}catch(x){}}}
  boot();
  if(ADMIN)usCarregar();
})();

document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&document.activeElement===$('pw')) entrar() });
