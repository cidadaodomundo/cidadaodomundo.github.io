<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Delivery · São Braz · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,sans-serif;font-size:15px;padding:18px;max-width:1180px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
button.b.on{background:var(--brand);color:#111;border-color:var(--brand)}
h2{font-size:15px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .hint,.hint{font-weight:500;font-size:11.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:16px;text-align:left;color:var(--text);font-family:inherit}
button.c{cursor:pointer}
.c.sel{border-color:var(--brand)}
.c .nm{font-weight:700;font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.c .big{font-family:'Anton',sans-serif;font-size:40px;line-height:1.1;margin-top:4px}
.c .qtd{color:var(--muted);font-size:12px;margin-top:2px}
.c.zero .big{color:var(--ok)}
.c.tem .big{color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.p-COZINHA,.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.p-BEBIDA{background:rgba(80,160,230,.15);color:#6bb4ef}
.p-INTERNO,.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.p-off{background:rgba(138,137,126,.15);color:var(--muted)}
.lista{background:var(--s1);border:1px solid var(--line);border-radius:13px}
.it{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.it:last-child{border-bottom:none}
.it .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it .l1 b{font-weight:700}
.it .m{color:var(--muted);font-size:12px}
.it .l2{color:var(--text2);margin-top:4px;line-height:1.45}
.it.hoje{border-left:3px solid var(--brand)}
.vazio{color:var(--muted);font-size:13px;padding:14px}
.fresco{color:var(--muted);font-size:12px;margin:-6px 0 14px;line-height:1.6}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin:10px 0;line-height:1.5}
.grp{padding:10px 14px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:none}
.grp .t{font-weight:700;font-size:13px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--s2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--text2)}
.chip i{font-style:normal;color:var(--muted);font-size:11px}
.bar{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0}
.bar .tr{flex:1;height:8px;background:var(--s2);border-radius:5px;overflow:hidden}
.bar .fi{height:100%;background:var(--brand)}
.txt{color:var(--text2);font-size:13px;line-height:1.55;white-space:pre-line}
.load{color:var(--muted);padding:30px;text-align:center}
.erro{color:var(--bad);padding:20px}
.pzal{border-left:3px solid var(--bad)}
.pzbox{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.pzops{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.pzop{display:flex;gap:8px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:12.5px}
.pzop input{margin-top:3px}
.pzfazer{margin:10px 0;font-size:13px;line-height:1.5;color:var(--text2)}
.pzcampo{margin:8px 0;font-size:12.5px;color:var(--text2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pzcampo input{background:var(--s1);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font-family:inherit;font-size:13px;min-width:180px;color-scheme:dark}
.pzmsg{margin-top:8px;font-size:12.5px}
@media(max-width:600px){body{padding:12px}.c .big{font-size:32px}}
</style>
</head>
<body>
<div class="top">
  <div><h1>🛵 Delivery · São Braz</h1><div class="sub">Erros da loja, itens pausados e o que o cliente disse no iFood</div></div>
  <div class="rt" id="per">
    <button class="b" data-d="1">Hoje</button>
    <button class="b on" data-d="7">7 dias</button>
    <button class="b" data-d="15">15 dias</button>
    <button class="b" data-d="30">30 dias</button>
  </div>
</div>
<div id="app" class="load">Carregando…</div>
<script>
const SBR='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){return v==null?'—':String(v).replace('.',',')}
async function porta(acao,dados){
  const r=await fetch(SBR+'rpc/sb_consulta',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:cdmTok(),p_acao:acao,p_dados:dados||{}})});
  if(!r.ok){let t='';try{t=(await r.json()).message||''}catch(e){}throw new Error(t||('erro '+r.status))}
  return r.json();
}
/* ===== itens pausados: o motivo e o que fazer ===== */
const PZ_MOT={
  esqueceram:{ic:'🙈',t:'Esqueceram de despausar',d:'O item tem, mas ficou pausado por engano.',
    fazer:{ifood:'Despause agora: no Gestor de Pedidos do iFood, abra Cardápio, procure o item e ligue a chave de disponível.',goomer:'Despause agora: no painel do Goomer, abra Cardápio, procure o item e marque como ativo (e visível).'},
    depois:'Na próxima leitura do cardápio eu confiro. Se continuar pausado, volta a acender aqui.'},
  falta_insumo:{ic:'📦',t:'Acabou o ingrediente',d:'Falta insumo no estoque (ex.: morango, pão, bebida que não chegou).',data:true,
    fazer:{ifood:'Peça a compra e diga quando volta. Quando chegar, despause no iFood.',goomer:'Peça a compra e diga quando volta. Quando chegar, reative no Goomer.'},
    depois:'Se passar da data e o item continuar pausado, volta a acender aqui.'},
  equipamento:{ic:'🔧',t:'Equipamento quebrado',d:'Chopeira, fritadeira, chapa, geladeira, forno…',data:true,obs:'Qual equipamento?',
    fazer:{ifood:'Ao salvar, abro sozinho um chamado na tela Manutenção. Quando consertar, despause no iFood.',goomer:'Ao salvar, abro sozinho um chamado na tela Manutenção. Quando consertar, reative no Goomer.'},
    depois:'Se passar da data e continuar pausado, volta a acender aqui.'},
  temporario:{ic:'⏸',t:'Pausado de propósito, por um tempo',d:'Fora da época (caldo no verão), pouco movimento, promoção que acabou.',data:true,
    fazer:{ifood:'Nada agora. Diga até quando fica pausado.',goomer:'Nada agora. Diga até quando fica pausado.'},
    depois:'Na data, volta a acender para você decidir se reativa.'},
  saiu_cardapio:{ic:'🗑',t:'Saiu do cardápio de vez',d:'A casa não vai mais vender esse item.',
    fazer:{ifood:'Apague o item no iFood (Cardápio → item → excluir). Item pausado para sempre confunde o cliente e esconde os pausados de verdade.',goomer:'Apague ou arquive o item no Goomer, para ele sumir do tablet de mesa.'},
    depois:'Fica na lista cinza "falta apagar" até sumir do cardápio.'},
  nao_existe:{ic:'❓',t:'Item não existe / cadastro errado',d:'Duplicado, nome errado, item de teste, cadastrado na loja errada.',
    fazer:{ifood:'Apague o cadastro errado no iFood. Se o certo existe com outro nome, confira se ele está ativo.',goomer:'Apague o cadastro errado no Goomer. Se o certo existe com outro nome, confira se ele está ativo.'},
    depois:'Fica na lista cinza "falta apagar" até sumir do cardápio.'},
  verificar:{ic:'🔎',t:'Não sei, vou verificar',d:'Preciso perguntar para a cozinha ou para o gerente.',
    fazer:{ifood:'Pergunte na loja e volte aqui para escolher o motivo certo.',goomer:'Pergunte na loja e volte aqui para escolher o motivo certo.'},
    depois:'Se em 2 dias não tiver resposta, volta a acender aqui.'}
};
const PZ_ALERTA={nao_despausou:'Você marcou que iam despausar, mas o item continua pausado.',passou_data:'Passou a data de volta e o item continua pausado.',verificar_venceu:'Ficou em "vou verificar" há mais de 2 dias.'};
let PZ={};
function pzHoje(){const d=new Date(Date.now()-3*3600e3);return d.toISOString().slice(0,10)}
function pzCh(c){return /goomer/i.test(c)?'goomer':'ifood'}
function pzDica(x){
  if(x.vendeu30>0&&x.dias_sem_vender!=null&&x.dias_sem_vender<=7)return '💡 Vendeu '+x.vendeu30+' em 30 dias, a última em '+esc(x.ultima_venda)+'. Parece item que devia estar no ar: acabou o ingrediente ou esqueceram de despausar?';
  if(x.vendeu30===0&&x.dias>=30)return '💡 Pausado há '+x.dias+' dias e sem nenhuma venda em 30 dias. Talvez tenha saído do cardápio de vez.';
  return '';
}
function pzItem(x,k,i){
  const m=x.motivo&&PZ_MOT[x.motivo], ch=pzCh(x.canal);
  let h='<div class="it pz'+(x.ordem==='1'?' pzal':'')+'" id="pz_'+k+'_'+i+'"><div class="l1">';
  h+=m?'<span class="pill '+(x.ordem==='1'?'p-bad':x.ordem==='4'?'p-off':'p-ok')+'">'+m.ic+' '+esc(m.t)+'</span>':'<span class="pill p-warn">sem motivo</span>';
  h+='<b>'+esc(x.item)+'</b><span class="m">'+esc(marcaCurta(x.marca))+(x.estado&&x.estado!=='pausado'?' · '+esc(x.estado):'')+' · pausado desde '+esc(x.desde)+'</span></div>';
  h+='<div class="l2">';
  if(x.vendeu30!=null)h+='<span class="m">Vendeu '+x.vendeu30+' em 30 dias'+(x.ultima_venda?' · última venda '+esc(x.ultima_venda):'')+'</span><br>';
  if(x.ordem==='1')h+='<b style="color:var(--bad)">⚠️ '+esc(PZ_ALERTA[x.alerta]||'')+'</b><br>';
  if(m){
    h+='<span class="m">'+esc(x.quem||'')+' em '+esc(x.quando||'')+(x.volta_em?' · volta em <b>'+esc(x.volta_em)+'</b>':'')+(x.obs?' · "'+esc(x.obs)+'"':'')+(x.chamado?' · chamado de manutenção nº '+esc(x.chamado):'')+'</span><br>';
    h+='👉 '+esc(m.fazer[ch]);
  } else { const dc=pzDica(x); if(dc)h+=dc; }
  h+='</div><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="b" data-pzabre="'+k+'|'+i+'">'+(m?'Mudar o motivo':'Por que está pausado?')+'</button>'+
     (m?'<button class="b" data-pzdesfaz="'+k+'|'+i+'">Apagar resposta</button>':'')+'</div><div class="pzform" id="pzf_'+k+'_'+i+'"></div></div>';
  return h;
}
function pzHtml(L,k){
  L=L||[];PZ[k]=L;
  if(!L.length)return '<div class="lista"><div class="vazio">Nada pausado na última leitura.</div></div>';
  const g={'1':[],'2':[],'3':[],'4':[]};L.forEach(function(x,i){(g[x.ordem]||g['3']).push([x,i])});
  let h='<div class="cards" style="margin-bottom:12px">'+
    '<div class="c'+(g['1'].length?' tem':' zero')+'"><div class="nm">⚠️ Precisa de atenção</div><div class="big">'+g['1'].length+'</div><div class="qtd">passou a data ou não despausaram</div></div>'+
    '<div class="c'+(g['2'].length?' tem':' zero')+'"><div class="nm">❔ Sem motivo</div><div class="big">'+g['2'].length+'</div><div class="qtd">ninguém disse por que está pausado</div></div>'+
    '<div class="c"><div class="nm">✅ Com motivo</div><div class="big">'+g['3'].length+'</div><div class="qtd">pausado com explicação</div></div></div>';
  const tit={'1':'⚠️ Precisa de atenção','2':'❔ Sem motivo — diga por que está pausado','3':'✅ Com motivo','4':'🗑 Saiu de vez ou não existe — falta apagar do cardápio'};
  ['1','2','3','4'].forEach(function(o){if(!g[o].length)return;
    const lista='<div class="lista">'+g[o].map(function(p){return pzItem(p[0],k,p[1])}).join('')+'</div>';
    h+=o==='4'?'<details style="margin-top:12px"><summary class="hint" style="cursor:pointer;padding:6px 0">'+tit[o]+' ('+g[o].length+')</summary>'+lista+'</details>'
              :'<div class="hint" style="margin:12px 0 6px;font-weight:700">'+tit[o]+' ('+g[o].length+')</div>'+lista});
  return h;
}
function pzForm(k,i){
  const x=PZ[k][i], ch=pzCh(x.canal), f=document.getElementById('pzf_'+k+'_'+i);
  if(f.innerHTML){f.innerHTML='';return}
  let h='<div class="pzbox"><div class="hint" style="margin-bottom:8px">Escolha o motivo de <b>'+esc(x.item)+'</b>:</div><div class="pzops">';
  Object.keys(PZ_MOT).forEach(function(mk){const m=PZ_MOT[mk];
    h+='<label class="pzop"><input type="radio" name="pzm_'+k+'_'+i+'" value="'+mk+'"'+(x.motivo===mk?' checked':'')+'><span><b>'+m.ic+' '+esc(m.t)+'</b><br><span class="m">'+esc(m.d)+'</span></span></label>'});
  h+='</div><div class="pzext"></div><div class="pzmsg"></div></div>';
  f.innerHTML=h;
  const ext=f.querySelector('.pzext');
  function mostra(){
    const sel=f.querySelector('input[type=radio]:checked'); if(!sel){ext.innerHTML='';return}
    const m=PZ_MOT[sel.value]; let e='<div class="pzfazer">👉 <b>O que fazer:</b> '+esc(m.fazer[ch])+'<br><span class="m">'+esc(m.depois)+'</span></div>';
    if(m.obs)e+='<div class="pzcampo">'+esc(m.obs)+' <input type="text" class="pzobs" maxlength="120" placeholder="ex.: chopeira" value="'+esc(x.motivo===sel.value?x.obs||'':'')+'"></div>';
    else e+='<div class="pzcampo">Observação (opcional) <input type="text" class="pzobs" maxlength="200" value="'+esc(x.motivo===sel.value?x.obs||'':'')+'"></div>';
    if(m.data)e+='<div class="pzcampo">Volta quando? <input type="date" class="pzdata" min="'+pzHoje()+'"> <span class="m">(obrigatório)</span></div>';
    e+='<button class="b on pzsalva">Salvar</button>';
    ext.innerHTML=e;
    ext.querySelector('.pzsalva').onclick=async function(){
      const msg=f.querySelector('.pzmsg'), dt=ext.querySelector('.pzdata'), ob=ext.querySelector('.pzobs');
      if(m.obs&&!(ob.value||'').trim()){msg.innerHTML='<span style="color:var(--bad)">Escreva qual equipamento.</span>';return}
      if(m.data&&!(dt&&dt.value)){msg.innerHTML='<span style="color:var(--bad)">Diga quando o item volta.</span>';return}
      if(m.data&&dt.value<pzHoje()){msg.innerHTML='<span style="color:var(--bad)">Essa data já passou.</span>';return}
      this.disabled=true; msg.textContent='Salvando…';
      try{const r=await pzGrava({acao:'responder',canal:x.canal,item:x.item,motivo:sel.value,volta_em:dt?dt.value:'',obs:ob?ob.value:''});
        msg.innerHTML='<span style="color:var(--ok)">Salvo.'+(r.chamado?' Chamado de manutenção nº '+esc(r.chamado)+' aberto.':'')+'</span>';
        setTimeout(function(){carregar()},700);
      }catch(er){this.disabled=false;msg.innerHTML='<span style="color:var(--bad)">Não salvou: '+esc(er.message)+'</span>'}
    };
  }
  f.querySelectorAll('input[type=radio]').forEach(function(r){r.onchange=mostra});mostra();
}
async function pzGrava(dados){
  const r=await fetch(SBR+'rpc/sb_cardapio_responder',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:cdmTok(),p_dados:dados})});
  if(!r.ok){let t='';try{t=(await r.json()).message||''}catch(e){}throw new Error(t||('erro '+r.status))}
  return r.json();
}
function pzBind(root){
  root.querySelectorAll('[data-pzabre]').forEach(function(b){b.onclick=function(){const p=b.dataset.pzabre.split('|');pzForm(p[0],+p[1])}});
  root.querySelectorAll('[data-pzdesfaz]').forEach(function(b){b.onclick=async function(){const p=b.dataset.pzdesfaz.split('|'),x=PZ[p[0]][+p[1]];
    if(!b.dataset.ok){b.dataset.ok='1';b.textContent='Toque de novo para apagar';b.style.borderColor='var(--bad)';return}
    b.disabled=true;try{await pzGrava({acao:'desfazer',canal:x.canal,item:x.item});carregar()}catch(er){b.disabled=false;b.textContent='Erro: '+er.message}}});
}

const CDMMODS=['sbdelivery'];
let DIAS=7, D=null, FILTRO=null;
function marcaCurta(m){return String(m||'').replace(/CIDAD[ÃA]O DO MUNDO\s*/i,'').replace(/\s*-\s*(S[ÃA]O BRAZ|SB)\s*$/i,'').trim()||String(m||'')}
const TIPOS=[['COZINHA','🍳','Erro da cozinha','veio errado ou impróprio'],['BEBIDA','🥤','Erro de bebida','bebida que faltou ou veio errada'],['INTERNO','📦','Erro interno','faltou item, embalagem, sistema']];
function render(){
  const d=D, a=document.getElementById('app'), f=d.fresco||{};
  a.className='';
  let h='<div class="fresco">Período: <b>'+esc(d.de)+' a '+esc(d.ate)+'</b> · pedidos e chat do iFood até '+esc(f.gestor_web||'—')+
        ' · cancelamentos até '+esc(f.cancelamento||'—')+' <i>(o iFood manda com atraso)</i> · avaliações até '+esc(f.avaliacao||'—')+'</div>';
  const t=d.erros_total||{};
  h+='<h2>⚠️ Erros da loja <span class="hint">toque num quadro para ver só aquele tipo</span></h2><div class="cards">';
  TIPOS.forEach(function(x){const n=t[x[0]]||0;
    h+='<button class="c '+(n?'tem':'zero')+(FILTRO===x[0]?' sel':'')+'" data-f="'+x[0]+'"><div class="nm">'+x[1]+' '+x[2]+'</div><div class="big">'+n+'</div><div class="qtd">'+x[3]+'</div></button>'});
  h+='</div>';
  const L=(d.erros||[]).filter(function(e){return !FILTRO||e.tipo===FILTRO});
  h+='<h2 style="margin-top:16px">'+(FILTRO?'Só '+esc(FILTRO.toLowerCase()):'Todos os erros')+' <span class="hint">'+L.length+' no período'+(FILTRO?' · <a href="#" id="limpa" style="color:var(--brand)">ver todos</a>':'')+'</span></h2>';
  if(!L.length){h+='<div class="lista"><div class="vazio">Nenhum erro registrado neste período. 👏</div></div>'}
  else{h+='<div class="lista">';L.forEach(function(e){
    h+='<div class="it"><div class="l1"><span class="pill p-'+esc(e.tipo)+'">'+esc(e.tipo)+'</span><b>Pedido '+esc(e.pedido)+'</b><span class="m">'+esc(e.quando)+' · '+esc(marcaCurta(e.marca))+' · veio de: '+esc(e.fonte)+'</span></div><div class="l2">'+esc(e.detalhe)+'</div></div>'});
    h+='</div>'}
  h+='<h2>📵 Pausados no iFood <span class="hint">'+(d.pausados||[]).length+' itens · cardápio lido em '+esc(d.pausados_lido||'—')+'</span></h2>'+pzHtml(d.pausados,'if');
  const v=d.aval||{};
  h+='<h2>⭐ Avaliações do iFood <span class="hint">todas as marcas do São Braz</span></h2><div class="cards">';
  h+='<div class="c"><div class="nm">No período</div><div class="big">'+num(v.media_periodo)+'</div><div class="qtd">'+(v.n_periodo||0)+' avaliações</div></div>';
  h+='<div class="c"><div class="nm">Últimos 30 dias</div><div class="big">'+num(v.media_30)+'</div><div class="qtd">'+(v.n_30||0)+' avaliações</div></div>';
  const no=v.notas||{}, tot=Object.keys(no).reduce(function(s,k){return s+no[k]},0);
  h+='<div class="c"><div class="nm">Notas no período</div>';
  [5,4,3,2,1].forEach(function(k){const n=no[k]||0;h+='<div class="bar"><span>'+k+'★</span><div class="tr"><div class="fi" style="width:'+(tot?Math.round(n*100/tot):0)+'%"></div></div><span>'+n+'</span></div>'});
  h+='</div></div>';
  const R=v.ruins||[];
  h+='<h2 style="margin-top:16px">Notas de 1 a 3 <span class="hint">'+R.length+' no período</span></h2>';
  if(!R.length){h+='<div class="lista"><div class="vazio">Nenhuma nota baixa no período.</div></div>'}
  else{h+='<div class="lista">';R.forEach(function(r){
    h+='<div class="it"><div class="l1"><span class="pill p-bad">'+esc(r.nota)+'★</span><b>'+esc(r.quando)+'</b><span class="m">'+esc(marcaCurta(r.marca))+(r.pedido?' · pedido '+esc(r.pedido):'')+'</span></div>'+
       '<div class="l2">'+(r.comentario?'"'+esc(r.comentario)+'"':'<i class="m">sem comentário</i>')+(r.tags?'<br><span class="m">'+esc(r.tags)+'</span>':'')+'</div></div>'});
    h+='</div>'}
  const B=v.comentarios_bons||[];
  if(B.length){h+='<h2 style="margin-top:16px">O que elogiaram <span class="hint">últimos '+B.length+' comentários</span></h2><div class="lista">';
    B.forEach(function(r){h+='<div class="it"><div class="l1"><span class="pill p-ok">'+esc(r.nota)+'★</span><b>'+esc(r.quando)+'</b><span class="m">'+esc(marcaCurta(r.marca))+'</span></div><div class="l2">"'+esc(r.comentario)+'"</div></div>'});
    h+='</div>'}
  a.innerHTML=h;pzBind(a);
  a.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){FILTRO=(FILTRO===b.dataset.f?null:b.dataset.f);render()}});
  const lp=document.getElementById('limpa');if(lp)lp.onclick=function(ev){ev.preventDefault();FILTRO=null;render()};
}
async function carregar(){
  const a=document.getElementById('app');a.className='load';a.textContent='Carregando…';
  try{D=await porta('delivery',{dias:DIAS});render()}
  catch(e){a.className='erro';a.textContent='Não consegui carregar: '+e.message}
}
function boot(){
  document.querySelectorAll('#per [data-d]').forEach(function(b){b.onclick=function(){
    DIAS=+b.dataset.d;document.querySelectorAll('#per [data-d]').forEach(function(x){x.classList.toggle('on',x===b)});carregar()}});
  carregar();
}
/* ===== porta unica do portal: sessao por usuario ===== */
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SBR+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:CDMMODS[0]})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  try{sessionStorage.setItem('cdm_nome',j.nome||'');sessionStorage.setItem('cdm_admin',j.admin?'1':'0');sessionStorage.setItem('cdm_modulos',JSON.stringify(ms))}catch(e){}
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
