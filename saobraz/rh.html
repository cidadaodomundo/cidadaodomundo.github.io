<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Caixa do RH · São Braz · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,sans-serif;font-size:15px;padding:18px;max-width:1180px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
button.b.on{background:var(--brand);color:#111;border-color:var(--brand)}
h2{font-size:15px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .hint,.hint{font-weight:500;font-size:11.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:16px;text-align:left;color:var(--text);font-family:inherit}
button.c{cursor:pointer}
.c.sel{border-color:var(--brand)}
.c .nm{font-weight:700;font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.c .big{font-family:'Anton',sans-serif;font-size:40px;line-height:1.1;margin-top:4px}
.c .qtd{color:var(--muted);font-size:12px;margin-top:2px}
.c.zero .big{color:var(--ok)}
.c.tem .big{color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.p-COZINHA,.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.p-BEBIDA{background:rgba(80,160,230,.15);color:#6bb4ef}
.p-INTERNO,.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.p-off{background:rgba(138,137,126,.15);color:var(--muted)}
.lista{background:var(--s1);border:1px solid var(--line);border-radius:13px}
.it{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.it:last-child{border-bottom:none}
.it .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it .l1 b{font-weight:700}
.it .m{color:var(--muted);font-size:12px}
.it .l2{color:var(--text2);margin-top:4px;line-height:1.45}
.it.hoje{border-left:3px solid var(--brand)}
.vazio{color:var(--muted);font-size:13px;padding:14px}
.fresco{color:var(--muted);font-size:12px;margin:-6px 0 14px;line-height:1.6}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin:10px 0;line-height:1.5}
.grp{padding:10px 14px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:none}
.grp .t{font-weight:700;font-size:13px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--s2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--text2)}
.chip i{font-style:normal;color:var(--muted);font-size:11px}
.bar{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0}
.bar .tr{flex:1;height:8px;background:var(--s2);border-radius:5px;overflow:hidden}
.bar .fi{height:100%;background:var(--brand)}
.txt{color:var(--text2);font-size:13px;line-height:1.55;white-space:pre-line}
.load{color:var(--muted);padding:30px;text-align:center}
.erro{color:var(--bad);padding:20px}
.pzal{border-left:3px solid var(--bad)}
.pzbox{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.pzops{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.pzop{display:flex;gap:8px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:12.5px}
.pzop input{margin-top:3px}
.pzfazer{margin:10px 0;font-size:13px;line-height:1.5;color:var(--text2)}
.pzcampo{margin:8px 0;font-size:12.5px;color:var(--text2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pzcampo input{background:var(--s1);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font-family:inherit;font-size:13px;min-width:180px;color-scheme:dark}
.pzmsg{margin-top:8px;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips .b{padding:6px 10px;font-size:12px}
.pre{white-space:pre-wrap;word-break:break-word}
.foto{display:block;max-width:100%;max-height:420px;border-radius:9px;margin-top:8px}
@media(max-width:600px){body{padding:12px}.c .big{font-size:32px}}
.card{background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--cc,var(--line));border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px}
.card .nm2{font-weight:800;font-size:14px}
.card .tag{float:right;font-size:11px;font-weight:700;color:var(--text2);background:var(--s2);border-radius:999px;padding:2px 9px;margin-left:8px}
.expl{margin:8px 0;padding:8px 10px;border-radius:8px;background:rgba(234,179,8,.14);border-left:3px solid #eab308}
.resp{margin:8px 0;padding:8px 10px;border-radius:8px;background:rgba(34,197,94,.12);border-left:3px solid #22c55e}
.nota{margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--s2);font-size:12.5px}
.escreve{margin-top:8px}
.escreve textarea{width:100%;background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font-family:inherit;font-size:13px;resize:vertical}
.escreve .lin{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.pre{white-space:pre-wrap;word-break:break-word}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
</style>
</head>
<body>
<div class="top">
  <div><h1>📥 Caixa do RH · São Braz</h1><div class="sub">O que chegou do São Braz para o RH. Você explica aqui; quem aprova é o escritório (Fábio, Hellen ou Arissa).</div></div>
  <div class="rt"><button class="b" id="atual">↻ Atualizar</button></div>
</div>
<div id="app" class="load">Carregando…</div>
<script>
const SBR='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
async function porta(acao,dados){
  const r=await fetch(SBR+'rpc/sb_rh_caixa',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:cdmTok(),p_acao:acao,p_dados:dados||{}})});
  if(!r.ok){let t='';try{t=(await r.json()).message||''}catch(e){}throw new Error(t||('erro '+r.status))}
  return r.json();
}
/* mesmos rotulos da Caixa de entrada do RH (rh/caixa.html) */
const ROT={COMBINADO:'🤝 COMBINADO FIXO',COBERTURA:'🏪 COBRIU OUTRA LOJA',ORIENTACAO:'🗣 ORIENTADO',AVISOU_ANTES:'📞 AVISOU ANTES',ERRO_CORRIGIDO:'🔧 ERRO JÁ CORRIGIDO',ADVERTENCIA:'📄 ADVERTÊNCIA',SUSPENSAO:'⛔ SUSPENSÃO',ATESTADO:'🩺 ATESTADO',DECLARACAO:'🕐 DECLARAÇÃO',FALTA:'🚫 FALTA A CONFIRMAR',FERIAS:'🏖 FÉRIAS',BATIDA:'⏱ BATIDA',PARA_O_FLASH:'📤 LANÇAR NO FLASH',ENTROU:'🆕 ENTROU E FALTA CADASTRAR',SAIU:'👋 SAIU E CONTINUA NO FLASH',SEM_DONO:'🍽 COME E NÃO TEM DONO',FOLGA_ABONADA:'🏖 FOLGA COMBINADA'};
const COR={novo:'var(--brand)',aprovado:'var(--ok)',recusado:'var(--muted)'};
const AVCOR={SEM_CADASTRO:'var(--bad)',COMANDA_DESLIGADO:'var(--bad)',REFEICAO_NAO_LANCOU:'var(--warn)',REFEICAO_ACIMA_DO_DIREITO:'var(--warn)',REFEICAO_SEM_CARTAO:'var(--warn)'};
const CDMMODS=['sbrhcaixa'];
let D=null, ABA='novo';
function notasDe(fn){return (D.notas||[]).filter(fn)}
function htmlNotas(L){return L.map(function(n){return '<div class="nota">✍️ <b>'+esc(n.quem||'—')+'</b> <span class="m">'+esc(n.quando)+'</span><br><span class="pre">'+esc(n.texto)+'</span></div>'}).join('')}
function htmlEscreve(tipo,valor,ph){
  return '<div class="escreve"><textarea rows="2" maxlength="600" placeholder="'+esc(ph)+'"></textarea>'+
    '<div class="lin"><button class="b on" data-grava="'+tipo+'" data-v="'+esc(valor)+'">Enviar explicação</button><span class="m msg"></span></div></div>';
}
function detalhe(t){
  if(!t)return '';
  const m=/^([\s\S]*?)\s*— escrito por (.+)$/.exec(t);
  return m?'<div class="expl"><b>✍️ '+esc(m[2])+' explicou:</b><br><span class="pre">'+esc(m[1])+'</span></div>':'<div class="m pre" style="margin-top:6px">'+esc(t)+'</div>';
}
function cartao(x){
  let st;
  if(x.situacao==='novo')st='<span class="pill p-warn">⏳ esperando o escritório</span>';
  else if(x.situacao==='aprovado')st='<span class="pill p-ok">✅ aprovado por '+esc(x.decidido_por||'—')+' em '+esc(x.decidido_em||'—')+'</span>';
  else st='<span class="pill p-off">🗑 recusado por '+esc(x.decidido_por||'—')+' em '+esc(x.decidido_em||'—')+'</span>';
  const per=(x.data_fim&&x.data_fim!==x.data)?(esc(x.data)+' a '+esc(x.data_fim)):esc(x.data||'—');
  let h='<div class="card" style="--cc:'+(COR[x.situacao]||'var(--line)')+'"><span class="tag">'+esc(ROT[x.tipo]||x.tipo)+'</span>'+
    '<div class="nm2">'+esc(x.nome||'—')+'</div><div class="m">'+per+(x.motivo?' · '+esc(x.motivo):'')+' · chegou na caixa em '+esc(x.criado_em)+'</div>'+
    detalhe(x.detalhe)+'<div style="margin-top:6px">'+st+'</div>';
  if(x.situacao==='recusado'&&x.observacao)h+='<div class="m" style="margin-top:4px">Por quê: '+esc(x.observacao)+'</div>';
  if(x.resposta)h+='<div class="resp"><b>Resposta do escritório</b> — '+esc(x.respondido_por||'—')+' em '+esc(x.respondido_em||'—')+'<br><span class="pre">'+esc(x.resposta)+'</span></div>';
  h+=htmlNotas(notasDe(function(n){return n.caixa_id===x.id}));
  if(x.situacao==='novo')h+=htmlEscreve('caixa',String(x.id),'Explique aqui para o escritório (ex.: quem é, o que aconteceu)');
  return h+'</div>';
}
function aviso(a){
  let h='<div class="card" style="--cc:'+(AVCOR[a.tipo]||'var(--warn)')+'"><div class="nm2">'+esc(a.titulo)+'</div><div class="m" style="margin-top:4px">'+esc(a.texto)+'</div>';
  h+=htmlNotas(notasDe(function(n){return n.chave===a.chave}));
  h+=htmlEscreve('chave',a.chave,'O que aconteceu? (fica gravado com o seu nome e o escritório vê)');
  return h+'</div>';
}
function render(){
  const a=document.getElementById('app'), l=D.lido||{};
  a.className='';
  let h='<div class="fresco">Ponto do relógio lido até '+esc(l.ponto||'—')+' · refeições do Saipos até '+esc(l.refeicao||'—')+' · avisos dos últimos 7 dias</div>';
  const AV=D.avisos||[];
  h+='<h2>⚠️ Para você resolver <span class="hint">'+AV.length+' aviso(s) do São Braz</span></h2>';
  h+=AV.length?AV.map(aviso).join(''):'<div class="lista"><div class="vazio">Nenhum aviso nos últimos 7 dias. 👏</div></div>';
  const IT=D.itens||[], nNovo=IT.filter(function(x){return x.situacao==='novo'}).length;
  h+='<h2>📥 Na Caixa do RH <span class="hint">o que você escreveu nos cartões do ponto e o que os robôs acharam · quem aprova é o escritório</span></h2>';
  h+='<div class="abas"><button class="b'+(ABA==='novo'?' on':'')+'" data-aba="novo">⏳ Esperando o escritório · '+nNovo+'</button><button class="b'+(ABA==='feito'?' on':'')+'" data-aba="feito">✅ Já decididos (30 dias) · '+(IT.length-nNovo)+'</button></div>';
  const L=IT.filter(function(x){return ABA==='novo'?x.situacao==='novo':x.situacao!=='novo'});
  h+=L.length?L.map(cartao).join(''):'<div class="lista"><div class="vazio">'+(ABA==='novo'?'Nada esperando o escritório.':'Nada decidido nos últimos 30 dias.')+'</div></div>';
  a.innerHTML=h;
  a.querySelectorAll('[data-aba]').forEach(function(b){b.onclick=function(){ABA=b.dataset.aba;render()}});
  a.querySelectorAll('[data-grava]').forEach(function(b){b.onclick=async function(){
    const box=b.closest('.escreve'), ta=box.querySelector('textarea'), msg=box.querySelector('.msg'), t=(ta.value||'').trim();
    if(!t){msg.innerHTML='<span style="color:var(--bad)">Escreva alguma coisa antes.</span>';return}
    b.disabled=true;msg.textContent='Enviando…';
    const dados={texto:t};if(b.dataset.grava==='caixa')dados.caixa_id=+b.dataset.v;else dados.chave=b.dataset.v;
    try{const r=await porta('nota',dados);
      if(r&&r.ok===false){b.disabled=false;msg.innerHTML='<span style="color:var(--bad)">'+esc(r.erro||'não gravou')+'</span>';return}
      msg.innerHTML='<span style="color:var(--ok)">Gravado.</span>';setTimeout(carregar,600);
    }catch(er){b.disabled=false;msg.innerHTML='<span style="color:var(--bad)">Não gravou: '+esc(er.message)+'</span>'}
  }});
}
async function carregar(){
  const a=document.getElementById('app');a.className='load';a.textContent='Carregando…';
  try{D=await porta('listar',{});render()}
  catch(e){a.className='erro';a.textContent='Não consegui carregar: '+e.message}
}
/* ===== porta unica do portal: sessao por usuario ===== */
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SBR+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:CDMMODS[0]})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  try{sessionStorage.setItem('cdm_nome',j.nome||'');sessionStorage.setItem('cdm_admin',j.admin?'1':'0');sessionStorage.setItem('cdm_modulos',JSON.stringify(ms))}catch(e){}
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
document.getElementById('atual').onclick=function(){carregar()};
cdmGuarda().then(function(ok){if(ok)carregar()});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
