<style>

@media (max-width:760px){.ls{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 12px}.ls.cab{display:none}.ls .n{grid-column:1/-1;grid-row:1}.ls .ob{grid-column:1/-1}.ls .rt{display:inline;color:var(--muted);font-size:11px;margin-right:6px;text-transform:uppercase}.ls .r{grid-column:1/-1}.nm b{font-size:34px}.nms{gap:10px 26px}}

/* Campos essenciais nao podem ser recolhidos nem sumir em celular. */

@media(max-width:1100px){.ls{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ls.cab{display:none}.ls .n{grid-column:1/-1;grid-row:auto}.ls .ob{grid-column:1/-1}.ls .rt{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:4px}.ls .garantido,.ls .refeicao{border-top:1px solid var(--line);padding-top:9px}}

.legenda{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12px;margin:8px 0 16px}

.ls .n small{margin-left:0}.ls .garantido b,.ls .refeicao b{font-size:17px}.ls .c1 b,.ls .c2 b{font-size:16px}

<body>

<div class="wrap">
<div class="top">
  <div>
    <h1>Motoboys rodando no dia</h1>
    <div class="placar" id="placar"><span class="pl">carregando…</span></div>
  </div>
  <div class="rt per" id="per"></div>
</div>

<div id="app"><div class="load">Carregando…</div></div>
</div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};
let D=null, DIA='', UNI='', TIMER=null, PUXASEQ=0, ERROLEITURA='';
/* ===== 🛵 Avisar o cliente — o motoboy esta chegando ===== */
let AV=null, AVERRO='', AVABERTO=false;
function avisoTexto(l){
  if(l && l.situacao==='NA PORTA') return l.mensagem_porta || 'Oi! O entregador chegou e está te esperando na portaria. Consegue vir receber?';
  return (l&&l.mensagem) || 'Oi! Seu pedido está quase aí — o entregador chega em breve. 🛵';
}
async function puxaAviso(){
  if(!AVABERTO){ AV=null; return }
  try{ AV = await porta('aviso_chegando',{unidade:UNI||null}); AVERRO=''; }
  catch(e){ AV=false; AVERRO=(e&&e.message)||'' }
}
async function avisoMarcar(u,p,m,desf){
  try{ await porta('aviso_chegando_marcar',{unidade:u,pedido:p,metros:m,desfazer:!!desf}); AVERRO=''; }
  catch(e){ AVERRO='não deu para marcar: '+((e&&e.message)||'') }
  await puxaAviso(); desenha();
}
let AVCOPIA='';
function avisoCopiar(u,p,m,txt){
  AVCOPIA=txt||'';
  var fim=function(){ avisoMarcar(u,p,m,false) };
  try{ navigator.clipboard.writeText(AVCOPIA||'').then(fim, fim) }catch(e){ fim() }
}
function avisoExtra(l){
  var p=[];
  if(l.complemento) p.push('🏠 '+esc(l.complemento));
  if(l.referencia) p.push('📍 '+esc(l.referencia));
  if(l.fone) p.push('📞 '+esc(l.fone)+(l.localizador?' · localizador '+esc(l.localizador):''));
  if(!p.length) return '';
  return '<div class="m" style="margin:2px 0 6px">'+p.join(' · ')+'</div>';
}
function avisoRelogio(l){
  if(l.min_na_porta===null || l.min_na_porta===undefined) return '';
  if(l.falta_foto_min>0) return '<div class="m" style="margin-bottom:6px">⏱ '+esc(l.min_na_porta)+' min na porta · faltam '+esc(l.falta_foto_min)+' min para tirar a foto e seguir</div>';
  return '<div style="margin-bottom:6px;font-size:12.5px;color:#e0a33a;font-weight:700">⏱ '+esc(l.min_na_porta)+' min na porta — já pode tirar a foto e seguir</div>';
}
function avisoCartao(l){
  var np=(l.situacao==='NA PORTA'), cor=np?'#d2513f':'#2fae6a', fdo=np?'rgba(210,81,63,.10)':'rgba(47,174,106,.08)';
  return '<div class="c" style="border:2px solid '+cor+';background:'+fdo+'">'+
    '<div style="font-size:15px;font-weight:800;color:#fff">'+(np?'🚨':'🛵')+' '+esc(l.unidade)+' · pedido #'+esc(l.pedido)+'</div>'+
    '<div class="m" style="margin:4px 0 4px">'+esc(l.motoboy)+(np?' está <b style="color:'+cor+'">parado na porta</b>':' está a <b style="color:'+cor+'">'+esc(l.metros)+' m</b>')+' — '+esc(l.onde)+
      ' · saiu '+esc(l.saiu)+' · posição de '+esc(l.gps_em)+'</div>'+
    avisoExtra(l)+avisoRelogio(l)+
    '<div style="background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--text)">'+esc(avisoTexto(l))+'</div>'+
    '<button class="b" style="margin-top:8px;background:'+cor+';color:#08130c;border-color:'+cor+';font-weight:800"'+
      ' onclick="avisoCopiar(&quot;'+esc(l.unidade)+'&quot;,&quot;'+esc(l.pedido_saipos||l.pedido)+'&quot;,'+(l.metros||0)+',&quot;'+esc(avisoTexto(l))+'&quot;)">'+
      'Copiar a mensagem e marcar como avisado</button>'+
    '<button class="b" style="margin-top:8px" onclick="avisoMarcar(&quot;'+esc(l.unidade)+'&quot;,&quot;'+esc(l.pedido_saipos||l.pedido)+'&quot;,'+(l.metros||0)+',false)">só marcar</button>'+
    '</div>';
}
function avisoBotao(){
  return '<div class="c" style="border:1px dashed #e0a33a;background:rgba(224,163,58,.06)">'+
    '<button class="b" style="font-weight:800;border-color:#e0a33a;color:#e0a33a" onclick="AVABERTO=!AVABERTO;AV=null;if(AVABERTO){puxaAviso().then(desenha)}else{desenha()}">'+
      (AVABERTO?'▾ fechar':'▸ abrir')+' 🛵 Avisar o cliente</button> '+
    '<span style="background:#e0a33a;color:#1a1a17;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800;margin-left:8px">EM TESTE</span>'+
    '<div style="font-size:12px;color:#8a897e;margin-top:6px">Ainda não está valendo. Serve para o Fábio mostrar à equipe como vai funcionar antes de entrar na rotina — <b>não avise ninguém por aqui sem ele mandar</b>.</div></div>';
}
function avisoHtml(){
  var h=avisoBotao();
  if(!AVABERTO) return h;
  return h + avisoMiolo();
}
function avisoMiolo(){
  if(AV===null) return '';

function hojeISO(){
  const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);
  return d.toISOString().slice(0,10);
}
async function porta(nome,dados){
  const r=await fetch(SB+'rpc/'+nome,{method:'POST',signal:AbortSignal.timeout(20000),
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_dados:dados||{}})});
  if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('porta '+r.status))}
  return await r.json();
}
function dist(m){
  if(m===null||m===undefined)return '';
  return (m<1000)?(m+' m'):((m/1000).toFixed(1)+' km');
}
function ondeTxt(l){
  if(!l.vivo_onde)return '<span class="m" style="display:inline">—</span>';
  var d=dist(l.vivo_dist_m), q=(l.vivo_fila==='na fila'?'na fila':(l.vivo_fila==='disponivel'?'disponível':'indisponível'));
  var cor, ico;
  if(l.vivo_onde==='no patio'){cor='#4ade80';ico='🟢 no pátio'}
  else if(l.vivo_onde==='na rua'){cor='#fbbf24';ico='🛵 na rua'}
  else {cor='#8a897e';ico='⚪ longe'}
  return '<span style="color:'+cor+';font-weight:700">'+ico+'</span>'+
         '<div class="m">'+(d?esc(d)+' · ':'')+esc(q)+' · visto '+esc(l.vivo_visto||'')+'</div>';
}
/* 04/10/2026: com o GPS do TrackEat parado, "o sistema nao viu" era alarme falso — o sistema nem estava olhando */
function gpsParado(){ return !!(D&&D.gps_parado) }
function linhaDe(i){ return (D&&D.linhas&&D.linhas[i])||null }
async function marcar(u,e,t,hora,desf){
  try{ await porta('chegada_marcar',{dia:(DIA||(D&&D.dia)||hojeISO()),unidade:u,entregador:e,turno:t,hora:hora||null,desfazer:!!desf}); }
  catch(err){ alert('Não deu para anotar: '+(err&&err.message?err.message:'tente de novo')); return; }
  boot();
}
function chegou(i){ const l=linhaDe(i); if(l)marcar(l.unidade,l.entregador,l.n_turno,null,false) }
function outraHora(i){
  const l=linhaDe(i); if(!l)return;
  const h=prompt('Que horas '+l.entregador+' chegou? Escreva assim: 18:05', l.anotado_txt||'');
  if(!h)return;
  const t=String(h).trim();
  if(!/^[0-9]{1,2}:[0-9]{2}$/.test(t)){ alert('Escreva a hora assim: 18:05'); return }
  marcar(l.unidade,l.entregador,l.n_turno,t,false);
}
function apagar(i){
  const l=linhaDe(i); if(!l)return;
  if(confirm('Apagar a anotação de '+l.entregador+'?'))marcar(l.unidade,l.entregador,l.n_turno,null,true);
}

  return '<div class="grp"'+(id?' id="'+id+'"':'')+'><span class="em">'+em+'</span><h2>'+tx+'</h2>'+(n!=null?'<span class="ct">'+n+'</span>':'')+'</div>';

function vaiPara(id){ var e=document.getElementById(id); if(e&&e.scrollIntoView) e.scrollIntoView({behavior:'smooth',block:'start'}); }
/* 04/10/2026 (chat-cartoes-operacao-04-10), pedido do Fabio: cartoes iguais aos do Resolver hoje.
   Cada cartao e uma tabela de uma linha (data-cdm-livre) para a anotacao do portal.js continuar aparecendo;
   a chave da anotacao e a mesma de antes: "Loja | Motoboy | Escala". */
/* 14/10/2026 (chat-chegada-garantido-14-10), pedido do Fabio: "pra ver se o rapaz tem direito a garantido ou ao rango".
   O banco (chegada_direito) devolve por turno: direito, garantido_perdido, limite_txt e, so para o dono, a hora
   que ele entrou na fila do patio no TrackEat (chegou_txt / chegou_fonte) e o atraso. A regra e a MESMA do pagamento. */
/* a tolerancia vem do banco (motoboy_param via chegada_conferir); sem ela a tela nao inventa numero */
function tolMin(){ return (D&&D.tolerancia!=null)?esc(String(D.tolerancia)):'—'; }
/* 15/10/2026 (revisao do supervisor): rango_excecao = combinado com o Jaison (motoboy_excecao_rango); aguarda_balcao = quem
   nao e dono so ve o veredito depois de anotar a chegada (o banco esconde antes); com o GPS parado, "nao chegou" vira "sem GPS". */
/* 15/10/2026 (chat-chegada-botoes-15-10), pedido do Fabio: "to achando bem confuso... somente o horario em que o motoboy
   chegou... ter um botao garantido ou sem garantido / sem rango ou com rango... ja pensar nas peculiaridades de cada motoboy".
   O cartao mostra so a hora que chegou e dois botoes. Os botoes ja vem marcados pela REGRA do banco (chegada_direito:
   escala do Jaison x chegada, tolerancia de motoboy_param, combinados de motoboy_excecao_rango = direito 'rango_excecao').
   Quem muda escreve o motivo; vai para motoboy_direito_manual pela porta chegada_direito_marcar e volta em
   garantido_manual / rango_manual. Garantido vale o DIA (o mesmo em todos os turnos); rango vale o TURNO.
   Clicar de volta no que a regra diz apaga a mudanca (valor null). So da para mudar hoje e ontem (o banco confere). */
function regraGarantido(l){ return !(l.garantido_perdido || l.direito==='perdeu' || l.direito==='rango_excecao'); }
function regraRango(l){ return l.direito!=='perdeu'; }
function valeGarantido(l){ return (l.garantido_manual===true||l.garantido_manual===false) ? l.garantido_manual : regraGarantido(l); }
function valeRango(l){ return (l.rango_manual===true||l.rango_manual===false) ? l.rango_manual : regraRango(l); }
/* a hora que aparece: o dono ve a do sistema (1o momento no patio pelo GPS ou na fila do TrackEat; desde 10/11 a 1a entrega nao conta); o balcao ve a que ele anotou */
function horaChegou(l, dono){ return (dono && l.chegou_txt) ? l.chegou_txt : (l.anotado_txt || ''); }
/* os botoes so aparecem depois que ele chegou e a regra ja tem veredito */
function temBotoes(l, dono){
  return !!horaChegou(l, dono) && ['ok','perdeu','rango_excecao','sem_prova','fora','no_prazo'].indexOf(l.direito)>=0;
}
function podeMudar(){
  if(!D||!D.dia||!D.hoje) return false;
  var d=(new Date(D.hoje+'T12:00:00') - new Date(D.dia+'T12:00:00'))/86400000;
  return d>=0 && d<=1;
}
function porQue(l, dono){
  var d=l.direito, a=l.atraso_min, tol=tolMin();
  var quanto=(dono && a!=null) ? (a<=0 ? 'chegou antes da escala' : 'chegou '+a+' min depois da escala') : '';
  if(d==='ok') return l.garantido_perdido ? (quanto?quanto+' · ':'')+'o garantido do dia já caiu em outro turno' : (quanto||'chegou no prazo');
  if(d==='rango_excecao') return (quanto?quanto+' · ':'')+'passou de '+tol+' min, mas tem <b>combinado com o Jaison</b>: fica com o rango';
  if(d==='perdeu') return (quanto||'chegou depois de '+esc(l.limite_txt||''))+' · passou de '+tol+' min';
  if(d==='sem_prova'){
    if(l.motivo_sem_prova==='robo') return '⚠️ <b>o robô ficou sem ler o TrackEat nessa hora</b>: não se corta — confira com o balcão';
    if(l.motivo_sem_prova==='nome') return 'a fila viu, mas o nome do aplicativo não bate com o da escala: não se corta — confira o nome';
    if(l.motivo_sem_prova==='balcao') return 'só o balcão viu; o GPS e a fila não: não se corta';
    return 'sem prova do GPS: não se corta';
  }
  if(d==='fora') return 'fora da escala: sem horário combinado, não se corta';
  if(d==='no_prazo') return 'dentro do prazo (até '+esc(l.limite_txt||'')+')';
  return '';
}
function mudadoPor(l){
  var t=[];
  if(l.garantido_manual===true||l.garantido_manual===false)
    t.push('✋ garantido mudado por <b>'+esc(l.garantido_quem||'?')+'</b>: '+esc(l.garantido_motivo||''));
  if(l.rango_manual===true||l.rango_manual===false)
    t.push('✋ rango mudado por <b>'+esc(l.rango_quem||'?')+'</b>: '+esc(l.rango_motivo||''));
  return t.join('<br>');
}
/* 10/11/2026 (chat-chegada-gps-decide-10-11), decisao do Fabio: "quem decide vai ser o sistema". Os botoes viram so leitura
   para a equipe (o banco tambem recusa); so o dono ainda pode mudar, com motivo. */
function seg(i, campo, vale, sim, nao){
  var dis=!(D&&D.dono) ? ' disabled title="Quem decide é o sistema: 1º momento no pátio (GPS) ou na fila"'
        : (podeMudar()?'':' disabled title="Só dá para mudar hoje e ontem"');
  return '<div class="seg">'+
    '<button class="'+(vale?'on-ok':'')+'"'+dis+' onclick="muda('+i+',&quot;'+campo+'&quot;,true)">'+sim+'</button>'+
    '<button class="'+(vale?'':'on-bad')+'"'+dis+' onclick="muda('+i+',&quot;'+campo+'&quot;,false)">'+nao+'</button></div>';
}
async function muda(i, campo, val){
  var l=linhaDe(i); if(!l) return;
  var regra=(campo==='garantido') ? regraGarantido(l) : regraRango(l);
  var vale=(campo==='garantido') ? valeGarantido(l) : valeRango(l);
  if(val===vale) return;
  var dados={dia:(DIA||(D&&D.dia)||hojeISO()), unidade:l.unidade, entregador:l.entregador, turno:l.n_turno, campo:campo, valor:null};
  if(val!==regra){
    var m=prompt('Por que '+l.entregador+' fica '+(val?'COM':'SEM')+' '+campo+(campo==='garantido'?' no dia':' neste turno')+'? Escreva o motivo:','');
    if(m===null) return;
    m=String(m).trim();
    if(m.length<3){ alert('Escreva o motivo (pelo menos 3 letras).'); return }
    dados.valor=val; dados.motivo=m;
  }
  try{ await porta('chegada_direito_marcar', dados); }
  catch(err){ alert('Não deu para gravar: '+(err&&err.message?err.message:'tente de novo')); return; }
  boot();
}
/* quem faz dois turnos aparece num cartao so: o rango do outro turno fica numa linha de baixo, com o botao dele */
function outrosTurnos(l, dono){
  var L=(D&&D.linhas)||[], h='';
  L.forEach(function(o, j){
    if(o.unidade!==l.unidade || o.entregador!==l.entregador || o.n_turno===l.n_turno || !o.na_escala) return;
    h+='<div class="rs ot"><span>'+o.n_turno+'º turno (escala '+esc(o.escala_txt||'—')+')'+
       (horaChegou(o,dono)?' · chegou <b>'+esc(horaChegou(o,dono))+'</b>':' · ainda não anotado')+'</span>'+
       (temBotoes(o,dono) ? seg(j,'rango',valeRango(o),'🍔 com rango','sem rango') : '')+'</div>';
  });
  return h;
}
/* 10/11/2026 (chat-chegada-gps-decide-10-11): os fatos do turno, lado a lado, no cartao. */
function hm(t){ var m=/^(\d\d):(\d\d)/.exec(t||''); return m ? (+m[1])*60+(+m[2]) : null; }
/* minutos contados a partir da entrada da escala (aguenta a virada da meia-noite) */
function desde(base, t){ var a=hm(base), b=hm(t); if(a==null||b==null) return null; var d=b-a; if(d<-360) d+=1440; return d; }
function ft(rot, val, cls){ return '<div class="ft'+(cls?' '+cls:'')+'"><span>'+rot+'</span><b>'+val+'</b></div>'; }
function escalaTxt(l){ return l.escala_txt ? esc(l.escala_txt)+(l.escala_saida_txt?'–'+esc(l.escala_saida_txt):'') : '—'; }

/* Fabio, 11/11/2026: coleta oficial + chegada do balcao, fontes e media auditaveis. */

 if(!v)return '—';
 var d=new Date(v);return isNaN(d.getTime())?'—':new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
}

 if(!m)return '';
 var rot={"conferido":"Fontes conferidas. A média é usada desde 11/11.","sem_coleta":"Sem registro automático: conferir, sem corte automático.","sem_balcao":"Falta a chegada anotada pelo balcão: sem média e sem corte automático.","divergencia_balcao":"Fontes diferem mais de 3 minutos: conferir, sem corte automático.","divergencia_coletores":"Leitor de segundos e API divergem mais de 3 minutos: conferir, sem corte automático.","limite_divergente":"As fontes discordam sobre a tolerância: conferir, sem corte automático.","falha_coleta":"Houve falha de coleta no início do turno: conferir, sem corte automático.","fora_escala":"Sem turno vinculado: conferir escala, sem corte automático."}, msg=rot[m.status]||'Conferir as fontes.';
 var linha=function(t,v){return '<div style="display:flex;gap:12px;justify-content:space-between"><span>'+esc(t)+'</span><b>'+esc(v)+'</b></div>';};
 return '<div style="margin:10px 0;padding:10px;border:1px solid currentColor;border-radius:8px;font-size:12px;line-height:1.6">'+
 '<b>Conferência de chegada · segundos</b>'+
 linha('Leitor de segundos',medHora(m.site))+linha('API de reserva',medHora(m.api))+

 linha('Fonte oficial usada',m.fonte_oficial||'ausente')+

 linha('Média oficial + balcão',medHora(m.media))+

function fatos(l, dono){
  if(!l.na_escala) return '';
  var tol=(D&&D.tolerancia!=null)?+D.tolerancia:15, vivo=!!(D&&D.ao_vivo), h='';
  h+=ft('escala do Jaison', escalaTxt(l));
  if(dono){
    if(l.chegou_txt){
      var a=l.atraso_min, fonte=/fila/.test(l.chegou_fonte||'')?'fila':(/GPS/.test(l.chegou_fonte||'')?'GPS pátio':'');
      h+=ft('chegou (sistema)', esc(l.chegou_txt)+(fonte?' <small>'+fonte+'</small>':''));
      if(a!=null) h+=ft('atraso', a<=0?'no horário':'+'+a+' min', a>tol?'bad':(a>0?'warn':'ok'));
    }else if(l.direito==='nao_chegou') h+=ft('chegou (sistema)', 'não chegou', 'bad');
    else if(l.direito==='no_prazo') h+=ft('chegou (sistema)', 'ainda não <small>até '+esc(l.limite_txt||'')+'</small>');
    if(l.anotado_txt){
      var df=l.chegou_txt?desde(l.chegou_txt, l.anotado_txt):null;
      h+=ft('balcão anotou', esc(l.anotado_txt)+(df?' <small>'+(df>0?'+':'')+df+' min</small>':''), (df!=null&&Math.abs(df)>5)?'warn':'');
    }
  }else if(l.anotado_txt) h+=ft('balcão anotou', esc(l.anotado_txt));
  if(l.entregas_n!=null && (l.entregas_n>0 || l.chegou_txt || l.anotado_txt))
    h+=ft('entregas', l.entregas_n+(l.ultima_entrega_txt?' <small>última '+esc(l.ultima_entrega_txt)+'</small>':''));
  if(l.ultimo_sinal_txt){
    if(vivo && l.sinal_min!=null && l.sinal_min<=3) h+=ft('aplicativo', 'ligado agora', 'ok');
    else{
      var s=desde(l.escala_txt, l.ultimo_sinal_txt), f=desde(l.escala_txt, l.escala_saida_txt);
      var antes=(s!=null && f!=null && s<f-15);
      h+=ft('último sinal do app', esc(l.ultimo_sinal_txt)+(antes?' <small>antes do fim da escala</small>':''), antes?'warn':'');
    }
  }
  return '<div class="fts">'+h+'</div>';
}
/* o selo curto de cada turno, para a escala do dia no canto */
function selo(l, dono){
  if(!temBotoes(l, dono)){
    if(l.direito==='no_prazo') return '<span class="pill p-off">⏳ até '+esc(l.limite_txt||'')+'</span>';
    if(l.direito==='nao_chegou') return '<span class="pill p-bad">não chegou</span>';
    if(l.direito==='aguarda_balcao') return '<span class="pill p-warn">falta anotar</span>';
    return '<span class="pill p-off">—</span>';
  }

/* uma linha por pessoa: quem faz dois turnos aparece no turno que falta anotar (ou no ultimo) */
function umPorPessoa(pares){
  var vistos={}, fora=[];
  /* 15/10/2026 (revisao do supervisor): a regra de antes manda — o turno que FALTA ANOTAR fica no cartao, para o balcao
     ter o botao "Chegou agora". So entre dois turnos iguais (os dois anotados ou os dois sem anotar) fica o que ja tem
     veredito. O outro turno aparece numa linha do cartao. */
  var peso=function(l){ return (l.direito==='ok'||l.direito==='perdeu'||l.direito==='sem_prova'||l.direito==='rango_excecao')?2:(l.direito==='no_prazo'?1:0); };
  pares.forEach(function(p){
    var k=p[0].unidade+'|'+p[0].entregador;
    if(!(k in vistos)){ vistos[k]=fora.length; fora.push(p); return }
    var atual=fora[vistos[k]][0], novo=p[0];
    if(atual.anotado_txt && !novo.anotado_txt) fora[vistos[k]]=p;
    else if(!atual.anotado_txt===!novo.anotado_txt && (peso(novo)>peso(atual) || (peso(novo)===peso(atual) && atual.anotado_txt))) fora[vistos[k]]=p;
  });
  return fora;
}

const CDMMODS=['chegada','qualidade','hellen_chegada'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'chegada'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
