<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Qualidade do Delivery · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1200px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
button.b:hover{border-color:var(--brand)}
button.bp{background:var(--brand);border-color:var(--brand)}
h2{font-size:15px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-off{background:rgba(138,137,126,.15);color:var(--muted)}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.m{color:var(--muted);font-size:11.5px;margin-top:3px}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:8px 0}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:18px}
.fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fil button{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer}
.fil button:hover{border-color:var(--brand)}
.fil button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;margin-bottom:6px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.card.viv{cursor:pointer;transition:border-color .12s,background .12s}
.card.viv:hover{border-color:var(--brand)}
.card.vivon{border-color:var(--brand);background:var(--s2)}
.card .seta{float:right;color:var(--muted);font-size:10px}
.detalhe{border:1px solid var(--brand);border-radius:13px;padding:2px 0;margin:2px 0 10px}
.card .t{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.card .v{font-size:27px;font-weight:800;margin:6px 0 2px;line-height:1.1}
.card .d{font-size:12px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.rolar{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th{text-align:left;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:0 10px 8px 0;white-space:nowrap}
td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.bar{height:7px;border-radius:99px;background:var(--s2);overflow:hidden;min-width:70px;margin-top:5px}
.bar i{display:block;height:100%;background:var(--brand)}
.g{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
.g div{flex:1;background:var(--s2);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.g div.hi{background:var(--brand)}
.gx{display:flex;gap:3px;margin-top:5px}
.gx span{flex:1;text-align:center;font-size:9px;color:var(--muted);overflow:hidden}
.fala{border-left:3px solid var(--bad);padding:8px 0 8px 12px;margin-bottom:9px}
.fala .q{font-size:13.5px;color:var(--text2);font-style:italic}
.fala .w{font-size:11px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>📊 Qualidade do Delivery · O MÊS</h1>
    <div class="sub" id="sub">carregando…</div>
  </div>
  <div class="rt">
    <button class="b" onclick="boot()">↻ Atualizar</button>
  </div>
</div>

<div style="margin:10px 0;padding:9px 12px;background:#232321;border:1px solid #34332f;border-left:3px solid #c8102e;border-radius:0 9px 9px 0;font-size:13px;color:#c3c2b7">Esta tela mostra <b style="color:#fff">o período escolhido nos botões acima</b> — é para ver como a casa está indo. Para o que está acontecendo <b style="color:#fff">agora</b>, abra <a href="/delivery/central.html" style="color:#fff">🎯 Central do Delivery →</a></div><div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};

let D=null,DD=null,SU=null,DIAS=30,UNI='',ABA='resumo',DIA='',PER='quinzena',CC=null,VIVO='';

function hoje(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function ontem(){const d=new Date();d.setDate(d.getDate()-1);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
let FR=null,TIMER=null;
async function puxaFrescor(){try{FR=await porta('qualidade_frescor',undefined)}catch(e){FR=null}}
function idade(f){
  if(f.min!=null&&f.min<600)return f.min<2?'agora mesmo':(f.min<60?'há '+f.min+' min':'há '+Math.floor(f.min/60)+'h'+(f.min%60?' '+(f.min%60)+'min':''));
  if(f.dias!=null)return f.dias===0?'hoje':(f.dias===1?'ontem':'há '+f.dias+' dias');
  return '—';
}
function carimbo(){
  if(!FR||!FR.fontes)return '';
  let h='<div class="c" style="padding:10px 14px"><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">'+
        '<b style="font-size:12.5px">🕐 De quando é cada número</b>';
  FR.fontes.forEach(function(f){
    const velho=(f.dias!=null&&f.dias>=2)||(f.min!=null&&f.min>=600);
    h+='<span style="font-size:11.5px;color:var(--muted)">'+esc(f.fonte)+': '+
       '<span class="pill '+(velho?'p-bad':'p-ok')+'">'+idade(f)+'</span></span>';
  });
  h+='</div><div class="m">Cada fonte entra no sistema num ritmo diferente. Entrega e prazo vêm de 5 em 5 minutos; avaliação e chamado do iFood dependem do robô que roda no computador, 9h e 17h.</div></div>';
  return h;
}
function ligaTimer(){
  if(TIMER){clearInterval(TIMER);TIMER=null}
  if(ABA!=='dia')return;
  /* 3 minutos, e so enquanto a aba estiver na frente */
  TIMER=setInterval(function(){
    if(document.visibilityState!=='visible')return;
    if(ABA!=='dia'){clearInterval(TIMER);TIMER=null;return}
    puxaDia();
  },180000);
}

async function porta(nome,dados){
  const r=await fetch(SB+'rpc/'+nome,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_dados:dados})});
  if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('porta '+r.status))}
  return await r.json();
}
function perNome(){return (PER==='d7'||PER==='d30')?'dias':PER}
async function puxa(){return porta('qualidade_consulta',{periodo:perNome(),dias:DIAS,unidade:UNI||null})}
async function puxaCanc(){
  try{ CC=await porta('qualidade_cancelamentos',{periodo:perNome(),dias:DIAS,unidade:UNI||null}); }
  catch(e){ CC={erro:(e&&e.message)||'não deu para buscar'}; }
  desenha();
}
function vaiPeriodo(p){PER=p;CC=null;VIVO='';boot()}
function vivo(k){
  VIVO=(VIVO===k?'':k);
  if(VIVO&&(VIVO==='cancel'||VIVO==='ecoz'||VIVO==='eent')&&!CC){desenha();puxaCanc();return}
  desenha();
}
/* o iFood manda o cancelamento so no dia seguinte: diz se o periodo escolhido ja tem relatorio */
function iFoodTem(){
  if(!CC||CC.erro||!CC.ifood_ate||!D||!D.ate)return true;
  return String(D.ate)<=String(CC.ifood_ate);
}
async function puxaDia(){DD=await porta('qualidade_dia',{dia:DIA||hoje(),unidade:UNI||null});await puxaFrescor();desenha()}
async function puxaSuper(){SU=await porta('qualidade_super',{dias:DIAS});desenha()}

function n(v){return v==null?'—':String(v)}
function br(v){return (v==null||!(function(){try{return sessionStorage.getItem("cdm_admin")==="1"}catch(e){return false}})())?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}

/* compara com o periodo anterior. bom=true quer dizer "subir e bom" */
function delta(agora,antes,bom,suf){
  if(agora==null||antes==null)return '<div class="d flat">sem comparação</div>';
  const a=Number(agora),b=Number(antes);
  if(b===0)return '<div class="d flat">antes: 0</div>';
  const p=Math.round((a-b)/Math.abs(b)*100);
  if(p===0)return '<div class="d flat">igual ao período anterior</div>';
  const subiu=p>0, bomSinal=(subiu===bom);
  return '<div class="d '+(bomSinal?'up':'down')+'">'+(subiu?'▲':'▼')+' '+Math.abs(p)+'% · antes '+n(antes)+(suf||'')+'</div>';
}

function cartao(t,v,d){return '<div class="card"><div class="t">'+t+'</div><div class="v">'+v+'</div>'+(d||'')+'</div>'}

function barra(pct){
  if(pct==null)return '';
  return '<div class="bar"><i style="width:'+Math.min(100,Math.max(0,pct))+'%"></i></div>';
}

function filtros(){
  let h='<div class="fil">';
  [['hoje','Hoje'],['ontem','Ontem'],['quinzena','Quinzena'],['mes','Este mês']].forEach(function(o){
    h+='<button class="'+(PER===o[0]?'on':'')+'" onclick="vaiPeriodo(\''+o[0]+'\')">'+o[1]+'</button>';
  });
  h+='</div>';
  if(D&&D.de&&D.ate)h+='<div class="m" style="margin:-2px 0 8px">Mostrando de <b>'+dData(D.de)+'</b> a <b>'+dData(D.ate)+'</b>'+
    (D.de_antes?' · comparando com '+dData(D.de_antes)+' a '+dData(D.ate_antes):'')+'</div>';
  h+='<div class="fil">';
  h+='<button class="'+(UNI===''?'on':'')+'" onclick="UNI=\'\';boot()">🏠 Todas as lojas</button>';
  (D.por_loja||[]).forEach(function(l){
    h+='<button class="'+(UNI===l.unidade?'on':'')+'" onclick="UNI=\''+esc(l.unidade).replace(/'/g,"\\'")+'\';boot()">'+esc(l.unidade)+'</button>';
  });
  h+='</div>';
  const abas=[['resumo','📈 Resumo'],['lojas','🏪 Por loja'],['turnos','🕐 Por turno'],['pausados','📵 Fora do ar'],['dia','🗓 O dia'],['ree','🔁 Reentregas']];
  if(D.modo==='dono')abas.push(['dinheiro','💰 Dinheiro'],['pessoas','🛵 Entregadores']);
  abas.push(['cancel','🚫 Cancelamentos'],['cliente','⭐ Avaliações'],['super','🏆 Selo Super']);
  h+='<div class="fil">';
  abas.forEach(function(a){h+='<button class="'+(ABA===a[0]?'on':'')+'" onclick="vaiPara(\''+a[0]+'\')">'+a[1]+'</button>'});
  h+='</div>';
  if(ABA==='dia'){
    h+='<div class="fil" style="align-items:center">'+
       '<span style="color:var(--muted);font-size:12.5px;font-weight:700">Escolha o dia:</span>'+
       '<input type="date" id="qdia" value="'+(DIA||hoje())+'" max="'+hoje()+'" '+
       'onchange="DIA=this.value;DD=null;puxaDia()" '+
       'style="background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700">'+
       '<button class="'+((DIA||hoje())===hoje()?'on':'')+'" onclick="DIA=hoje();DD=null;puxaDia()">Hoje, ao vivo</button>'+
       '<button class="'+(DIA===ontem()?'on':'')+'" onclick="DIA=ontem();DD=null;puxaDia()">Ontem</button>'+
       '</div>';
    h+=carimbo();
  }
  return h;
}

/* ===== 🔁 Reentregas — 1ª ferramenta trazida da Central (fusão Central→Qualidade, 01/09/2026) ===== */
let REE=null,REEMOT=null,REEbusy=false,REEERRO='';
function reeHora(t){return t?String(t).slice(11,16):'—'}
function reeCor(f){return f==='COZINHA'?'var(--bad)':f==='DESPACHO'?'var(--warn)':'var(--muted)'}
async function reeRPC(acao,dados){
  const r=await fetch(SB+'rpc/reentrega_consulta',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_cred:tok(),p_acao:acao,p_dados:dados||{}})});
  const j=await r.json().catch(function(){return null});
  if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));
  return j;
}
function reePuxa(){
  if(REEbusy)return;
  REEbusy=true;REEERRO='';
  const d=new Date();d.setDate(d.getDate()-7);
  const de=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  Promise.all([reeRPC('listar',{de:de}),reeRPC('motivos')]).then(function(a){
    REE=Array.isArray(a[0])?a[0]:[];REEMOT=Array.isArray(a[1])?a[1]:[];REEbusy=false;desenha();
  }).catch(function(e){
    REE=[];REEMOT=[];REEbusy=false;REEERRO=(e&&e.message)||'não deu para carregar';desenha();
  });
}
function reeMarcar(el){
  var u=el.getAttribute('data-u'),t=el.getAttribute('data-t'),mo=el.value;
  if(!mo)return;
  el.disabled=true;
  reeRPC('marcar',{unidade:u,data_hora_pedido:t,motivo:mo,lancado_por:(sessionStorage.getItem('cdm_papel')||'portal')})
    .then(function(){REE=null;REEbusy=false;reePuxa()})
    .catch(function(e){el.disabled=false;alert('Não consegui gravar: '+e.message)});
}
function reeResp(el){
  var u=el.getAttribute('data-u'),t=el.getAttribute('data-t'),mo=el.getAttribute('data-m'),re=el.value;
  if(!mo){el.value='';return}
  el.disabled=true;
  reeRPC('marcar',{unidade:u,data_hora_pedido:t,motivo:mo,responsavel:re,lancado_por:(sessionStorage.getItem('cdm_papel')||'portal')})
    .then(function(){REE=null;REEbusy=false;reePuxa()})
    .catch(function(e){el.disabled=false;alert('Não consegui gravar: '+e.message)});
}
function reeLinha(r){
  var _cz=function(t){return '<div style="color:var(--muted);font-size:11.5px">'+t+'</div>'};
  var _selo=(r.mesmo_cliente===true)?'<span class="pill p-bad">mesmo cliente</span>':(r.mesmo_cliente===false?'<span class="pill">cliente diferente</span>':'<span class="pill">nome não identificado</span>');
  var _tm=function(m){return (m==null)?'—':(m<60?(m+' min antes'):(Math.floor(m/60)+'h'+(m%60<10?'0':'')+(m%60)+' antes'))};
  var _par=r.par_n_pedido?('<b>'+esc(r.par_n_pedido)+'</b> às '+reeHora(r.par_data_hora)+' · '+_tm(r.par_minutos)+_cz('canal: '+esc(r.par_canal||'não identificado'))+_cz('motoboy: '+esc(r.par_entregador||'—')+' · cliente '+esc(r.par_cliente_ini||'—')+' ')+_selo+_cz('mesmo endereço dos dois: '+esc(r.endereco||'—'))):'<span style="color:var(--muted)">sem par — a equipe lançou este com # no número</span>';
  var eq=r.familia==='COZINHA'?r.equipe_cozinha:r.familia==='DESPACHO'?r.equipe_despacho:null;
  var eqs=(eq&&eq.length)?eq.map(esc).join(', '):(r.familia?'<span style="color:var(--muted)">escala não lançada</span>':'—');
  var fam=r.familia?'<span class="pill" style="background:'+reeCor(r.familia)+';color:#fff">'+esc(r.familia)+'</span>':(r.detectada_por_endereco?(r.mesmo_cliente===true?'<span class="pill p-warn">suspeita: mesmo cliente, mesmo endereço — confirmar</span>':'<span class="pill p-warn">suspeita: mesmo endereço, nome não identificado — confirmar</span>'):'<span style="color:var(--muted)">a classificar</span>');
  var rsel=(eq&&eq.length&&r.motivo)?('<select data-u="'+esc(r.unidade)+'" data-t="'+esc(r.data_hora_pedido)+'" data-m="'+esc(r.motivo)+'" onchange="reeResp(this)"><option value="">— quem foi? —</option>'+eq.map(function(n){return '<option'+(r.responsavel===n?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>'):'<span style="color:var(--muted)">—</span>';
  var sel='<select data-u="'+esc(r.unidade)+'" data-t="'+esc(r.data_hora_pedido)+'" onchange="reeMarcar(this)"><option value="">— escolher —</option>'+(REEMOT||[]).map(function(m){return '<option'+(r.motivo===m.motivo?' selected':'')+'>'+esc(m.motivo)+'</option>'}).join('')+'</select>';
  return '<tr><td>'+reeHora(r.data_hora_pedido)+'</td><td><b>'+esc(r.n_pedido||'—')+'</b>'+_cz('canal: '+esc(r.canal||'não identificado'))+_cz('cliente '+esc(r.cliente_ini||'—'))+'</td><td>'+esc(r.unidade)+'</td><td>'+esc(r.turno||'—')+'</td><td>'+esc(r.entregador||'—')+'</td><td>'+_par+'</td><td>'+sel+'</td><td>'+fam+'</td><td>'+eqs+'</td><td>'+rsel+'</td></tr>';
}
function reeAba(){
  if(REE===null)return '<div class="c"><div class="vazio">Carregando reentregas…</div></div>';
  var rs=(REE||[]).filter(function(r){return !UNI||r.unidade===UNI});
  var h='<div class="m" style="margin:0 0 8px">🔁 A ferramenta da Central, agora aqui · <b>últimos 7 dias</b> · a lista junta o que a equipe lançou com # e o 2º pedido no mesmo endereço, no mesmo dia, até 3 horas depois, com o mesmo primeiro nome. Marcar o motivo e o responsável grava de verdade.</div>';
  if(REEERRO)h+='<div class="aviso">'+esc(REEERRO)+'</div>';
  if(!rs.length)return h+'<div class="c"><div class="vazio">Nenhuma reentrega nos últimos 7 dias'+(UNI?' na '+esc(UNI):'')+'.</div></div>';
  var dias=[];rs.forEach(function(r){if(dias.indexOf(r.dia_operacional)<0)dias.push(r.dia_operacional)});
  dias.sort();dias.reverse();
  dias.forEach(function(d){
    h+='<h2>'+dData(d)+'</h2><div class="c"><div class="rolar"><table><tr><th>Hora</th><th>Pedido</th><th>Loja</th><th>Turno</th><th>Motoboy</th><th>1º pedido (o par)</th><th>Motivo</th><th>Família</th><th>Equipe do turno</th><th>Quem foi</th></tr>';
    rs.forEach(function(r){if(r.dia_operacional===d)h+=reeLinha(r)});
    h+='</table></div></div>';
  });
  return h;
}

function vaiPara(a){
  ABA=a;
  ligaTimer();
  if(a==='dia'&&!DD){desenha();puxaDia();return}
  if(a==='super'&&!SU){desenha();puxaSuper();return}
  if(a==='ree'&&REE===null){desenha();reePuxa();return}
  if(a==='cancel'&&!CC){desenha();puxaCanc();return}
  if(a==='cliente'&&!SU){desenha();puxaSuper();return}
  desenha();
}

function cartaoVivo(t,v,d,k){
  const on=(VIVO===k);
  return '<div class="card viv'+(on?' vivon':'')+'" onclick="vivo(\''+k+'\')">'+
    '<div class="t">'+t+'<span class="seta">'+(on?'▲ fechar':'▼ ver')+'</span></div>'+
    '<div class="v">'+v+'</div>'+(d||'')+'</div>';
}

function painelVivo(){
  if(!VIVO)return '';
  let h='<div class="detalhe">';
  if(VIVO==='nota'||VIVO==='evitado'){
    const Uv=D.ultimo||{}, doPeriodo=iFoodTem();
    const L=(doPeriodo?(D.por_loja||[]):(Uv.por_loja||[]));
    if(!L.length)h+='<div class="c"><div class="vazio">sem dado por loja</div></div>';
    else{
      h+='<div class="c"><b>'+(VIVO==='nota'?'Nota e notas baixas por loja':'Chamados e cancelamento evitado por loja')+'</b><div class="rolar"><table>';
      if(VIVO==='nota'){
        h+='<tr><th>Loja</th><th>Nota</th><th>Notas baixas</th></tr>';

      h+='<div class="c"><b>Onde o atraso se concentra</b><div class="rolar"><table>'+

function dData(s){if(!s)return '—';const p=String(s).slice(0,10).split('-');return p[2]+'/'+p[1]}

function cancelamentos(){
  if(!CC)return '<div class="c"><div class="load">Carregando…</div></div>';
  if(CC.erro)return '<div class="c"><b>Não deu para buscar os cancelamentos.</b><div class="m">'+esc(CC.erro)+
    '<br>Tente o botão Atualizar. Se continuar, avise que a porta do banco falhou — a tela não está vazia, ela não conseguiu perguntar.</div></div>';
  const r=(CC.resumo&&CC.resumo.agora)||{}, b=(CC.resumo&&CC.resumo.antes)||{};
  let h='<div class="cards">';
  h+=cartao('Cancelamentos', n(r.total), delta(r.total,b.total,false,''));
  h+=cartao('Dá para contestar', n(r.contestavel), '<div class="d flat">'+n(r.ja_contestou)+' já contestados</div>');
  h+=cartao('Erro da cozinha', n(r.erro_cozinha), delta(r.erro_cozinha,b.erro_cozinha,false,''));
  h+=cartao('Erro na entrega', n(r.erro_entrega), delta(r.erro_entrega,b.erro_entrega,false,''));
  if(CC.modo==='dono')h+=cartao('Dinheiro perdido', br(r.valor), '<div class="d flat">antes '+br(b.valor)+'</div>');
  h+='</div>';
  if(CC.atraso_dias>0){
    h+='<div class="aviso"><b>O iFood ainda não mandou os últimos '+CC.atraso_dias+' dia(s).</b> '+
       'Esta lista vai até '+dData(CC.ifood_ate)+'. O motivo do cancelamento só chega no relatório do dia seguinte — '+
       'se aparecer pouca coisa aqui hoje, é o relatório que está atrasado, não a loja que parou de cancelar.</div>';
  }
  const L=CC.lista||[];
  if(!L.length)return h+'<div class="c"><div class="vazio">nenhum cancelamento neste período</div></div>';
  h+='<div class="c"><div class="rolar"><table><tr><th>Dia</th><th>Loja</th><th>Pedido</th><th>Motivo</th>'+
     '<th>Produto</th><th>Entregador</th><th>Contestar</th>'+(CC.modo==='dono'?'<th>Valor</th>':'')+'</tr>';
  L.forEach(function(x){
    const cor = x.erro==='cozinha' ? 'var(--bad)' : (x.erro==='entrega' ? 'var(--warn)' : '');
    const ent = x.entregador ? esc(x.entregador)
              : (x.saiu ? '<span style="color:var(--muted)">não identificado</span>'
                        : '<span style="color:var(--muted)">cancelou antes de sair</span>');
    const con = x.contestou ? '<span style="color:var(--ok)">já contestado</span>'
              : (x.contestavel ? '<b style="color:var(--warn)">dá para contestar</b>'
                               : '<span style="color:var(--muted)">não dá</span>');
    h+='<tr><td>'+dData(x.data)+'</td><td>'+esc(x.unidade||'—')+'</td><td>'+esc(x.pedido||'—')+'</td>'+
       '<td style="color:'+cor+'">'+esc(x.motivo||'—')+'</td>'+
       '<td style="max-width:220px">'+esc(x.produto||'—')+'</td>'+
       '<td>'+ent+'</td><td>'+con+'</td>'+
       (CC.modo==='dono'?'<td>'+br(x.valor)+'</td>':'')+'</tr>';
  });
  h+='</table></div></div>';
  h+='<div class="aviso"><b>Sobre a coluna Entregador.</b> Ela só existe quando o pedido chegou a sair para entrega. '+
     'Boa parte dos cancelamentos acontece antes disso — problema no pagamento, cliente desistiu, endereço incompleto — '+
     'e aí não houve motoboy nenhum: a tabela escreve <b>cancelou antes de sair</b>. Quando escreve <b>não identificado</b>, o pedido saiu '+
     'mas não deu para saber quem levou. Antes de julho não temos essa informação para nenhum caso. '+
     'Vermelho é erro da cozinha, amarelo é erro na entrega; o resto não é falha nossa.</div>';
  return h;
}

function resumo(){
  const a=D.agora,b=D.antes;
  let h='<div class="cards">';
  h+=cartaoVivo('No prazo', (a.pct_prazo==null?'—':a.pct_prazo+'%'), delta(a.pct_prazo,b.pct_prazo,true,'%'), 'prazo');
  const ift=iFoodTem();
  const U=D.ultimo||{};
  function velho(dt){return '<div class="d flat">últimos 7 dias até '+dData(dt)+'</div>'}
  h+=cartaoVivo('Nota do iFood', ift?(a.nota==null?'—':'★ '+a.nota):(U.nota==null?'—':'★ '+U.nota), ift?delta(a.nota,b.nota,true,''):velho(U.avaliacao_ate), 'nota');
  h+=cartaoVivo('Notas baixas (1–3)', ift?n(a.notas_baixas):n(U.notas_baixas), ift?delta(a.notas_baixas,b.notas_baixas,false,''):velho(U.avaliacao_ate), 'baixas');
  h+=cartaoVivo('Cancelamentos', ift?n(a.cancelamentos):n(U.cancelamentos), ift?delta(a.cancelamentos,b.cancelamentos,false,''):velho(U.cancelamento_ate), 'cancel');
  h+=cartaoVivo('Cancelamento evitado', ift?n(a.evitados):n(U.evitados), ift?('<div class="d flat">de '+n(a.chamados)+' chamados</div>'):velho(U.negociacao_ate), 'evitado');
  h+=cartaoVivo('Entregas', n(a.entregas), delta(a.entregas,b.entregas,true,''), 'entregas');
  h+=cartaoVivo('Atraso médio', (a.atraso_medio==null?'—':a.atraso_medio+' min'), delta(a.atraso_medio,b.atraso_medio,false,' min'), 'atraso');
  if(CC&&CC.resumo&&CC.resumo.agora){
    const rc=CC.resumo.agora, bc2=CC.resumo.antes||{};
    h+=cartaoVivo('Erro da cozinha', ift?n(rc.erro_cozinha):n(U.erro_cozinha), ift?delta(rc.erro_cozinha,bc2.erro_cozinha,false,''):velho(U.cancelamento_ate), 'ecoz');
    h+=cartaoVivo('Erro na entrega', ift?n(rc.erro_entrega):n(U.erro_entrega), ift?delta(rc.erro_entrega,bc2.erro_entrega,false,''):velho(U.cancelamento_ate), 'eent');
  }
  h+='</div>';
  h+=painelVivo();

  if(!iFoodTem()){
    h+='<div class="aviso"><b>Os números do iFood ainda não chegaram para este período.</b> '+
       'Nota, notas baixas, cancelamentos, cancelamento evitado e os dois cartões de erro mostram os ÚLTIMOS 7 DIAS que já chegaram, '+
       'com a data escrita embaixo de cada um, porque o iFood só manda o relatório no dia seguinte. '+
       'Nunca zero: zero aqui seria mentira. <b>Entregas, no prazo e atraso</b> são do nosso sistema e estão atualizados agora.</div>';
  }
  if(!a.entregas){
    h+='<div class="aviso"><b>Ainda não há entrega neste período.</b> '+
       'Não é a tela travada: o período escolhido vai de '+dData(D.de)+' a '+dData(D.ate)+
       ', e nesse intervalo as lojas ainda não entregaram. Se hoje é começo de mês ou de quinzena, é normal — '+
       'experimente <b>Ontem</b> ou <b>30 dias</b>.</div>';
  }
  h+='<div class="c"><b>Como estamos indo</b>';
  h+='<div class="m">Cada número acima está comparado com os '+D.dias+' dias ANTERIORES a este período. Verde quer dizer que andou para o lado bom; vermelho, para o lado ruim. Não existe número de fora para bater — a casa compara com ela mesma.</div></div>';

  /* grafico do prazo por dia */
  const dd=(D.por_dia||[]).filter(function(x){return x.pct_prazo!=null});
  if(dd.length){
    /* o destaque compara cada dia com a media DO PROPRIO periodo, nao com meta nenhuma */
    let soma=0; dd.forEach(function(x){soma+=Number(x.pct_prazo)});
    const media=Math.round(soma/dd.length);
    h+='<h2>📈 No prazo, dia a dia</h2><div class="c"><div class="g">';
    dd.forEach(function(x){
      h+='<div class="'+(x.pct_prazo>=media?'hi':'')+'" style="height:'+Math.max(2,x.pct_prazo)+'%" title="'+x.dia+': '+x.pct_prazo+'%"></div>';
    });
    h+='</div><div class="gx">';
    dd.forEach(function(x,i){h+='<span>'+(dd.length<=31||i%3===0?String(x.dia).slice(8,10):'')+'</span>'});
    h+='</div><div class="m">Barra na cor da casa = dia acima da média do próprio período ('+media+'%). A régua é o seu próprio desempenho, não um número de fora.</div></div>';
  }
  return h;
}

         '<td>'+(x.preparo_medio==null?'—':x.preparo_medio+' min')+'</td>'+
         '<td>'+(x.coleta_media==null?'—':x.coleta_media+' min')+'</td>'+
         '<td>'+(x.entrega_media==null?'—':x.entrega_media+' min')+'</td>'+
         '<td>'+n(x.cancelamentos)+'</td><td>'+n(x.chamados)+'</td></tr>';
    });
    h+='</table></div><div class="m">Preparo, Espera e Rua estão em minutos. <b>Preparo</b> é a cozinha; <b>Espera</b> é a comida pronta esperando o motoboy sair; <b>Rua</b> é da loja até a porta do cliente. Quando o atraso é grande e o preparo está normal, o gargalo não é a cozinha.</div></div>';
  }

  const HH=(DD.por_hora||[]).filter(function(x){return x.entregas>0});
  if(HH.length){
    h+='<h2>⏰ Hora a hora</h2><div class="c"><div class="rolar"><table>'+
       '<tr><th>Hora</th><th>Entregas</th><th>No prazo</th><th>Atraso médio</th></tr>';
    HH.forEach(function(x){
      h+='<tr><td><b>'+String(x.h).padStart(2,'0')+'h</b></td><td>'+n(x.entregas)+'</td>'+
         '<td>'+(x.pct_prazo==null?'—':x.pct_prazo+'%')+barra(x.pct_prazo)+'</td>'+
         '<td>'+(x.atraso_medio==null?'—':x.atraso_medio+' min')+'</td></tr>';
    });
    h+='</table></div><div class="m">A hora em que o prazo cai é a hora em que falta gente. É o número mais útil para montar escala.</div></div>';
  }

  const A=DD.avaliacoes||[];
  if(A.length){
    h+='<h2>💬 O que o cliente falou nesse dia</h2><div class="c">';
    A.forEach(function(f){
      h+='<div class="fala"><div class="q">"'+esc(f.comentario||'(sem comentário)')+'"</div>'+
         '<div class="w">★ '+f.nota+' · '+esc(f.marca||f.unidade)+'</div></div>';
    });
    h+='</div>';
  }

  const P=DD.problemas||[];
  if(P.length){
    h+='<h2>🐢 Os pedidos que atrasaram</h2><div class="c"><div class="rolar"><table>'+
       '<tr><th>Pedido</th><th>Hora</th><th>Loja</th><th>Turno</th><th>Atrasou</th><th>Prometido</th>'+
       '<th>Preparo</th><th>Espera</th><th>Rua</th>'+(DD.modo==='dono'?'<th>Entregador</th>':'')+'</tr>';
    P.forEach(function(p){
      h+='<tr><td><b>'+esc(p.n_pedido)+'</b></td><td>'+esc(p.hora||'')+'</td><td>'+esc(p.unidade)+'</td>'+
         '<td>'+esc(p.turno||'')+'</td>'+
         '<td><span class="pill p-bad">'+n(p.atraso)+' min</span></td>'+
         '<td>'+n(p.prometido)+' min</td><td>'+n(p.preparo)+'</td><td>'+n(p.coleta)+'</td><td>'+n(p.entrega)+'</td>'+
         (DD.modo==='dono'?'<td>'+esc(p.entregador||'—')+'</td>':'')+'</tr>';
    });
    h+='</table></div><div class="m">Ordenados do que mais atrasou. Olhe a coluna Preparo: se ela está alta, o pedido nasceu atrasado na cozinha. Se está normal e a Espera está alta, o pedido ficou pronto e parado.</div></div>';
  }
  if(!T.length&&!P.length)h+='<div class="c"><div class="vazio">nenhuma entrega nesse dia</div></div>';
  return h;
}

/* ===== o Selo Super, com os criterios oficiais do iFood ===== */
function selo(){
  if(!SU)return '<div class="c"><div class="load">Buscando…</div></div>';
  const M=SU.marcas||[], R=SU.regra||{};
  const sao=M.filter(function(m){return m.e_super}).length;
  let h='<div class="cards">';
  h+=cartao('Marcas com o selo', sao+' de '+M.length, '<div class="d flat">na próxima medição</div>');
  h+=cartao('Nota mínima', '★ '+R.nota_min, '<div class="d flat">média das avaliações</div>');
  h+=cartao('Cancelamento máximo', R.canc_max_pct+'%', '<div class="d flat">por erro nosso</div>');
  h+=cartao('Chamados máximo', R.chamados_max_pct+'%', '<div class="d flat">cliente abrindo reclamação</div>');
  h+='</div>';
  h+='<div class="c"><b>O que o iFood cobra para dar o selo</b><div class="m">São três réguas, e é preciso passar nas <b>três ao mesmo tempo</b>: nota de <b>4,7 ou mais</b>, cancelamento por erro nosso de <b>1% ou menos</b>, e chamado de cliente de <b>2,5% ou menos</b>. Vale por marca, não por loja, e o iFood recalcula todo mês. Para entrar na conta, a marca precisa de pelo menos 45 pedidos e 10 avaliações em 3 meses.</div></div>';

  if(!M.length)return h+'<div class="c"><div class="vazio">sem medição do iFood ainda</div></div>';
  h+='<h2>🏆 Como está cada marca</h2><div class="c"><div class="rolar"><table>'+
     '<tr><th>Marca</th><th>Selo</th><th>Nível</th><th>Nota</th><th>Cancelou</th><th>Chamados</th><th>Falta o quê</th></tr>';
  M.forEach(function(m){
    const ok=function(v){return v?'<span class="pill p-ok">ok</span>':'<span class="pill p-bad">fora</span>'};
    h+='<tr><td><b>'+esc(m.marca)+'</b><div class="m">'+n(m.pedidos)+' pedidos · '+n(m.avaliados)+' avaliados</div></td>'+
       '<td>'+(m.e_super?'<span class="pill p-ok">🏆 SUPER</span>':'<span class="pill p-off">não</span>')+'</td>'+
       '<td>'+esc(m.status||'')+'</td>'+
       '<td>★ '+n(m.nota)+' '+ok(m.nota_ok)+'</td>'+
       '<td>'+n(m.canc_pct)+'% '+ok(m.canc_ok)+'</td>'+
       '<td>'+n(m.chamados_pct)+'% '+ok(m.chamados_ok)+'</td>'+
       '<td>'+esc(m.o_que_falta||'')+'</td></tr>';
  });
  h+='</table></div></div>';
  h+='<div class="aviso"><b>Esta é a tela que mais importa para a equipe.</b> O selo não é enfeite: marca com selo aparece antes na busca do iFood e vende mais. E repare na coluna Chamados — é quase sempre ela que derruba, não a nota. Chamado é o cliente reclamando de pedido atrasado, item faltando ou item errado; tudo coisa que se resolve na cozinha e no despacho.</div>';
  return h;
}

/* ===== por que o cliente reclamou ===== */
function motivos(){
  if(!SU)return '<div class="c"><div class="load">Buscando…</div></div>';
  const C=SU.motivos_chamado||[], X=SU.motivos_cancelamento||[];
  let tot=0; C.forEach(function(m){tot+=m.qtd});
  let h='';
  if(C.length){
    h+='<h2>📞 Por que o cliente abriu chamado — '+SU.dias+' dias</h2><div class="c"><div class="rolar"><table>'+
       '<tr><th>Motivo</th><th>Vezes</th><th>Peso</th><th>Cancelamento evitado</th></tr>';
    C.forEach(function(m){
      const pc=tot?Math.round(100*m.qtd/tot):0;
      h+='<tr><td>'+esc(m.motivo)+'</td><td><b>'+m.qtd+'</b></td>'+
         '<td>'+pc+'%'+barra(pc)+'</td><td>'+n(m.evitados)+'</td></tr>';
    });
    h+='</table></div><div class="m">Chamado é o que mais derruba o Selo Super. Cada linha aqui é um motivo pelo qual o cliente foi reclamar — e a de cima é a que mais custa.</div></div>';
  }
  if(X.length){
    h+='<h2>🚫 Por que os pedidos foram cancelados</h2><div class="c"><div class="rolar"><table>'+
       '<tr><th>Motivo</th><th>Vezes</th></tr>';
    X.forEach(function(m){h+='<tr><td>'+esc(m.motivo)+'</td><td><b>'+m.qtd+'</b></td></tr>'});
    h+='</table></div></div>';
  }
  if(!C.length&&!X.length)h='<div class="c"><div class="vazio">nenhuma reclamação no período 🎉</div></div>';
  return h;
}

function desenha(){
  if(!D){$('app').innerHTML='<div class="load">Carregando…</div>';return}
  let h=filtros();
  if((ABA==='super'||ABA==='cliente')&&PER!=='d7'&&PER!=='d30')
    h+='<div class="aviso">Estas duas abas sempre olham os últimos '+DIAS+' dias, não o período escolhido acima.</div>';
  if(ABA==='dia')h+=odia();
  else if(ABA==='super')h+=selo();

  else if(ABA==='resumo')h+=resumo();
  else if(ABA==='lojas')h+=tabelaLojas();
  else if(ABA==='turnos')h+=tabelaTurnos();
  else if(ABA==='cliente')h+=falas()+motivos();
  else if(ABA==='pausados')h+=pausados();
  else if(ABA==='dinheiro')h+=dinheiro();
  else if(ABA==='pessoas')h+=pessoas();
  else if(ABA==='ree')h+=reeAba();
  else if(ABA==='cancel')h+=cancelamentos();
  $('app').innerHTML=h;
}

async function boot(){
  $('app').innerHTML='<div class="load">Carregando…</div>';
  DD=null;SU=null;CC=null;
  try{ D=await puxa(); }
  catch(e){ $('app').innerHTML='<div class="c">Não deu para carregar. '+esc(e.message||'')+'</div>'; return }
  try{ CC=await porta('qualidade_cancelamentos',{periodo:perNome(),dias:DIAS,unidade:UNI||null}); }catch(e){ CC=null }
  const f=String(D.de).slice(8,10)+'/'+String(D.de).slice(5,7);
  const t=String(D.ate).slice(8,10)+'/'+String(D.ate).slice(5,7);
  $('sub').textContent='Cidadão do Mundo Burgers & Arts · '+f+' a '+t+' · '+
    (D.modo==='dono'?'visão completa':'visão da equipe')+(D.unidade?' · '+D.unidade:'');
  desenha();
}

/* ===== porta unica do portal ===== */
const CDMMODS=['qualidade'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'qualidade'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
