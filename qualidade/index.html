<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="/assets/chaves.js?v=1"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Qualidade do Delivery · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/cdm-ui.css?v=4">
<style>
/* 07/10/2026 (chat-qualidade-visual-07-10): pedido do Fabio — "deixar essa tela com o design que estamos adotando
   nos outros quadros do portal". Mesmo kit do Resolver hoje e do Delivery · Sao Braz (assets/cdm-ui.css): titulo
   grande, pilulas de placar, botoes redondos, quadros de numero grande e tabela bonita (faixa de cabecalho, linhas
   zebradas). Os botoes, as abas, as contas e as consultas sao as mesmas de antes; mudou so a aparencia. */
.per{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.per .chip{padding:7px 13px}
.per .atu{margin-left:auto}
.lojas.per{margin-bottom:12px}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
button.b:hover{border-color:var(--text2)}
.fontes{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:10px 13px;font-size:12.5px;color:var(--text2);line-height:1.6;margin:0 0 14px}
.fontes b{color:var(--text)}
.fontes a{color:var(--text);font-weight:700}
.rot{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.3px}
.lojas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.lojas .rot{min-width:64px;margin-right:2px}
.lojas .chip{padding:7px 13px}
.lojas.ult{margin-bottom:18px}
.fil{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.fil button{display:inline-flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600}
.fil button:hover{border-color:#5a5952}
.fil button.on{background:#fff;color:#111;border-color:#fff}
input.dt{background:var(--s1);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;font-family:inherit;color-scheme:dark}
h2{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:19px;letter-spacing:.02em;line-height:1.15;margin:24px 0 11px;display:flex;align-items:center;gap:9px}
.c{display:block;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;overflow:hidden}
.c:hover{border-color:var(--line)}
.m{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5}
.nota{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 12px}
.load{color:var(--muted);padding:40px 10px;text-align:center}
.vazio{padding:16px 0;font-size:14px}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:13px;padding:11px 14px;font-size:12.5px;line-height:1.5;margin:14px 0}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-bad{background:rgba(230,103,103,.15);color:#ff9a9a}
.p-warn{background:rgba(201,133,0,.16);color:var(--warn)}
.p-ok{background:rgba(37,163,95,.15);color:#7fe0aa}
.p-off{background:var(--s3);color:var(--text2)}

/* quadros de numero grande (iguais aos do Resolver hoje) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.cards>*{min-width:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 15px;color:var(--text);display:flex;flex-direction:column;gap:3px;transition:border-color .15s,transform .08s}
.card .t{font-size:13px;font-weight:800;color:var(--text2);line-height:1.3}
.card .v{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:42px;line-height:1.05;margin:0;overflow-wrap:anywhere}
.card.longo .v{font-size:28px;line-height:1.25;padding:6px 0 2px}
.card .d,.card .qs{font-size:12px;font-weight:700;line-height:1.35;color:var(--muted)}
.card.viv{cursor:pointer}
.card.viv:hover{border-color:#5a5952}
.card.vivon{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.card .seta{float:right;color:var(--muted);font-size:10px}
.up,.card .up{color:#7fe0aa}
.down,.card .down{color:#ff9a9a}
.flat,.card .flat{color:var(--muted)}
.detalhe{border:1px solid var(--brand);border-radius:16px;padding:2px 0;margin:2px 0 12px}

/* 04/10/2026 (chat-cartoes-delivery-04-10): cartoes iguais ao Resolver hoje nas listas de pedido */
.vv-lista{display:grid;gap:10px;margin-bottom:10px}
.vv-lista>*{min-width:0}
div.vv{background:var(--s1);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px}
div.vv.ok{border-left-color:var(--ok)}
div.vv.bad{border-left-color:var(--bad)}
div.vv.off{border-left-color:var(--muted)}
.vv .hr{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.vv .ha{color:var(--muted);font-size:11.5px;margin-top:3px}
.vv .tt{font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vv .lj{color:var(--text2);font-size:13px;margin-top:2px}
.vv .it{margin-top:6px;font-size:13.5px;color:var(--text)}
.vv .rs{margin-top:4px;font-size:12px;color:var(--muted)}
.vv .fn{margin-top:2px;font-size:11px;color:var(--muted)}

/* tabela bonita: faixa de cabecalho, linhas zebradas, cor ao passar o mouse (igual ao Ponto ao vivo).
   No celular (ate 700px) o portal.js transforma cada tabela em cartoes; por isso o desenho de mesa so vale acima disso. */
.rolar{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th{text-align:left;color:var(--muted);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:11px 10px 10px 0;white-space:nowrap}
td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right}
.cd{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.cd.big{font-size:21px}
.u{color:var(--muted);font-size:12px}
.bar{height:5px;border-radius:99px;background:var(--s3);overflow:hidden;min-width:60px;max-width:130px;margin-top:4px}
.bar i{display:block;height:100%;background:var(--brand)}
/* prazo pelo iFood: faixa dourada = o dia entra na media; cinza = nao entra */
table.pz td{vertical-align:middle}
table.pz tr.off td{color:var(--muted)}
table.pz tr.off b{color:var(--text2);font-weight:600}
@media (min-width:701px){
  .rolar{margin:8px -14px 0}
  .c>.rolar:first-child{margin-top:-12px}
  .c>.rolar:last-child{margin-bottom:-12px}
  .rolar th{background:var(--s2)}
  .rolar th:first-child,.rolar td:first-child{padding-left:14px}
  .rolar th:last-child,.rolar td:last-child{padding-right:14px}
  .rolar table:not(.mq) tr:nth-child(odd)>td{background:rgba(255,255,255,.018)}
  .rolar table:not(.mq) tr:hover>td{background:rgba(224,168,28,.06)}
  table.mq tr.z>td{background:rgba(255,255,255,.02)}
  table.pz td:first-child{box-shadow:inset 4px 0 0 var(--brand)}
  table.pz tr.off td:first-child{box-shadow:inset 4px 0 0 #4a4943}
  table.pz tr.dia>td{border-top:2px solid #4a4943}
  table.pz:has(th[data-cdmsd]) tr.dia>td{border-top:1px solid var(--line)}
  table.pz th:nth-child(5),table.pz td:nth-child(5){padding-left:26px}
}
@media (max-width:700px){
  /* prazo no celular: um cartao compacto por dia e loja (a tabela tem data-cdm-livre, o portal.js nao mexe nela) */
  table.pz,table.pz tbody{display:block}
  table.pz tr:first-child{display:none}
  table.pz tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 8px;padding:10px 10px 10px 14px;border-top:1px solid var(--line);box-shadow:inset 4px 0 0 var(--brand)}
  table.pz tr:nth-child(2){border-top:0}
  table.pz tr.dia{border-top:2px solid #4a4943}
  table.pz tr.off{box-shadow:inset 4px 0 0 #4a4943}
  table.pz td{display:block;border:0;padding:0;text-align:left}
  table.pz td:nth-child(1){grid-area:1/1;align-self:baseline}
  table.pz td:nth-child(2){grid-area:1/2/2/4;align-self:baseline}
  table.pz td:nth-child(5){grid-area:1/4;text-align:right}
  table.pz tr.off td:nth-child(5){grid-area:3/1/4/5;text-align:left}
  table.pz td:nth-child(5) .bar{margin-left:auto;min-width:0}
  table.pz td:nth-child(3){grid-area:2/1}
  table.pz td:nth-child(4){grid-area:2/2}
  table.pz td:nth-child(6){grid-area:2/3}
  table.pz td:nth-child(7){grid-area:2/4}
  table.pz td:nth-child(3),table.pz td:nth-child(4),table.pz td:nth-child(6),table.pz td:nth-child(7){align-self:end}
  table.pz td[data-l]::before{content:attr(data-l);display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;line-height:1.2;margin-bottom:2px}
}
/* maquininha: duas linhas por entrega (a de baixo explica a situacao) */
.mq-top{font-size:12.5px;color:var(--text2);margin-bottom:8px;line-height:1.5}
.mq-top b{color:var(--text)}
.mq-pills{display:flex;gap:6px;flex-wrap:wrap}
table.mq{min-width:700px;font-size:13px}
table.mq td{padding-bottom:3px}
table.mq tr.ex>td{border-top:0;padding-top:0;padding-bottom:9px;color:var(--muted);font-size:11.5px}
.maq{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--text2)}

/* graficos e falas (abas sem botao hoje, mantidas no arquivo) */
.g{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
.g div{flex:1;background:var(--s2);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.g div.hi{background:var(--brand);color:var(--brand-ink)}
.gx{display:flex;gap:3px;margin-top:5px}
.gx span{flex:1;text-align:center;font-size:9px;color:var(--muted);overflow:hidden}
.fala{border-left:3px solid var(--bad);padding:8px 0 8px 12px;margin-bottom:9px}
.fala .q{font-size:13.5px;color:var(--text2);font-style:italic}
.fala .w{font-size:11px;color:var(--muted);margin-top:4px}

@media (max-width:640px){
  .lojas .rot{min-width:0}
  .placar .pc{display:none}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card .v{font-size:34px}
  .card.longo .v{font-size:22px}
  h2{font-size:17px}
  div.vv{grid-template-columns:58px minmax(0,1fr);gap:8px;padding:12px 10px}
  .vv .hr{font-size:19px}
  img,svg,canvas,iframe{max-width:100%}
}
</style>
</head>
<body>

<div class="wrap">
<div class="top">
  <div>
    <h1>📊 Como fomos · Qualidade do Delivery</h1>
    <div class="placar" id="placar"><span class="pl">carregando…</span></div>
  </div>
</div>
<div class="lojas per" id="per"><button class="b atu" onclick="boot()" title="Ler de novo">↻ Atualizar</button></div>

<div class="fontes">Esta tela mostra <b>o período escolhido nos botões acima</b> — é para ver como a casa está indo. Para o que está acontecendo <b>agora</b>, abra <a href="/delivery/central.html">🎯 Central do Delivery →</a></div>
<div id="app"><div class="load">Carregando…</div></div>
</div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};

let D=null,DD=null,SU=null,DIAS=30,UNI='',ABA='prazo',DIA='',PER='hoje',CC=null,VIVO='';

function hoje(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function ontem(){const d=new Date();d.setDate(d.getDate()-1);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
let FR=null,TIMER=null;
async function puxaFrescor(){try{FR=await porta('qualidade_frescor',undefined)}catch(e){FR=null}}
function idade(f){
  if(f.min!=null&&f.min<600)return f.min<2?'agora mesmo':(f.min<60?'há '+f.min+' min':'há '+Math.floor(f.min/60)+'h'+(f.min%60?' '+(f.min%60)+'min':''));
  if(f.dias!=null)return f.dias===0?'hoje':(f.dias===1?'ontem':'há '+f.dias+' dias');
  return '—';
}
function carimbo(){
  if(!FR||!FR.fontes)return '';
  let h='<div class="c" style="padding:10px 14px"><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">'+
        '<b style="font-size:12.5px">🕐 De quando é cada número</b>';
  FR.fontes.forEach(function(f){
    const velho=(f.dias!=null&&f.dias>=2)||(f.min!=null&&f.min>=600);
    h+='<span style="font-size:11.5px;color:var(--muted)">'+esc(f.fonte)+': '+
       '<span class="pill '+(velho?'p-bad':'p-ok')+'">'+idade(f)+'</span></span>';
  });
  h+='</div><div class="m">Cada fonte entra no sistema num ritmo diferente. Entrega e prazo vêm de 5 em 5 minutos; avaliação e chamado do iFood dependem do robô que roda no computador, 9h e 17h.</div></div>';
  return h;
}
function ligaTimer(){
  if(TIMER){clearInterval(TIMER);TIMER=null}
  if(ABA!=='dia'&&ABA!=='resumo')return;
  /* 3 minutos, e so enquanto a aba estiver na frente */
  TIMER=setInterval(function(){
    if(document.visibilityState!=='visible')return;
    if(ABA!=='dia'&&ABA!=='resumo'){clearInterval(TIMER);TIMER=null;return}
    puxaDia();
  },180000);
}

async function porta(nome,dados){
  const r=await fetch(SB+'rpc/'+nome,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_dados:dados})});
  if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('porta '+r.status))}
  return await r.json();
}
function perNome(){return (PER==='d7'||PER==='d30')?'dias':PER}
async function puxa(){return porta('qualidade_consulta',{periodo:perNome(),dias:DIAS,unidade:UNI||null})}
async function puxaCanc(){
  try{ CC=await porta('qualidade_cancelamentos',{periodo:perNome(),dias:DIAS,unidade:UNI||null}); }
  catch(e){ CC={erro:(e&&e.message)||'não deu para buscar'}; }
  desenha();
}
function vaiPeriodo(p){PER=p;CC=null;VIVO='';boot()}
function vivo(k){
  VIVO=(VIVO===k?'':k);
  if(VIVO&&(VIVO==='cancel'||VIVO==='ecoz'||VIVO==='eent')&&!CC){desenha();puxaCanc();return}
  desenha();
}
/* o iFood manda o cancelamento so no dia seguinte: diz se o periodo escolhido ja tem relatorio */
function iFoodTem(){
  if(!CC||CC.erro||!CC.ifood_ate||!D||!D.ate)return true;
  return String(D.ate)<=String(CC.ifood_ate);
}
async function puxaDia(){DD=await porta('qualidade_dia',{dia:DIA||hoje(),unidade:UNI||null});await puxaFrescor();desenha()}
async function puxaSuper(){SU=await porta('qualidade_super',{dias:DIAS});desenha()}

function n(v){return v==null?'—':String(v)}
function br(v){return (v==null||!(function(){try{return sessionStorage.getItem("cdm_admin")==="1"}catch(e){return false}})())?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}

/* compara com o periodo anterior. bom=true quer dizer "subir e bom" */
function delta(agora,antes,bom,suf){
  if(agora==null||antes==null)return '<div class="d flat">sem comparação</div>';
  const a=Number(agora),b=Number(antes);
  if(b===0)return '<div class="d flat">antes: 0</div>';
  const p=Math.round((a-b)/Math.abs(b)*100);
  if(p===0)return '<div class="d flat">igual ao período anterior</div>';
  const subiu=p>0, bomSinal=(subiu===bom);
  return '<div class="d '+(bomSinal?'up':'down')+'">'+(subiu?'▲':'▼')+' '+Math.abs(p)+'% · antes '+n(antes)+(suf||'')+'</div>';
}

function cartao(t,v,d){const sv=String(v==null?'':v).replace(/<[^>]*>/g,'');return '<div class="card'+(sv.length>7?' longo':'')+'"><div class="t">'+t+'</div><div class="v">'+v+'</div>'+(d||'')+'</div>'}

function barra(pct){
  if(pct==null)return '';
  return '<div class="bar"><i style="width:'+Math.min(100,Math.max(0,pct))+'%"></i></div>';
}

/* 07/10/2026 (chat-qualidade-visual-07-10): mesmo desenho do Resolver hoje — o periodo vai para os botoes do topo
   (com o Atualizar), o subtitulo virou pilulas de placar, e lojas e abas viraram botoes redondos com rotulo.
   Os botoes chamam as mesmas funcoes de antes. */
const PER_NOME={turno:'Turno de agora',hoje:'Hoje',ontem:'Ontem',semana:'Semana',mes:'Este mês'};
function placar(){
  const p=$('placar');
  if(!p||!D)return;
  let h='<span class="pl pc">Período <b>'+esc(PER_NOME[PER]||('últimos '+DIAS+' dias'))+'</b></span>';
  if(D.de&&D.ate)h+='<span class="pl"><b>'+dData(D.de)+'</b> a <b>'+dData(D.ate)+'</b></span>';
  if(D.de_antes)h+='<span class="pl">comparando com <b>'+dData(D.de_antes)+' a '+dData(D.ate_antes)+'</b></span>';
  if(D.turno_atual)h+='<span class="pl">Turno de agora: <b>'+esc(D.turno_atual)+'</b></span>';
  h+='<span class="pl pc">Loja <b>'+esc(D.unidade||UNI||'Todas')+'</b></span>';
  h+='<span class="pl"><b>'+(D.modo==='dono'?'visão completa':'visão da equipe')+'</b></span>';
  p.innerHTML=h;
}
function filtros(){
  const pe=$('per');
  if(pe){
    let p='<span class="rot">PERÍODO</span>';
    [['turno','⏱ Turno de agora'],['hoje','Hoje'],['ontem','Ontem'],['semana','Semana'],['mes','Este mês']].forEach(function(o){
      p+='<button class="chip'+(PER===o[0]?' on':'')+'" onclick="vaiPeriodo(\''+o[0]+'\')">'+o[1]+'</button>';
    });
    pe.innerHTML=p+'<button class="b atu" onclick="boot()" title="Ler de novo">↻ Atualizar</button>';
  }
  placar();
  let h='<div class="lojas"><span class="rot">LOJA</span>';
  h+='<button class="chip'+(UNI===''?' on':'')+'" onclick="UNI=\'\';boot()">🏠 Todas as lojas</button>';
  (D.por_loja||[]).forEach(function(l){
    h+='<button class="chip'+(UNI===l.unidade?' on':'')+'" onclick="UNI=\''+esc(l.unidade).replace(/'/g,"\\'")+'\';boot()">'+esc(l.unidade)+'</button>';
  });
  h+='</div>';
  /* 01/10/2026, pedido do Fabio: "reduzir o numero de telas para o pessoal" - sairam Resumo, Dia a dia,
     Por turno, Reentregas e Fora do ar (cardapios online). As contas continuam no arquivo, so sem botao.
     01/10/2026, mesmo pedido: saiu tambem o Painel do dia. */
  const vivas=[['prazo','⏱ Prazo pelo iFood'],['pessoas','🛵 Motoboys'],['cancel','🚫 Cancelamentos'],['maq','🧾 Maquininha']];
  const analise=[['cliente','⭐ Avaliações'],['super','🏆 Selo Super'],['neg','🤝 Negociações']];
  const abaBtn=function(a){return '<button class="chip'+(ABA===a[0]?' on':'')+'" onclick="vaiPara(\''+a[0]+'\')">'+a[1]+'</button>'};
  h+='<div class="lojas"><span class="rot">AO VIVO</span>';
  vivas.forEach(function(a){h+=abaBtn(a)});
  h+='</div><div class="lojas ult"><span class="rot">ANÁLISE</span>';
  analise.forEach(function(a){h+=abaBtn(a)});
  h+='</div>';
  if(ABA==='dia'){

async function reeRPC(acao,dados){

function reePuxa(){

/* 30/09/2026, pedido do Fabio: o prazo medido pelo Gestor Web do iFood, sem depender do TrackEat.

      '<td class="n" data-l="Na rua">'+(!ok||r.med_rua==null?'—':'<span class="cd">'+String(r.med_rua).replace('.',',')+'</span> <span class="u">min</span>')+'</td></tr>';
  });
  return h+'</table></div><div class="m" style="margin-top:10px">Pedido → entrega e Na rua: mediana (o do meio) em minutos. Faixa dourada à esquerda: o dia entra na média; faixa cinza: não entra.</div></div>';
}

let NEG=null;
async function negPuxa(){
  try{ NEG=await porta('qualidade_negociacoes',{periodo:perNome(),dias:DIAS,unidade:UNI||null}); }
  catch(e){ NEG={erro:(e&&e.message)||'falhou'} }
  desenha();
}
function negAba(){
  if(NEG===null)return '<div class="c"><div class="load">Buscando as negociações…</div></div>';
  if(NEG.erro)return '<div class="c"><b>Não deu para buscar as negociações.</b><div class="m">'+esc(NEG.erro)+'</div></div>';
  const r=NEG.resumo||{}, b=NEG.antes||{}, dono=(NEG.modo==='dono');
  let F=NEG.fontes||{};
  let h='<div class="m" style="margin:0 0 8px">Relatório oficial do iFood — <b>atrasa 1 dia</b> · dados até <b>'+dData(F.relatorio_ate||NEG.ifood_ate)+'</b>'+
    ((F.relatorio_atraso_dias||NEG.atraso_dias)>1?' · <span class="pill p-warn">'+(F.relatorio_atraso_dias||NEG.atraso_dias)+' dias sem relatório novo</span>':'')+
    (F.chat_ate?' &nbsp;·&nbsp; Chat do cliente — <b>ao vivo</b> · dados até <b>'+dData(F.chat_ate)+'</b>':'')+'</div>'+
    (F.aviso?'<div class="m" style="margin:0 0 10px;padding:8px 10px;border-left:3px solid #d9a441;background:rgba(217,164,65,.10);border-radius:4px">⚠️ '+esc(F.aviso)+'</div>':'');
  h+='<div class="cards">';
  h+=cartao('Chamados', n(r.chamados), delta(r.chamados,b.chamados,false,''));
  h+=cartao('Cancelamento evitado', (r.evitados_medidos?n(r.evitados):'—'), (r.evitados_medidos?delta(r.evitados,b.evitados,true,''):'<div class="d flat">não medido nas linhas do chat</div>'));
  h+=cartao('Virou cancelamento', n(r.virou_cancelamento), delta(r.virou_cancelamento,b.virou_cancelamento,false,''));
  h+=cartao('Loja não respondeu', n(r.loja_nao_respondeu), delta(r.loja_nao_respondeu,b.loja_nao_respondeu,false,''));
  h+=cartao('Com reembolso', n(r.com_reembolso), delta(r.com_reembolso,b.com_reembolso,false,''));
  h+=cartao('Pesou no Selo Super', (r.impactou_super_medidos?n(r.impactou_super):'—'), (r.impactou_super_medidos?delta(r.impactou_super,b.impactou_super,false,''):'<div class="d flat">não medido nas linhas do chat</div>'));
  if(dono){
    h+=cartao('Reembolsado', br(r.reembolsado), '<div class="d flat">antes '+br(b.reembolsado)+'</div>');
    h+=cartao('Salvo ao negociar', (r.valor_em_jogo==null?'—':br(r.salvo)), '<div class="d flat">'+(r.valor_em_jogo==null?'o chat não traz o valor do pedido':'de '+br(r.valor_em_jogo)+' em jogo')+'</div>');
  }
  h+='</div>';
  const M=NEG.por_motivo||[];
  if(M.length){
    h+='<h2>📞 Por que o cliente abriu chamado</h2><div class="c"><div class="rolar"><table><tr><th>Motivo</th><th>Quando</th><th>Chamados</th><th>Evitados</th>'+(dono?'<th>Reembolsado</th>':'')+'</tr>';
    M.forEach(function(m){h+='<tr><td><b>'+esc(m.motivo)+'</b></td><td>'+esc(m.momento||'')+'</td><td>'+n(m.n)+'</td><td>'+n(m.evitados)+'</td>'+(dono?'<td>'+br(m.reembolsado)+'</td>':'')+'</tr>'});
    h+='</table></div></div>';
  }
  const L=NEG.por_loja||[];
  if(L.length){
    h+='<h2>🏪 Por marca</h2><div class="c"><div class="rolar"><table><tr><th>Loja</th><th>Marca</th><th>Chamados</th><th>Evitados</th><th>Sem resposta</th>'+(dono?'<th>Reembolsado</th>':'')+'</tr>';
    L.forEach(function(l){h+='<tr><td>'+esc(l.unidade)+'</td><td>'+esc(l.marca)+'</td><td>'+n(l.n)+'</td><td>'+n(l.evitados)+'</td><td>'+n(l.nao_respondeu)+'</td>'+(dono?'<td>'+br(l.reembolsado)+'</td>':'')+'</tr>'});
    h+='</table></div></div>';
  }
  const X=NEG.lista||[];
  h+='<h2>🤝 Cada negociação, uma por uma</h2>';
  if(!X.length)h+='<div class="c"><div class="vazio">nenhuma negociação no período</div></div>';
  else{
    /* 04/10/2026 (chat-cartoes-delivery-04-10): a tabela virou cartoes, mesmos campos */
    h+='<div class="vv-lista">'+X.map(function(x){
      const res=x.evitado?'<span class="pill p-ok">evitado</span>':(x.status_pedido==='CANCELADO'?'<span class="pill p-bad">cancelou</span>':(x.status_pedido?'<span class="pill p-off">'+esc(x.status_pedido)+'</span>':''));
      return vvCard(x.evitado?'ok':(x.status_pedido==='CANCELADO'?'bad':'off'), x.hora, dData(x.data),
        '🤝 Pedido '+esc(x.pedido||'—')+' '+res+(x.arbitragem?' <span class="pill p-warn">arbitragem'+(x.resultado_arbitragem?': '+esc(x.resultado_arbitragem):'')+'</span>':'')+(x.impactou_super?' <span class="pill p-warn">selo</span>':'')+(x.tem_fotos?' 📷':''),
        '<div class="lj"><b>'+esc(x.unidade||'')+'</b>'+(x.marca?' · '+esc(x.marca):'')+'</div>'+
        '<div class="it">Motivo: '+esc(x.motivo||'—')+(x.momento?' <span class="m">('+esc(x.momento)+')</span>':'')+'</div>'+
        (x.quem_iniciou?'<div class="rs">Quem abriu: '+esc(x.quem_iniciou)+'</div>':'')+
        ((x.resposta_loja||x.tempo_ofertado_min)?'<div class="rs">A loja: '+esc(x.resposta_loja||'—')+(x.tempo_ofertado_min?' · ofereceu +'+n(x.tempo_ofertado_min)+' min':'')+'</div>':'')+
        (x.resposta_cliente?'<div class="rs">O cliente: '+esc(x.resposta_cliente)+'</div>':'')+
        (dono?'<div class="rs">Pedido '+br(x.valor_pedido)+' · reembolso '+br(x.valor_reembolso)+'</div>':''));
    }).join('')+'</div>';
  }
  return h;
}
function parciais(){
  let h='';
  const hoje=(CV&&CV.parciais)||[];
  h+='<h2>✂️ Cancelamentos parciais de hoje (Gestor Web)</h2>';
  if(!hoje.length)h+='<div class="c"><div class="vazio">nenhum item devolvido hoje até a última leitura do Gestor Web (1h, 12h e 18h)</div></div>';
  else{
    /* 04/10/2026 (chat-cartoes-delivery-04-10): cartoes. "loja nao escreveu" so quando o dado diz false; vazio nao vira "nao" */
    h+='<div class="vv-lista">'+hoje.map(function(p){
      var le=String(p.loja_escreveu), lp=le==='true'?'<span class="pill p-ok">loja escreveu</span>':(le==='false'?'<span class="pill p-warn">loja não escreveu</span>':'');
      return vvCard('', p.hora, '', '✂️ Pedido '+esc(p.pedido||'—')+' '+lp,
        '<div class="lj"><b>'+esc(p.unidade||'')+'</b>'+(p.marca?' · '+esc(p.marca):'')+'</div>'+
        '<div class="it">O que faltou / veio errado: <b>'+esc(p.item||'—')+'</b></div>'+
        '<div class="rs">O que a loja fez: '+esc(p.o_que_a_loja_fez||'—')+(CV.dono?' · devolvido '+br(p.valor_devolvido):'')+'</div>');
    }).join('')+'</div>';
  }
  const per=(CC&&CC.parciais)||[];
  h+='<h2>✂️ Cancelamentos parciais do período (relatório do iFood, atrasa 1 dia)</h2>';
  if(!per.length)h+='<div class="c"><div class="vazio">nenhum parcial no período'+(CC&&CC.parciais_antes?' · no período anterior foram '+n(CC.parciais_antes):'')+'</div></div>';
  else{
    h+='<div class="m" style="margin:0 0 6px">'+per.length+' no período · antes: '+n(CC.parciais_antes)+'</div>';
    h+='<div class="vv-lista">'+per.map(function(p){
      return vvCard('', p.hora, dData(p.data), '✂️ Pedido '+esc(p.pedido||'—')+(p.turno?' <span class="pill p-off">'+esc(p.turno)+'</span>':''),
        '<div class="lj"><b>'+esc(p.unidade||'')+'</b>'+(p.marca?' · '+esc(p.marca):'')+'</div>'+
        '<div class="it">Itens devolvidos: <b>'+esc(p.itens||'—')+'</b></div>'+
        '<div class="rs">Motivo: '+esc(p.motivo||'—')+(p.origem?' · '+esc(p.origem):'')+'</div>'+
        (CC.modo==='dono'?'<div class="rs">Pedido '+br(p.valor_pedido)+' · devolvido '+br(p.valor_devolvido)+(p.entregador?' · motoboy '+esc(p.entregador):'')+'</div>':''));
    }).join('')+'</div>';
  }
  return h;
}

function desenha(){
  if(!D){$('app').innerHTML='<div class="load">Carregando…</div>';return}
  let h=filtros();
  if((ABA==='super'||ABA==='cliente')&&PER!=='d7'&&PER!=='d30')
    h+='<div class="aviso">Estas duas abas sempre olham os últimos '+DIAS+' dias, não o período escolhido acima.</div>';
  if(ABA==='dia')h+=odia();
  else if(ABA==='super')h+=selo();

  else if(ABA==='resumo')h+=resumo()+'<h2>🏪 Por loja</h2>'+tabelaLojas();
  else if(ABA==='lojas')h+=tabelaLojas();
  else if(ABA==='turnos')h+=tabelaTurnos();
  else if(ABA==='cliente')h+=falas()+motivos();
  else if(ABA==='pausados')h+=pausados();
  else if(ABA==='dinheiro')h+=dinheiro();
  else if(ABA==='pessoas')h+=motoVivo()+(D.modo==='dono'?'<h2>🛵 Análise dos entregadores (só você)</h2>'+pessoas():'');
  else if(ABA==='ree')h+=reeAba();
  else if(ABA==='cancel')h+=cancVivo()+parciais()+cancelamentos();
  else if(ABA==='maq')h+=maqAba();
  else if(ABA==='neg')h+=negAba();
  else if(ABA==='prazo')h+=pzAba();
  else if(ABA==='painel')h+='<div class="c" style="padding:6px"><iframe src="/delivery/central.html" style="width:100%;height:82vh;min-height:620px;border:0;border-radius:9px;background:var(--s0)" title="Painel do dia"></iframe></div>';
  $('app').innerHTML=h;
}

async function boot(){
  $('app').innerHTML='<div class="load">Carregando…</div>';
  const pl=$('placar'); if(pl)pl.innerHTML='<span class="pl">carregando…</span>';
  const pe=$('per'); if(pe)pe.innerHTML='<button class="b atu" onclick="boot()" title="Ler de novo">↻ Atualizar</button>';
  DD=null;SU=null;CC=null;CV=null;NEG=null;PZ=null;
  try{ D=await puxa(); }
  catch(e){ $('app').innerHTML='<div class="c">Não deu para carregar. '+esc(e.message||'')+'</div>'; if(pl)pl.innerHTML='<span class="pl">não carregou — toque em Atualizar</span>'; return }
  try{ CC=await porta('qualidade_cancelamentos',{periodo:perNome(),dias:DIAS,unidade:UNI||null}); }catch(e){ CC=null }
  /* 07/10/2026: o subtitulo virou o placar de pilulas, desenhado em filtros() a cada desenho */
  desenha();
  if(ABA==='dia'&&!DD)puxaDia();
  if(ABA==='neg'&&NEG===null)negPuxa();
  if(ABA==='prazo'&&PZ===null)pzPuxa();
  if(ABA==='cancel'&&!CV)puxaCancVivo();
}

/* ===== porta unica do portal ===== */
const CDMMODS=['qualidade'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'qualidade'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
