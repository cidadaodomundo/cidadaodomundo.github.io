<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Qualidade do Delivery · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1200px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
button.b:hover{border-color:var(--brand)}
button.bp{background:var(--brand);border-color:var(--brand)}
h2{font-size:15px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-off{background:rgba(138,137,126,.15);color:var(--muted)}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.m{color:var(--muted);font-size:11.5px;margin-top:3px}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:8px 0}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:18px}
.fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fil button{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer}
.fil button:hover{border-color:var(--brand)}
.fil button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;margin-bottom:6px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.card .t{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.card .v{font-size:27px;font-weight:800;margin:6px 0 2px;line-height:1.1}
.card .d{font-size:12px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.rolar{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th{text-align:left;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:0 10px 8px 0;white-space:nowrap}
td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.bar{height:7px;border-radius:99px;background:var(--s2);overflow:hidden;min-width:70px;margin-top:5px}
.bar i{display:block;height:100%;background:var(--brand)}
.g{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
.g div{flex:1;background:var(--s2);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.g div.hi{background:var(--brand)}
.gx{display:flex;gap:3px;margin-top:5px}
.gx span{flex:1;text-align:center;font-size:9px;color:var(--muted);overflow:hidden}
.fala{border-left:3px solid var(--bad);padding:8px 0 8px 12px;margin-bottom:9px}
.fala .q{font-size:13.5px;color:var(--text2);font-style:italic}
.fala .w{font-size:11px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>📊 Qualidade do Delivery</h1>
    <div class="sub" id="sub">carregando…</div>
  </div>
  <div class="rt">
    <button class="b" onclick="boot()">↻ Atualizar</button>
  </div>
</div>

<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};

let D=null,DIAS=30,UNI='',ABA='resumo';

async function puxa(){
  const r=await fetch(SB+'rpc/qualidade_consulta',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_dados:{dias:DIAS,unidade:UNI||null}})});
  if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('porta '+r.status))}
  return await r.json();
}

function n(v){return v==null?'—':String(v)}
function br(v){return v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}

/* compara com o periodo anterior. bom=true quer dizer "subir e bom" */
function delta(agora,antes,bom,suf){
  if(agora==null||antes==null)return '<div class="d flat">sem comparação</div>';
  const a=Number(agora),b=Number(antes);
  if(b===0)return '<div class="d flat">antes: 0</div>';
  const p=Math.round((a-b)/Math.abs(b)*100);
  if(p===0)return '<div class="d flat">igual ao período anterior</div>';
  const subiu=p>0, bomSinal=(subiu===bom);
  return '<div class="d '+(bomSinal?'up':'down')+'">'+(subiu?'▲':'▼')+' '+Math.abs(p)+'% · antes '+n(antes)+(suf||'')+'</div>';
}

function cartao(t,v,d){return '<div class="card"><div class="t">'+t+'</div><div class="v">'+v+'</div>'+(d||'')+'</div>'}

function barra(pct){
  if(pct==null)return '';
  return '<div class="bar"><i style="width:'+Math.min(100,Math.max(0,pct))+'%"></i></div>';
}

function filtros(){
  let h='<div class="fil">';
  [[7,'7 dias'],[30,'30 dias'],[90,'90 dias']].forEach(function(o){
    h+='<button class="'+(DIAS===o[0]?'on':'')+'" onclick="DIAS='+o[0]+';boot()">'+o[1]+'</button>';
  });
  h+='</div><div class="fil">';
  h+='<button class="'+(UNI===''?'on':'')+'" onclick="UNI=\'\';boot()">🏠 Todas as lojas</button>';
  (D.por_loja||[]).forEach(function(l){
    h+='<button class="'+(UNI===l.unidade?'on':'')+'" onclick="UNI=\''+esc(l.unidade).replace(/'/g,"\\'")+'\';boot()">'+esc(l.unidade)+'</button>';
  });
  h+='</div>';
  const abas=[['resumo','📈 Resumo'],['lojas','🏪 Por loja'],['turnos','🕐 Por turno'],
              ['cliente','💬 O que o cliente falou'],['pausados','📵 Fora do ar']];
  if(D.modo==='dono')abas.push(['dinheiro','💰 Dinheiro'],['pessoas','🛵 Entregadores']);
  h+='<div class="fil">';
  abas.forEach(function(a){h+='<button class="'+(ABA===a[0]?'on':'')+'" onclick="ABA=\''+a[0]+'\';desenha()">'+a[1]+'</button>'});
  h+='</div>';
  return h;
}

function resumo(){
  const a=D.agora,b=D.antes;
  let h='<div class="cards">';
  h+=cartao('No prazo', (a.pct_prazo==null?'—':a.pct_prazo+'%'), delta(a.pct_prazo,b.pct_prazo,true,'%'));
  h+=cartao('Nota do iFood', (a.nota==null?'—':'★ '+a.nota), delta(a.nota,b.nota,true,''));
  h+=cartao('Notas baixas (1–3)', n(a.notas_baixas), delta(a.notas_baixas,b.notas_baixas,false,''));
  h+=cartao('Cancelamentos', n(a.cancelamentos), delta(a.cancelamentos,b.cancelamentos,false,''));
  h+=cartao('Chamados do cliente', n(a.chamados), delta(a.chamados,b.chamados,false,''));
  h+=cartao('Cancelamento evitado', n(a.evitados), '<div class="d flat">de '+n(a.chamados)+' chamados</div>');
  h+=cartao('Entregas', n(a.entregas), delta(a.entregas,b.entregas,true,''));
  h+=cartao('Atraso médio', (a.atraso_medio==null?'—':a.atraso_medio+' min'), delta(a.atraso_medio,b.atraso_medio,false,' min'));
  h+='</div>';

  h+='<div class="c"><b>Como estamos indo</b>';
  h+='<div class="m">Cada número acima está comparado com os '+D.dias+' dias ANTERIORES a este período. Verde quer dizer que andou para o lado bom; vermelho, para o lado ruim. Não existe número de fora para bater — a casa compara com ela mesma.</div></div>';

  /* grafico do prazo por dia */
  const dd=(D.por_dia||[]).filter(function(x){return x.pct_prazo!=null});
  if(dd.length){
    /* o destaque compara cada dia com a media DO PROPRIO periodo, nao com meta nenhuma */
    let soma=0; dd.forEach(function(x){soma+=Number(x.pct_prazo)});
    const media=Math.round(soma/dd.length);
    h+='<h2>📈 No prazo, dia a dia</h2><div class="c"><div class="g">';
    dd.forEach(function(x){
      h+='<div class="'+(x.pct_prazo>=media?'hi':'')+'" style="height:'+Math.max(2,x.pct_prazo)+'%" title="'+x.dia+': '+x.pct_prazo+'%"></div>';
    });
    h+='</div><div class="gx">';
    dd.forEach(function(x,i){h+='<span>'+(dd.length<=31||i%3===0?String(x.dia).slice(8,10):'')+'</span>'});
    h+='</div><div class="m">Barra na cor da casa = dia acima da média do próprio período ('+media+'%). A régua é o seu próprio desempenho, não um número de fora.</div></div>';
  }
  return h;
}

function tabelaLojas(){
  const L=D.por_loja||[];
  if(!L.length)return '<div class="c"><div class="vazio">sem dado no período</div></div>';
  let h='<div class="c"><div class="rolar"><table><tr><th>Loja</th><th>Entregas</th><th>No prazo</th><th>Nota</th><th>Notas baixas</th><th>Cancelou</th><th>Chamados</th></tr>';
  L.forEach(function(l){
    h+='<tr><td><b>'+esc(l.unidade)+'</b></td><td>'+n(l.entregas)+'</td>'+
       '<td>'+(l.pct_prazo==null?'—':l.pct_prazo+'%')+barra(l.pct_prazo)+'</td>'+
       '<td>'+(l.nota==null?'—':'★ '+l.nota)+'</td>'+
       '<td>'+(l.notas_baixas>0?'<span class="pill p-bad">'+l.notas_baixas+'</span>':'0')+'</td>'+
       '<td>'+n(l.cancelamentos)+'</td><td>'+n(l.chamados)+'</td></tr>';
  });
  h+='</table></div><div class="m">Comparação entre as próprias lojas, no mesmo período. Serve para ver quem já achou um jeito que funciona — e copiar.</div></div>';
  return h;
}

function tabelaTurnos(){
  const T=D.por_turno||[];
  if(!T.length)return '<div class="c"><div class="vazio">sem dado no período</div></div>';
  let h='<div class="c"><div class="rolar"><table><tr><th>Turno</th><th>Entregas</th><th>No prazo</th><th>Atraso médio</th></tr>';
  T.forEach(function(t){
    h+='<tr><td><b>'+esc(t.turno)+'</b></td><td>'+n(t.entregas)+'</td>'+
       '<td>'+(t.pct_prazo==null?'—':t.pct_prazo+'%')+barra(t.pct_prazo)+'</td>'+
       '<td>'+(t.atraso_medio==null?'—':t.atraso_medio+' min')+'</td></tr>';
  });
  h+='</table></div><div class="m">Quando um turno fica muito atrás do outro, quase sempre é gente de menos na hora do pico — não é falta de esforço.</div></div>';
  return h;
}

function falas(){
  const F=D.cliente_falou||[];
  if(!F.length)return '<div class="c"><div class="vazio">nenhum cliente reclamou por escrito neste período 🎉</div></div>';
  let h='<div class="c">';
  F.forEach(function(f){
    h+='<div class="fala"><div class="q">"'+esc(f.comentario)+'"</div>'+
       '<div class="w">★ '+f.nota+' · '+esc(f.marca||f.unidade)+' · '+String(f.data).slice(8,10)+'/'+String(f.data).slice(5,7)+'</div></div>';
  });
  h+='</div><div class="aviso">Isto é o que o cliente escreveu quando deu nota 3 ou menos. É a lista mais útil da tela: cada linha aqui é um problema real que aconteceu na cozinha ou na entrega.</div>';
  return h;
}

function pausados(){
  const P=D.pausados||[];
  if(!P.length)return '<div class="c"><div class="vazio">nada fora do ar 🎉</div></div>';
  let h='<div class="c"><div class="rolar"><table><tr><th>Item</th><th>Loja</th><th>Marca</th><th>Onde</th><th>Parado há</th></tr>';
  P.forEach(function(p){
    const d=p.dias;
    h+='<tr><td><b>'+esc(p.item)+'</b></td><td>'+esc(p.unidade)+'</td><td>'+esc(p.marca||'')+'</td>'+
       '<td>'+esc(p.canal||'')+'</td>'+
       '<td>'+(d==null?'—':'<span class="pill '+(d>=7?'p-bad':(d>=2?'p-warn':'p-off'))+'">'+d+' dia'+(d===1?'':'s')+'</span>')+'</td></tr>';
  });
  h+='</table></div><div class="m">Item fora do ar é venda que não acontece. Os vermelhos estão parados há uma semana ou mais — vale conferir se foi de propósito.</div></div>';
  return h;
}

function dinheiro(){
  const d=D.dinheiro;
  if(!d)return '<div class="c"><div class="vazio">sem dado</div></div>';
  let h='<div class="cards">';
  h+=cartao('Perdido em cancelamento', br(d.perdido_cancelamento), delta(d.perdido_cancelamento,d.perdido_antes,false,''));
  h+=cartao('Reembolsado ao cliente', br(d.reembolsado), '<div class="d flat">no período</div>');
  h+=cartao('Salvo por negociar', br(d.salvo_por_negociar), '<div class="d flat">pedidos que iam cancelar e não cancelaram</div>');
  h+='</div>';
  h+='<div class="aviso"><b>Só você vê esta aba.</b> "Salvo por negociar" é o valor dos pedidos em que alguém do time conversou com o cliente e o pedido não foi cancelado — é o trabalho da equipe aparecendo em dinheiro.</div>';
  return h;
}

function pessoas(){
  const P=D.por_pessoa||[];
  if(!P.length)return '<div class="c"><div class="vazio">sem entregador com 10+ entregas no período</div></div>';
  let h='<div class="c"><div class="rolar"><table><tr><th>Entregador</th><th>Entregas</th><th>No prazo</th><th>Atraso médio</th></tr>';
  P.forEach(function(p){
    h+='<tr><td>'+esc(p.entregador)+'</td><td>'+n(p.entregas)+'</td>'+
       '<td>'+(p.pct_prazo==null?'—':p.pct_prazo+'%')+barra(p.pct_prazo)+'</td>'+
       '<td>'+(p.atraso_medio==null?'—':p.atraso_medio+' min')+'</td></tr>';
  });
  h+='</table></div></div>';
  h+='<div class="aviso"><b>Só você vê esta aba, e ela está ordenada por quantidade de entregas — não é uma classificação por desempenho.</b> Atraso quase nunca é culpa de quem entrega: fila na cozinha, chuva e distância pesam mais. Use para começar conversa, nunca para punir. Só aparece quem fez 10 entregas ou mais.</div>';
  return h;
}

function desenha(){
  if(!D){$('app').innerHTML='<div class="load">Carregando…</div>';return}
  let h=filtros();
  if(ABA==='resumo')h+=resumo();
  else if(ABA==='lojas')h+=tabelaLojas();
  else if(ABA==='turnos')h+=tabelaTurnos();
  else if(ABA==='cliente')h+=falas();
  else if(ABA==='pausados')h+=pausados();
  else if(ABA==='dinheiro')h+=dinheiro();
  else if(ABA==='pessoas')h+=pessoas();
  $('app').innerHTML=h;
}

async function boot(){
  $('app').innerHTML='<div class="load">Carregando…</div>';
  try{ D=await puxa(); }
  catch(e){ $('app').innerHTML='<div class="c">Não deu para carregar. '+esc(e.message||'')+'</div>'; return }
  const f=String(D.de).slice(8,10)+'/'+String(D.de).slice(5,7);
  const t=String(D.ate).slice(8,10)+'/'+String(D.ate).slice(5,7);
  $('sub').textContent='Cidadão do Mundo Burgers & Arts · '+f+' a '+t+' · '+
    (D.modo==='dono'?'visão completa':'visão da equipe')+(D.unidade?' · '+D.unidade:'');
  desenha();
}

/* ===== porta unica do portal ===== */
const CDMMODS=['qualidade'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'qualidade'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
