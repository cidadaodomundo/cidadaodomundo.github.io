<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Avaliações do dia · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/cdm-ui.css?v=4">
<style>
/* 12/10/2026 (chat-avaliacoes-do-dia-inicio-12-10), pedido do Fabio: o quadro Avaliacoes do dia da tela Inicio
   tambem na barra lateral (Delivery, Gestao, Sao Braz, Ahu) e dentro da Central Salao, com o Google em destaque.
   O quadro mora em /assets/avaliacoes-dia.js. Endereco: ?loja=av|ahu|sb trava numa loja; ?foco=google poe o Google
   primeiro; ?embed=1 e para dentro de outra tela (sem cabecalho, e avisa a altura para a tela de fora). */
.load{color:var(--muted);padding:40px 10px;text-align:center}
body.avd-embed{padding:0 2px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const PRM=new URLSearchParams(location.search);
const LOJAS={av:'Água Verde',ahu:'Ahú',sb:'São Braz'};
const LOJA=(function(){const v=(PRM.get('loja')||'').toLowerCase();if(LOJAS[v])return LOJAS[v];const n=Object.keys(LOJAS).map(k=>LOJAS[k]);return n.indexOf(PRM.get('loja'))>=0?PRM.get('loja'):''})();
const FOCO=PRM.get('foco')==='google'?'google':'ifood';
const EMBED=PRM.get('embed')==='1';
if(EMBED)document.body.classList.add('avd-embed');

/* mede o CONTEUDO (#app), nunca a janela: a janela e a propria moldura e cresceria sem parar (supervisor, 12/10) */
let ALT=0;
function altura(){
  if(!EMBED)return;
  const h=Math.ceil(document.getElementById('app').getBoundingClientRect().height)+24;
  if(Math.abs(h-ALT)<4)return;
  ALT=h;
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({avdAltura:h},location.origin)}catch(e){}
}
function boot(){
  const app=document.getElementById('app');
  app.innerHTML='<div id="avd" class="avd"></div>';
  AVD.montar(document.getElementById('avd'),{loja:LOJA,foco:FOCO,aoDesenhar:function(){setTimeout(altura,30)},aoVencer:function(){cdmSaia('Sua sessão expirou. Entre de novo.')}});
  /* largura mudou (girar o celular) muda a altura do conteudo; a altura da moldura nao entra na conta */
  let LARG=window.innerWidth;window.addEventListener('resize',function(){if(window.innerWidth!==LARG){LARG=window.innerWidth;altura()}});
}

/* ===== porta unica do portal ===== */
const CDMMODS=['avaliacoes','avaliacoesgestao','avaliacoessb','avaliacoesahu','salao','salaosb'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'avaliacoes'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
</script>
<script src="/assets/avaliacoes-dia.js?v=1"></script>
<script>cdmGuarda().then(function(ok){if(ok)boot()});</script>
<script>/* dentro de outra tela (embed) nao carrega o portal.js: a tela de fora ja tem a caixa de anotacao */
if(!EMBED){const s=document.createElement('script');s.src='/assets/portal.js?v=3';document.body.appendChild(s)}</script>
</body>
</html>
