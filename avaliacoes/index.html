<style>
/* 12/10/2026 (chat-avaliacoes-do-dia-inicio-12-10), pedido do Fabio: o quadro Avaliacoes do dia da tela Inicio
   tambem na barra lateral (Delivery, Gestao, Sao Braz, Ahu) e dentro da Central Salao, com o Google em destaque.
   O quadro mora em /assets/avaliacoes-dia.js. Endereco: ?loja=av|ahu|sb trava numa loja; ?foco=google poe o Google
   primeiro; ?embed=1 e para dentro de outra tela (sem cabecalho, e avisa a altura para a tela de fora). */
.load{color:var(--muted);padding:40px 10px;text-align:center}
body.avd-embed{padding:0 2px}
/* 31/10/2026 (chat-avaliacoes-analise-31-10, obra 165) aba "Analise da comida". Fabio: "quero saber como esta a qualidade da
   nossa comida, quais sao as criticas mais comuns, analise o ifood como ele classifica as avaliacoes". So fora do embed. */
.ana-abas{display:flex;gap:8px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.ana-aba{background:var(--s1);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:10px 16px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
.ana-aba:hover{border-color:#5a5952}
.ana-aba.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ana{max-width:1180px;margin:20px auto 0}
.ana-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;margin-bottom:12px}
.ana-k{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 13px;min-width:0}
.ana-k .lb{color:var(--text2);font-size:12.5px;font-weight:800}
.ana-k .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:36px;line-height:1.05;margin:2px 0}
.ana-k .v small{font-size:15px;color:var(--text2);font-family:'Barlow',sans-serif;font-weight:700}
.ana-k .v3{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--text2);margin:6px 0 4px}
.ana-k .v3 b{font-family:'Barlow Condensed',sans-serif;font-size:26px;color:var(--text);margin-left:3px}
.ana-k .sub{color:var(--muted);font-size:12px;line-height:1.4}
.ana-up{color:#7fe0aa;font-weight:800}.ana-dn{color:#ff9a9a;font-weight:800}
.ana-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.ana-c{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:13px;min-width:0;margin-bottom:12px}
.ana-grid .ana-c{margin-bottom:0}
.ana-c h3{font-size:15px;font-weight:800;margin-bottom:3px}
.ana-c .ex{color:var(--muted);font-size:12.5px;margin-bottom:9px;line-height:1.45}
.ana-b{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(50px,1fr) auto;gap:9px;align-items:center;font-size:13.5px;padding:4px 0}
.ana-b .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ana-b .br{height:12px;background:var(--s2);border-radius:4px;overflow:hidden}
.ana-b .br i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--brand)}
.ana-b.ruim .br i{background:var(--bad)}
.ana-b .q{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ana-b .q small{color:var(--muted);font-weight:600}
.ana-nota{background:var(--s2);border-radius:11px;padding:8px 11px;font-size:13px;line-height:1.45;color:var(--text2);margin-top:9px}
.ana-tm{border-top:1px solid var(--line);padding:8px 0 6px}
.ana-tm:first-of-type{border-top:0}
.ana-tm .fr{color:var(--text);font-size:13.5px;line-height:1.45;font-style:italic;margin-top:3px;overflow-wrap:anywhere}
.ana-tm .mt{color:var(--muted);font-size:12px;font-weight:600;font-style:normal}
.ana-es{letter-spacing:-1px}.ana-es.r{color:#ff7a7a}.ana-es.m{color:#e5be6d}.ana-es.b{color:var(--brand)}
.ana-sem svg{width:100%;height:auto;display:block}
.ana-tab{width:100%;border-collapse:collapse;font-size:13.5px}
.ana-tab th{color:var(--muted);font-size:11.5px;font-weight:800;text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.ana-tab th:first-child,.ana-tab td:first-child{text-align:left}
.ana-tab td{padding:6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.ana-tab tr:last-child td{border-bottom:0}
.ana-tab .of{color:var(--brand);font-weight:800}
.ana-rol{overflow-x:auto}
.ana-cl ol{padding-left:20px;display:grid;gap:7px;font-size:13.5px;line-height:1.5;color:var(--text2)}
.ana-cl b{color:var(--text)}
.ana-rod{color:var(--muted);font-size:11.5px;line-height:1.5;margin:4px 0 20px}
@media(max-width:820px){.ana-grid{grid-template-columns:1fr}.ana-k .v{font-size:30px}}
</style>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const PRM=new URLSearchParams(location.search);
const LOJAS={av:'Água Verde',ahu:'Ahú',sb:'São Braz'};
const LOJA=(function(){const v=(PRM.get('loja')||'').toLowerCase();if(LOJAS[v])return LOJAS[v];const n=Object.keys(LOJAS).map(k=>LOJAS[k]);return n.indexOf(PRM.get('loja'))>=0?PRM.get('loja'):''})();
const FOCO=PRM.get('foco')==='google'?'google':'ifood';
const EMBED=PRM.get('embed')==='1';
if(EMBED)document.body.classList.add('avd-embed');

/* mede o CONTEUDO (#app), nunca a janela: a janela e a propria moldura e cresceria sem parar (supervisor, 12/10) */
let ALT=0;
function altura(){
  if(!EMBED)return;
  const h=Math.ceil(document.getElementById('app').getBoundingClientRect().height)+24;
  if(Math.abs(h-ALT)<4)return;
  ALT=h;
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({avdAltura:h},location.origin)}catch(e){}
}
function boot(){
  const app=document.getElementById('app');
  /* 31/10/2026 (obra 165): fora do embed ganha 2 abas - Avaliacoes do dia (o quadro de sempre) e Analise da comida */
  if(EMBED) app.innerHTML='<div id="avd" class="avd"></div>';
  else{
    app.innerHTML='<div class="ana-abas"><button class="ana-aba" data-aba="dia" onclick="anaAba(\'dia\')">⭐ Avaliações do dia</button>'
      +'<button class="ana-aba" data-aba="ana" onclick="anaAba(\'ana\')">🔎 Análise da comida</button></div>'
      +'<div id="avd" class="avd"></div><div id="ana" class="ana" style="display:none"></div>';
    let ab=PRM.get('aba')==='analise'?'ana':'';
    if(!ab){try{ab=localStorage.getItem('cdm_av_aba')||''}catch(e){ab=''}}
    anaAba(ab==='ana'?'ana':'dia',true);
  }
  AVD.montar(document.getElementById('avd'),{loja:LOJA,foco:FOCO,aoDesenhar:function(){setTimeout(altura,30)},aoVencer:function(){cdmSaia('Sua sessão expirou. Entre de novo.')}});
  /* largura mudou (girar o celular) muda a altura do conteudo; a altura da moldura nao entra na conta */
  let LARG=window.innerWidth;window.addEventListener('resize',function(){if(window.innerWidth!==LARG){LARG=window.innerWidth;altura()}});
}

/* ===== porta unica do portal ===== */
const CDMMODS=['avaliacoes','avaliacoesgestao','avaliacoessb','avaliacoesahu','salao','salaosb'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'avaliacoes'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
</script>
<script src="/assets/avaliacoes-dia.js?v=1"></script>
<script>
/* ===== 31/10/2026 (chat-avaliacoes-analise-31-10, obra 165) ABA "ANALISE DA COMIDA" =====
   Fabio: "quero saber como esta a qualidade da nossa comida, quais sao as criticas mais comuns, analise o ifood como ele
   classifica as avaliacoes e depois vamos transmitir pra tv da cozinha".
   Porta: avaliacoes_analise(p_token, p_dados{dias:7|30|90}) - qualquer usuario logado; sem nome de cliente; dinheiro dos
   comentarios ja vem escondido; nenhum valor em R$. Nenhum timer: o dado do iFood chega 1 dia depois e a nota oficial 2x por dia.
   Todo numero da tela vem da porta (nada escrito a mao). */
const ANA={dias:30, loja:LOJA, D:{}, pedido:0, aberta:false};
function aEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function aNum(v,c){if(v==null||v==='')return '—';const n=Number(v);return isFinite(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:c||0,maximumFractionDigits:c||0}):'—'}
function aEst(n){n=Math.max(0,Math.min(5,Number(n)||0));return '<span class="ana-es '+(n<=2?'r':n===3?'m':'b')+'">'+'★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(5-n)+'</span></span>'}
function aPct(q,t){return t?Math.round(q/t*100):0}
function anaAba(a,primeira){
  const ana=a==='ana';
  document.querySelectorAll('.ana-aba').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-aba')===(ana?'ana':'dia'))});
  const d=document.getElementById('avd'), n=document.getElementById('ana');
  if(d)d.style.display=ana?'none':'';
  if(n)n.style.display=ana?'':'none';
  if(!primeira){try{localStorage.setItem('cdm_av_aba',ana?'ana':'dia')}catch(e){}}
  if(ana&&!ANA.aberta){ANA.aberta=true;anaBusca()}
}
async function anaBusca(){
  const el=document.getElementById('ana'); if(!el) return;
  const d=ANA.dias, meu=++ANA.pedido;
  if(ANA.D[d]){anaDesenha();return}
  el.innerHTML='<div class="load">Calculando a análise…</div>';
  try{
    const r=await fetch(SB+'rpc/avaliacoes_analise',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:cdmTok(),p_dados:{dias:d}})});
    if(meu!==ANA.pedido) return;
    if(!r.ok){let e=null;try{e=await r.json()}catch(_){e=null}
      if(e&&e.code==='28000'){cdmSaia('Sua sessão expirou. Entre de novo.');return}
      throw new Error('http '+r.status)}
    const j=await r.json();
    if(meu!==ANA.pedido) return;
    ANA.D[d]=j; anaDesenha();
  }catch(e){
    if(meu!==ANA.pedido) return;
    el.innerHTML='<div class="avd-aviso">Não deu para buscar a análise agora. <button class="avd-bt" onclick="anaBusca()">Tentar de novo</button></div>';
  }
}
function anaLoja(i){const L=(ANA.D[ANA.dias]&&ANA.D[ANA.dias].lojas)||[];const x=L[i];ANA.loja=(!x||x.loja==='Todas')?'':x.loja;anaDesenha()}
function anaDias(d){if([7,30,90].indexOf(d)<0||d===ANA.dias)return;ANA.dias=d;anaBusca()}
function anaBarras(arr,den,ruim,rotulo){
  const L=Array.isArray(arr)?arr:[]; if(!L.length) return '<div class="ex">Nenhuma no período.</div>';
  const mx=Math.max.apply(null,L.map(function(x){return Number(x.n)||0}).concat([1]));
  return L.map(function(x){const q=Number(x.n)||0, p=aPct(q,den);
    return '<div class="ana-b'+(ruim?' ruim':'')+'" title="'+aEsc(q+' de '+den+' '+rotulo+' marcaram “'+x.tag+'” ('+p+'%)')+'"><span class="nm">'+aEsc(x.tag)+'</span>'
      +'<span class="br"><i style="width:'+(q?Math.max(2,Math.round(q/mx*100)):0)+'%"></i></span><span class="q">'+aNum(q)+' <small>· '+p+'%</small></span></div>'}).join('');
}
/* semana a semana: linha com um ponto por semana (eixo so do minimo ao maximo; e linha, nao barra, por isso pode nao comecar no zero) */
function anaSemanas(S){
  S=(Array.isArray(S)?S:[]).filter(function(s){return s&&s.media!=null}); if(S.length<2) return '<div class="ex">Pouca semana com avaliação para desenhar.</div>';
  const vs=S.map(function(s){return Number(s.media)}), mn=Math.min.apply(null,vs), mxv=Math.max.apply(null,vs), fol=Math.max(.05,(mxv-mn)*.25);
  /* largura do desenho = largura do cartao: no celular a letra continua do tamanho certo (nao encolhe junto) */
  const el=document.getElementById('ana'), W=Math.max(340,Math.min(1100,((el&&el.clientWidth)||760)-28)), estreito=W<560;
  const lo=Math.max(1,mn-fol), hi=Math.min(5,mxv+fol), H=150, x0=estreito?24:46, x1=W-x0, y0=30, y1=H-36;
  const X=function(i){return x0+(S.length===1?0:i*(x1-x0)/(S.length-1))}, Y=function(v){return hi===lo?(y0+y1)/2:y1-(v-lo)/(hi-lo)*(y1-y0)};
  let p='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Média das notas semana a semana"><line x1="'+x0+'" x2="'+x1+'" y1="'+y1+'" y2="'+y1+'" stroke="var(--line)" stroke-width="1"/>';
  p+='<polyline fill="none" stroke="var(--brand)" stroke-width="2" points="'+S.map(function(s,i){return X(i).toFixed(1)+','+Y(Number(s.media)).toFixed(1)}).join(' ')+'"/>';
  S.forEach(function(s,i){const x=X(i).toFixed(1), y=Y(Number(s.media)).toFixed(1);
    p+='<g><title>'+aEsc(s.de+' a '+s.ate+': média '+aNum(s.media,2)+' em '+s.n+' avaliações, '+s.n13+' com nota 1 a 3')+'</title>'
      +'<circle cx="'+x+'" cy="'+y+'" r="14" fill="transparent"/><circle cx="'+x+'" cy="'+y+'" r="5" fill="var(--brand)" stroke="var(--s1)" stroke-width="2"/>'
      +'<text x="'+x+'" y="'+(Number(y)-11)+'" text-anchor="middle" fill="var(--text)" font-size="'+(estreito?12:14)+'" font-weight="700">'+aNum(s.media,2)+'</text>'
      +'<text x="'+x+'" y="'+(H-18)+'" text-anchor="middle" fill="var(--muted)" font-size="'+(estreito?10.5:12)+'">'+aEsc(s.de)+'</text>'
      +'<text x="'+x+'" y="'+(H-4)+'" text-anchor="middle" fill="var(--muted)" font-size="'+(estreito?10:11)+'">'+aEsc(s.n)+(estreito?'':' notas')+'</text></g>'});
  ANA.larg=window.innerWidth;
  return p+'</svg>';
}
/* girou o celular ou mudou muito a janela: redesenha (o grafico depende da largura). Nao busca nada na rede. */
window.addEventListener('resize',function(){if(ANA.aberta&&ANA.D[ANA.dias]&&Math.abs(window.innerWidth-(ANA.larg||0))>80)anaDesenha()});
function anaDesenha(){
  const el=document.getElementById('ana'), J=ANA.D[ANA.dias]; if(!el||!J) return;
  const L=Array.isArray(J.lojas)?J.lojas:[], alvo=ANA.loja||'Todas';
  const G=L.find(function(x){return x.loja===alvo})||L[0];
  const C=J.classifica||{};
  let h='<div class="avd-top"><h2>🔎 Análise da comida'+(LOJA?' · '+aEsc(LOJA):'')+'</h2><span class="sub">iFood · avaliações que chegaram de '+aEsc(J.de)+' a '+aEsc(J.ate)
    +' · comparado com '+aEsc(J.antes_de)+' a '+aEsc(J.antes_ate)+' · robô do iFood leu '+aEsc(J.ultimo_robo||'—')+'</span></div>';
  if(J.atraso_dias==null||Number(J.atraso_dias)>2)
    h+='<div class="avd-aviso">⚠️ A última avaliação que chegou é de '+aEsc(J.ultima||'—')+'. O iFood libera a nota cerca de 1 dia depois do pedido; mais do que isso, o robô pode estar parado e estes números estão velhos.</div>';
  h+='<div class="avd-chips">';
  if(!LOJA){L.forEach(function(x,i){h+='<button class="avd-chip'+(x.loja===alvo?' on':'')+'" onclick="anaLoja('+i+')">'+(x.loja==='Todas'?'🏪 Todas as lojas':aEsc(x.loja))+'</button>'});h+='<span class="avd-sep"></span>'}
  [7,30,90].forEach(function(d){h+='<button class="avd-chip'+(ANA.dias===d?' on':'')+'" onclick="anaDias('+d+')">Últimos '+d+' dias</button>'});
  h+='</div>';
  if(!G||!G.n){el.innerHTML=h+'<div class="avd-aviso">Nenhuma avaliação do iFood chegou neste período.</div>';return}
  const A=G.antes||{}, E=G.estrelas||{}, n14=(Number(G.n13)||0)+(Number(G.n4)||0), n5=Number(E['5'])||0, OF=Array.isArray(G.oficial)?G.oficial:[];
  /* --- numeros grandes --- */
  let kOf;
  if(G.loja==='Todas') kOf='<div class="lb">Nota que o iFood mostra</div><div class="v3">'+(OF.length?OF.map(function(o){return '<span>'+aEsc(String(o.marca).replace('Burger · ',''))+'<b>'+aNum(o.score,1)+'</b></span>'}).join(''):'<span>—</span>')+'</div><div class="sub">marca Burger de cada loja'+(OF[0]?' · lida '+aEsc(OF[0].lido):' · ainda sem leitura')+'</div>';
  else{const o=OF[0];kOf='<div class="lb">Nota que o iFood mostra</div><div class="v">'+(o?aNum(o.score,1):'—')+'</div><div class="sub">'+(o?aEsc(o.marca)+' · '+aNum(o.validas)+' avaliações contam · lida '+aEsc(o.lido):'ainda sem leitura')+'</div>'}
  let dl='', md=Number(G.media), ma=A.media==null?null:Number(A.media);
  if(ma!=null&&isFinite(md)){const dd=Math.round((md-ma)*100)/100; dl=dd>0?'<span class="ana-up">▲ +'+aNum(dd,2)+'</span>':dd<0?'<span class="ana-dn">▼ '+aNum(dd,2)+'</span>':'<span>= igual</span>'}
  h+='<div class="ana-kpis"><div class="ana-k">'+kOf+'</div>'
    +'<div class="ana-k"><div class="lb">Média das notas no período</div><div class="v">'+aNum(G.media,2)+'</div><div class="sub">'+aNum(G.n)+' avaliações · '+(dl?dl+' vs '+aNum(A.media,2)+' antes':'sem período anterior')+'</div></div>'
    +'<div class="ana-k"><div class="lb">Deram 5 estrelas</div><div class="v">'+aNum(G.pct5,1)+'<small> %</small></div><div class="sub">antes: '+aNum(A.pct5,1)+'%</div></div>'
    +'<div class="ana-k"><div class="lb">Notas 1 a 3</div><div class="v">'+aNum(G.n13)+'</div><div class="sub">de '+aNum(G.n)+' · antes: '+aNum(A.n13)+' de '+aNum(A.n)+'</div></div>'
    +'<div class="ana-k"><div class="lb">Reclamaram do preparo</div><div class="v">'+aPct(Number(G.preparo)||0,Number(G.n)||0)+'<small> em cada 100</small></div><div class="sub">'+aNum(G.preparo)+' avaliações marcaram sabor, tempero, ponto, ingredientes, aparência ou quantidade</div></div></div>';
  /* --- semana a semana --- */
  h+='<div class="ana-c ana-sem"><h3>📈 Média das notas, semana a semana</h3><div class="ex">Blocos de 7 dias terminando em '+aEsc(J.ate)+' (as últimas 8 semanas, qualquer período escolhido). Passe o dedo ou o mouse num ponto para ver os detalhes.</div>'+anaSemanas(G.semanas)+'</div>';
  /* --- elogios x criticas --- */
  let fr='';
  if(Number(G.frio)>0) fr='<div class="ana-nota">🌡️ <b>Temperatura</b> (comida fria) foi marcada em '+aNum(G.frio)+' avaliações. Dos '+aNum(G.frio_coment)+' clientes que marcaram e escreveram alguma coisa, '+aNum(G.frio_atraso)+' falaram de atraso ou demora'+(Number(G.frio_atraso)>0?': nesses casos o frio pode ter vindo da entrega, não da cozinha.':'.')+'</div>';
  h+='<div class="ana-grid"><div class="ana-c"><h3>👍 O que o cliente elogia</h3><div class="ex">Etiquetas que o cliente marca quando dá 5 estrelas ('+aNum(n5)+' avaliações). A % é sobre essas '+aNum(n5)+'.</div>'+anaBarras(G.elogios,n5,false,'avaliações de 5 estrelas')+'</div>'
    +'<div class="ana-c"><h3>👎 O que o cliente marcou para melhorar</h3><div class="ex">Etiquetas que o cliente marca quando dá 1 a 4 estrelas ('+aNum(n14)+' avaliações). A % é sobre essas '+aNum(n14)+'.</div>'+anaBarras(G.criticas,n14,true,'avaliações de 1 a 4 estrelas')+fr+'</div></div>';
  /* --- temas escritos --- */
  const T=Array.isArray(G.temas)?G.temas:[], mt=Math.max.apply(null,T.map(function(t){return Number(t.n)||0}).concat([1]));
  h+='<div class="ana-c"><h3>✍️ O que o cliente escreveu (notas 1 a 3)</h3><div class="ex">Li os '+aNum(G.n13_coment)+' comentários de nota 1 a 3 e separei por assunto, pelas palavras usadas. Um comentário pode cair em mais de um assunto. Embaixo de cada um, o comentário mais recente daquele assunto.</div>';
  h+=T.length?T.map(function(t){const q=Number(t.n)||0;
    return '<div class="ana-tm"><div class="ana-b ruim" title="'+aEsc(q+' comentários')+'"><span class="nm">'+aEsc(t.tema)+'</span><span class="br"><i style="width:'+Math.max(2,Math.round(q/mt*100))+'%"></i></span><span class="q">'+aNum(q)+'</span></div>'
      +(t.exemplo?'<div class="fr">“'+aEsc(t.exemplo)+'” <span class="mt">'+aEst(t.nota)+' · '+aEsc(t.marca)+(G.loja==='Todas'?' · '+aEsc(t.loja):'')+' · '+aEsc(t.dia)+'</span></div>':'')+'</div>'}).join(''):'<div class="ex">Nenhum comentário de nota 1 a 3 no período. 👏</div>';
  h+='</div>';
  /* --- tabela por marca / por loja --- */
  if(G.loja==='Todas'){
    const LL=L.filter(function(x){return x.loja!=='Todas'});
    h+='<div class="ana-c"><h3>🏪 Lojas lado a lado</h3><div class="ana-rol"><table class="ana-tab"><tr><th>Loja</th><th>Avaliações</th><th>Média</th><th>5 estrelas</th><th>Notas 1 a 3</th><th>Antes</th><th>Nota do iFood (Burger)</th></tr>'
      +LL.map(function(x){const o=(x.oficial||[])[0];return '<tr><td>'+aEsc(x.loja)+'</td><td>'+aNum(x.n)+'</td><td>'+aNum(x.media,2)+'</td><td>'+aNum(x.pct5,1)+'%</td><td>'+aNum(x.n13)+'</td><td>'+aNum(x.antes&&x.antes.media,2)+'</td><td class="of">'+(o?aNum(o.score,1):'—')+'</td></tr>'}).join('')+'</table></div></div>';
  }else{
    const M=Array.isArray(G.marcas)?G.marcas:[], ofm={}; OF.forEach(function(o){ofm[o.marca]=o});
    h+='<div class="ana-c"><h3>🏷 Por marca</h3><div class="ex">"Contam" e "total" vêm do próprio iFood; "chegaram em 90 dias" e "média simples" são a nossa conta com as avaliações gravadas.</div><div class="ana-rol"><table class="ana-tab"><tr><th>Marca</th><th>Avaliações no período</th><th>Média</th><th>Notas 1 a 3</th><th>Nota do iFood</th><th>Contam</th><th>Total histórico</th><th>Chegaram em 90 dias</th><th>Média simples 90 dias</th></tr>'
      +M.map(function(m){const o=ofm[m.marca];return '<tr><td>'+aEsc(m.marca)+'</td><td>'+aNum(m.n)+'</td><td>'+aNum(m.media,2)+'</td><td>'+aNum(m.n13)+'</td><td class="of">'+(o?aNum(o.score,1):'—')+'</td><td>'+(o?aNum(o.validas):'—')+'</td><td>'+(o?aNum(o.total):'—')+'</td><td>'+(o?aNum(o.n90):'—')+'</td><td>'+(o?aNum(o.media90,2):'—')+'</td></tr>'}).join('')+'</table></div></div>';
  }
  /* --- como o iFood classifica (numeros das 3 lojas no periodo) --- */
  const o0=OF[0];
  h+='<div class="ana-c ana-cl"><h3>📖 Como o iFood classifica as avaliações</h3><div class="ex">Medido nas avaliações das 3 lojas que chegaram de '+aEsc(J.de)+' a '+aEsc(J.ate)+' ('+aNum(C.n)+' avaliações).</div><ol>'
    +'<li><b>O cliente dá de 1 a 5 estrelas e marca etiquetas.</b> As etiquetas falam da <b>comida e da embalagem</b>; não existe etiqueta de entrega ou de motoboy. Quando o pedido atrasa, o cliente costuma marcar <b>Temperatura</b>.</li>'
    +'<li><b>5 estrelas → só elogios.</b> '+aNum(C.n5_elogio)+' de '+aNum(C.n5)+' avaliações de 5 estrelas marcaram elogio'+(Number(C.n5_melhorar)?' e '+aNum(C.n5_melhorar)+' marcaram crítica':' e nenhuma marcou crítica')+'.</li>'
    +'<li><b>1 a 4 estrelas → só "o que melhorar".</b> '+aNum(C.n14_melhorar)+' de '+aNum(C.n14)+'. 🔴 <b>Para o iFood, 4 estrelas já é crítica:</b> '+aNum(C.n4_melhorar)+' de '+aNum(C.n4)+' avaliações de 4 estrelas vieram com algo para melhorar.</li>'
    +'<li><b>Comentário escrito:</b> nota 1 a 3 → '+aNum(C.n13_coment)+' de '+aNum(C.n13)+' · 4 estrelas → '+aNum(C.n4_coment)+' de '+aNum(C.n4)+' · 5 estrelas → '+aNum(C.n5_coment)+' de '+aNum(C.n5)+'.</li>'
    +'<li><b>Avaliação descartada pelo iFood não conta na nota.</b> No período: '+aNum(C.descartadas)+'.</li>'
    +'<li><b>A nota que o iFood mostra conta só as avaliações recentes, não o histórico.</b>'+(o0?' Ex.: '+aEsc(G.loja==='Todas'?o0.marca:o0.marca+' · '+G.loja)+' tem '+aNum(o0.total)+' avaliações na história e só '+aNum(o0.validas)+' contam — perto das '+aNum(o0.n90)+' que chegaram nos últimos 90 dias.':'')
    +' <b>Mas a nota não é a média simples</b> dessas avaliações: o iFood faz uma conta própria e não divulga qual é. Compare "Nota do iFood" com "Média simples 90 dias" na tabela'+(G.loja==='Todas'?' de cada loja':'')+'.</li></ol></div>';
  /* --- ultimos comentarios --- */
  const F=Array.isArray(G.frases)?G.frases:[];
  if(F.length) h+='<div class="ana-c"><h3>💬 Últimos comentários de nota 1 a 3</h3>'+F.map(function(f){
    return '<div class="ana-tm"><div class="mt">'+aEst(f.nota)+' · '+aEsc(f.marca)+(G.loja==='Todas'?' · '+aEsc(f.loja):'')+' · chegou '+aEsc(f.dia)+((f.tags||[]).length?' · marcou: '+aEsc(f.tags.join(', ')):'')+'</div><div class="fr">“'+aEsc(f.texto)+'”</div></div>'}).join('')+'</div>';
  h+='<div class="ana-rod">Fonte: avaliações do iFood pela API oficial (robô de 10 em 10 min) e nota que o iFood mostra (robô às 6h50 e 18h50). Boqueirão fica de fora, como no quadro do dia. Conta calculada '+aEsc(J.calculado||'—')+' e guardada por 30 min.</div>';
  el.innerHTML=h;
}
</script>
