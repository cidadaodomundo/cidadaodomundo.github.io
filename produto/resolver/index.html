<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../config.js" data-demo="telas/resolver.js telas/pagamento.js"></script>
<script src="../assets/chaves.js?v=1"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F47B3C">
<title>Resolver hoje · Portal de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Figtree:wght@400;500;600;700&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/pdg-ui.css?v=4">
<style>
/* Quadros com numero no topo; tocar num quadro abre a lista dele logo embaixo. */
.per{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.per .chip{padding:7px 13px}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
button.b:hover{border-color:var(--text2)}
.c{display:block;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.c:hover{border-color:var(--line)}
.c .vazio{padding:16px 0;font-size:14px}
.m{color:var(--muted);font-size:12px;margin-top:3px}
.load{color:var(--muted);padding:40px 10px;text-align:center}
.cards{display:grid;grid-auto-flow:row dense;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cards>*{min-width:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 15px;color:var(--text);display:flex;flex-direction:column;gap:3px;transition:border-color .15s,transform .08s}
.card[onclick]{cursor:pointer}
.card[onclick]:hover{border-color:#5a5952}
.card[onclick]:active{transform:scale(.98)}
.card .t{font-size:13px;font-weight:800;color:var(--text2);line-height:1.3}
.card .v{font-family:'Oswald',Impact,sans-serif;font-weight:400;font-size:42px;line-height:1.05;margin:0}
.card .qs{color:var(--muted);font-size:12px;font-weight:700;line-height:1.35}
.card.mal{border-left:4px solid var(--bad)}
.card.mal .v{color:#ff8a8a}
.card.aviso{border-left:4px solid var(--warn)}
.card.aviso .v{color:var(--warn)}
.card.bem .v{color:#7fe0aa}
.card.sd{border-style:dashed}
.card.sd .v{color:var(--muted)}
.card.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.lojas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.lojas .rot,.per .rot{color:var(--muted);font-size:12px;font-weight:800;margin-right:2px}
.lojas .chip{padding:7px 13px}
.painel{margin-top:14px}
.painel .ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.painel .ph h3{font-family:'Oswald',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:19px;letter-spacing:.02em}
.painel .ph .ct{color:var(--muted);font-size:13px;font-weight:600}
.painel .ph .fecha{margin-left:auto}
.nota{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.5}
.pz{width:100%;border-collapse:collapse;font-size:12.5px}.pz th{text-align:left;color:var(--muted);font-size:10.5px;font-weight:800;padding:4px 6px;border-bottom:1px solid var(--line)}.pz td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;padding:0 8px 8px 0}
td{padding:9px 8px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.mini{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:700}
.mini:hover{border-color:var(--text2)}
.feito{color:#7fe0aa;font-weight:700}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card .v{font-size:34px}.per{width:100%}}
/* cartoes das listas */
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.vv-lista{display:grid;gap:10px}
table.vv{background:var(--s1);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:12px;border-collapse:separate;border-spacing:0}
table.vv.ok{border-left-color:var(--ok)}
table.vv td{border-top:0;padding:12px 14px;vertical-align:top}
table.vv td.hrc{width:72px;padding-right:0}
table.vv td.sit{width:250px}
.vv .hr{font-family:'Roboto Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.vv .ha{color:var(--muted);font-size:11.5px;margin-top:3px}
.vv .tt{font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vv .lj{color:var(--text2);font-size:13px;margin-top:2px}
.vv .ds{margin-top:6px;font-size:14px;color:var(--text);font-style:italic}
.vv .it{margin-top:3px;font-size:12.5px;color:var(--text2)}
.vv .rs{margin-top:6px;font-size:12px;color:var(--muted)}
.vv .fn{margin-top:2px;font-size:11px;color:var(--muted)}
.vv .vbt{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-off{background:rgba(138,137,126,.15);color:var(--muted)}
div.vv{background:var(--s1);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px}
div.vv.grave{border-color:var(--bad);background:#2a1716}
div.vv.c-ok{border-left-color:var(--ok)}div.vv.c-warn{border-left-color:var(--warn)}div.vv.c-bad{border-left-color:var(--bad)}
.vv .fala{margin-top:6px;font-size:16px;font-weight:700;color:var(--text);line-height:1.35}
.vv .fala,.vv .lj,.vv .it,.vv .rs,.vv .fn{overflow-wrap:anywhere}
table.vv.pzv{border-left-color:var(--warn)}
@media (max-width:640px){div.vv{grid-template-columns:56px minmax(0,1fr);gap:8px;padding:12px 10px}table.vv,table.vv tbody{display:block}table.vv tr{display:grid;grid-template-columns:64px minmax(0,1fr)}table.vv td{padding:12px 10px}table.vv td.hrc{padding-right:0}.vv .hr{font-size:21px}table.vv td.sit{grid-column:1/-1;width:auto;padding-top:0}table.vv td.hrc{width:auto}}
</style>
</head>
<body>

<div class="wrap">
<div class="top">
  <div>
    <h1>🔥 Resolver hoje</h1>
    <div class="placar" id="placar"><span class="pl">carregando…</span></div>
  </div>
  <div class="rt per" id="per"></div>
</div>

<div id="app"><div class="load">Carregando…</div></div>
<div id="pagBox" class="painel" style="display:none"><div class="ph"><h3>💵 Quanto pagar a cada motoboy</h3><button class="b fecha" onclick="fechaTudo()">fechar ✕</button></div><div id="pagIfr"></div></div>
</div>

<script>
const SB=PORTAL_CFG.rest;
const KEY=PORTAL_CFG.chave;
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tok=()=>{try{return sessionStorage.getItem('pdg_token')||''}catch(e){return ''}};
let D=null, DIAS=1, ONT=false, UNI='', VER='abertas', TIPO='';

async function porta(nome,dados){
  const r=await fetch(SB+'rpc/'+nome,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_dados:dados||{}})});
  if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('porta '+r.status))}
  return await r.json();
}

function rotulo(t){
  if(t==='chat')return '💬 Cliente sem resposta';
  if(t==='reentrega')return '🔁 Reentrega';
  if(t==='negociacao')return '🤝 Negociação do iFood';
  if(t==='cancelamento')return '🚫 Pedido cancelado inteiro';
  if(t==='parcial')return '✂️ Item cancelado no pedido';
  if(t==='maquininha')return '🧾 Maquininha';
  return t;
}

async function verFotos(i){
  const l=(D&&D.itens&&D.itens[i]); if(!l)return;
  let cx=document.getElementById('__fotos');
  if(!cx){ cx=document.createElement('div'); cx.id='__fotos'; document.body.appendChild(cx); }
  cx.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;overflow:auto;padding:16px;text-align:center';
  cx.innerHTML='<div style="color:#fff;margin-bottom:10px">Buscando as fotos do pedido '+esc(l.referencia||'')+'…</div>';
  cx.onclick=function(){ cx.remove(); };
  try{
    const r=await fetch(PORTAL_CFG.funcoes+'guardar-foto-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'ver',token_portal:tok(),pedido_curto:l.referencia})});
    const j=await r.json();
    if(!j.ok||!j.fotos||!j.fotos.length){ cx.innerHTML='<div style="color:#fff">Não achei foto guardada deste pedido.<div style="color:#bbb;font-size:12px;margin-top:6px">Toque para fechar.</div></div>'; return; }
    cx.innerHTML='<div style="color:#fff;margin-bottom:10px">📷 O que o cliente mandou no pedido '+esc(l.referencia||'')+' — toque em qualquer lugar para fechar</div>'+
      j.fotos.map(function(f){ return '<img src="'+f.link+'" style="max-width:96%;max-height:80vh;margin:8px auto;display:block;border-radius:8px">'; }).join('');
  }catch(e){ cx.innerHTML='<div style="color:#fff">Não deu para buscar as fotos. Toque para fechar.</div>'; }
}

/* fotos do Errado no pedido: pede pelo codigo interno do pedido no iFood (uuid), que nao se repete entre lojas e dias;
   sem ele, vai pelo numero curto + loja + dia. */
async function verFotosEsq(i){
  const e=(D&&D.esquecidos&&D.esquecidos[i]); if(!e)return;
  let cx=document.getElementById('__fotos');
  if(!cx){ cx=document.createElement('div'); cx.id='__fotos'; document.body.appendChild(cx); }
  cx.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;overflow:auto;padding:16px;text-align:center';
  cx.innerHTML='<div style="color:#fff;margin-bottom:10px">Buscando as fotos do pedido '+esc(e.pedido||'')+'…</div>';
  cx.onclick=function(){ cx.remove(); };
  try{
    const r=await fetch(PORTAL_CFG.funcoes+'guardar-foto-chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({acao:'ver',token_portal:tok(),uuid_pedido:e.uuid||'',pedido_curto:e.pedido||'',unidade:e.unidade||'',dia:e.dia||''})});
    const j=await r.json();
    if(!j.ok||!j.fotos||!j.fotos.length){ cx.innerHTML='<div style="color:#fff">Não achei foto guardada deste pedido.<div style="color:#bbb;font-size:12px;margin-top:6px">Toque para fechar.</div></div>'; return; }
    cx.innerHTML='<div style="color:#fff;margin-bottom:10px">📷 O que o cliente mandou no pedido '+esc(e.pedido||'')+' · '+esc(e.unidade||'')+' — toque em qualquer lugar para fechar</div>'+
      j.fotos.map(function(f){ return '<img src="'+esc(f.link)+'" style="max-width:96%;max-height:80vh;margin:8px auto;display:block;border-radius:8px">'; }).join('');
  }catch(err){ cx.innerHTML='<div style="color:#fff">Não deu para buscar as fotos. Toque para fechar.</div>'; }
}

var MOT_REE=['Faltou item na sacola','Endereco errado','Cliente pediu de novo','Pedido sumiu no sistema','Saiu junto, sem corrida a mais','Cozinha refez o pedido'];
var MOT_GER=['Resolvido com o cliente','Ja estava certo','Nao era problema nosso','Combinado com a equipe'];

var FAM='TODOS';
var ESQ=false, PAG=false;
function soUm(q){
  var era={ESQ:ESQ,PAU:PAU,CHG:CHG,DUPO:DUPO,FDA:FDA,PZ:PZ,PAG:PAG}[q];
  ESQ=false;PAU=false;CHG=false;DUPO=false;FDA=false;PZ=false;PAG=false;TIPO='';
  if(q==='ESQ')ESQ=!era; if(q==='PAU')PAU=!era; if(q==='CHG')CHG=!era; if(q==='DUPO')DUPO=!era; if(q==='FDA')FDA=!era; if(q==='PZ')PZ=!era; if(q==='PAG')PAG=!era;
  desenha(); rolaPainel();
}
function rolaPainel(){ var p=document.getElementById('painel'); if(p&&p.scrollIntoView) p.scrollIntoView({behavior:'smooth',block:'nearest'}); }
function fechaTudo(){ ESQ=false;PAU=false;CHG=false;DUPO=false;FDA=false;PZ=false;PAG=false;TIPO=''; desenha(); }
var TIT_Q={PAG:'💵 Quanto pagar a cada motoboy',ESQ:'🛍️ Errado no pedido',PAU:'⏸️ Parou de vender',FDA:'📵 Fora do ar no delivery',CHG:'🛵 Chegada não sinalizada',DUPO:'🚘 Corrida em dobro',PZ:'⏸️ Cardápio pausado'};
function painelQ(q,corpo){
  if(!corpo) return '';
  return '<div class="painel" id="painel"><div class="ph"><h3>'+TIT_Q[q]+'</h3><button class="b fecha" onclick="fechaTudo()">fechar ✕</button></div>'+corpo+'</div>';
}
/* na primeira abertura, ja abre o primeiro quadro com problema */
var PRIMEIRA=true;
function abrePrimeiro(){
  if(!PRIMEIRA||!D) return; PRIMEIRA=false;
  if(TIPO||ESQ||PAU||CHG||DUPO||FDA||PZ||PAG) return;
  var es=D.esquecidos||[], it=D.itens||[];
  if(es.some(function(e){return e.pendente})){ ESQ=true; return; }
  var ord=['reentrega','cancelamento','parcial','chat','maquininha','negociacao'];
  for(var k=0;k<ord.length;k++){ if(it.some(function(x){return x.tipo===ord[k]&&!x.resolvido})){ TIPO=ord[k]; VER='abertas'; return; } }
}
var PAU=false;
var FDA=false;
var CHG=false;

/* Reentrega, Chegada nao sinalizada e Corrida em dobro dependem do TrackEat. Se a integracao parou, o cartao
   fica cinza e diz desde quando (fonte: fato_frescor, lido 1x por abertura) em vez de mostrar 0. */
var FR=null;
async function frPega(){
  try{
    var r=await fetch(SB+'fato_frescor?select=fonte,ultimo_dia,farol&fonte=eq.delivery_entrega',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    if(r.ok){var o={};(await r.json()).forEach(function(x){o[x.fonte]=x;});FR=o;}
  }catch(e){}
}
function frParado(f){var x=FR&&FR[f];if(!x||x.farol!=='PARADO'||!x.ultimo_dia)return null;var p=String(x.ultimo_dia).split('-');return p[2]+'/'+p[1];}
function cardSemDado(rot, ic){
  var q=frParado('delivery_entrega');
  if(!q) return null;
  return '<div class="card sd" title="Sem dado: a integração com o TrackEat pode ter parado"><div class="t">'+(ic?ic+' ':'')+rot+'</div>'+
    '<div class="v">—</div><div class="qs">TrackEat sem dado desde '+q+'</div></div>';
}
function cardF0(rot, ic){
  return '<div class="card bem"><div class="t">'+(ic?ic+' ':'')+rot+'</div><div class="v">0</div></div>';
}

function cardCheg(){
  var cs=((D&&D.chegada)||{}).linhas||[];
  if(!cs.length) return cardSemDado('Chegada não sinalizada','&#128757;')||cardF0('Chegada não sinalizada','&#128757;');
  return '<div class="card mal'+(CHG?' on':'')+'" onclick="soUm(&quot;CHG&quot;)" title="Clique para abrir ou fechar">'+
    '<div class="t">&#128757; Chegada não sinalizada</div>'+
    '<div class="v">'+cs.length+'</div></div>';
}

function chegada(){
  var C=(D&&D.chegada)||{}, cs=C.linhas||[];
  if(!cs.length || !CHG) return '';
  return '<div style="border:1px solid var(--line);border-left:4px solid var(--bad);background:var(--s1);border-radius:16px;padding:12px 14px;margin:0">'+
    '<div style="color:var(--bad);font-size:11px;font-weight:800;margin-bottom:7px">A EQUIPE NÃO SINALIZOU A CHEGADA DO ENTREGADOR</div>'+
    '<div style="max-height:150px;overflow:auto">'+cs.map(function(c){
      return '<div style="padding:3px 0;font-size:12px;line-height:1.35">'+
        '<span style="color:var(--muted)">'+esc(c.diac||'')+' '+esc(c.hora||'')+' &#183; '+esc(c.unidade||'')+'</span> '+
        '<b>'+esc(c.quem||'')+'</b> <span style="color:var(--muted)">(quem viu foi o '+esc(c.fonte||'')+')</span></div>';
    }).join('')+'</div>'+
    '<div class="m" style="margin-top:7px">O entregador chegou e ninguém marcou a chegada na tela. Dia '+esc(C.dia||'')+', conferido em '+esc(C.em||'')+'.</div></div>';
}

var DUPO=false;
function cardDup(){
  var d=(D&&D.dupla)||{}, n=d.abertos||0;
  if(!n) return cardSemDado('Corrida em dobro','&#128664;')||cardF0('Corrida em dobro','&#128664;');
  return '<div class="card mal'+(DUPO?' on':'')+'" onclick="soUm(&quot;DUPO&quot;)" title="Corrida em dobro: clique para abrir ou fechar">'+
    '<div class="t">&#128664; Corrida em dobro</div>'+
    '<div class="v">'+n+'</div><div class="qs">abertos desde '+esc(d.desde||'—')+'</div></div>';
}
function duplaPainel(){
  var d=(D&&D.dupla)||{};
  if(!DUPO || !(d.abertos>0)) return '';
  var topo='<div style="color:var(--bad);font-size:11px;font-weight:800;margin-bottom:7px">CORRIDA EM DOBRO — A MESMA ENTREGA PODE TER SIDO PAGA DUAS VEZES</div>'+
    '<div class="m" style="margin-bottom:8px">'+d.abertos+' sem decisão desde '+(d.desde||'')+' ("pagar uma só" e "conferir na mão"; antes disso não entra) · '+(d.da_para_barrar||0)+' deles ainda pendentes no TrackEat'+(window.PDG_FOODY===false?'':' ou do Foody')+'. Pedido cancelado e corrida já reprovada no TrackEat não aparecem aqui.</div>';
  if(!d.pode_decidir) return '<div style="border:1px solid var(--line);border-left:4px solid var(--bad);background:var(--s1);border-radius:16px;padding:12px 14px;margin:0">'+topo+
    '<div class="m">Quem decide é o dono ou o escritório, na tela Pagar Motoboys.</div></div>';
  return '<div style="border:1px solid var(--line);border-left:4px solid var(--bad);background:var(--s1);border-radius:16px;padding:12px 14px;margin:0">'+topo+
    '<iframe src="'+PORTAL_CFG.url('pagamento/?aba=dup&embed=1&cb='+Date.now())+'" style="width:100%;height:75vh;min-height:560px;border:0;border-radius:9px;background:var(--s0)" title="Corrida em dobro"></iframe></div>';
}

/* 💵 Quanto pagar — a tela de pagamento dos motoboys aberta aqui dentro (abre no dia de ontem) */
// dia operacional de ontem (Brasília, o dia vira às 5h), como dd/mm
function ontemOp(){var t=new Date(Date.now()-8*3600e3-864e5).toISOString();return t.slice(8,10)+'/'+t.slice(5,7)}
function cardPag(){
  return '<div class="card'+(PAG?' on':'')+'" onclick="soUm(&quot;PAG&quot;)" title="Quanto pagar a cada motoboy: clique para abrir ou fechar">'+
    '<div class="t">💵 Quanto pagar</div><div class="v" style="color:var(--brand)">'+ontemOp()+'</div><div class="qs">ver quanto pagar de ontem a cada motoboy</div></div>';
}
/* a aba fica fora do #app: o desenha() refaz o #app inteiro e, se o iframe estivesse la dentro, recarregaria a cada vez */
var PAG_UNI=null;
function pagSync(){
  var bx=document.getElementById('pagBox'), fr=document.getElementById('pagIfr'); if(!bx||!fr) return;
  if(!PAG){ if(bx.style.display!=='none'){ bx.style.display='none'; fr.innerHTML=''; PAG_UNI=null; } return; }
  bx.style.display='';
  if(PAG_UNI!==UNI || !fr.firstChild){
    PAG_UNI=UNI;
    fr.innerHTML='<iframe src="'+PORTAL_CFG.url('pagamento/?aba=pagar&embed=1&loja='+encodeURIComponent(lojaIdDe(UNI))+'&cb='+Date.now())+'" style="width:100%;height:82vh;min-height:620px;border:0;border-radius:9px;background:var(--s0)" title="Quanto pagar a cada motoboy"></iframe>';
    if(bx.scrollIntoView) bx.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

function cardEsq(){
  var es=(D&&D.esquecidos)||[];
  if(!es.length) return cardF0('Errado no pedido','&#128717;&#65039;');
  var pend=es.filter(function(e){ return e.pendente }).length;
  return '<div class="card mal'+(ESQ?' on':'')+'" onclick="soUm(&quot;ESQ&quot;)" title="Clique para abrir ou fechar">'+
    '<div class="t">&#128717;&#65039; Errado no pedido</div>'+
    '<div class="v">'+es.length+'</div>'+
    (pend
      ? '<div class="qs" style="color:#ff9a9a">'+pend+' sem solução</div>'
      : '<div class="qs" style="color:#7fe0aa">todos com solução</div>')+
    '</div>';
}

function esquecidos(){
  var es=(D&&D.esquecidos)||[];
  if(!es.length || !ESQ) return '';
  var fams=[['TODOS','Todos','var(--text)'],['PEND','🔴 Sem solução','var(--bad)'],['FOTO','📷 Com foto','var(--text)'],['BEBIDA','🥤 Bebida','var(--bad)'],['SOBREMESA','🍰 Sobremesa','var(--warn)'],['COMIDA','🍔 Comida','var(--text2)'],['NAO DEU PARA SABER','❓ Não deu','var(--muted)']];
  var conta={TODOS:es.length,PEND:0,FOTO:0};
  es.forEach(function(e){ conta[e.familia]=(conta[e.familia]||0)+1; if(e.pendente) conta.PEND++; if(e.fotos>0) conta.FOTO++ });
  var lista=es.filter(function(e){ return FAM==='TODOS' || (FAM==='PEND' ? e.pendente : FAM==='FOTO' ? e.fotos>0 : e.familia===FAM) });

    (lista.length
      ? '<div class="vv-lista">'+lista.map(function(e){
          var i=es.indexOf(e), api=e.origem==='api';

          var cor=e.cor==='ok'?' c-ok':e.cor==='warn'?' c-warn':' c-bad';
          var item=(e.item && (e.disse||'').indexOf(e.item)<0) ? e.item : '';
          var nf=e.fotos||0, falta=(e.fotos_api||0)-nf;
          return '<div class="vv'+cor+(e.grave?' grave':'')+'">'+
            '<div><div class="hr">'+esc(String(e.quando||'').slice(6)||'—')+'</div><div class="ha">'+esc(haQuando(e.quando))+'</div></div><div>'+
            '<div class="tt">'+esc(fam)+' <span class="pill p-off">'+esc(e.tipo||'Reclamação')+'</span>'+
              (e.grave?' <span class="pill p-bad">🚨 estragado ou corpo estranho</span>':'')+
              /* cliente so falou da entrega: continua na lista (a loja ainda responde no iFood), so ganha o selo */
              (e.entrega?' <span class="pill p-warn" title="O cliente só falou do entregador, do endereço ou da entrega, não da comida. Continua aqui porque é reclamação oficial no iFood.">🛵 parece problema de entrega, não da cozinha</span>':'')+'</div>'+
            '<div class="fala">'+(e.disse?'“'+esc(e.disse)+'”':'(o cliente não escreveu nada)')+'</div>'+
            (e.chat?'<div class="ds">Também chegou pelo chat do iFood: “'+esc(e.chat)+'”</div>':'')+
            '<div class="lj"><b>'+esc(e.unidade||'')+'</b>'+(e.pedido&&e.pedido!=='sem nº'?' · pedido <b>'+esc(e.pedido)+'</b>':' · sem nº de pedido')+(e.marca?' · '+esc(e.marca):'')+'</div>'+
            (item?'<div class="it">'+(api?'Item que o iFood registrou na reclamação: ':'Item no iFood: ')+esc(item)+
              (e.item_aviso?' <span class="pill p-warn">não bate com o que o cliente escreveu — em combo o iFood às vezes registra o prato; vale a fala do cliente</span>':'')+'</div>':'')+
            '<div class="rs">'+(e.pendente?'<span class="pill p-bad">sem solução registrada</span> ':'')+'Como ficou: '+esc(e.resolveu||'—')+'</div>'+
            ((nf>0||falta>0)?'<div class="vbt">'+
              (nf>0?'<button class="mini" onclick="verFotosEsq('+i+')">📷 Ver '+(nf>1?'as '+nf+' fotos':'a foto')+' do cliente</button>':'')+
              (falta>0?'<span class="pill p-off">'+falta+(falta>1?' fotos ainda chegando':' foto ainda chegando')+'</span>':'')+
            '</div>':'')+
            '<div class="fn">Fonte: '+esc(e.fontes||'—')+'</div>'+
          '</div></div>';
        }).join('')+'</div>'
      : '<div style="color:var(--muted);font-size:12px">Nenhum caso deste tipo no período.</div>')+
    '<div style="color:var(--muted);font-size:11px;margin-top:6px">Primeiro vale a reclamação oficial do iFood: o que o cliente escreveu, o item que ele marcou, as fotos e o que aconteceu. O que não passou por ela vem do chat do iFood e do Gestor Web. Cada pedido aparece uma vez só.</div>'+
  '</div>';
}

// Cardapio pausado: hora em que cada item do iFood pausou, hora em que voltou e quanto tempo ficou fora.
// Fonte: porta resolver_pausas (leitura do cardapio pela API oficial do iFood, a cada 5 min).
var PZ=false, PZD=null;
function tempoFora(m){
  if(m==null) return '?';
  if(m<60) return m+' min';
  if(m<1440) return Math.floor(m/60)+'h'+(m%60<10?'0':'')+(m%60);
  var d=Math.floor(m/1440), h=Math.floor((m%1440)/60);
  return d+(d===1?' dia':' dias')+(h?' e '+h+'h':'');
}
/* Um cartao por ITEM (as marcas da mesma loja juntas, porque a resposta da loja vale para todas). Na lista principal
   so fica o que precisa de alguem; o que a loja ja respondeu fica num botao a parte. */
var PZF='PRECISA', PZG=[];
function pzGrupos(){
  var ls=(PZD&&PZD.linhas)||[], m={}, out=[];
  ls.forEach(function(x){
    var k=(x.aberta?'A|':'V|')+x.unidade+'|'+String(x.item||'').trim().toLowerCase();
    var g=m[k];
    if(!g){ g=m[k]={unidade:x.unidade,item:x.item,aberta:x.aberta,chave:x.chave,resolvido:x.resolvido,contradito:x.contradito,
                     quem:x.quem,o_que:x.o_que,em:x.em,prova:x.prova,marcas:[],compl:true,minutos:x.minutos,pausou:x.pausou,minimo:x.minimo,voltou:x.voltou};
           out.push(g); }
    if(g.marcas.indexOf(x.marca)<0) g.marcas.push(x.marca);
    if(x.tipo!=='Complemento') g.compl=false;
    if((x.minutos||0)>(g.minutos||0)){ g.minutos=x.minutos; g.pausou=x.pausou; g.minimo=x.minimo; }
    if(x.contradito) g.contradito=true;
    if(!x.resolvido) g.resolvido=false;
    if(!g.prova && x.prova) g.prova=x.prova;
  });
  out.forEach(function(g){
    g.sit = !g.aberta ? 'VOLTOU' : g.contradito ? 'CONTRA' : g.resolvido ? 'RESP' : (g.quem ? 'VENCIDA' : 'SEM');
  });
  return out;
}
function cardPz(){
  if(PZD===null) return '<div class="card" style="opacity:.5"><div class="t">&#9208;&#65039; Cardápio pausado</div><div class="v">&#8230;</div></div>';
  if(PZD.erro) return '<div class="card" style="opacity:.5"><div class="t">&#9208;&#65039; Cardápio pausado</div><div class="v">&#8212;</div></div>';
  var gs=pzGrupos(), c={SEM:0,VENCIDA:0,CONTRA:0,RESP:0,VOLTOU:0};
  gs.forEach(function(g){ c[g.sit]++; });
  var n=c.SEM+c.VENCIDA+c.CONTRA;
  return '<div class="card '+(n?'mal':'bem')+(PZ?' on':'')+'" onclick="soUm(&quot;PZ&quot;)" title="Clique para abrir ou fechar">'+
    '<div class="t">&#9208;&#65039; Cardápio pausado</div>'+
    '<div class="v">'+n+'</div>'+
    (n?'<div class="qs" style="color:#ff9a9a">itens esperando a loja</div>':'<div class="qs" style="color:#7fe0aa">todos respondidos</div>')+
    (c.RESP?'<div class="qs">'+c.RESP+' já respondidos (fora da lista)</div>':'')+
    ((PZD.lido_min!=null&&PZD.lido_min>20)?'<div class="qs" style="color:var(--bad)">leitura do iFood parada há '+tempoFora(PZD.lido_min)+'</div>':'')+
    '</div>';
}
// A loja responde em cada item pausado (resolver_marcar tipo 'pausado').
// Validade (regra de exemplo, configuravel no banco): "Despausei" vale ate a proxima leitura; "Acabou..." 2 dias;
// "Pode excluir" enquanto durar a mesma pausa.
var MOT_PZ=['Despausei','Acabou, vai voltar a vender','Pode excluir do cardapio'];
// resposta tirada da anotacao do item: mostra o texto usado, para a equipe conferir e reabrir se estiver errado
function provaPz(x){

}
async function marcaPz(i,k){

async function reabrePz(i){

}
function cartaoPz(g,i){
  var pill={SEM:'<span class="pill p-bad">sem resposta da loja</span>',
            VENCIDA:'<span class="pill p-warn">'+(/^Acabou/i.test(g.o_que||'')?'disseram que voltava · continua pausado':/^Pausei/i.test(g.o_que||'')?'avisaram que pausou, sem motivo':/^Despausar/i.test(g.o_que||'')?'pediram para despausar':'resposta antiga · pausou de novo')+'</span>',
            CONTRA:'<span class="pill p-bad">disseram que despausou · iFood ainda pausado</span>',
            RESP:'<span class="pill p-ok">respondido</span>',
            VOLTOU:'<span class="pill p-ok">voltou ao ar</span>'}[g.sit];
  var hora=String(g.pausou||'').slice(6)||'—', dia=String(g.pausou||'').slice(0,5);
  var ok=(g.sit==='RESP'||g.sit==='VOLTOU');
  var sit;
  if(g.sit==='VOLTOU') sit='<span class="feito">&#10004; voltou '+esc(g.voltou||'')+'</span><div class="m">ficou fora '+tempoFora(g.minutos)+'</div>';
  else if(g.sit==='RESP') sit='<span class="feito">&#10004; '+esc(g.quem||'')+'</span><div class="m">'+esc(g.em||'')+' &#183; '+esc(g.o_que||'')+'</div>'+
      '<button class="mini" style="margin-top:6px" onclick="reabrePz('+i+')">reabrir</button>';
  else sit=(g.sit==='VENCIDA'?'<div class="m" style="margin-bottom:6px">'+esc(g.quem||'')+' disse em '+esc(g.em||'')+': '+esc(g.o_que||'')+'</div>':'')+
      (g.sit==='CONTRA'?'<div class="m" style="margin-bottom:6px">'+esc(g.quem||'')+' em '+esc(g.em||'')+': '+esc(g.o_que||'')+'</div>':'')+
      MOT_PZ.map(function(m,k){ return '<button class="mini" style="margin:0 4px 4px 0" onclick="marcaPz('+i+','+k+')">'+esc(m)+'</button>' }).join('');
  return '<table class="vv'+(ok?' ok':'')+(g.sit==='VENCIDA'?' pzv':'')+'" data-pdg-livre><tr data-pdg-chave="'+esc(g.unidade+' | '+g.item)+'">'+
    '<td class="hrc"><div class="hr">'+esc(hora)+'</div><div class="ha">'+esc(dia)+'</div></td>'+
    '<td><div class="tt">'+esc(g.item)+' '+pill+(g.compl?' <span class="pill p-off">complemento</span>':'')+'</div>'+
      '<div class="lj"><b>'+esc(g.unidade||'')+'</b> &#183; '+esc(g.marcas.join(' · '))+'</div>'+
      '<div class="rs">'+(g.sit==='VOLTOU'?'Pausou '+(g.minimo?'antes de ':'')+esc(g.pausou||'?'):'Pausado há '+(g.minimo?'pelo menos ':'')+tempoFora(g.minutos))+'</div>'+
      provaPz(g)+
    '</td><td class="sit">'+sit+'</td></tr></table>';
}
function pausasPz(){
  if(!PZ) return '';
  if(!PZD||PZD.erro) return '<div class="c" style="margin-top:10px"><div class="m">Não deu para carregar as pausas'+(PZD&&PZD.erro?': '+esc(PZD.erro):'')+'.</div></div>';
  var gs=pzGrupos(), ord={CONTRA:0,SEM:1,VENCIDA:2,RESP:3,VOLTOU:4};
  gs.sort(function(a,b){ return (ord[a.sit]-ord[b.sit]) || ((a.minutos||0)-(b.minutos||0)); });
  PZG=gs;
  var conta={PRECISA:0,RESP:0,VOLTOU:0};
  gs.forEach(function(g){ if(g.sit==='RESP') conta.RESP++; else if(g.sit==='VOLTOU') conta.VOLTOU++; else conta.PRECISA++; });
  var abas=[['PRECISA','🔴 Esperando a loja','var(--bad)'],['RESP','✔ Já respondidos','var(--ok)'],['VOLTOU','✅ Voltaram ao ar','var(--ok)']];
  var ver=function(g){ return PZF==='PRECISA' ? (g.sit!=='RESP'&&g.sit!=='VOLTOU') : g.sit===PZF; };
  var vazio={PRECISA:'Nenhum item pausado esperando a loja. Tudo que está pausado foi respondido.',RESP:'Nenhum item respondido neste período.',VOLTOU:'Nada voltou ao ar neste período.'}[PZF];
  return '<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px">'+
      abas.map(function(f){
        return '<button class="mini" onclick="PZF=&quot;'+f[0]+'&quot;;desenha()"'+
          ' style="'+(PZF===f[0]?'background:#fff;color:#111;border-color:#fff;':'')+'">'+f[1]+' <b style="color:'+f[2]+'">'+conta[f[0]]+'</b></button>';
      }).join('')+
    '</div>'+
    (conta[PZF]
      ? '<div class="vv-lista">'+gs.map(function(g,i){ return ver(g)?cartaoPz(g,i):''; }).join('')+'</div>'
      : '<div class="c"><div class="vazio">'+vazio+'</div></div>')+
    '<div class="nota">Lido direto do iFood a cada 5 minutos (última leitura '+esc(PZD.lido_em||'?')+'). Cada item aparece uma vez por loja, com todas as marcas em que está pausado. '+
    'Quando a loja responde "Pode excluir do cardápio", o item sai desta lista e só volta se ele voltar ao ar e pausar de novo. "Acabou, vai voltar a vender" volta a cobrar depois de 2 dias. '+
    'A anotação feita no item também vale como resposta. Accon e tablet do salão não entram.</div>';
}

function cardF(rot, val, tp, ver, cor, ic){
  var aceso = (tp === TIPO) && (!ver || ver === VER);
  var n = +val || 0;
  return '<div class="card '+(n?'mal':'bem')+(aceso?' on':'')+'" onclick="filtra(&quot;'+tp+'&quot;,&quot;'+ver+'&quot;)"'+
         ' title="Clique para abrir ou fechar a lista">'+
         '<div class="t">'+(ic?ic+' ':'')+rot+'</div>'+
         '<div class="v"'+(cor?' style="color:'+cor+'"':'')+'>'+val+'</div></div>';
}

/* numero grande = total do periodo; linha de baixo = quantos ainda esperam alguem. Abre a lista inteira. */
function cardTot(R, tp, rot, ic){
  var tot=+R[tp+'_total']||0, ab=+R[tp]||0;
  if(!tot) return cardF0(rot, ic);
  return '<div class="card '+(ab?'mal':'aviso')+(TIPO===tp?' on':'')+'" onclick="filtra(&quot;'+tp+'&quot;,&quot;tudo&quot;)" title="Clique para abrir ou fechar a lista">'+
    '<div class="t">'+ic+' '+rot+'</div>'+
    '<div class="v">'+tot+'</div>'+
    (ab ? '<div class="qs" style="color:#ff9a9a">'+ab+' esperando alguém</div>'
        : '<div class="qs" style="color:#7fe0aa">todos com solução</div>')+
    '</div>';
}
function cardParc(R){ return cardTot(R,'parcial','Item cancelado','✂️'); }
/* a Maquininha nao tem periodo: a comanda fica na lista ate alguem resolver, de qualquer dia.
   Por isso o numero e so o que espera alguem (o total juntaria semanas de casos ja resolvidos). */
function cardMaq(R){
  var ab=+R.maquininha||0;
  if(!ab) return cardF0('Maquininha','🧾');
  return '<div class="card mal'+(TIPO==='maquininha'?' on':'')+'" onclick="filtra(&quot;maquininha&quot;,&quot;abertas&quot;)" title="Clique para abrir ou fechar a lista">'+
    '<div class="t">🧾 Maquininha</div><div class="v">'+ab+'</div>'+
    '<div class="qs" style="color:#ff9a9a">esperando alguém</div>'+
    '<div class="qs">de qualquer dia, até alguém resolver</div></div>';
}

/* Cada cartao e uma tabela de uma linha so, para a anotacao do portal.js aparecer (ela procura linha de tabela).
   O banco manda a marca em o_que_e e o detalhe com rotulos: "disse: ... | item: ... | como ficou: ... | de onde veio: ...". */
function parteDet(s){
  var o={};
  String(s||'').split(/ \| (?=(?:tipo|disse|item|como ficou|quem cancelou|contestação|de onde veio): )/).forEach(function(p){
    var m=p.match(/^(tipo|disse|item|como ficou|quem cancelou|contestação|de onde veio): ([\s\S]*)$/); if(m) o[m[1]]=m[2];
  });
  return o;
}
/* cartao dos outros quadros (Cliente sem resposta, Negociacao, Maquininha, Reentrega): o banco manda o_que_e e detalhe soltos */
function cartaoGeral(l,i){
  var ok=!!l.resolvido, q=String(l.quando||''), tm=/ \d{2}:\d{2}$/.test(q);
  var det=String(l.detalhe||'').split(' | ').join(' · ');
  if(l.cliente_disse && det===l.cliente_disse) det='';
  return '<table class="vv'+(ok?' ok':'')+'" data-pdg-livre><tr data-pdg-chave="'+esc(l.chave||'')+'">'+
    '<td class="hrc"><div class="hr">'+esc(tm?q.slice(6):(q||'—'))+'</div><div class="ha">'+esc(tm?haQuando(q):'')+'</div></td>'+
    '<td><div class="tt">'+esc(rotulo(l.tipo))+' '+(ok?'<span class="pill p-ok">resolvido</span>':'<span class="pill p-bad">esperando alguém</span>')+'</div>'+
      '<div class="lj"><b>'+esc(l.unidade||'')+'</b> · pedido <b>'+esc(l.referencia||'—')+'</b></div>'+
      (l.cliente_disse?'<div class="ds">“'+esc(l.cliente_disse)+'”</div>':'')+
      (l.o_que_e?'<div class="it">'+esc(l.o_que_e)+'</div>':'')+
      ((det||l.valor!=null)?'<div class="rs">'+esc(det)+(l.valor!=null?(det?' · ':'')+'R$ '+esc(Number(l.valor).toFixed(2).replace('.',',')):'')+'</div>':'')+
      (FONTE_TIPO[l.tipo]?'<div class="fn">Fonte: '+esc(FONTE_TIPO[l.tipo])+'</div>':'')+
      ((l.fotos>0||l.tem_conversa)?'<div class="vbt">'+
        ((l.fotos>0)?'<button class="mini" onclick="verFotos('+i+')">📷 '+l.fotos+(l.fotos>1?' fotos':' foto')+'</button>':'')+
        (l.tem_conversa?'<button class="mini" onclick="verConversa('+i+')">💬 conversa</button>':'')+'</div>':'')+
      ((l.n_conversas>1)?'<div style="margin-top:5px;color:var(--warn);font-size:12px">⚠️ '+l.n_conversas+' conversas com esse número de pedido — não dá para saber qual é</div>':'')+
    '</td>'+
    '<td class="sit">'+
      (ok
        ? '<span class="feito">✔ '+esc(l.quem||'')+'</span><div class="m">'+esc(l.resolvido_em||'')+' · '+esc(l.o_que_foi_feito||'')+'</div>'+
          '<button class="mini" style="margin-top:6px" onclick="reabrir('+i+')">reabrir</button>'
        : campoEscrita(l,i))+
    '</td></tr></table>';
}
function haQuando(q){
  var m=String(q||'').match(/^(\d{2})\/(\d{2}) (\d{2}):(\d{2})$/); if(!m) return '';
  var n=new Date(), t=new Date(n.getFullYear(),+m[2]-1,+m[1],+m[3],+m[4]);
  if(t>n) t.setFullYear(t.getFullYear()-1);
  var min=Math.round((n-t)/60000);
  if(min<60) return 'há '+min+' min';
  if(min<1440) return 'há '+Math.floor(min/60)+'h'+(min%60<10?'0':'')+(min%60);
  return m[1]+'/'+m[2];
}
var FONTE_TIPO={chat:'Chat do iFood (Gestor Web)',negociacao:'Negociação do iFood',maquininha:'Conferência da maquininha (Saipos × Rede)'};
function cartaoParc(l,i){
  var cc=(l.tipo==='cancelamento'), pc=(l.tipo==='parcial');
  if(!cc && !pc) return cartaoGeral(l,i);
  var d=parteDet(l.detalhe), ok=!!l.resolvido;
  var disse=d['disse']||l.cliente_disse||'', item=d['item']||'';
  if(item && disse && (disse.indexOf(item)>=0 || item.indexOf(disse)>=0)) item='';
  var hora=String(l.quando||'').slice(6)||'—';
  return '<table class="vv'+(ok?' ok':'')+'" data-pdg-livre><tr data-pdg-chave="'+esc(l.chave||'')+'">'+
    '<td class="hrc"><div class="hr">'+esc(hora)+'</div><div class="ha">'+esc(haQuando(l.quando))+'</div></td>'+
    '<td><div class="tt">'+(cc?'🚫 '+esc(d['tipo']||'Cancelado inteiro'):'✂️ Item cancelado')+' '+(ok?'<span class="pill p-ok">resolvido</span>':'<span class="pill p-bad">esperando alguém</span>')+
        (cc&&d['quem cancelou']?' <span class="pill p-off">cancelou: '+esc(d['quem cancelou'])+'</span>':'')+'</div>'+
      '<div class="lj"><b>'+esc(l.unidade||'')+'</b> · pedido <b>'+esc(l.referencia||'')+'</b>'+(l.o_que_e?' · '+esc(l.o_que_e):'')+'</div>'+
      (disse?'<div class="ds">“'+esc(disse)+'”</div>':'')+
      (item?'<div class="it">Item no iFood: '+esc(item)+'</div>':'')+
      (cc ? '<div class="rs">Pedido cancelado inteiro'+(d['contestação']?' · '+esc(d['contestação']):'')+
              (l.valor!=null?' · valor do pedido R$ '+esc(Number(l.valor).toFixed(2).replace('.',',')):'')+'</div>'
          : '<div class="rs">Como ficou: '+esc(d['como ficou']||'—')+'</div>')+
      '<div class="fn">Fonte: '+esc(d['de onde veio']||'—')+'</div>'+
      ((l.fotos>0||l.tem_conversa)?'<div class="vbt">'+
        ((l.fotos>0)?'<button class="mini" onclick="verFotos('+i+')">📷 '+l.fotos+(l.fotos>1?' fotos':' foto')+'</button>':'')+
        (l.tem_conversa?'<button class="mini" onclick="verConversa('+i+')">💬 conversa</button>':'')+'</div>':'')+
      ((l.n_conversas>1)?'<div style="margin-top:5px;color:var(--warn);font-size:12px">⚠️ '+l.n_conversas+' conversas com esse número de pedido — não dá para saber qual é</div>':'')+
    '</td>'+
    '<td class="sit">'+
      (ok
        ? '<span class="feito">✔ '+esc(l.quem||'')+'</span><div class="m">'+esc(l.resolvido_em||'')+' · '+esc(l.o_que_foi_feito||'')+'</div>'+
          '<button class="mini" style="margin-top:6px" onclick="reabrir('+i+')">reabrir</button>'
        : campoEscrita(l,i))+
    '</td></tr></table>';
}

/* lojas do config.js: o filtro guarda o nome da loja (e o que o banco manda em "unidade") */
function lojaIdDe(nome){ var l=(PORTAL_CFG.lojas||[]).filter(function(x){return x.nome===nome})[0]; return l?l.id:''; }
function barraFiltro(){
  var lj=function(n,r){ return '<button class="chip'+(UNI===n?' on':'')+'" onclick="UNI=&quot;'+esc(n)+'&quot;;boot()">'+esc(r||n||'Todas')+'</button>' };
  var pe=$('per');
  if(pe) pe.innerHTML=
     '<button class="chip'+((DIAS===1&&!ONT)?' on':'')+'" onclick="DIAS=1;ONT=false;boot()">Hoje</button>'+
     '<button class="chip'+(ONT?' on':'')+'" onclick="DIAS=1;ONT=true;boot()">Ontem</button>'+
     '<button class="chip'+(DIAS===7?' on':'')+'" onclick="DIAS=7;ONT=false;boot()">7 dias</button>'+
     '<button class="b" onclick="boot()" title="Ler de novo">↻ Atualizar</button>';
  return '<div class="lojas"><span class="rot">LOJA</span>'+
     lj('','Todas')+(PORTAL_CFG.lojas||[]).map(function(l){ return lj(l.nome); }).join('')+
     '</div>';
}

function desenha(){
  var BF=barraFiltro();
  if(D===false){ $('app').innerHTML='<div class="c"><b>Não deu para carregar.</b><div class="m">Entre no portal de novo e tente outra vez.</div></div>'; return }
  if(!D){ $('app').innerHTML='<div class="load">Carregando…</div>'; return }
  const R=D.resumo||{}, itens=D.itens||[], card=D.cardapio||{};
  let h=BF+'<div class="cards">'+
    cardEsq()+
    ((!R.reentrega&&cardSemDado('Reentrega','🔁'))||cardTot(R,'reentrega','Reentrega','🔁'))+
    cardTot(R,'cancelamento','Cancelado inteiro','🚫')+
    cardParc(R)+
    cardTot(R,'chat','Cliente sem resposta','💬')+
    '<div style="grid-column:span 2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">'+cardMaq(R)+cardPag()+'</div>'+
    cardTot(R,'negociacao','Negociação do iFood','🤝')+
    cardCheg()+
    cardDup()+
    cardPz()+
  '</div>';

  h+=painelQ('ESQ',esquecidos());

  h+=painelQ('PZ',pausasPz());

  h+=painelQ('CHG',chegada());

  h+=painelQ('DUPO',duplaPainel());

  if(TIPO){
    const porTipo = itens.filter(function(x){return x.tipo===TIPO});
    const lista = (VER==='abertas') ? porTipo.filter(function(x){return !x.resolvido}) : porTipo;
    h+='<div class="painel" id="painel"><div class="ph"><h3>'+rotulo(TIPO)+'</h3><span class="ct">'+(VER==='abertas'?'só o que ainda espera alguém':'tudo do período')+'</span><button class="b fecha" onclick="fechaTudo()">fechar ✕</button></div>';
    if(!lista.length){
      h+='<div class="c"><div class="vazio">'+(VER==='abertas'?'Nada esperando ninguém neste período. A casa está limpa.':'Nada neste período.')+'</div></div>';
    }else{
      h+='<div class="vv-lista">'+itens.map(function(l,i){ return (l.tipo===TIPO && (VER!=='abertas'||!l.resolvido)) ? cartaoParc(l,i) : ''; }).join('')+'</div>';
    }
    if(TIPO==='maquininha' && D.maq_cache){
      h+='<div class="c" style="margin-top:10px"><div class="m">🧾 As comandas não cobradas da maquininha foram conferidas pela última vez em '+esc(D.maq_cache)+
         ((D.maq_horas!=null && D.maq_horas>26)?' — <b style="color:var(--bad)">isso está velho, a conferência automática não rodou</b>':'')+
         '. Elas ficam na lista até alguém resolver, mesmo sendo de outro dia.</div></div>';
    }
    h+='</div>';
  }else if(!(ESQ||PAU||CHG||DUPO||FDA||PZ||PAG)){
    h+='<div class="nota">👆 Toque num quadro para ver a lista dele.</div>';
  }

  h+=falaComigo();
  $('app').innerHTML=h;
  pagSync();
}

function placar(h){ var p=$('placar'); if(p) p.innerHTML=h; }
async function boot(){
  placar('<span class="pl">carregando…</span>');
  D=null; PZD=null; desenha();
  porta('resolver_pausas',{dias:DIAS,ontem:ONT,unidade:UNI||null}).then(function(j){PZD=j||{linhas:[]};desenha()}).catch(function(e){PZD={erro:(e&&e.message)||'erro'};desenha()});
  if(!FR) frPega().then(function(){ if(D) desenha(); });
  try{ D=await porta('resolver_hoje',{dias:DIAS,ontem:ONT,unidade:UNI||null}); }
  catch(e){ D=false; placar('<span class="pl" style="border-color:rgba(230,103,103,.5);color:#ff9a9a">'+esc((e&&e.message)||'erro')+'</span>'); desenha(); return }
  const R=D.resumo||{};
  var ab=R.abertas||0;
  placar('<span class="pl">Período <b>'+(ONT?'Ontem':(DIAS===7?'7 dias':'Hoje'))+'</b></span>'+
    '<span class="pl"'+(ab?' style="border-color:rgba(230,103,103,.5)"':'')+'><b'+(ab?' style="color:#ff9a9a"':'')+'>'+ab+'</b> esperando alguém</span>'+
    '<span class="pl">Loja <b>'+esc(UNI||'Todas')+'</b></span>'+
    '<span class="pl">lido <b>'+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</b></span>');
  abrePrimeiro();
  desenha();
}
/* ===== porta unica do portal ===== */
const PDGMODS=['resolver'];
function pdgTok(){try{return sessionStorage.getItem('pdg_token')||''}catch(e){return ''}}
function pdgSaia(m){try{sessionStorage.setItem('pdg_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace(PORTAL_CFG.url('index.html'))}catch(e){location.replace(PORTAL_CFG.url('index.html'))}}
async function pdgGuarda(){
  const t=pdgTok();
  if(!t){pdgSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'resolver'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){pdgSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&PDGMODS.indexOf(m.id)>=0})){pdgSaia('Você não tem acesso a este módulo');return false}
  return true;
}
pdgGuarda().then(function(ok){if(ok)boot()});
</script>
