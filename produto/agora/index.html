<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../config.js" data-demo="telas/agora.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F47B3C">
<title>Agora · Portal de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Figtree:wght@400;500;600;700&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#F47B3C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--s0);color:var(--text);font-family:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--s1)}
.topo h1{font-family:'Roboto Condensed','Figtree',sans-serif;font-size:20px;letter-spacing:.3px;margin-right:10px}
.aba{background:var(--s2);color:var(--text2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.aba.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.aba .d{display:block;font-size:10.5px;font-weight:600;opacity:.8}
#quadro{flex:1;min-height:0}
#quadro iframe{width:100%;height:100%;border:0;display:block;background:var(--s0)}
.vazio{color:var(--muted);padding:24px}
@media (max-width:700px){.topo{padding:8px 10px}.aba{padding:7px 11px;font-size:13px}.aba .d{display:none}}
</style>
</head>
<body>
<div class="topo"><h1>🔴 Agora</h1><div id="abas"></div></div>
<div id="quadro"><div class="vazio">Carregando…</div></div>
<!-- a caixa "Anotação da equipe nesta tela" (assets/portal.js) ja aparece dentro de cada tela da aba; esta marca evita uma segunda caixa aqui fora -->
<div class="pdg-nota-tela" style="display:none"></div>
<script>
/* Moldura com abas: junta as telas do "agora" do delivery numa so.
   Esta tela nao le dado nenhum: so mostra, uma de cada vez, as telas que ja existem
   (Chegada do dia, Resolver hoje, Fila de Pedidos, Tempo de Entrega). Cada uma continua
   com a propria trava de acesso e as proprias contas. So uma fica aberta por vez, para
   nao deixar tela escondida buscando dado sozinha. */
const SB=PORTAL_CFG.rest;
const KEY=PORTAL_CFG.chave;
const ABAS=[
  {id:'chegada',t:'🛵 Chegada',d:'quem chegou e quem está rodando',url:PORTAL_CFG.url('chegada/')},
  {id:'resolver',t:'🔥 Resolver hoje',d:'o que está esperando alguém',url:PORTAL_CFG.url('resolver/')},
  {id:'fila',t:'🍔 Fila de pedidos',d:'cozinha e rua agora',url:PORTAL_CFG.url('fila/')},
  {id:'tempo',t:'⏱ Tempo de entrega',d:'sobe ou desce a faixa',url:PORTAL_CFG.url('tempo/')}
];
let MINHAS=[], ATUAL='';
function $(i){return document.getElementById(i)}
function pinta(){
  $('abas').innerHTML=MINHAS.map(function(a){
    return '<button class="aba'+(a.id===ATUAL?' on':'')+'" data-aba="'+a.id+'" onclick="vai(\''+a.id+'\')">'+a.t+'<span class="d">'+a.d+'</span></button>';
  }).join('');
}
function vai(id){
  const a=MINHAS.find(function(x){return x.id===id})||MINHAS[0];
  if(!a){$('quadro').innerHTML='<div class="vazio">Nenhuma tela do delivery liberada para você.</div>';return}
  ATUAL=a.id;
  try{localStorage.setItem('pdg_agora_aba',a.id)}catch(e){}
  $('quadro').innerHTML='<iframe src="'+a.url+'?cb='+Date.now()+'" title="'+a.t+'"></iframe>';
  pinta();
}
function boot(ms){
  const ids=ms.map(function(m){return m&&m.id});
  MINHAS=ABAS.filter(function(a){return ids.indexOf(a.id)>=0});
  let ult='';try{ult=localStorage.getItem('pdg_agora_aba')||''}catch(e){}
  vai(ult);
}

/* ===== porta unica do portal ===== */
const PDGMODS=['agora'];
function pdgTok(){try{return sessionStorage.getItem('pdg_token')||''}catch(e){return ''}}
function pdgSaia(m){try{sessionStorage.setItem('pdg_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace(PORTAL_CFG.url('index.html'))}catch(e){location.replace(PORTAL_CFG.url('index.html'))}}
async function pdgGuarda(){
  const t=pdgTok();
  if(!t){pdgSaia('Entre no portal para acessar esta tela');return null}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'agora'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){pdgSaia('Entre no portal para acessar esta tela');return null}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&PDGMODS.indexOf(m.id)>=0})){pdgSaia('Você não tem acesso a este módulo');return null}
  return ms;
}
pdgGuarda().then(function(ms){if(ms)boot(ms)});
</script>
<script src="../assets/portal.js?v=3"></script>
</body>
</html>
