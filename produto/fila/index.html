<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../config.js" data-demo="telas/fila.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Fila de Pedidos · Portal de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

<style>
/* Tela de balcao: as listas ficam sempre abertas; tocar num quadro de cima so marca o quadro e rola ate a lista dele. */
:root{--roxo:#a98bf5}
.per{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700}
button.b:hover{border-color:var(--text2)}
.lojas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.lojas .rot{color:var(--muted);font-size:12px;font-weight:800;margin-right:2px}
.lojas .chip{padding:7px 13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cards>*{min-width:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 15px;color:var(--text);display:flex;flex-direction:column;gap:3px;transition:border-color .15s,transform .08s}
.card[onclick]{cursor:pointer}
.card[onclick]:hover{border-color:#5a5952}
.card[onclick]:active{transform:scale(.98)}
.card .t{font-size:13px;font-weight:800;color:var(--text2);line-height:1.3;display:flex;align-items:center;gap:6px}
.card .v{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:42px;line-height:1.05;margin:0}
.card .qs{color:var(--muted);font-size:12px;font-weight:700;line-height:1.35}
.card.mal{border-left:4px solid var(--bad)}
.card.mal .v{color:#ff8a8a}
.card.aviso{border-left:4px solid var(--warn)}
.card.aviso .v{color:var(--warn)}
.card.bem .v{color:#7fe0aa}
.card.sd{border-style:dashed}
.card.sd .v{color:var(--muted)}
.card.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.sec{scroll-margin-top:12px}
.sec>.grp:first-child{margin-top:24px}
.sec.on .lista,.sec.on .qd{border-color:var(--brand)}
.sec.on>.grp h2{color:var(--brand)}
.bola{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.b-vm{background:var(--bad);box-shadow:0 0 0 3px rgba(230,103,103,.2)}
.b-rx{background:var(--roxo);box-shadow:0 0 0 3px rgba(169,139,245,.2)}
.lista{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.linha{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);border-left:4px solid transparent}
.linha:last-child{border-bottom:none}
.linha .ped{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;letter-spacing:.02em;min-width:56px;line-height:1}
.linha .est{color:var(--text2);font-size:13.5px;font-weight:600}
/* numero do pedido no iFood ao lado do numero do pedido no PDV (Saipos) */
.ifn{display:inline-block;border-radius:6px;padding:3px 7px;font-size:12px;font-weight:800;line-height:1.2;letter-spacing:.02em;white-space:nowrap;color:#ff8a8a;background:rgba(234,29,44,.14);flex:0 0 auto}
.linha .ifn{min-width:88px;text-align:center}
.linha .ifn.vz{visibility:hidden}
.linha .mb{color:var(--muted);font-size:12.5px;margin-left:4px}
.linha .dir{margin-left:auto;display:flex;align-items:center;gap:14px}
.linha .hr{color:var(--muted);font-size:12.5px}
.linha .mn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;min-width:62px;text-align:right;line-height:1}
.linha .mn,.linha .hr{white-space:nowrap}
.linha.late{border-left:4px solid var(--bad);background:rgba(230,103,103,.07)}
.linha.late .mn{color:#ff8a8a}
/* selo da hora prometida ao cliente em cada pedido */
.pz{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;background:rgba(47,174,106,.13);color:#7fe0aa}
.pz b{font-weight:800}
.pz.perto{background:rgba(201,133,0,.16);color:#ffc65a}
.pz.passou{background:rgba(230,103,103,.18);color:#ff9a9a}
.qd .it .qbr{flex-basis:100%;height:0}
.qd .it .pz{margin-left:28px;margin-top:-2px}
.quadros{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}
.quadros>*{min-width:0}
.qd{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.qd .cb{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.qd .cb .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qd .cb .ct{margin-left:auto;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:24px;line-height:1;color:var(--brand);flex:0 0 auto}
.qd .cb .sa{color:var(--muted);font-size:12px;font-weight:600;flex:0 0 auto}
.qd .it{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.qd .it:last-child{border-bottom:0}
.qd .it .p{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.02em;min-width:46px;line-height:1}
.qd .it .h{color:var(--muted);font-size:12px}
.qd .it .m{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;white-space:nowrap;line-height:1}
.qd .it.late{background:rgba(230,103,103,.07)}
.qd .it.late .m{color:#ff8a8a}
.qd .it .pt{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap;background:rgba(37,163,95,.15);color:#7fe0aa}

.qd .cb .sg{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;white-space:nowrap;background:rgba(201,133,0,.16);color:var(--warn);flex:0 0 auto}
.leg{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5}
.leg .bola{margin-right:5px;vertical-align:middle;width:9px;height:9px}
.vazio{color:var(--muted);font-size:14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:center}

.mbs{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;overflow-x:auto}

.cz .up{color:#7fe0aa;font-weight:800}.cz .dn{color:#ff9a9a;font-weight:800}
.cz .esq{margin-top:10px;font-size:13px;color:var(--text2);background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:13px;padding:10px 13px;line-height:1.5}
.cz .esq b{color:#ff9a9a}
.rc{display:inline-block;width:13px;height:13px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(255,255,255,.35);vertical-align:middle}
.qd .it .sq{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11.5px;font-weight:800;color:#111;flex:0 0 auto}
.mm-n{width:22px;height:22px;border-radius:50%;border:2px solid #111;color:#111;font:800 12px/18px Barlow,sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.mm-n.late{box-shadow:0 0 0 3px #e66767}
.mm-e{font-size:18px;line-height:22px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.mapao .leaflet-container{font-family:Barlow,sans-serif}

.pmg{position:fixed;inset:0;z-index:1900;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:12px}
.pmg .cx{background:var(--s1,#1c1c1c);border:1px solid var(--line);border-radius:18px;width:100%;max-width:1100px;height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.pmg .tp{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pmg .tp b{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:22px;letter-spacing:.02em}
.pmg .tp small{color:var(--muted);font-size:12.5px}
.pmg .fx{margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer;flex:0 0 auto}
.pmg .mg{flex:1;min-height:0;background:#1b1b1b}
.pmg .av{padding:8px 14px;color:var(--warn);font-size:13px;font-weight:700;border-bottom:1px solid var(--line)}
.pmg .leaflet-container{font-family:Barlow,sans-serif}
.pmg .lr{max-height:34%;overflow:auto;border-top:1px solid var(--line);padding:8px 14px 10px;font-size:13.5px}
.pmg .lr .nt{color:var(--muted);font-size:12px;line-height:1.4;margin-bottom:4px}
.pmg .lr .ln{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);line-height:1.3}
.pmg .lr .ln .sq{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11.5px;font-weight:800;color:#111;flex:0 0 auto}
.pmg .lr .ln .ed{color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmg .lr .ln .tm{margin-left:auto;font-weight:800;white-space:nowrap;text-align:right}
.pmg .lr .ln .tm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.pmg .lr .ln.tt{font-weight:800}
.mm-tt{background:rgba(0,0,0,.78)!important;color:#fff!important;border:0!important;font:800 11.5px Barlow,sans-serif;padding:1px 6px!important;box-shadow:none!important}
.mm-tt:before{display:none}
.pmg .leaflet-control-attribution{font-size:10px;background:rgba(0,0,0,.55)!important;color:#999}
.pmg .leaflet-control-attribution a{color:#bbb}
.mapao .leaflet-control-attribution{font-size:10px;background:rgba(0,0,0,.55)!important;color:#999}
.mapao .leaflet-control-attribution a{color:#bbb}
.qd .it{flex-wrap:wrap}
.mapao{height:440px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#1b1b1b;margin-bottom:8px;z-index:0}
@media (max-width:640px){.mapao{height:320px}}
.mapdica{color:var(--muted);font-size:12.5px;margin:0 2px 12px;line-height:1.6}
.mapdica .bola{width:10px;height:10px;margin:0 3px 0 0;vertical-align:middle}
/* pedidos da loja no mapa (mesmas cores da lista) e a ficha que aparece ao passar o mouse */
.mm-l{position:absolute;left:0;top:0;transform:translate(-50%,-50%);padding:0 6px;border-radius:999px;border:2px solid #111;font:800 12.5px/17px 'Barlow Condensed',Barlow,sans-serif;letter-spacing:.02em;color:#111;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.6);cursor:pointer}
.mm-pisca{animation:mmPisca .6s ease-in-out 6}

@media (prefers-reduced-motion:reduce){.mm-pisca{animation:none;outline:3px solid #fff}}
.vm{cursor:pointer;font-size:14px;line-height:1;flex:0 0 auto;padding:2px;border-radius:6px}
.vm:hover{background:var(--s2)}
.qd .it .en[data-mapa]{cursor:pointer}
.qd .it .en[data-mapa]:hover{color:var(--text)}
.linha .vm.vz{visibility:hidden}
#sec_mapa .grp .b{margin-left:auto;padding:5px 10px;font-size:12px;cursor:pointer}
.mm-prep{background:var(--bad)}
.mm-pron{background:var(--roxo)}
.mm-l.late{box-shadow:0 0 0 3px #e66767,0 1px 4px rgba(0,0,0,.6)}
.mm-dica{font:600 12.5px/1.4 Barlow,sans-serif!important;background:rgba(17,17,17,.96)!important;color:#eee!important;border:1px solid #444!important;border-radius:10px!important;padding:6px 10px!important;box-shadow:0 4px 14px rgba(0,0,0,.6)!important;white-space:nowrap}
.mm-dica b{font-size:14.5px}
.mm-dica .dr{color:#ff8a8a;font-weight:800}
.mm-dica .dv{color:#7fe0aa;font-weight:800}
.mm-dica .da{color:#ffc75a;font-weight:800}
.mm-dica .de{color:#aaa}
.leaflet-tooltip-top.mm-dica:before{border-top-color:#444}
.mm-nome{border-radius:999px;padding:1px 8px;font:800 12px/18px Barlow,sans-serif;color:#111;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.7);border:2px solid #111;cursor:pointer}
.qd[data-mb]{cursor:pointer;transition:opacity .15s}
.quadros.foco .qd[data-mb]{opacity:.45}
.quadros.foco .qd.sel{opacity:1;box-shadow:0 0 0 2px var(--brand)}
.qd .cb .vr{margin-left:6px;background:none;border:1px solid var(--line);color:var(--text2);border-radius:999px;padding:2px 9px;font:700 11.5px Barlow,sans-serif;cursor:pointer;flex:0 0 auto}
.qd .it .en{flex-basis:100%;padding-left:28px;margin-top:-2px;color:var(--muted);font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-ped]{cursor:pointer;text-decoration:underline dotted rgba(255,255,255,.35);text-underline-offset:3px}
[data-ped]:hover{color:var(--brand)}
.mm-n{cursor:pointer}
.pdm{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.pdm .cx{background:var(--s1,#1c1c1c);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.pdm .tp{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pdm .tp b{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:24px;letter-spacing:.02em}
.pdm .fx{margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer}
.pdm .pe{color:var(--text2);font-size:13.5px;line-height:1.45;margin-bottom:12px}
.pdm .pe small{display:block;color:var(--muted);font-size:12.5px}

.vivo i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pisca 1.6s infinite}
.vivo.velho{color:#ff9a9a;border-color:rgba(230,103,103,.5)} .vivo.velho i{background:var(--bad)}

<body>
<div class="wrap">
<div class="top">
  <div>
    <h1>🍔 Fila de Pedidos</h1>
    <div class="placar" id="placar"></div>
  </div>
  <div class="rt per"><span class="vivo" id="vivo"><i></i>ao vivo</span><button class="b" onclick="boot()" title="Ler de novo">↻ Atualizar</button></div>
</div>
<div class="lojas" id="lojas"><span class="rot">LOJA</span></div>
<div id="app"><div class="load">Carregando…</div></div>
</div>

<script>
const SB=PORTAL_CFG.rest;
const KEY=PORTAL_CFG.chave;
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function rpc(nome,corpo){
  try{
    const r=await fetch(SB+'rpc/'+nome,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
    return r.ok?await r.json():null;
  }catch(e){return null}
}

/* as lojas vem do config.js (PORTAL_CFG.lojas); UNI guarda o id da loja escolhida.
   Ao banco vai o nome da loja (p_unidade), como nas outras telas. Aceita ?loja=ID no endereco. */
var LOJAS=Array.isArray(PORTAL_CFG.lojas)?PORTAL_CFG.lojas:[];
function lojaDe(id){ for(var i=0;i<LOJAS.length;i++) if(LOJAS[i].id===id) return LOJAS[i]; return null; }
function nomeLoja(id){ var l=lojaDe(id); return l?l.nome:String(id||''); }
var UNI=LOJAS.length?LOJAS[0].id:'';
try{var _u=localStorage.getItem('pdg_fila_uni'); if(lojaDe(_u)) UNI=_u;}catch(e){}
try{var _q=new URLSearchParams(location.search).get('loja'); if(lojaDe(_q)) UNI=_q;}catch(e){}
(function(){
  var el=$('lojas'); if(!el) return;
  el.innerHTML='<span class="rot">LOJA</span>'+LOJAS.map(function(l){
    return '<button class="chip'+(l.id===UNI?' on':'')+'" data-u="'+esc(l.id)+'" onclick="trocaLoja(&quot;'+esc(l.id)+'&quot;)">'+esc(l.nome)+'</button>';
  }).join('');
  if(LOJAS.length<2) el.style.display='none';
})();

function trocaLoja(u){
  UNI=u; try{localStorage.setItem('pdg_fila_uni',u)}catch(e){}
  var bs=document.querySelectorAll('#lojas .chip');
  for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('on', bs[i].getAttribute('data-u')===u); }
  placar('');

function promBloco(d){

    var k='', s='', prom=+F.prometido||0, sug=+F.sugerido||0, dif=sug-prom, par=+F.parados||0, ph=+F.pedidos_hora||0;

/* a distancia que o motoboy esta de cada pedido na mao dele.
   Vem do banco em metros (dist_m), medida em LINHA RETA entre o GPS dele agora e o endereco do pedido.
   Sem GPS, sem endereco ou nome que nao casou: o banco manda nulo e aqui NAO se escreve nada.
   A cor decide pelo MESMO numero que aparece escrito (arredondado), para dois "3,0 km" nunca sairem de cores diferentes. */
function dist(m){
  if(m===null||m===undefined) return '';
  var mm = (m<1000) ? m : Math.round(m/100)*100;
  var cls = (mm<300)?' pp' : (mm>=3000)?' lg' : '';
  var txt = (m<1000) ? (m+' m') : ((mm/1000).toFixed(1).replace('.',',')+' km');
  return '<span class="dd'+cls+'" title="em linha reta, do GPS dele ate o endereco">'+esc(txt)+'</span>';
}

/* ao lado de cada entrega, um quadradinho com a cor da rota, para bater o olho e saber qual motoboy leva.
   A API do TrackEat nao manda a cor: ela e calculada aqui, pela mesma regra do mapa do TrackEat: cada rota (grupo)
   ganha uma cor pelo numero dela; se uma rota a menos de 6 km ja tem cor parecida, tenta a proxima da sequencia
   (ate 80). Rotas maiores escolhem primeiro. */
function teHsl(h,s,l){
  h=(h%360+360)%360; s=Math.min(Math.max(s,0),100)/100; l=Math.min(Math.max(l,0),100)/100;
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs(h/60%2-1)), m=l-c/2, r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  return '#'+[r,g,b].map(function(v){return Math.round(255*(v+m)).toString(16).padStart(2,'0')}).join('');
}
function teCor(e,t){ var S=[68,74,80,86], L=[42,48,54,60]; return teHsl((137.508*e+53*t)%360, S[(e+t)%4], L[(3*e+t)%4]); }
function teKm(a,b,c,d){ var R=function(x){return x*Math.PI/180}, r=R(c-a), o=R(d-b),
  s=Math.sin(r/2)*Math.sin(r/2)+Math.cos(R(a))*Math.cos(R(c))*Math.sin(o/2)*Math.sin(o/2);
  return 12742*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }
function teRgb(h){ var n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function teDif(a,b){ var x=teRgb(a), y=teRgb(b); return Math.sqrt(Math.pow(x[0]-y[0],2)+Math.pow(x[1]-y[1],2)+Math.pow(x[2]-y[2],2)); }
function coresRotas(lista){
  var gs={}, ordem=[];
  (lista||[]).forEach(function(p){ var g=Number(p.g); if(!g||p.lat==null||p.lng==null) return;
    if(!gs[g]){gs[g]={g:g,pts:[]};ordem.push(gs[g]);} gs[g].pts.push([Number(p.lat),Number(p.lng)]); });
  var rs=ordem.map(function(x){ var n=x.pts.length;
    return {g:x.g, lat:x.pts.reduce(function(a,p){return a+p[0]},0)/n, lng:x.pts.reduce(function(a,p){return a+p[1]},0)/n, n:n}; })
    .sort(function(a,b){ return b.n!==a.n ? b.n-a.n : a.g-b.g; });
  var feitos=[], out={};
  var perto=function(e){ return feitos.filter(function(t){ return teKm(e.lat,e.lng,t.lat,t.lng)<6; }); };
  var serve=function(c,e){ return perto(e).every(function(t){ return c!==t.cor && teDif(c,t.cor)>=90; }); };
  var nota=function(c,e){ var v=perto(e); if(!v.length) return Infinity;
    return Math.min.apply(null, v.map(function(t){ var r=teKm(e.lat,e.lng,t.lat,t.lng), o=teDif(c,t.cor), s=o+4*r;
      if(c===t.cor) s-=1e5; if(o<90) s-=1e3*(90-o); return s; })); };
  rs.forEach(function(e){
    var k=String(e.g), hsh=0; for(var i=0;i<k.length;i++) hsh=(31*hsh+k.charCodeAt(i))>>>0;
    var cor=null, melhor=null, mv=-Infinity;
    for(var o=0;o<80;o++){ var c=teCor(hsh,o); if(serve(c,e)){cor=c;break;} var a=nota(c,e); if(a>mv){mv=a;melhor=c;} }
    cor=cor||melhor||teCor(hsh,0);
    feitos.push({lat:e.lat,lng:e.lng,cor:cor}); out[e.g]=cor;
  });
  return out;
}

/* o quadro do tempo de preparo da Central Cozinha, aqui dentro, para a equipe ver se a cozinha esta
   demorando HOJE. Mesma fonte da Central Cozinha (cozinha_vw_preparo_dia: do pedido entrar ate ficar pronto),

var CZ=null, COR_MB={};
function czDia(dMenos){

}

    return r.ok?await r.json():null;

function czMedia(rows){
  var p=0,s=0;
  rows.forEach(function(r){var n=Number(r.pedidos||0),m=Number(r.preparo_medio_min); if(n>0&&isFinite(m)){p+=n;s+=n*m;}});

}
function czMin(n){return n.toFixed(1).replace('.',',')+' min';}
/* Faixa "O dia ate agora" SO da loja escolhida: cozinha (acima), mais os numeros da Central do Delivery
   (entregas, motoboys, % no prazo real, atrasos reais, sem codigo) e da tela Resolver hoje (reentrega aberta).
   Tudo vem da conta fila_painel no banco, que usa as MESMAS regras daquelas telas, para nunca discordarem.
   "Esqueceram na sacola" sai da mesma lista da Central Cozinha (dia da cozinha 6h-6h, so o que conta na triagem,
   falta na sacola). */
var PN=null;
/* cada numero do dia vira quadro. A cor decide o jeito do quadro:
   vermelho = borda vermelha (problema), verde = numero verde, cinza = tracejado (sem dado), amarelo = borda amarela. */
function kc(t,v,s,cor){
  var k=cor==='var(--bad)'?'mal':cor==='var(--ok)'?'bem':cor==='var(--muted)'?'sd':cor==='var(--warn)'?'aviso':'';

    '<div class="v"'+(k?'':' style="color:'+cor+'"')+'>'+v+'</div><div class="qs">'+(s||'&nbsp;')+'</div></div>';
}
function czBloco(){

  }
  if(!CZ) h+=kc('Cozinha hoje','—','não consegui ler','var(--muted)');

  else{

    h+=kc('Cozinha hoje',czMin(a.min),sel+(b?' · normal '+czMin(b.min):''),cor);
  }

    return h;
  }
  var ent=PN.entregas||0, ok=PN.no_prazo||0, atr=PN.atrasos||0;
  var pct=ent?Math.round(1000*ok/ent)/10:null;
  var bp=PN.base_n?Math.round(1000*PN.base_ok/PN.base_n)/10:null;
  var cmp='';
  if(pct!=null&&bp!=null){var d=pct-bp; cmp=Math.abs(d)<0.05?'= média':'<span class="'+(d>0?'up':'dn')+'">'+(d>0?'▲':'▼')+' '+Math.abs(d).toFixed(1).replace('.',',')+' vs média</span>';}
  var pf=function(x){return String(x).replace('.',',')+'%';};

  var FOP=frParado('delivery_pedido');

  if(TEP&&!ent&&G){
    /* TrackEat parado: entregas e prazo vem do Gestor de Pedidos do iFood (conta fila_painel, bloco gw),
       mesma regra da aba Prazo pelo iFood. */
    var sd='sem dado desde '+TEP, cz='var(--muted)';
    var gm=G.medidos||0, gok=G.no_prazo||0, gat=gm-gok;
    var gp=gm?Math.round(1000*gok/gm)/10:null, gb=(G.base_n>=20)?Math.round(1000*G.base_ok/G.base_n)/10:null, gc='';
    if(gp!=null&&gb!=null){var gd=gp-gb; gc=Math.abs(gd)<0.05?'= mesmo horário (4 sem.)':'<span class="'+(gd>0?'up':'dn')+'">'+(gd>0?'▲':'▼')+' '+Math.abs(gd).toFixed(1).replace('.',',')+' vs mesmo horário (4 sem.)</span>';}
    h+=kc('Entregas',G.entregas||0,G.ultima_entrega?'última às '+esc(G.ultima_entrega)+' · iFood':'nenhuma ainda · iFood','var(--roxo)')+
       kc('Motoboys','—','o iFood não diz quem levou',cz)+

/* Rota de cada motoboy: a casa = loja, a moto = GPS dele agora (o mesmo da distancia),
   e as entregas que FALTAM numeradas na ordem da rota do TrackEat (coluna sequencia). Entregue some sozinho.
   A linha tracejada liga os pontos em LINHA RETA na ordem da rota - nao e o caminho de rua.
   Mapa montado de novo a cada leitura de 60 s. Mapa de fundo: OpenStreetMap (sem chave), escurecido por filtro
   para combinar com a tela escura. Se a biblioteca do mapa nao carregar, a tela segue sem mapa. */
var MM=[];
function ordemRota(lista){
  var ps=(lista||[]).map(function(p){var c={};for(var k in p)c[k]=p[k];return c;});
  if(ps.length&&ps.every(function(p){return p.seq!=null;})){
    ps.sort(function(a,b){return (Number(a.grupo)||0)-(Number(b.grupo)||0)||a.seq-b.seq;});
    ps.forEach(function(p,i){p._n=i+1;});
  }
  return ps;
}
/* toque no numero do pedido abre os itens.
   O endereco vem do TrackEat (o mesmo que o motoboy ve). Na lista vai rua, numero e bairro; o complemento aparece ao abrir o pedido.
   Os itens vem do Saipos pela porta fila_pedido_itens, SO no toque (sem timer). O Saipos e lido de 10 em 10 min:
   pedido recem-feito pode ainda nao ter itens, e a janela diz isso em vez de mostrar vazio. Sem preco e sem nome de cliente. */
function endCurto(e){ return String(e||'').split(' - Compl:')[0]; }
function endCompl(e){ var i=String(e||'').indexOf(' - Compl:'); return i<0?'':String(e).slice(i+9).trim(); }
function qtd(q){ var n=Number(q); if(!isFinite(n)) return ''; return (n%1===0?String(n):String(n).replace('.',','))+'×'; }
function fechaPedido(){ var m=$('pdm'); if(m) m.remove(); }
async function abrePedido(num){

  var uni=nomeLoja(UNI);
  var d=await rpc('fila_pedido_itens',{p_token:pdgTok(),p_unidade:uni,p_pedido:String(num)});
  if(!$('pdm')||m!==$('pdm')) return;

    var it=Array.isArray(d.itens)?d.itens:[];
    if(!d.tem_venda||!it.length){
      h+='<div class="pa">Os itens deste pedido ainda não chegaram do Saipos — ele é lido de 10 em 10 minutos. Tente de novo daqui a pouco.</div>';
    }else{
      h+=it.map(function(x){
        return '<div class="ii"><span class="qn">'+esc(qtd(x.q))+'</span>'+esc(x.nome)+

var MAPA_FUNDO='https://tile.openstreetmap.org/{z}/{x}/{y}.png', MAPA_ATRIB='© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
function mmIcone(html,cls,st,t){ t=t||22; return L.divIcon({className:'',html:'<div class="'+cls+'"'+(st?' style="'+st+'"':'')+'>'+html+'</div>',iconSize:[t,t],iconAnchor:[t/2,t/2]}); }
/* desenha loja, moto e entregas que faltam (mesma regra do minimapa) dentro de "alvo" (mapa ou camada); devolve os pontos para enquadrar */
function desenhaRota(alvo,d,m,ps,semLinha,apaga){
  var op=apaga?.22:1;
  var cor=(ps[0].grupo&&COR[Number(ps[0].grupo)])||'#E0A81C', pts=[], linha=[], gp=null;
  if(d.loja&&d.loja.lat!=null&&d.loja.lng!=null){ var lj=[+d.loja.lat,+d.loja.lng]; pts.push(lj); L.marker(lj,{icon:mmIcone('🏠','mm-e'),interactive:false}).addTo(alvo); }
  if(m.gps&&m.gps.lat!=null&&m.gps.lng!=null){ gp=[+m.gps.lat,+m.gps.lng]; pts.push(gp); linha.push(gp); }
  ps.forEach(function(p){ var q=[+p.lat,+p.lng]; pts.push(q); linha.push(q); });
  if(linha.length>1&&!semLinha) L.polyline(linha,{color:cor,weight:3,opacity:.9*op,dashArray:'6 6',interactive:false}).addTo(alvo);
  ps.forEach(function(p){ var mk=L.marker([+p.lat,+p.lng],{opacity:op,icon:mmIcone(p._n||'•','mm-n'+(p.atrasado?' late':''),'background:'+cor)})
    .bindTooltip(fichaRua(p,m),{direction:'top',offset:[0,-10],className:'mm-dica'}).on('click',function(){abrePedido(p.pedido);}).addTo(alvo);
    if(MKREG) MKREG[p.pedido]=mk; });
  if(gp) L.marker(gp,{opacity:op,icon:mmIcone('🛵','mm-e'),zIndexOffset:1000,interactive:false}).addTo(alvo);
  return pts;
}
function pontosRota(m){ return ordemRota(m&&m.pedidos).filter(function(p){return p.lat!=null&&p.lng!=null;}); }
/* UM mapa grande com todos os motoboys na rua, cada um na cor da rota dele e o nome junto da moto.
   Toque no quadro de um motoboy (ou no nome dele no mapa): a rota dele fica acesa e as outras apagadas; toque de novo
   volta a todos. O botao "ruas" de cada quadro abre o mapa grande dele (caminho pelas ruas e tempo de cada trecho).
   A leitura de 60 s monta o mapa de novo: se a pessoa mexeu no zoom ou arrastou, o mapa volta onde ela deixou.
   No celular o mapa nao arrasta com um dedo (para a pagina rolar); da para aproximar com dois dedos ou nos botoes +/-. */

function primeiroNome(n){ var p=String(n||'').replace(/^\d+\s+/,'').split(/\s+/); return p[0]||n; }

    if(MV&&(MV.uni!==UNI||MV.dest!==DEST)) MV=null;
    var mp=L.map(el,{zoomControl:true,scrollWheelZoom:false,dragging:!L.Browser.mobile,zoomSnap:0.25});
    MM.push(mp);
    mp.attributionControl.setPrefix(false);
    L.tileLayer(MAPA_FUNDO,{maxZoom:19,className:'mm-fundo',attribution:MAPA_ATRIB}).addTo(mp);
    var todos=[], foco=[];
    if(d.loja&&d.loja.lat!=null&&d.loja.lng!=null){ var lj=[+d.loja.lat,+d.loja.lng]; todos.push(lj); foco.push(lj);
      L.marker(lj,{icon:mmIcone('🏠','mm-e',null,26),zIndexOffset:2000,interactive:false}).addTo(mp); }
    rua.forEach(function(m){
      var ps=pontosRota(m); if(!ps.length) return;
      var apaga=!!DEST&&DEST!==m.motoboy, cor=(ps[0].grupo&&COR[Number(ps[0].grupo)])||'#E0A81C';
      var pts=desenhaRota(mp,{},m,ps,false,apaga);
      todos=todos.concat(pts); if(DEST===m.motoboy) foco=foco.concat(pts);
      var gp=(m.gps&&m.gps.lat!=null&&m.gps.lng!=null)?[+m.gps.lat,+m.gps.lng]:[+ps[0].lat,+ps[0].lng];
      if(!apaga) L.marker(gp,{icon:L.divIcon({className:'',html:'<div class="mm-nome" style="background:'+cor+'">'+esc(primeiroNome(m.motoboy))+'</div>',iconSize:null,iconAnchor:[-14,9]}),zIndexOffset:1500,title:m.motoboy})
        .on('click',function(){ escolheMb(m.motoboy); }).addTo(mp);
    });
    (Array.isArray(d.na_loja)?d.na_loja:[]).forEach(function(p){
      if(p.lat==null||p.lng==null) return;
      var ll=[+p.lat,+p.lng], apaga=!!DEST&&p.motoboy!==DEST;
      MAPA_MK[p.pedido]=L.marker(ll,{opacity:apaga?.22:1,zIndexOffset:p.atrasado?600:400,
                   icon:L.divIcon({className:'',iconSize:[0,0],iconAnchor:[0,0],
                     html:'<div class="mm-l '+(p.onde==='preparo'?'mm-prep':'mm-pron')+(p.atrasado?' late':'')+'">'+esc(p.pedido)+'</div>'})})
        .bindTooltip(fichaLoja(p),{direction:'top',offset:[0,-12],className:'mm-dica'})
        .on('click',function(){ abrePedido(p.pedido); }).addTo(mp);
      todos.push(ll); if(DEST&&p.motoboy===DEST) foco.push(ll);
    });
    /* o 1o movimento e o enquadramento da propria tela; dai em diante so a PESSOA mexe (arrastar, botoes +/-, pinca) */
    var auto=true;
    mp.on('moveend',function(){ if(auto){ auto=false; return; } MV={c:mp.getCenter(),z:mp.getZoom(),uni:UNI,dest:DEST}; });
    MKREG=null;
    if(MV) mp.setView(MV.c,MV.z);
    else{ var alvo=(DEST&&foco.length>1)?foco:todos; if(alvo.length) mp.fitBounds(alvo,{padding:[30,30],maxZoom:16}); else auto=false; }
  }catch(e){ MKREG=null; } }
  try{ atualizaMapa(d); }catch(e){}
}
/* a ficha de cada pedido no mapa: os mesmos dados da lista (numeros, tempo, hora prometida, endereco), nada novo */
function fichaPrazo(p){
  if(!p.prometido||p.falta_prom==null) return '<span class="de">sem hora prometida do iFood</span>';
  var f=+p.falta_prom;
  if(f<0) return '<span class="dr">prometido '+esc(p.prometido)+' · passou '+(-f)+' min</span>';
  return '<span class="'+(f<=10?'da':'dv')+'">entregar até '+esc(p.prometido)+' · '+(f===0?'é agora':(f===1?'falta 1 min':'faltam '+f+' min'))+'</span>';
}
function fichaPed(p,onde){
  return '<b>'+esc(p.pedido)+'</b>'+(p.ifood?' · iFood '+esc(p.ifood):'')+
    '<br>'+onde+
    '<br>entrou '+esc(p.entrou)+' · '+(p.atrasado?'<span class="dr">'+esc(p.min)+' min, passando do normal</span>':esc(p.min)+' min')+
    '<br>'+fichaPrazo(p)+
    (p.end?'<br><span class="de">'+esc(endCurto(p.end))+'</span>':'');
}
function fichaLoja(p){ return fichaPed(p,esc(nomeEtapa(p.onde))+(p.motoboy?' · vai com '+esc(p.motoboy):'')); }
function fichaRua(p,m){
  return fichaPed(p,'na rua com '+esc(m.motoboy)+(p._n?' · '+p._n+'ª entrega':'')+
    (p.onde==='porta'?' · na porta':(p.dist_m!=null?' · a '+kmTxt(+p.dist_m)+' dele':'')));
}
/* Os pedidos da loja aparecem no mapa como etiqueta com o numero do Saipos; o 📍 ao lado do numero na lista leva o mapa
   ate o pedido, aproxima, faz piscar e abre a ficha. O toque no numero continua abrindo os itens.
   "ver todos" volta ao enquadramento de todos os pedidos. */
var MAPA_MK={}, MKREG=null;
function vm(p,reserva){

}
function mapaTodos(){ DEST=null; MV=null;
  var q=document.querySelector('#app .quadros');

function verNoMapa(ped){

function escolheMb(nome){

document.addEventListener('click',function(e){

/* O botao "ruas" de um motoboy abre o mapa grande dele, com zoom (botoes +/-, roda do mouse,
   pinca) e arraste, ja enquadrado perto o bastante para ler as ruas. Toque numa bolinha abre os itens do pedido.
   A cada leitura de 60 s os pontos se atualizam sem mexer no zoom que a pessoa escolheu. Se o motoboy sumir da lista
   na rua, o mapa grande avisa. O caminho pelas ruas e o tempo de cada trecho vem de rotaRuas. */
var MG=null;
function fechaMapa(){ if(!MG) return; try{MG.mp.remove()}catch(e){} if(MG.el) MG.el.remove(); MG=null; }
function abreMapa(nome){
  fechaMapa();
  var d=window.ULT_D; if(!window.L||!d) return;
  var m=(Array.isArray(d.na_rua)?d.na_rua:[]).filter(function(x){return x.motoboy===nome;})[0];
  var ps=pontosRota(m); if(!ps.length) return;
  var w=document.createElement('div'); w.className='pmg'; w.id='pmg';
  w.onclick=function(e){ if(e.target===w) fechaMapa(); };
  w.innerHTML='<div class="cx"><div class="tp"><b>'+esc(nome)+'</b><small id="pmg_h"></small><button class="fx" onclick="fechaMapa()" title="fechar">✕</button></div><div class="av" id="pmg_av" style="display:none"></div><div class="mg" id="pmg_m"></div><div class="lr" id="pmg_l"></div></div>';
  document.body.appendChild(w);
  var mp=L.map($('pmg_m'),{zoomControl:true,zoomSnap:0.5});
  mp.attributionControl.setPrefix(false);
  L.tileLayer(MAPA_FUNDO,{maxZoom:19,className:'mm-fundo',attribution:MAPA_ATRIB}).addTo(mp);
  var cam=L.layerGroup().addTo(mp);
  MG={mp:mp,cam:cam,nome:nome,uni:UNI,el:w,rr:null,pend:null,falhou:null};
  var pts=pintaMapa(d,m,ps);
  mp.invalidateSize();
  mp.fitBounds(pts,{padding:[40,40],maxZoom:17});
  rotaRuas();
}
function atualizaMapa(d){
  if(!MG) return;
  if(MG.uni!==UNI){ fechaMapa(); return; }
  var m=(Array.isArray(d.na_rua)?d.na_rua:[]).filter(function(x){return x.motoboy===MG.nome;})[0];
  var ps=pontosRota(m), av=$('pmg_av');
  if(!ps.length){ if(av){ av.textContent=(m?'Sem entrega com endereço no mapa nesta leitura':'Não aparece mais na rua nesta leitura')+' — o mapa ficou como estava antes.'; av.style.display=''; } return; }
  if(av) av.style.display='none';
  MG.falhou=null;
  pintaMapa(d,m,ps);
  rotaRuas();
}

/* caminho pelas ruas e estimativa do tempo de uma entrega para outra. SO no mapa grande (o minimapa continua em linha reta, sem chamada nova).
   Quem calcula e o servico publico de rotas OSRM, sobre o mapa do OpenStreetMap (gratis, sem chave): caminho de CARRO,
   SEM transito e SEM o tempo parado na porta - por isso a tela escreve "estimativa" e diz isso embaixo.
   Comeca no GPS dele (sem GPS, na loja) e segue a ordem da rota do TrackEat. Uma chamada ao abrir e no maximo uma por
   leitura de 60 s, so quando a moto ou as entregas mudaram. Tempo de um trecho so aparece junto das entregas que ele
   mediu; se o servico nao responder, volta a linha reta e a tela avisa. Nada disso vai para o banco.
   Vai ao OSRM so a coordenada (4 casas, ~10 m), nunca nome nem endereco.
   Em modo demonstracao o servico externo nao e chamado: o tempo e estimado pela linha reta (ver rotaRuas). */
var ROTAS='https://router.project-osrm.org/route/v1/driving/';
function inicioRota(d,m){
  if(m&&m.gps&&m.gps.lat!=null&&m.gps.lng!=null) return {ll:[+m.gps.lat,+m.gps.lng],gps:true};
  if(d&&d.loja&&d.loja.lat!=null&&d.loja.lng!=null) return {ll:[+d.loja.lat,+d.loja.lng],gps:false};
  return null;
}
function chaveRota(ini,ps){ return [ini.ll].concat(ps.map(function(p){return [+p.lat,+p.lng];})).map(function(q){return q[1].toFixed(4)+','+q[0].toFixed(4);}).join(';'); }
function minTxt(s){ return '~'+Math.max(1,Math.round(s/60))+' min'; }
function kmTxt(mt){ return mt<1000?(Math.round(mt/10)*10)+' m':(mt/1000).toFixed(1).replace('.',',')+' km'; }
function pintaMapa(d,m,ps){
  MG.d=d; MG.m=m; MG.ps=ps;
  var ini=inicioRota(d,m), ch=ini?chaveRota(ini,ps):null;
  var rr=(MG.rr&&MG.rr.chave===ch)?MG.rr:null;
  MG.cam.clearLayers();
  var pts=desenhaRota(MG.cam,d,m,ps,!!rr);
  var cor=(ps[0].grupo&&COR[Number(ps[0].grupo)])||'#E0A81C';
  if(rr){
    L.polyline(rr.linha,{color:cor,weight:5,opacity:.95,interactive:false}).addTo(MG.cam);
    ps.forEach(function(p,i){ var lg=rr.legs[i]; if(!lg) return;
      L.circleMarker([+p.lat,+p.lng],{radius:1,opacity:0,fillOpacity:0,interactive:false})
        .bindTooltip(minTxt(lg.duration),{permanent:true,direction:'right',offset:[12,0],className:'mm-tt'}).addTo(MG.cam); });
  }
  $('pmg_h').textContent=rotuloMapa(d,ps);
  listaRota(ini,ps,rr,cor);
  return pts;
}
function listaRota(ini,ps,rr,cor){
  var el=$('pmg_l'); if(!el) return;
  var h;
  if(rr&&rr.reta) h='<div class="nt">Tempo rodando de um ponto ao outro — <b>estimativa</b> pela distância em linha reta (mais 35% pelas curvas, a 22 km/h). Na demonstração o caminho pelas ruas não é calculado: a linha liga os pontos em linha reta.'+(ini&&!ini.gps?' Sem GPS dele: contado a partir da loja.':'')+'</div>';
  else if(rr) h='<div class="nt">Tempo rodando de um ponto ao outro — <b>estimativa</b> do serviço de rotas OSRM (mapa OpenStreetMap): de carro, sem trânsito e sem o tempo parado na porta.'+(ini&&!ini.gps?' Sem GPS dele: contado a partir da loja.':'')+'</div>';
  else if(MG.falhou===chaveRota(ini||{ll:[0,0]},ps)) h='<div class="nt">O serviço de rotas não respondeu agora — o mapa mostra a linha reta, sem tempo estimado. Tenta de novo na próxima leitura.</div>';
  else if(!ini) h='<div class="nt">Sem GPS e sem a posição da loja: não dá para calcular o caminho.</div>';
  else h='<div class="nt">Calculando o caminho pelas ruas…</div>';
  var tot=0, totm=0;
  ps.forEach(function(p,i){
    var lg=rr&&rr.legs[i], de=i===0?(ini&&ini.gps?'🛵':'🏠'):String(ps[i-1]._n||i);
    if(lg){ tot+=lg.duration; totm+=lg.distance; }
    h+='<div class="ln"><span class="sq" style="background:'+cor+'">'+esc(p._n||'•')+'</span>'+
       '<span><span data-ped="'+esc(p.pedido)+'">'+esc(p.pedido)+'</span><div class="ed">'+esc(endCurto(p.end))+'</div></span>'+
       (lg?'<span class="tm">'+esc(de)+' → '+esc(p._n||'')+': '+minTxt(lg.duration)+'<small>'+kmTxt(lg.distance)+' · '+minTxt(tot)+' no total</small></span>':'')+
       '</div>';
  });
  if(rr&&ps.length>1) h+='<div class="ln tt"><span>Até a última entrega</span><span class="tm">'+minTxt(tot)+'<small>'+kmTxt(totm)+' rodando</small></span></div>';
  el.innerHTML=h;
}
async function rotaRuas(){
  if(!MG||!MG.ps) return;
  var ini=inicioRota(MG.d,MG.m); if(!ini) return;
  var ch=chaveRota(ini,MG.ps);
  if((MG.rr&&MG.rr.chave===ch)||MG.pend===ch||MG.falhou===ch) return;
  if(PORTAL_CFG.demo){
    /* demonstracao: sem servico externo de rotas; liga os pontos em linha reta e estima o tempo pela distancia */
    var q=[ini.ll].concat(MG.ps.map(function(p){return [+p.lat,+p.lng];})), legs=[];
    for(var i=1;i<q.length;i++){ var km=teKm(q[i-1][0],q[i-1][1],q[i][0],q[i][1])*1.35; legs.push({distance:km*1000,duration:km/22*3600}); }
    MG.rr={chave:ch,linha:q,legs:legs,reta:true}; MG.pend=null; MG.falhou=null;
    try{ pintaMapa(MG.d,MG.m,MG.ps); }catch(e){}
    return;
  }
  MG.pend=ch; var eu=MG;
  var ac=window.AbortController?new AbortController():null, to=setTimeout(function(){ if(ac) ac.abort(); },10000);
  var rr=null;
  try{
    var r=await fetch(ROTAS+ch+'?overview=full&geometries=geojson&steps=false',ac?{signal:ac.signal}:{});
    var j=r.ok?await r.json():null, ro=j&&j.code==='Ok'&&j.routes&&j.routes[0];
    if(ro&&ro.geometry&&Array.isArray(ro.legs)&&ro.legs.length===ch.split(';').length-1)
      rr={chave:ch,linha:ro.geometry.coordinates.map(function(c){return [c[1],c[0]];}),legs:ro.legs};
  }catch(e){}
  clearTimeout(to);
  if(MG!==eu) return;
  var ini2=inicioRota(MG.d,MG.m);
  if(!ini2||chaveRota(ini2,MG.ps)!==ch) return;   /* resposta de pontos que ja mudaram: a chamada nova cuida */
  MG.pend=null;
  if(rr){ MG.rr=rr; MG.falhou=null; } else MG.falhou=ch;
  try{ pintaMapa(MG.d,MG.m,MG.ps); }catch(e){}
}
/* horas do proprio dado (as mesmas do rodape da tela), nunca o relogio do navegador */
function rotuloMapa(d,ps){
  return ps.length+' entrega'+(ps.length===1?'':'s')+' faltando · '+
    (TEP?'TrackEat sem dado desde '+TEP:'TrackEat lido às '+(d.visto_em||'—')+' · GPS lido às '+(d.gps_visto_em||'—'));
}

/* O numero grande e o do Saipos (o mesmo do TrackEat); ao lado vai o numero curto do iFood (o que o cliente e o Gestor de Pedidos mostram), vindo do banco

function rodape(d){

    '<br>Pedido que não passa pelo TrackEat (balcão, telefone) não aparece aqui.'+

    '<br>O quadradinho colorido é a cor da rota no mapa do TrackEat (mesma regra de cor do site dele): pedidos da mesma cor vão com o mesmo motoboy.'+

    '<br>Toque no número de um pedido (ou na bolinha dele no mapa) para ver os itens, o endereço e o complemento. Os itens vêm do Saipos, lido de 10 em 10 minutos.'+

/* A tela le o banco a cada 60 s (nunca menos que isso) e a leitura do TrackEat roda de minuto em minuto,
   entao o que aparece tem no maximo ~2 min.
   O selo "ao vivo" no topo conta os segundos desde a ultima leitura boa SEM usar a internet (so relogio na tela)
   e fica VERMELHO se passar de 3 min sem conseguir. Os dois timers param quando a aba sai da frente. */
/* quando a fonte parou, a tela diz desde quando em vez de
   mostrar zero e selo verde. Quem sabe desde quando cada fonte parou e o medidor de frescor (fato_frescor,
   ja aberto para leitura; aqui lemos 2 linhas). Lido no maximo 1x a cada 10 min, dentro da leitura normal (sem timer novo). */
var FR=null, FR_EM=0, TEP=null;
async function frPega(){
  if(FR&&Date.now()-FR_EM<600000) return FR;
  try{
    var r=await fetch(SB+'fato_frescor?select=fonte,ultimo_dia,farol&fonte=in.(delivery_entrega,delivery_pedido)',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
    if(r.ok){var o={};(await r.json()).forEach(function(x){o[x.fonte]=x;});FR=o;FR_EM=Date.now();}
  }catch(e){}
  return FR;
}
function frParado(f){var x=FR&&FR[f];if(!x||x.farol!=='PARADO'||!x.ultimo_dia)return null;var p=String(x.ultimo_dia).split('-');return p[2]+'/'+p[1];}
var VEZ=0, OK_EM=0;
async function boot(){
  const t=(function(){try{return sessionStorage.getItem('pdg_token')||''}catch(e){return ''}})();
  const minha=++VEZ, uni=UNI, nome=nomeLoja(UNI);
  const [d,cz,pn]=await Promise.all([rpc('fila_pedidos',{p_token:t,p_unidade:nome}),czPega(),rpc('fila_painel',{p_token:t,p_unidade:nome}),frPega()]);
  if(minha!==VEZ||uni!==UNI) return;   /* trocou de loja no meio: descarta a resposta velha */
  CZ=cz; PN=pn;
  if(d){ OK_EM=Date.now(); desenha(d); } else if(!OK_EM){ desenha(null); }
  selo();
}
function selo(){
  var v=$('vivo'); if(!v) return;
  if(!OK_EM){ v.className='vivo velho'; v.innerHTML='<i></i>sem leitura'; return; }
  if(TEP){ v.className='vivo velho'; v.innerHTML='<i></i>TrackEat sem dado desde '+TEP; return; }
  var s=Math.round((Date.now()-OK_EM)/1000);
  v.className='vivo'+(s>180?' velho':'');
  v.innerHTML='<i></i>'+(s>180?'sem atualizar há '+Math.floor(s/60)+' min':'ao vivo · há '+s+' s');
}

/* ===== porta unica do portal ===== */
const PDGMODS=['fila'];
function pdgTok(){try{return sessionStorage.getItem('pdg_token')||''}catch(e){return ''}}
function pdgSaia(m){try{sessionStorage.setItem('pdg_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace(PORTAL_CFG.url('index.html'))}catch(e){location.replace(PORTAL_CFG.url('index.html'))}}
async function pdgGuarda(){
  const t=pdgTok();
  if(!t){pdgSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'fila'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){pdgSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&PDGMODS.indexOf(m.id)>=0})){pdgSaia('Você não tem acesso a este módulo');return false}
  return true;
}
pdgGuarda().then(function(ok){
  if(!ok) return;
  trocaLoja(UNI);
  var pdgT=setInterval(boot,60000), pdgS=setInterval(selo,1000);   /* pdgS: so relogio na tela, sem rede */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ clearInterval(pdgT); clearInterval(pdgS); pdgT=null; pdgS=null; }
    else if(!pdgT){ boot(); pdgT=setInterval(boot,60000); pdgS=setInterval(selo,1000); }
  });
});
</script>
