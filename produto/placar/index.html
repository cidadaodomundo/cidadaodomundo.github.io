<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="../config.js" data-demo="telas/placar.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F47B3C">
<title>Placar do Delivery · Portal de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Figtree:wght@400;500;600;700&family=Roboto+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Placar do Delivery: painel escuro, números em Oswald; verde-água é a cor do delivery; vermelho e verde só para o que piorou ou melhorou.
   R$ só aparece quando o servidor diz que quem abriu é o dono. */
:root{
  --s0:#111110;--s1:#1a1a19;--s2:#232321;--s3:#2c2c29;--line:#34332f;
  --text:#fbfaf5;--text2:#c3c2b7;--muted:#8a897e;
  --destaque:var(--brand,#F47B3C);--destaque-ink:#111110;--destaque-vela:rgba(244,123,60,.16);
  --deliv:#5aa9a0;--deliv-vela:rgba(90,169,160,.16);
  --l1:var(--brand,#F47B3C);--l2:#5aa9a0;--l3:#9c8fd0;--l4:#d9826b;--l5:#6fa3d9;--l6:#b5c46a;
  --bad:#e66767;--bad-vela:rgba(230,103,103,.14);--ok:#3fb877;--warn:#e5be6d;--warn-vela:rgba(229,190,109,.13);
  --f-num:'Oswald',Impact,'Arial Black',sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-cond:'Roboto Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* seção escondida some mesmo com display:grid/flex próprio */
html,body{background:var(--s0)}
body{color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:22px}
.wrap>*{min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--destaque);outline-offset:2px}
a{color:var(--deliv)}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-family:var(--f-num);font-weight:400;font-size:clamp(30px,6vw,46px);letter-spacing:.5px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--deliv)}
.fonte{font-family:var(--f-cond);font-size:14px;color:var(--muted);letter-spacing:.3px;text-align:right}
.fonte b{color:var(--text2);font-weight:600}
.aviso{background:#3a1f1f;border:1px solid var(--bad);color:#ffd9d9;border-radius:8px;padding:10px 14px;font-weight:600}
.parados{background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--text2);display:grid;gap:4px}
.parados b{color:var(--warn);font-weight:600}

.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
/* Os 4 botões de período: cada um traz o número de pedidos e, no rodapé, o período anterior */
.pers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.per{display:grid;gap:2px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.per:disabled{opacity:.45;cursor:default}
.per[aria-pressed="true"]{border-color:var(--deliv);box-shadow:inset 0 0 0 1px var(--deliv);background:var(--deliv-vela)}
.per .pn{font-family:var(--f-num);font-size:20px;letter-spacing:.4px;text-transform:uppercase;line-height:1.1}
.per[aria-pressed="true"] .pn{color:var(--deliv)}
.per .ps{font-family:var(--f-cond);font-size:13px;color:var(--muted)}
.per .pv{font-weight:600;font-size:15px}
.ft{display:block;font-style:normal;font-family:var(--f-cond);font-weight:600;font-size:13px;line-height:1.25;white-space:normal}
.ft.up{color:var(--ok)} .ft.down{color:var(--bad)} .ft.flat{color:var(--muted)}
.compara{font-size:14px;color:var(--text2)}
.compara b{color:var(--text)}
.compara .obs{color:var(--warn)}
.vivo{background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--deliv);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--text2)}
.mini{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--text2)}
.agora{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ag{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;align-content:start}
.ag b{font-family:var(--f-num);font-weight:400;font-size:26px;line-height:1.1}
.ag b.r{color:var(--bad)}
.ag span{font-size:13px;color:var(--text2)}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-family:var(--f-cond);font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-right:4px}
.chip{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--deliv);border-color:var(--deliv);color:var(--destaque-ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dia{display:flex;align-items:center;gap:6px}
.dia button{background:var(--s2);border:1px solid var(--line);border-radius:8px;width:36px;height:34px;font-size:18px;line-height:1}
.dia button:disabled{opacity:.35;cursor:default}
.dia select{background:var(--s2);color:var(--text);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 10px;font:600 14px var(--f-body)}

.placar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pl{background:var(--s1);padding:16px 18px;display:grid;gap:4px;align-content:start;min-width:0}
.pl .k{font-family:var(--f-cond);font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.pl .v{font-family:var(--f-num);font-size:clamp(26px,4.4vw,40px);line-height:1.05;letter-spacing:.3px;overflow-wrap:anywhere}
.pl .v.ouro{color:var(--destaque)} .pl .v.bad{color:var(--bad)} .pl .v.deliv{color:var(--deliv)} .pl .v.cinza{color:var(--muted)}
.pl .s{font-size:13px;color:var(--text2)}
.delta{font-family:var(--f-cond);font-weight:600;font-size:14px;white-space:nowrap}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}

h2{font-family:var(--f-cond);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);margin:0 0 10px;text-wrap:balance}
h2 small{font-weight:500;letter-spacing:.5px;text-transform:none;color:var(--muted);font-size:14px}

/* O que melhorar: lista de chamados, a faixa da esquerda diz a gravidade */
.acoes{display:grid;gap:8px}
.ac{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px}
.ac.verm{border-left-color:var(--bad)}
.ac.info{border-left-color:var(--muted)}
.ac .tag{grid-row:span 2;align-self:start;font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--warn-vela);color:var(--warn);white-space:nowrap}
.ac.verm .tag{background:var(--bad-vela);color:var(--bad)}
.ac.info .tag{background:var(--s3);color:var(--text2)}
.ac .t{font-weight:600}
.ac .d{font-size:14px;color:var(--text2);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.ac .d a{font-family:var(--f-cond);font-weight:600;font-size:14px;text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}
.vazio{color:var(--muted);font-size:14px;padding:4px 2px}
.mais{background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--text2);font-weight:600;font-size:14px;justify-self:start}

.lojas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
.loja{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.loja h3{margin:0;font-family:var(--f-num);font-weight:400;font-size:24px;letter-spacing:.4px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.loja h3 small{font-family:var(--f-cond);font-size:13px;color:var(--muted);letter-spacing:1px;text-align:right}
.loja.off{background:transparent;border-style:dashed}
.loja.off h3{color:var(--muted)}
.bloco{display:grid;gap:5px;border-top:1px solid var(--line);padding-top:10px}
.bloco .bt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bloco .bt span{font-family:var(--f-cond);font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.bloco .bt a{font-family:var(--f-cond);font-size:13px;text-decoration:none;white-space:nowrap}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ln > span:first-child{color:var(--text2);min-width:0}
.ln b{font-weight:700;text-align:right;white-space:nowrap}
.ln .vv{display:grid;justify-items:end;gap:0}
.ln .vv .ft{font-size:12px}
.ln.ruim b{color:var(--bad)}
.ln.cinza b{color:var(--muted);font-weight:500}
.semdado{color:var(--muted);font-size:14px}

.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.cx{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.cx h3{margin:0;font-family:var(--f-cond);font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--text);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cx h3 a{font-size:13px;font-weight:600;text-transform:none;letter-spacing:.2px;text-decoration:none;white-space:nowrap}
.cx ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.cx li{font-size:14px;color:var(--text2);display:grid;gap:1px;border-bottom:1px solid var(--line);padding-bottom:6px}
.cx li:last-child{border-bottom:0;padding-bottom:0}
.cx li b{color:var(--text);font-weight:600}
.cx li i{font-style:normal;color:var(--muted);font-size:13px}
.cx .nota{font-size:13px;color:var(--muted)}
.horas{display:flex;gap:2px;height:70px}
.horas .col{flex:1;min-width:0;position:relative;height:100%}
.horas .bar{position:absolute;left:0;right:0;bottom:0;background:var(--deliv);border-radius:2px 2px 0 0}
.horas .mk{position:absolute;left:-1px;right:-1px;border-top:2px dashed var(--text)}
.hx{display:flex;gap:2px;font:500 10px var(--f-cond);color:var(--muted)}
.hx span{flex:1;text-align:center;min-width:0}

.graf{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;display:grid;gap:8px}
.graf svg{display:block;width:100%;height:auto}
.graf .ax{fill:var(--muted);font:500 11px var(--f-cond)}
.graf .gl{stroke:var(--line);stroke-width:1}
.graf .sel{fill:var(--deliv-vela)}
.graf rect.hit{fill:transparent;cursor:pointer}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--text2)}
.leg span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px;background:var(--c)}

.tab{overflow-x:auto;background:var(--s1);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.tab table{min-width:900px!important}
.tab th,.tab td{white-space:nowrap!important}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-cond);font-weight:600;text-transform:uppercase;letter-spacing:1px;font-size:12px;color:var(--muted);background:var(--s2)}
td:first-child,th:first-child{text-align:left}
tbody tr{cursor:default}
tbody tr:hover td{background:var(--s2)}
tbody tr.on td{background:var(--deliv-vela)}
td.r{color:var(--bad)} td.z{color:var(--muted)}

.fim{font-size:13px;color:var(--muted);display:grid;gap:6px;max-width:80ch}
.fim b{color:var(--text2)}
/* versão do dono: 6 placas (dinheiro na frente) e o seletor de mês */
.placar.seis{grid-template-columns:repeat(3,minmax(0,1fr))}
.mesl{display:flex;align-items:center;gap:6px}
.mesl select{background:var(--s2);color:var(--text);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 10px;font:600 14px var(--f-body);max-width:100%}
.mesl select.on{border-color:var(--deliv);box-shadow:inset 0 0 0 1px var(--deliv)}
.per .pv small{display:block;font-weight:500;font-size:13px;color:var(--text2)}
/* erros do dia: contagem por tipo e a lista pedido a pedido */
.erros{display:grid;gap:10px}
.eg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.ec{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;align-content:start}
.ec b{font-family:var(--f-num);font-weight:400;font-size:24px;line-height:1.1}
.ec b.r{color:var(--bad)}
.ec span{font-size:13px;color:var(--text2)}
.ec.zero b{color:var(--muted)}
.el{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.el ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.el li{font-size:14px;color:var(--text2);display:grid;gap:1px;border-bottom:1px solid var(--line);padding-bottom:6px}
.el li:last-child{border-bottom:0;padding-bottom:0}
.el li b{color:var(--text);font-weight:600}
.el li i{font-style:normal;color:var(--muted);font-size:13px}
.el .nota{font-size:13px;color:var(--muted)}
@media (max-width:760px){.placar.seis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.placar,.pers{grid-template-columns:repeat(2,minmax(0,1fr))}.fonte{text-align:left}}
@media (max-width:420px){.lojas,.det{grid-template-columns:minmax(0,1fr)}}
/* ---- portal: selo ao vivo, fontes lidas e os blocos novos (tempos, agora, prazo, cancelados, erros) ---- */
.vivobar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-family:var(--f-cond);font-size:13px;color:var(--text2)}
.selo{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--s1);font-weight:600;color:var(--text)}
.selo i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.selo.velho{border-color:var(--bad);color:#ffd9d9}.selo.velho i{background:var(--bad)}
.selo.espera i{background:var(--muted)}
.lidos{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;min-width:0}
.lidos .lbl{margin-right:0}
.lido{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.lido::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.lido.ok::before{background:var(--ok)} .lido.warn::before{background:var(--warn)} .lido.bad::before{background:var(--bad)}
.lido.bad{color:#ffd9d9;border-color:rgba(230,103,103,.5)}
.blk{display:grid;gap:8px}
.blk>.nota,.nota2{font-size:13px;color:var(--muted)}
.tempos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tempos .pl{padding:12px 14px}
.tempos .pl .v{font-size:clamp(24px,3.6vw,36px)}
.tempos .pl .p9{font-family:var(--f-cond);font-size:13px;color:var(--text2)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.duo>*{min-width:0}
.ec .sb{font-size:13px;color:var(--text2)}
.ec.g{border-left:4px solid var(--line)}
.ec.coz{border-left-color:var(--destaque)} .ec.del{border-left-color:var(--deliv)} .ec.cla{border-left-color:var(--muted)}
.ec small.din{display:block;font-size:13px;color:var(--destaque);font-weight:600}
.agora .ag small{font-size:12px;color:var(--muted)}
.ag b.w{color:var(--warn)}
.listas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.listas>*{min-width:0}
.el h4{margin:0;font-family:var(--f-cond);font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.el li{overflow-wrap:anywhere}
.copia{display:grid;gap:6px}
#prazoApi,#cancApi,#errosApi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
#cancApi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media (max-width:760px){#cancApi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.copia textarea{width:100%;min-height:90px;background:var(--s2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:13px var(--f-body)}
@media (max-width:900px){.tempos{grid-template-columns:repeat(3,minmax(0,1fr))}.listas{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.duo{grid-template-columns:minmax(0,1fr)}.agora{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tempos{grid-template-columns:repeat(2,minmax(0,1fr))}.tempos .pl:last-child{grid-column:1/-1}}
/* celular: o valor do mês não pode quebrar no meio do número */
@media (max-width:520px){.placar .pl{padding:12px 12px}.placar .pl .v{font-size:clamp(20px,6vw,26px)}}
/* número + unidade sem quebrar ("antes 14 min"); tempo do iFood por loja; erro repetido em cinza; fonte de evento / fora do horário em cinza */
.nw{white-space:nowrap}
i.ft span.nw,.ag b span.nw,.ag small span.nw{font-size:inherit;color:inherit;font-weight:inherit;font-family:inherit}   /* o span só segura a quebra: cor e tamanho são os de quem está em volta */
.ag b.tl{font-size:20px;line-height:1.2}
.el li.rep b,.el li.rep i,.el li.sl b,.el li.sl i{color:var(--muted)}
.el li.rep b,.el li.sl b{font-weight:500}
.el h4 .repn{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted)}
.lido.ev,.lido.fora{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Placar do <em>Delivery</em></h1>
    <div class="fonte" id="fonte">Carregando…</div>
  </header>
  <div class="vivobar" id="vivobar" hidden>
    <span class="selo espera" id="selo"><i></i>esperando a leitura ao vivo</span>
    <span class="lidos" id="lidos"></span>
  </div>
  <div class="aviso" id="aviso" hidden></div>
  <div class="parados" id="parados" hidden></div>

  <div class="pers" id="pers" role="group" aria-label="Período"></div>
  <div class="ctl">
    <div class="grp" id="lojasel" role="group" aria-label="Loja">
      <span class="lbl">Loja</span>
      <button class="chip" data-l="t">Todas</button>
    </div>
    <label class="mesl" id="mesBox" hidden><span class="lbl">Escolher o mês</span><select id="mesSel"></select></label>
    <button class="mini" id="atualizar" type="button">Atualizar agora</button>
  </div>
  <div class="compara" id="compara"></div>
  <div class="vivo" id="vivo" hidden></div>

  <section class="placar" id="placar" aria-live="polite"><div class="pl"><div class="k">Placar do Delivery</div><div class="s">Carregando os números…</div></div></section>

  <section class="blk" id="secAgora" hidden>
    <h2 id="tAgora">🛵 Agora</h2>
    <div class="agora" id="agora"></div>
  </section>

  <section class="blk" id="secTempos" hidden>
    <h2 id="tTempos">⏱ Tempos</h2>
    <div class="tempos" id="tempos"></div>

<script>
/* O placar inteiro. D = window.PLACAR_DELIVERY (histórico do placar + linhas "vivo.*" da API do iFood por dia e loja).
   DONO vem do servidor (porta placar_delivery_portal): só o dono vê R$, e a versão da equipe nem recebe as chaves de dinheiro.
   As lojas vêm de PORTAL_CFG.lojas (chave = id da loja). Devolve {vivo: fn} para a porta mandar o "hoje" e os blocos ao vivo. */
function placarIniciar(D, DONO){
  DONO = DONO === true;
  var LOJAS = PORTAL_CFG.lojas.map(function(x){ return x.id; });
  var NOME = {}, COR = {}, CURTO = {};
  PORTAL_CFG.lojas.forEach(function(x,i){ NOME[x.id]=x.nome; CURTO[x.id]=x.curto||x.nome; COR[x.id]='var(--l'+(i%6+1)+')'; });
  function nomeL(l){ return NOME[l]||l; }
  // botões de loja: um por loja do config
  (function(){
    var ls=document.getElementById('lojasel'); if(!ls || ls.dataset.feito) return; ls.dataset.feito='1';
    PORTAL_CFG.lojas.forEach(function(x){ var b=document.createElement('button'); b.className='chip'; b.type='button'; b.dataset.l=x.id; b.innerHTML='<span class="dot" style="background:'+COR[x.id]+'"></span>'; b.appendChild(document.createTextNode(x.nome)); ls.appendChild(b); });
  })();
  var PORTAL = PORTAL_CFG.url('index.html');   // as outras telas do portal abrem no lugar do portal inteiro
  var TELA = {
    qualidade:{u:PORTAL+'#qualidade', n:'Como fomos · Qualidade'},
    resolver:{u:PORTAL+'#resolver', n:'Resolver hoje'},
    pausados:{u:PORTAL+'#pausados', n:'Produtos pausados'},
    tempo:{u:PORTAL+'#tempo', n:'Tempo de Entrega'},
    fila:{u:PORTAL+'#fila', n:'Fila de Pedidos'},
    turno:{u:PORTAL+'#turno', n:'Turno do Delivery'},
    escala:{u:PORTAL+'#escala', n:'Escala & Clima'},
    chegada:{u:PORTAL+'#chegada', n:'Chegada do dia'},
    pagamento:{u:PORTAL+'#pagamento', n:'Pagar Motoboys'},
    cobranca:{u:PORTAL+'#cobranca', n:'Cobrança na Porta'},
    parceiro:{u:'https://portal.ifood.com.br/', n:'Portal do Parceiro iFood', fora:1}
  };
  function link(t,txt){ var x=TELA[t]; var fora=!!x.fora; return '<a href="'+x.u+'" target="'+(fora?'_blank':'_top')+'"'+(fora?' rel="noopener"':'')+'>'+esc(txt||x.n)+' ↗</a>'; }

  if(!D || !D.linhas || !D.linhas.length || !D.chaves){
    document.getElementById('placar').innerHTML='<div class="pl"><div class="k">Sem dados</div><div class="s">O banco ainda não tem o histórico do placar guardado. Abra de novo em alguns minutos.</div></div>';
    document.getElementById('fonte').textContent='';
    return null;
  }

  // ---------- dados por dia ----------
  var K={}; D.chaves.forEach(function(c,i){ K[c]=i; });
  var idx={}, dias=[];
  D.linhas.forEach(function(r){ if(!idx[r[0]]){ idx[r[0]]={}; dias.push(r[0]); } idx[r[0]][r[1]]=r[2]; });
  dias.sort();
  var ONTEM = D.ontem, ultimo = dias[dias.length-1];
  // o histórico da API do iFood (tabela placar_delivery_dia_extra) entra nas mesmas linhas com chaves "vivo.<nome>"
  var EXTRA_INI = (function(){ var i=D.chaves.indexOf('vivo.pedidos_api'); if(i<0) return null; var m=null; D.linhas.forEach(function(r){ var y=r[2][i]; if(y!=null && (m==null || r[0]<m)) m=r[0]; }); return m; })();
  var DET = D.det || {};
  // "Hoje até agora" e "ontem até a mesma hora" entram como dois dias de mentira, 'H' e 'H0', com as mesmas chaves do placar diário
  var HJ = null;
  function carregaHoje(h){
    if(!h || !h.lojas || !h.dia || !h.ate) return false;
    HJ = h; idx.H = {}; idx.H0 = {};
    LOJAS.forEach(function(l){
      var x=h.lojas[l]; if(!x) return;
      [['H',x.hoje],['H0',x.ontem]].forEach(function(p){
        var o=p[1]; if(!o) return;
        // prazo de hoje: entregues + os que já passaram da hora prometida e ainda não foram entregues (senão o atraso só aparece depois)
        var ase=o.atrasados_sem_entrega||0, den=(o.medidos||0)+ase;
        var m={
          'vendas.pedidos_delivery':o.pedidos, 'vendas.pedidos_ifood':o.pedidos_ifood,
          'vendas.vendido_delivery':o.vendido, 'vendas.vendido_ifood':o.vendido_ifood,
          'vendas.vendido_fora_ifood': (o.vendido!=null && o.vendido_ifood!=null) ? o.vendido-o.vendido_ifood : null,
          'vendas.pedidos_fora_ifood': (o.pedidos!=null && o.pedidos_ifood!=null) ? o.pedidos-o.pedidos_ifood : null,
          'prazo.pedidos_medidos':den, 'prazo.pedidos_no_prazo':o.no_prazo,
          'prazo.pct_no_prazo': den>0 ? o.no_prazo/den*100 : null,
          'prazo.pedidos_atrasados': den>0 ? den-o.no_prazo : null,
          'prazo.atrasados_mais_30min': den>0 ? o.atr30 : null,
          'cancelamentos.cancelados_total':o.cancelados, 'cancelamentos.pedidos_delivery':(o.pedidos||0)+(o.cancelados||0),
          'clientes.reclam_ifood':o.reclam, 'clientes.reclam_atraso_cancelar':o.reclam_atraso,
          'hoje.atrasados_sem_entrega':o.atrasados_sem_entrega
        };
        if(p[0]==='H'){ m['loja_ifood.itens_pausados_fim_dia']=x.pausados_agora; m['loja_ifood.faixa_tempo_max_min']=x.tempo_ifood_maior_hoje; m['hoje.tempo_agora']=x.tempo_ifood_agora; }
        idx[p[0]][l]=m;
      });
    });
    return true;
  }
  carregaHoje(D.hoje);
  // ---------- blocos ao vivo (porta parte 'vivo'): medidas M de hoje e de ontem até a mesma hora, o "agora" e as listas ----------
  var VV = null, AG = {}, FONTES = null, FONTES_EM = null, FONTES_TIPO = null, FONTES_FALHA = null, GERADO = null, VINC = false;
  // leitura ao vivo incompleta (sem vivo.lojas ou de outro dia): nada do vivo anterior fica na tela (VINC avisa "números de hoje podem estar velhos")
  function zeraVivo(){ VV = null; AG = {}; FONTES = null; FONTES_EM = null; FONTES_TIPO = null; FONTES_FALHA = null; GERADO = null; }
  function carregaVivo(r){
    if(!r || !r.vivo || !r.vivo.lojas || !HJ || r.dia!==HJ.dia){ zeraVivo(); VINC = true; return false; }
    VINC = false;
    VV = r.vivo; AG = {}; FONTES = r.fontes || null; FONTES_EM = r.fontes_em || null; FONTES_TIPO = r.fontes_tipo || null; GERADO = r.gerado || null;
    // fontes_falha {fonte:"HH:MI"}: o banco viu FALHA da leitura mais nova que o último OK (últimos 30 min) — a bolinha fica vermelha "falhou às HH:MI"
    FONTES_FALHA = r.fontes_falha && typeof r.fontes_falha==='object' ? r.fontes_falha : null;
    LOJAS.forEach(function(l){
      var x=VV.lojas[l]; if(!x) return;
      [['H',x.hoje],['H0',x.ontem]].forEach(function(p){
        var o=p[1]; if(!o) return;
        idx[p[0]][l]=idx[p[0]][l]||{};
        Object.keys(o).forEach(function(k){ if(o[k]==null || typeof o[k]==='object') return; idx[p[0]][l]['vivo.'+k]=o[k]; });
        // base da taxa de cancelamento do Hoje pelo mesmo critério do bloco 🚫 (pedidos do Saipos + cancelados da API e do Saipos)
        if(o.cancelados!=null) idx[p[0]][l]['vivo.pedidos_mais_canc']=(+(idx[p[0]][l]['vendas.pedidos_delivery']||0))+(+o.cancelados);
      });
      if(x.agora){ AG[l]=x.agora;
        // "passaram da hora e não foram entregues" de agora pela API do iFood: o Por loja usa este (o mesmo do 🛵 Agora); o do placar antigo só sem o ao vivo
        if(x.agora.atrasados_sem_entrega!=null){ idx.H[l]=idx.H[l]||{}; idx.H[l]['vivo.ag_atras']=x.agora.atrasados_sem_entrega; }
      }
    });
    return true;
  }
  function v(d,l,k){
    if(k.slice(0,4)==='hib.') return hib(d,l,k.slice(4));
    if(k.slice(0,4)==='hbc.') return hbc(d,l,k.slice(4));
    var x=idx[d]&&idx[d][l]; if(!x) return null;
    if(!Array.isArray(x)){ var z=x[k]; return z==null?null:+z; }
    var i=K[k]; if(i==null) return null; var y=x[i]; return (y==null)?null:+y;
  }
  function abriu(d,l){ var p=v(d,l,'vendas.pedidos_delivery'); return p!=null && p>0; }
  // prazo: onde o dia (ou o hoje) tem a API do iFood, a conta é a do bloco ✅ Prazo (entregue × prometido); antes disso, a do Gestor do iFood
  var HIB_API={medidos:'vivo.prazo_medidos', no_prazo:'vivo.prazo_no_prazo', atrasados:'vivo.prazo_atrasados', atr30:'vivo.prazo_atr30'};
  var HIB_GW={medidos:'prazo.pedidos_medidos', no_prazo:'prazo.pedidos_no_prazo', atrasados:'prazo.pedidos_atrasados', atr30:'prazo.atrasados_mais_30min'};
  function prazoApi(d,l){ return v(d,l,'vivo.pedidos_api')!=null && v(d,l,'vivo.prazo_medidos')!=null; }
  function hib(d,l,n){
    var api=prazoApi(d,l);
    if(n==='api') return api?1:0;
    if(n==='pct'){ if(!api) return v(d,l,'prazo.pct_no_prazo'); var md=v(d,l,'vivo.prazo_medidos'), ok=v(d,l,'vivo.prazo_no_prazo'); return md>0 && ok!=null ? ok/md*100 : null; }
    return v(d,l,(api?HIB_API:HIB_GW)[n]);
  }
  // de onde veio o prazo de um conjunto de células (só as que têm medida): 'api', 'gw', 'misto' ou null
  function fontePrazo(C){ var a=0,g=0; C.forEach(function(x){ if(v(x[0],x[1],'hib.pct')==null) return; if(prazoApi(x[0],x[1])) a++; else g++; }); return a&&g ? 'misto' : a ? 'api' : g ? 'gw' : null; }
  // cancelados: onde o dia (ou o hoje) tem a API do iFood, a conta é a do bloco 🚫 Cancelados (API e Saipos); antes disso, a do placar (Saipos e Gestor do iFood).
  // Assim o quadro de cima, o Por loja, a tabela e o gráfico dizem o mesmo número do 🚫 no mesmo período.
  var HBC_API={tot:'vivo.cancelados', loja:'vivo.cancel_culpa_loja', cli:'vivo.cancel_cliente', val:'vivo.valor_cancelado'};
  var HBC_PL={tot:'cancelamentos.cancelados_total', loja:'cancelamentos.cancel_culpa_loja', cli:'cancelamentos.cancel_culpa_cliente', val:'vendas.valor_cancelado'};
  function cancApi(d,l){ return v(d,l,'vivo.pedidos_api')!=null && v(d,l,'vivo.cancelados')!=null; }
  function hbc(d,l,n){
    var api=cancApi(d,l);
    if(n==='base'){ if(!api) return v(d,l,'cancelamentos.pedidos_delivery'); return (v(d,l,'vendas.pedidos_delivery')||0)+v(d,l,'vivo.cancelados'); }   // mesma base do 🚫 (pedidos do Saipos + cancelados)
    return v(d,l,(api?HBC_API:HBC_PL)[n]);
  }
  // de onde veio o número de cancelados de um conjunto de células: 'api', 'pl' (placar antigo), 'misto' ou null
  function fonteCanc(C){ var a=0,g=0; C.forEach(function(x){ if(hbc(x[0],x[1],'tot')==null) return; if(cancApi(x[0],x[1])) a++; else g++; }); return a&&g ? 'misto' : a ? 'api' : g ? 'pl' : null; }
  var PRIMEIRO = dias.filter(function(d){ return LOJAS.some(function(l){ return abriu(d,l); }); })[0] || ONTEM;   // 1º dia do histórico com venda
  // 1º dia do histórico com valor numa chave (nada de data digitada na tela): só vale como "começou em" se for depois do 1º dia com venda
  function primeiroCom(k){ var d0=dias.filter(function(d){ return LOJAS.some(function(l){ return v(d,l,k)!=null; }); })[0]; return d0 && d0>PRIMEIRO ? d0 : null; }
  var RECLAM_INI = primeiroCom('clientes.reclam_ifood'), PRAZO_INI = primeiroCom('prazo.pedidos_medidos');

  // ---------- formatos ----------
  var int = new Intl.NumberFormat('pt-BR');
  var dec1 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
  var brl = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
  var brl2 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
  var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var SEM=['dom','seg','ter','qua','qui','sex','sáb'];
  var SEMX=['domingos','segundas','terças','quartas','quintas','sextas','sábados'];
  function dt(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function addDias(s,n){ var d=dt(s); d.setDate(d.getDate()+n); return iso(d); }
  function dm(s){ var d=dt(s); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
  function rot(s){ return SEM[dt(s).getDay()]+' '+dm(s); }
  // texto que vem do banco: na versão da equipe, valor em dinheiro que sobrou num texto (inclusive o "R$ —" da máscara do banco) vira [valor]
  function esc(s){ s=String(s==null?'':s); if(!DONO) s=s.replace(/R\$\s?(—|-?[\d.,]*\d)?/g,'[valor]'); return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmt(x,un){
    if(x==null || isNaN(x)) return '—';
    if(un==='%') return dec1.format(x)+'%';
    if(un==='R$') return brl.format(x);
    if(un==='R$c') return brl2.format(x);
    if(un==='min') return int.format(Math.round(x))+' min';
    if(un==='nota') return dec1.format(x);
    if(un==='d1') return dec1.format(x);
    return int.format(Math.round(x));
  }
  function juntaE(a){ return a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+' e '+a[a.length-1]; }   // "A, B e C"
  function fmtRef(x,un){ if(un==='n' && Math.round(x)!==x) return dec1.format(x); return fmt(x,un); }

  // ---------- relógio do restaurante, horário de Brasília (a página pode ser aberta em qualquer fuso) ----------
  function agoraLoc(){
    try{
      var p={}; new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){ p[x.type]=x.value; });
      return new Date(+p.year,+p.month-1,+p.day,(+p.hour)%24,+p.minute);
    }catch(e){ var d=new Date(); return new Date(d.getTime()+(d.getTimezoneOffset()-180)*60000); }
  }
  function diaOp(){ var a=agoraLoc(); a.setHours(a.getHours()-5); return iso(a); }   // o dia de operação começa às 5h
  // um "HH:MM" do hoje na hora local (de 0h a 4h59 já é a madrugada seguinte)
  function quandoHJ(hhmm){ var p=String(hhmm||'').split(':'); if(p.length<2 || !HJ) return null; var d=dt(HJ.dia); if(+p[0]<5) d.setDate(d.getDate()+1); d.setHours(+p[0],+p[1]); return d; }
  function idadeMin(hhmm){ var q=quandoHJ(hhmm); return q ? (agoraLoc()-q)/60000 : null; }
  function tempoTxt(min){ min=Math.max(0,Math.round(min)); return min<60 ? min+' min' : Math.floor(min/60)+'h'+(min%60?String(min%60).padStart(2,'0'):''); }
  // o "hoje" guardado só vale se for do dia de operação de agora (senão é a foto de outro dia)
  function hojeVale(){ return !!(HJ && HJ.dia===diaOp()); }

  // ---------- métricas (sem nenhum valor em R$) ----------
  // t: soma | razao (n/dn) | pond (média pesada por w) | ultimo (último dia do período) | max
  // cond: só conta loja/dia que tem essa chave (ex.: prazo só onde houve medida)
  var M = {
    vendido:{r:'Vendido no delivery', un:'R$', bom:1, t:'soma', k:'vendas.vendido_delivery'},
    v_ifood:{r:'· pelo iFood', un:'R$', bom:0, t:'soma', k:'vendas.vendido_ifood'},
    v_site:{r:'· pelo site próprio', un:'R$', bom:1, t:'soma', k:'vendas.vendido_fora_ifood'},
    ticket:{r:'Ticket médio', un:'R$c', bom:1, t:'razao', n:'vendas.vendido_delivery', dn:'vendas.pedidos_delivery'},
    v_cancel:{r:'Valor dos cancelados', un:'R$', bom:-1, t:'soma', k:'hbc.val', hbc:1},
    v_cancel_loja:{r:'· por culpa da loja (pago pelo cliente no iFood)', un:'R$', bom:-1, t:'soma', k:'cancelamentos.valor_cancel_culpa_loja'},
    v_devolvido:{r:'Devolvido ao cliente (parcial)', un:'R$c', bom:-1, t:'soma', k:'cancelamentos.valor_devolvido_parcial'},
    pedidos:{r:'Pedidos de delivery', un:'n', bom:1, t:'soma', k:'vendas.pedidos_delivery'},
    p_ifood:{r:'· pelo iFood', un:'n', bom:0, t:'soma', k:'vendas.pedidos_ifood'},
    p_site:{r:'· pelo site próprio', un:'n', bom:1, t:'soma', k:'vendas.pedidos_fora_ifood'},
    almoco:{r:'Pedidos do dia (até 18h)', un:'n', bom:1, t:'soma', k:'vendas.pedidos_almoco'},
    noite:{r:'Pedidos da noite', un:'n', bom:1, t:'soma', k:'vendas.pedidos_noite'},
    prazo:{r:'No prazo', un:'%', bom:1, t:'razao', n:'hib.no_prazo', dn:'hib.medidos', mult:100, cond:'hib.pct', hib:1},
    medidos:{r:'Entregas medidas', un:'n', bom:0, t:'soma', k:'hib.medidos', cond:'hib.pct', hib:1},
    atrasados:{r:'Atrasaram', un:'n', bom:-1, t:'soma', k:'hib.atrasados', cond:'hib.pct', hib:1},
    atr30:{r:'Mais de 30 min atrasados', un:'n', bom:-1, t:'soma', k:'hib.atr30', cond:'hib.pct', hib:1},
    sem_baixa:{r:'Entregas sem baixa no iFood (3 h+)', un:'n', bom:-1, t:'soma', k:'prazo.pedidos_sem_baixa_3h', cond:'prazo.pct_no_prazo'},
    t_total:{r:'Do pedido à entrega (tempo do meio)', un:'min', bom:-1, t:'pond', k:'prazo.tempo_total_mediana_min', w:'prazo.pedidos_medidos'},
    t_sair:{r:'Até sair da loja (tempo do meio)', un:'min', bom:-1, t:'pond', k:'prazo.tempo_ate_sair_mediana_min', w:'prazo.pedidos_medidos'},
    t_rua:{r:'Na rua (tempo do meio)', un:'min', bom:-1, t:'pond', k:'prazo.tempo_rua_mediana_min', w:'prazo.pedidos_medidos'},
    t_prom:{r:'Prazo prometido (tempo do meio)', un:'min', bom:0, t:'pond', k:'prazo.prazo_prometido_mediana_min', w:'prazo.pedidos_medidos'},
    faixa:{r:'Tempo mostrado no iFood (média)', un:'min', bom:-1, t:'pond', k:'loja_ifood.faixa_tempo_media_min', w:'vendas.pedidos_delivery'},

  function celulas(Ds,L){ var c=[]; Ds.forEach(function(d){ L.forEach(function(l){ c.push([d,l]); }); }); return c; }
  function aggC(m,C){
    var s=M[m];
    if(s.t==='soma'){ var t=null; C.forEach(function(x){ if(s.cond && v(x[0],x[1],s.cond)==null) return; (s.ks||[s.k]).forEach(function(k){ var y=v(x[0],x[1],k); if(y!=null) t=(t||0)+y; }); }); return t; }

  // ---------- períodos: Hoje · Ontem · Semana · Mês, sempre contra o período anterior do mesmo tamanho ----------
  function faixa(a,b){ var out=[], d=a; while(d<=b){ out.push(d); d=addDias(d,1); } return out; }
  function fimMes(ano,mes){ return new Date(ano,mes,0).getDate(); }  // mes 1-12
  function periodo(p){
    if(p==='hoje'){
      var ate = HJ ? HJ.ate : '—';
      return {D:['H'], A:['H0'], rot:'hoje até '+ate, rotA:'ontem até '+ate, sub:'até '+ate};
    }
    if(p==='ontem'){ var a0=addDias(ONTEM,-1); return {D:[ONTEM], A:[a0], rot:rot(ONTEM), rotA:rot(a0), sub:rot(ONTEM)}; }
    if(p==='semana'){
      var seg=addDias(ONTEM,-((dt(ONTEM).getDay()+6)%7)), Ds=faixa(seg,ONTEM);
      var As=Ds.map(function(d){ return addDias(d,-7); });
      return {D:Ds, A:As, rot:Ds.length>1? rot(seg)+' a '+rot(ONTEM) : rot(seg), rotA:As.length>1? rot(As[0])+' a '+rot(As[As.length-1]) : rot(As[0]), sub:Ds.length>1? dm(seg)+' a '+dm(ONTEM) : dm(seg)};
    }
    if(p.slice(0,2)==='m:') return periodoMes(p.slice(2));
    var d1=ONTEM.slice(0,8)+'01', Dm=faixa(d1,ONTEM);
    var y=+ONTEM.slice(0,4), mo=+ONTEM.slice(5,7), py=mo===1?y-1:y, pm=mo===1?12:mo-1;
    var n=Math.min(Dm.length, fimMes(py,pm)), pa=py+'-'+String(pm).padStart(2,'0')+'-01';
    var Am=faixa(pa, addDias(pa,n-1));
    if(Dm.length===1) return {D:Dm, A:Am, rot:rot(d1), rotA:rot(Am[0]), sub:dm(d1)};
    return {D:Dm, A:Am, rot:dm(d1)+' a '+dm(ONTEM), rotA:dm(Am[0])+' a '+dm(Am[Am.length-1]), sub:dm(d1)+' a '+dm(ONTEM)};
  }
  // um mês inteiro escolhido no seletor (o mês de agora vai só até ontem), contra o mês anterior dia com dia
  function nomeMes(ym){ return MESES[+ym.slice(5,7)-1]+' de '+ym.slice(0,4); }
  function periodoMes(ym){
    var y=+ym.slice(0,4), mo=+ym.slice(5,7), ini=ym+'-01', fim=ym+'-'+String(fimMes(y,mo)).padStart(2,'0');
    if(fim>ONTEM) fim=ONTEM;
    var Dm=faixa(ini,fim), py=mo===1?y-1:y, pm=mo===1?12:mo-1, pa=py+'-'+String(pm).padStart(2,'0')+'-01';
    var n=Math.min(Dm.length, fimMes(py,pm)), Am=faixa(pa, addDias(pa,n-1));
    var d0=dias.filter(function(d){ return d.slice(0,7)===ym && LOJAS.some(function(l){ return abriu(d,l); }); })[0], parcial = d0 && d0>ini ? ' (o histórico começa em '+dm(d0)+')' : '';
    return {D:Dm, A:Am, rot:nomeMes(ym)+(fim<ym+'-'+String(fimMes(y,mo)).padStart(2,'0')?' (até '+dm(fim)+')':'')+parcial, rotA:nomeMes(pa.slice(0,7))+(n<fimMes(py,pm)?' (até '+dm(Am[Am.length-1])+')':''), sub:dm(ini)+' a '+dm(fim), mes:ym};
  }
  // meses que têm dia no histórico (do mais novo para o mais velho)
  function mesesComDado(){ var o=[]; dias.forEach(function(d){ var ym=d.slice(0,7); if(o.indexOf(ym)<0 && LOJAS.some(function(l){ return abriu(d,l); })) o.push(ym); }); return o.sort().reverse(); }
  function lojasNo(Ds){ return Lsel().filter(function(l){ return Ds.some(function(d){ return abriu(d,l); }); }); }
  // ---------- comparação com o período anterior ----------
  // Justa: dia com dia (1º com 1º, 2º com 2º...) e só a loja que vendeu nos dois dias do par.
  // Loja fechada de um lado sai da conta dos dois lados, e o rodapé avisa ("só ...").
  function pares(P){ var n=Math.min(P.D.length,P.A.length), o=[]; for(var i=0;i<n;i++) o.push([P.D[i],P.A[i]]); return o; }
  // candidata: a loja vendeu nesse dia e tem a chave de condição (cond)
  function celCand(m,d,l){
    if(!abriu(d,l)) return false;
    var s=M[m]; if(s.cond && v(d,l,s.cond)==null) return false;
    if(AVAL[m] && d!=='H' && d!=='H0' && avalIncompleta(d,l)) return false;
    return true;
  }
  // entra na conta: candidata E com o valor da própria medida (senão um lado junta lojas que o outro não tem e o "antes" mente)
  function temValor(m,d,l){
    var s=M[m];
    if(s.t==='pond') return v(d,l,s.k)!=null && (v(d,l,s.w)||0)>0;
    if(s.t==='razao') return v(d,l,s.n)!=null && (v(d,l,s.dn)||0)>0;
    return true;
  }
  function celOk(m,d,l){ return celCand(m,d,l) && temValor(m,d,l); }
  // Lref: as lojas escolhidas na tela; loja que vendeu antes e agora não também tira a comparação do "todas"
  function compara(m,P,L,Lref){
    var s=M[m], aval=AVAL[m] && P.D.length>1;
    var CD=celulas(P.D,L); if(aval) CD=CD.filter(function(x){ return !avalIncompleta(x[0],x[1]); });
    var r={a0:aggC(m,CD), a:null, b:null, nota:'', fech:false, rotB:'antes', semAval:aval && CD.length<celulas(P.D,L).length};
    if(r.a0==null) return r;
    if(s.t==='ultimo'){   // foto do fim do período (itens pausados): última foto contra última foto
      var DA=P.A;
      if(P.D[0]==='H'){ DA=[ONTEM]; r.rotB=(ONTEM===addDias(HJ.dia,-1)?'ontem':rot(ONTEM))+' no fim do dia'; }
      r.a=r.a0; r.b=agg(m,DA,L); return r;
    }
    var CA=[], CB=[], lojas={}, candL={}, diasP={}, diasT={}, cand=0;
    CD.forEach(function(x){ if(celOk(m,x[0],x[1])) diasT[x[0]]=1; });
    pares(P).forEach(function(p){ L.forEach(function(l){
      if(!celCand(m,p[0],l)) return; candL[l]=1;   // loja que abriu mas não tem a medida: fica fora dos DOIS lados e o rodapé diz "só ..."
      if(!celOk(m,p[0],l)) return; cand++;
      if(celOk(m,p[1],l)){ CA.push([p[0],l]); CB.push([p[1],l]); lojas[l]=1; diasP[p[0]]=1; }
    }); });
    if(!CA.length){ r.semHist = P.A[0]!=='H0' && P.A.every(function(d){ return d<PRIMEIRO; }); r.fech = !r.semHist && !L.some(function(l){ return P.A.some(function(d){ return abriu(d,l); }); }); r.semApi = !!(s.api && P.A[0]!=='H0' && (!EXTRA_INI || P.A.every(function(d){ return d<EXTRA_INI; }))); return r; }
    r.a=aggC(m,CA); r.b=aggC(m,CB);
    if(s.hib){ var fa=fontePrazo(CA), fb=fontePrazo(CB); if(fa!==fb) r.rotB='antes ('+(fb==='api'?'API do iFood':fb==='gw'?'Gestor do iFood':'API e Gestor')+')'; }
    if(s.hbc){ var ga=fonteCanc(CA), gb=fonteCanc(CB); if(ga!==gb) r.rotB='antes ('+(gb==='api'?'API do iFood':gb==='pl'?'Saipos e Gestor':'API, Saipos e Gestor')+')'; }
    var Lc=L.filter(function(l){ return lojas[l]; }), nT=Object.keys(diasT).length, nP=Object.keys(diasP).length;
    var fora=(Lref||L).filter(function(l){ return L.indexOf(l)<0 && P.A.some(function(d){ return abriu(d,l); }); });
    // loja que entrou no número grande sem par na comparação (ex.: cancelado numa loja sem venda no Saipos hoje): o rodapé também diz "só ..."
    var semPar=L.filter(function(l){ if(lojas[l]) return false; var y=aggC(m,CD.filter(function(x){ return x[1]===l; })); return y!=null && y!==0; });
    var notas=[];
    if(Lc.length<Object.keys(candL).length || fora.length || semPar.length) notas.push('só '+juntaE(Lc.map(function(l){ return CURTO[l]; })));
    if(nP<nT) notas.push(nP+' de '+nT+' dias');
    if(!notas.length && CA.length<cand) notas.push('só dias com venda nos dois');
    r.nota=notas.join(', ');
    return r;
  }
  function variacao(m,a,b){
    var s=M[m], dif=a-b, txt, cls='flat';
    if(fmtRef(a,s.un)===fmtRef(b,s.un)) return {txt:'igual', cls:cls};
    if(s.un==='%'||s.pts) txt=(dif>0?'▲ ':'▼ ')+dec1.format(Math.abs(dif))+(s.un==='%'?' pontos':'');
    else if(s.un==='min') txt=(dif>0?'▲ ':'▼ ')+int.format(Math.abs(Math.round(a)-Math.round(b)))+' min';   // a diferença dos números que aparecem (17 contra 18 = ▼ 1 min)

  function fonteCurta(f){ if(!f) return null; var a=[]; String(f).split(' + ').forEach(function(x){ x=x.trim(); var c=FONTE_CURTA[x]||x; if(c && a.indexOf(c)<0) a.push(c); }); return a.length ? 'visto em: '+a.join(', ') : null; }

    var out=a.filter(function(x){ return x.tipo!=='aval'; }); out.push(j);

/* ===== porta única do portal (molde: fila/index.html) =====
   Ao abrir: placar_delivery_portal {parte:'historico'} (o placar guardado + as linhas da API do iFood por dia e loja).
   Depois: {parte:'vivo', ja_tenho} de 60 em 60 s, só com a aba visível (aba escondida = relógio parado; volta quando aparece).
   {"igual":true} = nada mudou no banco desde a última leitura. */
const SB=PORTAL_CFG.rest;
const KEY=PORTAL_CFG.chave;
const PDGMODS=['placar'];
const MINIMO_MS=60000;   /* regra do portal: nunca buscar no banco com menos de 60 s */
function pdgTok(){try{return sessionStorage.getItem('pdg_token')||''}catch(e){return ''}}
function pdgSaia(m){try{sessionStorage.setItem('pdg_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace(PORTAL_CFG.url('index.html'))}catch(e){location.replace(PORTAL_CFG.url('index.html'))}}
async function pdgGuarda(){
  const t=pdgTok();
  if(!t){pdgSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'placar'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){pdgSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&PDGMODS.indexOf(m.id)>=0})){pdgSaia('Você não tem acesso a este módulo');return false}
  return true;
}
async function porta(nome,dados){
  const r=await fetch(SB+'rpc/'+nome,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:pdgTok(),p_dados:dados})});
  if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('porta '+r.status))}
  return await r.json();
}

/* junta o histórico do placar com as linhas da tabela placar_delivery_dia_extra: cada chave da API vira "vivo.<nome>"
   na mesma linha dia × loja. Linha da API sem dia/loja no placar fica de fora (o placar da manhã ainda não fechou o dia). */
function mesclaExtra(placar, extra){
  if(!placar || !Array.isArray(placar.linhas) || !Array.isArray(placar.chaves)) return placar||null;
  const ek=(extra && Array.isArray(extra.chaves)) ? extra.chaves : [], n0=placar.chaves.length;
  const out=Object.assign({}, placar);
  out.chaves=placar.chaves.concat(ek.map(function(k){return 'vivo.'+k}));
  const pos={};
  out.linhas=placar.linhas.map(function(r,i){
    pos[r[0]+'|'+r[1]]=i;
    const a=(Array.isArray(r[2])?r[2]:[]).slice(0,n0); while(a.length<n0) a.push(null);
    for(let j=0;j<ek.length;j++) a.push(null);
    return [r[0],r[1],a];
  });
  let fora=0;
  ((extra && extra.linhas) || []).forEach(function(e){
    const i=pos[e[0]+'|'+e[1]]; if(i==null){ fora++; return; }
    const vs=Array.isArray(e[2])?e[2]:[];
    for(let j=0;j<ek.length;j++) out.linhas[i][2][n0+j]=(vs[j]===undefined?null:vs[j]);
  });
  out.extra_fora=fora;
  return out;
}

let PLACAR=null, QUANDO=null, ULT=0, T=null, OCUPADO=false, LIBERADO=false, DIA0=null;
/* dia de operação (05h às 05h, hora local) e a hora de agora em minutos */
function relogio(){
  try{ const p={}; new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
    const d=new Date(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute)); const op=new Date(d.getTime()-5*3600000);
    return {dia:op.toISOString().slice(0,10), min:(+p.hour)*60+(+p.minute)}; }catch(e){ return {dia:'',min:0}; }
}
function erroTela(msg){
  const el=document.getElementById('placar');

async function abreHistorico(){

    const r=await porta('placar_delivery_portal',{parte:'vivo',ja_tenho:QUANDO});
    if(r && r.igual){ PLACAR.selo({conf:new Date()}); PLACAR.refresca(); }
    else if(r){ if(r.quando!=null) QUANDO=r.quando; PLACAR.vivo(r); PLACAR.selo({conf:new Date()}); }
  }catch(e){ PLACAR.selo({erro:(e&&e.message)||'erro'}); }
  finally{ OCUPADO=false; }
}
async function tick(){
  if(document.hidden) return;
  /* tela aberta de um dia para o outro: depois das 5h40 (o placar da manhã sai às 5h30) recarrega uma vez para trazer o "ontem" novo */
  const c=relogio();
  if(PLACAR && DIA0 && c.dia && c.dia!==DIA0 && c.min>=340){ location.reload(); return; }
  if(!PLACAR){ if(await abreHistorico()) await puxaVivo(); return; }
  await puxaVivo();
}
function liga(){ if(T || document.hidden) return; T=setInterval(tick,MINIMO_MS); }
function desliga(){ if(T){ clearInterval(T); T=null; } }
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ desliga(); return; }
  if(!LIBERADO) return;
  if(Date.now()-ULT>=MINIMO_MS) tick();
  liga();
});
document.getElementById('atualizar').addEventListener('click',function(){
  const b=this, falta=MINIMO_MS-(Date.now()-ULT);
  if(falta>0 || OCUPADO){
    const txt=b.textContent; b.disabled=true;
    b.textContent='Em dia · a próxima leitura sai sozinha'+(falta>0?' em '+Math.ceil(falta/1000)+' s':'');
    setTimeout(function(){ b.textContent=txt; b.disabled=false; },4000);   /* só o texto do botão, sem rede */
    return;
  }
  desliga(); tick(); liga();
});
pdgGuarda().then(async function(ok){
  if(!ok) return;
  LIBERADO=true;
  if(await abreHistorico()) await puxaVivo();
  liga();
});
</script>
