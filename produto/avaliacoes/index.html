<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../config.js" data-demo="telas/avaliacoes.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F47B3C">
<title>Avaliações do dia · Portal de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Figtree:wght@400;500;600;700&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/pdg-ui.css?v=4">
<style>
/* Quadro "Avaliacoes do dia" (o quadro mora em ../assets/avaliacoes-dia.js).
   Endereco: ?loja=ID trava numa loja (ids de PORTAL_CFG.lojas); ?foco=google poe o Google primeiro;
   ?embed=1 e para dentro de outra tela (sem cabecalho, e avisa a altura para a tela de fora). */
.load{color:var(--muted);padding:40px 10px;text-align:center}
body.avd-embed{padding:0 2px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="load">Carregando…</div></div>

<script>
const SB=PORTAL_CFG.rest;
const KEY=PORTAL_CFG.chave;
const PRM=new URLSearchParams(location.search);
/* lojas do config: id -> nome */
const LOJAS={};(PORTAL_CFG.lojas||[]).forEach(function(l){LOJAS[String(l.id).toLowerCase()]=l.nome});
const LOJA=(function(){const v=(PRM.get('loja')||'').toLowerCase();if(LOJAS[v])return LOJAS[v];const n=Object.keys(LOJAS).map(k=>LOJAS[k]);return n.indexOf(PRM.get('loja'))>=0?PRM.get('loja'):''})();
const FOCO=PRM.get('foco')==='google'?'google':'ifood';
const EMBED=PRM.get('embed')==='1';
if(EMBED)document.body.classList.add('avd-embed');

/* mede o CONTEUDO (#app), nunca a janela: a janela e a propria moldura e cresceria sem parar */
let ALT=0;
function altura(){
  if(!EMBED)return;
  const h=Math.ceil(document.getElementById('app').getBoundingClientRect().height)+24;
  if(Math.abs(h-ALT)<4)return;
  ALT=h;
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({avdAltura:h},location.origin)}catch(e){}
}
function boot(){
  const app=document.getElementById('app');
  app.innerHTML='<div id="avd" class="avd"></div>';
  AVD.montar(document.getElementById('avd'),{loja:LOJA,foco:FOCO,aoDesenhar:function(){setTimeout(altura,30)},aoVencer:function(){pdgSaia('Sua sessão expirou. Entre de novo.')}});
  /* largura mudou (girar o celular) muda a altura do conteudo; a altura da moldura nao entra na conta */
  let LARG=window.innerWidth;window.addEventListener('resize',function(){if(window.innerWidth!==LARG){LARG=window.innerWidth;altura()}});
}

/* ===== porta unica do portal ===== */
const PDGMODS=['avaliacoes','salao'];
function pdgTok(){try{return sessionStorage.getItem('pdg_token')||''}catch(e){return ''}}
function pdgSaia(m){try{sessionStorage.setItem('pdg_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace(PORTAL_CFG.url('index.html'))}catch(e){location.replace(PORTAL_CFG.url('index.html'))}}
async function pdgGuarda(){
  const t=pdgTok();
  if(!t){pdgSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'avaliacoes'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){pdgSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&PDGMODS.indexOf(m.id)>=0})){pdgSaia('Você não tem acesso a este módulo');return false}
  return true;
}
</script>
<script src="../assets/avaliacoes-dia.js?v=1"></script>
<script>pdgGuarda().then(function(ok){if(ok)boot()});</script>
<script>/* dentro de outra tela (embed) nao carrega o portal.js: a tela de fora ja tem a caixa de anotacao */
if(!EMBED){const s=document.createElement('script');s.src=PORTAL_CFG.url('assets/portal.js?v=3');document.body.appendChild(s)}</script>
</body>
</html>
