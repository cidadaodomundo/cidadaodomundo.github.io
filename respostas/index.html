<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Precisa de Resposta · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:8px}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
button.b:hover{border-color:var(--brand)}
button.bp{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:0;margin-bottom:10px;overflow:hidden}
details.c>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;user-select:none}
details.c>summary::-webkit-details-marker{display:none}
details.c>summary .seta{color:var(--muted);font-size:12px;transition:transform .15s}
details.c[open]>summary .seta{transform:rotate(90deg)}
details.c>summary .tt{flex:1}
.corpo{padding:0 16px 12px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-off{background:rgba(138,137,126,.15);color:var(--muted)}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.q{background:var(--s2);border-left:3px solid var(--brand);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:12.5px;color:var(--text2)}
.m{color:var(--muted);font-size:11.5px;margin-top:3px}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:6px 0}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:16px}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:16px}
.it{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:none}
.it .cx{width:22px;height:22px;flex:none;border:2px solid var(--line);border-radius:6px;background:var(--s2);cursor:pointer;display:grid;place-items:center;font-size:14px;color:var(--ok);margin-top:1px}
.it .cx:hover{border-color:var(--ok)}
.it .cx.on{border-color:var(--ok);background:rgba(47,174,106,.12)}
.it .tx{flex:1;font-size:13.5px}
.it .tx b{color:var(--text)}
.it.feito .tx{text-decoration:line-through;color:var(--muted)}
.it.feito .tx b{color:var(--muted)}
.rec{background:var(--s2);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:7px 10px;margin-top:5px;font-size:12px;color:var(--text2)}
.bz{background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:2px 0;text-decoration:underline}
.bz:hover{color:var(--text)}
.cx-off{opacity:.35;cursor:default}
.cal{display:block;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.calcab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.calcab b{font-size:15px;text-transform:capitalize;min-width:120px;text-align:center}
.calcab button[disabled]{opacity:.35;cursor:default}
.leg{margin-left:auto;display:flex;gap:10px;font-size:11px}
.lc{color:var(--warn);font-style:normal;font-weight:700}
.lr{color:var(--ok);font-style:normal;font-weight:700}
.grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.grade .sem{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase;font-weight:700}
.grade .q{background:var(--s2);border:1px solid var(--line);border-radius:8px;min-height:48px;padding:4px 6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.grade .q:hover{border-color:var(--brand)}
.grade .q.vazio{background:none;border:none;cursor:default}
.grade .q.fut{opacity:.3;cursor:default}
.grade .q.fut:hover{border-color:var(--line)}
.grade .q.hj{border-color:var(--brand)}
.grade .q.sel{background:var(--brand);border-color:var(--brand)}
.grade .q.sel .n,.grade .q.sel .lc,.grade .q.sel .lr{color:var(--brand-ink)}
.grade .n{font-size:13px;font-weight:800}
.grade .qc{display:flex;gap:6px;font-size:11px;flex-wrap:wrap}
@media (max-width:640px){.grade .q{min-height:40px;padding:3px}.grade .qc{font-size:9.5px;gap:3px}.leg{margin-left:0}}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.resumo>div{background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12px;color:var(--muted)}
.resumo b{display:block;font-size:22px;color:var(--text)}
.nl{display:flex;gap:6px;margin-top:6px}
.nl .nota{flex:1;min-width:0;background:var(--s2);border:1px dashed var(--line);color:var(--text);border-radius:8px;padding:6px 9px;font-size:12px;font-family:inherit}
.nl .nota:focus{outline:none;border-style:solid;border-color:var(--brand)}
button.mini{padding:5px 10px;font-size:12px}
.form{background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:14px;display:none}
.form.on{display:block}
.form input,.form select,.form textarea{width:100%;background:var(--s1);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;margin-bottom:8px}
.form .lin{display:flex;gap:8px;flex-wrap:wrap}
.form .lin>*{flex:1;min-width:130px}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}

/* cara da casa 04-09-2026 */
h1,.gatebox h1{font-weight:400}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06}

/* cabe no celular 04-09-2026 — filas de aba nunca vazam ate 900px; o resto so em tela estreita */
@media (max-width:900px){.views,.tabs,.abas,.fil,.pes,.filtros,.chips,.lojas,.periodos{display:flex;flex-wrap:wrap;gap:6px;width:auto;max-width:100%;min-width:0}.views>*,.tabs>*,.abas>*,.fil>*,.pes>*{flex:0 0 auto;max-width:100%}}@media (max-width:640px){body{padding-left:12px;padding-right:12px}table{display:block;width:max-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}h1{font-size:clamp(18px,6.2vw,26px);word-break:break-word}img,svg,canvas,iframe{max-width:100%}}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>📣 Precisa de Resposta</h1><div class="sub">tudo que está esperando alguém resolver — marque o que já foi feito</div></div></div>
  <div class="rt"><button class="b bp" onclick="abreForm()">+ Acrescentar</button><button class="b" onclick="location.reload()">↻ Atualizar</button></div>
</div>

<div class="form" id="frm">
  <div class="tag" style="margin-bottom:7px">Acrescentar uma pendência na mão</div>
  <input id="f_titulo" placeholder="O que precisa ser resolvido?" maxlength="200">
  <div class="lin">
    <select id="f_setor">
      <option value="geral">Setor: geral</option>
      <option value="nutricao">Nutrição</option>
      <option value="manutencao">Manutenção</option>
      <option value="salao">Salão</option>
      <option value="cozinha">Cozinha</option>
      <option value="delivery">Delivery</option>
      <option value="rh">RH</option>
    </select>
    <select id="f_unid">
      <option value="">Loja: todas</option>
      <option value="Água Verde">Água Verde</option>
      <option value="São Braz">São Braz</option>
      <option value="Ahú">Ahú</option><option value="Boqueirão">Boqueirão</option>
          </select>
    <select id="f_prio"><option value="normal">Normal</option><option value="urgente">Urgente</option><option value="quando_der">Quando der</option></select>
  </div>
  <textarea id="f_det" rows="2" placeholder="Detalhe (opcional)" maxlength="600"></textarea>
  <div class="lin" style="justify-content:flex-end">
    <button class="b bp" onclick="salvaNovo()" style="flex:none">Salvar</button>
    <button class="b" onclick="abreForm(false)" style="flex:none">Cancelar</button>
  </div>
</div>

<div class="cal" id="cal"></div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const br=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
function hojeISO(){return new Date().toLocaleDateString('sv-SE')}
function dMenos(n){const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('sv-SE')}
function dMais(n){const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')}
function diaSem(d){return ['dom','seg','ter','qua','qui','sex','sab'][new Date(String(d).slice(0,10)+'T00:00:00').getDay()]}
function dias(d){if(!d)return 0;return Math.round((new Date(hojeISO()+'T00:00:00')-new Date(String(d).slice(0,10)+'T00:00:00'))/86400000)}
async function get(q){try{const r=await fetch(SB+q,{headers:H});return r.ok?await r.json():[]}catch(e){return []}}
const LOJA={1129620:'Água Verde',1831001:'São Braz',1984218:'Ahú',1134806:'Boqueirão',3295625:'A Famosa Marmita',206853:'Cidadão Vegan AV',2170854:'Baixa Gastronomia',1575775:'Veganete AV',1569200:'UFO Burger',26979:'Comida Brasileira AV',2741723:'Comida Brasileira SB',2786005:'Cidadão Vegan Ahú',2786015:'Comida Brasileira Ahú',546359:'Cidadão Vegan Boq',1803383:'Veganete Boq'};
const loja=id=>LOJA[id]||('loja '+id);
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};

let MARCAS={},QUEM='';
let DIA='';
let MES='',MESDADOS=null,MESCARREGADO='';
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
async function carregaMes(){
  const m=MES||hojeISO().slice(0,7);
  if(MESCARREGADO===m&&MESDADOS)return;
  MESDADOS=null;
  try{const x=await fetch(SB+'rpc/respostas_mes',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:tok(),p_mes:m+'-01'})});if(x.ok){const j=await x.json();if(m!==(MES||hojeISO().slice(0,7)))return;MESDADOS={};(j.dias||[]).forEach(d=>{MESDADOS[String(d.dia).slice(0,10)]=d});MESCARREGADO=m}}catch(e){}
}
function mudaMes(n){const m=(MES||hojeISO().slice(0,7)).split('-').map(Number);const x=new Date(m[0],m[1]-1+n,1);const v=x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2);if(v>hojeISO().slice(0,7))return;MES=v;desenhaCal()}
function escolheDia(d){DIA=(d>=hojeISO()?'':d);MES=d.slice(0,7);boot()}
async function desenhaCal(){
  const hj=hojeISO(),sel=DIA||hj,m=MES||sel.slice(0,7);MES=m;
  await carregaMes();
  const [a,mm]=m.split('-').map(Number);
  const prim=new Date(a,mm-1,1).getDay(),nd=new Date(a,mm,0).getDate();
  let h='<div class="calcab"><button class="b mini" onclick="mudaMes(-1)" title="mês anterior">◀</button>'+
    '<b>'+MESES[mm-1]+' '+a+'</b>'+
    '<button class="b mini" onclick="mudaMes(1)" title="mês seguinte"'+(m>=hj.slice(0,7)?' disabled':'')+'>▶</button>'+
    (DIA?'<button class="b mini bp" onclick="DIA=\'\';MES=\'\';boot()">Voltar para hoje</button>':'<span class="m" style="margin:0">hoje: o que está esperando alguém resolver — clique num dia para ver o que aconteceu</span>')+
    '<span class="leg"><span class="lc">+ chegou</span><span class="lr">✔ resolvido</span></span></div>';
  h+='<div class="grade">'+['dom','seg','ter','qua','qui','sex','sáb'].map(x=>'<div class="sem">'+x+'</div>').join('');
  for(let k=0;k<prim;k++)h+='<div class="q vazio"></div>';
  for(let d=1;d<=nd;d++){
    const iso=m+'-'+('0'+d).slice(-2),info=(MESDADOS&&MESDADOS[iso])||{},fut=iso>hj;
    const c=Number(info.chegou)||0,r=Number(info.resolvido)||0;
    h+='<div class="q'+(fut?' fut':'')+(iso===sel?' sel':'')+(iso===hj?' hj':'')+'"'+(fut?'':' onclick="escolheDia(\''+iso+'\')"')+' title="'+(fut?'':c+' chegou · '+r+' resolvido')+'">'+
      '<span class="n">'+d+'</span>'+(fut?'':'<span class="qc">'+(c?'<i class="lc">+'+c+'</i>':'')+(r?'<i class="lr">✔'+r+'</i>':'')+'</span>')+'</div>';
  }
  h+='</div>';
  if(!MESDADOS)h+='<div class="m">não deu para carregar os números do mês</div>';
  $('cal').innerHTML=h;
}
async function bootDia(){
  $('app').innerHTML='<div class="load">Carregando o dia '+br(DIA)+'…</div>';
  let r;
  try{const x=await fetch(SB+'rpc/respostas_dia',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:tok(),p_dia:DIA})});if(!x.ok)throw 0;r=await x.json()}
  catch(e){$('app').innerHTML='<div class="vazio">Não deu para carregar este dia. Entre no portal de novo e tente outra vez.</div>';return}
  const NOME={manutencao:'Manutenção',reserva:'Reserva',encomenda:'Encomenda',compra:'Compra',manual:'Pedido',chamado:'Chamado iFood',pausado:'Item pausado'};
  const lin=(ic,x,extra)=>'<div class="it"><div class="cx cx-off">'+ic+'</div><div class="tx"><b>'+esc(x.titulo)+'</b> <span class="pill p-off">'+esc(NOME[x.fonte]||x.fonte)+'</span>'+(x.prioridade==='urgente'?' <span class="pill p-bad">urgente</span>':'')+(extra||'')+'</div></div>';
  const ch=r.chegou||[],rs=r.resolvido||[],ab=r.aberto||[];
  let h='<div class="resumo"><div><b>'+ch.length+'</b>chegou</div><div><b>'+rs.length+'</b>resolvido</div><div><b>'+ab.length+'</b>em aberto no fim do dia</div><div><b>'+(r.compras_abertas||0)+'</b>compras em aberto</div></div>';
  h+=bloco('dc','📥 Chegou em '+br(DIA),ch.length,ch.map(x=>lin('＋',x,x.detalhe?'<div class="m">'+esc(String(x.detalhe).slice(0,220))+'</div>':'')).join(''),true);
  h+=bloco('dr','✅ Resolvido em '+br(DIA),rs.length,rs.map(x=>lin('✔',x,'<div class="m">'+(x.por?esc(x.por)+' · ':'')+esc(x.quando||'')+'</div>'+(x.recado?'<div class="rec">💬 '+esc(x.recado)+'</div>':''))).join(''),true);
  h+=bloco('da','⏳ Continuava em aberto no fim de '+br(DIA),ab.length,ab.map(x=>lin('·',x,'<div class="m">desde '+esc(br(x.desde))+'</div>')).join(''),false);
  if(!ch.length&&!rs.length&&!ab.length)h+='<div class="vazio">Nada registrado neste dia.</div>';
  h+='<div class="aviso">Você está olhando um dia que já passou: aqui é só consulta. Para marcar ✔ ou escrever observação, volte para hoje. Reservas, chamados do iFood e avaliações não entram no histórico do dia.</div>';
  $('app').innerHTML=h;
}
async function porta(acao,dados){
  const r=await fetch(SB+'rpc/respostas_consulta',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_acao:acao,p_dados:dados||{}})});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}
const chave=(f,r)=>f+'|'+r;
function mk(f,r){return MARCAS[chave(f,r)]||{}}

async function marca(f,r,valor){
  try{await porta('marcar',{fonte:f,ref:String(r),feito:valor});await boot()}
  catch(e){alert('Não deu para marcar. Entre no portal de novo e tente outra vez.')}
}
async function recado(f,r,el){
  const t=el.value.trim();
  if(!t&&!mk(f,r).recado)return;
  el.disabled=true;
  try{
    if(f==='manutencao'){if(!t){el.disabled=false;return}await manut('anotar',{id:r,texto:t})}
    else await porta('recado',{fonte:f,ref:String(r),recado:t});
    await boot();
  }catch(e){el.disabled=false;alert('Não deu para gravar a observação.')}
}
async function mSel(id,a,d){try{d.id=id;await manut(a,d);await boot()}catch(e){alert('Não deu para gravar.')}}
function teclaRec(ev,f,r,el){if(ev.key==='Enter'){ev.preventDefault();recado(f,r,el)}}
async function manut(a,dados){
  const x=await fetch(SB+'rpc/manutencao_acao',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_acao:a,p_dados:dados||{}})});
  if(!x.ok)throw new Error('porta '+x.status);return await x.json();
}
function abreForm(v){const e=$('frm');e.classList.toggle('on',v!==false&&!e.classList.contains('on'));if(e.classList.contains('on'))$('f_titulo').focus()}
async function salvaNovo(){
  const t=$('f_titulo').value.trim();
  if(!t){alert('Escreva o que precisa ser resolvido.');return}
  try{
    if($('f_setor').value==='manutencao'){
      if(!$('f_unid').value){alert('Para chamado de manutenção, escolha a loja.');return}
      await manut('novo',{item:t,unidade:$('f_unid').value,prioridade:$('f_prio').value,descricao:$('f_det').value.trim()});
    }else await porta('novo',{titulo:t,setor:$('f_setor').value,unidade:$('f_unid').value,prioridade:$('f_prio').value,detalhe:$('f_det').value.trim()});
    $('f_titulo').value='';$('f_det').value='';abreForm(false);await boot();
  }catch(e){alert('Não deu para salvar. Entre no portal de novo e tente outra vez.')}
}

function item(f,r,corpo,podeMarcar){
  const m=mk(f,r),ft=m.feito===true;
  let h='<div class="it'+(ft?' feito':'')+'">';
  if(podeMarcar===false){h+='<div class="cx cx-off">·</div>'}
  else{h+='<div class="cx'+(ft?' on':'')+'" onclick="marca(\''+f+'\',\''+String(r).replace(/'/g,"")+'\','+(ft?'false':'true')+')">'+(ft?'✔':'')+'</div>'}
  h+='<div class="tx">'+corpo;
  if(ft&&m.feito_por)h+='<div class="m">✔ '+esc(m.feito_por)+' resolveu hoje</div>';
  if(m.recado&&f!=='manutencao')h+='<div class="rec">💬 '+esc(m.recado)+'<div class="m">— '+esc(m.recado_por||'')+'</div></div>';
  const rr=String(r).replace(/'/g,"");
  h+='<div class="nl"><input class="nota" maxlength="400" placeholder="'+(f==='manutencao'?'✏️ observação (vai para o histórico do chamado) — Enter grava':(m.recado?'✏️ trocar o recado — Enter grava (vazio apaga)':'✏️ observação — Enter grava'))+'" onkeydown="teclaRec(event,\''+f+'\',\''+rr+'\',this)"><button class="b mini" onclick="recado(\''+f+'\',\''+rr+'\',this.previousSibling)">Gravar</button></div>';
  h+='</div></div>';
  return h;
}
function bloco(id,titulo,n,corpo,aberto){
  if(!corpo)return '';
  const pil=n>0?'<span class="pill '+(n>4?'p-bad':'p-warn')+'">'+n+'</span>':'<span class="pill p-ok">0</span>';
  return '<details class="c" id="b_'+id+'"'+(aberto?' open':'')+'><summary><span class="seta">▶</span><span class="tt">'+titulo+'</span>'+pil+'</summary><div class="corpo">'+(corpo||'<div class="vazio">nada pendente</div>')+'</div></details>';
}

async function boot(){
  if(DIA)MES=DIA.slice(0,7);
  MESCARREGADO='';
  desenhaCal();
  if(DIA&&DIA!==hojeISO()){await bootDia();return}
  const [ult,pend,cham,pau,res,man,enc,com,dad]=await Promise.all([
    get('ifood_fato_avaliacao?select=data_avaliacao&order=data_avaliacao.desc&limit=1'),
    get('ifood_fato_avaliacao?select=id_loja,data_avaliacao,nota,comentario&status_avaliacao=eq.PENDING_REPLY&data_avaliacao=gte.'+dMenos(30)+'&order=data_avaliacao.asc&limit=100'),
    get('ifood_fato_negociacao?select=id,id_loja,data,motivo,valor_pedido,resposta_loja&data=gte.'+dMenos(14)+'&order=data.asc&limit=100'),
    get('cardapio_pausado?select=unidade,canal,item,primeiro_visto&visto_em=gte.'+dMenos(2)+'&order=primeiro_visto.asc&limit=800'),
    get('salao_reserva?select=id,unidade,data,hora,pessoas,area,status,sinal_pago,observacao&data=gte.'+hojeISO()+'&data=lte.'+dMais(7)+'&order=data.asc,hora.asc&limit=100'),
    get('manutencao_chamado?select=id,unidade,item,descricao,prioridade,status,aberto_em,obs&status=neq.resolvido&order=aberto_em.asc&limit=200'),
    get('encomenda?select=id,unidade,data_entrega,hora,descricao,qtd_itens,status,responsavel&data_entrega=gte.'+dMenos(1)+'&order=data_entrega.asc&limit=100'),
    get('compra_item?select=id,unidade,item,quantidade,status,quem_pediu,criado_em&criado_em=gte.'+dMenos(30)+'&order=criado_em.asc&limit=200'),
    porta('listar').catch(()=>({marcas:[],manuais:[],feitos7:[],quem:''}))
  ]);

  MARCAS={};(dad.marcas||[]).forEach(m=>{MARCAS[chave(m.fonte,m.ref)]=m});
  const TIT={};
  const poe=(f,id,t)=>{TIT[chave(f,String(id))]=t};
  QUEM=dad.quem||'';
  const manuais=dad.manuais||[];
  const ateIfood=ult.length?br(ult[0].data_avaliacao):'—';
  const abertoHoje=k=>!(MARCAS[k]&&MARCAS[k].feito===true);
  man.forEach(c=>poe('manutencao',c.id,c.unidade+' · '+c.item));
  res.forEach(r=>poe('reserva',r.id,'Reserva '+r.unidade+' '+br(r.data)));
  enc.forEach(e=>poe('encomenda',e.id,'Encomenda '+e.unidade+' '+br(e.data_entrega)));
  com.forEach(c=>poe('compra',c.id,c.unidade+' · '+c.item));
  manuais.forEach(x=>poe('manual',x.id,x.titulo));
  cham.forEach(c=>poe('chamado',c.id,'Chamado iFood '+loja(c.id_loja)+' '+br(c.data)));
  let h='';

  /* 1 - manutencao: todos os chamados abertos (a aba Manutencao saiu do menu em 24/09) */
  const PR={urgente:0,alta:0,normal:1,quando_der:2};
  const mTodos=man.slice().sort((a,b)=>((PR[a.prioridade]??1)-(PR[b.prioridade]??1))||String(a.unidade).localeCompare(String(b.unidade),'pt-BR')||String(a.aberto_em).localeCompare(String(b.aberto_em)));
  const nUrg=mTodos.filter(c=>(c.prioridade==='urgente'||c.prioridade==='alta')&&abertoHoje(chave('manutencao',c.id))).length;
  const PRN={urgente:['urgente','p-bad'],alta:['urgente','p-bad'],normal:['normal','p-warn'],quando_der:['quando der','p-off']};
  h+=bloco('mu','🔧 Manutenção'+(nUrg?' <span class="pill p-bad">'+nUrg+' urgente'+(nUrg>1?'s':'')+'</span>':''),mTodos.filter(c=>abertoHoje(chave('manutencao',c.id))).length,
    mTodos.map(c=>{const p=PRN[c.prioridade]||PRN.normal;return item('manutencao',c.id,
      '<b>'+esc(c.unidade)+' · '+esc(c.item)+'</b> <span class="pill '+p[1]+'">'+p[0]+'</span>'+(c.status==='agendado'?' <span class="pill p-ok">agendado</span>':'')+
      '<div class="m">'+(c.descricao?esc(c.descricao)+' · ':'')+'aberto há '+dias(c.aberto_em)+' dia(s)</div>'+
      (c.obs?'<div class="rec">📝 '+esc(String(c.obs).split(' | ').pop())+'</div>':'')+
      '<div class="nl"><select class="b mini" onchange="mSel('+Number(c.id)+',\'situacao\',{status:this.value})"><option value="aberto"'+(c.status!=='agendado'?' selected':'')+'>aberto</option><option value="agendado"'+(c.status==='agendado'?' selected':'')+'>agendado</option></select>'+
      '<select class="b mini" onchange="mSel('+Number(c.id)+',\'prioridade\',{prioridade:this.value})">'+['urgente','normal','quando_der'].map(k=>'<option value="'+k+'"'+(((c.prioridade==='alta'?'urgente':c.prioridade)===k)?' selected':'')+'>'+(k==='quando_der'?'quando der':k)+'</option>').join('')+'</select></div>')}).join(''),true);

  /* 2 - reservas dos proximos 7 dias */
  const hj=hojeISO(),amn=dMais(1);
  const pend7=res.filter(function(r){const t=String(r.status||'').toLowerCase();return r.sinal_pago!==true||(t.indexOf('confirm')>=0&&t.indexOf('confirmad')<0)});
  h+=bloco('rs','🪑 Reservas dos próximos 7 dias',pend7.filter(r=>abertoHoje(chave('reserva',r.id))).length,
    pend7.map(function(r){
      const d=String(r.data).slice(0,10);
      const semSinal=r.sinal_pago!==true;
      const st=String(r.status||'').toLowerCase();const aConf=st.indexOf('confirm')>=0&&st.indexOf('confirmad')<0;
      const quando=d===hj?'HOJE':(d===amn?'amanhã':diaSem(d)+' '+br(d));
      let sel='';
      if(semSinal&&aConf)sel=' <span class="pill p-bad">sem sinal e a confirmar</span>';
      else if(semSinal)sel=' <span class="pill p-bad">sem sinal</span>';
      else if(aConf)sel=' <span class="pill p-warn">a confirmar</span>';
      else sel=' <span class="pill p-ok">tudo certo</span>';
      return item('reserva',r.id,
        '<b>'+esc(r.unidade)+' · '+quando+' · '+String(r.hora||'').slice(0,5)+'</b>'+sel+
        '<div class="m">'+(r.pessoas||'?')+' pessoas'+(r.area?' · '+esc(r.area):'')+' · '+esc(r.status||'')+
        (r.observacao?'<br>'+esc(r.observacao):'')+'</div>');
    }).join(''),true);

  /* 3 - lancados na mao (nutricionista e afins) */
  const ORD={urgente:0,normal:1};
  manuais.sort((a,b)=>(ORD[a.prioridade]-ORD[b.prioridade])||(a.criado_em<b.criado_em?-1:1));
  h+=bloco('nm','🥗 Pedidos e solicitações (nutricionista e equipe)',manuais.filter(x=>abertoHoje(chave('manual',x.id))).length,
    manuais.map(x=>item('manual',x.id,
      '<b>'+esc(x.titulo)+'</b>'+(x.prioridade==='urgente'?' <span class="pill p-bad">urgente</span>':'')+
      '<div class="m">'+esc(x.setor)+(x.unidade?' · '+esc(x.unidade):'')+' · de '+esc(x.criado_por||x.origem)+' · '+br(x.criado_em)+
      (x.detalhe?'<br>'+esc(x.detalhe):'')+'</div>')).join(''),true);

  /* 4 - encomendas sem dono */
  const semDono=enc.filter(e=>!e.responsavel||!String(e.responsavel).trim());
  h+=bloco('ed','📦 Encomendas grandes sem dono',semDono.filter(e=>abertoHoje(chave('encomenda',e.id))).length,
    semDono.map(e=>item('encomenda',e.id,
      '<b>'+esc(e.unidade)+' · entrega '+br(e.data_entrega)+' '+String(e.hora||'').slice(0,5)+'</b> <span class="pill p-bad">sem dono</span>'+
      '<div class="m">'+esc(e.descricao||'')+(e.qtd_itens?' · '+e.qtd_itens+' itens':'')+' · '+esc(e.status||'')+'</div>')).join(''),true);

  /* 5 - compras pedidas e nao resolvidas */
  const cAb=com.filter(c=>c.status!=='comprado'&&c.status!=='cancelado');
  h+=bloco('cp','🛒 Compras pedidas e ainda não compradas',cAb.filter(c=>abertoHoje(chave('compra',c.id))).length,
    cAb.map(c=>item('compra',c.id,
      '<b>'+esc(c.unidade)+' · '+esc(c.item)+'</b>'+(c.quantidade?' <span class="pill p-off">'+esc(c.quantidade)+'</span>':'')+
      '<div class="m">pedido por '+esc(c.quem_pediu||'—')+' há '+dias(c.criado_em)+' dia(s)</div>')).join(''),false);

  /* 7 - chamados ifood */
  const abertos=cham.filter(c=>!c.resposta_loja);
  h+=bloco('ci','🎧 Chamados do iFood sem resposta da loja',abertos.filter(c=>abertoHoje(chave('chamado',c.id))).length,
    abertos.map(c=>item('chamado',c.id,
      '<b>'+esc(loja(c.id_loja))+' · '+br(c.data)+'</b> <span class="pill p-bad">sem resposta</span>'+
      '<div class="m">'+esc(c.motivo||'')+((c.valor_pedido&&(function(){try{return sessionStorage.getItem("cdm_admin")==="1"}catch(e){return false}})())?' · pedido R$ '+Number(c.valor_pedido).toLocaleString('pt-BR'):'')+'</div>')).join(''),false);

  /* 8 - itens pausados */
  const velhos={};
  pau.forEach(p=>{if(dias(p.primeiro_visto)>=2){const k=p.unidade+' · '+p.canal;(velhos[k]=velhos[k]||[]).push(p)}});
  const ks=Object.keys(velhos).sort();
  h+=bloco('ip','📵 Itens pausados há 2+ dias',ks.length,
    ks.map(k=>item('pausado',k,'<b>'+esc(k)+'</b> <span class="pill p-warn">'+velhos[k].length+' itens</span>')).join(''),false);

  /* 9 - avaliacoes do ifood, fechada no fim */
  let ha='';
  if(!pend.length){ha=''}
  else{
    const porLoja={};pend.forEach(a=>{(porLoja[a.id_loja]=porLoja[a.id_loja]||[]).push(a)});
    Object.keys(porLoja).forEach(id=>{
      const l=porLoja[id];
      ha+='<div class="q"><b>'+esc(loja(+id))+'</b> <span class="pill '+(l.length>5?'p-bad':'p-warn')+'">'+l.length+' sem resposta</span>';
      l.filter(a=>a.nota<=3).slice(0,5).forEach(a=>{
        ha+='<div class="m">★'+a.nota+' · '+br(a.data_avaliacao)+(a.comentario?' — '+esc(String(a.comentario).slice(0,180)):'')+'</div>';
      });
      ha+='</div>';
    });
  }
  h+=bloco('av','⭐ Avaliações do iFood sem resposta <span class="pill p-off">iFood até '+ateIfood+'</span>',pend.length,ha,false);

  /* 10 - historico dos ultimos 7 dias */
  const NOME={manutencao:'Manutenção',reserva:'Reserva',encomenda:'Encomenda',compra:'Compra',manual:'Pedido',chamado:'Chamado iFood',pausado:'Item pausado'};
  const f7=(dad.feitos7||[]);
  h+=bloco('hi','✅ Resolvidos nos últimos 7 dias',f7.length,
    f7.map(function(m){
      const t=TIT[chave(m.fonte,m.ref)]||(NOME[m.fonte]||m.fonte)+' nº '+m.ref;
      const q=new Date(m.feito_em);
      const quando=('0'+q.getDate()).slice(-2)+'/'+('0'+(q.getMonth()+1)).slice(-2)+' '+('0'+q.getHours()).slice(-2)+':'+('0'+q.getMinutes()).slice(-2);
      return '<div class="it"><div class="cx cx-off">✔</div><div class="tx"><b>'+esc(t)+'</b> <span class="pill p-off">'+esc(NOME[m.fonte]||m.fonte)+'</span>'+
        '<div class="m">'+esc(m.feito_por||'')+' · '+quando+'</div>'+
        (m.recado?'<div class="rec">💬 '+esc(m.recado)+'<div class="m">— '+esc(m.recado_por||'')+'</div></div>':'')+
        '</div></div>';
    }).join(''),false);

  h+='<div class="aviso">✔ resolve de verdade: manutenção vira resolvida, compra vira comprada, encomenda ganha você como dono (desmarcar desfaz). Reserva, chamado do iFood e item pausado só ficam riscados. Observação de manutenção vai para o histórico do chamado; as outras ficam 7 dias. Faixas sem nada pendente ficam escondidas.'+(QUEM?' Você está como <b>'+esc(QUEM)+'</b>.':'')+'</div>';
  $('app').innerHTML=h;
}

/* ===== porta unica do portal ===== */
const CDMMODS=['respostas'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'respostas'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
