<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Check-in CDM">
<link rel="manifest" href="manifest-checkin.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Check-in do Delivery · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--good:#2fae6a;--brand:#c8102e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:40px 30px;max-width:420px;text-align:center}
.dot{width:56px;height:56px;border-radius:14px;background:var(--good);display:grid;place-items:center;font-weight:800;font-size:26px;margin:0 auto 16px}
h1{font-size:20px;font-weight:800;margin-bottom:10px}
p{color:var(--text2);font-size:14px;line-height:1.6}
.tag{display:inline-block;background:var(--s2);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<div class="box">
  <div class="dot">✅</div>
  <h1>Check-in não é mais necessário</h1>
  <p>Você não precisa mais bater ponto por aqui nem escanear nenhum QR no balcão.<br><br>As horas dos motoboys agora são calculadas automaticamente pelo sistema, direto do Foody.</p>
  <div class="tag">🚫 protocolo encerrado</div>
</div>
</body>
</html>
