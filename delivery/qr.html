<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest-central.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>QR do dia · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:40px 30px;max-width:420px;text-align:center}
.dot{width:56px;height:56px;border-radius:14px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:26px;margin:0 auto 16px}
h1{font-size:20px;font-weight:800;margin-bottom:10px}
p{color:var(--text2);font-size:14px;line-height:1.6}
.tag{display:inline-block;background:var(--s2);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--muted);margin-top:18px}
a.b{display:inline-block;margin-top:18px;background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="dot">📱</div>
  <h1>QR do dia não é mais usado</h1>
  <p>O check-in por QR no balcão foi descontinuado. Os motoboys não precisam mais escanear nada — as horas são calculadas automaticamente pelo Foody.</p>
  <div class="tag">🚫 protocolo encerrado</div>
  <a class="b" href="./">← voltar para a Central do Delivery</a>
</div>
</body>
</html>
