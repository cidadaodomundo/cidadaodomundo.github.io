<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
:root{
  --surface-0:#111110; --surface-1:#1a1a19; --surface-2:#232321; --line:#34332f;
  --text:#ffffff; --text2:#c3c2b7; --muted:#8a897e;
  --good:#2fae6a; --bad:#e66767; --warn:#e0a93a; --brand:#c8102e; --blue:#3987e5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--surface-0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:2px solid var(--brand);padding-bottom:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px}
.dot{width:40px;height:40px;border-radius:10px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
h1{font-size:18px;font-weight:800}
.sub{color:var(--text2);font-size:12px;margin-top:2px}
.btnr{background:var(--surface-1);border:1px solid var(--line);color:var(--text2);border-radius:8px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-weight:600}
.btnr:hover{border-color:var(--muted);color:#fff}
.views{display:flex;gap:6px;background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;margin:4px 0 12px;flex-wrap:wrap}
.view{border:none;background:none;color:var(--muted);font-weight:800;font-size:13.5px;padding:9px 18px;border-radius:9px;cursor:pointer}
.view.active{background:var(--brand);color:#fff}
.datenav{display:flex;align-items:center;gap:4px;background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:3px}
.datenav button{background:none;border:none;color:var(--text);font-size:17px;cursor:pointer;padding:5px 12px;border-radius:7px}
.datenav button:hover{background:var(--surface-2)}
.datenav .cur{font-weight:800;font-size:13.5px;padding:0 8px;min-width:140px;text-align:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tab{background:var(--surface-1);border:1px solid var(--line);border-radius:22px;padding:7px 16px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:13px 15px;border-left:4px solid var(--kc,var(--line))}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.kpi .v{font-size:23px;font-weight:800;margin-top:4px;color:var(--kc,var(--text))}
.kpi .f{font-size:11.5px;color:var(--text2);margin-top:3px}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.sec{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:14px}
.sec h2{font-size:14px;font-weight:800}
.sec .hs{font-size:11.5px;color:var(--muted);margin:2px 0 10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;cursor:pointer;user-select:none}
th:hover{color:#fff}
th.sd::after{content:' ▾';color:var(--brand)}
th.sa::after{content:' ▴';color:var(--brand)}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pg{background:rgba(47,174,106,.16);color:#5fd396}
.pw{background:rgba(224,169,58,.16);color:#e0a93a}
.pb{background:rgba(230,103,103,.16);color:#f08d8d}
.todo{background:linear-gradient(135deg,#1d1512,#1a1a19);border:1px solid #4a2c18;border-radius:12px;padding:16px;margin-bottom:14px}
.todo h2{font-size:15px;font-weight:800;color:#ffb054}
.todo .hs{font-size:11.5px;color:var(--muted);margin:2px 0 10px}
.todo li{list-style:none;margin-bottom:9px;padding:10px 12px;background:rgba(0,0,0,.25);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;font-size:13px}
.todo li.ok{border-left-color:var(--good)}
.todo b{color:#fff}
.empty{color:var(--muted);padding:10px 0;font-size:12.5px}
.loading{text-align:center;color:var(--muted);padding:60px 0}
.err{color:#f08d8d;padding:14px;border:1px solid var(--bad);border-radius:10px;margin:12px 0}
.stars{color:#e0a93a;font-weight:700}
.foot{color:var(--muted);font-size:11px;margin-top:16px;line-height:1.6}
#gate{position:fixed;inset:0;background:var(--surface-0);z-index:100;display:flex;align-items:center;justify-content:center}
.gatebox{background:var(--surface-1);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:330px;text-align:center}
.gatebox input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:15px;outline:none;margin:14px 0 10px;text-align:center}
.gatebox button{width:100%;background:var(--brand);border:none;color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer}
.gerr{color:#f08d8d;font-size:12px;min-height:16px;margin-top:8px}
.splitbar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin-top:6px}
.splitbar .seg{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#0c0c0b}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-top:10px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px}
.lojagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lcard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lcard .ln{font-weight:800;font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.lcard .lm{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--text2)}
.lcard .lm b{color:var(--text)}
.rankgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.rankgrid h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
.rk{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.rk .nm{color:var(--text)}
.comp{color:#f0b95a;font-weight:700}
@media(max-width:640px){h1{font-size:15.5px}.kpi .v{font-size:19px}.view{padding:8px 12px;font-size:12.5px}}
</style>
</head>

<div class="wrap">
<header>

Histórico disponível: últimos 7 dias. Dia operacional vai até 4h da manhã. Dados ao vivo (somente leitura).</div>
</div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
/* ===== porta unica do portal: sessao por usuario ===== */
const CDMMODS=['delivery'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmTem(id){try{const l=JSON.parse(sessionStorage.getItem('cdm_modulos')||'[]');return Array.isArray(l)&&l.some(function(m){return m&&m.id===id})}catch(e){return false}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/rpc/portal_eu',{method:'POST',headers:{apikey:'sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV',Authorization:'Bearer sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV','Content-Type':'application/json'},body:JSON.stringify({p_token:t})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  try{sessionStorage.setItem('cdm_nome',j.nome||'');sessionStorage.setItem('cdm_admin',j.admin?'1':'0');sessionStorage.setItem('cdm_modulos',JSON.stringify(ms))}catch(e){}
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}

const LOJAS=['Todas','Água Verde','São Braz','Ahú'];
let F=[],SC=[],CANC=[],AVAL=[],NEG=[],DIMS=[],ATR=[],PAG=[],ESCH=[],IPER='hoje',DAYS=[],NAV=[],DI=0,LOJA='Todas',VIEW='diario',PER=7;
const $=id=>document.getElementById(id);
const br=d=>{const[y,m,dd]=d.split('-');return dd+'/'+m};
const DOWN=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const dow=d=>{const[y,m,dd]=d.split('-').map(Number);return new Date(Date.UTC(y,m-1,dd)).getUTCDay()};
const pctS=(ok,at)=>{const b=ok+at;return b?Math.round(1000*ok/b)/10:null};
// promessa real do iFood por raio (cenário Padrão): até 2km=39 · 2-3=45 · 3-4=50 · 4-5=55 · 5-6=60 · 6-7=65 · 7+=70
const atrasoReal=p=>p.atraso_real_min==null?null:+p.atraso_real_min;
async function fj(u){const r=await fetch(SB+u,{headers:H});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function escRPC(acao,dados){const r=await fetch(SB+'rpc/escala_consulta',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({p_cred:cdmTok(),p_acao:acao,p_dados:dados||{}})});const j=await r.json().catch(function(){return null});if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j}
async function pag(base){let all=[],from=0,step=1000;
  while(true){const r=await fetch(SB+base,{headers:{...H,Range:from+'-'+(from+step-1)}});if(!r.ok)throw new Error('HTTP '+r.status);
    const p=await r.json();all=all.concat(p);if(p.length<step)break;from+=step}return all}

var ENTR=[];
async function loadAll(){
  $('conteudo').innerHTML='<div class="loading">Carregando…</div>';
  try{
    [F,SC,CANC,AVAL,NEG,DIMS,ATR,PAG,ENTR]=await Promise.all([
      pag('foody_fato_fechamento_turno_dia?dia_operacional=gte.'+(new Date(Date.now()-29*864e5)).toISOString().slice(0,10)+'&select=id_loja,unidade,dia_operacional,turno,entregador,horas,entregas,no_prazo,atrasos,sem_codigo&order=dia_operacional.asc'),
      fj('foody_fato_pedido_sem_codigo?dia_operacional=gte.'+(new Date(Date.now()-29*864e5)).toISOString().slice(0,10)+'&select=id_loja,unidade,dia_operacional,turno,entregador,n_pedido,hora_pedido&order=hora_pedido.desc&limit=1000'),
      fj('ifood_fato_cancelamento?data=gte.'+(new Date(Date.now()-36*864e5)).toISOString().slice(0,10)+'&select=id_loja,data,turno,motivo,itens_cancelados,valor_cancelamento,valor_pedido,contestavel,loja_contestou&order=data.desc&limit=500'),
      fj('ifood_fato_avaliacao?select=id_loja,data_avaliacao,nota,tags,comentario&order=data_avaliacao.desc&limit=1000'),
      fj('ifood_fato_negociacao?select=id_loja,data,motivo,resposta_loja,cancelamento_evitado&order=data.desc&limit=500'),
      fj('ifood_dim_loja?select=id_loja,nome,unidade'),
      (async()=>{var dDet=(new Date(Date.now()-10*864e5)).toISOString().slice(0,10);var dBase=(new Date(Date.now()-36*864e5)).toISOString().slice(0,10);var r=await Promise.all([pag('foody_vw_pedido_prazo?dia_operacional=gte.'+dDet+'&select=n_pedido,unidade,turno,entregador,data_hora_pedido,dia_operacional,dt_entregue,t_coleta_min,t_total_min,dt_pronto,dt_despachado,dt_aceite,dt_coletado,raio_km,entrega_prometida,t_aceite_min,prazo_prometido_min,atraso_real_min,no_prazo_real,fonte_prazo_real&order=data_hora_pedido.asc'),pag('foody_vw_pedido_prazo?dia_operacional=gte.'+dBase+'&dia_operacional=lt.'+dDet+'&select=dia_operacional,unidade,turno,t_total_min,no_prazo_real&order=dia_operacional.asc')]);return r[0].concat(r[1])})(),
      (async()=>{const d30=(new Date(Date.now()-29*864e5)).toISOString().slice(0,10);const rr=await Promise.all([pag('foody_vw_pagamento_dia?dia_operacional=gte.'+d30+'&select=dia_operacional,unidade,nome,fez,horas,horas_qr,entregas,atrasos,no_prazo,sem_codigo&order=dia_operacional.asc'),pag('foody_vw_prazo_real_dia?dia_operacional=gte.'+d30+'&select=dia_operacional,unidade,entregador,no_prazo,atrasos&order=dia_operacional.asc')]);const mp={};rr[1].forEach(function(x){const k=x.dia_operacional+'|'+x.unidade+'|'+x.entregador;const o=mp[k]=mp[k]||{ok:0,at:0};o.ok+=(+x.no_prazo||0);o.at+=(+x.atrasos||0);});return rr[0].map(function(z){const o=mp[z.dia_operacional+'|'+z.unidade+'|'+z.nome];return Object.assign({},z,{no_prazo:o?o.ok:null,atrasos:o?o.at:null});});})(),
      fj('foody_vw_entregas_dia?dia_operacional=gte.'+(new Date(Date.now()-29*864e5)).toISOString().slice(0,10)+'&select=*&order=dia_operacional.asc&limit=2000')
    ]);
    try{ESCH=((await escRPC('aderencia',{de:(new Date(Date.now()-8*864e5)).toISOString().slice(0,10),ate:(new Date(Date.now()+864e5)).toISOString().slice(0,10)})).aderencia||[]).sort(function(a,b){return (a.entrada||'')<(b.entrada||'')?-1:1})}catch(e){ESCH=[]}
    DAYS=[...new Set(F.map(r=>r.dia_operacional))].sort();
    NAV=DAYS.slice(-7);
    DI=NAV.length-1;
    $('upd').textContent='atualizado '+new Date().toLocaleTimeString('pt-BR');
    render();
  }catch(e){$('conteudo').innerHTML='<div class="err">Erro ao carregar: '+e.message+'</div>'}
}
function setView(v){VIEW=v;['v_diario','v_equipe','v_ifood'].forEach(i=>$(i).classList.remove('active'));$('v_'+v).classList.add('active');render()}
function stepDay(d){DI=Math.min(Math.max(DI+d,0),NAV.length-1);render()}
function unidadeDe(id){const l=DIMS.find(x=>x.id_loja===id);return l?l.unidade:null}
function nomeLoja(id){const l=DIMS.find(x=>x.id_loja===id);return l?l.nome:id}
function fLoja(r){return LOJA==='Todas'||r.unidade===LOJA}
var BLOCO='Todos';
function blocoDe(t){t=(t||'').toString().toLowerCase();if(!t)return null;if(t.indexOf('almo')>=0||t.indexOf('tarde')>=0)return 'Dia';if(t.indexOf('jantar')>=0||t.indexOf('madrugada')>=0||t.indexOf('noite')>=0||t.indexOf('fecha')>=0)return 'Noite';return null}
function fBloco(r){if(BLOCO==='Todos')return true;var b=blocoDe(r&&r.turno);return b===null?true:b===BLOCO}
function blocoNome(){return BLOCO==='Todos'?'no dia':(BLOCO==='Dia'?'no bloco Dia':'na noite')}
function setBloco(b){BLOCO=b;render()}
function blocoBtns(){if(VIEW!=='diario')return '';var bs=['Todos','Dia','Noite'],o='<span style="display:inline-block;width:10px"></span>';for(var i=0;i<bs.length;i++){var b=bs[i];o+='<span class="tab '+(BLOCO===b?'on':'')+'" onclick="setBloco(&#39;'+b+'&#39;)">'+(b==='Todos'?'Dia inteiro':b)+'</span>'}return o}
function fLojaI(r){return LOJA==='Todas'||unidadeDe(r.id_loja)===LOJA}
function lojasHTML(){$('lojas').innerHTML=LOJAS.map(l=>'<span class="tab '+(LOJA===l?'on':'')+'" onclick="LOJA=\''+l+'\';render()">'+l+'</span>').join('')+blocoBtns()}
function kpi(l,v,f,c,k){return '<div class="kpi'+(k?' kbtn':'')+(k&&k===KSEL?' kon':'')+'"'+(k?' onclick="kClick(\''+k+'\')" title="Clique para ver a lista"':'')+' style="--kc:'+c+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="f">'+(f||'')+'</div></div>'}
var KSEL=null,KCTX={},REE=null,REEMOT=null,REEbusy=false;
(function(){var s=document.createElement('style');s.textContent='.kbtn{cursor:pointer;transition:transform .08s,box-shadow .12s}.kbtn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.35)}.kon{outline:2px solid var(--kc);outline-offset:1px}.kpain{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}.kpain h4{margin:0 0 9px;font-size:14px}.kpain table{width:100%;border-collapse:collapse;font-size:13px}.kpain th,.kpain td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.kpain select{background:var(--surface-1);color:var(--txt,#e6eaf0);border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:12px}.ktag{padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700;color:#fff}.kfech{float:right;cursor:pointer;color:var(--muted);font-weight:400}';document.head.appendChild(s)})();
function kEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function kHora(t){return t?String(t).slice(11,16):'—'}
function kClick(k){KSEL=(KSEL===k?null:k);render()}
async function reeRPC(acao,dados){const r=await fetch(SB+'rpc/reentrega_consulta',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({p_cred:cdmTok(),p_acao:acao,p_dados:dados||{}})});const j=await r.json().catch(function(){return null});if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j}
function reeGarante(){if(REE!==null||REEbusy)return;REEbusy=true;var de=(new Date(Date.now()-36*864e5)).toISOString().slice(0,10);Promise.all([reeRPC('listar',{de:de}),reeRPC('motivos')]).then(function(a){REE=Array.isArray(a[0])?a[0]:[];REEMOT=Array.isArray(a[1])?a[1]:[];REEbusy=false;render()}).catch(function(){REE=false;REEMOT=[];REEbusy=false;render()})}
function reeDia(D){return (REE||[]).filter(function(r){return r.dia_operacional===D&&fLoja(r)})}

function sortTable(th){
  const table=th.closest('table');if(!table)return;
  const headRow=th.parentElement;
  const idx=[...headRow.children].indexOf(th);
  const rows=[...table.querySelectorAll('tr')].slice(1);
  const key=tr=>{const c=tr.children[idx];const t=(c?c.innerText:'').trim();
    if(t.includes(':')&&t.length<=5)return t;
    const n=parseFloat(t.replace('+','').replace('%','').replace(' min','').replace('★','').replace(',','.'));
    return isNaN(n)?t.toLowerCase():n};
  const asc=th.dataset.asc!=='1';
  headRow.querySelectorAll('th').forEach(h=>{h.dataset.asc='';h.classList.remove('sd','sa')});
  th.dataset.asc=asc?'1':'0';th.classList.add(asc?'sa':'sd');
  rows.sort((a,b)=>{const x=key(a),y=key(b);
    const c=(typeof x==='string'||typeof y==='string')?String(x).localeCompare(String(y),'pt'):x-y;
    return asc?c:-c});
  rows.forEach(r=>table.appendChild(r));
}
