<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escala CDM">
<link rel="manifest" href="manifest-escala.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Escala do Delivery · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;
--good:#2fae6a;--bad:#e66767;--warn:#e0a93a;--brand:#c8102e;--blue:#3987e5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14.5px;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding:16px 14px 70px}
header{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--brand);padding-bottom:12px;margin-bottom:14px}
.dot{width:42px;height:42px;border-radius:10px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
h1{font-size:18px;font-weight:800}
.sub{color:var(--text2);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tab{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:7px 15px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;user-select:none}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tabs.nav .tab{border-radius:10px;padding:9px 18px;font-size:13.5px}
.sec{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:14px}
.sec h2{font-size:14px;font-weight:800}
.sec .hs{font-size:11.5px;color:var(--muted);margin:2px 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.btnr{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:700}
.btnr:hover{border-color:var(--muted);color:#fff}
.btnv{background:var(--good);border:none;color:#fff;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:800;cursor:pointer;width:100%;margin-top:12px}
.btnb{background:var(--blue);border:none;color:#fff;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:800;cursor:pointer}
input[type=time]{background:var(--s2);border:1px solid var(--line);border-radius:8px;color:#fff;padding:6px 8px;font-size:13px;font-family:inherit}
input[type=text]{background:var(--s2);border:1px solid var(--line);border-radius:8px;color:#fff;padding:7px 10px;font-size:13px;font-family:inherit;width:100%}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pg{background:rgba(47,174,106,.16);color:#5fd396}
.pw{background:rgba(224,169,58,.16);color:#e0a93a}
.pb{background:rgba(230,103,103,.16);color:#f19191}
.pi{background:rgba(57,135,229,.16);color:#7fb4f2}
.pm{background:rgba(138,137,126,.16);color:#a8a79b}
.empty{color:var(--muted);font-size:12.5px;padding:6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#122419;border:1px solid var(--good);color:#7ee2ae;padding:13px 22px;border-radius:12px;font-weight:800;display:none;z-index:50;max-width:90%;text-align:center}
.toast.err{background:#2a1518;border-color:var(--bad);color:#f5a9a9}
#gate{position:fixed;inset:0;background:var(--s0);z-index:100;display:flex;align-items:center;justify-content:center}
.gatebox{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:330px;text-align:center}
.gatebox input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:15px;outline:none;margin:14px 0 10px;text-align:center}
.gatebox button{width:100%;background:var(--brand);border:none;color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer}
.gerr{color:#f08d8d;font-size:12px;min-height:16px;margin-top:8px}
.x{color:var(--bad);cursor:pointer;font-weight:800;padding:0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:11px 13px}
.kpi .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:800;margin:2px 0}
.kpi .d{font-size:11px;color:var(--text2)}
.kpi.g{border-left-color:var(--good)}.kpi.w{border-left-color:var(--warn)}.kpi.b{border-left-color:var(--bad)}
.day{background:var(--s1);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.dayh{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--s2);cursor:pointer}
.dayh .ico{font-size:26px;line-height:1}
.dayh .dt{font-weight:800;font-size:14px}
.dayh .wx{font-size:11.5px;color:var(--text2);margin-top:1px}
.dayh .rt{margin-left:auto;text-align:right}
.dayb{padding:6px 15px 14px}
.loja{margin-top:10px}
.loja .ln{font-size:12px;font-weight:800;color:var(--text2);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.rain{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:5px}
.rain i{display:block;height:100%;background:var(--blue)}
.small{font-size:11px;color:var(--muted)}
.grp{margin:14px 0 4px;font-size:12px;font-weight:800;color:var(--warn);letter-spacing:.3px}
select{background:var(--s2);border:1px solid var(--line);border-radius:8px;color:#fff;padding:7px 9px;font-size:13px;font-family:inherit}
.hint{background:rgba(57,135,229,.08);border:1px solid rgba(57,135,229,.3);border-radius:9px;padding:9px 12px;font-size:12px;color:#a9cbf5;margin-bottom:10px}
.warnbox{background:rgba(224,169,58,.08);border:1px solid rgba(224,169,58,.3);border-radius:9px;padding:9px 12px;font-size:12px;color:#e8c882;margin-bottom:10px}
@media(max-width:560px){th,td{padding:6px 3px;font-size:12px}.wrap{padding:12px 9px 70px}}
</style>
</head>
<body>
<div id="gate"><div class="gatebox">
  <div class="dot" style="margin:0 auto 12px">CM</div>
  <h1>Escala do Delivery</h1>
  <div class="sub">Painel do Jaison — digite a senha</div>
  <input type="password" id="gpw" placeholder="Senha" onkeydown="if(event.key==='Enter')gateTry()">
  <button onclick="gateTry()">Entrar</button>
  <div class="gerr" id="gerr"></div>
</div></div>

<div class="wrap">
<header>
  <div class="dot">CM</div>
  <div style="flex:1"><h1>🗓 Escala do Delivery</h1><div class="sub" id="hsub">carregando…</div></div>
  <button id="instalar" onclick="instalarApp()" class="btnr" style="display:none">📲 Instalar</button>
  <button class="btnr" onclick="loadAll()">↻</button>
</header>

<div class="tabs nav">
  <span class="tab on" id="t_prev" onclick="setView('prev')">🌧 Previsão da semana</span>
  <span class="tab" id="t_mont" onclick="setView('mont')">✏️ Montar escala</span>
  <span class="tab" id="t_ader" onclick="setView('ader')">✅ Chegou no horário?</span>
</div>

<div id="conteudo"><div class="empty">carregando…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const HJ=Object.assign({'Content-Type':'application/json'},H);
const PASS_HASH='132704a017cc174942929dae49a5de2748d09170a0b16962cad693e88ee57441';
const OWNER_HASH='d7149f187239f5d99c428c666fa476b7e7808f38226765d5c62ed0ec65e7eaee';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function gateTry(){const v=document.getElementById('gpw').value;const h=await sha((v||'').trim());
  if(h===PASS_HASH||h===OWNER_HASH){sessionStorage.setItem('cm_del_ok','1');document.getElementById('gate').style.display='none';loadAll()}
  else document.getElementById('gerr').textContent='Senha incorreta.'}
if(sessionStorage.getItem('cm_del_ok')==='1'||sessionStorage.getItem('cm_owner_ok')==='1')document.getElementById('gate').style.display='none';

const LOJAS=['Água Verde','São Braz','Ahú'];
const TURNOS=['Almoço','Tarde','Jantar','Madrugada'];
const TORD={'Almoço':1,'Tarde':2,'Jantar':3,'Madrugada':4};
const DOWN=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
const br=d=>d.slice(8,10)+'/'+d.slice(5,7);
const dowOf=d=>{const p=d.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()};
const hm=x=>{if(!x)return '—';const d=new Date(x);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)};
const hmT=t=>t?String(t).slice(0,5):'—';
function toast(m,e){const t=$('toast');t.textContent=m;t.className='toast'+(e?' err':'');t.style.display='block';setTimeout(()=>{t.style.display='none'},3600)}
async function fj(u){const r=await fetch(SB+u,{headers:H});if(!r.ok)throw new Error('HTTP '+r.status+' em '+u);return r.json()}
async function rpc(fn,args){const r=await fetch(SB+'rpc/'+fn,{method:'POST',headers:HJ,body:JSON.stringify(args||{})});if(!r.ok)throw new Error('HTTP '+r.status+' em '+fn);return r.json()}

// ícone do tempo pelo código WMO da Open-Meteo
function wxIcon(code,mm){
  if(code==null)return mm>3?'🌧':mm>0.2?'🌦':'☀️';
  if(code>=95)return '⛈';
  if(code>=80)return '🌧';
  if(code>=71&&code<=77)return '🌨';
  if(code>=61&&code<=67)return '🌧';
  if(code>=51&&code<=57)return '🌦';
  if(code===45||code===48)return '🌫';
  if(code>=2&&code<=3)return '⛅';
  if(code===1)return '🌤';
  return '☀️';
}
function climaPill(c){
  if(c==='Chuva forte')return '<span class="pill pb">Chuva forte</span>';
  if(c==='Chuva')return '<span class="pill pw">Chuva</span>';
  if(c==='Garoa')return '<span class="pill pi">Garoa</span>';
  return '<span class="pill pm">Seco</span>';
}

let VIEW='prev', SUG=[], CLIMA=[], ESC=[], ADER=[], FORA=[], NOMES=[], DATA=null, LOJA='Água Verde', ROWS=[], ABERTO={};
const hoje=()=>iso(new Date());
function dias(n,off){const b=new Date();const a=[];for(let i=(off||0);i<(off||0)+n;i++)a.push(iso(new Date(b.getTime()+i*864e5)));return a}

async function loadAll(){
  try{
    const d0=hoje(), d7=dias(8)[7], dm7=iso(new Date(Date.now()-7*864e5));
    const r=await Promise.all([
      rpc('foody_sugere_escala_semana',{p_ini:d0,p_dias:8}),
      fj('clima_vw_dia?dia_op=gte.'+d0+'&dia_op=lte.'+d7+'&select=*&order=dia_op'),
      fj('foody_escala?data=gte.'+dm7+'&data=lte.'+d7+'&select=*&order=data,unidade,entrada&limit=2000'),
      fj('foody_vw_aderencia?dia_op=gte.'+dm7+'&dia_op=lt.'+d0+'&select=*&order=dia_op.desc&limit=1000'),
      fj('foody_vw_fora_escala?dia_op=gte.'+dm7+'&dia_op=lt.'+d0+'&select=*&order=dia_op.desc&limit=500')
    ]);
    SUG=r[0];CLIMA=r[1];ESC=r[2];ADER=r[3];FORA=r[4];
    const at=CLIMA.length?CLIMA[CLIMA.length-1].atualizado_em:null;
    $('hsub').textContent='previsão do tempo + histórico do Foody · clima atualizado '+(at?hm(at):'—');
    if(!DATA)DATA=dias(8)[1];
    render();
  }catch(e){$('conteudo').innerHTML='<div class="sec"><div class="empty">Erro ao carregar: '+esc(e.message)+'</div></div>'}
}
function setView(v){VIEW=v;['prev','mont','ader'].forEach(x=>$('t_'+x).className='tab'+(x===v?' on':''));render()}
function render(){VIEW==='prev'?viewPrev():VIEW==='mont'?viewMont():viewAder()}

/* ================= 1) PREVISÃO DA SEMANA ================= */
function viewPrev(){
  const ds=dias(8);
  const climaBy={};CLIMA.forEach(c=>climaBy[c.dia_op]=c);
  const escBy={};ESC.forEach(e=>{const k=e.data+'|'+e.unidade+'|'+(e.turno||'');escBy[k]=(escBy[k]||0)+1});
  let totMoto=0,totCusto=0,totCompl=0,diasChuva=0;
  ds.forEach(d=>{const c=climaBy[d];if(c&&c.clima!=='Seco')diasChuva++;});
  SUG.forEach(s=>{totMoto+=s.motoboys_sug;totCusto+=Number(s.custo_prev||0);totCompl+=Number(s.complemento_prev||0)});

  let h='<div class="kpis">'+
    kpi('Dias com chuva','b',diasChuva+'/8','na previsão dos próximos 8 dias')+
    kpi('Turnos a escalar','','' +SUG.filter(s=>s.motoboys_sug>0).length,'em 3 lojas')+
    kpi('Motoboy-turnos','','' +totMoto,'soma sugerida da semana')+
    kpi('Custo previsto','g','R$ '+fmt(totCusto),'entregas + complemento')+
  '</div>';

  h+='<div class="hint">O número sugerido busca <b>4 entregas por motoboy-hora</b>. Abaixo de 3,5 a loja paga complemento por gente parada; acima de 4,5 os pedidos começam a atrasar. Em chuva o alvo cai (a rua fica mais lenta) e a demanda sobe — por isso a sugestão aumenta.<br>A chuva vem de <b>dois modelos independentes</b> (Open-Meteo e MET Norway) — quando os dois concordam a previsão é confiável; quando discordam, escale pelo cenário de chuva e libere quem sobrar.</div>';

  ds.forEach(d=>{
    const c=climaBy[d]||{};
    const rows=SUG.filter(s=>s.dia===d&&(s.motoboys_sug>0||s.motoboys_hist>0));
    const mot=rows.reduce((a,b)=>a+b.motoboys_sug,0);
    const jaMont=ESC.filter(e=>e.data===d).length;
    const open=ABERTO[d]!==undefined?ABERTO[d]:(d===ds[1]);
    h+='<div class="day"><div class="dayh" onclick="ABERTO[\''+d+'\']='+(!open)+';render()">'+
      '<div class="ico">'+wxIcon(c.wcode_pico,Number(c.chuva_mm||0))+'</div>'+
      '<div><div class="dt">'+cap(DOWN[dowOf(d)])+' '+br(d)+' '+(d===ds[0]?'<span class="pill pm">hoje</span>':'')+'</div>'+
      '<div class="wx">'+(c.chuva_mm!=null?(c.chuva_mm+' mm · '+(c.prob_max||0)+'% chance · '+(c.tmin||'?')+'–'+(c.tmax||'?')+'°C · '+(c.horas_chovendo||0)+'h chovendo · '+(c.confianca||'')):'sem previsão')+'</div>'+
      '<div class="rain"><i style="width:'+Math.min(100,Number(c.chuva_mm||0)*6)+'%"></i></div></div>'+
      '<div class="rt">'+climaPill(c.clima)+'<div class="small" style="margin-top:4px">'+mot+' motoboys · '+(jaMont?'<span style="color:#5fd396">'+jaMont+' escalados</span>':'<span style="color:#e0a93a">escala vazia</span>')+'</div></div>'+
      '</div>';
    if(open){
      h+='<div class="dayb">';
      LOJAS.forEach(l=>{
        const rs=rows.filter(x=>x.unidade===l).sort((a,b)=>TORD[a.turno]-TORD[b.turno]);
        if(!rs.length)return;
        h+='<div class="loja"><div class="ln">'+l+'</div><table><tr><th onclick="sortTbl(this)" style="cursor:pointer">Turno \u21C5</th><th>Tempo</th><th class="num" onclick="sortTbl(this)" style="cursor:pointer">Entregas prev. \u21C5</th><th class="num" onclick="sortTbl(this)" style="cursor:pointer">Sugerido \u21C5</th><th class="num" onclick="sortTbl(this)" style="cursor:pointer">Histórico \u21C5</th><th>Por quê</th></tr>';
        rs.forEach(s=>{
          const dif=s.motoboys_sug-Number(s.motoboys_hist||0);
          const cor=dif>=0.5?'#5fd396':dif<=-0.5?'#e0a93a':'var(--text2)';
          h+='<tr><td><b>'+s.turno+'</b></td><td>'+climaPill(s.clima)+'</td>'+
             '<td class="num">'+s.ent_prev+'</td>'+
             '<td class="num" style="font-size:16px;font-weight:800;color:'+cor+'">'+s.motoboys_sug+'</td>'+
             '<td class="num small">'+(s.motoboys_hist||0)+'</td>'+
             '<td class="small">'+esc(s.motivo)+(s.h_cada?' · ~'+s.h_cada+'h cada':'')+'</td></tr>';
        });
        h+='</table></div>';
      });
      h+='<button class="btnb" style="margin-top:12px" onclick="event.stopPropagation();DATA=\''+d+'\';setView(\'mont\')">✏️ montar a escala deste dia →</button>';
      h+='</div>';
    }
    h+='</div>';
  });
  $('conteudo').innerHTML=h;
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fmt(n){return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0})}
function kpi(k,cls,v,d){return '<div class="kpi '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="d">'+d+'</div></div>'}

/* ================= 2) MONTAR ESCALA ================= */
async function viewMont(){
  const ds=dias(8);
  let h='<div class="tabs">'+ds.map(d=>'<span class="tab '+(DATA===d?'on':'')+'" onclick="DATA=\''+d+'\';ROWS=null;PEND={};render()">'+DOWN[dowOf(d)].slice(0,3)+' '+br(d)+'</span>').join('')+'</div>';
  h+='<div class="tabs">'+LOJAS.map(l=>'<span class="tab '+(LOJA===l?'on':'')+'" onclick="LOJA=\''+l+'\';ROWS=null;PEND={};render()">'+l+'</span>').join('')+'</div>';
  h+='<div id="montbody"><div class="empty">carregando\u2026</div></div>';
  $('conteudo').innerHTML=h;
  try{ NOMES=await rpc('foody_sugere_nomes',{p_dia:DATA}); }catch(e){ NOMES=[] }
  if(!ROWS)ROWS=ESC.filter(e=>e.data===DATA&&e.unidade===LOJA).map(e=>({nome:e.nome,turno:e.turno||'Jantar',entrada:hmT(e.entrada),saida:hmT(e.saida)}));
  ROWS.forEach(r=>{PEND[r.turno+'|'+r.nome]={entrada:r.entrada,saida:r.saida}});
  montBody();
}
function sel(t,n){return ROWS.some(r=>r.turno===t&&r.nome===n)}
function times(t,n){var k=t+'|'+n; if(PEND[k])return PEND[k]; var c=(NOMES.find(x=>x.unidade===LOJA&&x.turno===t&&x.nome===n)||{}); var d=defHora(t); return {entrada:(c.entrada_tipica||d[0]).slice(0,5),saida:(c.saida_tipica||d[1]).slice(0,5)} }
function setTime(t,n,campo,val){var k=t+'|'+n; PEND[k]=PEND[k]||times(t,n); PEND[k][campo]=val; var r=ROWS.find(r=>r.turno===t&&r.nome===n); if(r)r[campo]=val}
function toggle(t,n){var i=ROWS.findIndex(r=>r.turno===t&&r.nome===n); if(i>=0){ROWS.splice(i,1)} else {var tm=times(t,n); ROWS.push({nome:n,turno:t,entrada:tm.entrada,saida:tm.saida})} montBody()}
function preencher(t,n){var cand=NOMES.filter(x=>x.unidade===LOJA&&x.turno===t&&x.dias_sem_rodar<=21); var add=0; for(var c of cand){ if(ROWS.filter(r=>r.turno===t).length>=n)break; if(sel(t,c.nome))continue; var tm=times(t,c.nome); ROWS.push({nome:c.nome,turno:t,entrada:tm.entrada,saida:tm.saida}); add++ } montBody(); toast(add?add+' adicionados no '+t:'sem mais candidatos ativos no '+t, add?0:1)}
function montBody(){
  const sugBy={}; SUG.filter(s=>s.dia===DATA&&s.unidade===LOJA).forEach(s=>sugBy[s.turno]=s);
  const clima=(CLIMA.find(c=>c.dia_op===DATA)||{});
  let h='<div class="sec" style="padding:12px 14px"><h2>\u270F\uFE0F '+cap(DOWN[dowOf(DATA)])+' '+br(DATA)+' \u00B7 '+LOJA+'</h2>'+
    '<div class="hs" style="margin:2px 0 0">marque quem vai trabalhar e ajuste os hor\u00E1rios \u00B7 '+wxIcon(clima.wcode_pico,Number(clima.chuva_mm||0))+' '+(clima.clima||'')+'</div></div>';
  TURNOS.forEach(t=>{
    const sg=sugBy[t]; const alvo=sg?sg.motoboys_sug:0;
    let cand=NOMES.filter(x=>x.unidade===LOJA&&x.turno===t);
    ROWS.filter(r=>r.turno===t).forEach(r=>{ if(!cand.some(c=>c.nome===r.nome)) cand.push({nome:r.nome,unidade:LOJA,turno:t,vezes:0,dias_sem_rodar:0,entregas_med:'',ent_hora:''}) });
    if(!cand.length && !alvo) return;
    cand.sort((a,b)=>(sel(t,b.nome)-sel(t,a.nome))||(b.vezes-a.vezes));
    const nSel=ROWS.filter(r=>r.turno===t).length;
    const okcls=nSel>=alvo?'pg':'pw';
    h+='<div class="sec"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">'+turnoIcon(t)+' '+t+'</h2>'+
      '<span class="pill '+okcls+'">'+nSel+(alvo?' / '+alvo+' sugeridos':'')+'</span>'+
      (sg?'<span class="small" style="margin-left:auto">~'+sg.ent_prev+' entregas previstas</span>':'')+'</div>';
    if(alvo>nSel)h+='<button class="btnr" style="margin:8px 0" onclick="preencher(\''+t+'\','+alvo+')">\u26A1 preencher os '+alvo+' sugeridos</button>';
    h+='<table><tr><th style="width:40px"></th><th onclick="sortTbl(this)" style="cursor:pointer">Motoboy \u21C5</th><th onclick="sortTbl(this)" style="cursor:pointer">Entrada \u21C5</th><th onclick="sortTbl(this)" style="cursor:pointer">Sa\u00EDda \u21C5</th><th class="num" onclick="sortTbl(this)" style="cursor:pointer">hist. \u21C5</th></tr>';
    cand.slice(0,20).forEach(c=>{
      const on=sel(t,c.nome); const tm=times(t,c.nome); const sumido=c.dias_sem_rodar>21;
      h+='<tr style="'+(on?'':'opacity:.62')+'">'+
        '<td><input type="checkbox" '+(on?'checked':'')+' style="width:20px;height:20px" onchange="toggle(\''+t+'\',\''+c.nome.replace(/\x27/g,"\\x27")+'\')"></td>'+
        '<td><b>'+esc(c.nome)+'</b>'+(c.vezes?' <span class="small">'+c.vezes+'x'+(sumido?' \u00B7 '+c.dias_sem_rodar+'d sem rodar':'')+'</span>':'')+'</td>'+
        '<td><input type="time" value="'+tm.entrada+'" onchange="setTime(\''+t+'\',\''+c.nome.replace(/\x27/g,"\\x27")+'\',\'entrada\',this.value)"></td>'+
        '<td><input type="time" value="'+tm.saida+'" onchange="setTime(\''+t+'\',\''+c.nome.replace(/\x27/g,"\\x27")+'\',\'saida\',this.value)"></td>'+
        '<td class="num small">'+(c.ent_hora||'\u2014')+'</td></tr>';
    });
    h+='</table></div>';
  });
  h+='<div class="sec"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="text" id="novoNome" placeholder="outro motoboy (nome igual ao Foody)\u2026" style="flex:2;min-width:150px"><select id="selTurno" style="min-width:110px">'+TURNOS.map(t=>'<option>'+t+'</option>').join('')+'</select><button class="btnr" onclick="addManual()">adicionar</button></div></div>';
  h+='<button class="btnv" onclick="salvar()">\uD83D\uDCBE SALVAR ESCALA DESTE DIA</button>';
  $('montbody').innerHTML=h;
}
function turnoIcon(t){return t==='Almo\u00E7o'?'\u2600\uFE0F':t==='Tarde'?'\uD83C\uDF24':t==='Jantar'?'\uD83C\uDF19':'\uD83C\uDF03'}
function addManual(){var n=($('novoNome').value||'').trim(); var t=$('selTurno').value; if(!n){toast('digite um nome',1);return} if(sel(t,n)){toast('j\u00E1 est\u00E1 na escala',1);return} var d=defHora(t); ROWS.push({nome:n,turno:t,entrada:d[0],saida:d[1]}); montBody()}
function defHora(t){return t==='Almoço'?['10:45','15:00']:t==='Tarde'?['15:00','18:00']:t==='Jantar'?['18:30','23:30']:['23:30','03:30']}
function addNome(nome,turno,ent,sai){
  if(ROWS.some(r=>r.nome===nome&&r.turno===turno)){toast('já está na escala',1);return}
  const d=defHora(turno);
  ROWS.push({nome:nome,turno:turno,entrada:(ent||d[0]).slice(0,5),saida:(sai||d[1]).slice(0,5)});
  montBody();
}
function addSel(){
  const v=$('selNome').value,t=$('selTurno').value;
  if(!v){toast('escolha um motoboy',1);return}
  if(v==='__outro__'){const n=prompt('Nome do motoboy (igual está no Foody):');if(!n)return;addNome(n.trim(),t,'','');return}
  const p=v.split('|');addNome(p[0],t,p[1],p[2]);
}
function aplicar(turno,n){
  const cand=NOMES.filter(x=>x.unidade===LOJA&&x.turno===turno&&x.dias_sem_rodar<=21);
  let add=0;
  for(const c of cand){
    if(ROWS.filter(r=>r.turno===turno).length>=n)break;
    if(ROWS.some(r=>r.nome===c.nome&&r.turno===turno))continue;
    const d=defHora(turno);
    ROWS.push({nome:c.nome,turno:turno,entrada:(c.entrada_tipica||d[0]).slice(0,5),saida:(c.saida_tipica||d[1]).slice(0,5)});
    add++;
  }
  montBody();
  toast(add?add+' motoboy(s) adicionados no '+turno:'não achei mais candidatos ativos para o '+turno,add?0:1);
}
async function salvar(){
  try{
    for(const r of ROWS){if(!r.nome||!r.entrada||!r.saida){toast('faltou preencher horário de '+(r.nome||'alguém'),1);return}}
    const del=await fetch(SB+'foody_escala?data=eq.'+DATA+'&unidade=eq.'+encodeURIComponent(LOJA),{method:'DELETE',headers:HJ});
    if(!del.ok)throw new Error('não consegui limpar a escala antiga (HTTP '+del.status+')');
    if(ROWS.length){
      const body=ROWS.map(r=>({nome:r.nome,unidade:LOJA,data:DATA,turno:r.turno,entrada:r.entrada,saida:r.saida,origem:'jaison'}));
      const ins=await fetch(SB+'foody_escala',{method:'POST',headers:HJ,body:JSON.stringify(body)});
      if(!ins.ok)throw new Error('não consegui salvar (HTTP '+ins.status+')');
    }
    toast('✅ escala de '+br(DATA)+' salva ('+ROWS.length+' motoboys)');
    const d7=dias(8)[7],dm7=iso(new Date(Date.now()-7*864e5));
    ESC=await fj('foody_escala?data=gte.'+dm7+'&data=lte.'+d7+'&select=*&order=data,unidade,entrada&limit=2000');
  }catch(e){toast(e.message,1)}
}
