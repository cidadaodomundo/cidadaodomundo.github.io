<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;
--good:#2fae6a;--bad:#e66767;--warn:#e0a93a;--brand:#E0A81C;--brand-ink:#111110;--blue:#3987e5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:14.5px;line-height:1.45}
.wrap{max-width:960px;margin:0 auto;padding:16px 14px 70px}
header{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--brand);padding-bottom:12px;margin-bottom:14px}
.dot{width:42px;height:42px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
h1{font-size:18px;font-weight:800}
.sub{color:var(--text2);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tab{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:7px 15px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;user-select:none}
.tab.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tabs.nav .tab{border-radius:10px;padding:9px 18px;font-size:13.5px}
.sec{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:14px}
.sec h2{font-size:14px;font-weight:800}
.sec .hs{font-size:11.5px;color:var(--muted);margin:2px 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.btnr{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:700}
.btnr:hover{border-color:var(--muted);color:#fff}
.btnv{background:var(--good);border:none;color:#fff;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:800;cursor:pointer;width:100%;margin-top:12px}
.btnb{background:var(--blue);border:none;color:#fff;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:800;cursor:pointer}
input[type=time]{background:var(--s2);border:1px solid var(--line);border-radius:8px;color:#fff;padding:6px 8px;font-size:13px;font-family:inherit}
input[type=text]{background:var(--s2);border:1px solid var(--line);border-radius:8px;color:#fff;padding:7px 10px;font-size:13px;font-family:inherit;width:100%}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pg{background:rgba(47,174,106,.16);color:#5fd396}
.pw{background:rgba(224,169,58,.16);color:#e0a93a}
.pb{background:rgba(230,103,103,.16);color:#f19191}
.pi{background:rgba(57,135,229,.16);color:#7fb4f2}
.pm{background:rgba(138,137,126,.16);color:#a8a79b}
.empty{color:var(--muted);font-size:12.5px;padding:6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#122419;border:1px solid var(--good);color:#7ee2ae;padding:13px 22px;border-radius:12px;font-weight:800;display:none;z-index:50;max-width:90%;text-align:center}
.toast.err{background:#2a1518;border-color:var(--bad);color:#f5a9a9}
#gate{position:fixed;inset:0;background:var(--s0);z-index:100;display:flex;align-items:center;justify-content:center}
.gatebox{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:330px;text-align:center}
.gatebox input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:15px;outline:none;margin:14px 0 10px;text-align:center}
.gatebox button{width:100%;background:var(--brand);color:var(--brand-ink);border:none;color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer}
.gerr{color:#f08d8d;font-size:12px;min-height:16px;margin-top:8px}
.x{color:var(--bad);cursor:pointer;font-weight:800;padding:0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:11px 13px}
.kpi .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:800;margin:2px 0}
.kpi .d{font-size:11px;color:var(--text2)}
.kpi.g{border-left-color:var(--good)}.kpi.w{border-left-color:var(--warn)}.kpi.b{border-left-color:var(--bad)}
.day{background:var(--s1);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.dayh{display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--s2);cursor:pointer}
.dayh .ico{font-size:26px;line-height:1}
.dayh .dt{font-weight:800;font-size:14px}
.dayh .wx{font-size:11.5px;color:var(--text2);margin-top:1px}
.dayh .rt{margin-left:auto;text-align:right}
.dayb{padding:6px 15px 14px}
.loja{margin-top:10px}
.loja .ln{font-size:12px;font-weight:800;color:var(--text2);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.rain{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:5px}
.rain i{display:block;height:100%;background:var(--blue)}
.small{font-size:11px;color:var(--muted)}
.grp{margin:14px 0 4px;font-size:12px;font-weight:800;color:var(--warn);letter-spacing:.3px}
select{background:var(--s2);border:1px solid var(--line);border-radius:8px;color:#fff;padding:7px 9px;font-size:13px;font-family:inherit}
.hint{background:rgba(57,135,229,.08);border:1px solid rgba(57,135,229,.3);border-radius:9px;padding:9px 12px;font-size:12px;color:#a9cbf5;margin-bottom:10px}
.warnbox{background:rgba(224,169,58,.08);border:1px solid rgba(224,169,58,.3);border-radius:9px;padding:9px 12px;font-size:12px;color:#e8c882;margin-bottom:10px}
@media(max-width:560px){th,td{padding:6px 3px;font-size:12px}.wrap{padding:12px 9px 70px}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--s2,#232321);border:1px solid var(--line,#34332f);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;user-select:none;color:var(--text2,#c3c2b7)}
.chip.on{background:#1d6b43;border-color:#2fae6a;color:#fff}
.chip .h{font-size:11.5px;opacity:.85;font-weight:700}
.colar textarea{width:100%;min-height:150px;background:var(--s2,#232321);border:1px solid var(--line,#34332f);border-radius:10px;color:#fff;padding:11px;font-size:13.5px;font-family:inherit}
.cob{display:flex;gap:3px;align-items:flex-end;margin:10px 0 2px;overflow-x:auto}
.cb{display:flex;flex-direction:column;align-items:center;min-width:22px;flex:1}
.cb .bar{width:100%;border-radius:4px 4px 0 0;background:#2fae6a}
.cb .bar.z{background:#4a3030}
.cb .bar.a{background:#c98500}
.cb .hl{font-size:9.5px;color:var(--muted);margin-top:3px}
.cb .nn{font-size:10.5px;font-weight:800;color:var(--text2)}
.stat{display:inline-flex;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.stat.ok{background:rgba(47,174,106,.15);color:#5fd396;border:1px solid rgba(47,174,106,.45)}
.stat.par{background:rgba(201,133,0,.15);color:#e0a93a;border:1px solid rgba(201,133,0,.45)}
.stat.no{background:rgba(200,16,46,.15);color:#f08d8d;border:1px solid rgba(200,16,46,.45)}
.tamb{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.lojasel{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.lsb{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--text2);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.lsb.on{background:#e0a93a;border-color:#e0a93a;color:#141414}

/* cara da casa 04-09-2026 */
.gatebox button{color:var(--brand-ink)}
h1,.gatebox h1{font-weight:400}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06}

/* cabe no celular 04-09-2026 — filas de aba nunca vazam ate 900px; o resto so em tela estreita */
@media (max-width:900px){.views,.tabs,.abas,.fil,.pes,.filtros,.chips,.lojas,.periodos{display:flex;flex-wrap:wrap;gap:6px;width:auto;max-width:100%;min-width:0}.views>*,.tabs>*,.abas>*,.fil>*,.pes>*{flex:0 0 auto;max-width:100%}}@media (max-width:640px){body{padding-left:12px;padding-right:12px}table{display:block;width:max-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}h1{font-size:clamp(18px,6.2vw,26px);word-break:break-word}img,svg,canvas,iframe{max-width:100%}}
</style>

<body>

<div class="wrap">
<header>
  <div class="dot">CM</div>
  <div style="flex:1"><h1>🗓 Escala do Delivery</h1><div class="sub" id="hsub">carregando…</div></div>
  <button id="instalar" onclick="instalarApp()" class="btnr" style="display:none">📲 Instalar</button>
  <button class="btnr" onclick="loadAll()">🔄 Atualizar</button>
</header>

<div class="tabs nav">
  <span class="tab on" id="t_prev" onclick="setView('prev')">🌧 Previsão da semana</span>
  <span class="tab" id="t_mont" onclick="setView('mont')">✏️ Montar escala</span>
  <span class="tab" id="t_ader" onclick="setView('ader')">✅ Chegou no horário?</span>
</div>

<div id="conteudo"><div class="empty">carregando…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const HJ=Object.assign({'Content-Type':'application/json'},H);
/* ===== porta unica do portal: sessao por usuario ===== */
const CDMMODS=['escala'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmTem(id){try{const l=JSON.parse(sessionStorage.getItem('cdm_modulos')||'[]');return Array.isArray(l)&&l.some(function(m){return m&&m.id===id})}catch(e){return false}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/rpc/portal_eu',{method:'POST',headers:{apikey:'sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV',Authorization:'Bearer sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV','Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:'escala'})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  try{sessionStorage.setItem('cdm_nome',j.nome||'');sessionStorage.setItem('cdm_admin',j.admin?'1':'0');sessionStorage.setItem('cdm_modulos',JSON.stringify(ms))}catch(e){}
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}

const LOJAS=['Água Verde','São Braz','Ahú'];
var LOJA_PREV=(function(){try{var v=sessionStorage.getItem('cdm_esc_loja');return LOJAS.indexOf(v)>=0?v:LOJAS[0]}catch(e){return LOJAS[0]}})();
var NOMES_AB={};
function setLojaPrev(l){if(LOJAS.indexOf(l)<0)return;LOJA_PREV=l;try{sessionStorage.setItem('cdm_esc_loja',l)}catch(e){}render()}
function toggleNomes(k){NOMES_AB[k]=!NOMES_AB[k];render()}
const DONO=(function(){try{return sessionStorage.getItem('cdm_admin')==='1'}catch(e){return false}})();
const DOWNS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function periodoAderDow(k){var d=new Date();d.setHours(12,0,0,0);var i=0;while(d.getDay()!==k&&i<8){d.setDate(d.getDate()-1);i++}if(iso(d)===iso(new Date())){d.setDate(d.getDate()-7)}var v=iso(d);ADER_INI=v;ADER_FIM=v;var x=document.getElementById('aderIni'),y=document.getElementById('aderFim');if(x)x.value=v;if(y)y.value=v;aplicarPeriodoAder();}
const TURNOS=['Almoço','Tarde','Jantar','Madrugada'];
const TORD={'Almoço':1,'Tarde':2,'Jantar':3,'Madrugada':4};
const DOWN=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
const br=d=>d.slice(8,10)+'/'+d.slice(5,7);
const dowOf=d=>{const p=d.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()};
const hm=x=>{if(!x)return '—';const d=new Date(x);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)};
const hmT=t=>t?String(t).slice(0,5):'—';
function toast(m,e){const t=$('toast');t.textContent=m;t.className='toast'+(e?' err':'');t.style.display='block';setTimeout(()=>{t.style.display='none'},3600)}
async function fj(u){const r=await fetch(SB+u,{headers:H});if(!r.ok)throw new Error('HTTP '+r.status+' em '+u);return r.json()}
async function rpc(fn,args){const r=await fetch(SB+'rpc/'+fn,{method:'POST',headers:HJ,body:JSON.stringify(args||{})});if(!r.ok)throw new Error('HTTP '+r.status+' em '+fn);return r.json()}
function escRPC(acao,dados){return rpc('escala_consulta',{p_cred:cdmTok(),p_acao:acao,p_dados:dados||{}})}

// ícone do tempo pelo código WMO da Open-Meteo
function wxIcon(code,mm){
  if(code==null)return mm>3?'🌧':mm>0.2?'🌦':'☀️';
  if(code>=95)return '⛈';
  if(code>=80)return '🌧';
  if(code>=71&&code<=77)return '🌨';
  if(code>=61&&code<=67)return '🌧';
  if(code>=51&&code<=57)return '🌦';
  if(code===45||code===48)return '🌫';
  if(code>=2&&code<=3)return '⛅';
  if(code===1)return '🌤';
  return '☀️';
}
function climaPill(c){
  if(c==='Chuva forte')return '<span class="pill pb">Chuva forte</span>';
  if(c==='Chuva')return '<span class="pill pw">Chuva</span>';
  if(c==='Garoa')return '<span class="pill pi">Garoa</span>';
  return '<span class="pill pm">Seco</span>';
}

let VIEW='prev', SUG=[], CLIMA=[], ESC=[], ADER=[], FORA=[], NOMES=[], DATA=null, LOJA='Água Verde', ROWS=[], ABERTO={}, RESUMO=true, ULT=0, ADER_INI=null, ADER_FIM=null, LOJA_ADER='Todas';
const hoje=()=>iso(new Date());
function dias(n,off){const b=new Date();const a=[];for(let i=(off||0);i<(off||0)+n;i++)a.push(iso(new Date(b.getTime()+i*864e5)));return a}

async function loadAll(){
  try{
    const d0=hoje(), d7=dias(8)[7], dm7=iso(new Date(Date.now()-7*864e5));
if(!ADER_INI){ADER_INI=dm7;ADER_FIM=iso(new Date(Date.now()-864e5))}
    const r=await Promise.all([
      rpc('foody_sugere_escala_semana',{p_ini:d0,p_dias:8}),
      fj('clima_vw_dia?dia_op=gte.'+d0+'&dia_op=lte.'+d7+'&select=*&order=dia_op'),
      escRPC('escala',{de:dm7,ate:d7}),
      escRPC('aderencia',{de:ADER_INI,ate:ADER_FIM})
    ]);
    SUG=r[0];CLIMA=r[1];ESC=r[2];ADER=r[3].aderencia||[];FORA=r[3].fora||[];
    ULT=Date.now();
    const at=CLIMA.length?CLIMA[CLIMA.length-1].atualizado_em:null;
    $('hsub').textContent='previsão do tempo + histórico do Foody · clima atualizado '+(at?hm(at):'—')+' · esta tela: '+hm(ULT);
    if(!DATA)DATA=dias(8)[1];
    render();
  }catch(e){$('conteudo').innerHTML='<div class="sec"><div class="empty">Erro ao carregar: '+esc(e.message)+'</div></div>'}
}
function setView(v){VIEW=v;['prev','mont','ader'].forEach(x=>$('t_'+x).className='tab'+(x===v?' on':''));render()}
function render(){VIEW==='prev'?viewPrev():VIEW==='mont'?viewMont():viewAder()}

/* ================= 1) PREVISÃO DA SEMANA ================= */
function viewPrev(){
  const ds=dias(8);
  const climaBy={};CLIMA.forEach(c=>climaBy[c.dia_op]=c);
  const escBy={};ESC.forEach(e=>{const k=e.data+'|'+e.unidade+'|'+(e.turno||'');escBy[k]=(escBy[k]||0)+1});
  let totMoto=0,totCusto=0,totCompl=0,diasChuva=0;
  ds.forEach(d=>{const c=climaBy[d];if(c&&c.clima!=='Seco')diasChuva++;});
  SUG.filter(s=>s.unidade===LOJA_PREV).forEach(s=>{totMoto+=s.motoboys_sug;totCusto+=Number(s.custo_prev||0);totCompl+=Number(s.complemento_prev||0)});

  let h='<div class="lojasel">'+LOJAS.map(function(l){return '<button class="lsb'+(l===LOJA_PREV?' on':'')+'" data-l="'+esc(l)+'" onclick="setLojaPrev(this.dataset.l)">'+esc(l)+'</button>'}).join('')+'</div>';
  h+='<div class="kpis">'+
    kpi('Dias com chuva','b',diasChuva+'/8','na previsão dos próximos 8 dias')+
    kpi('Turnos a escalar','','' +SUG.filter(s=>s.motoboys_sug>0&&s.unidade===LOJA_PREV).length,'em '+LOJA_PREV)+
    kpi('Motoboy-turnos','','' +totMoto,'soma sugerida da semana')+
  '</div>';

  h+='<div class="hint">O número sugerido busca <b>4 entregas por motoboy-hora</b> — é o alvo com folga. A medição de 11.980 pedidos (30/08) mostrou onde o atraso dispara de verdade: <b>acima de 5,5 por motoboy no seco, e acima de 4 na chuva</b> — na chuva passando de 5,5, só 33% chegam no prazo. Abaixo de 3,5 a loja paga complemento por gente parada. Em chuva a demanda do almoço sobe ~20% e vem menos motoboy — por isso a sugestão aumenta. O retrato ao vivo, minuto a minuto, está na tela ⏱ Tempo de Entrega.<br>A chuva vem de <b>dois modelos independentes</b> (Open-Meteo e MET Norway) — quando os dois concordam a previsão é confiável; quando discordam, escale pelo cenário de chuva e libere quem sobrar.</div>';

  ds.forEach(d=>{
    const c=climaBy[d]||{};
    const rows=SUG.filter(s=>s.dia===d&&s.unidade===LOJA_PREV&&(s.motoboys_sug>0||s.motoboys_hist>0));
    const mot=rows.reduce((a,b)=>a+b.motoboys_sug,0);
    const jaMont=ESC.filter(e=>e.data===d&&e.unidade===LOJA_PREV).length;
    const lojasEsc=[...new Set(ESC.filter(e=>e.data===d&&e.unidade===LOJA_PREV).map(e=>e.unidade))];
    const motComp=lojasEsc.length?rows.filter(x=>lojasEsc.indexOf(x.unidade)>=0).reduce((a,b)=>a+b.motoboys_sug,0):mot;
    const semEsc=LOJAS.filter(l=>lojasEsc.indexOf(l)<0&&rows.some(x=>x.unidade===l));

const APELIDOS={'JOSE':'José cogumelo de Alencar vieira','KAWAN':'Kawann Bindá','KAWANN':'Kawann Bindá',
'MIRIAN':'Mirian Benício','MYRIAN':'Mirian Benício','ERICK':'Erick Issa Bellizzi','RHYAN':'Rhyan Sabadin',

const DIASEM={'SEGUNDA':1,'TERCA':2,'QUARTA':3,'QUINTA':4,'SEXTA':5,'SABADO':6,'DOMINGO':0};
function semAc(x){return (x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim()}
function nomeReal(n){var k=semAc(n).replace(/\.$/,'').trim();
  for(var a in APELIDOS){if(semAc(a)===k)return APELIDOS[a]}
  return n.replace(/\.$/,'').trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase()})}
function parseEscala(txt){
  var linhas=[],erros=[],data=null,turno=null,ini=null;
  var mh=(txt||'').match(/ESCALA\s+(\d{1,2})\/(\d{1,2})/i);
  if(mh){var hj=new Date();ini=new Date(hj.getFullYear(),parseInt(mh[2],10)-1,parseInt(mh[1],10))}
  (txt||'').split('\n').forEach(function(raw){
    var l=raw.replace(/\*/g,'').trim(); if(!l)return;
    if(/^[_\-=\s]+$/.test(l))return;
    if(/^\(/.test(l))return;
    var L=semAc(l);
    if(/^ESCALA\b/.test(L))return;
    var md=L.match(/^(SEGUNDA|TERCA|QUARTA|QUINTA|SEXTA|SABADO|DOMINGO)\b/);
    if(md){
      if(!ini){erros.push('faltou a linha ESCALA dd/mm');return}
      var alvo=DIASEM[md[1]], d=new Date(ini.getTime()), passo=(alvo===0?6:alvo-1);
      d.setDate(d.getDate()+passo); data=iso(d);
      if(/ALMOC/.test(L))turno='Almoço'; else if(/JANTA/.test(L))turno='Jantar';
      return;
    }
    if(/^ALMOC/.test(L)){turno='Almoço';return}
    if(/^JANTA/.test(L)){turno='Jantar';return}
    if(/^\d/.test(l))return;
    var m=l.match(/^(.+?)\s+(\d{1,2})(?::\d{2})?\s*(?:AS|ÀS)\s*(\d{1,2})(?::\d{2})?$/i);
    if(m){
      if(!data||!turno){erros.push(l);return}
      var sai=parseInt(m[3],10);
      linhas.push({nome:nomeReal(m[1]),data:data,turno:turno,bruto:m[1].trim(),
        entrada:('0'+parseInt(m[2],10)).slice(-2)+':00',saida:(sai>=24?'00':('0'+sai).slice(-2))+':00'});
      return}
    m=l.match(/^(.+?)\s+(\d{1,2})\s*\/\s*FECHA$/i);
    if(m){
      if(!data||!turno){erros.push(l);return}
      linhas.push({nome:nomeReal(m[1]),data:data,turno:turno,bruto:m[1].trim(),
        entrada:('0'+parseInt(m[2],10)).slice(-2)+':00',saida:'02:00'});
      return}
    erros.push(l);
  });
  return {linhas:linhas,erros:erros}
}

    '<button class="btn" style="margin-top:8px" onclick="copiarSemanaPassada()">\u21BA repetir a semana passada</button>'+'<button class="btnr" style="margin-top:8px" onclick="toggleResumo()">'+(RESUMO?'✏️ ver detalhado':'👁 ver resumido')+'</button>'+(ROWS.length?barraCobertura(ROWS):'')+'</div>';
  if(RESUMO){h+=resumoDia();$('montbody').innerHTML=h+'<button class="btnv" onclick="salvar()">💾 SALVAR ESCALA DESTE DIA</button>';return;}
const extras=ROWS.map(r=>r.nome).filter(n=>ATIVOS.indexOf(n)<0);
  const cand=ATIVOS.concat(extras.filter((v,k)=>extras.indexOf(v)===k));
  TURNOS_ESC.forEach(t=>{
    const nSel=ROWS.filter(r=>cobre(r,t)).length;
    h+='<div class="sec"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
       '<h2 style="margin:0">'+(turnoIcon(t)||'')+' '+(t==='Almo\u00E7o'?'ALMO\u00C7O':(t==='Jantar'?'JANTA':'FECHA \u{1F319}'))+'</h2>'+
       '<span class="pill '+(nSel?'pg':'pw')+'">'+nSel+' cobrindo</span></div>';
    const outros=ROWS.filter(r=>cobre(r,t)&&r.turno!==t);
    if(outros.length)h+='<div class="tamb">também cobre este turno: '+outros.map(r=>esc(r.nome.split(' ')[0])+' ('+String(r.entrada).slice(0,2)+'h→'+String(r.saida).slice(0,2)+'h)').join(' · ')+'</div>';
    BLOCOS[t].forEach(bl=>{
      const e=bl[0],sa=bl[1],chave=e+'|'+sa;
      const dentro=ROWS.filter(r=>r.turno===t&&String(r.entrada).slice(0,5)===e&&String(r.saida).slice(0,5)===sa).length;
      h+='<div class="hs" style="margin:12px 0 2px;font-weight:700;color:var(--text2)">'+rotBloco(e,sa)+(dentro?' \u00B7 '+dentro:'')+'</div><div class="chips">';
      cand.forEach(n=>{
        const b=blocoDe(t,n), on=(b===chave), noutro=(b&&!on);
        if(noutro)return;
        h+='<span class="chip'+(on?' on':'')+'" onclick="porBloco(\''+t+'\',\''+e+'\',\''+sa+'\',\''+n.replace(/\x27/g,"\\x27")+'\')">'+esc(n.split(' ')[0])+'</span>';
      });
      h+='</div>';
    });
    h+='</div>';
  });
  h+='<div class="sec"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="text" id="novoNome" placeholder="outro motoboy (nome igual ao Foody)\u2026" style="flex:2;min-width:150px"><select id="selTurno" style="min-width:110px">'+TURNOS_ESC.map(t=>'<option>'+t+'</option>').join('')+'</select><button class="btnr" onclick="addManual()">adicionar</button></div></div>';
  h+='<button class="btnv" onclick="salvar()">\uD83D\uDCBE SALVAR ESCALA DESTE DIA</button>';
  $('montbody').innerHTML=h;
}
function turnoIcon(t){return t==='Almo\u00E7o'?'\u2600\uFE0F':t==='Tarde'?'\uD83C\uDF24':t==='Jantar'?'\uD83C\uDF19':'\uD83C\uDF03'}
function addManual(){var n=($('novoNome').value||'').trim(); var t=$('selTurno').value; if(!n){toast('digite um nome',1);return} if(sel(t,n)){toast('j\u00E1 est\u00E1 na escala',1);return} var d=defHora(t); ROWS.push({nome:n,turno:t,entrada:d[0],saida:d[1]}); montBody()}
function defHora(t){return t==='Almoço'?['10:45','15:00']:t==='Tarde'?['15:00','18:00']:t==='Jantar'?['18:30','23:30']:['23:30','03:30']}
function addNome(nome,turno,ent,sai){
  if(ROWS.some(r=>r.nome===nome&&r.turno===turno)){toast('já está na escala',1);return}
  const d=defHora(turno);
  ROWS.push({nome:nome,turno:turno,entrada:(ent||d[0]).slice(0,5),saida:(sai||d[1]).slice(0,5)});
  montBody();
}
function addSel(){
  const v=$('selNome').value,t=$('selTurno').value;
  if(!v){toast('escolha um motoboy',1);return}
  if(v==='__outro__'){const n=prompt('Nome do motoboy (igual está no Foody):');if(!n)return;addNome(n.trim(),t,'','');return}
  const p=v.split('|');addNome(p[0],t,p[1],p[2]);
}
function aplicar(turno,n){
  const cand=NOMES.filter(x=>x.unidade===LOJA&&x.turno===turno&&x.dias_sem_rodar<=21);
  let add=0;
  for(const c of cand){
    if(ROWS.filter(r=>r.turno===turno).length>=n)break;
    if(ROWS.some(r=>r.nome===c.nome&&r.turno===turno))continue;
    const d=defHora(turno);
    ROWS.push({nome:c.nome,turno:turno,entrada:(c.entrada_tipica||d[0]).slice(0,5),saida:(c.saida_tipica||d[1]).slice(0,5)});
    add++;
  }
  montBody();
  toast(add?add+' motoboy(s) adicionados no '+turno:'não achei mais candidatos ativos para o '+turno,add?0:1);
}
async function salvar(){
  try{
    for(const r of ROWS){if(!r.nome||!r.entrada||!r.saida){toast('faltou preencher horário de '+(r.nome||'alguém'),1);return}}
    const body=ROWS.map(r=>({nome:r.nome,unidade:LOJA,data:DATA,turno:r.turno,entrada:r.entrada,saida:r.saida,origem:'jaison'}));
    await escRPC('salvar_dia',{data:DATA,unidade:LOJA,linhas:body});
    toast('✅ escala de '+br(DATA)+' salva ('+ROWS.length+' motoboys)');
    const d7=dias(8)[7],dm7=iso(new Date(Date.now()-7*864e5));
    ESC=await escRPC('escala',{de:dm7,ate:d7});
  }catch(e){toast(e.message,1)}
}

/* ================= 3) ADERÊNCIA ================= */
function viewAder(){
  const a=ADER.filter(x=>LOJA_ADER==='Todas'||x.unidade===LOJA_ADER);
  const fora=FORA.filter(x=>LOJA_ADER==='Todas'||x.unidade===LOJA_ADER);
  const tot=a.length;
  const noH=a.filter(x=>x.status==='No horário').length;
  const atr=a.filter(x=>x.status==='Atrasado'||x.status==='Muito atrasado').length;
  const falt=a.filter(x=>x.status==='Faltou').length;
  const semQR=a.filter(x=>x.status==='Sem check-in').length;
  const atrMed=a.filter(x=>x.atraso_min!=null&&x.atraso_min>0);
  const med=atrMed.length?Math.round(atrMed.reduce((s,x)=>s+Number(x.atraso_min),0)/atrMed.length):0;

  let h='';
h+='<div class="sec" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">'+
'<div><div class="hs" style="margin:0 0 4px">De</div><input type="date" id="aderIni" value="'+ADER_INI+'"></div>'+
'<div><div class="hs" style="margin:0 0 4px">Até</div><input type="date" id="aderFim" value="'+ADER_FIM+'"></div>'+
'<button class="btnr" onclick="aplicarPeriodoAder()">aplicar</button>'+
'<button class="btnr" onclick="periodoAderRapido(7)">7 dias</button>'+
'<button class="btnr" onclick="periodoAderRapido(30)">30 dias</button>'+
    '<span style="flex-basis:100%;height:0"></span>'+DOWNS.map(function(n,k){return '<button class="btnr" onclick="periodoAderDow('+k+')">'+n+'</button>'}).join('')+
'</div>';
h+='<div class="tabs">'+['Todas'].concat(LOJAS).map(l=>'<span class="tab '+(LOJA_ADER===l?'on':'')+'" onclick="LOJA_ADER=\''+l+'\';viewAder()">'+l+'</span>').join('')+'</div>';
  if(!tot){
    h+='<div class="warnbox">Ainda não há escala salva nos últimos 7 dias, então não dá para comparar combinado × chegada. Monte a escala na aba <b>Montar escala</b> — a partir do primeiro dia salvo esta tela passa a mostrar quem chegou no horário.</div>';
  }
  h+='<div class="kpis">'+
    kpi('Escalados','', tot,'últimos 7 dias')+
    kpi('No horário','g',(tot?Math.round(100*noH/tot):0)+'%',noH+' de '+tot)+
    kpi('Atrasados','w',atr,(DONO&&med)?'média de '+med+' min':'—')+
    kpi('Faltas','b',falt,'nenhum sinal no dia')+
  '</div>';

  h+='<div class="hint">A chegada mostrada é a <b>1ª coleta</b> do motoboy no Foody — é uma pista de quando ele começou, não a hora exata em que chegou.</div>';

  h+='<div class="sec"><h2>👤 Por motoboy</h2><div class="hs">clique no cabeçalho para ordenar</div>';
  const by={};
  a.forEach(x=>{const k=x.nome;by[k]=by[k]||{nome:k,dias:0,noH:0,atr:0,falt:0,semQR:0,soma:0,cnt:0,ent:0};
    const o=by[k];o.dias++;o.ent+=Number(x.entregas||0);
    if(x.status==='No horário')o.noH++;else if(x.status==='Faltou')o.falt++;else if(x.status==='Sem check-in')o.semQR++;else o.atr++;
    if(x.atraso_min!=null){o.soma+=Number(x.atraso_min);o.cnt++}});
  const arr=Object.values(by).sort((x,y)=>y.dias-x.dias);
  if(!arr.length)h+='<div class="empty">sem dados ainda</div>';
  else{
    h+='<table id="tbMoto"><tr>'+['Motoboy','Dias','No horário','Atrasos','Faltas','Atraso médio','Entregas'].map((c,i)=>'<th onclick="sortT(\'tbMoto\','+i+')" style="cursor:pointer">'+c+' ⇅</th>').join('')+'</tr>';
    arr.forEach(o=>{
      const pct=o.dias?Math.round(100*o.noH/o.dias):0;
      h+='<tr><td>'+esc(o.nome)+'</td><td class="num">'+o.dias+'</td>'+
         '<td class="num"><span class="pill '+(pct>=80?'pg':pct>=60?'pw':'pb')+'">'+pct+'%</span></td>'+
         '<td class="num">'+o.atr+'</td><td class="num">'+(o.falt?'<span style="color:#f19191">'+o.falt+'</span>':'0')+'</td>'+
         
         '<td class="num">'+(DONO?(o.cnt?Math.round(o.soma/o.cnt)+' min':'—'):'·')+'</td><td class="num">'+o.ent+'</td></tr>';
    });
    h+='</table>';
  }
  h+='</div>';

  h+='<div class="sec"><h2>📋 Dia a dia</h2><div class="hs">combinado × chegada real</div>';
  if(!a.length)h+='<div class="empty">sem dados ainda</div>';
  else{
    h+='<table id="tbDia"><tr>'+['Dia','Motoboy','Loja','Turno','Combinado','Chegou','Diferença','Situação','Entregas'].map((c,i)=>'<th onclick="sortT(\'tbDia\','+i+')" style="cursor:pointer">'+c+' ⇅</th>').join('')+'</tr>';
    a.slice(0,300).forEach(x=>{
      const st=x.status;
      const cls=st==='No horário'?'pg':st==='Atrasado'?'pw':st==='Sem check-in'?'pi':'pb';
      const stx=st==='Sem check-in'?'—':st;
      const dif=x.atraso_min==null?'—':(Number(x.atraso_min)>0?'+'+x.atraso_min+' min':x.atraso_min+' min');
      h+='<tr><td>'+br(x.dia_op)+'</td><td>'+esc(x.nome)+'</td><td class="small">'+esc(x.unidade)+'</td><td class="small">'+esc(x.turno||'—')+'</td>'+
         '<td>'+hmT(x.entrada)+'</td><td>'+hm(x.chegada_efetiva)+(x.fonte_chegada==='Foody (1ª coleta)'?' <span class="pill pi">Foody</span>':'')+'</td>'+
         '<td class="num" style="color:'+(x.atraso_min>5?'#f19191':'#5fd396')+'">'+dif+'</td>'+
         '<td><span class="pill '+cls+'">'+stx+'</span></td><td class="num">'+(x.entregas||0)+'</td></tr>';
    });
    h+='</table>';
  }
  h+='</div>';

  if(fora.length){
    h+='<div class="sec"><h2>❓ Rodou sem estar na escala</h2><div class="hs">apareceu no Foody mas não estava escalado — confira se foi troca de última hora</div><table><tr><th>Dia</th><th>Motoboy</th><th>Loja</th><th class="num">Entregas</th><th>1ª coleta</th></tr>';
    fora.slice(0,60).forEach(f=>{h+='<tr><td>'+br(f.dia_op)+'</td><td>'+esc(f.nome)+'</td><td class="small">'+esc(f.unidade)+'</td><td class="num">'+f.entregas+'</td><td>'+hm(f.primeira_coleta)+'</td></tr>'});
    h+='</table></div>';
  }
  $('conteudo').innerHTML=h;
}

async function aplicarPeriodoAder(){
ADER_INI=$('aderIni').value;ADER_FIM=$('aderFim').value;
if(!ADER_INI||!ADER_FIM){toast('escolha as duas datas',1);return}
try{
const r=await escRPC('aderencia',{de:ADER_INI,ate:ADER_FIM});
ADER=r.aderencia||[];FORA=r.fora||[];
viewAder();
}catch(e){toast(e.message,1)}
}
function periodoAderRapido(n){
ADER_FIM=iso(new Date(Date.now()-864e5));
ADER_INI=iso(new Date(Date.now()-(n+1)*864e5));
$('aderIni').value=ADER_INI;$('aderFim').value=ADER_FIM;
aplicarPeriodoAder();
}

/* ordenação de tabela por clique no cabeçalho */
function sortTbl(th){var table=th.closest('table');if(!table)return;var idx=Array.prototype.indexOf.call(th.parentNode.children,th);th.__d=!th.__d;var dir=th.__d?1:-1;Array.prototype.forEach.call(th.parentNode.children,function(x){x.innerHTML=x.innerHTML.replace(/ [\u25B2\u25BC\u21C5]$/,'')+' \u21C5'});th.innerHTML=th.innerHTML.replace(/ [\u25B2\u25BC\u21C5]$/,'')+(dir>0?' \u25B2':' \u25BC');function val(tr){var c=tr.cells[idx];if(!c)return'';var inp=c.querySelector('input[type=time],input[type=text]');var sv=inp?inp.value:c.innerText;var num=parseFloat(String(sv).replace(':','').replace(/[^0-9,.\-]/g,'').replace(',','.'));return isNaN(num)?String(sv).toLowerCase():num}var rows=Array.prototype.slice.call(table.tBodies[0].rows).filter(function(rr){return !rr.querySelector('th')});rows.sort(function(a,b){var x=val(a),y=val(b);return (typeof x==='number'&&typeof y==='number')?(x-y)*dir:String(x).localeCompare(String(y),'pt-BR')*dir});rows.forEach(function(rr){table.tBodies[0].appendChild(rr)})}
const SORTD={};
function sortT(id,col){
  const t=$(id);if(!t)return;
  const rows=[].slice.call(t.rows,1);
  const k=id+'_'+col;SORTD[k]=!SORTD[k];const dir=SORTD[k]?1:-1;
  const val=tr=>{const c=tr.cells[col];if(!c)return '';const s=c.innerText.trim();
    const n=parseFloat(s.replace(/[^0-9,.\-]/g,'').replace(/\./g,'').replace(',','.'));
    return isNaN(n)?s.toLowerCase():n};
  rows.sort((a,b)=>{const x=val(a),y=val(b);return (typeof x==='number'&&typeof y==='number')?(x-y)*dir:String(x).localeCompare(String(y),'pt-BR')*dir});
  rows.forEach(r=>t.tBodies[0].appendChild(r));
}
