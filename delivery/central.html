.lcard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}

@media(max-width:640px){h1{font-size:15.5px}.kpi .v{font-size:19px}.view{padding:8px 12px;font-size:12.5px}}

<script>

const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
/* ===== porta unica do portal: sessao por usuario ===== */

function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmTem(id){try{const l=JSON.parse(sessionStorage.getItem('cdm_modulos')||'[]');return Array.isArray(l)&&l.some(function(m){return m&&m.id===id})}catch(e){return false}}

  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/rpc/portal_eu',{method:'POST',headers:{apikey:'sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV',Authorization:'Bearer sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV','Content-Type':'application/json'},body:JSON.stringify({p_token:t})});
    if(r.ok)j=await r.json();

  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}

const LOJAS=['Todas','Água Verde','São Braz','Ahú'];
let F=[],SC=[],CANC=[],AVAL=[],NEG=[],DIMS=[],ATR=[],PAG=[],ESCH=[],IPER='hoje',DAYS=[],NAV=[],DI=0,LOJA='Todas',VIEW='diario',PER=7;
const $=id=>document.getElementById(id);
const br=d=>{const[y,m,dd]=d.split('-');return dd+'/'+m};
const DOWN=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const dow=d=>{const[y,m,dd]=d.split('-').map(Number);return new Date(Date.UTC(y,m-1,dd)).getUTCDay()};
const pctS=(ok,at)=>{const b=ok+at;return b?Math.round(1000*ok/b)/10:null};
// promessa real do iFood por raio (cenário Padrão): até 2km=39 · 2-3=45 · 3-4=50 · 4-5=55 · 5-6=60 · 6-7=65 · 7+=70
const atrasoReal=p=>p.atraso_real_min==null?null:+p.atraso_real_min;
async function fj(u){const r=await fetch(SB+u,{headers:H});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function escRPC(acao,dados){const r=await fetch(SB+'rpc/escala_consulta',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({p_cred:cdmTok(),p_acao:acao,p_dados:dados||{}})});const j=await r.json().catch(function(){return null});if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j}
async function pag(base){let all=[],from=0,step=1000;
  while(true){const r=await fetch(SB+base,{headers:{...H,Range:from+'-'+(from+step-1)}});if(!r.ok)throw new Error('HTTP '+r.status);
    const p=await r.json();all=all.concat(p);if(p.length<step)break;from+=step}return all}

var ENTR=[];
var SVS=[],SVSD=[],SVSK={},SVSMAX="",PAU=[],PAUMAX="";
async function svsLoad(){try{
  var ini=(NAV&&NAV.length)?NAV[0]:(new Date(Date.now()-8*864e5)).toISOString().slice(0,10);
  var ns=[],vis={};
  for(var i=0;i<SC.length;i++){var s=SC[i];if(s&&s.dia_operacional>=ini&&s.n_pedido&&/^[0-9]+$/.test(s.n_pedido)&&!vis[s.n_pedido]){vis[s.n_pedido]=1;ns.push(s.n_pedido)}}
  var alvo="cancelado.is.true"+(ns.length?",n_pedido.in.("+ns.slice(0,300).join(",")+")":"");
  var rr=await Promise.all([
    fj("saipos_venda_status?dia_operacional=gte."+ini+"&or=("+alvo+")&select=unidade,dia_operacional,n_pedido,cancelado,itens_cancelados,canal&order=dia_operacional.desc&limit=1000"),
    fj("saipos_vw_status_dia?dia_operacional=gte."+ini+"&select=dia_operacional,unidade,vendas,cancelados&order=dia_operacional.desc&limit=1000")]);
  SVS=rr[0]||[];SVSD=rr[1]||[];
  SVSMAX="";SVSD.forEach(function(r){if(r.dia_operacional>SVSMAX)SVSMAX=r.dia_operacional});
  SVSK={};SVS.forEach(function(r){SVSK[r.dia_operacional+"|"+r.unidade+"|"+r.n_pedido]=r.canal||""});
}catch(e){SVS=[];SVSD=[];SVSMAX=""}}
function canalDe(r){var v=SVSK[(r.dia_operacional||"")+"|"+(r.unidade||"")+"|"+(r.n_pedido||"")];return v?v:"—"}
function svsLojas(){var s={};SVSD.forEach(function(r){if(fLoja(r))s[r.unidade]=1});return Object.keys(s).length}
function svsDia(d){return SVSD.filter(function(r){return r.dia_operacional===d&&fLoja(r)})}
function _ehDono(){try{return sessionStorage.getItem("cdm_admin")==="1"}catch(e){return false}}
var GCOR={"Água Verde":"#4da3ff","São Braz":"#f0b95a","Ahú":"#5ddc9b"};
function _gc(u){return GCOR[u]||"#9aa3ad"}
function _min(a,b){if(!a||!b)return null;var m=(new Date(String(b).replace(" ","T"))-new Date(String(a).replace(" ","T")))/6e4;return (isFinite(m)&&m>=0&&m<600)?m:null}
function _frase(t){return '<div style="margin:8px 0 2px;font-size:13.5px;line-height:1.45">'+t+'</div>'}
function _barras(itens,fmt){
  if(!itens.length)return '<div class="empty">Sem dado no período.</div>';
  var mx=1;itens.forEach(function(i){if(i.v>mx)mx=i.v});
  return '<div style="display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:5px 10px;align-items:center;margin-top:8px">'+itens.map(function(i){
    var pc=Math.max(2,Math.round(100*i.v/mx));
    return '<div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px" title="'+kEsc(i.r)+'">'+kEsc(i.r)+'</div>'+
      '<div style="background:var(--line);border-radius:5px;height:15px"><div style="width:'+pc+'%;height:15px;border-radius:5px;background:'+(i.c||"#4da3ff")+'"></div></div>'+
      '<div style="font-size:12px;white-space:nowrap"><b>'+(fmt?fmt(i.v):i.v)+'</b></div>'}).join("")+'</div>';
}
function blocoGrafPrazo(){
  var h2='<div class="sec"><h2>📈 Prazo dia a dia</h2>';
  var dias={},uni={};
  PRZ.forEach(function(r){if(!fLoja(r))return;dias[r.dia_operacional]=1;var u=uni[r.unidade]=uni[r.unidade]||{};var x=u[r.dia_operacional]=u[r.dia_operacional]||{e:0,ok:0};x.e+=(+r.entregas||0);x.ok+=(+r.no_prazo||0)});
  var ds=Object.keys(dias).sort(), us=Object.keys(uni).sort();
  if(!ds.length)return h2+'<div class="empty">Sem dado no período.</div></div>';
  var meio=Math.max(1,ds.length-7), rec=ds.slice(meio), ant=ds.slice(0,meio);
  var _pp=function(u,lst){var e=0,o=0;lst.forEach(function(d){var x=uni[u][d];if(x){e+=x.e;o+=x.ok}});return e?Math.round(1000*o/e)/10:null};
  var fr=us.map(function(u){var aa=_pp(u,ant),bb=_pp(u,rec);if(aa==null||bb==null)return null;var d=Math.round((bb-aa)*10)/10;
    return '<b style="color:'+_gc(u)+'">'+kEsc(u)+'</b> '+(d>=1?'subiu '+d+' pontos':(d<=-1?'caiu '+Math.abs(d)+' pontos':'ficou igual'))+' na última semana ('+bb+'% agora)'}).filter(Boolean);
  h2+=(fr.length?_frase(fr.join(' · ')+'.'):'')+'<div class="hs" style="color:var(--muted)">% no prazo por dia, últimos '+ds.length+' dias</div>';
  var W=680,HH=160,pl=34,pr=10,pt=12,pb=22,n=ds.length;
  var X=function(i){return pl+(n<2?(W-pl-pr)/2:i*(W-pl-pr)/(n-1))};
  var Y=function(v){return pt+(100-v)*(HH-pt-pb)/100};
  var g='<svg viewBox="0 0 '+W+' '+HH+'" style="width:100%;height:auto;margin-top:6px" role="img" aria-label="prazo por dia">';
  [50,75,100].forEach(function(v){g+='<line x1="'+pl+'" y1="'+Y(v)+'" x2="'+(W-pr)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="4" y="'+(Y(v)+4)+'" fill="var(--muted)" font-size="10">'+v+'%</text>'});
  us.forEach(function(u){var d="",ini=false;
    ds.forEach(function(dd,i){var x=uni[u][dd];if(!x||!x.e)return;d+=(ini?" L":"M")+X(i).toFixed(1)+" "+Y(100*x.ok/x.e).toFixed(1);ini=true});
    if(d)g+='<path d="'+d+'" fill="none" stroke="'+_gc(u)+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'});
  ds.forEach(function(dd,i){if(i%3===0||i===n-1)g+='<text x="'+X(i).toFixed(1)+'" y="'+(HH-6)+'" fill="var(--muted)" font-size="10" text-anchor="middle">'+dd.slice(8,10)+"/"+dd.slice(5,7)+'</text>'});
  return h2+g+'</svg></div>';
}
function _pedNav(){var ok={};(NAV||[]).forEach(function(d){ok[d]=1});
  return ATR.filter(function(p){return ok[p.dia_operacional]&&fLoja(p)&&p.data_hora_pedido&&p.t_total_min!=null})}
function blocoGrafGargalo(){
  var ps=_pedNav();
  var h2='<div class="sec"><h2>🔎 Onde o tempo se perde</h2>';
  if(!ps.length)return h2+'<div class="empty">Sem dado no período.</div></div>';
  var et=[{r:"Cozinha (pedido → pronto)",k:["data_hora_pedido","dt_pronto"],c:"#f0b95a"},
          {r:"Pronto parado (→ rota)",k:["dt_pronto","dt_despachado"],c:"#e2725b"},
          {r:"Rota → coleta",k:["dt_despachado","dt_coletado"],c:"#9b8cff"},
          {r:"Rua (coleta → entrega)",k:["dt_coletado","dt_entregue"],c:"#4da3ff"}];
  var itens=et.map(function(e){var s=0,q=0;ps.forEach(function(p){var m=_min(p[e.k[0]],p[e.k[1]]);if(m!=null){s+=m;q++}});return {r:e.r,v:q?Math.round(10*s/q)/10:0,c:e.c}});
  var pior=itens.slice().sort(function(a,b){return b.v-a.v})[0];
  var tot=itens.reduce(function(a,i){return a+i.v},0);
  var hr={};ps.forEach(function(p){var k=String(p.data_hora_pedido).slice(11,13);var x=hr[k]=hr[k]||{e:0,a:0};x.e++;if(!p.no_prazo_real)x.a++});
  var pi=Object.keys(hr).filter(function(k){return hr[k].e>=10}).map(function(k){return {h:k,p:Math.round(1000*hr[k].a/hr[k].e)/10,e:hr[k].e}}).sort(function(a,b){return b.p-a.p}).slice(0,3);
  h2+=_frase('Da loja até o cliente são <b>'+Math.round(tot)+' min</b> em média. O maior pedaço é <b>'+pior.r.split(" (")[0]+'</b>, com <b>'+pior.v+' min</b>.'+
    (pi.length?' A hora mais crítica é <b>'+pi[0].h+'h</b>, com '+pi[0].p+'% de atraso.':''));
  h2+=_barras(itens,function(v){return v+" min"});
  if(pi.length)h2+='<div class="hs" style="margin-top:12px;color:var(--muted)">as 3 piores horas</div>'+_barras(pi.map(function(x){return {r:x.h+"h · "+x.e+" pedidos",v:x.p,c:"#e2725b"}}),function(v){return v+"%"});
  return h2+'</div>';
}
function blocoGrafMotivos(){
  var d30=(new Date(Date.now()-30*864e5)).toISOString().slice(0,10);
  var d14=(new Date(Date.now()-14*864e5)).toISOString().slice(0,10);
  var h2='<div class="sec"><h2>🗣 Por que cancelam e por que reclamam</h2>';
  var cs=CANC.filter(function(r){return r.data>=d30&&fLojaI(r)});

function _realPorMoto(dias){var m={};(typeof ATR!=='undefined'?ATR:[]).forEach(function(p){if(dias.indexOf(p.dia_operacional)<0)return;if(!p.entregador)return;var k=p.entregador+'|'+p.unidade;var o=m[k]=m[k]||{ok:0,at:0,e:0};o.e++;if(p.no_prazo_real)o.ok++;else o.at++});return m}
function _tabelaTurno(dias){
  var ORD={'Almoço':1,'Tarde':2,'Jantar':3,'Madrugada':4};
  var m={};
  (typeof ATR!=='undefined'?ATR:[]).forEach(function(p){
    if(dias.indexOf(p.dia_operacional)<0)return;
    if(!p.entregador)return;
    if(LOJA!=='Todas'&&String(p.unidade||'')!==LOJA)return;
    var t=p.turno||'—', k=t+'|'+p.entregador+'|'+p.unidade;
    var o=m[k]=m[k]||{t:t,n:p.entregador,l:p.unidade,e:0,ok:0,at:0,ds:{}};
    o.e++; if(p.no_prazo_real)o.ok++; else o.at++; o.ds[p.dia_operacional]=1;
  });
  var L=Object.keys(m).map(function(k){var o=m[k];o.d=Object.keys(o.ds).length;o.p=pctS(o.ok,o.at);return o});
  if(!L.length) return '';
  L.sort(function(a,b){return (ORD[a.t]||9)-(ORD[b.t]||9)||b.e-a.e});
  var h='</div><div class="sec"><h2>Por motoboy e turno</h2><div class="hs">quem rodou em cada turno, pelo prazo real do iFood · clique no cabeçalho para ordenar</div>';

  L.forEach(function(o){
    var cls=o.p==null?'pw':o.p>=90?'pg':o.p>=70?'pw':'pb';
    h+='<tr><td><b>'+o.t+'</b></td><td>'+o.n+'</td><td style="color:var(--text2)">'+o.l+'</td><td>'+o.d+'</td><td>'+o.e+'</td><td>'+o.ok+'</td><td>'+o.at+'</td><td><span class="pill '+cls+'">'+(o.p==null?'—':o.p+'%')+'</span></td></tr>';
  });

function aggMoto(rows){
  const m={};rows.forEach(r=>{const k=r.nome+'|'+r.unidade;const o=m[k]=m[k]||{n:r.nome,l:r.unidade,d:0,h:0,e:0,ok:0,at:0,sem:0,v:0,g:0,c:0,rec:0,qr:0};
    o.d++;o.h+=(+r.horas||0);o.e+=(+r.entregas||0);o.ok+=(+r.no_prazo||0);o.at+=(+r.atrasos||0);o.sem+=(+r.sem_codigo||0);
    o.v+=(+r.fez||0);
    if(r.horas_qr!=null)o.qr++;});
  return Object.values(m).map(o=>({...o,p:pctS(o.ok,o.at)}));
}

function sortTable(th){
  const table=th.closest('table');if(!table)return;
  const headRow=th.parentElement;
  const idx=[...headRow.children].indexOf(th);
  const rows=[...table.querySelectorAll('tr')].slice(1);
  const key=tr=>{const c=tr.children[idx];const t=(c?c.innerText:'').trim();
    if(t.includes(':')&&t.length<=5)return t;
    const n=parseFloat(t.replace('+','').replace('%','').replace(' min','').replace('★','').replace(',','.'));
    return isNaN(n)?t.toLowerCase():n};
  const asc=th.dataset.asc!=='1';
  headRow.querySelectorAll('th').forEach(h=>{h.dataset.asc='';h.classList.remove('sd','sa')});
  th.dataset.asc=asc?'1':'0';th.classList.add(asc?'sa':'sd');
  rows.sort((a,b)=>{const x=key(a),y=key(b);
    const c=(typeof x==='string'||typeof y==='string')?String(x).localeCompare(String(y),'pt'):x-y;
    return asc?c:-c});
  rows.forEach(r=>table.appendChild(r));
}
