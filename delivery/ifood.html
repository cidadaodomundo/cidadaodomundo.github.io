<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iFood · Cidadão do Mundo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c;
    --txt:#e6eaf0; --mut:#95a1b2; --acc:#4aa3ff;
    --bad:#e5484d; --warn:#f5a623; --ok:#3fb27f; --neu:#7c8aa0;
  }
  *{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
  h1{font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sub{color:var(--mut);font-size:12.5px;margin-top:3px}
  a.xlink{color:var(--acc);text-decoration:none;font-size:12.5px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:var(--panel2)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:bold;padding:9px 16px;border-radius:20px;cursor:pointer}
  .tab.on{background:#f5a623;color:#0d1117;border-color:#f5a623}
  .chip{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:20px;padding:5px 11px;cursor:pointer;font-size:12.5px;user-select:none}
  .chip.on{background:var(--acc);color:#0d1117;border-color:var(--acc);font-weight:bold}
  .tcnt{display:inline-block;background:rgba(0,0,0,.28);border-radius:10px;padding:0 7px;font-size:11px;margin-left:5px;vertical-align:1px}
  select,input[type=date]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:12px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .card .big{font-size:22px;font-weight:bold}
  .card .lbl{color:var(--mut);font-size:12px;margin-bottom:4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
  table{width:100%;border-collapse:collapse;font-size:12.8px}
  th{color:var(--mut);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:hover td{background:var(--panel2)}
  .pill{display:inline-block;border-radius:12px;padding:2px 9px;font-size:11.5px;font-weight:bold}
  .p-bad{background:rgba(229,72,77,.18);color:#ff8a8e}
  .p-warn{background:rgba(245,166,35,.18);color:#ffc46b}
  .p-ok{background:rgba(63,178,127,.18);color:#6fdcae}
  .p-neu{background:rgba(124,138,160,.18);color:#aab6c8}
  .stars{color:#f5a623;font-weight:bold}
  .muted{color:var(--mut)}
  .flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .cwrap{position:relative;height:260px}
  @media(max-width:640px){.card .big{font-size:18px}.cwrap{height:200px}}
</style>
</head>
<body>

<div id="gate" style="position:fixed;inset:0;background:#0f1216;display:flex;align-items:center;justify-content:center;z-index:9999">
  <div style="background:#171b21;border:1px solid #2a323c;border-radius:12px;padding:26px;width:300px;text-align:center">
    <div style="font-size:17px;font-weight:bold;margin-bottom:6px">🍔 iFood · Cidadão do Mundo</div>
    <div style="color:#95a1b2;font-size:13px;margin-bottom:16px">Painel restrito — digite a senha</div>
    <input id="gp" type="password" placeholder="Senha" autocomplete="current-password" style="width:100%;box-sizing:border-box;background:#1e242c;color:#e6eaf0;border:1px solid #2a323c;border-radius:8px;padding:11px;font-size:15px;margin-bottom:10px">
    <div id="gerr" style="display:none;color:#e5484d;font-size:12.5px;margin-bottom:8px">Senha incorreta.</div>
    <button onclick="_tryAuth()" style="width:100%;background:#f5a623;color:#0d1117;border:0;border-radius:8px;padding:11px;font-size:14px;font-weight:bold;cursor:pointer">Entrar</button>
  </div>
</div>

<div id="appwrap" class="wrap" style="display:none">
  <div class="flex" style="justify-content:space-between">
    <div>
      <h1>🍔 iFood · Qualidade Operacional</h1>
      <div class="sub">Cidadão do Mundo Burgers &amp; Arts — dados ao vivo do Supabase · <span id="upinfo" class="muted"></span></div>
    </div>
    <a class="xlink" href="./index.html">⏱ Painel de Ponto →</a>
  </div>

  <div class="bar" id="unidades"></div>
  <div class="bar">
    <select id="lojasel"></select>
    <span class="chip" data-d="1">Hoje</span>
    <span class="chip" data-o="1">📆 Ontem</span>
    <span class="chip on" data-d="7">Semana</span>
    <input type="date" id="d1" style="display:none"> <span class="muted" style="display:none">até</span> <input type="date" id="d2" style="display:none">
  </div>

  <div class="cards" id="kpis"></div>

  <div class="bar" id="tabs">
    <span class="tab on" data-t="aval">⭐ Avaliações</span>
    <span class="tab" data-t="canc">🚫 Cancelamentos</span>
    <span class="tab" data-t="neg">📞 Chamados</span>
    <span class="tab" data-t="resp">💬 Taxa de Resposta</span>
    <span class="tab" data-t="super">🏆 Selo Super</span>
  </div>
  <div id="content"></div>
</div>

<script>
const SUPABASE_URL="https://kqvoatdprjwxyadhvtdd.supabase.co";
const SUPABASE_KEY="sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV";
const sb=(typeof supabase!=="undefined"&&supabase.createClient)?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

let LOJAS=[],CANC=[],NEG=[],AVAL=[],QUAL=[],SUPER=[];
let F={unidade:"Todas",loja:0,d1:null,d2:null,tab:"aval"};

const fmtBRL=v=>(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmtPct=v=>v==null?"–":(v*100).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%";
const dISO=d=>d.toISOString().slice(0,10);
const dBR=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"–";

// Expedição monta a rota e adiciona bebidas, molhos/sachês e sobremesas; cozinha faz o resto.
const RX_EXPED=/refrigerante|pepsi|coca|guaran[aá]|suco|bebida|[aá]gua|cerveja|lata|\b2l\b|350ml|500ml|600ml|maionese|molho|sach[eê]|ketchup|mostarda|brownie|sobremesa|cheesecake|pudim|a[cç]a[ií]|sorvete|doce/i;
function respItem(itens){
  if(!itens||itens==="-")return "indef";
  return RX_EXPED.test(itens)?"expedicao":"cozinha";
}

async function fetchAll(table,select,order){
  let out=[],from=0,page=1000;
  for(;;){
    let q=sb.from(table).select(select);
    if(order)q=q.order(order,{ascending:false});
    const{data,error}=await q.range(from,from+page-1);
    if(error){console.error(table,error);break}
    out=out.concat(data||[]);
    if(!data||data.length<page)break;
    from+=page;
  }
  return out;
}

async function loadAll(){
  document.getElementById("content").innerHTML='<div class="panel muted">Carregando dados ao vivo…</div>';
  [LOJAS,CANC,NEG,AVAL,QUAL,SUPER]=await Promise.all([
    fetchAll("ifood_dim_loja","id_loja,nome,unidade,ativa"),
    fetchAll("ifood_fato_cancelamento","id_loja,id_pedido,data,turno,status_pedido,motivo,impactou_super,valor_pedido,valor_cancelamento,itens_cancelados,origem,contestavel,loja_contestou,status_contestacao","data"),
    fetchAll("ifood_fato_negociacao","id_loja,id_pedido,data,turno,motivo,momento_solicitacao,quem_iniciou,resposta_loja,resposta_cliente,valor_reembolso,valor_cupom,cancelamento_evitado,impactou_super","data"),
    fetchAll("ifood_fato_avaliacao","id_loja,data_avaliacao,nota,tags,comentario","data_avaliacao"),
    fetchAll("ifood_fato_qualidade_periodo","id_loja,periodo_inicio,periodo_fim,pedidos_totais,cancelamentos_super,pct_cancelamentos_super,negociacoes_super,pct_negociacoes_super,pct_respostas_negociacoes,qtd_avaliacoes,media_avaliacoes","periodo_fim"),
    fetchAll("ifood_fato_super_status","tipo,id_loja,referencia,periodo,e_elegivel,e_super,nivel,status,total_pedidos,pedidos_avaliados,media_avaliacoes,pct_cancelamento,canc_resp_loja,pct_chamados,chamados_validos,plano_acao","referencia"),
  ]);
  const maxd=[...CANC.map(r=>r.data),...AVAL.map(r=>r.data_avaliacao)].sort().pop();
  document.getElementById("upinfo").textContent="últimos dados: "+(maxd?dBR(maxd)+"/"+maxd.slice(0,4):"–");
  buildUnidades();render();
}

function buildUnidades(){
  const us=["Todas",...new Set(LOJAS.map(l=>l.unidade).filter(Boolean))];
  document.getElementById("unidades").innerHTML=us.map(u=>`<span class="chip${u===F.unidade?" on":""}" data-u="${u}">${u==="Todas"?"🏙 Todas as unidades":u}</span>`).join("");
  document.querySelectorAll("#unidades .chip").forEach(c=>c.onclick=()=>{F.unidade=c.dataset.u;F.loja=0;buildUnidades();buildLojaSel();render();});
  buildLojaSel();
}
function buildLojaSel(){
  const ls=LOJAS.filter(l=>F.unidade==="Todas"||l.unidade===F.unidade);
  document.getElementById("lojasel").innerHTML='<option value="0">🏪 Todas as lojas</option>'+ls.map(l=>`<option value="${l.id_loja}">${l.nome}</option>`).join("");
  document.getElementById("lojasel").value=F.loja;
}
function lojaIds(){
  return new Set(LOJAS.filter(l=>(F.unidade==="Todas"||l.unidade===F.unidade)&&(!F.loja||l.id_loja==F.loja)).map(l=>l.id_loja));
}
function inPeriod(d){return d&&d>=F.d1&&d<=F.d2}
function lojaNome(id){const l=LOJAS.find(x=>x.id_loja===id);return l?l.nome:id}

function filtered(){
  const ids=lojaIds();
  return{
    canc:CANC.filter(r=>ids.has(r.id_loja)&&inPeriod(r.data)),
    neg:NEG.filter(r=>ids.has(r.id_loja)&&inPeriod(r.data)),
    aval:AVAL.filter(r=>ids.has(r.id_loja)&&inPeriod(r.data_avaliacao)),
  };
}

function render(){
  const f=filtered();
  const nota=f.aval.length?f.aval.reduce((s,r)=>s+r.nota,0)/f.aval.length:null;
  const vCanc=f.canc.reduce((s,r)=>s+(+r.valor_cancelamento||0),0);
  const evit=f.neg.filter(r=>r.cancelamento_evitado).length;
  document.getElementById("kpis").innerHTML=[
    ["Nota média no período",nota?`<span class="stars">★ ${nota.toFixed(2)}</span>`:"–",f.aval.length+" avaliações"],
    ["Cancelamentos",f.canc.length,fmtBRL(vCanc)+" perdidos"],
    ["Chamados / negociações",f.neg.length,evit+" cancelamentos evitados"],
    ["Notas baixas (1–3)",f.aval.filter(r=>r.nota<=3).length,"de "+f.aval.length+" avaliações"],
  ].map(([l,v,s])=>`<div class="card"><div class="lbl">${l}</div><div class="big">${v}</div><div class="muted" style="font-size:12px">${s}</div></div>`).join("");
  const cnts={aval:f.aval.length,canc:f.canc.length,neg:f.neg.length,resp:f.neg.length,super:SUPER.filter(r=>r.tipo==="nivel_atual"&&r.e_super&&lojaIds().has(r.id_loja)).length};
  document.querySelectorAll("#tabs .tab").forEach(t=>{if(!t.dataset.lbl)t.dataset.lbl=t.innerHTML;const c=cnts[t.dataset.t];t.innerHTML=t.dataset.lbl+(c!=null?' <span class="tcnt">'+c+"</span>":"");});
  ({aval:rAval,canc:rCanc,neg:rNeg,resp:rResp,super:rSuper})[F.tab](f);
}

let _charts=[];
function newChart(id,cfg){const el=document.getElementById(id);if(!el||typeof Chart==="undefined")return;_charts.push(new Chart(el,cfg));}
function clearCharts(){_charts.forEach(c=>c.destroy());_charts=[];}
function setContent(html){clearCharts();document.getElementById("content").innerHTML=html;}

function rAval(f){
  const porDia={};f.aval.forEach(r=>{const d=r.data_avaliacao;porDia[d]=porDia[d]||{n:0,s:0};porDia[d].n++;porDia[d].s+=r.nota;});
  const dias=Object.keys(porDia).sort();
  const tagCount={};f.aval.forEach(r=>(r.tags||[]).forEach(t=>tagCount[t]=(tagCount[t]||0)+1));
  const tags=Object.entries(tagCount).sort((a,b)=>b[1]-a[1]);
  const coment=f.aval.filter(r=>r.comentario).sort((a,b)=>(a.data_avaliacao<b.data_avaliacao?1:-1)).slice(0,40);
  const dist=[5,4,3,2,1].map(n=>f.aval.filter(r=>r.nota===n).length);
  setContent(`
    <div class="panel"><b>Nota média por dia</b><div class="cwrap"><canvas id="ch1"></canvas></div></div>
    <div class="flex" style="align-items:stretch">
      <div class="panel" style="flex:1;min-width:260px"><b>Distribuição de notas</b>
        <table>${[5,4,3,2,1].map((n,i)=>`<tr><td class="stars">${"★".repeat(n)}</td><td>${dist[i]}</td><td class="muted">${f.aval.length?Math.round(dist[i]/f.aval.length*100):0}%</td></tr>`).join("")}</table></div>
      <div class="panel" style="flex:1;min-width:260px"><b>Tags mais citadas</b>
        <table>${tags.slice(0,10).map(([t,n])=>`<tr><td>${/incompleto|errado|danificado|mal /i.test(t)?"⚠️":"✅"} ${t}</td><td>${n}</td></tr>`).join("")||"<tr><td class='muted'>sem tags no período</td></tr>"}</table></div>
    </div>
    <div class="panel"><b>Comentários recentes</b>
      <table><tr><th>Data</th><th>Loja</th><th>Nota</th><th>Comentário</th></tr>
      ${coment.map(r=>`<tr><td>${dBR(r.data_avaliacao)}</td><td>${lojaNome(r.id_loja)}</td><td class="stars">★${r.nota}</td><td>${r.comentario}</td></tr>`).join("")||"<tr><td colspan=4 class='muted'>sem comentários no período</td></tr>"}</table></div>`);
  newChart("ch1",{type:"line",data:{labels:dias.map(dBR),datasets:[
    {label:"Nota média",data:dias.map(d=>+(porDia[d].s/porDia[d].n).toFixed(2)),borderColor:"#f5a623",backgroundColor:"#f5a62333",tension:.3,yAxisID:"y"},
    {label:"Qtd avaliações",data:dias.map(d=>porDia[d].n),borderColor:"#4aa3ff",backgroundColor:"#4aa3ff33",type:"bar",yAxisID:"y2"}]},
    options:{maintainAspectRatio:false,scales:{y:{min:1,max:5,ticks:{color:"#95a1b2"}},y2:{position:"right",grid:{display:false},ticks:{color:"#95a1b2"}},x:{ticks:{color:"#95a1b2"}}},plugins:{legend:{labels:{color:"#e6eaf0"}}}}});
}

function rCanc(f){
  const motivos={};f.canc.forEach(r=>{motivos[r.motivo]=motivos[r.motivo]||{n:0,v:0};motivos[r.motivo].n++;motivos[r.motivo].v+=(+r.valor_cancelamento||0);});
  const ms=Object.entries(motivos).sort((a,b)=>b[1].v-a[1].v);
  const coz=f.canc.filter(r=>respItem(r.itens_cancelados)==="cozinha");
  const exp=f.canc.filter(r=>respItem(r.itens_cancelados)==="expedicao");
  const contest=f.canc.filter(r=>r.contestavel);
  setContent(`
    <div class="cards">
      <div class="card"><div class="lbl">🍳 Responsab. cozinha (estimado)</div><div class="big">${coz.length}</div><div class="muted" style="font-size:12px">${fmtBRL(coz.reduce((s,r)=>s+(+r.valor_cancelamento||0),0))}</div></div>
      <div class="card"><div class="lbl">📦 Responsab. expedição (estimado)</div><div class="big">${exp.length}</div><div class="muted" style="font-size:12px">${fmtBRL(exp.reduce((s,r)=>s+(+r.valor_cancelamento||0),0))}</div></div>
      <div class="card"><div class="lbl">⚖️ Contestáveis</div><div class="big">${contest.length}</div><div class="muted" style="font-size:12px">${contest.filter(r=>r.loja_contestou).length} contestados pela loja</div></div>
      <div class="card"><div class="lbl">🔴 Impactaram o Super</div><div class="big">${f.canc.filter(r=>r.impactou_super).length}</div></div>
    </div>
    <div class="panel"><b>Motivos (por valor perdido)</b><div class="cwrap"><canvas id="ch2"></canvas></div></div>
    <div class="panel"><b>Cancelamentos no período</b>
      <table><tr><th>Data</th><th>Loja</th><th>Status</th><th>Motivo</th><th>Valor</th><th>Itens</th><th>Contestação</th></tr>
      ${f.canc.map(r=>`<tr><td>${dBR(r.data)}</td><td>${lojaNome(r.id_loja)}</td><td><span class="pill ${r.status_pedido==="CANCELADO"?"p-bad":"p-warn"}">${r.status_pedido==="CANCELADO"?"Total":"Parcial"}</span></td><td>${r.motivo}</td><td>${fmtBRL(+r.valor_cancelamento)}</td><td class="muted">${(r.itens_cancelados||"-").slice(0,70)}</td><td>${r.status_contestacao&&r.status_contestacao!=="-"?r.status_contestacao:(r.contestavel?'<span class="pill p-warn">contestável</span>':"–")}</td></tr>`).join("")||"<tr><td colspan=7 class='muted'>nenhum no período 🎉</td></tr>"}</table></div>`);
  newChart("ch2",{type:"bar",data:{labels:ms.slice(0,8).map(m=>m[0].slice(0,38)),datasets:[{label:"R$ perdidos",data:ms.slice(0,8).map(m=>+m[1].v.toFixed(2)),backgroundColor:"#e5484d"}]},
    options:{indexAxis:"y",maintainAspectRatio:false,scales:{x:{ticks:{color:"#95a1b2"}},y:{ticks:{color:"#e6eaf0",font:{size:11}}}},plugins:{legend:{display:false}}}});
}

function rNeg(f){
  const motivos={};f.neg.forEach(r=>motivos[r.motivo]=(motivos[r.motivo]||0)+1);
  const ms=Object.entries(motivos).sort((a,b)=>b[1]-a[1]);
  setContent(`
    <div class="cards">
      <div class="card"><div class="lbl">Chamados</div><div class="big">${f.neg.length}</div></div>
      <div class="card"><div class="lbl">✅ Cancelamento evitado</div><div class="big">${f.neg.filter(r=>r.cancelamento_evitado).length}</div></div>
      <div class="card"><div class="lbl">🔴 Impactaram o Super</div><div class="big">${f.neg.filter(r=>r.impactou_super).length}</div></div>
      <div class="card"><div class="lbl">💸 Reembolsos + cupons</div><div class="big">${fmtBRL(f.neg.reduce((s,r)=>s+(+r.valor_reembolso||0)+(+r.valor_cupom||0),0))}</div></div>
    </div>
    <div class="panel"><b>Motivos mais comuns</b>
      <table>${ms.slice(0,10).map(([m,n])=>`<tr><td>${m}</td><td>${n}</td></tr>`).join("")}</table></div>
    <div class="panel"><b>Chamados no período</b>
      <table><tr><th>Data</th><th>Loja</th><th>Momento</th><th>Motivo</th><th>Resposta da loja</th><th>Cliente</th></tr>
      ${f.neg.map(r=>`<tr><td>${dBR(r.data)}</td><td>${lojaNome(r.id_loja)}</td><td class="muted">${r.momento_solicitacao||"–"}</td><td>${r.motivo}</td><td>${r.resposta_loja||"–"}</td><td class="muted">${r.resposta_cliente&&r.resposta_cliente!=="-"?r.resposta_cliente:"–"}</td></tr>`).join("")||"<tr><td colspan=6 class='muted'>nenhum no período 🎉</td></tr>"}</table></div>`);
}

function rResp(f){
  const porLoja={};
  f.neg.forEach(r=>{porLoja[r.id_loja]=porLoja[r.id_loja]||{t:0,resp:0};porLoja[r.id_loja].t++;
    if(r.resposta_loja&&r.resposta_loja!=="-"&&!/N[AÃ]O RESPONDEU/i.test(r.resposta_loja))porLoja[r.id_loja].resp++;});
  const rows=Object.entries(porLoja).map(([id,v])=>({id:+id,t:v.t,pct:v.resp/v.t})).sort((a,b)=>a.pct-b.pct);
  setContent(`
    <div class="panel"><b>💬 Taxa de resposta às negociações por loja</b>
      <div class="muted" style="margin:6px 0 10px">Responder rápido evita cancelamento e conta pro Selo Super. Meta: 100%.</div>
      <table><tr><th>Loja</th><th>Chamados</th><th>Respondidos</th><th>Taxa</th></tr>
      ${rows.map(r=>`<tr><td>${lojaNome(r.id)}</td><td>${r.t}</td><td>${Math.round(r.pct*r.t)}</td><td><span class="pill ${r.pct>=.9?"p-ok":r.pct>=.6?"p-warn":"p-bad"}">${fmtPct(r.pct)}</span></td></tr>`).join("")||"<tr><td colspan=4 class='muted'>sem chamados no período</td></tr>"}</table></div>`);
}

function rSuper(){
  // Dados oficiais do export "Super Restaurante" do iFood (ifood_fato_super_status).
  const ids=lojaIds();
  const atual=SUPER.filter(r=>r.tipo==="nivel_atual"&&ids.has(r.id_loja));
  const prox=SUPER.filter(r=>r.tipo==="proxima_avaliacao"&&ids.has(r.id_loja));
  const proxDe=id=>prox.find(p=>p.id_loja===id);
  const refA=atual[0]?dBR(atual[0].referencia)+"/"+atual[0].referencia.slice(0,4):"–";
  const refP=prox[0]?dBR(prox[0].referencia)+"/"+prox[0].referencia.slice(0,4):"–";
  const nivelPill=(r)=>{
    if(!r)return"–";
    if(r.e_super)return'<span class="pill p-ok">🏆 SUPER · Nível '+r.nivel+'</span>';
    if(r.nivel==null)return'<span class="pill p-neu">não elegível</span>';
    return'<span class="pill '+(r.nivel>=4?"p-warn":"p-bad")+'">Nível '+r.nivel+' de 5</span>';
  };
  const rows=atual.sort((a,b)=>(b.nivel||0)-(a.nivel||0)).map(r=>{
    const p=proxDe(r.id_loja);
    const sobe=p&&r.nivel!=null&&p.nivel!=null?(p.nivel>r.nivel?" ⬆️":p.nivel<r.nivel?" ⬇️":""):"";
    return`<tr><td>${lojaNome(r.id_loja)}</td><td>${nivelPill(r)}</td><td>${nivelPill(p)}${sobe}</td><td>${r.media_avaliacoes??"–"}</td><td>${fmtPct(+r.pct_cancelamento)}</td><td>${fmtPct(+r.pct_chamados)}</td><td class="muted">${(p||r).plano_acao||"–"}</td></tr>`;
  }).join("");
  const nSuper=atual.filter(r=>r.e_super).length;
  const nSuperProx=prox.filter(r=>r.e_super).length;
  setContent(`
    <div class="cards">
      <div class="card"><div class="lbl">🏆 Lojas Super hoje</div><div class="big">${nSuper}</div><div class="muted" style="font-size:12px">de ${atual.length} lojas · ciclo ${refA}</div></div>
      <div class="card"><div class="lbl">🔮 Previsão próxima avaliação</div><div class="big">${nSuperProx}</div><div class="muted" style="font-size:12px">parcial até ${refP} · atualiza dia 10</div></div>
    </div>
    <div class="panel"><b>🏆 Selo Super Restaurante — dado oficial do iFood</b>
      <div class="muted" style="margin:6px 0 10px">Nível atual = ciclo fechado (trim. anterior). Previsão = parcial do ciclo em andamento; próxima atualização em 10 de setembro.</div>
      <table><tr><th>Loja</th><th>Nível atual</th><th>Previsão próx. ciclo</th><th>Nota</th><th>% Canc.</th><th>% Chamados</th><th>Plano de ação</th></tr>
      ${rows||"<tr><td colspan=7 class='muted'>sem dados oficiais do Super — importe o export superrestaurante_*.xlsx</td></tr>"}</table>
      <div class="muted" style="margin-top:8px">Fonte: export oficial "Super Restaurante" do Portal do Parceiro (tabela ifood_fato_super_status).</div></div>`);
}

// filtros de período
function setDays(n){const h=new Date();F.d2=dISO(h);F.d1=dISO(new Date(h-n*864e5));document.getElementById("d1").value=F.d1;document.getElementById("d2").value=F.d2;}
document.querySelectorAll(".bar .chip[data-d]").forEach(c=>c.onclick=()=>{document.querySelectorAll(".bar .chip[data-d],.bar .chip[data-o]").forEach(x=>x.classList.remove("on"));c.classList.add("on");setDays(+c.dataset.d);render();});
const _co=document.querySelector(".bar .chip[data-o]");
if(_co)_co.onclick=()=>{document.querySelectorAll(".bar .chip[data-d],.bar .chip[data-o]").forEach(x=>x.classList.remove("on"));_co.classList.add("on");F.d1=F.d2=dISO(new Date(Date.now()-864e5));document.getElementById("d1").value=F.d1;document.getElementById("d2").value=F.d2;render();};
document.getElementById("d1").onchange=e=>{F.d1=e.target.value;render();};
document.getElementById("d2").onchange=e=>{F.d2=e.target.value;render();};
document.getElementById("lojasel").onchange=e=>{F.loja=+e.target.value;render();};
document.querySelectorAll("#tabs .tab").forEach(t=>t.onclick=()=>{document.querySelectorAll("#tabs .tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");F.tab=t.dataset.t;render();});
setDays(30);

// gate de senha (mesmo do painel de ponto)
const PASS_HASH="6db4bb52b559fe6100a9ce00ff3ad2e9153a28179ddfc2fb394496e7c0edef34";
const OWNER_HASH="d7149f187239f5d99c428c666fa476b7e7808f38226765d5c62ed0ec65e7eaee";
async function _sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function _tryAuth(){const inp=document.getElementById("gp"),err=document.getElementById("gerr");let h="";try{h=await _sha((inp.value||"").trim());}catch(e){h="";}if(h===PASS_HASH||h===OWNER_HASH){if(h===OWNER_HASH)sessionStorage.setItem("cm_owner_ok","1");document.getElementById("gate").style.display="none";document.getElementById("appwrap").style.display="";loadAll();}else{err.style.display="block";inp.value="";inp.focus();}}
document.getElementById("gp").addEventListener("keydown",e=>{if(e.key==="Enter")_tryAuth();});
document.getElementById("gp").focus();
if(sessionStorage.getItem("cm_owner_ok")==="1"){document.getElementById("gate").style.display="none";document.getElementById("appwrap").style.display="";loadAll();}
</script>
