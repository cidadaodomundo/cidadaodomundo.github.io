<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Central Salão · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:40px 30px;max-width:420px;text-align:center}
.dot{width:56px;height:56px;border-radius:14px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 16px}
h1{font-size:22px;font-weight:800;margin-bottom:8px}
p{color:var(--text2);font-size:14px;line-height:1.6}
.tag{display:inline-block;background:var(--s2);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--muted);margin-top:16px}
#gate{position:fixed;inset:0;background:var(--s0);z-index:100;display:flex;align-items:center;justify-content:center}
.gatebox{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:330px;text-align:center}
.gatebox input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:15px;outline:none;margin:14px 0 10px;text-align:center}
.gatebox button{width:100%;background:var(--brand);border:none;color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer}
.gerr{color:#f08d8d;font-size:12px;min-height:16px;margin-top:8px}
</style>
</head>
<body>
<div id="gate"><div class="gatebox">
  <div class="dot" style="margin:0 auto 12px">CM</div>
  <h1 style="font-size:18px">Central Salão</h1>
  <div style="color:var(--text2);font-size:12px">Gestão do salão — digite a senha</div>
  <input type="password" id="gpw" placeholder="Senha" onkeydown="if(event.key==='Enter')gt()">
  <button onclick="gt()">Entrar</button>
  <div class="gerr" id="gerr"></div>
</div></div>
<div class="box">
  <div class="dot">CM</div>
  <h1>🍽 Central Salão</h1>
  <p>Painel do salão em construção.<br>Em breve: comandas, tempo de mesa, avaliações do salão e escala do atendimento.</p>
  <div class="tag">🚧 Em construção</div>
</div>
<script>
const PASS='132704a017cc174942929dae49a5de2748d09170a0b16962cad693e88ee57441';
const OWNER='d7149f187239f5d99c428c666fa476b7e7808f38226765d5c62ed0ec65e7eaee';
const PONTO='6db4bb52b559fe6100a9ce00ff3ad2e9153a28179ddfc2fb394496e7c0edef34';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function gt(){const h=await sha((document.getElementById('gpw').value||'').trim());
  if(h===PASS||h===OWNER||h===PONTO){sessionStorage.setItem('cm_del_ok','1');document.getElementById('gate').style.display='none'}
  else document.getElementById('gerr').textContent='Senha incorreta.'}
if(sessionStorage.getItem('cm_owner_ok')==='1'||sessionStorage.getItem('cm_del_ok')==='1')document.getElementById('gate').style.display='none';
</script>
</body>
</html>
