<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Central Salão · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e;--ok:#2fae6a;--bad:#e66767;--warn:#c98500;--gold:#e8c547}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1180px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
h2{font-size:15px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2 .hint{font-weight:500;font-size:11.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:16px}
.c .nm{font-weight:800;font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.c .nota{font-size:30px;font-weight:800;line-height:1}
.c .qtd{color:var(--muted);font-size:12px;margin-top:3px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.store{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px}
.store h3{font-size:15px;font-weight:800;margin-bottom:2px}
.store .loc{color:var(--muted);font-size:11.5px;margin-bottom:12px}
.resumo{color:var(--text2);font-size:13px;line-height:1.55;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
tr:last-child td{border-bottom:none}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
a.src{color:var(--text);text-decoration:none;font-weight:600}
a.src:hover{text-decoration:underline}
.q{background:var(--s2);border-left:3px solid var(--brand);border-radius:9px;padding:9px 12px;margin:6px 0;font-size:12.5px;color:var(--text2)}
.q.good{border-left-color:var(--ok)}
.q .m{color:var(--muted);font-size:11px;margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.badge{background:var(--s2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12.5px;color:var(--text2);text-decoration:none;display:flex;align-items:center;gap:6px}
.badge b{color:var(--text)}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:14px}
.load{color:var(--muted);padding:30px;text-align:center}
#gate{position:fixed;inset:0;background:var(--s0);z-index:100;display:flex;align-items:center;justify-content:center}
.gatebox{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:330px;text-align:center}
.gatebox input{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:15px;outline:none;margin:14px 0 10px;text-align:center}
.gatebox button{width:100%;background:var(--brand);border:none;color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer}
.gerr{color:#f08d8d;font-size:12px;min-height:16px;margin-top:8px}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:16px}
</style>
</head>
<body>
<div id="gate"><div class="gatebox">
  <div class="dot" style="margin:0 auto 12px">CM</div>
  <h1 style="font-size:18px">Central Salão</h1>
  <div style="color:var(--text2);font-size:12px">Gestão do salão — digite a senha</div>
  <input type="password" id="gpw" placeholder="Senha" onkeydown="if(event.key==='Enter')gt()">
  <button onclick="gt()">Entrar</button>
  <div class="gerr" id="gerr"></div>
</div></div>

<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>🍽 Central Salão</h1><div class="sub">reputação e avaliações — por loja</div></div></div>
  <div class="rt"><button class="b" onclick="location.reload()">↻ Atualizar</button></div>
</div>
<div id="app"><div class="load">Carregando avaliações…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=i=>document.getElementById(i);
const UNI=['Água Verde','São Braz','Ahú','Boqueirão'];

/* --- snapshot manual: tudo que não tem robo (pesquisado na internet em 13/08/2026) --- */
const COLETA='13/08/2026';
const WEB={
 'Água Verde':[
  {fonte:'TripAdvisor',nota:4.3,qtd:'#142 de 3.037 rest. em Curitiba',url:'https://www.tripadvisor.com.br/Restaurant_Review-g303441-d6525699-Reviews-Cidadao_do_Mundo_Burgers_Arts-Curitiba_State_of_Parana.html'},
  {fonte:'Restaurant Guru',nota:4.6,qtd:'5.624 avaliações · 362 fotos',url:'https://restaurantguru.com/Cidadao-do-Mundo-Curitiba'},
  {fonte:'Avaliações Brasil',nota:null,qtd:'2.834 avaliações',url:'https://avaliacoesbrasil.com/hamburgueria/curitiba/cidadao-do-mundo-burgers-arts-/'},
  {fonte:'HappyCow (foco vegano)',nota:null,qtd:'listada e avaliada pela comunidade vegana',url:'https://www.happycow.net/reviews/cidadao-do-mundo-curitiba-89003'},
  {fonte:'Guia do Hambúrguer',nota:null,qtd:'resenha editorial',url:'https://guiadohamburguer.com/avaliacao/cidadao-do-mundo-burgers-arts-agua-verde-curitiba/'}
 ],
 'São Braz':[
  {fonte:'Restaurant Guru',nota:4.5,qtd:'524 avaliações · 74 fotos',url:'https://restaurantguru.com/O-Tradicional-Bar-Curitiba'},
  {fonte:'Duo Gourmet',nota:null,qtd:'guia gastronômico',url:'https://www.duogourmet.com.br/restaurantes/curitiba/cidadao-do-mundo--sao-braz'},
  {fonte:'Burgerfest',nota:null,qtd:'casa participante',url:'https://www.burgerfest.com.br/casas-participantes/cidadao-do-mundo-sao-braz'}
 ],
 'Ahú':[
  {fonte:'Restaurant Guru (listado como "Delivery")',nota:4.0,qtd:'61 avaliações',url:'https://restaurantguru.com.br/Cidadao-do-Mundo-Burgers-and-Arts-Ahu-Curitiba'}
 ],
 'Boqueirão':[
  {fonte:'Restaurant Guru',nota:3.1,qtd:'460 avaliações — abaixo das outras lojas',url:'https://restaurantguru.com/Cidadao-do-Mundo-Burguers-and-Arts-Curitiba'},
  {fonte:'CWBurguer Fest 2026',nota:null,qtd:'casa participante do festival (abr–mai)',url:'https://bomgourmet.com/bomgourmet/festival-bom-gourmet/curitiba/cwburguer-1-edicao/cidadao-do-mundo-burgers-arts-boqueirao/'}
 ]
};
const MARCA=[
 {fonte:'Instagram @cidadaodomundocwb',nota:null,qtd:'≈37 mil seguidores',url:'https://www.instagram.com/cidadaodomundocwb/'},
 {fonte:'Facebook',nota:null,qtd:'≈27.524 curtidas',url:'https://www.facebook.com/cidadaomundo/'},
 {fonte:'TikTok',nota:null,qtd:'vídeos de clientes mencionando a marca',url:'https://www.tiktok.com/discover/cidadao-do-mundo-hamburgueria-curitiba'},
 {fonte:'Site oficial',nota:null,qtd:'cidadaodomundo.com.br',url:'https://www.cidadaodomundo.com.br/'},
 {fonte:'Chaves na Mão — Top 10 hamburguerias de Curitiba',nota:null,qtd:'citada na lista',url:'https://www.chavesnamao.com.br/melhores-bairros/pr-curitiba/hamburguerias-em-curitiba/'}
];

const cls=n=>n==null?'':(n>=4.5?'p-ok':n>=4?'p-warn':'p-bad');
const estrelas=n=>n==null?'':('★'+n.toFixed(1));
const fmtN=n=>n.toLocaleString('pt-BR');

function fontesTable(lista){
  return '<table><tr><th>Fonte</th><th class="n">Nota</th><th>Referência</th></tr>'+
    lista.map(f=>`<tr><td><a class="src" href="${f.url}" target="_blank" rel="noopener">${f.fonte} ↗</a></td><td class="n">${f.nota!=null?'<span class="pill '+cls(f.nota)+'">'+estrelas(f.nota)+'</span>':'<span style="color:var(--muted)">—</span>'}</td><td style="color:var(--text2)">${f.qtd}</td></tr>`).join('')+
  '</table>';
}

async function boot(){
  const r=await fetch(SB+'google_fato_avaliacao?select=unidade,id_loja,nota,num_avaliacoes,resumo,destaques,data_coleta&order=data_coleta.desc&limit=200',{headers:H});
  const rows=r.ok?await r.json():[];
  const G={};rows.forEach(x=>{if(!G[x.unidade])G[x.unidade]=x});
  render(G);
}

function render(G){
  let h='';
  /* cards de topo */
  h+='<h2>⭐ Nota no Google — por loja</h2><div class="cards">';
  UNI.forEach(u=>{const g=G[u];
    h+=`<div class="c"><div class="nm">${u}${g?'<span class="pill '+cls(+g.nota)+'">Google</span>':''}</div>`+
       (g?`<div class="nota">${(+g.nota).toFixed(1)}</div><div class="qtd">${fmtN(g.num_avaliacoes)} avaliações · coletado ${g.data_coleta.split('-').reverse().join('/')}</div>`
          :'<div class="qtd">sem dado do Google ainda</div>')+
       '</div>'});
  h+='</div>';

  /* por loja: resumo google + destaques + outras fontes */
  h+='<h2>🌐 Presença na internet — por loja <span class="hint">Google atualiza sozinho toda semana · demais fontes: pesquisa manual, foto de '+COLETA+'</span></h2>';
  UNI.forEach(u=>{
    const g=G[u];
    h+='<div class="store"><h3>'+u+'</h3><div class="loc">Cidadão do Mundo Burgers &amp; Arts · '+u+'</div>';
    if(g){
      h+='<div class="resumo">'+(g.resumo||'')+'</div>';
      if(g.destaques&&g.destaques.length){
        h+='<div class="badges" style="margin-bottom:10px"></div>';
        g.destaques.slice(0,3).forEach(d=>{
          h+=`<div class="q ${d.tipo==='positivo'?'good':''}">“${(d.texto||'').slice(0,200)}”<div class="m">${d.autor||'cliente'} · Google · ${d.quando||''}</div></div>`;
        });
      }
    }
    h+='<div style="margin-top:10px">'+fontesTable(WEB[u]||[])+'</div>';
    h+='</div>';
  });

  /* marca (todas as lojas) */
  h+='<h2>📱 Menções da marca <span class="hint">redes sociais e imprensa — não separado por loja</span></h2>';
  h+='<div class="store">'+fontesTable(MARCA)+'</div>';

  h+='<div class="aviso">As notas de TripAdvisor, Restaurant Guru e redes sociais são uma foto tirada em '+COLETA+' — não têm robo que atualiza sozinho ainda. Peça para atualizar quando quiser uma foto nova. Já o Google é ao vivo e atualiza toda semana sozinho.</div>';

  $('app').innerHTML=h;
}

const PASS='132704a017cc174942929dae49a5de2748d09170a0b16962cad693e88ee57441';
const OWNER='d7149f187239f5d99c428c666fa476b7e7808f38226765d5c62ed0ec65e7eaee';
const PONTO='6db4bb52b559fe6100a9ce00ff3ad2e9153a28179ddfc2fb394496e7c0edef34';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function gt(){const h=await sha(($('gpw').value||'').trim());
  if(h===PASS||h===OWNER||h===PONTO){sessionStorage.setItem('cm_del_ok','1');$('gate').style.display='none';boot()}
  else $('gerr').textContent='Senha incorreta.'}
if(sessionStorage.getItem('cm_owner_ok')==='1'||sessionStorage.getItem('cm_del_ok')==='1'){$('gate').style.display='none';boot()}
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
