function diasEntre(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
async function get(q){try{const r=await fetch(SB+q,{headers:H});return r.ok?await r.json():[]}catch(e){return []}}

function fontesTable(lista){
  return '<table><tr><th>Fonte</th><th class="n">Nota</th><th>Referência</th></tr>'+
    lista.map(f=>'<tr><td><a class="src" href="'+f.url+'" target="_blank" rel="noopener">'+esc(f.fonte)+' ↗</a></td><td class="n">'+(f.nota!=null?'<span class="pill '+cls(f.nota)+'">'+estrelas(f.nota)+'</span>':'<span style="color:var(--muted)">—</span>')+'</td><td style="color:var(--text2)">'+esc(f.qtd)+'</td></tr>').join('')+
  '</table>';
}

/* ================= 1. EQUIPE DO SALÃO, POR TURNO =================
   Cruza quatro fontes: a escala lançada pela loja, o ponto que vem do Flash,
   o cadastro do funcionário (horário previsto e setor) e o movimento de
   balcão do Saipos. */
let TURNO='auto';
function turnoAgora(){return new Date().getHours()>=16?'Noite':'Dia'}
function turnoAtivo(){return TURNO==='auto'?turnoAgora():TURNO}
function setTurno(t){TURNO=t;rota()}
function turnoDe(hora){if(!hora)return null;return String(hora).slice(0,5)>='15:00'?'Noite':'Dia'}
const SITU={OK:['tudo certo','ok2'],ATRASO:['entrou atrasado','at'],
 BATIDAS_INCOMPLETAS:['batidas incompletas','at'],FALTA_A_CONFIRMAR:['a confirmar','at'],
 FOLGA:['folga',''],ESCALA_DIVERGENTE:['horário diferente da escala','at'],
 TURNO_DIVERGENTE:['turno diferente do cadastro','at'],INTERVALO_ABAIXO_LEGAL:['intervalo abaixo do legal','at'],
 INTERVALO_ABAIXO_PADRAO:['intervalo curto','at'],TETO_10H:['passou de 10 horas','at'],
 JORNADA_A_MENOR:['jornada menor que a contratada','at'],AFASTADO:['afastado',''],
 HORA_EXTRA:['hora extra','at'],FERIAS:['férias',''],LOJA_FECHADA:['loja fechada',''],
 TRABALHO_EM_FOLGA:['trabalhou na folga','at'],CADASTRO:['cadastro a ajustar','at']};
function situ(c){
  const s=SITU[c]; if(s)return s;
  const t=String(c||'');
  if(t.indexOf('FALTA')>=0||t.indexOf('AUSEN')>=0)return ['a confirmar','at'];
  return [t.toLowerCase().replace(/_/g,' '),''];
}
/* Quem é do salão. A escala vem da MESMA prateleira que as gestoras preenchem na
   Central do RH. Duas portas de entrada, porque as duas acontecem na vida real:
   1) a posição lançada no dia fala em Atendimento/Caixa;
   2) a pessoa é do setor Salão no cadastro, mesmo lançada em outra posição.
   Medido em 26/08: a Marcia aparece no Atendimento/Caixa do São Braz e o cadastro
   dela diz Cozinha. Filtrar só por um dos dois perde gente. */
const FORA=['FOLGA','Falta/Ausente','Férias','Atestado','Afastado'];
function setorDe(pessoas,nome){const p=pessoas.filter(x=>x.nome===nome)[0];return p?(p.setor||''):''}
function ehSalao(reg,pessoas){
  const pos=String(reg.posicao||'');
  if(FORA.indexOf(pos)>=0)return false;
  if(pos.indexOf('Atendimento')>=0)return true;
  return setorDe(pessoas,reg.nome)==='Salão';
}
/* a escala também usa "Noite/Madrugada" e "Integral" — medido no banco em 26/08 */
function ehTurno(v,t){
  const s=String(v||'');
  if(s.indexOf('Integral')>=0)return true;
  return t==='Noite'?s.indexOf('Noite')>=0:s.indexOf('Dia')>=0;
}

function blocoEquipe(d){
  const hoje=hojeISO(), dow=new Date().getDay(), t=turnoAtivo();
  const ultPonto=d.ponto.length?d.ponto.map(p=>p.data).sort().slice(-1)[0]:null;
  let h='<div class="ctx">'+DIAS[dow]+', '+br(hoje)+' · escala lançada pela loja, ponto vindo do Flash e movimento de balcão do Saipos</div>';
  h+='<div class="chips">'+
     '<button class="chip'+(t==='Dia'?' on':'')+'" onclick="setTurno(\'Dia\')">☀️ Dia</button>'+
     '<button class="chip'+(t==='Noite'?' on':'')+'" onclick="setTurno(\'Noite\')">🌙 Noite</button>'+
     '</div>';
  h+='<div class="cards">';
  UNI.forEach(u=>{
    const daLoja=d.escala.filter(e=>e.unidade===u&&ehSalao(e,d.pessoas));
    const doDia=daLoja.filter(e=>e.data===hoje&&ehTurno(e.turno,t));
    const ultDia=daLoja.length?daLoja.map(e=>e.data).sort().slice(-1)[0]:null;
    const min=d.cobertura.filter(c=>c.unidade===u&&Number(c.dia_semana)===dow&&ehTurno(c.turno,t))
                         .reduce((m,c)=>Math.max(m,Number(c.minimo)||0),0);
    /* quem responde pelo salão nesta loja: o cadastro diz Salão, mais quem a Central
       do RH lançou no atendimento nos últimos dias, mesmo com outro setor no cadastro */
    const nomesEscala={};daLoja.forEach(e=>{nomesEscala[e.nome]=1});
    const doSalao=d.pessoas.filter(p=>p.unidade===u&&(p.setor==='Salão'||nomesEscala[p.nome]));
    const comPonto=doSalao.filter(p=>p.entrada);
    const gerencia=doSalao.length-comPonto.length;
    const doTurno=comPonto.filter(p=>turnoDe(p.entrada)===t).map(p=>p.nome);
    const pt=ultPonto?d.ponto.filter(p=>p.data===ultPonto&&p.unidade===u&&doTurno.indexOf(p.nome)>=0):[];
    let sel='';
    if(min)sel='<span class="pill '+(doDia.length>=min?'p-ok':'p-bad')+'">'+doDia.length+' de '+min+'</span>';
    h+='<div class="c"><div class="nm">'+u+sel+'</div>';

    h+='<div class="turno">Escala de hoje · '+t+'</div>';
    if(doDia.length){
      doDia.forEach(g=>{
        const bateu=pt.filter(p=>p.nome===g.nome)[0];
        const pos=String(g.posicao||'');
        const setor=setorDe(d.pessoas,g.nome);
        let obs='';
        if(pos.indexOf('Atendimento')<0)obs='hoje em '+pos.split(',')[0];
        else if(setor&&setor!=='Salão')obs='no cadastro é do setor '+setor;
        h+='<div class="linha"><b>'+esc(g.nome)+'</b><span class="sit">'+
           (bateu&&bateu.entrada?String(bateu.entrada).slice(0,5)+' no último dia':'')+'</span></div>'+
           (obs?'<div class="mini">'+esc(obs)+'</div>':'');
      });
    } else if(daLoja.filter(e=>e.data===hoje).length){
      h+='<div class="vazio">ninguém lançado neste turno hoje</div>';
    } else {
      h+='<div class="vazio">escala de hoje ainda não lançada'+(ultDia?' — a última foi '+br(ultDia):'')+'</div>';
    }
    if(!min)h+='<div class="mini">sem mínimo de gente cadastrado para esta loja neste turno</div>';

    h+='<div class="turno">Ponto de '+(ultPonto?br(ultPonto):'sem dado')+' · '+t+'</div>';
    if(pt.length){
      pt.forEach(p=>{
        const s=situ(p.categoria);
        h+='<div class="linha"><b>'+esc(p.nome)+'</b><span>'+
           (p.entrada?String(p.entrada).slice(0,5)+'–'+(p.saida?String(p.saida).slice(0,5):'?'):'—')+
           ' <span class="sit '+s[1]+'">'+esc(s[0])+'</span></span></div>';
      });
    } else h+='<div class="vazio">o ponto deste turno ainda não chegou</div>';
    if(gerencia)h+='<div class="mini">gerência não entra no ponto</div>';

    /* Balcão: cada loja mostra o SEU último dia reportado. Loja sem linha nenhuma
       não vira zero — vira "sem dado", porque o Saipos não fecha o dia na hora. */
    const naLoja=d.balcao?d.balcao.filter(x=>x.unidade===u):[];
    if(naLoja.length){
      const diaLoja=naLoja.map(x=>String(x.dia_operacional).slice(0,10)).sort().slice(-1)[0];
      const b=naLoja.filter(x=>String(x.dia_operacional).slice(0,10)===diaLoja);
      const canc=b.filter(x=>x.cancelado).length;
      /* cada linha é uma venda (chave única no Saipos); parte delas não tem
         número de pedido — são vendas de mesa. Contar linha, não n_pedido. */
      h+='<div class="turno">Balcão em '+br(diaLoja)+'</div>'+
         '<div class="linha"><span>vendas registradas na loja</span><b>'+b.length+'</b></div>'+
         (canc?'<div class="linha"><span>desses, cancelados</span><b>'+canc+'</b></div>':'')+
         '<div class="mini">o Saipos não separa por turno e não fecha o dia na hora</div>';
    } else {
      h+='<div class="turno">Balcão</div><div class="vazio">o Saipos ainda não reportou esta loja nos últimos dias</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  return h;
}

/* ================= 2. CARDÁPIO FORA DO AR NO TABLET ================= */
/* 05/10/2026, pedido do Fábio: "aqui colocar os botões também, assim como colocamos nos itens pausados em outras
   partes do portal". Mesmas respostas e mesma porta da tela Produtos pausados (pausados_consulta para ler,
   pausados_marcar para gravar): responder aqui vale lá, e o contrário também. Se a porta não responder
   (ex.: quem não tem a tela Produtos pausados), a lista continua aparecendo como antes, sem os botões. */
const MOT_PZ=['Despausei','Acabou, vai voltar a vender','Pausado de proposito','Item nao existe mais (pode excluir)'];
const ROT_PZ=['Despausei','Acabou, volta a vender','Pausado de propósito','Item não existe mais'];
function rotMot(t){t=String(t||'');if(/^Pausado de proposito/i.test(t))return 'Pausado de propósito'+t.slice(20);
  if(/^(Item nao existe mais|Pode excluir)/i.test(t))return 'Item não existe mais';if(/^Acabou/i.test(t))return 'Acabou, volta a vender';return t}
let PZT=null, PZG=[];
async function lePz(){
  try{
    const r=await fetch(SB+'rpc/pausados_consulta',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),
      body:JSON.stringify({p_token:cdmTok(),p_dados:{}})});
    if(!r.ok)return null;
    const j=await r.json();
    return j&&Array.isArray(j.tablet)?j:null;
  }catch(e){return null}
}
/* o mesmo item pode vir pausado E escondido (duas linhas): vira uma linha só, igual à tela Produtos pausados */
function pzGrupos(lista){
  const m={}, out=[];
  lista.forEach(x=>{
    const k=x.unidade+'|'+String(x.item||'').trim().toLowerCase();let g=m[k];
    if(!g){g=m[k]={unidade:x.unidade,item:x.item,tipo:x.tipo,estados:[x.estado],dias:+x.dias||0,desde:x.desde,
      chave:x.chave,resolvido:x.resolvido,contradito:x.contradito,quem:x.quem,o_que:x.o_que,em:x.em};out.push(g);return}
    if(g.estados.indexOf(x.estado)<0)g.estados.push(x.estado);
    if((+x.dias||0)>g.dias){g.dias=+x.dias||0;g.desde=x.desde}
    if(x.contradito)g.contradito=true;
    if(!x.resolvido)g.resolvido=false;
  });
  out.forEach(g=>{g.sit=g.contradito?'CONTRA':g.resolvido?'RESP':(g.quem?'VENCIDA':'SEM')});
  const ord={CONTRA:0,SEM:1,VENCIDA:2,RESP:3};
  out.sort((a,b)=>(ord[a.sit]-ord[b.sit])||((a.estados.indexOf('pausado')>=0?0:1)-(b.estados.indexOf('pausado')>=0?0:1))||(b.dias-a.dias));
  return out;
}
async function marcaPz(i,k,bt){
  const g=PZG[i];if(!g||!g.chave)return;
  const bts=bt&&bt.parentNode?bt.parentNode.querySelectorAll('button'):[];
  bts.forEach(b=>b.disabled=true);
  try{
    const r=await fetch(SB+'rpc/pausados_marcar',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),
      body:JSON.stringify({p_token:cdmTok(),p_dados:k<0?{chave:g.chave,desfazer:true}:{chave:g.chave,unidade:g.unidade,o_que_foi_feito:MOT_PZ[k]}})});
    if(!r.ok){let m='';try{const j=await r.json();m=(j&&(j.message||j.hint))||''}catch(e){}throw new Error(m||('erro '+r.status))}
  }catch(e){alert('Não consegui gravar: '+e.message);bts.forEach(b=>b.disabled=false);return}
  const y=window.scrollY, novo=await lePz();
  if(novo){PZT=novo;if(DADOS)DADOS.pz=PZT}else alert('Gravei, mas não consegui reler a lista. Clique em Atualizar.');
  rota(true);window.scrollTo(0,y);
}
let FTB='PRECISA';
/* 10/10: clicar num quadro do placar (pausados / escondidos / esperando) abre a lista daquele número, só daquela loja */
let FTBU='';
const ehPz=g=>g.estados.indexOf('pausado')>=0;
function tbAbre(f,u){
  FTB=f;FTBU=u||'';rota(true);
  const a=document.getElementById('tbLista');if(a)a.scrollIntoView({behavior:'smooth',block:'start'});
}
function tbCartao(g,i,comBotao){
  const pz=g.estados.indexOf('pausado')>=0, ok=g.sit==='RESP';
  const cl=ok?' ok':(g.sit==='VENCIDA'?' venc':(pz?'':' esc'));
  const pill={SEM:'<span class="pill p-bad">sem resposta da loja</span>',
    VENCIDA:'<span class="pill p-warn">'+(/^Acabou/i.test(g.o_que||'')?'disseram que voltava · continua fora':'resposta antiga')+'</span>',
    CONTRA:'<span class="pill p-bad">disseram que despausou · continua fora</span>',RESP:''}[g.sit]||'';
  let h='<div class="tb-it'+cl+'"><div><div class="d">'+(g.dias?g.dias+'d':'hoje')+'</div><div class="ds">desde '+esc(g.desde||'?')+'</div></div><div>'+
    '<div class="nm">'+esc(g.item)+' <span class="pill '+(pz?'p-bad':'p-off')+'">'+(pz?'pausado':'escondido')+'</span>'+(comBotao?pill:'')+'</div>'+
    '<div class="ex">'+(pz?'<b>O cliente vê e não consegue pedir</b>':'O cliente nem vê o item')+(pz&&g.estados.length>1?' · também está escondido':'')+
      (g.tipo==='Complemento'?' · complemento':'')+'</div>';
  if(comBotao){
    if(ok)h+='<div class="rp"><span class="feito">&#10004; '+esc(rotMot(g.o_que))+'</span> · '+esc(g.quem||'')+' em '+esc(g.em||'')+'</div>'+
      '<div class="bts"><button class="bpz sec" onclick="marcaPz('+i+',-1,this)">reabrir</button></div>';
    else{
      if(g.sit==='VENCIDA'||g.sit==='CONTRA')h+='<div class="rp">'+esc(g.quem||'')+' em '+esc(g.em||'')+': '+esc(rotMot(g.o_que))+'</div>';
      if(g.chave)h+='<div class="bts">'+ROT_PZ.map((t,k)=>'<button class="bpz" onclick="marcaPz('+i+','+k+',this)">'+esc(t)+'</button>').join('')+'</div>';
    }
  }
  return h+'</div></div>';
}
/* um renderizador só: com a porta (botões) ou sem ela (lista da leitura, sem botões) */
function blocoTablet(gs,lidos,comBotao){
  const lojas=UNI.filter(u=>u!=='Ahú');
  if(FTBU&&lojas.indexOf(FTBU)<0){FTBU='';FTB='PRECISA'}   /* trocou de loja nos botões de cima: volta ao começo */
  const ftb=(!comBotao&&(FTB==='PRECISA'||FTB==='RESP'))?'TUDO':FTB;   /* sem a porta não há "esperando"/"respondido" (não mexe no FTB) */
  let h='<div class="ctx">tablets Goomer da mesa · o robô lê o cardápio uma vez por dia'+(comBotao?' · responder aqui vale também na tela Produtos pausados':'')+'</div>';
  if(!lojas.length)return h+'<div class="store"><div class="vazio">O Ahú não tem tablet de mesa.</div></div>';
  h+='<div class="tb-placar">';
  lojas.forEach(u=>{
    const l=gs.filter(g=>g.unidade===u), ld=lidos.filter(x=>x.unidade===u)[0];
    h+='<div class="tb-loja"><div class="hd"><b>'+esc(u)+'</b><span>'+(ld?(ld.aprox?'último item visto ':'lido ')+(+ld.dias?'há '+plural(+ld.dias,'dia','dias')+' ('+esc(ld.lido)+')':'hoje'):'sem leitura do tablet')+'</span></div>';
    if(!ld){h+='<div class="vazio">Sem leitura do tablet desta loja. Não é zero — é falta de dado.</div></div>';return}
    const pau=l.filter(g=>g.estados.indexOf('pausado')>=0).length, esco=l.length-pau, esp=l.filter(g=>g.sit!=='RESP').length;
    const maior=l.length?Math.max.apply(null,l.map(g=>g.dias)):0;
    const qd=(f,cl,v,r)=>'<button type="button" class="'+cl+(ftb===f&&FTBU===u?' on':'')+'" onclick="tbAbre(\''+f+'\',\''+u+'\')" title="Ver os itens">'+
       '<div class="v">'+v+'</div><div class="r">'+r+'<br><b>ver ›</b></div></button>';
    h+='<div class="tb-num">'+qd('PAUS',pau?'bad':'ok',pau,'pausados · vê e não pede')+
       qd('ESC','',esco,'escondidos · nem vê')+
       (comBotao?qd('PRECISA',esp?'gold':'ok',esp,'esperando a loja responder')
                :qd('TUDO','',(l.length?maior:'—'),'dias do mais antigo'))+'</div>';
    if(+ld.dias>=2&&!ld.aprox)h+='<div class="velho" style="color:#e6d9a8">⚠ leitura velha: a lista pode não ser a de hoje</div>';
    else if(comBotao&&l.length)h+='<div class="velho">o mais antigo está fora há '+(maior?plural(maior,'dia','dias'):'menos de 1 dia')+'</div>';
    h+='</div>';
  });
  h+='</div>';
  const doFiltro=g=>{
    if(FTBU&&g.unidade!==FTBU)return false;
    if(ftb==='PAUS')return ehPz(g);
    if(ftb==='ESC')return !ehPz(g);
    if(ftb==='TUDO')return true;
    return ftb==='RESP'?g.sit==='RESP':g.sit!=='RESP';
  };
  const nomeF={PAUS:'📵 Pausados',ESC:'🙈 Escondidos',TUDO:'📋 Todos os itens'}[ftb];
  h+='<div id="tbLista" style="scroll-margin-top:10px"></div>';
  if(comBotao){
    const nE=gs.filter(g=>g.sit!=='RESP').length, nR=gs.length-nE;
    h+='<div class="tb-fil"><button class="'+(FTB==='PRECISA'&&!FTBU?'on':'')+'" onclick="tbAbre(\'PRECISA\',\'\')">🔴 Esperando a loja '+nE+'</button>'+
       '<button class="'+(FTB==='RESP'&&!FTBU?'on':'')+'" onclick="tbAbre(\'RESP\',\'\')">✔ Já respondidos '+nR+'</button>'+
       ((nomeF||FTBU)?'<button class="on" onclick="tbAbre(\'PRECISA\',\'\')" title="Tirar o filtro">'+(nomeF||(ftb==='RESP'?'✔ Já respondidos':'🔴 Esperando a loja'))+(FTBU?' · '+esc(FTBU):'')+' ✕</button>':'')+'</div>';
  } else if(FTBU||ftb!=='TUDO'){
    h+='<div class="tb-fil"><button class="on" onclick="tbAbre(\'TUDO\',\'\')" title="Tirar o filtro">'+(nomeF||'📋 Todos os itens')+(FTBU?' · '+esc(FTBU):'')+' ✕</button></div>';
  }
  const vis=gs.map((g,i)=>[g,i]).filter(x=>doFiltro(x[0]));
  if(!vis.length){
    h+='<div class="store"><div class="vazio">'+(!gs.length?(lidos.length?'Nenhum item pausado ou escondido na última leitura do tablet.':'A leitura dos tablets ainda não trouxe nada — não quer dizer que está tudo no ar. É falta de dado.'):
        ftb==='PAUS'?'Nenhum item pausado'+(FTBU?' em '+esc(FTBU):'')+' na última leitura do tablet.':
        ftb==='ESC'?'Nenhum item escondido'+(FTBU?' em '+esc(FTBU):'')+' na última leitura do tablet.':
        ftb==='TUDO'?'Nenhum item fora do ar'+(FTBU?' em '+esc(FTBU):'')+' na última leitura do tablet.':
        ftb==='RESP'?'Nenhum item respondido'+(FTBU?' em '+esc(FTBU):'')+' ainda.':'Nada esperando'+(FTBU?' em '+esc(FTBU):' a loja')+' — tudo que está fora do ar já foi respondido.')+'</div></div>';
  } else {
    lojas.forEach(u=>{
      const l=vis.filter(x=>x[0].unidade===u);if(!l.length)return;
      if(lojas.length>1)h+='<div class="tb-tit">'+esc(u)+' · '+plural(l.length,'item','itens')+'</div>';
      h+='<div class="tb-lista">'+l.map(x=>tbCartao(x[0],x[1],comBotao)).join('')+'</div>';
    });
  }
  if(UNI.indexOf('Ahú')>=0)h+='<div class="tb-leg">O Ahú não tem tablet de mesa.</div>';
  h+='<div class="tb-leg"><b>Pausado</b> é o pior caso: o cliente vê o item e não consegue pedir. <b>Escondido</b>: o cliente nem vê — costuma ser esquecimento de quem escondeu.'+
     (comBotao?' "Pausado de propósito" e "Item não existe mais" tiram o item da lista enquanto ele continuar assim. "Acabou, volta a vender" volta a cobrar em 2 dias. '+
      '"Despausei" vale até a próxima leitura do tablet: se ele ainda estiver fora, volta em vermelho.':'')+'</div>';
  return h;
}
function blocoGoomer(pausados,pz){
  if(pz){PZG=pzGrupos(daLoja(pz.tablet||[]));return blocoTablet(PZG,daLoja(pz.tablet_lido||[]),true)}
  /* sem a porta: monta o mesmo desenho com a leitura do tablet, sem botões */
  const hoje=hojeISO(), ult={};
  pausados.forEach(p=>{const v=String(p.visto_em).slice(0,10);if(!ult[p.unidade]||v>ult[p.unidade])ult[p.unidade]=v});
  const lidos=Object.keys(ult).map(u=>({unidade:u,lido:br(ult[u]).slice(0,5),dias:diasEntre(ult[u],hoje),aprox:true}));
  const linhas=pausados.filter(p=>String(p.visto_em).slice(0,10)===ult[p.unidade]).map(p=>({unidade:p.unidade,item:p.item,tipo:p.tipo,estado:p.estado,
    desde:br(p.primeiro_visto).slice(0,5),dias:Math.max(0,diasEntre(String(p.primeiro_visto).slice(0,10),hoje)),chave:null,resolvido:false}));
  return blocoTablet(pzGrupos(linhas),lidos,false);
}

/* ================= 5. RESERVAS =================
   Vêm do GetIn (robô) e do recado no grupo de WhatsApp do salão.
   10/10/2026: pedido do Fábio — "preciso que seja feito em cartões, assim como estamos
   fazendo no portal inteiro". Agora é um grupo por loja e um cartão por reserva. */
const SEMANA=['dom','seg','ter','qua','qui','sex','sáb'];
const ehCancelada=r=>/cancel/i.test(String(r.status||''));   /* o GetIn manda "canceled-agent", "canceled-user"... */
function cartaoReserva(r,hoje){
  const st=String(r.status||'');
  const conf=st.indexOf('confirmada')===0, canc=ehCancelada(r);
  const dia=String(r.data).slice(0,10), dias=diasEntre(hoje,dia);
  const quando=(dias===0?'hoje':(dias===1?'amanhã':(dias>1?'em '+dias+' dias':'')));
  const sem=SEMANA[new Date(dia+'T00:00:00').getDay()]||'';
  /* a observação do GetIn vem como "Comemorar aniversário | ... | veio por: site do GetIn" */
  const partes=String(r.observacao||'').split('|').map(s=>s.trim()).filter(Boolean);
  const veio=partes.filter(s=>/^veio por:/i.test(s)).map(s=>s.replace(/^veio por:\s*/i,''));
  const obs=partes.filter(s=>!/^veio por:/i.test(s));
  const ic=/anivers|parab[eé]ns|bolo/i.test(r.observacao||'')?'🎂':'🪑';
  const n=Number(r.pessoas)||0;
  let h='<div class="rv'+(dias===0?' hoje':'')+(canc?' canc':'')+'">'+
    '<div class="ch"><div class="av">'+ic+'</div>'+
      '<div><div class="qd">'+(quando?quando+' · ':'')+sem+' '+br(dia).slice(0,5)+'</div>'+
      '<div class="hr">'+(r.hora?String(r.hora).slice(0,5):'sem hora')+'</div></div>'+
      '<div class="ps">'+n+'<small>'+(n===1?'pessoa':'pessoas')+'</small></div></div>';
  if(r.nome_cliente)h+='<div class="faz"><b>'+esc(r.nome_cliente)+'</b></div>';
  h+='<div class="tags">'+
    '<span class="tg '+(canc?'bad':(conf?'ok':'warn'))+'"'+(canc?' title="'+esc(st).replace(/"/g,'&quot;')+'"':'')+'>'+(canc?'✖ cancelada':(conf?'✅ ':'⏳ ')+esc(st||'sem situação'))+'</span>'+
    (r.area?'<span class="tg">📍 '+esc(r.area)+'</span>':'')+
    (r.sinal_pago===true?'<span class="tg ok">💰 sinal pago</span>':
     (r.sinal_pago===false?'<span class="tg warn">💰 sinal não pago</span>':'<span class="tg">💰 sinal —</span>'))+
    '</div>';
  if(obs.length)h+='<div class="faz">'+esc(obs.join(' · '))+'</div>';
  h+='<div class="rodc">veio do '+esc(r.origem||'—')+(veio.length?' · '+esc(veio.join(' · ')):'')+'</div>';
  return h+'</div>';
}
function blocoReservas(res){
  const hoje=hojeISO();
  let h='<div class="ctx">vêm do GetIn e do recado no grupo do salão · de hoje em diante</div>';
  if(!res||!res.length){
    h+='<div class="store"><div class="vazio">nenhuma reserva anotada de hoje em diante — pode ser que ninguém tenha lançado ainda</div></div>';
    return h;
  }
  let pri=true;
  UNI.forEach(u=>{
    const l=res.filter(r=>r.unidade===u).sort((a,b)=>(a.data+(a.hora||''))<(b.data+(b.hora||''))?-1:1);
    if(!l.length)return;
    const vale=l.filter(r=>!ehCancelada(r)), canc=l.length-vale.length;
    const pes=vale.reduce((s,r)=>s+(Number(r.pessoas)||0),0);
    h+='<div class="rv-grp'+(pri?' pri':'')+'"><span class="em">🏪</span><h3>'+esc(u)+'</h3>'+
       '<span class="ct">'+plural(vale.length,'reserva','reservas')+' · '+plural(pes,'pessoa','pessoas')+(canc?' · '+plural(canc,'cancelada','canceladas'):'')+'</span></div>'+
       '<div class="rv-grade">'+l.map(r=>cartaoReserva(r,hoje)).join('')+'</div>';
    pri=false;
  });
  return h;
}
function resumoReservas(d){
  const tudo=daLoja(d.reservas), l=tudo.filter(r=>!ehCancelada(r));   /* 10/10: cancelada não conta */
  if(!l.length)return {big:'—',sub:tudo.length?'só '+plural(tudo.length,'reserva cancelada','reservas canceladas')+' de hoje em diante':'nenhuma reserva anotada de hoje em diante',atencao:false};
  const pessoas=l.reduce((s,r)=>s+(Number(r.pessoas)||0),0);
  const prox=l.map(r=>String(r.data).slice(0,10)).sort()[0];
  const semSinal=l.filter(r=>r.sinal_pago!==true).length;
  return {big:plural(l.length,'reserva','reservas'),
    sub:pessoas+' pessoas · a próxima é '+br(prox)+(semSinal?' · '+semSinal+' sem sinal pago':''),
    atencao:semSinal>0};
}

/* ================= RESUMOS PARA A CAPA ================= */
function resumoEquipe(d){
  const hoje=hojeISO();
  let dia=0, noite=0, semEscala=[];
  UNI.forEach(u=>{
    const doDia=d.escala.filter(e=>e.unidade===u&&e.data===hoje&&ehSalao(e,d.pessoas));
    if(!doDia.length){semEscala.push(u);return}
    dia+=doDia.filter(e=>ehTurno(e.turno,'Dia')).length;
    noite+=doDia.filter(e=>ehTurno(e.turno,'Noite')).length;
  });
  return {big:(dia+noite)?('☀️ '+dia+'  ·  🌙 '+noite):'—',
    sub:(dia+noite)?('pessoas na escala de hoje, dia e noite'+(semEscala.length?' · falta lançar em '+semEscala.join(' e '):''))
                   :'nenhuma loja lançou a escala de hoje ainda',
    atencao:semEscala.length>0};
}
function resumoGoomer(d){
  if(d.pz){
    const gs=pzGrupos(daLoja(d.pz.tablet||[])), lidos=daLoja(d.pz.tablet_lido||[]);
    if(!gs.length)return {big:'—',sub:lidos.length?'nenhum item fora do ar na última leitura do tablet':'sem leitura do tablet para esta loja',atencao:false};
    const espera=gs.filter(g=>g.sit!=='RESP').length, maior=Math.max.apply(null,gs.map(g=>g.dias));
    return {big:plural(gs.length,'item','itens'),sub:'fora do ar no tablet · '+(espera?espera+' esperando resposta da loja':'todos respondidos')+' · o mais antigo há '+(maior>0?plural(maior,'dia','dias'):'menos de 1 dia'),atencao:espera>0};
  }
  const ult0={};daLoja(d.pausados).forEach(p=>{const v=String(p.visto_em).slice(0,10);if(!ult0[p.unidade]||v>ult0[p.unidade])ult0[p.unidade]=v});
  const pz=daLoja(d.pausados).filter(p=>String(p.visto_em).slice(0,10)===ult0[p.unidade]);
  if(!pz.length)return {big:'—',sub:'a varredura dos tablets ainda não trouxe nada',atencao:false};
  const chave={}, hoje=hojeISO();
  pz.forEach(p=>{chave[p.unidade+'|'+p.item]=String(p.primeiro_visto).slice(0,10)});
  const ks=Object.keys(chave);
  const maisVelho=ks.map(k=>chave[k]).sort()[0];
  const dias=diasEntre(maisVelho,hoje);
  return {big:plural(ks.length,'item','itens'),sub:'fora do ar no tablet · o mais antigo há '+(dias>0?dias+' dias':'menos de 1 dia'),atencao:ks.length>0};
}
function resumoClientes(d){
  let com=0;
  UNI.forEach(u=>{const g=d.google[u];if(g&&Array.isArray(g.destaques))com+=g.destaques.length});
  return {big:com?plural(com,'fala','falas'):'—',sub:com?'comentários guardados na última coleta do Google':'nenhum comentário guardado ainda',atencao:false};
}
function resumoGoogle(d){
  const notas=UNI.map(u=>d.google[u]).filter(Boolean).map(g=>+g.nota);
  if(!notas.length)return {big:'—',sub:'sem dado do Google ainda',atencao:false};
  const menor=Math.min.apply(null,notas);
  const loja=UNI.filter(u=>d.google[u]&&+d.google[u].nota===menor)[0];
  const media=notas.reduce((a,b)=>a+b,0)/notas.length;
  if(notas.length===1)return {big:nb(menor),sub:'nota de '+loja+' no Google',atencao:menor<4.2};
  return {big:nb(media),sub:'média das lojas · a mais baixa é '+loja+' com '+nb(menor),atencao:menor<4.2};
}

/* ================= CAPA E NAVEGAÇÃO ================= */
const SECOES={
  equipe:{ic:'👥',tt:'Equipe do salão',resumo:resumoEquipe,corpo:d=>blocoEquipe(d)},
  tablet:{ic:'📵',tt:'Cardápio no tablet',resumo:resumoGoomer,corpo:d=>blocoGoomer(daLoja(d.pausados),d.pz)},
  reservas:{ic:'🪑',tt:'Reservas do salão',resumo:resumoReservas,corpo:d=>blocoReservas(daLoja(d.reservas))},
  cliente:{ic:'💬',tt:'O que o cliente falou',resumo:resumoClientes,corpo:d=>blocoClientes(d.google)},
  google:{ic:'⭐',tt:'Nota no Google',resumo:resumoGoogle,corpo:d=>blocoGoogle(d.google)+blocoMarca()}
};
let DADOS=null;

/* ================= PRÓXIMOS EVENTOS NA CIDADE =================
   Pedido do Fábio (02/10/2026): saber com 7 dias de antecedência quando tem
   jogo, show ou evento grande em Curitiba, para se precaver. A lista mora em
   evento_cidade (agenda pública, cada linha com o link da fonte). "Perto da
   Água Verde" = Arena da Baixada. */
const EV_DIAS=7;
const EV_IC={jogo_casa:'⚽',jogo_fora:'📺',selecao:'🇧🇷',show:'🎤',outro:'📌'};
const EV_TP={jogo_casa:'jogo em Curitiba',jogo_fora:'jogo fora (TV)',selecao:'Seleção (TV)',show:'show',outro:'evento'};
function blocoEventos(lista,meta){
  const hoje=hojeISO(), ate=br(dMais(EV_DIAS)).slice(0,5);
  const quando=meta&&meta.conferida?br(new Date(meta.conferida).toLocaleDateString('sv-SE')):'';
  const vaiAte=meta&&meta.ultimo?br(meta.ultimo):'';
  let h='<div class="evq"><div class="tt">📅 Próximos dias na cidade · até '+ate+'</div>';
  h+='<div class="ctx">jogos, shows e eventos grandes de Curitiba'+(quando?' · lista conferida em '+quando:'')+(vaiAte?' · a lista vai até '+vaiAte:'')+'</div>';
  if(!lista.length){
    h+='<div class="vazio">'+(vaiAte?'Nenhum jogo, show ou evento grande na lista até '+ate+'.':'A lista não tem nenhum evento daqui para a frente — ela precisa ser atualizada.')+'</div></div>';
    return h;
  }
  lista.forEach(e=>{
    const dt=new Date(e.data+'T12:00:00'), falta=diasEntre(hoje,e.data);
    const hora=e.hora?String(e.hora).slice(0,5):'hora ?';
    h+='<div class="evl"><span class="qd">'+DIAS[dt.getDay()].slice(0,3)+' '+br(e.data).slice(0,5)+' · '+esc(hora)+'</span>'+
       '<span>'+(EV_IC[e.tipo]||'📌')+' <span class="oq">'+esc(e.titulo)+'</span>'+(e.local?' · '+esc(e.local):'')+'</span>'+
       (e.perto_av?'<span class="pill p-warn">perto da Água Verde</span>':'')+
       (e.a_confirmar?'<span class="pill p-off">a confirmar</span>':'')+
       '<span class="fa">'+esc(EV_TP[e.tipo]||'evento')+' · '+(falta<=0?'hoje':falta===1?'amanhã':'faltam '+falta+' dias')+
       (e.fonte_url?' · <a class="src" href="'+esc(e.fonte_url).replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">fonte ↗</a>':'')+'</span></div>';
  });
  h+='</div>';
  return h;
}

function capa(d){
  let h=blocoEventos(d.eventos||[],d.evMeta)+'<div class="tiles">';
  Object.keys(SECOES).forEach(k=>{
    const s=SECOES[k], r=s.resumo(d);
    h+='<button class="tile'+(r.atencao?' atencao':'')+'" onclick="abre(\'' + k + '\')">'+
       '<div class="ic">'+s.ic+'</div><div class="tt">'+s.tt+'</div>'+
       '<div class="big">'+esc(r.big)+'</div><div class="sub2">'+esc(r.sub)+'</div>'+
       '<div class="go">abrir →</div></button>';
  });
  h+='</div>';
  return h;
}

function abre(k){location.hash=k}
function rota(fica){
  if(!DADOS)return;
  const k=(location.hash||'').replace('#','');
  if(SECOES[k]){
    $('app').innerHTML='<div class="barra"><button class="voltar" onclick="location.hash=&quot;&quot;">← Voltar</button>'+
      '<span class="tit">'+SECOES[k].ic+' '+SECOES[k].tt+'</span></div>'+lojaChips()+SECOES[k].corpo(DADOS);
  } else {
    $('app').innerHTML=lojaChips()+capa(DADOS);
  }
  if(!fica)window.scrollTo(0,0);
}
function render(d){DADOS=d;rota()}
window.addEventListener('hashchange',()=>rota());

async function boot(){
  const [gRows,escala,ponto,pessoas,cobertura,pausados,balcao,reservas,eventos,evUlt]=await Promise.all([
    get('google_fato_avaliacao?select=unidade,id_loja,nota,num_avaliacoes,resumo,destaques,data_coleta&order=data_coleta.desc&limit=200'),
    get('fato_escala_posicao?select=data,nome,turno,posicao,unidade&data=gte.'+dMenos(7)+'&order=data.desc&limit=400'),
    get('fato_espelho_dia?select=nome,unidade,data,entrada,saida,categoria&data=gte.'+dMenos(3)+'&order=data.desc&limit=300'),
    get('dim_funcionario?select=nome,unidade,setor,entrada,ativo&ativo=is.true&limit=200'),
    get('escala_cobertura_min?select=unidade,setor,turno,dia_semana,funcao,minimo&setor=ilike.*Sal*&limit=100'),
    get('cardapio_pausado?select=unidade,marca,item,tipo,estado,primeiro_visto,visto_em&canal=ilike.*Goomer*&order=primeiro_visto.asc&limit=400'),
    get('saipos_venda_status?select=unidade,dia_operacional,n_pedido,cancelado&canal=is.null&dia_operacional=gte.'+dMenos(3)+'&limit=300'),
    get('salao_reserva?select=unidade,data,hora,pessoas,area,sinal_pago,status,observacao,origem&data=gte.'+hojeISO()+'&order=data.asc&limit=100'),
    get('evento_cidade?select=data,hora,tipo,titulo,local,perto_av,fonte_url,a_confirmar&data=gte.'+hojeISO()+'&data=lte.'+dMais(EV_DIAS)+'&order=data.asc,hora.asc.nullslast&limit=40'),
    get('evento_cidade?select=data,atualizado_em&data=gte.'+hojeISO()+'&order=data.desc&limit=1')
  ]);
  const G={};gRows.forEach(x=>{if(!G[x.unidade])G[x.unidade]=x});
  render({google:G,escala:escala,ponto:ponto,pessoas:pessoas,cobertura:cobertura,pausados:pausados,balcao:balcao,reservas:reservas,eventos:eventos,
    evMeta:{conferida:evUlt[0]&&evUlt[0].atualizado_em,ultimo:evUlt[0]&&evUlt[0].data}});
  PZT=await lePz();
  if(PZT&&DADOS){DADOS.pz=PZT;const y=window.scrollY;rota(true);window.scrollTo(0,y)}
}

/* ===== porta unica do portal: sessao por usuario ===== */
const CDMMODS=['salao','salaosb'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmTem(id){try{const l=JSON.parse(sessionStorage.getItem('cdm_modulos')||'[]');return Array.isArray(l)&&l.some(function(m){return m&&m.id===id})}catch(e){return false}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/rpc/portal_eu',{method:'POST',headers:{apikey:'sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV',Authorization:'Bearer sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV','Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:(new URLSearchParams(location.search).get('u')?'salaosb':'salao')})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  try{sessionStorage.setItem('cdm_nome',j.nome||'');sessionStorage.setItem('cdm_admin',j.admin?'1':'0');sessionStorage.setItem('cdm_modulos',JSON.stringify(ms))}catch(e){}
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
