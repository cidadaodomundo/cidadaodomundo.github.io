<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Compras no Mercado Livre · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
h2{font-size:15px;font-weight:800;margin:24px 0 10px}
table{width:100%;border-collapse:collapse;background:var(--s1);border:1px solid var(--line);border-radius:13px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-ped{background:rgba(201,133,0,.15);color:var(--warn)}
.p-com{background:rgba(47,174,106,.15);color:var(--ok)}
.p-ent{background:rgba(138,137,126,.15);color:var(--muted)}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:16px;background:var(--s1);border:1px solid var(--line);border-radius:13px}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:16px}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:16px}
.m{color:var(--muted);font-size:11.5px}

/* cara da casa 04-09-2026 */
h1,.gatebox h1{font-weight:400}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06}

/* cabe no celular 04-09-2026 — filas de aba nunca vazam ate 900px; o resto so em tela estreita */
@media (max-width:900px){.views,.tabs,.abas,.fil,.pes,.filtros,.chips,.lojas,.periodos{display:flex;flex-wrap:wrap;gap:6px;width:auto;max-width:100%;min-width:0}.views>*,.tabs>*,.abas>*,.fil>*,.pes>*{flex:0 0 auto;max-width:100%}}@media (max-width:640px){body{padding-left:12px;padding-right:12px}table{display:block;width:max-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}h1{font-size:clamp(18px,6.2vw,26px);word-break:break-word}img,svg,canvas,iframe{max-width:100%}}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>🛒 Compras no Mercado Livre</h1><div class="sub">o que foi pedido para comprar no Mercado Livre — vem das conversas com a Rita no WhatsApp (link + quantidade)</div></div></div>
  <div class="rt"><button class="b" onclick="location.reload()">↻ Atualizar</button></div>
</div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=i=>document.getElementById(i);
let SOLOJA=null;try{const _u=new URLSearchParams(location.search).get('u');if(_u)SOLOJA=_u}catch(e){}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const br=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
async function get(q){try{const r=await fetch(SB+q,{headers:H});return r.ok?await r.json():[]}catch(e){return []}}
const ST={pedido:['falta comprar','p-ped'],comprado:['comprado, esperando chegar','p-com'],entregue:['chegou','p-ent']};
/* 01/10/2026 04h (Fabio): tela vira so Mercado Livre. Insumos e listas das lojas sairam (outro grupo/app cuida). */
function lk(u){u=String(u||'');return /^https:\/\/([a-z0-9-]+\.)*(mercadolivre\.com\.br|meli\.la)\//i.test(u)?' <a href="'+esc(u)+'" target="_blank" rel="noopener" style="color:#E0A81C;white-space:nowrap">abrir no Mercado Livre ↗</a>':''}
/* 01/10/2026 (obra 109): a tela deixa de ser so leitura. Botoes Comprado / Chegou / Nao e compra / Reabrir
   pela porta compras_acao (exige login). Canceladas nao aparecem mais. O robo da faxina marca com aviso
   o que parece nao ser compra ou esta parado ha muito tempo; quem decide e a pessoa, no botao. */
async function acao(a,id){
  const r=await fetch(SB+'rpc/compras_acao',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:cdmTok(),p_acao:a,p_dados:{id:id}})});
  if(!r.ok){let m='não deu certo';try{const j=await r.json();if(j&&j.message)m=j.message}catch(e){}throw new Error(m)}
  return await r.json();
}
async function faz(a,id,btn){
  try{if(btn)btn.disabled=true;await acao(a,id);await boot()}
  catch(e){if(btn)btn.disabled=false;const d=$('erro');if(d){d.textContent='Não consegui gravar: '+e.message;d.style.display='block'}}
}
function bt(a,id,txt,cor){return '<button onclick="faz(\''+a+'\','+id+',this)" style="margin:2px 4px 2px 0;padding:4px 9px;border-radius:8px;border:1px solid '+cor+';background:transparent;color:'+cor+';cursor:pointer;font-size:12px">'+txt+'</button>'}

async function boot(){
  const abertos=await get('compra_item?select=id,unidade,item,quantidade,status,quem_pediu,origem,criado_em,obs,robo_aviso,link&canal=eq.mercado_livre&status=in.(pedido,comprado)&order=criado_em.desc&limit=200');
  const ent=await get('compra_item?select=id,unidade,item,criado_em,atualizado_em&canal=eq.mercado_livre&status=eq.entregue&order=atualizado_em.desc.nullslast&limit=20');
  const so=function(r){return !SOLOJA||r.unidade===SOLOJA};
  const ativos=abertos.filter(so);
  const entregues=ent.filter(so);
  const nAviso=ativos.filter(r=>r.robo_aviso).length;
  let h='<div id="erro" style="display:none;color:#e0645c;margin:8px 0"></div>';
  if(nAviso)h+='<div class="aviso" style="margin-bottom:10px">⚠ '+nAviso+' pedido(s) marcados pelo robô da faxina. Confira e clique: <b>Chegou</b> ou <b>Não é compra</b> (some da lista), ou <b>Ainda precisa</b> (fica).</div>';
  if(!ativos.length){
    h+='<div class="vazio">Nada para comprar no Mercado Livre agora. Quando a Rita mandar um link do Mercado Livre no WhatsApp, ele aparece aqui sozinho em até 3 minutos.</div>';
  } else {
    const lojas={};ativos.forEach(r=>{(lojas[r.unidade]=lojas[r.unidade]||[]).push(r)});
    Object.keys(lojas).sort().forEach(u=>{
      h+='<h2>'+esc(u)+' <span style="color:var(--muted);font-size:13px">('+lojas[u].length+')</span></h2><table><tr><th>Item</th><th>Qtd</th><th>Situação</th><th>Quem pediu</th><th>Quando</th><th>O que fazer</th></tr>';
      lojas[u].forEach(r=>{
        const s=ST[r.status]||ST.pedido;
        let b='';
        if(r.robo_aviso)b+=bt('chegou',r.id,'Chegou','#8fbf6a')+bt('nao_compra',r.id,'Não é compra','#e0645c')+bt('confirmar',r.id,'Ainda precisa','#E0A81C');
        else {
          if(r.status==='pedido')b+=bt('comprado',r.id,'Comprado','#E0A81C');
          b+=bt('chegou',r.id,'Chegou','#8fbf6a')+bt('nao_compra',r.id,'Não é compra','#9a9a9a');
        }
        h+='<tr><td>'+esc(r.item)+lk(r.link)+(r.robo_aviso?'<div class="m" style="color:#E0A81C">⚠ '+esc(r.robo_aviso)+'</div>':'')+(r.obs?'<div class="m">'+esc(r.obs)+'</div>':'')+'</td><td>'+esc(r.quantidade||'—')+'</td>'+
           '<td><span class="pill '+s[1]+'">'+s[0]+'</span></td><td>'+esc(r.quem_pediu||'—')+'</td><td>'+br(r.criado_em)+'</td><td>'+b+'</td></tr>';
      });
      h+='</table>';
    });
  }
  if(entregues.length){
    h+='<h2 style="color:var(--muted)">chegaram recentemente</h2><table><tr><th>Item</th><th>Loja</th><th>Pedido em</th><th></th></tr>';
    entregues.forEach(r=>{h+='<tr><td>'+esc(r.item)+'</td><td>'+esc(r.unidade)+'</td><td>'+br(r.criado_em)+'</td><td>'+bt('reabrir',r.id,'Reabrir','#9a9a9a')+'</td></tr>'});
    h+='</table>';
  }
  h+='<div class="aviso">Tela alimentada pelo WhatsApp (conversas com a Rita, de 3 em 3 min): cada link do Mercado Livre vira um pedido. Clique <b>Comprado</b> quando fizer a compra e <b>Chegou</b> quando a entrega chegar.</div>';
  $('app').innerHTML=h;
}

/* ===== porta unica do portal ===== */
const CDMMODS=['compras','comprassb'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:(new URLSearchParams(location.search).get('u')?'comprassb':'compras')})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
