<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Compras & Listas · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
h2{font-size:15px;font-weight:800;margin:24px 0 10px}
table{width:100%;border-collapse:collapse;background:var(--s1);border:1px solid var(--line);border-radius:13px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-ped{background:rgba(201,133,0,.15);color:var(--warn)}
.p-com{background:rgba(47,174,106,.15);color:var(--ok)}
.p-ent{background:rgba(138,137,126,.15);color:var(--muted)}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:16px;background:var(--s1);border:1px solid var(--line);border-radius:13px}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:16px}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:16px}
.m{color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>🛒 Compras & Listas</h1><div class="sub">o que as lojas pediram e o que já foi comprado — vem dos grupos Listas São Braz, Listas Ahu e das conversas de compras</div></div></div>
  <div class="rt"><button class="b" onclick="location.reload()">↻ Atualizar</button></div>
</div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const br=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
async function get(q){try{const r=await fetch(SB+q,{headers:H});return r.ok?await r.json():[]}catch(e){return []}}
const ST={pedido:['pedido','p-ped'],comprado:['comprado','p-com'],entregue:['entregue','p-ent']};

async function boot(){
  const rows=await get('compra_item?select=id,unidade,item,quantidade,status,quem_pediu,origem,criado_em,obs&order=criado_em.desc&limit=200');
  const ativos=rows.filter(r=>r.status!=='entregue');
  const entregues=rows.filter(r=>r.status==='entregue').slice(0,20);
  let h='';
  if(!ativos.length){
    h+='<div class="vazio">Nenhum pedido de compra em aberto anotado ainda. Esta prateleira enche sozinha a partir das varreduras do WhatsApp (12h e 20h) — os grupos Listas São Braz e Listas Ahu são as fontes principais.</div>';
  } else {
    const lojas={};ativos.forEach(r=>{(lojas[r.unidade]=lojas[r.unidade]||[]).push(r)});
    Object.keys(lojas).sort().forEach(u=>{
      h+='<h2>'+esc(u)+'</h2><table><tr><th>Item</th><th>Qtd</th><th>Situação</th><th>Quem pediu</th><th>Quando</th></tr>';
      lojas[u].forEach(r=>{
        const s=ST[r.status]||ST.pedido;
        h+='<tr><td>'+esc(r.item)+(r.obs?'<div class="m">'+esc(r.obs)+'</div>':'')+'</td><td>'+esc(r.quantidade||'—')+'</td>'+
           '<td><span class="pill '+s[1]+'">'+s[0]+'</span></td><td>'+esc(r.quem_pediu||'—')+'</td><td>'+br(r.criado_em)+'</td></tr>';
      });
      h+='</table>';
    });
  }
  if(entregues.length){
    h+='<h2 style="color:var(--muted)">entregues recentes</h2><table><tr><th>Item</th><th>Loja</th><th>Quando</th></tr>';
    entregues.forEach(r=>{h+='<tr><td>'+esc(r.item)+'</td><td>'+esc(r.unidade)+'</td><td>'+br(r.criado_em)+'</td></tr>'});
    h+='</table>';
  }
  h+='<div class="aviso">Tela alimentada pela varredura do WhatsApp (12h e 20h). Para entrar aqui, o pedido tem que passar pelos grupos de listas ou pela Rita.</div>';
  $('app').innerHTML=h;
}

/* ===== porta unica do portal ===== */
const CDMMODS=['compras'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
