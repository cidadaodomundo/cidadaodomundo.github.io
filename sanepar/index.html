<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanepar · Cidadão do Mundo</title>
<meta name="theme-color" content="#E0A81C">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/cdm-ui.css?v=1">
<style>
/* 05/11/2026 (chat-hellen-sanepar-05-11). Pedido da Hellen pelo WhatsApp 04/11 ("crie uma pasta no portal com isso, na aba da Hellen")
   e do Fabio 05/11 ("colocar a sanepar do lado de fora, nas abas principais"): item proprio no menu, grupo Hellen.
   Nome, CPF e matricula ficam no banco (tabela hellen_sanepar, fechada ao publico). A tela le pela funcao hellen_sanepar_lista,
   que so entrega para quem esta logado e tem esta tela (ou a aba Hellen). Nada disso fica no codigo, que e publico. */
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.grade-s{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cs{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cs .lj{font-weight:800;font-size:19px}
.cs .r{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.cs .v{font-size:15px}
.cs .mat{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:.5px}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:800;font-size:12px;margin-left:6px;white-space:nowrap}
.tag.hoje{background:#3a1515;color:#ff9a9a;border:1px solid #6e2626}
.tag.logo{background:#33280f;color:#f2c94c;border:1px solid #5c4a1c}
.msg{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text2)}
.msg.err{border-color:#6e2626;color:#ffd6d6}
.fonte{color:var(--muted);font-size:12px;margin-top:14px}
.btn-at{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 14px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>💧 Sanepar</h1><div class="sub">Matrícula e vencimento da conta de água de cada loja</div></div>
    <div class="rt"><button class="btn-at" id="btnAt" type="button">↻ Atualizar</button></div>
  </div>
  <div id="conteudo"><div class="msg">Conferindo o acesso…</div></div>
  <div class="fonte">Fonte: o que a Hellen mandou pelo WhatsApp em 04/11/2026. Para mudar algum dado, peça ao Claude pelo WhatsApp.</div>
</div>
<script>
(function(){
const SB = "https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/";
const KEY = "sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV";
const MODS = ["sanepar", "hellen"];
const el = document.getElementById("conteudo");
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function tok(){ try{ return sessionStorage.getItem("cdm_token") || ""; }catch(e){ return ""; } }
function saia(m){
  try{ sessionStorage.setItem("cdm_aviso", m || ""); }catch(e){}
  try{ var w = (window.top && window.top !== window) ? window.top : window; w.location.replace("/index.html"); }catch(e){ location.replace("/index.html"); }
}
async function rpc(nome, corpo){
  const r = await fetch(SB + "rpc/" + nome, { method: "POST",
    headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify(corpo) });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && (j.message || j.erro)) || ("erro " + r.status));
  return j;
}
async function guarda(){
  const t = tok();
  if (!t){ saia("Entre no portal para acessar esta tela"); return false; }
  let j = null;
  try{ j = await rpc("portal_eu", { p_token: t, p_tela: "sanepar" }); }catch(e){ j = null; }
  if (!j || !j.usuario){ saia("Entre no portal para acessar esta tela"); return false; }
  const ms = Array.isArray(j.modulos) ? j.modulos : [];
  if (!ms.some(m => m && MODS.indexOf(m.id) >= 0)){ saia("Você não tem acesso a este módulo"); return false; }
  return true;
}
function desenhar(lojas){
  const hoje = new Date().getDate();
  el.innerHTML = '<div class="grade-s">' + lojas.map(l => {
    const falta = l.vencimento_dia - hoje;
    const tag = falta === 0 ? '<span class="tag hoje">vence hoje</span>'
      : (falta > 0 && falta <= 3) ? '<span class="tag logo">vence em ' + falta + (falta === 1 ? ' dia' : ' dias') + '</span>' : '';
    return '<div class="cs"><div class="lj">' + esc(l.loja) + '</div>'
      + '<div><div class="r">Matrícula</div><div class="mat">' + esc(l.matricula) + '</div></div>'
      + '<div><div class="r">Vencimento</div><div class="v"><b>todo dia ' + String(l.vencimento_dia).padStart(2, "0") + '</b>' + tag + '</div></div>'
      + '<div><div class="r">Titular</div><div class="v">' + esc(l.titular || "—") + '</div>' + (l.cpf ? '<div class="r" style="margin-top:4px;text-transform:none">CPF ' + esc(l.cpf) + '</div>' : '') + '</div>'
      + (l.obs ? '<div class="v" style="color:var(--text2)">' + esc(l.obs) + '</div>' : '')
      + '</div>';
  }).join('') + '</div>';
}
async function carregar(){
  el.innerHTML = '<div class="msg">Carregando…</div>';
  try{
    const j = await rpc("hellen_sanepar_lista", { p_token: tok() });
    if (!j || j.erro || !Array.isArray(j.lojas)) throw new Error((j && j.erro) || "resposta vazia");
    desenhar(j.lojas);
  }catch(e){ el.innerHTML = '<div class="msg err">Não consegui carregar as contas da Sanepar (' + esc(e.message) + '). Aperte ↻ Atualizar.</div>'; }
}
document.getElementById("btnAt").addEventListener("click", carregar);
guarda().then(ok => { if (ok) carregar(); });
})();
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
