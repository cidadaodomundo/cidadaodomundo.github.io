<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111110">
<title>TV Cozinha · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* TV da cozinha 05-10-2026 (obra 22, chat-cozinha-ao-vivo-03-10).
   Pedido do Fabio: "eu vou instalar uma tv na cozinha" + "a tv vai ficar na agua verde".
   A TV nao faz login do portal (dura 12 h): guarda um codigo proprio, que o banco confere na porta cozinha_tv. */
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,sans-serif;font-size:clamp(14px,1.25vw,26px);overflow:hidden;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;gap:1.2em;padding:.6em 1.2em;border-bottom:2px solid var(--line);background:var(--s1)}
.topo h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:2em;letter-spacing:.01em;line-height:1}
.topo h1 b{color:var(--brand);font-weight:400}
.topo .st{color:var(--muted);font-size:.85em}
.topo .rt{margin-left:auto;display:flex;align-items:center;gap:1em}
.relogio{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:2.6em;line-height:1}
.bt{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:.5em;padding:.4em .8em;font:inherit;font-size:.85em;font-weight:700;cursor:pointer}
.bt.on{background:var(--brand);color:#111;border-color:var(--brand)}
.faixa{display:none;background:var(--bad);color:#fff;font-weight:800;padding:.45em 1.2em;font-size:1.05em}
.faixa.on{display:block}
.corpo{display:grid;grid-template-columns:62fr 38fr;gap:1.2em;padding:1em 1.2em;flex:1;min-height:0}
.col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.col h2{font-size:1.25em;font-weight:800;margin-bottom:.5em;display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap}
.col h2 small{color:var(--muted);font-weight:500;font-size:.7em}
.num{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em;margin-bottom:.8em}
.num div{background:var(--s1);border:1px solid var(--line);border-radius:.6em;padding:.5em .8em}
.num b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:2.4em;line-height:1}
.num span{color:var(--muted);font-size:.8em}
.lista{display:grid;gap:.6em;align-content:start;overflow:hidden;min-height:0}
.e{background:var(--s1);border:1px solid var(--line);border-left:.4em solid var(--warn);border-radius:.6em;padding:.6em .9em;display:grid;grid-template-columns:4.6em 1fr;gap:.8em}
.e.s-cozinha{border-left-color:var(--bad)}
.e.s-expedição{border-left-color:var(--muted)}
.e.grave{border-color:var(--bad);background:#2a1716}
.e.novo{animation:pisca 1.2s ease-in-out infinite}
@keyframes pisca{0%,100%{box-shadow:0 0 0 0 rgba(230,103,103,0)}50%{box-shadow:0 0 0 .25em rgba(230,103,103,.6)}}
.e .hr{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.9em;line-height:1}
.e .ha{color:var(--muted);font-size:.75em;margin-top:.2em}
.e .tt{font-size:1.35em;font-weight:800;display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.e .lj{color:var(--text2);font-size:.9em;margin-top:.1em}
.mc{color:var(--brand);font-weight:800;font-size:1.12em}   /* 07/10: nome da marca em destaque (Fabio: "qual cozinha errou") */
.mc.sem{color:var(--muted);font-weight:600;font-size:1em}
.e .ds{font-style:italic;margin-top:.3em;font-size:1.05em}
.e .ds,.e .lj,.p .it{overflow-wrap:anywhere}
.pl{display:inline-block;border-radius:999px;padding:.1em .6em;font-size:.6em;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.p-novo{background:var(--bad);color:#fff}
.p-coz{background:rgba(230,103,103,.18);color:var(--bad)}
.p-mon{background:rgba(201,133,0,.18);color:var(--warn)}
.p-exp{background:rgba(138,137,126,.18);color:var(--muted)}
.vazio{background:var(--s1);border:1px dashed var(--line);border-radius:.6em;padding:1.2em;color:var(--text2);font-size:1.1em}
.vazio b{color:var(--ok)}
.mais{color:var(--muted);font-size:.85em;margin-top:.3em}
.pz{display:grid;gap:.45em;align-content:start;overflow:hidden;min-height:0}
.lista,.pz{flex:0 1 auto}
.pz,.lista{grid-template-columns:minmax(0,1fr)}.p,.e{min-width:0}   /* linha comprida nunca empurra o cartao para fora */   /* encolhem para caber na coluna; o que nao cabe vira "+ N" */
.p{background:var(--s1);border:1px solid var(--line);border-radius:.55em;padding:.45em .8em;display:flex;gap:.8em;align-items:baseline}
.p.aberto{border-left:.35em solid var(--bad)}
.p .it{font-weight:800;font-size:1.1em;flex:1;min-width:0}
.p .it small{display:block;color:var(--muted);font-weight:500;font-size:.72em}
.p .it small.mk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* marcas numa linha so; o numero vem antes e nunca some */
.p .tm{color:var(--text2);font-size:.85em;white-space:nowrap}
.cinza{color:var(--muted);font-size:.85em;margin-top:.5em;line-height:1.35}
#pz-ok{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}   /* "de proposito" no maximo 2 linhas: o espaco e dos itens sem explicacao */
/* META DO CHURRASCO 05-10-2026: dia verde = ate 3 erros (cozinha + montagem); 5 dias verdes sab-sex = churrasco no sabado */
.meta{background:var(--s1);border:1px solid var(--line);border-radius:.6em;padding:.5em .8em;margin-bottom:.7em}
.meta h2{margin-bottom:.15em}
.meta .rg{color:var(--muted);font-size:.75em;margin-bottom:.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:.35em}
.dd{border-radius:.45em;padding:.3em .1em;text-align:center;background:var(--s2);border:2px solid transparent}
.dd .sm{font-size:.7em;font-weight:800;text-transform:uppercase;color:var(--text2)}
.dd .nn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.7em;line-height:1.05}
.dd .dt{font-size:.62em;color:var(--muted)}
.dd.verde{background:rgba(47,174,106,.2);border-color:var(--ok)}.dd.verde .nn{color:var(--ok)}
.dd.vermelho{background:rgba(230,103,103,.18);border-color:var(--bad)}.dd.vermelho .nn{color:var(--bad)}
.dd.hoje{border-color:var(--brand)}.dd.hoje .sm{color:var(--brand)}
.dd.falta .nn{color:var(--muted)}
.meta .fr{margin-top:.4em;font-weight:800;font-size:.95em}
.meta .fr.ok{color:var(--ok)}.meta .fr.nao{color:var(--text2)}
.meta .ant{color:var(--muted);font-size:.75em;margin-top:.2em}
/* ONDE MELHORAR + O CLIENTE DISSE 07-10-2026 (Fabio: "o objetivo é mostrar os erros, e onde podemos melhorar").
   Altura FIXA nas duas faixas: o rodizio das avaliacoes nao mexe no tamanho das listas (que sao ajustadas a tela). */
.melhor{display:grid;grid-template-columns:auto 1.3fr 1fr;gap:1.2em;align-items:center;background:var(--s1);border-left:.5em solid var(--brand);border-bottom:2px solid var(--line);padding:.35em 1.2em;height:3.5em;overflow:hidden}
.melhor.calmo{border-left-color:var(--ok)}
.lbx{font-weight:800;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.melhor .lbx{color:var(--brand)}.melhor.calmo .lbx{color:var(--ok)}
.lbx small{display:block;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.ins{min-width:0}
.ins .ac{font-size:1.15em;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins .ev{color:var(--text2);font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli{margin:0 1.2em .35em;background:var(--s1);border:1px solid var(--line);border-left:.4em solid var(--bad);border-radius:.6em;padding:.35em .9em;height:4.3em;overflow:hidden;display:grid;grid-template-columns:11em 1fr;gap:1em;align-items:center}
.cli.bom{border-left-color:var(--ok)}.cli.nada{border-left-color:var(--muted)}
.cli .lbx{color:var(--text2)}
.cli .q1{font-size:.85em;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .q1 .st{color:var(--brand);letter-spacing:.05em}
.cli .q2{font-style:italic;font-size:1.05em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cli>div:last-child{min-width:0}
.rodape{padding:.25em 1.2em;color:var(--muted);font-size:.7em;background:var(--s0)}
.alerta{color:var(--bad);font-weight:800}
/* tela do codigo */
.cod{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--s0);z-index:5}
.cod.on{display:flex}
.cod .box{background:var(--s1);border:1px solid var(--line);border-radius:1em;padding:2em 2.4em;max-width:34em;width:92%;text-align:center}
.cod h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:2em;margin-bottom:.4em}
.cod p{color:var(--text2);margin-bottom:1em}
.cod input{width:100%;font:inherit;font-size:2em;font-weight:800;letter-spacing:.15em;text-align:center;text-transform:uppercase;background:var(--s0);color:var(--text);border:2px solid var(--line);border-radius:.4em;padding:.3em}
.cod input:focus{outline:none;border-color:var(--brand)}
.cod .bt{margin-top:1em;font-size:1.3em;padding:.5em 1.6em;background:var(--brand);color:#111;border-color:var(--brand)}
.cod .err{color:var(--bad);font-weight:700;margin-top:.8em;min-height:1.2em}
@media (max-width:900px){html,body{height:auto}body{overflow:auto}.corpo{grid-template-columns:1fr}.topo{flex-wrap:wrap}
  .melhor,.cli{height:auto;grid-template-columns:1fr}.ins .ac,.ins .ev,.cli .q1{white-space:normal}}
</style>
</head>
<body>

<div class="topo">
  <div><h1>Central Cozinha · <b id="loja">—</b></h1><div class="st" id="st">carregando…</div></div>
  <div class="rt"><button class="bt" id="bt-som" onclick="som()">🔕 Ligar som</button><div class="relogio" id="relogio">--:--</div></div>
</div>
<div class="faixa" id="faixa"></div>
<div class="melhor" id="melhor" style="display:none"></div>
<div class="corpo">
  <div class="col"><h2>🔴 Erros de hoje <small id="dia"></small></h2><div class="num" id="num"></div><div class="lista" id="lista"></div><div class="mais" id="mais"></div></div>
  <div class="col"><div class="meta" id="meta"></div><h2>⏸ Fora do ar no iFood <small id="pz-st"></small></h2><div class="pz" id="pz"></div><div class="cinza" id="pz-ok"></div></div>
</div>
<div class="cli nada" id="cli" style="display:none"></div>
<div class="rodape" id="rodape"></div>

<div class="cod" id="cod"><div class="box">
  <h1>📺 TV da cozinha</h1>
  <p>Digite o código da TV (8 letras e números). Ele fica guardado: só precisa digitar uma vez.</p>
  <input id="cod-in" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" onkeydown="if(event.key==='Enter')entra()">
  <div><button class="bt" onclick="entra()">Entrar</button></div>
  <div class="err" id="cod-err"></div>
</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm=s=>{try{return new Date(s).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});}catch(e){return '—';}};
const ddmm=s=>{try{return new Date(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'America/Sao_Paulo'});}catch(e){return '—';}};
const haMin=ts=>{const m=Math.max(0,Math.round((Date.now()-ts)/60000));return m<60?'há '+m+' min':'há '+Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');};
const tempo=m=>m==null?'':m<60?m+' min':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+' dia'+(m>=2880?'s':'');
const limpa=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const NOVO_MIN=30; /* erro com menos de 30 min ganha NOVO e pisca */

let COD='', DADO=null, VISTOS=null, TIMER=null, ULT_OK=0, SOM=false, BUSCANDO=false;
try{ SOM=localStorage.getItem('cdm_tv_som')==='1'; }catch(e){}

function guarda(c){ try{ localStorage.setItem('cdm_tv_codigo',c); }catch(e){} try{ history.replaceState(null,'','#'+c); }catch(e){} }
function esquece(){ try{ localStorage.removeItem('cdm_tv_codigo'); }catch(e){} try{ history.replaceState(null,'',location.pathname); }catch(e){} }
function pedeCodigo(msg){ $('cod').classList.add('on'); $('cod-err').textContent=msg||''; setTimeout(function(){ try{$('cod-in').focus();}catch(e){} },50); }
function entra(){
  const c=limpa($('cod-in').value);
  if(c.length!==8){ $('cod-err').textContent='O código tem 8 letras e números.'; return; }
  COD=c; $('cod-err').textContent='conferindo…'; busca(true);
}

async function busca(primeira){
  if(BUSCANDO) return; BUSCANDO=true;   /* nunca duas leituras ao mesmo tempo (timer + volta da tela) */
  try{
    const r=await fetch(SB+'rpc/cozinha_tv',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_chave:COD})});
    if(r.status===403){ desliga(); esquece(); COD=''; DADO=null; pedeCodigo('Código não aceito. Confira e digite de novo.'); return; }
    if(!r.ok){ falha('Não consegui ler agora (código '+r.status+'). Tento de novo em 1 minuto.'); return; }
    const j=await r.json();
    $('cod').classList.remove('on'); guarda(COD);
    const lista=j.erros||[];
    const novos=VISTOS? lista.filter(e=>!VISTOS.has(e.k)) : [];
    VISTOS=new Set(lista.map(e=>e.k));
    DADO=j; ULT_OK=Date.now(); $('faixa').classList.remove('on');
    desenha(novos.map(e=>e.k));
    if(novos.length) apito();
    liga();
  }catch(e){ falha('SEM INTERNET — tentando de novo a cada 1 minuto.'); }
  finally{ BUSCANDO=false; }
}
function falha(msg){
  liga();
  const f=$('faixa'); f.textContent='⚠️ '+msg+(ULT_OK?' Mostrando o que foi lido às '+hhmm(ULT_OK)+'.':''); f.classList.add('on');
  if($('cod').classList.contains('on')) $('cod-err').textContent=msg;
  if(DADO) desenha([]);   /* a faixa vermelha ocupa espaco: refaz a lista para nenhum cartao ficar cortado */
  if(!DADO && !COD) pedeCodigo();
}
function liga(){ if(!TIMER) TIMER=setInterval(function(){ busca(false); },60000); }
function desliga(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } }

function desenha(novos){
  const j=DADO; if(!j) return;
  novos=novos||[];
  $('loja').textContent=j.loja||'—';
  $('dia').textContent='dia '+(j.dia||'—')+' · das 6h às 6h';
  $('st').textContent='atualiza sozinho a cada 1 minuto · lido às '+hhmm(j.agora);
  try{ melhor(j.melhorar); }catch(e){ $('melhor').style.display='none'; }   /* antes das listas: as faixas ocupam altura */
  try{ cli(j.avaliacoes); }catch(e){ CLI=null; $('cli').style.display='none'; }
  /* de quando e cada fonte */
  const f=j.frescor||{};
  const fx=[['Gestor Web',f.gestor_web],['Chat iFood',f.chat_ifood],['SAC',f.sac],['Grupos',f.grupos],['Negociação',f.negociacao]];
  $('rodape').textContent='Última novidade de cada fonte: '+fx.map(x=>x[0]+' '+(x[1]?(ddmm(x[1])===ddmm(Date.now())?'':ddmm(x[1])+' ')+hhmm(x[1]):'—')).join(' · ')
    +' · Avaliações iFood até '+((j.avaliacoes&&j.avaliacoes.ultima)||'—')+((j.avaliacoes&&j.avaliacoes.lido_em)?' (lido '+j.avaliacoes.lido_em+')':'')
    +((j.melhorar&&j.melhorar.calculado)?' · Onde melhorar calculado '+j.melhorar.calculado:'')+' · '+(j.tv||'');   /* antes das listas: o rodape tambem ocupa altura */
  const L=j.erros||[];
  const n=s=>L.filter(e=>e.setor===s).length;
  $('num').innerHTML='<div><b>'+L.length+'</b><span>erros hoje</span></div>'
    +'<div><b style="color:var(--bad)">'+n('cozinha')+'</b><span>cozinha · comida</span></div>'
    +'<div><b style="color:var(--warn)">'+n('montagem')+'</b><span>montagem · sacola</span></div>';
  if(!L.length){
    $('lista').innerHTML='<div class="vazio"><b>Nenhum erro registrado hoje até agora.</b></div>';
    $('mais').textContent='';
  }else{
    const MAX=12;
    $('lista').innerHTML=L.slice(0,MAX).map(function(e){
      const nv=novos.indexOf(e.k)>=0 || (Date.now()-e.ts)<NOVO_MIN*60000;
      const pc=e.setor==='cozinha'?'p-coz':e.setor==='montagem'?'p-mon':'p-exp';
      return '<div class="e s-'+esc(e.setor)+(e.grave?' grave':'')+(nv?' novo':'')+'">'
        +'<div><div class="hr">'+esc(e.hora)+'</div><div class="ha">'+haMin(e.ts)+'</div></div><div>'
        +'<div class="tt">'+esc(e.titulo)+(nv?' <span class="pl p-novo">novo</span>':'')+' <span class="pl '+pc+'">'+esc(e.setor)+'</span></div>'
        +'<div class="lj">'+(marcaCurta(e.marca)?'<span class="mc">'+esc(marcaCurta(e.marca))+'</span>':'<span class="mc sem">marca não informada</span>')+' · '+(e.pedido?'pedido <b>'+esc(e.pedido)+'</b>':'sem nº de pedido')+(e.item?' · '+esc(e.item):'')+'</div>'
        +(e.disse?'<div class="ds">“'+esc(e.disse)+'”</div>':'')
        +'</div></div>';
    }).join('');
    /* so os cartoes que cabem inteiros na tela; o resto vira "+ N mais cedo" (a linha do "+ N" ja ocupa lugar antes de medir) */
    $('mais').textContent='+';
    const el=$('lista'); while(el.children.length>1 && el.scrollHeight>el.clientHeight+2) el.removeChild(el.lastElementChild);
    const sobra=L.length-el.children.length;
    $('mais').textContent=sobra>0? '+ '+sobra+' erro'+(sobra>1?'s':'')+' mais cedo — lista completa no portal › Central Cozinha' : '';
  }
  meta(j.semana);   /* antes da lista de fora do ar: o cartao ocupa espaco na mesma coluna */
  /* fora do ar: junta o mesmo item de varias marcas; sem resposta da loja primeiro */
  const pz=(j.pausados&&j.pausados.itens)||[], g={};
  pz.forEach(function(p){
    const k=String(p.item||'').trim().toLowerCase(); if(!k) return;
    if(!g[k]) g[k]={item:p.item, marcas:0, min:0, aberto:false, o_que:'', nomes:[]};
    g[k].marcas++; const mn=marcaCurta(p.marca); if(mn&&g[k].nomes.indexOf(mn)<0) g[k].nomes.push(mn); g[k].min=Math.max(g[k].min,p.minutos||0);
    if(!p.resolvido) g[k].aberto=true;
    if(!g[k].o_que && p.o_que) g[k].o_que=p.o_que;   /* a loja pode ter respondido ("acabou, vai voltar") sem ser pausa de proposito */
  });
  const ab=Object.values(g).filter(x=>x.aberto).sort((a,b)=>(a.o_que?1:0)-(b.o_que?1:0) || a.min-b.min);   /* sem resposta da loja primeiro */
  const ok=Object.values(g).filter(x=>!x.aberto);
  const lm=j.pausados&&j.pausados.lido_min;
  $('pz-st').innerHTML=(lm==null||lm>30)? '<span class="alerta">⚠️ iFood sem leitura '+(lm==null?'há mais de 2 dias':'há '+tempo(lm))+' — lista pode estar velha</span>' : 'iFood lido há '+lm+' min';
  $('pz').innerHTML=ab.length? ab.slice(0,12).map(function(x){
      return '<div class="p'+(x.o_que?'':' aberto')+'"><div class="it">'+esc(x.item)+'<small>'+(x.o_que?'loja disse: '+esc(x.o_que):'<b style="color:var(--bad)">loja ainda não explicou</b>')+'</small>'
        +'<small class="mk">'+(x.marcas>1?x.marcas+' marcas':'1 marca')+(x.nomes.length?': '+esc(x.nomes.join(', ')):'')+'</small></div><div class="tm">fora há '+tempo(x.min)+'</div></div>';
    }).join('')
    : '<div class="vazio"><b>Nada fora do ar</b> além do que é de propósito.</div>';
  $('pz-ok').innerHTML=ok.length? '<b>Fora do ar de propósito</b> ('+ok.length+(ok.length>1?' itens':' item')+', a loja já explicou): '+ok.slice(0,14).map(x=>esc(x.item)).join(' · ') : '';
  /* so os itens que cabem inteiros; o resto vira "+ N outros" (a lista do portal tem todos) */
  const pe=$('pz'); if(ab.length){
    while(pe.children.length>1 && pe.scrollHeight>pe.clientHeight+2) pe.removeChild(pe.lastElementChild);
    const so=ab.length-pe.children.length;
    if(so>0){ pe.removeChild(pe.lastElementChild); pe.insertAdjacentHTML('beforeend','<div class="cinza">+ '+(so+1)+' outros fora do ar — lista completa no portal › Central Cozinha</div>'); }
  }
}

/* META DO CHURRASCO (05/10/2026, Fabio escolheu "dias verdes"): o banco manda os 7 dias de sabado a sexta.
   Meta UNICA da cozinha e do delivery (Fabio: "os dois setores caminham juntos... se complementassem"): bebida conta.
   Dia que passou: verde se ficou ate o limite. Hoje: ja fica vermelho se passou do limite; senao esta valendo. */
function meta(m){
  const el=$('meta'); if(!m||!m.dias){ el.style.display='none'; return; } el.style.display='';
  const lim=m.verde_ate, alvo=m.meta_dias;
  let verdes=0, aindaPode=0;
  const cx=m.dias.map(function(d){
    let cl='falta', nn='–';
    if(d.quando==='passou'){ cl=d.erros<=lim?'verde':'vermelho'; nn=d.erros; if(d.erros<=lim) verdes++; }
    else if(d.quando==='hoje'){ nn=d.erros; if(d.erros>lim) cl='vermelho hoje'; else { cl='hoje'; aindaPode++; } }
    else aindaPode++;
    return '<div class="dd '+cl+'"><div class="sm">'+(d.quando==='hoje'?'hoje':esc(d.sem))+'</div><div class="nn">'+esc(nn)+'</div><div class="dt">'+esc(d.dia)+'</div></div>';
  }).join('');
  const falta=Math.max(0,alvo-verdes);
  let fr, cf='';
  if(verdes>=alvo){ fr='🎉 Meta batida: churrasco no sábado! '+verdes+' dias verdes'; cf='ok'; }
  else if(verdes+aindaPode<alvo){ fr='Esta semana não dá mais ('+verdes+' de '+alvo+'). Sábado começa outra.'; cf='nao'; }
  else if(falta===aindaPode){ fr=(falta>1?'Faltam ':'Falta ')+falta+' dia'+(falta>1?'s':'')+' verde'+(falta>1?'s':'')+' — precisa de todos os que sobram!'; }
  else fr=verdes+' de '+alvo+' dias verdes · '+(falta>1?'faltam ':'falta ')+falta+' · ainda dá!';
  const a=m.anterior;
  el.innerHTML='<h2>🍖 Meta do churrasco <small>cozinha + delivery juntos</small></h2><div class="rg">dia verde = até '+esc(lim)+' erros · '+esc(alvo)+' verdes de sáb a sex = churrasco</div>'
    +'<div class="dias">'+cx+'</div><div class="fr '+cf+'">'+esc(fr)+'</div>'
    +(a?'<div class="ant">Semana passada ('+esc(a.de)+' a '+esc(a.ate)+'): '+esc(a.verdes)+' dia'+(a.verdes==1?'':'s')+' verde'+(a.verdes==1?'':'s')+(a.verdes>=alvo?' — 🎉 ganharam o churrasco!':'')+'</div>':'');
}

/* ONDE MELHORAR (07/10/2026): o banco manda os numeros crus dos 7 dias que ja fecharam; a regra de amostra minima fica
   aqui, para a TV nunca afirmar nada com 1 ou 2 casos. Frases de acao sao fixas da tela (nunca texto do banco). */
const FAM={sacola:['Faltou item','Conferir a comanda item por item (e adicionais)'],
  errado:['Item trocado ou errado','Conferir a comanda antes de montar'],
  ponto:['Ponto da carne','Conferir o ponto antes de tirar da chapa'],
  frio:['Pedido chegou frio','Pedido pronto: despachar na hora'],
  embalagem:['Embalagem vazou ou abriu','Fechar bem e lacrar a sacola'],
  sabor:['Sabor ou porção','Seguir a ficha técnica: porção e tempero'],
  grave:['Corpo estranho ou estragado','Touca, luva e bancada limpa sempre'],
  acabou:['Item acabou sem pausar no iFood','Acabou? Avisar na hora para pausar no iFood']};
const TEMA={frio:['comida fria/temperatura','Pedido pronto: despachar na hora'],
  ponto:['ponto da carne','Conferir o ponto antes de tirar da chapa'],
  sabor:['sabor ou tempero','Seguir a ficha técnica: tempero e sal'],
  faltou:['item faltando ou errado','Conferir a comanda item por item'],
  porcao:['pouca comida','Porção certa: seguir a ficha técnica'],
  embalagem:['embalagem','Fechar bem e lacrar a sacola']};
const TEMA_FAM={frio:['frio'],ponto:['ponto'],faltou:['sacola','errado'],embalagem:['embalagem'],sabor:['sabor'],porcao:['sabor']};   /* tema do cliente que e a mesma coisa que a familia de erro: mostra uma frase so */
const MIN_FAM={n:5,dias:3,pct:35}, MIN_ITEM={n:3,dias:2}, MIN_TEMA={n:3,dias:2};
function melhor(m){
  const el=$('melhor'); if(!m){ el.style.display='none'; return; } el.style.display='';
  const num=x=>({...x, n:Number(x.n)||0, dias:Number(x.dias)||0});   /* numero que chegar como texto vira numero */
  const fams=(Array.isArray(m.familias)?m.familias.filter(x=>x&&typeof x==='object').map(num):[]).sort((x,y)=>(y.n-x.n)||(y.dias-x.dias)), tm=m.tema, per=(m.de&&m.ate)?esc(m.de)+' a '+esc(m.ate):'';
  const ne=Math.max(Number(m.erros)||0, fams.reduce((t,x)=>t+x.n,0));   /* o total nunca fica menor que a soma dos tipos */
  const junta=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1];
  const passa=x=>x&&FAM[x.fam]&&x.n>=MIN_FAM.n&&x.dias>=MIN_FAM.dias&&x.n*100>=MIN_FAM.pct*ne;
  const L=fams.find(passa)||null, okF=!!L;   /* a primeira familia que passa na regra, nao so a primeira da lista */
  /* item mais esquecido: o grupo do topo (empatados) so aparece se TODOS passam na regra; senao nao afirma nada */
  const its=(Array.isArray(m.itens)?m.itens:(m.item?[m.item]:[])).filter(x=>x&&typeof x==='object').map(num).sort((x,y)=>(y.n-x.n)||(y.dias-x.dias));
  const grp=its.length?its.filter(x=>x.n===its[0].n):[];
  const top=grp.length&&grp.every(x=>x.n>=MIN_ITEM.n&&x.dias>=MIN_ITEM.dias)?grp:[];
  const okT=tm&&TEMA[tm.tema]&&tm.n>=MIN_TEMA.n&&tm.dias>=MIN_TEMA.dias;
  const evF=okF? esc(FAM[L.fam][0])+': '+esc(L.n)+' de '+esc(ne)+' erros'
    +(L.fam==='sacola'&&top.length? (top.length>1?' · mais esquecidos: '+junta(top.slice(0,2).map(x=>esc(x.nome)))+(top.length>2?' +'+(top.length-2):'')+' ('+esc(top[0].n)+'x cada)'
                                                 :' · mais esquecido: '+esc(top[0].nome)+' ('+esc(top[0].n)+'x)') : '') : '';
  const evT=okT? 'iFood: '+esc(tm.n)+' de '+esc(m.aval_ruins)+' avaliações ruins sobre '+esc(TEMA[tm.tema][0]) : '';
  let a='', b='';
  if(okF) a='<div class="ins"><div class="ac">'+esc(FAM[L.fam][1])+'</div><div class="ev">'+evF+'</div></div>';
  if(okT){
    if(okF && (TEMA_FAM[tm.tema]||[]).indexOf(L.fam)>=0) b='<div class="ins"><div class="ac" style="color:var(--text2)">O cliente confirma no iFood</div><div class="ev">'+evT+'</div></div>';   /* mesma acao: nao repete a frase */
    else b='<div class="ins"><div class="ac">'+esc(TEMA[tm.tema][1])+'</div><div class="ev">'+evT+'</div></div>';
  }
  /* nenhum tipo passou na regra: o texto sai dos numeros, nunca de um "nada aconteceu" generico */
  const nome=x=>FAM[x.fam]?FAM[x.fam][0]:'outro tipo';
  const topN=fams.length?Number(fams[0].n)||0:0, topG=fams.filter(x=>x.n===topN), f0=topG[0];
  const nomes=junta(topG.slice(0,3).map(x=>esc(nome(x))))+(topG.length>3?' +'+(topG.length-3):'');
  const forte=!a&&!b&&topN>=3&&topN*3>=ne;                      /* algum tipo com 1/3 ou mais (em poucos dias ou poucos casos) */
  const concentrado=forte&&topG.length===1;                    /* um so no topo */
  const empate=forte&&topG.length>1;                           /* empate no topo: nunca escolhe um */
  const espalhado=!a&&!b&&!forte&&ne>=2*MIN_FAM.n;              /* todos abaixo de 1/3 (topN*3<ne) e muitos erros */
  el.classList.toggle('calmo',!a&&!b&&!forte&&!espalhado);
  if(concentrado) a='<div class="ins"><div class="ac">Mais comum: '+esc(nome(f0))+'</div><div class="ev">'+esc(topN)+' de '+esc(ne)+' erros em '+esc(f0.dias)+(f0.dias==1?' dia':' dias')+(FAM[f0.fam]?' · '+esc(FAM[f0.fam][1]):'')+'</div></div>';
  else if(empate) a='<div class="ins"><div class="ac">Empate: '+nomes+'</div><div class="ev">'+esc(topN)+' erros cada, de '+esc(ne)+' nos últimos 7 dias</div></div>';
  else if(espalhado) a='<div class="ins"><div class="ac">Erros espalhados: nenhum tipo chegou a 1/3</div><div class="ev">'+esc(ne)+' erros nos últimos 7 dias'+(f0?(topG.length>1?' · os mais comuns: '+nomes+' ('+esc(topN)+' cada)':' · o mais comum: '+esc(nome(f0))+' ('+esc(topN)+')'):'')+'</div></div>';
  else if(!a&&!b) a='<div class="ins"><div class="ac">Nenhum erro se repetiu o bastante para virar alerta</div><div class="ev">'+esc(ne)+(ne===1?' erro':' erros')+' nos últimos 7 dias · continuem conferindo cada pedido</div></div>';
  el.innerHTML='<div class="lbx">🎯 Onde melhorar<small>últimos 7 dias · '+per+'</small></div>'+a+(b||'<div></div>');
}

/* O CLIENTE DISSE (07/10/2026): o iFood libera a avaliacao ~1 dia depois, entao nada aqui e "de hoje":
   cada avaliacao mostra a data dela e a do pedido. Uma por vez, troca a cada 15 s; ruins primeiro, depois 1 elogio. */
let CLI=null, CLI_I=0;
function cli(av){ CLI=av||null; cliMostra(); }
function curta(m){ return String(m||'').replace(/\s*-?\s*[ÁA]GUA VERDE\s*$/i,'').replace(/\s+AV$/i,''); }
/* 07/10: nome curto e sempre igual de cada marca (o iFood e o Saipos escrevem cada uma de um jeito) */
function marcaCurta(m){
  const t=String(m||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if(!t.trim()) return '';
  if(/vegan burger|cidadao vegan/.test(t)) return 'Vegan Burger';
  if(/veganete/.test(t)) return 'Veganete';
  if(/comida brasileira/.test(t)) return 'Comida Brasileira';
  if(/\bufo\b/.test(t)) return 'UFO Burger';
  if(/jane/.test(t)) return 'Marmita da Jane';
  if(/baixa gastronomia/.test(t)) return 'Baixa Gastronomia';
  if(/famosa marmita/.test(t)) return 'A Famosa Marmita';
  if(/cidadao do mundo burger/.test(t)) return 'Cidadão Burger';
  const c=curta(m).trim(); return c===c.toUpperCase()? c.toLowerCase().replace(/(^|\s)\S/g,x=>x.toUpperCase()) : c;
}
function cliMostra(){
  const el=$('cli'); const av=CLI; if(!av){ el.style.display='none'; return; } el.style.display='';
  const h=av.hoje||{}, hn=Number(h.n)||0;
  /* dado parado se declara: a avaliacao do iFood chega ~1 dia depois; mais de 2 dias sem nenhuma = robo parado ou iFood atrasado */
  const velho=av.atraso_dias==null||Number(av.atraso_dias)>2;
  const lb='<div class="lbx">⭐ O cliente disse<small>iFood · '+(hn?(hn===1?'chegou hoje: 1':'chegaram hoje: '+esc(hn))+(h.media!=null?' · média '+esc(String(h.media).replace('.',',')):'')+(h.ruins?' · <b style="color:var(--bad)">'+esc(h.ruins)+(h.ruins>1?' ruins':' ruim')+'</b>':' · nenhuma ruim'):'nenhuma chegou hoje ainda')+'</small></div>';
  const fila=(Array.isArray(av.ruins)?av.ruins:[]).slice(); if(av.elogio) fila.push(Object.assign({elogio:true,nota:5},av.elogio));
  if(velho){ el.className='cli nada'; el.innerHTML=lb+'<div><div class="q2 alerta" style="font-style:normal">⚠️ '+(av.ultima?'Nenhuma avaliação nova do iFood desde '+esc(av.ultima):'Nenhuma avaliação do iFood nos últimos 7 dias')+' — o robô pode estar parado.</div></div>'; return; }
  if(!fila.length){ el.className='cli nada'; el.innerHTML=lb+'<div><div class="q2" style="font-style:normal">Nenhuma avaliação ruim nos últimos 3 dias. 👏</div></div>'; return; }
  const r=fila[CLI_I%fila.length], nt=Math.max(0,Math.min(5,Number(r.nota)|0));
  const st='★'.repeat(nt)+'☆'.repeat(5-nt);
  /* so as etiquetas que o PROPRIO cliente marcou no iFood (o classificador de erro da cozinha dava nome errado a texto de avaliacao) */
  const sobre=r.elogio?'nota máxima':(Array.isArray(r.tags)&&r.tags.length?esc(r.tags.slice(0,2).join(', '))+(r.tags.length>2?' +'+(r.tags.length-2):''):'');
  el.className='cli'+(r.elogio?' bom':'');
  el.innerHTML=lb+'<div><div class="q1">'+(fila.length>1?((CLI_I%fila.length)+1)+'/'+fila.length+' · ':'')+'<span class="st">'+st+'</span> · avaliou '+esc(r.dia)+(r.pedido?' · pedido '+esc(r.pedido)+(r.pedido_dia?' de '+esc(r.pedido_dia):''):'')+(marcaCurta(r.marca)?' · <b>'+esc(marcaCurta(r.marca))+'</b>':'')+(sobre?' · '+sobre:'')+'</div>'
    +'<div class="q2">'+(r.disse&&String(r.disse).trim()?'“'+esc(r.disse)+'”':'<span style="font-style:normal;color:var(--muted)">(sem comentário escrito)</span>')+'</div></div>';
}

/* som: o navegador so deixa tocar depois de um clique; o botao liga e guarda a escolha */
let AC=null;
function som(){
  SOM=!SOM; try{ localStorage.setItem('cdm_tv_som',SOM?'1':'0'); }catch(e){}
  botaoSom(); if(SOM) apito();
}
function botaoSom(){ const b=$('bt-som'); b.textContent=SOM?'🔔 Som ligado':'🔕 Ligar som'; b.classList.toggle('on',SOM); }
function apito(){
  if(!SOM) return;
  try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; if(!AC) AC=new C(); if(AC.state==='suspended') AC.resume();
    [0,0.35,0.7].forEach(function(t){ const o=AC.createOscillator(), g=AC.createGain(); o.type='square'; o.frequency.value=880;
      g.gain.value=0.18; o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t); o.stop(AC.currentTime+t+0.22); });
  }catch(e){}
}

function relogio(){ $('relogio').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'}); }
/* tela nao apaga (quando o navegador da TV deixa) */
async function acordada(){ try{ if(navigator.wakeLock && document.visibilityState==='visible') await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ acordada(); if(COD) busca(false); } });

(function(){
  botaoSom(); relogio(); setInterval(relogio,15000); acordada();
  setInterval(function(){ if(DADO) desenha([]); },60000);           /* "ha X min" e NOVO andam mesmo sem dado novo */
  setInterval(function(){ if(CLI){ CLI_I++; try{ cliMostra(); }catch(e){} } },15000);  /* troca a avaliacao; a faixa tem altura fixa */
  /* pega versao nova da tela a cada 6 h, so com internet e leitura boa (senao a TV ficaria presa na pagina de erro) */
  setInterval(function(){ if(performance.now()>6*3600*1000 && navigator.onLine!==false && Date.now()-ULT_OK<5*60000) location.reload(); }, 10*60000);
  let c=''; try{ c=limpa(decodeURIComponent((location.hash||'').replace(/^#(k=)?/i,''))); }catch(e){ c=''; }
  if(c.length!==8){ try{ c=limpa(localStorage.getItem('cdm_tv_codigo')); }catch(e){ c=''; } }
  if(c.length===8){ COD=c; busca(true); } else pedeCodigo();
})();
</script>
