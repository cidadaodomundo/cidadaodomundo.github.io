<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#E0A81C">
<title>Manutenção · Cidadão do Mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#E0A81C;--brand-ink:#111110;--ok:#2fae6a;--bad:#e66767;--warn:#c98500}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
button.bp{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.cnt{color:var(--muted);font-weight:500;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chips .n{opacity:.7;font-weight:700;margin-left:3px}
.c.urg{border-left:3px solid var(--bad)}
.c.feito{opacity:.75}
.lin1{display:flex;gap:12px;align-items:flex-start}
.lin1 .corpo{flex:1;min-width:0}
.cx{width:24px;height:24px;flex:none;border:2px solid var(--line);border-radius:6px;background:var(--s2);cursor:pointer;display:grid;place-items:center;font-size:14px;color:var(--ok);margin-top:1px}
.cx:hover{border-color:var(--ok)}
.cx.on{border-color:var(--ok);background:rgba(47,174,106,.12)}
.hist{margin-top:7px;border-left:2px solid var(--line);padding-left:9px}
.hist .ln{font-size:12px;color:var(--text2);margin:2px 0}
.hist details.mais{margin:0}
.hist details.mais summary{font-size:11.5px;padding:0;color:var(--muted)}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.acoes .nota{flex:1;min-width:200px;background:var(--s2);border:1px dashed var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit}
.acoes .nota:focus{outline:none;border-style:solid;border-color:var(--brand)}
.mini{padding:6px 9px!important;font-size:12px!important;background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:8px;font-family:inherit}
.form{background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:14px;display:none}
.form.on{display:block}
.form input,.form select,.form textarea{width:100%;background:var(--s1);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;margin-bottom:8px}
.form .lin{display:flex;gap:8px;flex-wrap:wrap}
.form .lin>*{flex:1;min-width:130px}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:7px}
h2{font-size:15px;font-weight:800;margin:24px 0 10px}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
.c .nm{font-weight:800;font-size:14.5px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-urg{background:rgba(230,103,103,.15);color:var(--bad)}
.p-nor{background:rgba(201,133,0,.15);color:var(--warn)}
.p-qdd{background:rgba(138,137,126,.15);color:var(--muted)}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.d{color:var(--text2);font-size:13px;margin-top:6px;line-height:1.5}
.m{color:var(--muted);font-size:11.5px;margin-top:6px}
.load{color:var(--muted);padding:30px;text-align:center}
.vazio{color:var(--muted);font-size:13px;padding:10px 0}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:16px}
details{margin-top:16px}
summary{cursor:pointer;color:var(--text2);font-size:13px;font-weight:600;padding:6px 0}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:16px}

/* cara da casa 04-09-2026 */
h1,.gatebox h1{font-weight:400}
h1{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1.06}

/* cabe no celular 04-09-2026 — filas de aba nunca vazam ate 900px; o resto so em tela estreita */
@media (max-width:900px){.views,.tabs,.abas,.fil,.pes,.filtros,.chips,.lojas,.periodos{display:flex;flex-wrap:wrap;gap:6px;width:auto;max-width:100%;min-width:0}.views>*,.tabs>*,.abas>*,.fil>*,.pes>*{flex:0 0 auto;max-width:100%}}@media (max-width:640px){body{padding-left:12px;padding-right:12px}table{display:block;width:max-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}h1{font-size:clamp(18px,6.2vw,26px);word-break:break-word}img,svg,canvas,iframe{max-width:100%}}
</style>
</head>
<body>
<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>🔧 Manutenção</h1><div class="sub">o que está quebrado, por loja — marque ✔ quando resolver e anote o que aconteceu</div></div></div>
  <div class="rt"><button class="b bp" onclick="abreForm()">+ Novo chamado</button> <button class="b" onclick="boot()">↻ Atualizar</button></div>
</div>

<div class="form" id="frm">
  <div class="tag">Abrir chamado novo</div>
  <input id="f_item" placeholder="O que quebrou? (ex.: Freezer da cozinha)" maxlength="120">
  <div class="lin">
    <select id="f_unid"><option value="">Loja…</option><option>Água Verde</option><option>São Braz</option><option>Ahú</option><option>Boqueirão</option><option>Todas</option></select>
    <select id="f_prio"><option value="normal">Normal</option><option value="urgente">Urgente</option><option value="quando_der">Quando der</option></select>
  </div>
  <textarea id="f_desc" rows="2" placeholder="Detalhe (opcional)" maxlength="600"></textarea>
  <div class="lin" style="justify-content:flex-end"><button class="b bp" onclick="salvaNovo()" style="flex:none">Salvar</button><button class="b" onclick="abreForm(false)" style="flex:none">Cancelar</button></div>
</div>

<div class="chips" id="chips"></div>
<div id="app"><div class="load">Carregando…</div></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=i=>document.getElementById(i);
let SOLOJA=null;try{const _u=new URLSearchParams(location.search).get('u');if(_u)SOLOJA=_u}catch(e){}
let FILTRO=SOLOJA||'';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const br=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
function dias(d){const n=Math.round((new Date()-new Date(d+'T00:00:00'))/86400000);return n<=0?'hoje':(n+' dia'+(n>1?'s':''))}
async function get(q){try{const r=await fetch(SB+q,{headers:H});return r.ok?await r.json():[]}catch(e){return []}}
const PRI={urgente:['urgente','p-urg'],normal:['normal','p-nor'],quando_der:['quando der','p-qdd']};
const tok=()=>{try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}};
async function acao(a,dados){
  const r=await fetch(SB+'rpc/manutencao_acao',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:tok(),p_acao:a,p_dados:dados||{}})});
  if(!r.ok)throw new Error('porta '+r.status);
  return await r.json();
}
async function faz(a,dados,erro){try{await acao(a,dados);await boot()}catch(e){alert(erro||'Não deu para gravar. Entre no portal de novo e tente outra vez.')}}
function resolver(id,v){if(v&&!confirm('Marcar este chamado como RESOLVIDO?'))return;faz('resolver',{id:id,feito:v})}
async function anotar(id,el){const t=el.value.trim();if(!t)return;el.disabled=true;try{await acao('anotar',{id:id,texto:t});await boot()}catch(e){el.disabled=false;alert('Não deu para gravar a observação.')}}
function teclaNota(ev,id,el){if(ev.key==='Enter'){ev.preventDefault();anotar(id,el)}}
function abreForm(v){const e=$('frm');e.classList.toggle('on',v!==false&&!e.classList.contains('on'));if(e.classList.contains('on'))$('f_item').focus()}
async function salvaNovo(){
  const it=$('f_item').value.trim(),u=$('f_unid').value;
  if(!it||!u){alert('Escreva o que quebrou e escolha a loja.');return}
  try{await acao('novo',{item:it,unidade:u,prioridade:$('f_prio').value,descricao:$('f_desc').value.trim()});
    $('f_item').value='';$('f_desc').value='';abreForm(false);await boot()}
  catch(e){alert('Não deu para salvar. Entre no portal de novo e tente outra vez.')}
}
function filtra(u){FILTRO=u;boot()}
function historico(obs){
  const p=String(obs||'').split(' | ').map(s=>s.trim()).filter(Boolean);
  if(!p.length)return '';
  const ult=p.slice(-2),antes=p.slice(0,-2);
  let h='<div class="hist">';
  if(antes.length)h+='<details class="mais"><summary>ver '+antes.length+' anotação(ões) antiga(s)</summary>'+antes.map(x=>'<div class="ln">'+esc(x)+'</div>').join('')+'</details>';
  h+=ult.map(x=>'<div class="ln">'+esc(x)+'</div>').join('')+'</div>';
  return h;
}
let ROWS=[];
async function boot(){
  ROWS=await get('manutencao_chamado?select=id,unidade,item,descricao,prioridade,status,origem,aberto_em,resolvido_em,obs&order=aberto_em.asc&limit=300');
  const lojasTodas=['Água Verde','São Braz','Ahú','Boqueirão'];
  const ab=ROWS.filter(r=>r.status!=='resolvido');
  if(!SOLOJA){
    $('chips').innerHTML=['',...lojasTodas].map(u=>{const n=u?ab.filter(r=>r.unidade===u||r.unidade==='Todas').length:ab.length;
      return '<button class="b'+(FILTRO===u?' bp':'')+'" onclick="filtra(\''+u+'\')">'+(u||'Todas')+' <span class="n">'+n+'</span></button>'}).join('');
  }
  const rowsF=FILTRO?ROWS.filter(r=>r.unidade===FILTRO||r.unidade==='Todas'):ROWS;
  const abertos=rowsF.filter(r=>r.status!=='resolvido');
  const resolvidos=rowsF.filter(r=>r.status==='resolvido').sort((a,b)=>String(b.resolvido_em).localeCompare(String(a.resolvido_em))).slice(0,30);
  const ord={urgente:0,normal:1,quando_der:2};
  abertos.sort((a,b)=>(ord[a.prioridade]??1)-(ord[b.prioridade]??1)||String(a.aberto_em).localeCompare(String(b.aberto_em)));
  let h='';
  if(!abertos.length)h+='<div class="vazio">nenhum chamado aberto aqui 🎉</div>';
  const grupos={};abertos.forEach(r=>{(grupos[r.unidade]=grupos[r.unidade]||[]).push(r)});
  Object.keys(grupos).sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(u=>{
    const l=grupos[u];
    h+='<h2>'+esc(u)+' <span class="cnt">'+l.length+' aberto'+(l.length>1?'s':'')+'</span></h2>';
    l.forEach(r=>{
      const p=PRI[r.prioridade]||PRI.normal;
      h+='<div class="c'+(r.prioridade==='urgente'?' urg':'')+'"><div class="lin1">'+
        '<div class="cx" title="Marcar como resolvido" onclick="resolver('+r.id+',true)"></div>'+
        '<div class="corpo"><div class="nm">'+esc(r.item)+' <span class="pill '+p[1]+'">'+p[0]+'</span>'+(r.status==='agendado'?' <span class="pill p-ok">agendado</span>':'')+'</div>'+
        (r.descricao?'<div class="d">'+esc(r.descricao)+'</div>':'')+
        '<div class="m">aberto há '+dias(r.aberto_em)+' ('+br(r.aberto_em)+') · veio do '+esc(r.origem)+'</div>'+
        historico(r.obs)+
        '<div class="acoes"><input class="nota" placeholder="✏️ escreva uma observação e aperte Enter" maxlength="400" onkeydown="teclaNota(event,'+r.id+',this)">'+
        '<button class="b mini" onclick="anotar('+r.id+',this.previousSibling)">Gravar</button>'+
        '<select class="mini" onchange="faz(\'situacao\',{id:'+r.id+',status:this.value})"><option value="aberto"'+(r.status!=='agendado'?' selected':'')+'>aberto</option><option value="agendado"'+(r.status==='agendado'?' selected':'')+'>agendado</option></select>'+
        '<select class="mini" onchange="faz(\'prioridade\',{id:'+r.id+',prioridade:this.value})">'+Object.keys(PRI).map(k=>'<option value="'+k+'"'+(r.prioridade===k?' selected':'')+'>'+PRI[k][0]+'</option>').join('')+'</select>'+
        '</div></div></div></div>';
    });
  });
  if(resolvidos.length){
    h+='<details class="res"><summary>✅ resolvidos recentes ('+resolvidos.length+')</summary>';
    resolvidos.forEach(r=>{h+='<div class="c feito"><div class="lin1"><div class="cx on" title="Reabrir" onclick="if(confirm(\'Reabrir este chamado?\'))resolver('+r.id+',false)">✔</div><div class="corpo"><div class="nm">'+esc(r.item)+' <span class="pill p-ok">resolvido '+br(r.resolvido_em)+'</span></div><div class="m">'+esc(r.unidade)+'</div>'+historico(r.obs)+'</div></div></div>'});
    h+='</details>';
  }
  h+='<div class="aviso">✔ fecha o chamado (e aparece como resolvido também em Precisa de Resposta). Toda observação fica gravada com seu nome e a hora. A varredura do WhatsApp (12h e 20h) continua abrindo e atualizando chamados sozinha.</div>';
  $('app').innerHTML=h;
}

/* ===== porta unica do portal: sessao por usuario ===== */
const CDMMODS=['manutencao','manutencaosb'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch(SB+'rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t,p_tela:(new URLSearchParams(location.search).get('u')?'manutencaosb':'manutencao')})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
<script src="/assets/portal.js?v=3"></script>
</body>
</html>
