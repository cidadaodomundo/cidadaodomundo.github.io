<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH · Consulta por tipo · Cidadão do Mundo</title>
<style>
:root{--brand:#e6007e;--bg:#0b0e14;--surface:#141922;--surface2:#1b2230;--line:#242d3d;--text:#e8edf4;--muted:#8b95a5;
--serio:#e05252;--grave:#e8833a;--infra:#d4b43a;--verbal:#4a90d9;--conf:#6b7686;--sem:#37b46c;
--adv:#c0392b;--atest:#8e6bc9;--folga:#3aa6a0;--gold:#e8c547;--silver:#b8c2cc;--bronze:#c98d5a;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;padding:18px;max-width:1240px;margin:0 auto;font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--brand);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#8b1a5e);display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
h1{font-size:17px;font-weight:800}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sem);font-weight:700}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--sem);animation:pl 1.8s infinite}
@keyframes pl{50%{opacity:.25}}
.btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 14px;font-size:12.5px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--brand)}
.views{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;width:max-content;flex-wrap:wrap}
.view{border:none;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}
.view.active{background:var(--brand);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;border-left:4px solid var(--kc,var(--line))}
.kpi .n{font-size:23px;font-weight:800;color:var(--kc)}
.kpi .l{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s;border-left:4px solid var(--cc,var(--line))}
.card:hover{transform:translateY(-1px);border-color:var(--cc);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.mwrap{position:fixed;inset:0;background:rgba(4,6,10,.78);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 14px;overflow:auto;backdrop-filter:blur(3px)}
.mwrap.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:820px;width:100%;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:17px}
.mclose{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px;padding:14px 22px}
.mtl{padding:6px 22px 20px}
.mtl h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.trow{display:grid;grid-template-columns:105px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border:none}
.tdate{font-size:12px;font-weight:700;color:var(--muted)}
.tbadge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800;color:#fff;margin-right:7px}
.tdet{font-size:11px;color:#d3b544;margin-top:2px}
.loading{text-align:center;color:var(--muted);padding:60px 0}
.empty{text-align:center;color:var(--muted);padding:40px 0}
#gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center}
.gatebox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px;width:340px;text-align:center}
.gatebox input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;outline:none;margin:14px 0 10px;text-align:center}
.gatebox button{width:100%;background:var(--brand);border:none;color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
.gerr{color:#f85149;font-size:12px;min-height:16px;margin-top:8px}
.teste{background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;vertical-align:middle;margin-left:6px}
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:10px;margin-bottom:14px}
.tipo{display:flex;align-items:center;gap:11px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:12px;padding:12px 14px;color:var(--text);font-family:inherit;cursor:pointer;transition:.15s}
.tipo:hover{border-color:var(--tc)}
.tipo.active{background:var(--surface2);border-color:var(--tc);box-shadow:0 0 0 1px var(--tc) inset}
.tico{color:var(--tc);display:flex;flex:0 0 auto}
.tbody{display:flex;flex-direction:column;gap:5px;min-width:0}
.trot{font-size:12.5px;font-weight:700;color:var(--text)}
.tnums{display:flex;gap:12px}
.tn{display:flex;flex-direction:column;line-height:1.05}
.tn b{font-size:19px;font-weight:800;color:var(--tc)}
.tn i{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-top:2px}
.lhead{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin:0 0 9px 2px}
.lcnt{background:var(--surface2);border-radius:10px;padding:2px 8px;margin-left:6px;letter-spacing:0}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:38px 1fr auto 92px 22px;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;color:#fff}
.pnome{display:flex;flex-direction:column;min-width:0}
.pnome b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnome i{font-style:normal;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnum{font-size:25px;font-weight:800;line-height:1}
.pult{font-size:10px;color:var(--muted);text-align:right;line-height:1.5}
.pult b{font-size:12px;color:var(--text);font-weight:700}
.pseta{color:var(--muted);display:flex}
.tdesc{font-size:13px}
.tlink{color:var(--verbal);text-decoration:none;font-weight:600}
.tlink:hover{text-decoration:underline}
.nota{color:var(--muted);font-size:11.5px;line-height:1.7;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.mfoot{color:var(--muted);font-size:11px;line-height:1.6;padding:0 22px 20px;border-top:1px solid var(--line);margin:0 0 0;padding-top:12px}
@media(max-width:760px){.prow{grid-template-columns:34px 1fr auto 22px}.pult{display:none}.av{width:34px;height:34px}}
</style></head><body>
<div id="gate"><div class="gatebox">
  <div class="logo" style="margin:0 auto 12px">CM</div>
  <h1>RH · Consulta por tipo</h1>
  <div class="sub">Painel restrito — digite a senha</div>
  <input type="password" id="gpw" placeholder="Senha" onkeydown="if(event.key==='Enter')gateTry()">
  <button onclick="gateTry()">Entrar</button>
  <div class="gerr" id="gerr"></div>
</div></div>
<header>
  <div class="brand"><div class="logo">CM</div>
    <div><h1>RH · Consulta por tipo de ocorrência <span class="teste">página de teste</span></h1>
      <div class="sub" id="sub">carregando…</div></div>
  </div>
  <div class="hright">
    <div class="live"><span class="pulse"></span>ao vivo</div>
    <button class="btn" onclick="loadAll()">↻ Atualizar</button>
    <button class="btn" onclick="window.print()">🖨 Imprimir</button>
  </div>
</header>

<div class="tipos" id="tipos"></div>

<div class="toolbar">
  <div class="views" id="periodos">
    <button class="view active" data-p="30d" onclick="setPeriodo('30d')">30 dias</button>
    <button class="view" data-p="12m" onclick="setPeriodo('12m')">12 meses</button>
    <button class="view" data-p="tudo" onclick="setPeriodo('tudo')">Tudo</button>
  </div>
  <div class="views" id="lojas">
    <button class="view active" data-u="" onclick="setLoja('')">Todas as lojas</button>
    <button class="view" data-u="Água Verde" onclick="setLoja('Água Verde')">Água Verde</button>
    <button class="view" data-u="Ahú" onclick="setLoja('Ahú')">Ahú</button>
    <button class="view" data-u="São Braz" onclick="setLoja('São Braz')">São Braz</button>
  </div>
</div>

<div id="content"><div class="loading">Conectando…</div></div>

<div class="nota" id="nota"></div>

<div class="mwrap" id="mwrap" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mhead"><div><h2 id="mname">—</h2><div class="sub" id="msub"></div></div>
      <button class="mclose" onclick="closeModal()">×</button></div>
    <div class="mstats" id="mstats"></div>
    <div class="mtl"><h3>Histórico completo</h3><div id="mtl"></div></div>
    <div class="mfoot" id="mfoot"></div>
  </div>
</div>
<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const GATE_HASH='6db4bb52b559fe6100a9ce00ff3ad2e9153a28179ddfc2fb394496e7c0edef34';
const OWNER_HASH='d7149f187239f5d99c428c666fa476b7e7808f38226765d5c62ed0ec65e7eaee';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function gateTry(){const v=document.getElementById('gpw').value;
  const hv=await sha(v);
  if(hv===GATE_HASH||hv===OWNER_HASH){if(hv===OWNER_HASH)sessionStorage.setItem('cm_owner_ok','1');sessionStorage.setItem('cm_ok','1');document.getElementById('gate').style.display='none'}
  else document.getElementById('gerr').textContent='Senha incorreta.'}
if(sessionStorage.getItem('cm_ok')==='1'||sessionStorage.getItem('cm_owner_ok')==='1')document.getElementById('gate').style.display='none';

const $=id=>document.getElementById(id);
const SVG=d=>'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
const IC={
 FALTA:SVG('<path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M4 11h16"/><path d="M10 15l4 4"/><path d="M10 19l4 -4"/>'),
 ATESTADO:SVG('<path d="M8 8v-2a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v2"/><path d="M5 8h14a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-8a2 2 0 0 1 2 -2z"/><path d="M12 11v6"/><path d="M9 14h6"/>'),
 ADVERTENCIA:SVG('<path d="M12 9v4"/><path d="M10.36 3.59l-8.1 13.53a1.91 1.91 0 0 0 1.63 2.88h16.22a1.91 1.91 0 0 0 1.63 -2.88l-8.1 -13.53a1.91 1.91 0 0 0 -3.28 0z"/><path d="M12 16h.01"/>'),
 SUSPENSAO:SVG('<path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M5.7 5.7l12.6 12.6"/>'),
 BATIDA_FALTANDO:SVG('<path d="M20.98 12.53a9 9 0 1 0 -8.43 8.45"/><path d="M12 7v5l3 3"/><path d="M22 22l-5 -5"/><path d="M17 22l5 -5"/>'),
 HORA_EXTRA:SVG('<path d="M20.98 12.53a9 9 0 1 0 -8.43 8.45"/><path d="M12 7v5l3 3"/><path d="M16 19h6"/><path d="M19 16v6"/>'),
 INTERVALO:SVG('<path d="M6 5h11a3 3 0 0 1 0 6h-1"/><path d="M6 5v8a3 3 0 0 0 3 3h4a3 3 0 0 0 3 -3v-8"/><path d="M5 20h13"/>')
};
const TIPOS=[
 {k:'FALTA',           rot:'Faltas',          cor:'#E24B4A', tl:'Falta a confirmar', vazio:'Ninguém com falta a confirmar no período'},
 {k:'ATESTADO',        rot:'Atestados',       cor:'#378ADD', tl:'Atestado',          vazio:'Ninguém com atestado no período'},
 {k:'ADVERTENCIA',     rot:'Advertências',    cor:'#BA7517', tl:'Advertência',       vazio:'Ninguém com advertência no período'},
 {k:'SUSPENSAO',       rot:'Suspensões',      cor:'#A32D2D', tl:'Suspensão',         vazio:'Ninguém com suspensão no período'},
 {k:'BATIDA_FALTANDO', rot:'Batida faltando', cor:'#7F77DD', tl:'Batida faltando',   vazio:'Ninguém com batida faltando no período'},
 {k:'HORA_EXTRA',      rot:'Hora extra',      cor:'#1D9E75', tl:'Hora extra',        vazio:'Ninguém com hora extra no período'},
 {k:'INTERVALO',       rot:'Intervalo curto', cor:'#D4537E', tl:'Intervalo curto',   vazio:'Ninguém com intervalo curto no período'}
];
const T=k=>TIPOS.find(t=>t.k===k)||{rot:k,cor:'var(--muted)',tl:k};

let DADOS=[];
let TIPO=sessionStorage.getItem('cdm_rh_tipo')||'FALTA';
if(!TIPOS.some(t=>t.k===TIPO))TIPO='FALTA';
let PERIODO='30d', LOJA='';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dbr=d=>{if(!d)return '—';const p=String(d).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(d)};
const num=r=>PERIODO==='30d'?(r.em_30d||0):PERIODO==='12m'?(r.em_12m||0):(r.total||0);
const rotPeriodo=()=>PERIODO==='30d'?'nos últimos 30 dias':PERIODO==='12m'?'nos últimos 12 meses':'em todo o histórico';
const iniciais=n=>{const p=String(n||'').trim().split(/\s+/).filter(Boolean);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};

async function loadAll(){
  $('content').innerHTML='<div class="loading">Carregando…</div>';
  try{
    const u=SB+'vw_rh_por_categoria?select=funcionario_id,nome,unidade,cargo,categoria,total,em_30d,em_12m,ultima';
    const r=await fetch(u,{headers:H});
    if(!r.ok)throw new Error('HTTP '+r.status);
    DADOS=await r.json();
    $('sub').textContent='Consulta por tipo de ocorrência · só funcionários ativos';
    render();
  }catch(e){
    $('content').innerHTML='<div class="empty">Não foi possível carregar os dados. '+esc(e.message)+'</div>';
  }
}

const daLoja=()=>DADOS.filter(r=>!LOJA||r.unidade===LOJA);

function renderTipos(){
  const base=daLoja();
  $('tipos').innerHTML=TIPOS.map(t=>{
    const l=base.filter(r=>r.categoria===t.k);
    const a=l.reduce((s,r)=>s+(r.em_30d||0),0);
    const b=l.reduce((s,r)=>s+(r.em_12m||0),0);
    return '<button class="tipo'+(t.k===TIPO?' active':'')+'" style="--tc:'+t.cor+'" onclick="setTipo('+"'"+t.k+"'"+')">'
      +'<span class="tico">'+IC[t.k]+'</span>'
      +'<span class="tbody"><span class="trot">'+esc(t.rot)+'</span>'
      +'<span class="tnums"><span class="tn"><b>'+a+'</b><i>30d</i></span><span class="tn"><b>'+b+'</b><i>12m</i></span></span></span>'
      +'</button>';
  }).join('');
}

function render(){
  renderTipos();
  const t=T(TIPO);
  const lin=daLoja().filter(r=>r.categoria===TIPO&&num(r)>0)
    .sort((a,b)=>num(b)-num(a)||String(b.ultima||'').localeCompare(String(a.ultima||'')));
  const cab='<div class="lhead">'+esc(t.rot)+' · '+rotPeriodo()+(LOJA?' · '+esc(LOJA):'')
    +' <span class="lcnt">'+lin.length+' pessoa'+(lin.length===1?'':'s')+'</span></div>';
  if(!lin.length){
    $('content').innerHTML=cab+'<div class="empty">'+esc(t.vazio)+'.</div>';
  }else{
    $('content').innerHTML=cab+'<div class="plist">'+lin.map(r=>
      '<div class="card prow" style="--cc:'+t.cor+'" onclick="abrir('+r.funcionario_id+')">'
      +'<span class="av" style="background:'+t.cor+'">'+esc(iniciais(r.nome))+'</span>'
      +'<span class="pnome"><b>'+esc(r.nome)+'</b><i>'+esc(r.unidade||'—')+(r.cargo?' · '+esc(r.cargo):'')+'</i></span>'
      +'<span class="pnum" style="color:'+t.cor+'">'+num(r)+'</span>'
      +'<span class="pult">última<br><b>'+dbr(r.ultima)+'</b></span>'
      +'<span class="pseta">'+SVG('<path d="M9 6l6 6l-6 6"/>')+'</span>'
      +'</div>').join('')+'</div>';
  }
  $('nota').innerHTML='Falta aparece sempre como <b>a confirmar</b>: a gestora ainda vai responder se foi folga combinada. '
    +'Cargos de confiança não entram nas categorias de jornada (art. 62, II da CLT).';
}

function setTipo(k){TIPO=k;sessionStorage.setItem('cdm_rh_tipo',k);render()}
function setPeriodo(p){PERIODO=p;[...document.querySelectorAll('#periodos .view')].forEach(b=>b.classList.toggle('active',b.dataset.p===p));render()}
function setLoja(u){LOJA=u;[...document.querySelectorAll('#lojas .view')].forEach(b=>b.classList.toggle('active',b.dataset.u===u));render()}

async function abrir(id){
  const p=DADOS.find(r=>r.funcionario_id===id)||{};
  $('mname').textContent=p.nome||'—';
  $('msub').textContent=(p.unidade||'')+(p.cargo?' · '+p.cargo:'');
  $('mstats').innerHTML=TIPOS.map(t=>{
    const r=DADOS.find(x=>x.funcionario_id===id&&x.categoria===t.k);
    const v=r?(PERIODO==='30d'?r.em_30d:PERIODO==='12m'?r.em_12m:r.total)||0:0;
    return '<div class="kpi" style="--kc:'+t.cor+'"><div class="n">'+v+'</div><div class="l">'+esc(t.rot)+'</div></div>';
  }).join('');
  $('mtl').innerHTML='<div class="loading">Carregando histórico…</div>';
  $('mfoot').innerHTML='';
  $('mwrap').classList.add('open');
  try{
    const u=SB+'vw_rh_ocorrencia?funcionario_id=eq.'+encodeURIComponent(id)
      +'&select=data,categoria,detalhe,origem,documento_url,data_aproximada,fonte&order=data.desc';
    const r=await fetch(u,{headers:H});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const oc=await r.json();
    if(!oc.length){$('mtl').innerHTML='<div class="empty">Nenhuma ocorrência registrada.</div>';return}
    let temAprox=false;
    $('mtl').innerHTML=oc.map(o=>{
      const t=T(o.categoria);
      const ap=o.data_aproximada===true;
      if(ap)temAprox=true;
      const txt=esc(o.detalhe||t.tl);
      const det=o.documento_url
        ? '<a class="tlink" href="'+esc(o.documento_url)+'" target="_blank" rel="noopener">'+txt+' ↗</a>'
        : txt;
      return '<div class="trow"><div class="tdate">'+(ap?'~ ':'')+dbr(o.data)+'</div>'
        +'<div><span class="tbadge" style="background:'+t.cor+'">'+esc(t.tl)+'</span>'
        +'<span class="tdesc">'+det+'</span>'
        +(o.origem?'<div class="tdet">'+esc(o.origem)+(o.fonte?' · '+esc(o.fonte):'')+'</div>':'')
        +'</div></div>';
    }).join('');
    $('mfoot').innerHTML=(temAprox?'<b>~</b> a data marcada com til é a do <b>envio do documento</b>, não a data do atestado em si.<br>':'')
      +'Falta fica como <b>a confirmar</b> até a gestora responder se foi folga combinada.';
  }catch(e){
    $('mtl').innerHTML='<div class="empty">Não foi possível carregar o histórico. '+esc(e.message)+'</div>';
  }
}
function closeModal(){$('mwrap').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
loadAll();
</script><script src="/assets/portal.js?v=3"></script>
</body></html>
