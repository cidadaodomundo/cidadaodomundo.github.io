<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
async function escRPC(acao,dados){const t=(function(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}})();if(!t)throw new Error('Entre pelo portal para usar a escala.');const r=await fetch(SB+'rpc/escala_consulta',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({p_cred:t,p_acao:acao,p_dados:dados||{}})});const j=await r.json().catch(function(){return null});if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j}

  var j=null;try{j=await r.json()}catch(e){}

async function rfResolve(i){
  var f=RF.fila[i];
  var sel=document.getElementById('rfq_'+i);
  var fid=sel?sel.value:'';
  if(!f)return;
  if(!fid){rfMsg('rf_fmsg','Escolha a pessoa antes de ligar.',1);return}
  rfMsg('rf_fmsg','Ligando…');
  try{
    if(f.codigo!=null){
      await rfOp('resolver_dono',{tipo:'comanda',unidade:f.unidade,codigo:String(f.codigo),funcionario_id:fid});
    }else if(f.nome_digitado){
      await rfOp('resolver_dono',{tipo:'apelido',unidade:f.unidade,texto:f.nome_digitado,funcionario_id:fid,criado_por:rfNome()});
    }else{
      rfMsg('rf_fmsg','Esta linha não tem comanda nem nome digitado — não dá para ligar a ninguém.',1);return;
    }
    await rfCarregaFila();
    rfMsg('rf_fmsg','✅ Ligado.');
  }catch(e){rfMsg('rf_fmsg',e.message,1)}
}

    rfBox(h);
    rfCarregaClientes();
  }catch(e){rfErro(e)}
}

async function rfCarregaClientes(){
  var el=document.getElementById('rfcli');
  if(!el)return;
  try{
    var r=await Promise.all([
      rfOp('clientes_grupo',{de:rfAtras(30),ate:rfHoje()}),
      rfOp('clientes_candidatos',{de:rfAtras(30),ate:rfHoje()})
    ]);
    RF.cli=rfArr(r[0]);RF.cand=rfArr(r[1]);
    var h='<div class="rf-h2">Quem conta como motoboys <span class="hint">cliente cadastrado no Saipos</span></div><div class="rf-card">';
    if(!RF.cli.length){
      h+='<div class="rf-empty">Nenhum cliente marcado. Marque um da lista de baixo.</div>';
    }else{
      h+='<div class="rf-wrap"><table class="rf-tb"><tr><th>Cliente no Saipos</th><th>Grupo</th><th class="n">Refeições em 30 dias</th><th>Observação</th><th></th></tr>';
      RF.cli.forEach(function(c){
        h+='<tr><td>'+rfEsc(c.nome)+'</td><td><span class="rf-pill ok">'+rfEsc(c.grupo)+'</span></td>'+
           '<td class="n">'+rfNum(c.refeicoes)+'</td><td>'+rfEsc(c.obs||'—')+'</td>'+
           '<td class="n"><button class="rf-x" onclick="rfDelCliente('+c.id+')">✕</button></td></tr>';
      });
      h+='</table></div>';
    }
    h+='<div class="rf-msg" id="rf_gmsg"></div></div>';

    h+='<div class="rf-h2">Outros clientes que apareceram em refeição <span class="hint">30 dias · marque se for grupo</span></div><div class="rf-card">';
    if(!RF.cand.length){
      h+='<div class="rf-empty">Nenhum outro cliente com refeição no período.</div>';
    }else{
      h+='<div class="rf-wrap"><table class="rf-tb"><tr><th>Cliente</th><th class="n">Refeições</th><th class="n">Lojas</th><th>Período</th><th></th></tr>';
      RF.cand.forEach(function(c,i){
        h+='<tr><td>'+rfEsc(c.cliente)+'</td><td class="n">'+rfNum(c.refeicoes)+'</td>'+
           '<td class="n">'+rfNum(c.lojas)+'</td><td>'+rfBr(c.de)+'–'+rfBr(c.ate)+'</td>'+
           '<td class="n"><button class="rf-b" onclick="rfMarcaCliente('+i+')">é motoboys</button></td></tr>';
      });
      h+='</table></div>';
    }
    h+='<div class="rf-nota">"Consumidor não identificado" é venda sem cliente escolhido — não marque, senão a refeição de todo mundo vira motoboy.</div></div>';
    el.innerHTML=h;
  }catch(e){el.innerHTML='<div class="rf-empty">'+rfEsc(e.message)+'</div>'}
}

async function rfMarcaCliente(i){
  var c=RF.cand[i];
  if(!c)return;
  if(!confirm('Marcar "'+c.cliente+'" como motoboys? As refeições dele deixam de ser cobradas de uma pessoa.'))return;
  try{
    await rfOp('cliente_grupo_salvar',{nome:c.cliente,grupo:'motoboys',obs:'marcado na tela',criado_por:rfNome()});
    await rfCarregaMoto();
  }catch(e){alert(e.message)}
}

async function rfDelCliente(id){
  if(!confirm('Tirar este cliente do grupo motoboys?'))return;
  try{
    await rfOp('cliente_grupo_del',{id:String(id)});
    await rfCarregaMoto();
  }catch(e){alert(e.message)}
}

/* ---------- 4) comandas ---------- */
async function rfCarregaCart(){
  rfBox('<div class="rf-load">Carregando comandas…</div>');
  try{
    var r=await rfOp('cartoes',{unidade:RF.cartloja});
    RF.cart=rfArr(r.cartoes);RF.offset=rfArr(r.offset);RF.equipe=rfArr(r.equipe);
    var off=RF.offset.filter(function(o){return o.unidade===RF.cartloja})[0];

    var h='<div class="rf-h2">Comandas do Saipos <span class="hint">o número que cada um digita</span></div>';
    h+='<div class="rf-card"><div class="rf-form">'+
       '<div><label>Loja</label><select class="rf-sel" onchange="RF.cartloja=this.value;rfCarregaCart()">'+
       RFUNI.map(function(u){return '<option'+(u===RF.cartloja?' selected':'')+'>'+rfEsc(u)+'</option>'}).join('')+'</select></div>'+
       '<div><label>Offset desta loja</label><input class="rf-in" id="rf_off" type="number" value="'+(off&&off.offset_card!=null?off.offset_card:'')+'" placeholder="ainda não descoberto"></div>'+
       '<div style="display:flex;align-items:flex-end"><button class="rf-b" onclick="rfSalvaOffset()">Salvar offset</button></div>'+
       '</div><div class="rf-msg" id="rf_omsg"></div>'+
       '<div class="rf-nota">A API do Saipos <b>não devolve o nome nem o número da comanda</b> — só um id interno. O offset é a ponte: <b>número da comanda = id interno − offset</b>. Na Água Verde é 153714.</div>'+
       '<div class="rf-form" style="margin-top:10px">'+
       '<div><label>Descobrir o offset · id interno</label><input class="rf-in" id="rf_oid" type="number" placeholder="ex: 536779"></div>'+
       '<div><label>… é a comanda número</label><input class="rf-in" id="rf_ocod" type="number" placeholder="ex: 100"></div>'+
       '<div style="display:flex;align-items:flex-end"><button class="rf-b" onclick="rfDescobreOffset()">Calcular e salvar</button></div>'+
       '</div></div>';

    h+='<div class="rf-h2">Códigos de '+rfEsc(RF.cartloja)+' <span class="hint">'+rfNum(RF.cart.length)+' cadastrado(s)</span></div><div class="rf-card">';
    h+='<div class="rf-wrap"><table class="rf-tb"><tr><th class="n">Código</th><th>Nome na comanda</th><th>Pessoa do cadastro</th><th>Tipo</th><th>Ativo</th><th></th></tr>';
    if(!RF.cart.length){
      h+='<tr><td colspan="6"><div class="rf-empty">Nenhum código cadastrado nesta loja.</div></td></tr>';
    }else{
      RF.cart.forEach(function(c,i){
        h+='<tr><td class="n">'+c.codigo+'</td>'+
           '<td><input class="rf-in rfnome" data-i="'+i+'" value="'+rfEsc(c.nome||'')+'"></td>'+
           '<td>'+rfSelEquipe('rfc_'+i,c.funcionario_id)+'</td>'+
           '<td>'+rfSelTipo('rft_'+i,c.tipo)+'</td>'+
           '<td><input type="checkbox" id="rfa_'+i+'"'+(c.ativo?' checked':'')+'></td>'+
           '<td class="n"><button class="rf-x" onclick="rfApagaCart('+c.id+')">✕</button></td></tr>';
      });
    }
    h+='</table></div><div style="margin-top:12px"><button class="rf-b on" onclick="rfSalvaCart()">Salvar alterações</button> <span class="rf-msg" id="rf_cmsg"></span></div></div>';

    h+='<div class="rf-h2">Cadastrar um código novo</div><div class="rf-card"><div class="rf-form">'+
       '<div><label>Código</label><input class="rf-in" id="rf_ncod" type="number" placeholder="ex: 101"></div>'+
       '<div><label>Nome na comanda</label><input class="rf-in" id="rf_nnome" placeholder="COMO APARECE NO SAIPOS"></div>'+
       '<div><label>Pessoa do cadastro</label>'+rfSelEquipe('rf_nfunc',null)+'</div>'+
       '<div><label>Tipo</label>'+rfSelTipo('rf_ntipo','funcionario')+'</div>'+
       '</div><div style="margin-top:12px"><button class="rf-b on" onclick="rfNovoCart()">Cadastrar</button> <span class="rf-msg" id="rf_nmsg"></span></div></div>';

    var semLig=RF.cart.filter(function(c){return c.tipo==='funcionario'&&!c.funcionario_id}).length;
    if(semLig)h+='<div class="rf-aviso">'+rfNum(semLig)+' código(s) ainda não estão ligados a uma pessoa. Enquanto isso, a refeição dessas pessoas não cruza com o ponto.</div>';
    h+='<div id="rfsai"><div class="rf-load">Vendo o que o Saipos usou…</div></div>';
    rfBox(h);
    rfCarregaSaipos();
  }catch(e){rfErro(e)}
}

function rfSelEquipe(id,val){
  var s='<select class="rf-sel" id="'+id+'"><option value="">— não ligado —</option>';
  RF.equipe.forEach(function(f){s+='<option value="'+f.id+'"'+(String(val||'')===String(f.id)?' selected':'')+'>'+rfEsc(f.nome)+'</option>'});
  return s+'</select>';
}
function rfSelTipo(id,val){
  var T=['funcionario','motoboys','taxa','outro'];
  var s='<select class="rf-sel" id="'+id+'">';
  T.forEach(function(t){s+='<option'+(t===(val||'funcionario')?' selected':'')+'>'+t+'</option>'});
  return s+'</select>';
}

async function rfCarregaSaipos(){
  var el=document.getElementById('rfsai');
  if(!el)return;
  try{
    RF.saipos=rfArr(await rfOp('comandas_saipos',{unidade:RF.cartloja,de:rfAtras(30),ate:rfHoje()}));
    var h='<div class="rf-h2">O que o Saipos usou <span class="hint">30 dias · comandas que apareceram nas refeições</span></div><div class="rf-card">';
    if(!RF.saipos.length){
      h+='<div class="rf-empty">Nenhuma refeição de funcionário veio do Saipos nesta loja nos últimos 30 dias.</div>';
    }else{
      var faltam=RF.saipos.filter(function(l){return l.codigo!=null&&!l.ja_cadastrado}).length;
      var semCod=RF.saipos.filter(function(l){return l.codigo==null}).length;
      h+='<div class="rf-wrap"><table class="rf-tb"><tr><th class="n">Id interno</th><th class="n">Comanda</th><th class="n">Refeições</th><th>Nome digitado na venda</th><th>Cadastro</th></tr>';
      RF.saipos.forEach(function(l){
        h+='<tr><td class="n">'+(l.id_card==null?'—':l.id_card)+'</td>'+
           '<td class="n">'+(l.codigo==null?'—':l.codigo)+'</td>'+
           '<td class="n">'+rfNum(l.refeicoes)+'</td>'+
           '<td>'+rfEsc(l.nomes_digitados||'—')+'</td>'+
           '<td>'+(l.ja_cadastrado?'<span class="rf-pill ok">'+rfEsc(l.ja_cadastrado)+'</span>':
                   (l.codigo==null?'<span class="rf-pill mute">sem comanda</span>':'<span class="rf-pill warn">não cadastrada</span>'))+'</td></tr>';
      });
      h+='</table></div><div style="margin-top:12px"><button class="rf-b on" onclick="rfImporta()">Trazer do Saipos as que faltam'+(faltam?' ('+faltam+')':'')+'</button> <span class="rf-msg" id="rf_smsg"></span></div>';
      if(semCod)h+='<div class="rf-aviso">'+rfNum(semCod)+' linha(s) sem comanda nenhuma — refeição lançada fora do salão (balcão ou ficha). Essas não têm como ser ligadas a uma pessoa.</div>';
    }
    h+='</div>';
    el.innerHTML=h;
  }catch(e){el.innerHTML='<div class="rf-empty">'+rfEsc(e.message)+'</div>'}
}

async function rfImporta(){
  rfMsg('rf_smsg','Trazendo…');
  try{
    var r=await rfOp('importar_comandas',{unidade:RF.cartloja,de:rfAtras(30),ate:rfHoje()});
    await rfCarregaCart();
    rfMsg('rf_smsg','✅ '+rfNum(r.novos)+' comanda(s) cadastrada(s).');
  }catch(e){rfMsg('rf_smsg',e.message,1)}
}

async function rfSalvaCart(){
  var linhas=[];
  RF.cart.forEach(function(c,i){
    var el=document.querySelector('.rfnome[data-i="'+i+'"]');
    var sf=document.getElementById('rfc_'+i), st=document.getElementById('rft_'+i), sa=document.getElementById('rfa_'+i);
    linhas.push({unidade:RF.cartloja,codigo:String(c.codigo),nome:(el?el.value:c.nome)||c.nome,
      funcionario_id:sf?sf.value:'',tipo:st?st.value:'funcionario',ativo:sa?sa.checked:true});
  });
  if(!linhas.length){rfMsg('rf_cmsg','Nada para salvar.',1);return}
  rfMsg('rf_cmsg','Salvando…');
  try{
    var r=await rfOp('cartao_salvar',{unidade:RF.cartloja,linhas:linhas});
    await rfCarregaCart();
    rfMsg('rf_cmsg','✅ '+rfNum(r.gravados)+' código(s) salvos.');
  }catch(e){rfMsg('rf_cmsg',e.message,1)}
}

async function rfNovoCart(){
  var cod=document.getElementById('rf_ncod').value;
  if(!cod){rfMsg('rf_nmsg','Digite o código.',1);return}
  rfMsg('rf_nmsg','Salvando…');
  try{
    await rfOp('cartao_salvar',{unidade:RF.cartloja,linhas:[{unidade:RF.cartloja,codigo:String(cod),
      nome:document.getElementById('rf_nnome').value,
      funcionario_id:document.getElementById('rf_nfunc').value||'',
      tipo:document.getElementById('rf_ntipo').value,ativo:true}]});
    await rfCarregaCart();
    rfMsg('rf_nmsg','✅ Cadastrado.');
  }catch(e){rfMsg('rf_nmsg',e.message,1)}
}

async function rfApagaCart(id){
  if(!confirm('Apagar este código?'))return;
  try{await rfOp('cartao_del',{id:String(id)});await rfCarregaCart()}
  catch(e){alert(e.message)}
}

async function rfSalvaOffset(){
  var v=document.getElementById('rf_off').value;
  if(!v){rfMsg('rf_omsg','Digite o offset.',1);return}
  rfMsg('rf_omsg','Salvando…');
  try{await rfOp('offset_salvar',{unidade:RF.cartloja,offset_card:String(v)});await rfCarregaCart();rfMsg('rf_omsg','✅ Offset salvo.')}
  catch(e){rfMsg('rf_omsg',e.message,1)}
}

async function rfDescobreOffset(){
  var id=document.getElementById('rf_oid').value, cod=document.getElementById('rf_ocod').value;
  if(!id||!cod){rfMsg('rf_omsg','Preencha o id interno e o número da comanda.',1);return}
  rfMsg('rf_omsg','Calculando…');
  try{
    var r=await rfOp('descobrir_offset',{unidade:RF.cartloja,id_card:String(id),codigo:String(cod)});
    await rfCarregaCart();
    rfMsg('rf_omsg','✅ Offset desta loja: '+r.offset);
  }catch(e){rfMsg('rf_omsg',e.message,1)}
}

async function rfVisitante(i){
  var f=RF.fila[i];
  if(!f)return;
  var quem=f.nome_digitado||f.nome_cartao||'';
  if(!quem){rfMsg('rf_fmsg','Esta linha não tem nome digitado — não dá para marcar como visitante. Ligue a comanda a alguém ou corrija no Saipos.',1);return}
  var tipo=prompt('Quem é? Escreva o que essa pessoa é para a loja.\n\nexemplos: nutricionista, eletricista, contador, visita, cortesia','visitante');
  if(tipo===null)return;
  rfMsg('rf_fmsg','Marcando…');
  try{
    await rfOp('resolver_dono',{tipo:'visitante',unidade:f.unidade,texto:quem,
      grupo:(tipo||'visitante').trim().toLowerCase(),criado_por:rfNome()});
    await rfCarregaFila();
    rfMsg('rf_fmsg','✅ "'+quem+'" marcado como '+((tipo||'visitante').trim().toLowerCase())+'. Some da fila e não conta como refeição de funcionário.');
  }catch(e){rfMsg('rf_fmsg',e.message,1)}
}

function rfNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()}

async function rfPintaRefeicao(dia){
  if(!dia)return;
  try{
    var l=rfArr(await rfOp('nao_pegou',{dia:dia}));
    if(!l.length)return;
    var mapa={};
    l.forEach(function(x){mapa[rfNorm(x.nome)]=x});
    var cards=document.querySelectorAll('#content .card[data-nome]');
    for(var i=0;i<cards.length;i++){
      var el=cards[i];
      var x=mapa[rfNorm(el.getAttribute('data-nome'))];
      if(!x)continue;
      if(el.querySelector('.rf-semref'))continue;
      var d=document.createElement('div');
      d.className='det rf-semref';
      d.style.cssText='color:var(--grave);font-weight:700;border-left:3px solid var(--grave);padding-left:8px;margin-top:6px';
      d.textContent = (x.situacao==='SEM CARTAO')
        ? '🍽 Não pegou refeição — e não tem comanda cadastrada'
        : '🍽 Não pegou refeição — trabalhou '+(x.horas==null?'—':x.horas)+'h e não lançou';
      el.appendChild(d);
    }
  }catch(e){}
}
