<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Escala do Mês · Cidadão do Mundo</title>
<style>
:root{--s0:#111110;--s1:#1a1a19;--s2:#232321;--line:#34332f;--text:#fff;--text2:#c3c2b7;--muted:#8a897e;--brand:#c8102e;--ok:#2fae6a;--bad:#e66767;--warn:#c98500;--gold:#e8c547}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;padding:18px;max-width:1180px;margin:0 auto}
h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top .rt{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
button.b.on{background:var(--brand);border-color:var(--brand)}
select.b{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600}
h2{font-size:15px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .hint{font-weight:500;font-size:11.5px;color:var(--muted)}
.sec{margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.c{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:16px}
.c .nm{font-weight:800;font-size:14.5px;margin-bottom:8px}
.c .nota{font-size:30px;font-weight:800;line-height:1}
.c .qtd{color:var(--muted);font-size:12px;margin-top:3px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.p-ok{background:rgba(47,174,106,.15);color:var(--ok)}
.p-warn{background:rgba(201,133,0,.15);color:var(--warn)}
.p-bad{background:rgba(230,103,103,.15);color:var(--bad)}
.p-off{background:rgba(138,137,126,.15);color:var(--muted)}
.store{background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.aviso{background:#1f1c14;border:1px solid #4a3f22;color:#e6d9a8;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:14px}
.semdado{background:var(--s2);border:1px dashed var(--line);color:var(--muted);border-radius:10px;padding:14px;font-size:12.5px}
.load{color:var(--muted);padding:30px;text-align:center}
.dot{width:40px;height:40px;border-radius:11px;background:var(--brand);display:grid;place-items:center;font-weight:800;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{color:var(--muted);font-size:10.5px;text-transform:uppercase;text-align:center;font-weight:700;padding:4px 0}
.cal .d{background:var(--s1);border:1px solid var(--line);border-radius:9px;min-height:72px;padding:6px 7px;font-size:11px}
.cal .d.off{opacity:.25}
.cal .d .num{font-weight:800;font-size:13px;margin-bottom:3px}
.cal .d.dom{border-color:#5a4a1f}
.cal .d .fr{color:var(--warn);font-weight:700}
.cal .d .fp{color:var(--text2)}
.rasc{background:rgba(201,133,0,.12);border:1px solid #4a3f22;color:var(--gold);border-radius:999px;padding:3px 12px;font-size:11.5px;font-weight:800}

.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dias{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dias button{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.dias button.on{background:var(--gold);border-color:var(--gold);color:#111}
.bloco{background:var(--s1);border:1px solid var(--line);border-radius:13px;margin-bottom:14px;overflow:hidden}
.bloco .cab{padding:9px 14px;font-weight:800;font-size:12px;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.bloco.dia .cab{background:rgba(232,197,71,.13);color:var(--gold)}
.bloco.noite .cab{background:rgba(0,112,192,.18);color:#8fc3f0}
.gs{width:100%;border-collapse:collapse}
.gs th{font-size:10px}
.gs td{padding:4px 6px;border-bottom:1px solid var(--line);font-size:12.5px}
.gs input{width:100%;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--text);font:inherit;font-size:12.5px;padding:5px 6px}
.gs input:hover{border-color:var(--line)}
.gs input:focus{outline:none;border-color:var(--brand);background:var(--s2)}
.gs input.t{text-align:center;font-variant-numeric:tabular-nums}
.gs select{background:var(--s2);border:1px solid var(--line);color:var(--text);border-radius:7px;font-size:11.5px;padding:4px 6px}
.gs td.carga{text-align:right;font-variant-numeric:tabular-nums;color:var(--text2);white-space:nowrap}
tr.m-FOLGA td{background:rgba(255,0,0,.20)}
tr.m-TAXA td{background:rgba(255,255,0,.15)}
tr.m-JA_FOLGOU td{background:rgba(146,208,80,.18)}
tr.m-FERIAS td{background:rgba(112,48,160,.28)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:6px 0 16px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.sv{background:var(--ok);border:1px solid var(--ok);color:#04210f;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer}
.msg{font-size:12.5px;color:var(--muted)}
.mini{background:var(--s2);border:1px solid var(--line);color:var(--text2);border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer}

.dias button.dom{border-color:#5a4a1f}
.dias button.dom.on{background:var(--gold);border-color:var(--gold);color:#111}
.mini.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grp{display:inline-flex;gap:4px}
</style>
</head>
<body>

<div class="top">
  <div style="display:flex;gap:10px;align-items:center"><div class="dot">CM</div><div><h1>📅 Escala do Mês</h1><div class="sub">Água Verde · gerador de rascunho — nada é gravado nem enviado</div></div></div>
  <div class="rt">
    <span class="rasc">RASCUNHO</span>
    <span id="ctlMes"><select class="b" id="selMes"></select>
    <button class="b on" onclick="gerar()">Gerar escala do mês</button></span>
  </div>
</div>
<div class="tabs"><button id="abaDom" class="on" onclick="aba('dom')">Domingos e freelancers</button><button id="abaSem" onclick="aba('sem')">Semana dia a dia</button></div>
<div id="app"><div class="load">Escolha o mês e clique em Gerar.</div></div>
<div id="semana" style="display:none"></div>

<script>
const SB='https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/';
const KEY='sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const $=i=>document.getElementById(i);
const UNIDADE='Água Verde';
const DIAS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dBR=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'—';
const pNome=n=>{const p=String(n||'').split(' ');return p.length>1?p[0]+' '+p[1][0]+'.':p[0]};

async function pega(url){
  try{const r=await fetch(SB+url,{headers:H});return r.ok?await r.json():[];}
  catch(e){return [];}
}

let EQ=[],COB=[],HISTD=[];

function folgaDow(f){
  const t=String(f||'').toLowerCase();
  if(t.startsWith('domingo'))return 0;
  const m={'segunda':1,'terça':2,'terca':2,'quarta':3,'quinta':4,'sexta':5,'sábado':6,'sabado':6};
  for(const k in m){if(t.startsWith(k))return m[k];}
  return null;
}

async function boot(){
  const hoje=new Date();
  const sel=$('selMes');let h='';
  for(let i=0;i<4;i++){
    const d=new Date(hoje.getFullYear(),hoje.getMonth()+i,1);
    const v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const n=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    h+='<option value="'+v+'"'+(i===1?' selected':'')+'>'+esc(n)+'</option>';
  }
  sel.innerHTML=h;
  const d90=new Date(Date.now()-90*864e5).toISOString().slice(0,10);
  const [eq,cob,hist]=await Promise.all([
    pega('dim_funcionario?select=nome,setor,folgas,noturno,entrada&unidade=eq.'+encodeURIComponent(UNIDADE)+'&ativo=is.true&order=setor,nome&limit=100'),
    pega('escala_cobertura_min?select=setor,turno,dia_semana,funcao,minimo&unidade=eq.'+encodeURIComponent(UNIDADE)+'&limit=100'),
    pega('fato_escala_posicao?select=data,nome,turno&unidade=eq.'+encodeURIComponent(UNIDADE)+'&posicao=eq.FOLGA&data=gte.'+d90+'&order=data&limit=400')
  ]);
  EQ=eq;COB=cob;HISTD=hist.filter(r=>new Date(r.data+'T12:00:00').getDay()===0);
  if(!EQ.length){$('app').innerHTML='<div class="semdado">Não consegui ler a equipe. Confira a conexão e recarregue.</div>';return;}
  gerar();
}

function gerar(){
  const [ano,mes]=$('selMes').value.split('-').map(Number);
  const nDias=new Date(ano,mes,0).getDate();
  const doms=[];for(let d=1;d<=nDias;d++){if(new Date(ano,mes-1,d).getDay()===0)doms.push(d);}

  const eleg=EQ.filter(p=>String(p.folgas||'').includes('1 domingo'));
  const fixosDom=EQ.filter(p=>folgaDow(p.folgas)===0);

  const ult={};HISTD.forEach(r=>{if(!ult[r.nome]||r.data>ult[r.nome])ult[r.nome]=r.data;});
  const fila=eleg.slice().sort((a,b)=>String(ult[a.nome]||'0000').localeCompare(String(ult[b.nome]||'0000')));
  const porDom={};doms.forEach(d=>porDom[d]=[]);
  fila.forEach((p,i)=>{porDom[doms[i%doms.length]].push(p);});

  const turnoDe=p=>p.noturno?'Noite':'Dia';
  const fixosPorST={};
  EQ.forEach(p=>{const k=p.setor+'|'+turnoDe(p);fixosPorST[k]=(fixosPorST[k]||0)+1;});

  const precisa=(setor,turno,dow)=>{
    let t=0;COB.forEach(c=>{if(c.setor===setor&&c.turno===turno&&(c.dia_semana===-1||c.dia_semana===dow))t+=c.minimo;});
    return t;
  };
  const setoresCob=[...new Set(COB.map(c=>c.setor))];

  let totalFree=0,posDesc=0;const linhasDia=[];const freePorDia={};
  for(let d=1;d<=nDias;d++){
    const dow=new Date(ano,mes-1,d).getDay();
    let freeDia=0;const det=[];
    setoresCob.forEach(setor=>{['Dia','Noite'].forEach(turno=>{
      const need=precisa(setor,turno,dow);if(!need)return;
      let pres=0;
      EQ.forEach(p=>{
        if(p.setor!==setor||turnoDe(p)!==turno)return;
        if(folgaDow(p.folgas)===dow)return;
        if(dow===0&&(porDom[d]||[]).some(x=>x.nome===p.nome))return;
        pres++;
      });
      const falta=Math.max(need-pres,0);
      if(falta>0){freeDia+=falta;det.push(setor+' '+turno.toLowerCase()+': '+falta);}
    });});
    totalFree+=freeDia;if(freeDia>0)posDesc++;
    freePorDia[d]=freeDia;
    linhasDia.push({d,dow,freeDia,det});
  }

  const semDomingo=eleg.filter(p=>!doms.some(d=>(porDom[d]||[]).some(x=>x.nome===p.nome)));

  let h='';
  h+='<div class="sec"><h2>Resumo de '+esc($('selMes').selectedOptions[0].text)+' <span class="hint">rascunho — confira e ajuste na planilha ou aprove</span></h2><div class="cards">';
  h+='<div class="c"><div class="nm">Dias no mês</div><div class="nota">'+nDias+'</div><div class="qtd">'+doms.length+' domingos</div></div>';
  h+='<div class="c"><div class="nm">Equipe ativa</div><div class="nota">'+EQ.length+'</div><div class="qtd">'+eleg.length+' no revezamento de domingo · '+fixosDom.length+' folgam todo domingo</div></div>';
  h+='<div class="c"><div class="nm">Diárias de freelancer</div><div class="nota">'+totalFree+'</div><div class="qtd">'+posDesc+' dias com posto a cobrir</div></div>';
  h+='<div class="c"><div class="nm">Domingo de todos?</div><div class="nota">'+(semDomingo.length?'<span style="color:var(--bad)">não</span>':'<span style="color:var(--ok)">sim</span>')+'</div><div class="qtd">'+(semDomingo.length? semDomingo.map(p=>esc(pNome(p.nome))).join(', ')+' sem domingo':'todos os elegíveis receberam 1 domingo')+'</div></div>';
  h+='</div></div>';

  h+='<div class="sec"><h2>Folgas de domingo <span class="hint">fila justa: quem folgou por último vai para o fim (histórico de 90 dias)</span></h2><div class="store"><table><thead><tr><th>Domingo</th><th>Quem folga</th><th class="n">Freelancers no dia</th></tr></thead><tbody>';
  doms.forEach(d=>{
    const quem=(porDom[d]||[]).map(p=>esc(pNome(p.nome))+' <span class="pill p-off">'+esc(p.setor)+' '+turnoDe(p).toLowerCase()+'</span>'+(ult[p.nome]?' <span class="hint">folgou '+dBR(ult[p.nome])+'</span>':' <span class="hint">nunca no histórico</span>')).join('<br>');
    h+='<tr><td><b>'+String(d).padStart(2,'0')+'/'+String(mes).padStart(2,'0')+'</b></td><td>'+(quem||'—')+'</td><td class="n">'+(freePorDia[d]||0)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  h+='<div class="sec"><h2>Calendário do mês <span class="hint">FR = freelancers a chamar · nomes = folga de domingo</span></h2><div class="cal">';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(x=>h+='<div class="hd">'+x+'</div>');
  const pri=new Date(ano,mes-1,1).getDay();
  for(let i=0;i<pri;i++)h+='<div class="d off"></div>';
  for(let d=1;d<=nDias;d++){
    const dow=new Date(ano,mes-1,d).getDay();
    let inner='<div class="num">'+d+'</div>';
    if(freePorDia[d]>0)inner+='<div class="fr">'+freePorDia[d]+' freelancer'+(freePorDia[d]>1?'s':'')+'</div>';
    if(dow===0)inner+='<div class="fp">'+(porDom[d]||[]).map(p=>esc(pNome(p.nome))).join('<br>')+'</div>';
    h+='<div class="d'+(dow===0?' dom':'')+'">'+inner+'</div>';
  }
  h+='</div></div>';

  h+='<div class="sec"><h2>Postos a cobrir, dia a dia <span class="hint">só os dias em que a equipe fixa não fecha a conta</span></h2><div class="store"><table><thead><tr><th>Dia</th><th>Semana</th><th>Onde falta</th><th class="n">Freelancers</th></tr></thead><tbody>';
  const comFalta=linhasDia.filter(l=>l.freeDia>0);
  if(!comFalta.length)h+='<tr><td colspan="4">Nenhum. A equipe fixa cobre o mês inteiro.</td></tr>';
  comFalta.forEach(l=>{h+='<tr><td><b>'+String(l.d).padStart(2,'0')+'/'+String(mes).padStart(2,'0')+'</b></td><td>'+DIAS[l.dow]+'</td><td>'+esc(l.det.join(' · '))+'</td><td class="n">'+l.freeDia+'</td></tr>';});
  h+='</tbody></table></div></div>';

  h+='<div class="sec"><h2>Folgas semanais da equipe</h2><div class="store"><table><thead><tr><th>Nome</th><th>Setor</th><th>Turno</th><th>Folga</th></tr></thead><tbody>';
  EQ.forEach(p=>{h+='<tr><td>'+esc(pNome(p.nome))+(p.entrada==null?' <span class="pill p-off">gerência</span>':'')+'</td><td>'+esc(p.setor||'—')+'</td><td>'+turnoDe(p)+'</td><td>'+esc(p.folgas||'—')+'</td></tr>';});
  h+='</tbody></table></div></div>';

  h+='<div class="aviso">⚠️ Isto é um <b>rascunho gerado na hora</b> — nada foi gravado, publicado ou enviado a ninguém. A cobertura mínima vale para Delivery e Salão; os outros setores ainda não têm régua. Férias e atestados ainda não entram nesta conta. A distribuição dos domingos usa a fila justa do histórico, não a força prevista de cada domingo.</div>';

  $('app').innerHTML=h;
}

/* ===== aba: semana dia a dia (26/08) ===== */
const DIASEM=[[1,'Segunda'],[2,'Terça'],[3,'Quarta'],[4,'Quinta'],[5,'Sexta'],[6,'Sábado']];
const MARCAS=[['','— na escala'],['FOLGA','FOLGA'],['TAXA','TAXA'],['JA_FOLGOU','JÁ FOLGOU'],['FERIAS','FÉRIAS']];
const ORDSET={'Produção':10,'Estoque':15,'Cozinha':20,'Delivery':30,'Salão':40,'Limpeza':50,'Escritório':60};
const SETORES=['Produção','Estoque','Cozinha','Delivery','Salão','Limpeza','Escritório'];
let SEM=[],EQUIPE=[],TAXAS=[],DIASEL=1,DATASEL=null,FILTRO='tudo',PAINEL='',KSEQ=0,CARREGOU=false;

async function rpcEsc(acao,dados){
  const r=await fetch(SB+'rpc/escala_semana_consulta',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_cred:cdmTok(),p_acao:acao,p_dados:dados||{}})});
  if(!r.ok)throw new Error('rpc '+r.status);
  return await r.json();
}
function numera(){KSEQ=0;SEM.forEach(function(l){l._k=++KSEQ;});}
function acha(k){return SEM.filter(function(l){return l._k===k})[0];}
function hm(t){return t?String(t).slice(0,5):''}
function dBRc(s){return s?String(s).slice(0,10).split('-').reverse().slice(0,2).join('/'):''}
function emMin(t){if(!t)return null;const p=String(t).split(':');return (+p[0])*60+(+p[1]);}
function cargaTxt(l){
  const e=emMin(l.entrada),s=emMin(l.saida);
  if(e==null||s==null)return '—';
  let d=s-e;if(d<0)d+=1440;
  let iv=0;const a=emMin(l.int_ini),b=emMin(l.int_fim);
  if(a!=null&&b!=null){iv=b-a;if(iv<0)iv+=1440;}
  else if(l.intervalo_min)iv=+l.intervalo_min;
  d-=iv;if(d<0)d=0;
  return String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0');
}
function semHorario(l){return !l.entrada&&!l.saida;}
function nomeDia(d){for(let i=0;i<DIASEM.length;i++){if(DIASEM[i][0]===d)return DIASEM[i][1];}return 'Domingo';}
function rotulo(){return DATASEL?('Domingo '+dBRc(DATASEL)):nomeDia(DIASEL);}
function domingos(){
  const s=[];
  SEM.forEach(function(l){if(l.data&&s.indexOf(l.data)<0)s.push(l.data);});
  s.sort();return s;
}
function linhasDoDia(){
  return SEM.filter(function(l){
    if(DATASEL)return l.data===DATASEL;
    return !l.data&&+l.dia_semana===DIASEL;
  }).filter(function(l){return FILTRO==='tudo'||l.turno===FILTRO});
}
function linhasGravar(){
  return SEM.filter(function(l){
    if(DATASEL)return l.data===DATASEL;
    return !l.data&&+l.dia_semana===DIASEL;
  });
}

function marcaSujo(){const m=$('msgSem');if(m){m.textContent='há mudanças ainda não salvas';m.style.color='var(--warn)';}}
function setC(k,c,v){const l=acha(k);if(!l)return;l[c]=v;marcaSujo();}
function setH(k,c,v){
  const l=acha(k);if(!l)return;
  if(v==='')l[c]=null;
  else if(/^\d{1,2}:\d{2}$/.test(v))l[c]=(v.length===4?'0':'')+v;
  else{marcaSujo();return;}
  const el=$('cg'+k);if(el)el.textContent=cargaTxt(l);
  marcaSujo();
}
function setMarca(k,v){const l=acha(k);if(!l)return;l.marcacao=v||null;const tr=$('lin'+k);if(tr)tr.className='m-'+(v||'');marcaSujo();}
function tiraLinha(k){SEM=SEM.filter(function(l){return l._k!==k});marcaSujo();pintaSemana();}
function novaLinha(t,s){
  SEM.push({_k:++KSEQ,dia_semana:DATASEL?0:DIASEL,data:DATASEL,turno:t,setor:s,funcao:'Taxa',nome:'',
            entrada:null,int_ini:null,int_fim:null,saida:null,intervalo_min:null,marcacao:'TAXA',ordem:100});
  marcaSujo();pintaSemana();
}
function trocaDia(d){DIASEL=d;DATASEL=null;PAINEL='';pintaSemana();}
function trocaDom(dt){DATASEL=dt;DIASEL=0;PAINEL='';pintaSemana();}
function trocaFiltro(f){FILTRO=f;pintaSemana();}
function abrePainel(p){PAINEL=(PAINEL===p?'':p);pintaSemana();}

function addFunc(id){
  if(!id)return;
  const p=EQUIPE.filter(function(e){return String(e.id)===String(id)})[0];
  if(!p)return;
  SEM.push({_k:++KSEQ,dia_semana:DATASEL?0:DIASEL,data:DATASEL,
            turno:p.noturno?'Noite':'Dia',setor:p.setor||'Sem setor',funcao:p.cargo||'',
            funcionario_id:p.id,nome:p.nome,entrada:p.entrada,int_ini:null,int_fim:null,
            saida:p.saida,intervalo_min:p.intervalo_min,marcacao:null,
            ordem:(ORDSET[p.setor]||90)});
  marcaSujo();pintaSemana();
}

function linhaHTML(l){
  const k=l._k;
  let h='<tr class="m-'+(l.marcacao||'')+'" id="lin'+k+'">';
  h+='<td><input value="'+esc(l.funcao||'')+'" placeholder="função" oninput="setC('+k+',&quot;funcao&quot;,this.value)"></td>';
  h+='<td><input value="'+esc(l.nome||'')+'" placeholder="nome" oninput="setC('+k+',&quot;nome&quot;,this.value)"></td>';
  h+='<td><input class="t" style="width:70px" value="'+hm(l.entrada)+'" placeholder="--:--" oninput="setH('+k+',&quot;entrada&quot;,this.value)"></td>';
  if(semHorario(l))h+='<td style="color:var(--muted);font-size:11.5px">sem jornada de horário</td>';
  else h+='<td style="white-space:nowrap"><input class="t" style="width:62px;display:inline-block" value="'+hm(l.int_ini)+'" placeholder="--:--" oninput="setH('+k+',&quot;int_ini&quot;,this.value)"> <input class="t" style="width:62px;display:inline-block" value="'+hm(l.int_fim)+'" placeholder="--:--" oninput="setH('+k+',&quot;int_fim&quot;,this.value)"></td>';
  h+='<td><input class="t" style="width:70px" value="'+hm(l.saida)+'" placeholder="--:--" oninput="setH('+k+',&quot;saida&quot;,this.value)"></td>';
  h+='<td class="carga" id="cg'+k+'">'+cargaTxt(l)+'</td>';
  h+='<td><select onchange="setMarca('+k+',this.value)">';
  MARCAS.forEach(function(m){h+='<option value="'+m[0]+'"'+((l.marcacao||'')===m[0]?' selected':'')+'>'+m[1]+'</option>';});
  h+='</select></td>';
  h+='<td><button class="mini" title="tirar esta linha" onclick="tiraLinha('+k+')">✕</button></td>';
  h+='</tr>';
  return h;
}

function painelFolgas(){
  let h='<div class="sec"><h2>Folga semanal da equipe <span class="hint">vem do cadastro de cada pessoa</span></h2>';
  h+='<div class="store"><table><thead><tr><th>Nome</th><th>Setor</th><th>Turno</th><th>Folga</th></tr></thead><tbody>';
  EQUIPE.forEach(function(p){
    h+='<tr><td>'+esc(pNome(p.nome))+(p.entrada==null?' <span class="pill p-off">sem horário</span>':'')+'</td>';
    h+='<td>'+esc(p.setor||'—')+'</td><td>'+(p.noturno?'Noite':'Dia')+'</td><td>'+esc(p.folgas||'—')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}

function setTaxa(i,c,v){if(TAXAS[i]){TAXAS[i][c]=v;TAXAS[i]._mudou=true;}
  const m=$('msgTaxa');if(m){m.textContent='há mudanças ainda não salvas';m.style.color='var(--warn)';}}
function novaTaxa(s){TAXAS.push({id:null,apelido:'',nome_completo:'',telefone:'',setor:s,turno:'',obs:'',_novo:true});pintaSemana();}
async function salvaTaxas(){
  const m=$('msgTaxa');if(m){m.textContent='salvando…';m.style.color='var(--muted)';}
  const linhas=TAXAS.filter(function(t){return t.id&&t._mudou}).map(function(t){
    return {id:t.id,apelido:t.apelido,nome_completo:t.nome_completo,telefone:t.telefone,setor:t.setor,turno:t.turno,obs:t.obs};});
  const novos=TAXAS.filter(function(t){return !t.id&&t.apelido}).map(function(t){
    return {apelido:t.apelido,nome_completo:t.nome_completo,telefone:t.telefone,setor:t.setor,turno:t.turno,obs:t.obs};});
  try{
    await rpcEsc('taxas_salvar',{unidade:UNIDADE,linhas:linhas,novos:novos});
    TAXAS=await rpcEsc('taxas_ler',{unidade:UNIDADE});
    pintaSemana();
    const m2=$('msgTaxa');if(m2){m2.textContent='salvo · '+(linhas.length+novos.length)+' fichas';m2.style.color='var(--ok)';}
  }catch(e){const m3=$('msgTaxa');if(m3){m3.textContent='não consegui salvar — tente de novo';m3.style.color='var(--bad)';}}
}
function painelTaxas(){
  let h='<div class="sec"><h2>Taxas · quem chamar <span class="hint">separado por setor · nome e telefone</span></h2>';
  h+='<div class="barra"><button class="sv" onclick="salvaTaxas()">Salvar as taxas</button>';
  h+='<span class="msg" id="msgTaxa">telefone fica guardado fechado, só quem entra no portal enxerga</span></div>';
  const grupos=SETORES.slice();
  grupos.push('Sem setor');
  grupos.forEach(function(s){
    const ls=[];
    TAXAS.forEach(function(t,i){
      const st=t.setor||'Sem setor';
      if(st===s)ls.push(i);
    });
    if(!ls.length&&s==='Sem setor')return;
    h+='<div class="bloco dia"><div class="cab">'+esc(s)+'</div>';
    h+='<table class="gs"><thead><tr><th>Apelido</th><th>Nome completo</th><th>Telefone</th><th>Turno</th><th>Observação</th></tr></thead><tbody>';
    if(!ls.length)h+='<tr><td colspan="5" style="color:var(--muted)">Ninguém ainda neste setor.</td></tr>';
    ls.forEach(function(i){
      const t=TAXAS[i];
      h+='<tr>';
      h+='<td><input value="'+esc(t.apelido||'')+'" placeholder="como chamam" oninput="setTaxa('+i+',&quot;apelido&quot;,this.value)"></td>';
      h+='<td><input value="'+esc(t.nome_completo||'')+'" placeholder="nome de carteira" oninput="setTaxa('+i+',&quot;nome_completo&quot;,this.value)"></td>';
      h+='<td><input value="'+esc(t.telefone||'')+'" placeholder="(41) 90000-0000" oninput="setTaxa('+i+',&quot;telefone&quot;,this.value)"></td>';
      h+='<td><input value="'+esc(t.turno||'')+'" placeholder="dia ou noite" oninput="setTaxa('+i+',&quot;turno&quot;,this.value)"></td>';
      h+='<td><input value="'+esc(t.obs||'')+'" placeholder="—" oninput="setTaxa('+i+',&quot;obs&quot;,this.value)"></td>';
      h+='</tr>';
    });
    h+='</tbody></table>';
    h+='<div style="padding:8px 12px"><button class="mini" onclick="novaTaxa('+JSON.stringify(s)+')">+ acrescentar taxa em '+esc(s)+'</button></div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function pintaSemana(){
  let h='<div class="dias">';
  DIASEM.forEach(function(d){h+='<button class="'+((!DATASEL&&d[0]===DIASEL)?'on':'')+'" onclick="trocaDia('+d[0]+')">'+d[1]+'</button>';});
  const ds=domingos();
  ds.forEach(function(dt){h+='<button class="dom '+(DATASEL===dt?'on':'')+'" onclick="trocaDom('+JSON.stringify(dt)+')">Dom '+dBRc(dt)+'</button>';});
  if(!ds.length)h+='<span class="msg">nenhum domingo montado ainda — use o botão Gerar o mês</span>';
  h+='</div>';

  h+='<div class="barra">';
  h+='<span class="grp"><button class="mini'+(FILTRO==='tudo'?' on':'')+'" onclick="trocaFiltro(&quot;tudo&quot;)">Tudo</button>';
  h+='<button class="mini'+(FILTRO==='Dia'?' on':'')+'" onclick="trocaFiltro(&quot;Dia&quot;)">☀️ Dia</button>';
  h+='<button class="mini'+(FILTRO==='Noite'?' on':'')+'" onclick="trocaFiltro(&quot;Noite&quot;)">🌙 Noite</button></span>';
  h+='<select class="b" id="addFunc" onchange="addFunc(this.value);this.value=&quot;&quot;"><option value="">+ Acrescentar funcionário</option>';
  EQUIPE.forEach(function(p){h+='<option value="'+p.id+'">'+esc(pNome(p.nome))+' · '+esc(p.setor||'')+'</option>';});
  h+='</select>';
  h+='<button class="sv" onclick="salvaDia()">Salvar '+esc(rotulo())+'</button>';
  h+='<span class="msg" id="msgSem">mexa à vontade — só vale depois de clicar em Salvar</span>';
  h+='</div>';

  h+='<div class="barra">';
  h+='<select class="b" id="mesGerar"></select>';
  h+='<button class="b" onclick="gerarMes()">Gerar o mês inteiro</button>';
  h+='<button class="b'+(PAINEL==='folgas'?' on':'')+'" onclick="abrePainel(&quot;folgas&quot;)">Folga semanal da equipe</button>';
  h+='<button class="b'+(PAINEL==='taxas'?' on':'')+'" onclick="abrePainel(&quot;taxas&quot;)">Taxas · nome e telefone</button>';
  h+='</div>';

  if(PAINEL==='folgas'){$('semana').innerHTML=h+painelFolgas();montaMes();return;}
  if(PAINEL==='taxas'){$('semana').innerHTML=h+painelTaxas();montaMes();return;}

  h+='<div class="leg"><span><i style="background:rgba(255,0,0,.65)"></i>FOLGA</span>';
  h+='<span><i style="background:rgba(255,255,0,.75)"></i>TAXA (freelancer)</span>';
  h+='<span><i style="background:rgba(146,208,80,.75)"></i>JÁ FOLGOU</span>';
  h+='<span><i style="background:rgba(112,48,160,.85)"></i>FÉRIAS</span></div>';

  const turnos=(FILTRO==='tudo')?['Dia','Noite']:[FILTRO];
  turnos.forEach(function(t){
    const ls=linhasDoDia().filter(function(l){return l.turno===t});
    const naOp=ls.filter(function(l){return !l.marcacao}).length;
    const folg=ls.filter(function(l){return l.marcacao==='FOLGA'}).length;
    const taxa=ls.filter(function(l){return l.marcacao==='TAXA'}).length;
    h+='<div class="sec"><h2>'+(t==='Dia'?'☀️ DIA':'🌙 NOITE')+' <span class="hint">'+naOp+' na operação · '+folg+' de folga · '+taxa+' taxa</span></h2>';
    const sets=[];
    ls.forEach(function(l){if(sets.indexOf(l.setor)<0)sets.push(l.setor);});
    sets.sort(function(a,b){return (ORDSET[a]||90)-(ORDSET[b]||90)});
    if(!sets.length)h+='<div class="semdado">Ninguém neste turno em '+esc(rotulo())+'.</div>';
    sets.forEach(function(s){
      h+='<div class="bloco '+(t==='Dia'?'dia':'noite')+'"><div class="cab">'+esc(s)+' · '+t.toUpperCase()+'</div>';
      h+='<table class="gs"><thead><tr><th>Função</th><th>Funcionário</th><th>Início</th><th>Intervalo</th><th>Fim</th><th class="n">Carga</th><th>Marca</th><th></th></tr></thead><tbody>';
      ls.filter(function(l){return l.setor===s}).forEach(function(l){h+=linhaHTML(l);});
      h+='</tbody></table>';
      h+='<div style="padding:8px 12px"><button class="mini" onclick="novaLinha('+JSON.stringify(t)+','+JSON.stringify(s)+')">+ acrescentar pessoa ou taxa</button></div>';
      h+='</div>';
    });
    h+='</div>';
  });
  h+='<div class="aviso">Esta é a escala planejada. Segunda a Sábado é a base que se repete toda semana; cada domingo é próprio, porque a folga muda. Os horários vieram do cadastro e as folgas, da folga semanal. O intervalo veio em branco: o cadastro guarda só quantos minutos, não a hora — enquanto estiver vazio, a carga desconta esses minutos.</div>';
  $('semana').innerHTML=h;
  montaMes();
}

function montaMes(){
  const sel=$('mesGerar');if(!sel)return;
  const hoje=new Date();let h='';
  for(let i=0;i<4;i++){
    const d=new Date(hoje.getFullYear(),hoje.getMonth()+i,1);
    const v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const n=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    h+='<option value="'+v+'"'+(i===1?' selected':'')+'>'+esc(n)+'</option>';
  }
  sel.innerHTML=h;
}

async function gerarMes(){
  const sel=$('mesGerar');if(!sel)return;
  const mes=sel.value;
  if(!confirm('Isto monta a semana inteira e todos os domingos de '+sel.selectedOptions[0].text+' de novo, a partir do cadastro.\n\nO que você já tiver ajustado à mão nesses dias será apagado.\n\nPode gerar?'))return;
  const m=$('msgSem');if(m){m.textContent='gerando o mês…';m.style.color='var(--muted)';}
  try{
    const r=await rpcEsc('gerar_mes',{unidade:UNIDADE,mes:mes,
      quem:(function(){try{return sessionStorage.getItem('cdm_nome')||'portal'}catch(e){return 'portal'}})()});
    SEM=await rpcEsc('ler',{unidade:UNIDADE});numera();
    DATASEL=null;DIASEL=1;PAINEL='';pintaSemana();
    const m2=$('msgSem');
    if(m2){m2.textContent='mês montado · '+(r.linhas_semana||0)+' linhas na semana e '+(r.linhas_domingos||0)+' nos '+(r.domingos||0)+' domingos';m2.style.color='var(--ok)';}
  }catch(e){const m3=$('msgSem');if(m3){m3.textContent='não consegui gerar — tente de novo';m3.style.color='var(--bad)';}}
}

async function abreSemana(){
  $('semana').innerHTML='<div class="load">Abrindo a semana…</div>';
  try{
    const r=await Promise.all([rpcEsc('ler',{unidade:UNIDADE}),rpcEsc('equipe',{unidade:UNIDADE}),rpcEsc('taxas_ler',{unidade:UNIDADE})]);
    SEM=r[0];EQUIPE=r[1];TAXAS=r[2];
  }catch(e){$('semana').innerHTML='<div class="semdado">Não consegui abrir a semana. Saia e entre de novo no portal, e tente outra vez.</div>';return;}
  numera();CARREGOU=true;pintaSemana();
}

async function salvaDia(){
  const m=$('msgSem');if(m){m.textContent='salvando…';m.style.color='var(--muted)';}
  const linhas=linhasGravar().map(function(l){
    return {turno:l.turno,setor:l.setor,funcao:l.funcao,funcionario_id:l.funcionario_id,nome:l.nome,
            entrada:l.entrada,
            int_ini:semHorario(l)?null:l.int_ini,int_fim:semHorario(l)?null:l.int_fim,
            saida:l.saida,
            intervalo_min:semHorario(l)?null:l.intervalo_min,
            marcacao:l.marcacao,ordem:l.ordem,obs:l.obs};
  });
  const alvo={unidade:UNIDADE,linhas:linhas,
    quem:(function(){try{return sessionStorage.getItem('cdm_nome')||'portal'}catch(e){return 'portal'}})()};
  if(DATASEL)alvo.data=DATASEL; else alvo.dia_semana=DIASEL;
  try{
    const r=await rpcEsc('salvar_dia',alvo);
    SEM=await rpcEsc('ler',{unidade:UNIDADE});numera();pintaSemana();
    const m2=$('msgSem');
    if(m2){m2.textContent='salvo · '+((r&&r.gravadas!=null)?r.gravadas:linhas.length)+' linhas em '+rotulo();m2.style.color='var(--ok)';}
  }catch(e){
    const m3=$('msgSem');
    if(m3){m3.textContent='não consegui salvar — tente de novo';m3.style.color='var(--bad)';}
  }
}

function aba(n){
  const dom=(n==='dom');
  $('abaDom').className=dom?'on':'';
  $('abaSem').className=dom?'':'on';
  $('app').style.display=dom?'':'none';
  $('semana').style.display=dom?'none':'';
  $('ctlMes').style.display=dom?'':'none';
  if(!dom&&!CARREGOU)abreSemana();
}
/* ===== porta unica do portal: sessao por usuario ===== */
const CDMMODS=['escala-mensal'];
function cdmTok(){try{return sessionStorage.getItem('cdm_token')||''}catch(e){return ''}}
function cdmSaia(m){try{sessionStorage.setItem('cdm_aviso',m||'')}catch(e){}
  try{var w=(window.top&&window.top!==window)?window.top:window;w.location.replace('/index.html')}catch(e){location.replace('/index.html')}}
async function cdmGuarda(){
  const t=cdmTok();
  if(!t){cdmSaia('Entre no portal para acessar esta tela');return false}
  let j=null;
  try{
    const r=await fetch('https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/rpc/portal_eu',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:t})});
    if(r.ok)j=await r.json();
  }catch(e){j=null}
  if(!j||!j.usuario){cdmSaia('Entre no portal para acessar esta tela');return false}
  const ms=Array.isArray(j.modulos)?j.modulos:[];
  try{sessionStorage.setItem('cdm_nome',j.nome||'');sessionStorage.setItem('cdm_admin',j.admin?'1':'0');sessionStorage.setItem('cdm_modulos',JSON.stringify(ms))}catch(e){}
  if(!ms.some(function(m){return m&&CDMMODS.indexOf(m.id)>=0})){cdmSaia('Você não tem acesso a este módulo');return false}
  return true;
}
cdmGuarda().then(function(ok){if(ok)boot()});
</script>
