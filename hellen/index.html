  Fonte: o ponto por QR code das taxas (sistema da Hellen) — a taxa lê o QR da loja e bate pelo celular; a batida entra na hora.
  A tela se atualiza sozinha a cada 1 minuto.
</footer>

<script>
(function(){
// Banco do ponto por QR da Hellen (separado do banco do portal). A chave e a publica, a mesma que o QR usa para gravar.
const HSB = "https://dzgvawxdnjxemifeactr.supabase.co/rest/v1/";
const HKEY = "sb_publishable_to-gABecxZny25QLi0OTcQ_HK8nePyG";
// Banco do portal: login (portal_eu) e valor por hora de cada loja (hellen_valor_hora)
const SB = "https://kqvoatdprjwxyadhvtdd.supabase.co/rest/v1/";
const KEY = "sb_publishable_tp_dgwYNsZZOC3uNYTuybw_mUDNHEmV";
async function hsb(caminho, opcoes){
  const o = opcoes || {};
  const r = await fetch(HSB + caminho, {
    method: o.method || "GET",
    headers: Object.assign({ apikey: HKEY, Authorization: "Bearer " + HKEY, "Content-Type": "application/json" }, o.headers || {}),
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  if (!r.ok){
    let m = "HTTP " + r.status;
    try{ const j = await r.json(); if (j && j.message) m = j.message; }catch(e){}
    throw new Error(m);
  }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
// lista para o filtro in.(...) do banco, com aspas (o nome tem espaco)
function pgIn(lista){ return "in.(" + lista.map(v => '"' + String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"').join(",") + ")"; }

const LOJAS_ORDEM = ["Agua Verde", "Ahu", "Sao Braz"];
const NOME_EXIBICAO = { "Agua Verde": "Água Verde", "Ahu": "Ahú", "Sao Braz": "São Braz" };
// Valor por hora de cada loja: vem do banco do portal (tabela freela_valor_hora, pela porta hellen_valor_hora).
// Loja sem valor cadastrado nao e calculada — a tela avisa.
let VALOR_HORA = null, ERRO_VALOR = "";
async function carregarValores(){
  try{
    const r = await fetch(SB + "rpc/hellen_valor_hora", { method: "POST",
      headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_token: cdmTok() }) });
    let j = null; try{ j = await r.json(); }catch(e){}
    if (!r.ok || !j || j.ok === false) throw new Error((j && (j.erro || j.message)) || ("HTTP " + r.status));
    VALOR_HORA = {};
    (j.lojas || []).forEach(x => { const v = Number(x.valor_hora); if (isFinite(v) && v > 0) VALOR_HORA[x.loja] = v; });
    ERRO_VALOR = "";
  } catch(e){ VALOR_HORA = null; ERRO_VALOR = (e && e.message) ? e.message : "erro"; }
}
function valorHoraDaLoja(loja){
  return (VALOR_HORA && VALOR_HORA[loja] !== undefined) ? VALOR_HORA[loja] : null;
}
function textoValores(){
  if (!VALOR_HORA) return "⚠️ não consegui ler o valor por hora (" + escapeHtml(ERRO_VALOR) + ") — os valores em R$ não foram calculados";
  const lojas = LOJAS_ORDEM.map(l => { const v = valorHoraDaLoja(l); return NOME_EXIBICAO[l] + " " + (v !== null ? formatBRL(v) + "/h" : "sem valor por hora cadastrado"); });
  // quem tem valor proprio (ex.: Yago R$ 15,50/h + R$ 12 de VT por dia, Fabio 14/10)
  const proprios = new Map();
  PESSOAS.forEach((x, k) => {
    if (x.valor_hora == null && !Number(x.vt_dia)) return;
    const nome = nomeDe(k);
    proprios.set(nome, nome + " " + (x.valor_hora != null ? formatBRL(Number(x.valor_hora)) + "/h" : "valor da loja") + (Number(x.vt_dia) ? " + " + formatBRL(Number(x.vt_dia)) + " VT/dia" : ""));
  });
  return lojas.concat(Array.from(proprios.values())).join(" · ");
}

/* ---------- horas e dias (horario de Brasilia, -3h) ---------- */
function diaBrasilia(isoOuMs){
  const ms = typeof isoOuMs === "string" ? new Date(isoOuMs).getTime() : isoOuMs;
  const d = new Date(ms - 3 * 3600 * 1000);
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0") + "-" + String(d.getUTCDate()).padStart(2,"0");
}
// Dia de trabalho (Fabio, 14/10/2026): "os turno de um dia completo é das 08:00 as 03:00 começa num dia e termina no outro".
// Batida antes das 05:00 conta no dia anterior; o turno fica no dia em que COMECOU.
const CORTE_DIA_H = 5;
function diaOperacional(isoOuMs){
  const ms = typeof isoOuMs === "string" ? new Date(isoOuMs).getTime() : isoOuMs;
  return diaBrasilia(ms - CORTE_DIA_H * 3600 * 1000);
}
function somaDia(diaStr, n){ return diaBrasilia(inicioDiaBrasiliaMs(diaStr) + n * 86400000 + 12 * 3600 * 1000); }
function inicioDiaBrasiliaMs(diaStr){ const p = diaStr.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]) + 3 * 3600 * 1000; }
function hhmm(ms){
  const d = new Date(ms - 3 * 3600 * 1000);
  return String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0");
}
const DIAS_SEMANA = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const DIAS_LONGO = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function diaLongo(diaStr){ return DIAS_LONGO[new Date(inicioDiaBrasiliaMs(diaStr) + 12 * 3600 * 1000).getUTCDay()]; }
function rotuloDia(diaStr){
  const hoje = diaOperacional(Date.now()), ontem = somaDia(hoje, -1);
  const p = diaStr.split("-");
  const dow = DIAS_SEMANA[new Date(Date.UTC(+p[0], +p[1]-1, +p[2], 12)).getUTCDay()];
  const dm = p[2] + "/" + p[1];
  if (diaStr === hoje) return "Hoje · " + dow + " " + dm;
  if (diaStr === ontem) return "Ontem · " + dow + " " + dm;
  return dow + " " + dm;
}
function formatHoras(ms){
  const totalMin = Math.max(0, Math.round(ms / 60000));
  return Math.floor(totalMin / 60) + "h" + String(totalMin % 60).padStart(2,"0");
}
function formatBRL(v){ return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

const CICLO_REF_Y = 2026, CICLO_REF_M = 8, CICLO_REF_D = 9; // Wed 2026-09-09, ciclo 0
function diaEpochBrasilia(ms){
  const d = new Date(ms - 3 * 3600 * 1000);
  return Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 86400000);
}
function diaEpochCalendario(y, m, d){ return Math.floor(Date.UTC(y, m, d) / 86400000); }
function cicloAtual(){
  return Math.floor((diaEpochBrasilia(Date.now()) - diaEpochCalendario(CICLO_REF_Y, CICLO_REF_M, CICLO_REF_D)) / 7);
}
function inicioCicloMs(ciclo){

}
function formatDiaMes(ms){

}

/* ---------- nomes: o freela digita o nome a cada batida ---------- */
function normalizarNome(n){
  return String(n || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ");
}
function chaveBase(n){ return normalizarNome(n).replace(/[^a-z0-9]/g, ""); }
// Diferenca de ate 2 letras entre dois nomes compridos (ex.: "Arquizes" e "Arquizea") = mesma pessoa.
function quaseIgual(a, b){
  if (Math.abs(a.length - b.length) > 2) return false;
  const prev = new Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++){
    let diag = prev[0]; prev[0] = i; let menor = prev[0];
    for (let j = 1; j <= b.length; j++){
      const tmp = prev[j];
      prev[j] = Math.min(prev[j] + 1, prev[j-1] + 1, diag + (a[i-1] === b[j-1] ? 0 : 1));
      diag = tmp; if (prev[j] < menor) menor = prev[j];
    }
    if (menor > 2) return false;
  }
  return prev[b.length] <= 2;
}
// Junta as grafias da mesma pessoa na mesma loja: com/sem espaco, acento ou maiuscula ("OsbelAngelGómezReyes"),
// so o comeco do nome ("Osbel", "Julia") quando ele so cabe em UMA pessoa daquela loja, e erro de ate 2 letras em nome comprido.
// Duas pessoas diferentes que comecam igual (ex.: "Julia" e duas Julias com sobrenome) NAO sao juntadas.
// Trava: duas grafias que estavam DENTRO da loja ao mesmo tempo (uma bateu a chegada no mesmo dia, com a outra ja dentro e sem saida no meio)
// sao duas pessoas — nao junta, mesmo que o nome comece igual.
function aoMesmoTempo(grupoA, grupoB, regsPorChave){
  const evs = [];
  grupoA.forEach(k => regsPorChave.get(k).forEach(r => evs.push({ ms: r.ms, tipo: tipoDe(r.tipo), lado: "A" })));
  grupoB.forEach(k => regsPorChave.get(k).forEach(r => evs.push({ ms: r.ms, tipo: tipoDe(r.tipo), lado: "B" })));
  evs.sort((x, y) => x.ms - y.ms);
  const dentro = { A: null, B: null };
  for (const e of evs){
    const outro = e.lado === "A" ? "B" : "A";
    if (dentro[outro] !== null && e.ms - dentro[outro] > MAX_TURNO_MS) dentro[outro] = null; // esqueceu a saida
    if (e.tipo === "chegada"){
      if (dentro[outro] !== null && diaOperacional(e.ms) === diaOperacional(dentro[outro])) return true;
      dentro[e.lado] = e.ms;
    } else if (e.tipo === "saida"){
      dentro.A = null; dentro.B = null; // a saida fecha o turno, venha de qual grafia vier
    }
  }
  return false;
}
function montarApelidos(lista){
  const porLoja = new Map();
  lista.forEach(r => {
    const k = chaveBase(r.nome); if (!k) return;
    if (!porLoja.has(r.loja)) porLoja.set(r.loja, new Map());
    const m = porLoja.get(r.loja); if (!m.has(k)) m.set(k, []); m.get(k).push(r);
  });
  const mapa = new Map();
  porLoja.forEach((regsPorChave, loja) => {
    const freq = k => regsPorChave.get(k).length;
    const ks = Array.from(regsPorChave.keys()).sort((a,b) => (b.length - a.length) || (freq(a) - freq(b)) || a.localeCompare(b));
    const pai = new Map(ks.map(k => [k, k]));
    const raiz = k => { while (pai.get(k) !== k) k = pai.get(k); return k; };
    const membros = r => ks.filter(k => raiz(k) === r);
    ks.forEach(a => {
      const alvos = ks.filter(b => b !== a && b.length >= a.length && (b.startsWith(a) || (a.length >= 10 && quaseIgual(a, b))));
      if (!alvos.length) return;
      const raizes = new Set(alvos.map(raiz));
      if (raizes.size !== 1) return;
      const r = Array.from(raizes)[0], ra = raiz(a);
      if (r === ra || aoMesmoTempo(membros(ra), membros(r), regsPorChave)) return;
      pai.set(ra, r);
    });
    ks.forEach(k => mapa.set(loja + "|" + k, loja + "|" + raiz(k)));
  });
  return mapa;
}
const PALAVRAS_PEQUENAS = new Set(["de","da","do","das","dos","e"]);
function arrumarNome(n){
  return String(n || "").trim().replace(/\s+/g, " ").split(" ").map((w, i) => {
    const lw = w.toLowerCase();
    if (i > 0 && PALAVRAS_PEQUENAS.has(lw)) return lw;
    if (w === lw || w === w.toUpperCase()) return lw.charAt(0).toUpperCase() + lw.slice(1);
    return w; // nome com maiuscula no meio: deixa como a pessoa escreveu
  }).join(" ");
}
// Nome que aparece na tela: a grafia mais completa, a que mais se repetiu.
function montarNomesExibicao(lista){
  const cont = new Map();
  lista.forEach(r => {
    const raizK = r.chave.split("|")[1];
    if (chaveBase(r.nome) !== raizK) return;
    if (!cont.has(r.chave)) cont.set(r.chave, new Map());
    const m = cont.get(r.chave), n = (r.nome || "").trim();
    m.set(n, (m.get(n) || 0) + 1);
  });
  const nomes = new Map();
  cont.forEach((m, chave) => {
    let melhor = "", max = -1;
    m.forEach((c, n) => {
      const titulo = /^[A-ZÀ-Ý][a-zà-ÿ']*(\s[A-ZÀ-Ý]?[a-zà-ÿ']*)*$/.test(n) ? 1 : 0;
      const nota = c * 10 + titulo * 5 + (n.indexOf(" ") > 0 ? 1 : 0);
      if (nota > max){ max = nota; melhor = n; }
    });
    nomes.set(chave, arrumarNome(melhor));
  });
  return nomes;
}
let NOMES = new Map();
let NOMES_DIA = new Map();
function nomeDe(chave){ return NOMES.get(chave) || NOMES_DIA.get(chave) || chave.split("|")[1]; }
// Outras grafias que a pessoa usou (so as que mudam de verdade, nao maiuscula/acento)
function outrasGrafias(chave, nomesUsados){
  const base = normalizarNome(nomeDe(chave)), vistos = new Set([base]), out = [];
  nomesUsados.forEach(n => { const k = normalizarNome(n); if (k && !vistos.has(k)){ vistos.add(k); out.push(n.trim()); } });
  return out;
}

/* ---------- turnos: Chegada, intervalo e Saida de cada pessoa ---------- */
function tipoDe(t){
  if (t === "Chegada") return "chegada";
  if (t === "Inicio do intervalo") return "ini";
  if (t === "Fim do intervalo") return "fim";
  if (t === "Saida" || t === "Saída") return "saida";
  return "";
}
// Monta um turno por pessoa e por vez que ela veio. Tolerante a batida repetida (tocou duas vezes):
// 2a Chegada no mesmo dia com o turno aberto, 2o inicio de intervalo, Saida repetida em ate 10 min — tudo ignorado.
// Cada batida ganha o "dia efetivo" do turno: o dia de trabalho em que o turno COMECOU (08:00 ate 03:00 do dia seguinte;
// quem entra de tarde e sai de madrugada fica no dia em que entrou). E o mesmo dia usado na conta do pagamento.
function montarTurnos(lista){
  const ord = lista.slice().sort((a,b) => a.ms - b.ms);
  const abertos = new Map(), ultimoFechado = new Map(), out = [];
  function novo(r){
    const t = { chave: r.chave, loja: r.loja, regs: [], nomes: [], entrada: null, saida: null, ints: [], intAberto: null,
                semChegada: false, semSaida: false, inicioMs: r.ms };
    out.push(t); return t;
  }
  ord.forEach(r => {
    const tipo = tipoDe(r.tipo);
    let t = abertos.get(r.chave);
    if (tipo === "chegada"){
      if (t && diaOperacional(r.ms) === diaOperacional(t.inicioMs)){ /* chegada repetida */ }
      else { if (t) t.semSaida = true; t = novo(r); t.entrada = r.ms; abertos.set(r.chave, t); }
    } else {
      if (!t && tipo === "saida"){
        const uf = ultimoFechado.get(r.chave);
        if (uf && r.ms - uf.saida <= 10 * 60000){ uf.regs.push(r); uf.nomes.push(r.nome || ""); return; }
      }
      if (!t){ t = novo(r); t.semChegada = true; abertos.set(r.chave, t); }
      if (tipo === "ini"){ if (t.intAberto === null) t.intAberto = r.ms; }
      else if (tipo === "fim"){ if (t.intAberto !== null){ t.ints.push([t.intAberto, r.ms]); t.intAberto = null; } }
      else if (tipo === "saida"){
        // saiu sem bater a volta do intervalo: o intervalo fica sem fim e nao e descontado (igual a conta do pagamento)
        t.saida = r.ms; abertos.delete(r.chave); ultimoFechado.set(r.chave, t);
      }
    }
    t.regs.push(r); t.nomes.push(r.nome || "");
  });
  const agora = Date.now();
  out.forEach(t => {
    t.fimMs = t.regs[t.regs.length - 1].ms;
    t.diaEfetivo = diaOperacional(t.inicioMs);
    t.regs.forEach(r => { r.diaEfetivo = t.diaEfetivo; });
    if (t.saida === null && !t.semSaida && agora - t.fimMs > MAX_TURNO_MS) t.semSaida = true;
    t.aberto = t.saida === null && !t.semSaida;
  });
  return out;
}
// 14/10/2026 (Fabio): "o turno começa as 08:00 e vai ate 03:00 do outro dia ... contar a virada da meia noite como se fosse
// no mesmo dia". Quem sai e volta no mesmo dia de trabalho (ex.: Flavia 10:58-18:26 e 18:58-23:46) vira UMA linha:
// entrada da 1a parte, saida da ultima, e o tempo fora entre uma parte e outra aparece como intervalo.
// As horas sao a soma das partes, igual a conta do pagamento (que nao mudou).
function juntarDia(lista){
  const grupos = new Map(), out = [];
  lista.slice().sort((a,b) => a.inicioMs - b.inicioMs).forEach(t => {
    const k = t.chave + "|" + t.diaEfetivo;
    if (!grupos.has(k)){ grupos.set(k, [t]); out.push(k); } else grupos.get(k).push(t);
  });
  return out.map(k => {
    const ps = grupos.get(k);
    if (ps.length === 1) return ps[0];
    const a = ps[0], z = ps[ps.length - 1], ints = [];
    ps.forEach((t, i) => {
      t.ints.forEach(x => ints.push(x));
      const prox = ps[i + 1];
      if (prox && t.saida !== null && prox.entrada !== null) ints.push([t.saida, prox.entrada]);
    });
    return { chave: a.chave, loja: a.loja, partes: ps, diaEfetivo: a.diaEfetivo, inicioMs: a.inicioMs, fimMs: z.fimMs,
             regs: [].concat.apply([], ps.map(t => t.regs)), nomes: [].concat.apply([], ps.map(t => t.nomes)),
             entrada: a.entrada, saida: z.saida, ints: ints, intAberto: z.intAberto,
             semChegada: ps.some(t => t.semChegada), semSaida: ps.some(t => t.semSaida), aberto: z.aberto };
  });
}
function msTrabalhado(t){
  if (t.partes){
    let soma = 0, algum = false;
    t.partes.forEach(p => { const m = msTrabalhado(p); if (m !== null){ soma += m; algum = true; } });
    return algum ? soma : null;
  }
  if (t.entrada === null) return null;
  const agora = Date.now();
  const fim = t.saida !== null ? t.saida : (t.aberto ? agora : null);
  if (fim === null) return null;
  let pausa = 0;
  t.ints.forEach(p => { pausa += p[1] - p[0]; });
  if (t.intAberto !== null && t.aberto) pausa += agora - t.intAberto;
  return Math.max(0, fim - t.entrada - pausa);
}

/* ---------- conta do pagamento (a mesma da Hellen: batida fora de ordem e ignorada) ---------- */
function calcularPagamentos(lista){
  const porPessoa = new Map();
  const estados = new Map();
  const ordenados = lista.slice().sort((a,b) => a.ms - b.ms);
  ordenados.forEach(r => {
    const chave = r.chave;
    if (!porPessoa.has(chave)) porPessoa.set(chave, { chave: chave, nome: nomeDe(chave), loja: r.loja, ms: 0, incompletos: 0, nomes: [] });
    if (!estados.has(chave)) estados.set(chave, { status: "fechado" });
    const p = porPessoa.get(chave);
    const st = estados.get(chave);
    const t = r.ms;
    p.nomes.push(r.nome || "");
    if (r.tipo === "Chegada"){
      if (st.status === "fechado"){ st.status = "aberto"; st.inicioTurno = t; st.pausaMs = 0; }
      else if (diaOperacional(t) !== diaOperacional(st.inicioTurno)){ p.incompletos++; st.status = "aberto"; st.inicioTurno = t; st.pausaMs = 0; }
      // turno aberto no mesmo dia: batida repetida, ignora. Turno aberto em outro dia: esqueceram a saida, descarta e comeca turno novo.
    } else if (r.tipo === "Inicio do intervalo"){
      if (st.status === "aberto"){ st.status = "intervalo"; st.inicioIntervalo = t; }
    } else if (r.tipo === "Fim do intervalo"){
      if (st.status === "intervalo"){ st.pausaMs += (t - st.inicioIntervalo); st.status = "aberto"; }
    } else if (r.tipo === "Saida" || r.tipo === "Saída"){
      if (st.status === "aberto" || st.status === "intervalo"){
        const liquido = Math.max(0, (t - st.inicioTurno) - (st.pausaMs || 0));
        if (liquido > MAX_TURNO_MS){ p.incompletos++; }
        else { p.ms += liquido; }
        st.status = "fechado";
      }
    }
  });
  estados.forEach((st, chave) => {
    if (st.status !== "fechado"){ const p = porPessoa.get(chave); if (p) p.incompletos++; }
  });
  return porPessoa;
}

/* ---------- quem ja foi marcado como pago (tabela pagamentos_marcados) ---------- */

// Vale como pago se QUALQUER grafia da pessoa foi marcada (antes cada grafia era marcada separada).
function chavesPago(p){
  const ks = new Set([normalizarNome(p.nome)]);
  p.nomes.forEach(n => { const k = normalizarNome(n); if (k) ks.add(k); });
  return Array.from(ks);
}
function estaPago(p, semanaInicioStr){

}

async function desmarcarPago(p, semanaInicioStr){
  try{

      + "&loja=eq." + encodeURIComponent(p.loja) + "&semana_inicio=eq." + semanaInicioStr,

/* ---------- carga ---------- */
async function carregar(silencioso){
  if (!silencioso || !carregouUmaVez) elContent.innerHTML = '<div class="rf-load">Carregando os registros…</div>';
  btnRefresh.disabled = true;
  try{
    // as ultimas SEMANAS_LIDAS semanas (e 1 dia antes, para pegar a Chegada de quem virou a noite na troca de semana),
    // de 1000 em 1000 (o banco entrega no maximo 1000 de uma vez)
    const desde = Math.max(inicioCicloMs(cicloAtual() - SEMANAS_LIDAS) - 24 * 3600 * 1000, new Date(INICIO_USO_REAL).getTime());
    CARREGADO_DESDE = desde;
    let data = [], pag = 0;
    while (true){
      const parte = await hsb("registros_ponto?select=nome,tipo,loja,criado_em&criado_em=gte." + encodeURIComponent(new Date(desde).toISOString())
        + "&order=criado_em.asc&limit=1000&offset=" + (pag * 1000));
      data = data.concat(parte || []);
      if (!parte || parte.length < 1000) break;
      if (++pag >= 10) break;
    }
    AVISO_LIMITE = pag >= 10;
    await carregarMarcados();
    if (!silencioso || VALOR_HORA === null) await carregarValores();
    if (!silencioso || !PESSOAS.size) await carregarPessoas();
    const lista = (data || []).map(r => Object.assign({}, r, { ms: new Date(r.criado_em).getTime() }));
    const apelidos = montarApelidos(lista);
    lista.forEach(r => { r.chave = apelidos.get(r.loja + "|" + chaveBase(r.nome)) || (r.loja + "|" + chaveBase(r.nome)); });
    NOMES = montarNomesExibicao(lista);
    juntarMembros(apelidos);
    registros = lista;
    turnos = montarTurnos(lista);
    carregouUmaVez = true; erroCarga = ""; ultimaLeitura = Date.now();
    document.getElementById("atualizadoEm").textContent = "atualizado às " + hhmm(Date.now());
  } catch(e){
    erroCarga = (e && e.message) ? e.message : "Erro desconhecido.";
  } finally {
    btnRefresh.disabled = false;
  }
  render();
}

/* ---------- setor e forma de pagamento (14/10/2026, pedido do Fabio: "separar por setores o que é cozinha e o que salão",
   "a flavia e a yaimar recebem toda quarta feira, os outros recebem no dia") ---------- */
async function portaPessoa(acao, dados){
  const r = await fetch(SB + "rpc/hellen_taxa_pessoa", { method: "POST",
    headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_token: cdmTok(), p_acao: acao, p_dados: dados || {} }) });
  let j = null; try{ j = await r.json(); }catch(e){}
  if (!r.ok || !j || j.ok === false) throw new Error((j && (j.erro || j.message)) || ("HTTP " + r.status));
  return j;
}
async function carregarPessoas(){
  try{
    const j = await portaPessoa("ler");
    PESSOAS = new Map((j.pessoas || []).map(x => [x.chave, x]));
    ERRO_PESSOAS = "";
  } catch(e){ ERRO_PESSOAS = (e && e.message) ? e.message : "erro"; }
}
function juntarMembros(apelidos){
  apelidos.forEach((raiz, k) => {
    if (!MEMBROS.has(raiz)) MEMBROS.set(raiz, new Set());
    MEMBROS.get(raiz).add(k);
  });
}
function pessoaDe(chave){
  if (PESSOAS.has(chave)) return PESSOAS.get(chave);
  const ms = MEMBROS.get(chave);
  if (ms) for (const k of ms){ if (PESSOAS.has(k)) return PESSOAS.get(k); }
  return null;
}
function setorDe(chave){ const p = pessoaDe(chave); return p && p.setor ? p.setor : null; }
function pagamentoDe(chave){ const p = pessoaDe(chave); return p && p.pagamento === "semanal" ? "semanal" : "diario"; }
async function gravarPessoa(chave, campo, valor){
  const p = pessoaDe(chave) || {};
  const dados = { chave: chave, nome: nomeDe(chave),
    setor: campo === "setor" ? valor : (p.setor || ""),
    pagamento: campo === "pagamento" ? valor : (p.pagamento || "diario") };
  try{ await portaPessoa("gravar", dados); }
  catch(e){ alert("Não consegui gravar: " + e.message); }
  await carregarPessoas(); render();
}
function valorDe(t){
  const ms = msTrabalhado(t), vh = valorHoraDe(t.chave, t.loja);

}

const SETORES = [["Cozinha", "🍳 Cozinha"], ["Salão", "🍽 Salão"], [null, "❓ Sem setor — escolha na caixinha ao lado do nome"]];

/* ---------- 📊 Resumo por loja + ficha da pessoa (14/10/2026) ----------
   Fabio: "esse batidas da semana nao faz muito sentido me parece, acho que podemos fazer um resumo de qto esta gastando por loja"
   e "clicar em cima do nome e aparecer todo o historico de pagamento feito a pessoa... pense numa maneira que fique otimo". */
// Antes desta data a Hellen marcava "pago" por SEMANA para todo mundo; a partir dela, quem recebe no dia e marcado por dia.
const DATA_PAGTO_DIARIO = "2026-10-14";
function cicloDoDia(d){ const p = d.split("-"); return Math.floor((diaEpochCalendario(+p[0], +p[1] - 1, +p[2]) - diaEpochCalendario(CICLO_REF_Y, CICLO_REF_M, CICLO_REF_D)) / 7); }
function pagoNoDia(p, dia){
  if (estaPago(p, dia)) return true;
  if (dia < DATA_PAGTO_DIARIO) return estaPago(p, diaBrasilia(inicioCicloMs(cicloDoDia(dia))));
  return false;
}
function pagoSoNaSemana(p, dia){ return !estaPago(p, dia) && pagoNoDia(p, dia); }
// Horas e R$ de uma semana numa loja ("" = todas), pela mesma conta do pagamento, com setor e pessoa
function resumoDe(ciclo, loja){
  const ini = inicioCicloMs(ciclo), fim = inicioCicloMs(ciclo + 1);
  const regs = registros.filter(r => { if (!r.diaEfetivo) return false; const d = inicioDiaBrasiliaMs(r.diaEfetivo); return d >= ini && d < fim && (!loja || r.loja === loja); });
  const o = { ms: 0, valor: 0, pessoas: 0, lista: [], setor: { "Cozinha": { ms: 0, valor: 0 }, "Salão": { ms: 0, valor: 0 }, "": { ms: 0, valor: 0 } } };
  linhasPagamento(regs, ciclo === cicloAtual()).forEach(p => {
    if (!p.ms) return;
    const v = p.valor || 0;
    o.pessoas++; o.ms += p.ms; o.valor += v;
    const st = o.setor[setorDe(p.chave) || ""]; st.ms += p.ms; st.valor += v;
    o.lista.push(p);
  });
  o.lista.sort((a, b) => (b.valor || 0) - (a.valor || 0));
  return o;
}
function difTxt(agora, antes){
  const d = agora - antes;
  if (Math.abs(d) < 0.005) return '<span class="rfu">igual</span>';
  const pct = antes > 0 ? ' (' + (d > 0 ? '+' : '') + Math.round(d / antes * 100) + '%)' : '';
  return '<span class="' + (d > 0 ? 'cmp-sobe' : 'cmp-desce') + '">' + (d > 0 ? '+' : '−') + formatBRL(Math.abs(d)) + pct + '</span>';
}

    + (r.setor[""].valor ? '<span><i class="sem"></i>Sem setor ' + formatBRL(r.setor[""].valor) + '</span>' : '') + '</div>';

function ultimaBatidaDaLoja(loja){
  for (let i = registros.length - 1; i >= 0; i--) if (registros[i].loja === loja) return registros[i].ms;

}

  });

  elContent.innerHTML = h + '</div>';

/* ---------- ficha da pessoa (gaveta que abre da direita) ---------- */
let PESSOA_ABERTA = null, GV_ITENS = [];
const gaveta = document.createElement("div");
gaveta.className = "gv"; gaveta.hidden = true;
gaveta.innerHTML = '<div class="gv-fundo" data-fechar="1"></div><aside class="gv-painel" role="dialog" aria-modal="true" aria-labelledby="gvTitulo">'
  + '<button type="button" class="gv-x" data-fechar="1" aria-label="Fechar">✕</button><div id="gvConteudo"></div></aside>';
document.body.appendChild(gaveta);
function iniciais(n){ const p = String(n || "?").trim().split(/\s+/); return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); }
function historicoPessoa(chave){
  const regs = registros.filter(r => r.chave === chave && r.diaEfetivo);
  const hoje = diaOperacional(Date.now());
  const itens = [];
  if (pagamentoDe(chave) === "semanal"){
    Array.from(new Set(regs.map(r => cicloDoDia(r.diaEfetivo)))).sort((x, y) => y - x).forEach(c => {
      const rr = regs.filter(r => cicloDoDia(r.diaEfetivo) === c);
      const p = linhasPagamento(rr, c === cicloAtual())[0]; if (!p || !p.ms) return;
      const marca = diaBrasilia(inicioCicloMs(c));
      itens.push({ tipo: "semana", ciclo: c, marca: marca, p: p, pago: estaPago(p, marca), andamento: c === cicloAtual(), dias: new Set(rr.map(r => r.diaEfetivo)).size });
    });
  } else {
    Array.from(new Set(regs.map(r => r.diaEfetivo))).sort().reverse().forEach(d => {
      const rr = regs.filter(r => r.diaEfetivo === d);
      const p = linhasPagamento(rr, d === hoje)[0]; if (!p) return;
      const t = juntarDia(turnos.filter(x => x.chave === chave && x.diaEfetivo === d))[0] || null;
      const andamento = !!(t && t.aberto);
      if (!p.ms && !andamento && !p.incompletos) return;
      itens.push({ tipo: "dia", dia: d, marca: d, p: p, t: t, pago: pagoNoDia(p, d), soSemana: pagoSoNaSemana(p, d), andamento: andamento, dias: 1 });
    });
  }
  return itens;
}
function desenharGaveta(){
  const chave = PESSOA_ABERTA; if (!chave) return;
  const itens = historicoPessoa(chave); GV_ITENS = itens;

  // grafico: quanto recebeu por semana

  document.getElementById("gvConteudo").innerHTML = h;
}

/* ---------- 🔴 Ponto ao vivo ---------- */
function barraDias(dia, hoje){
  const min = diaBrasilia(new Date(INICIO_USO_REAL).getTime());
  return '<div class="barra">Dia: <button class="loja" data-dia-nav="-1" type="button" aria-label="dia anterior"' + (dia <= min ? ' disabled' : '') + '>‹</button>'
    + '<input class="loja" type="date" id="diaSel" value="' + dia + '" min="' + min + '" max="' + hoje + '" aria-label="escolher o dia">'
    + '<button class="loja" data-dia-nav="1" type="button" aria-label="dia seguinte"' + (dia >= hoje ? ' disabled' : '') + '>›</button>'
    + '<span class="diasem">' + diaLongo(dia) + '</span>'
    + '<button class="loja' + (dia === hoje ? ' active' : '') + '" data-dia-hoje="1" type="button">Hoje</button>'
    + '<span class="periodo">' + rotuloDia(dia) + ' · o dia vai das 08:00 às 03:00 do dia seguinte (batida antes das 05:00 conta no dia anterior)</span></div>';
}
function irParaDia(d){
  const hoje = diaOperacional(Date.now()), min = diaBrasilia(new Date(INICIO_USO_REAL).getTime());
  if (!d || d >= hoje) d = null; else if (d < min) d = min;
  const voltouPraHoje = DIA !== null && d === null;
  DIA = d;
  if (voltouPraHoje){ carregar(true); return; }
  // dia mais antigo que o que ja foi lido: le so a janela dele (vespera ate o dia seguinte), uma vez, sem mexer no resto
  if (DIA && CARREGADO_DESDE !== null && inicioDiaBrasiliaMs(DIA) - 24 * 3600 * 1000 < CARREGADO_DESDE && !(DIA_DADOS && DIA_DADOS.dia === DIA)) carregarDia(DIA);
  else render();
}
async function carregarDia(dia){
  if (DIA_CARREGANDO === dia) return;
  DIA_CARREGANDO = dia;
  elContent.innerHTML = '<div class="rf-load">Carregando o dia…</div>';
  try{
    const de = new Date(Math.max(inicioDiaBrasiliaMs(dia) - 24 * 3600 * 1000, new Date(INICIO_USO_REAL).getTime())).toISOString();
    const ate = new Date(inicioDiaBrasiliaMs(dia) + 48 * 3600 * 1000).toISOString();
    const data = await hsb("registros_ponto?select=nome,tipo,loja,criado_em&criado_em=gte." + encodeURIComponent(de)
      + "&criado_em=lt." + encodeURIComponent(ate) + "&order=criado_em.asc&limit=1000");
    const lista = (data || []).map(r => Object.assign({}, r, { ms: new Date(r.criado_em).getTime() }));
    const apelidos = montarApelidos(lista);
    lista.forEach(r => { r.chave = apelidos.get(r.loja + "|" + chaveBase(r.nome)) || (r.loja + "|" + chaveBase(r.nome)); });
    NOMES_DIA = montarNomesExibicao(lista);
    juntarMembros(apelidos);
    DIA_DADOS = { dia: dia, turnos: montarTurnos(lista) };
  } catch(e){
    DIA_DADOS = { dia: dia, erro: (e && e.message) ? e.message : "erro" };
  }
  DIA_CARREGANDO = null;
  render();
}
function renderVivo(){
  const hoje = diaOperacional(Date.now());
  if (DIA && DIA >= hoje) DIA = null;
  if (DIA){ renderDia(DIA, hoje); return; }
  const g = juntarDia(turnos.filter(t => (!lojaAtiva || t.loja === lojaAtiva) && (t.aberto || t.diaEfetivo === hoje)));
  g.sort((a,b) => {
    if (a.aberto !== b.aberto) return a.aberto ? -1 : 1;
    if (a.aberto) return (a.entrada || a.inicioMs) - (b.entrada || b.inicioMs);
    return b.fimMs - a.fimMs;
  });
  const naLoja = g.filter(t => t.aberto && t.intAberto === null).length;
  const noInt = g.filter(t => t.aberto && t.intAberto !== null).length;
  const saiu = g.filter(t => !t.aberto).length;
  const daLoja = registros.filter(r => !lojaAtiva || r.loja === lojaAtiva);
  const ult = daLoja.length ? daLoja[daLoja.length - 1] : null;

  let h = '<div class="rf-h2">🔴 Ponto ao vivo <span class="hint">quem bateu o ponto pelo QR hoje e quem ainda está na loja</span></div>';
  h += '<div class="rf-card">' + barraLojas() + barraDias(hoje, hoje);
  h += '<div class="rf-aviso">' + (ult
      ? 'Última batida: <b>' + hhmm(ult.ms) + '</b>' + (diaBrasilia(ult.ms) !== hoje ? ' de ' + formatDiaMes(ult.ms) : '') + ' — ' + escapeHtml(nomeDe(ult.chave)) + ' (' + escapeHtml(NOME_EXIBICAO[ult.loja] || ult.loja) + ', ' + escapeHtml(ult.tipo) + '). A batida entra na hora em que a taxa lê o QR; a tela se atualiza sozinha a cada 1 minuto.'
      : '⚠️ Nenhuma batida pelo QR ainda nesta loja.') + '</div>';
  h += '<div class="rf-aviso"><b>' + naLoja + '</b> na loja agora · <b>' + noInt + '</b> no intervalo · <b>' + saiu + '</b> já saíram</div>';
  if (!g.length){
    elContent.innerHTML = h + '<div class="rf-empty">Nenhuma taxa bateu ponto hoje' + (lojaAtiva ? ' nesta loja' : '') + '.</div></div>';
    return;
  }
  h += tabelaTurnos(g);
  h += '<div class="rf-nota">Hoje = o dia de trabalho de hoje, das 08:00 às 03:00 do dia seguinte (quem entra de tarde e sai de madrugada fica no dia em que entrou), e todo mundo que ainda está na loja. '
     + 'O nome é digitado pela taxa a cada batida: grafias diferentes da mesma pessoa (com ou sem acento, espaço, sobrenome) são juntadas numa linha só e aparecem em "digitou também".</div>';
  elContent.innerHTML = h + '</div>';
}

/* ---------- 📅 Ponto de um dia escolhido no botao dos dias ---------- */
function renderDia(dia, hoje){
  if (DIA_CARREGANDO === dia){ elContent.innerHTML = '<div class="rf-load">Carregando o dia…</div>'; return; }
  const deFora = DIA_DADOS && DIA_DADOS.dia === dia;
  if (deFora && DIA_DADOS.erro){
    elContent.innerHTML = '<div class="rf-card">' + barraLojas() + barraDias(dia, hoje) + '<div class="err">Não consegui ler este dia: ' + escapeHtml(DIA_DADOS.erro)
      + '<br><button class="btn" data-dia-ler="' + dia + '" type="button">Tentar de novo</button></div></div>';
    return;
  }
  // dia que saiu da janela normal (ex.: virada da semana) e ainda nao foi lido a parte: le agora
  if (!deFora && CARREGADO_DESDE !== null && inicioDiaBrasiliaMs(dia) - 24 * 3600 * 1000 < CARREGADO_DESDE){ carregarDia(dia); return; }
  const base = deFora ? DIA_DADOS.turnos : turnos;
  const g = juntarDia(base.filter(t => (!lojaAtiva || t.loja === lojaAtiva) && t.diaEfetivo === dia))
    .sort((a,b) => (a.entrada || a.inicioMs) - (b.entrada || b.inicioMs));
  let tot = 0; g.forEach(t => { tot += msTrabalhado(t) || 0; });
  const nPes = new Set(g.map(t => t.chave)).size;
  let h = '<div class="rf-h2">📅 Ponto do dia <span class="hint">quem bateu o ponto pelo QR no dia escolhido</span></div>';
  h += '<div class="rf-card">' + barraLojas() + barraDias(dia, hoje);
  h += '<div class="rf-aviso"><b>' + nPes + '</b> ' + (nPes === 1 ? 'taxa trabalhou' : 'taxas trabalharam') + ' · <b>' + formatHoras(tot) + '</b> no total</div>';
  if (!g.length){
    elContent.innerHTML = h + '<div class="rf-empty">Nenhuma taxa bateu ponto neste dia' + (lojaAtiva ? ' nesta loja' : '') + '.</div></div>';
    return;
  }
  h += tabelaTurnos(g);
  h += '<div class="rf-nota">O dia vai das 08:00 às 03:00 do dia seguinte: quem entra de tarde e sai de madrugada fica no dia em que entrou (a saída aparece com a data dela). Batida antes das 05:00 conta no dia anterior.</div>';
  elContent.innerHTML = h + '</div>';
}

/* ---------- 💰 Pagamento ---------- */
// 14/10/2026 (Fabio): "a flavia e a yaimar recebem toda quarta feira, os outros recebem no dia".
// Quem recebe no dia: lista do dia escolhido, marcado como pago no proprio dia (semana_inicio = o dia).
// Quem recebe toda quarta: a semana de quarta a terca, paga na quarta seguinte (semana_inicio = a quarta que abre a semana).
// Quem recebe como e gravado em taxa_pessoa (caixinha "Como recebe" no fim desta tela).
let PAY_LINHAS = { dia: [], sem: [] }, PAY_MARCA = { dia: "", sem: "" };
function linhasPagamento(regs, ehAgora){
  const linhas = Array.from(calcularPagamentos(regs).values()).sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR"));
  linhas.forEach(p => {
    const vh = valorHoraDe(p.chave, p.loja);
    p.vt = p.ms > 0 ? vtDe(p.chave) * diasDe(regs, p.chave) : 0;
    p.valor = vh === null ? null : (p.ms / 3600000) * vh + p.vt;
    // quem esta na loja agora tem o turno aberto: nao e batida incompleta, so ainda nao bateu a saida
    p.naLoja = ehAgora && turnos.some(t => t.chave === p.chave && t.aberto);
    if (p.naLoja && p.incompletos > 0) p.incompletos--;
  });
  return linhas;
}
function tabelaPagamento(linhas, grupo, marca){
  PAY_LINHAS[grupo] = linhas; PAY_MARCA[grupo] = marca;
  if (!linhas.length) return '<div class="rf-empty">Ninguém para pagar aqui' + (lojaAtiva ? ' nesta loja' : '') + '.</div>';
  let h = '<div class="pv-wrap"><table class="pv-tb"><thead><tr><th>Taxa</th>' + (lojaAtiva ? '' : '<th>Loja</th>') + '<th>Setor</th><th class="n">Horas</th><th class="n">Valor</th><th class="n">Pago?</th></tr></thead><tbody>';
  const tot = { "Cozinha": 0, "Salão": 0, "": 0 };
  let totalMs = 0, totalValor = 0, semValor = 0, inc = 0;
  linhas.forEach((p, i) => {
    const pago = grupo === "dia" ? pagoNoDia(p, marca) : estaPago(p, marca);
    const soSemana = grupo === "dia" && pagoSoNaSemana(p, marca);
    const og = outrasGrafias(p.chave, p.nomes);
    const st = setorDe(p.chave);
    totalMs += p.ms; inc += p.incompletos;
    if (p.valor === null) semValor++; else { totalValor += p.valor; tot[st || ""] += p.valor; }
    h += '<tr class="' + (pago ? 'pv-ok' : '') + '" data-cdm-chave="' + escapeHtml('pagamento | ' + p.chave + ' | ' + marca) + '"><td class="pv-nome">' + botaoPessoa(p.chave, p.nome) + (p.incompletos ? ' <span class="rfx">⚠️ batida incompleta</span>' : '')
      + (p.naLoja ? ' <span class="rfu">🟢 na loja agora — o turno de hoje entra quando bater a saída</span>' : '')
      + (og.length ? '<div class="apelido">digitou também: ' + og.map(escapeHtml).join(", ") + '</div>' : '') + '</td>'
      + (lojaAtiva ? '' : '<td>' + escapeHtml(NOME_EXIBICAO[p.loja] || p.loja) + '</td>')
      + '<td>' + (st ? escapeHtml(st) : caixaSetor(p.chave)) + '</td>'
      + '<td class="n pv-h">' + formatHoras(p.ms) + '</td>'
      + '<td class="n pv-valor">' + (p.valor === null ? '<span class="rfx">sem valor por hora</span>' : formatBRL(p.valor) + (p.vt ? '<div class="rfu">com ' + formatBRL(p.vt) + ' de VT</div>' : '')) + '</td>'
      + '<td class="n">' + (soSemana ? '<span class="pill ok">✓ pago na semana</span>' : pago
          ? '<button type="button" class="pay-pago" data-g="' + grupo + '" data-i="' + i + '">✓ Pago <span class="desfazer">(desfazer)</span></button>'
          : '<button type="button" class="pay-marcar" data-g="' + grupo + '" data-i="' + i + '">Marcar como pago</button>') + '</td></tr>';
  });
  const cols = lojaAtiva ? 2 : 3;
  if (tot["Cozinha"] && (tot["Salão"] || tot[""])) h += '<tr><td colspan="' + (cols + 1) + '" class="rfu">🍳 Cozinha</td><td class="n pv-valor">' + formatBRL(tot["Cozinha"]) + '</td><td></td></tr>';
  if (tot["Salão"] && (tot["Cozinha"] || tot[""])) h += '<tr><td colspan="' + (cols + 1) + '" class="rfu">🍽 Salão</td><td class="n pv-valor">' + formatBRL(tot["Salão"]) + '</td><td></td></tr>';
  h += '<tr class="pv-tot"><td colspan="' + cols + '">Total</td><td class="n pv-h">' + formatHoras(totalMs) + '</td><td class="n pv-valor">' + (semValor === linhas.length ? '—' : formatBRL(totalValor)) + '</td><td></td></tr>';
  h += '</tbody></table></div>';
  if (semValor > 0) h += '<div class="rf-nota">⚠️ ' + semValor + (semValor === 1 ? ' pessoa ficou' : ' pessoas ficaram') + ' sem valor em R$ porque a loja não tem valor por hora cadastrado — não entrou no total.</div>';
  if (inc > 0) h += '<div class="rf-nota">⚠️ batida incompleta = não bateu a entrada ou a saída — essas horas não entraram na conta. Confira no 🔴 Ponto ao vivo, escolhendo o dia.</div>';
  return h;
}

    h += '<tr><td class="pv-nome">' + botaoPessoa(k) + '</td>' + (lojaAtiva ? '' : '<td>' + escapeHtml(NOME_EXIBICAO[vistos.get(k)] || vistos.get(k)) + '</td>')
      + '<td><select class="loja set-setor" data-chave="' + ck + '" aria-label="setor"><option value=""' + (st ? '' : ' selected') + '>sem setor</option><option' + (st === "Cozinha" ? ' selected' : '') + '>Cozinha</option><option' + (st === "Salão" ? ' selected' : '') + '>Salão</option></select></td>'
      + '<td><select class="loja set-pag" data-chave="' + ck + '" aria-label="como recebe"><option value="diario"' + (pg === "diario" ? ' selected' : '') + '>no dia</option><option value="semanal"' + (pg === "semanal" ? ' selected' : '') + '>toda quarta</option></select></td></tr>';
  });
  return h + '</tbody></table></div>';
}
function renderPagamento(){
  const hoje = diaOperacional(Date.now());
  const dia = PAY_DIA || hoje;
  if (semanaPay < semanaMin()) semanaPay = semanaMin();
  const ciclo = cicloAtual() + semanaPay;
  const ini = inicioCicloMs(ciclo), fim = inicioCicloMs(ciclo + 1);
  const semanaInicioStr = diaBrasilia(ini);
  const daLoja = registros.filter(r => !lojaAtiva || r.loja === lojaAtiva);
  const regsDia = daLoja.filter(r => r.diaEfetivo === dia && pagamentoDe(r.chave) !== "semanal");
  const regsSem = daLoja.filter(r => { const d = r.diaEfetivo ? inicioDiaBrasiliaMs(r.diaEfetivo) : r.ms; return d >= ini && d < fim && pagamentoDe(r.chave) === "semanal"; });

  let h = '<div class="rf-h2">💰 Pagamento <span class="hint">' + textoValores() + '</span></div>';
  h += '<div class="rf-card">' + barraLojas();
  h += '<div class="rf-h3">💵 Recebem no dia <span class="hint">todo mundo, menos quem recebe toda quarta</span></div>';
  h += barraDiaPay(dia, hoje);
  h += tabelaPagamento(linhasPagamento(regsDia, dia === hoje), "dia", dia);
  h += '<div class="rf-h3">📅 Recebem toda quarta <span class="hint">semana de quarta a terça · paga na quarta ' + formatDiaMes(fim) + '</span></div>';
  h += '<div class="barra">' + barraSemana(semanaPay, "data-semana-pay") + '</div>';
  h += tabelaPagamento(linhasPagamento(regsSem, semanaPay === 0), "sem", semanaInicioStr);
  h += painelComoRecebe();
  h += '<div class="rf-nota">O turno conta no dia em que começou (o dia vai das 08:00 às 03:00): quem entra na terça e sai na quarta de madrugada conta na terça.</div>';
  h += '<div class="rf-nota">A mesma pessoa digitada de jeitos diferentes conta numa linha só. Se uma grafia antiga já tinha sido marcada como paga, a pessoa aparece como paga.</div>';
  elContent.innerHTML = h + '</div>';
  elContent.querySelectorAll(".pay-marcar").forEach(b => b.addEventListener("click", () => { b.disabled = true; marcarComoPago(PAY_LINHAS[b.dataset.g][+b.dataset.i], PAY_MARCA[b.dataset.g]); }));
  elContent.querySelectorAll(".pay-pago").forEach(b => b.addEventListener("click", () => { b.disabled = true; desmarcarPago(PAY_LINHAS[b.dataset.g][+b.dataset.i], PAY_MARCA[b.dataset.g]); }));
}

/* ---------- 🔳 QR da semana (mesma formula do index.html: muda toda quarta sozinho) ---------- */
const CODIGO_SECRET = "CDMBurgersArts-ponto-2026";
const CHAVE_LOJA = { "Agua Verde": "aguaverde", "Ahu": "ahu", "Sao Braz": "saobraz" };
function fnv1a(str){
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, "0");
}
function codigoDoCiclo(ciclo){ return fnv1a(CODIGO_SECRET + ":" + ciclo).slice(0, 8); }
// o QR aponta para a pagina de bater ponto no endereco do Cidadao do Mundo (taxa/index.html, copia da pagina da Hellen,
// grava no mesmo banco). 14/10/2026, Fabio: "esta mandando um link do portal dela, quero que mande do cidadao do mundo".
const PAGINA_QR = "https://cidadaodomundo.github.io/taxa/";
function linkDaLoja(loja, codigo){ return PAGINA_QR + "?loja=" + CHAVE_LOJA[loja] + "&codigo=" + codigo; }
// 14/10/2026 (Fabio): "os qr codes tem que ter links faceis de enviar e um botao imprimir agora".
// Cada loja: Enviar no WhatsApp (mensagem pronta), Copiar link, Imprimir agora. No topo: os 3 de uma vez.
// O link continua sendo o da semana (muda toda quarta): link fixo deixaria bater ponto de casa.
function periodoQR(){ const c = cicloAtual(); return formatDiaMes(inicioCicloMs(c)) + " a " + formatDiaMes(inicioCicloMs(c + 1) - 1); }
function mensagemQR(lojas){
  const codigo = codigoDoCiclo(cicloAtual());
  let m = "Ponto das taxas · Cidadão do Mundo\nSemana de " + periodoQR() + " (o link muda toda quarta)\n";
  lojas.forEach(loja => { m += "\n" + (NOME_EXIBICAO[loja] || loja) + ": " + linkDaLoja(loja, codigo); });
  return m + "\n\nAbra o link da sua loja na chegada, no intervalo e na saída.";
}
function linkZap(texto){ return "https://wa.me/?text=" + encodeURIComponent(texto); }
async function copiarTexto(btn, texto){
  const original = btn.textContent;
  try{ await navigator.clipboard.writeText(texto); btn.textContent = "✓ Copiado!"; }
  catch(e){ window.prompt("Copie o texto abaixo:", texto); }
  setTimeout(() => { btn.textContent = original; }, 2000);
}
function renderQR(){
  const ciclo = cicloAtual(), codigo = codigoDoCiclo(ciclo);
  let h = '<div class="rf-h2">🔳 QR code da semana <span class="hint">vale de ' + periodoQR() + ' · muda sozinho toda quarta-feira</span></div>';
  h += '<div class="rf-card"><div class="barra">'
    + '<button id="btnImprimirQR" class="btn" type="button">🖨 Imprimir os 3 agora</button>'
    + '<a class="btn btn-zap" href="' + escapeHtml(linkZap(mensagemQR(LOJAS_ORDEM))) + '" target="_blank" rel="noopener">📲 Enviar os 3 no WhatsApp</a>'
    + '<button class="btn qr-copiar-msg" type="button" data-lojas="' + LOJAS_ORDEM.join(",") + '">📋 Copiar mensagem dos 3</button>'
    + '</div><div class="qr-grade">';
  LOJAS_ORDEM.forEach(loja => {
    const link = linkDaLoja(loja, codigo), nomeLoja = NOME_EXIBICAO[loja] || loja;
    h += '<div class="qr-loja"><span class="qr-nome">' + nomeLoja + '</span>'
      + '<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(link) + '" alt="QR code ' + nomeLoja + '" loading="lazy">'
      + '<div class="qr-botoes">'
      + '<a class="btn btn-zap" href="' + escapeHtml(linkZap(mensagemQR([loja]))) + '" target="_blank" rel="noopener">📲 Enviar no WhatsApp</a>'
      + '<button class="btn qr-imprimir" type="button" data-loja="' + loja + '">🖨 Imprimir agora</button>'
      + '<button class="btn qr-copiar" type="button" data-link="' + escapeHtml(link) + '">Copiar link</button>'
      + '</div><span class="qr-link">' + escapeHtml(link) + '</span></div>';
  });
  elContent.innerHTML = h + '</div></div>';
  elContent.querySelectorAll(".qr-copiar").forEach(btn => btn.addEventListener("click", () => copiarTexto(btn, btn.dataset.link)));
  elContent.querySelectorAll(".qr-copiar-msg").forEach(btn => btn.addEventListener("click", () => copiarTexto(btn, mensagemQR(btn.dataset.lojas.split(",")))));
  elContent.querySelectorAll(".qr-imprimir").forEach(btn => btn.addEventListener("click", () => imprimirTodos([btn.dataset.loja])));
  document.getElementById("btnImprimirQR").addEventListener("click", () => imprimirTodos(LOJAS_ORDEM));
}
// Abre uma janela so com os QR codes pedidos, grandes, um por pagina, e chama a impressao sozinha.
function imprimirTodos(lojas){
  const ciclo = cicloAtual(), codigo = codigoDoCiclo(ciclo);
  const periodo = "Vale de " + periodoQR();
  let paginas = "";
  (lojas || LOJAS_ORDEM).forEach(loja => {
    const link = linkDaLoja(loja, codigo), nomeLoja = NOME_EXIBICAO[loja] || loja;
    paginas += '<div class="pagina"><h1>' + escapeHtml(nomeLoja) + '</h1>'
      + '<p>' + escapeHtml(periodo) + ' — aponte a câmera do celular para bater o ponto</p>'
      + '<img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=' + encodeURIComponent(link) + '" alt="QR code ' + escapeHtml(nomeLoja) + '"></div>';
  });
  const conteudo = '<!doc' + 'type html><html lang="pt-br"><head><meta charset="UTF-8"><title>QR codes - Cidadão do Mundo</title><style>'
    + 'body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;color:#152622;}'
    + '.pagina{page-break-after:always;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;box-sizing:border-box;}'
    + '.pagina:last-child{page-break-after:auto;}h1{font-size:32px;margin:0 0 8px;}p{color:#555;margin:0 0 24px;font-size:16px;}img{width:320px;height:320px;}'
    + '</style></head><body>' + paginas
    + '<script>window.addEventListener("load", function(){ setTimeout(function(){ window.print(); }, 300); });<\/script></body></' + 'html>';
  const janela = window.open("", "_blank");
  if (!janela){ alert("O navegador bloqueou a janela de impressão. Permita pop-ups para este site e tente de novo."); return; }
  janela.document.write(conteudo);
  janela.document.close();
}

/* ---------- troca de tela ---------- */
let LIBERADO = false;
function render(){
  if (!LIBERADO) return;
  document.querySelectorAll(".view").forEach(b => b.classList.toggle("active", b.dataset.view === VIEW));
  if (VIEW === "qr"){ renderQR(); return; }
  if (!carregouUmaVez && erroCarga){
    elContent.innerHTML = '<div class="err">Não consegui carregar os registros agora.<br>' + escapeHtml(erroCarga) + '<br><button class="btn" id="btnTentarDeNovo" type="button">Tentar de novo</button></div>';
    document.getElementById("btnTentarDeNovo").addEventListener("click", () => carregar(false));
    return;
  }
  if (!carregouUmaVez) return;
  if (VIEW === "semana") renderResumo();
  else if (VIEW === "pagamento") renderPagamento();
  else renderVivo();
  if (PESSOA_ABERTA) desenharGaveta();
  if (AVISO_LIMITE) elContent.insertAdjacentHTML("afterbegin", '<div class="err">⚠️ Vieram 10.000 batidas, o máximo que esta tela lê: pode estar incompleta.</div>');
  if (erroCarga) elContent.insertAdjacentHTML("afterbegin", '<div class="err">⚠️ A última atualização falhou (' + escapeHtml(erroCarga) + '). Mostrando a leitura das ' + hhmm(ultimaLeitura) + '.</div>');
}
document.querySelectorAll(".view").forEach(b => b.addEventListener("click", () => {
  VIEW = b.dataset.view;
  try{ history.replaceState(null, "", "#" + VIEW); } catch(e){}
  render();
}));
elContent.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-loja")){ lojaAtiva = b.getAttribute("data-loja"); nomeAtivo = ""; render(); }
  else if (b.hasAttribute("data-semana-lista")){ semanaLista = +b.getAttribute("data-semana-lista"); render(); }
  else if (b.hasAttribute("data-semana-pay")){ semanaPay = +b.getAttribute("data-semana-pay"); render(); }
  else if (b.hasAttribute("data-paydia-nav")){
    const hoje = diaOperacional(Date.now()), min = diaBrasilia(new Date(INICIO_USO_REAL).getTime());
    const d = somaDia(PAY_DIA || hoje, +b.getAttribute("data-paydia-nav"));
    PAY_DIA = d >= hoje ? null : (d < min ? min : d); render();
  }
  else if (b.hasAttribute("data-paydia-hoje")){ PAY_DIA = null; render(); }
  else if (b.hasAttribute("data-dia-nav")){ const hoje = diaOperacional(Date.now()); irParaDia(somaDia(DIA || hoje, +b.getAttribute("data-dia-nav"))); }
  else if (b.hasAttribute("data-dia-hoje")){ irParaDia(null); }
  else if (b.hasAttribute("data-dia-ler")){ DIA_DADOS = null; carregarDia(b.getAttribute("data-dia-ler")); }
});
btnRefresh.addEventListener("click", () => carregar(false));
elContent.addEventListener("change", e => {
  const el = e.target; if (!el) return;
  if (el.id === "diaSel") irParaDia(el.value);
  else if (el.classList.contains("set-setor")){ el.disabled = true; gravarPessoa(el.dataset.chave, "setor", el.value); }
  else if (el.classList.contains("set-pag")){ el.disabled = true; gravarPessoa(el.dataset.chave, "pagamento", el.value); }
});

/* ---------- porta unica do portal ---------- */
const CDMMODS = ["hellen"];
function cdmTok(){ try{ return sessionStorage.getItem("cdm_token") || ""; }catch(e){ return ""; } }
function cdmSaia(m){
  try{ sessionStorage.setItem("cdm_aviso", m || ""); }catch(e){}
  try{ var w = (window.top && window.top !== window) ? window.top : window; w.location.replace("/index.html"); }catch(e){ location.replace("/index.html"); }
}
async function cdmGuarda(){
  const t = cdmTok();
  if (!t){ cdmSaia("Entre no portal para acessar esta tela"); return false; }
  let j = null;
  try{
    const r = await fetch(SB + "rpc/portal_eu", { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_token: t, p_tela: "hellen" }) });
    if (r.ok) j = await r.json();
  }catch(e){ j = null; }
  if (!j || !j.usuario){ cdmSaia("Entre no portal para acessar esta tela"); return false; }
  try{ sessionStorage.setItem("cdm_admin", j.admin ? "1" : "0"); }catch(e){}
  const ms = Array.isArray(j.modulos) ? j.modulos : [];
  if (!ms.some(m => m && CDMMODS.indexOf(m.id) >= 0)){ cdmSaia("Você não tem acesso a este módulo"); return false; }
  return true;
}

atualizarRelogioTopo();
elContent.innerHTML = '<div class="rf-load">Conferindo o acesso…</div>';
let TIMER = null, TIMER_REL = null;
cdmGuarda().then(ok => {
  if (!ok) return;
  LIBERADO = true;
  render();
  carregar(false);
  // le de novo a cada 60 s, so com a tela aberta e visivel; os dois timers sao desligados ao sair da tela (pagehide)
  TIMER = setInterval(() => { if (!document.hidden && VIEW !== "qr" && !(VIEW === "vivo" && DIA)) carregar(true); }, 60000);
  TIMER_REL = setInterval(atualizarRelogioTopo, 60000);
});
window.addEventListener("pagehide", () => { if (TIMER) clearInterval(TIMER); if (TIMER_REL) clearInterval(TIMER_REL); });
})();
